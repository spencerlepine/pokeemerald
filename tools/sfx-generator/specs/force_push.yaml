name: force_push
constant: SE_FORCE_PUSH
brief: "Force push: low air-pressure thump and rush. FORCE PUSH (Move_PSYCHIC) push beat."
seed: 74
layers:
  # A wall of air: a soft, deep pressure thump (driven sine falling into the sub), then a rush of wind
  # (band-passed noise sweeping up and away), with a faint cold sine glint riding the front.
  - type: pcm
    osc: sine
    pitch: [[0, 85], [0.3, 32]]
    env: [[0, 0], [0.02, 1], [0.12, 0.6], [0.4, 0]]
    drive: 2.0
    gain: 1.0
  - type: pcm
    at: 0.03
    osc: noise
    filter: {type: bp, cutoff: [[0, 250], [0.2, 1400], [0.65, 450]], q: 1.4, stages: 2}
    env: [[0, 0], [0.12, 1], [0.35, 0.6], [0.67, 0]]
    gain: 0.75
  - type: pcm
    at: 0.02
    osc: sine
    unison: [-8, 8]
    pitch: [[0, 523], [0.3, 659]]
    env: [[0, 0], [0.05, 0.3], [0.3, 0]]
    gain: 0.15
