name: pod
replaces: SE_BALL
constant: SE_POD
brief: "Capture pod click / handing pods to the nurse droid: mechanical latch."
seed: 21
layers:
  # A two-stage latch: a bright tick as the catch slips, then a lower metallic snap as it seats
  # (band-passed noise clicks over a short inharmonic FM ring).
  - type: pcm
    osc: noise
    filter: {type: bp, cutoff: 3200, q: 3}
    env: [[0, 0], [0.001, 1], [0.012, 0]]
    gain: 0.6
  - type: pcm
    at: 0.045
    osc: noise
    filter: {type: bp, cutoff: 1800, q: 2.5}
    env: [[0, 0], [0.001, 1], [0.02, 0]]
    gain: 0.8
  - type: pcm
    at: 0.045
    osc: sine
    pitch: 1240
    fm: {ratio: 2.76, index: [[0, 1.2], [0.06, 0.3]]}
    env: [[0, 0], [0.002, 1], [0.025, 0.35], [0.07, 0]]
    gain: 0.55
