name: pod_tray_pod
replaces: SE_BALL_TRAY_BALL
constant: SE_POD_TRAY_POD
brief: "Each pod lands in the tray: small click."
seed: 24
layers:
  # A small seating click: a sharp band-passed tick and a brief high metal ping.
  - type: pcm
    osc: noise
    filter: {type: bp, cutoff: 2600, q: 3}
    env: [[0, 0], [0.001, 1], [0.015, 0]]
    gain: 0.8
  - type: pcm
    osc: sine
    pitch: 2100
    fm: {ratio: 2.4, index: [[0, 0.8], [0.08, 0.1]]}
    env: [[0, 0], [0.002, 0.7], [0.08, 0]]
    gain: 0.4
