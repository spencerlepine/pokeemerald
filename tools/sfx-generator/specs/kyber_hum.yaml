  # non-integer ratio beating slowly against it, and a low wave-channel hum underneath.
  - type: pcm
    osc: sine
    unison: [-4, 5]
    pitch: 660
    vibrato: {rate: 4.5, depth: 0.06}
    fm: {ratio: 3.01, index: [[0, 0.1], [1.4, 0.6], [3.0, 0.1]]}
    am: {rate: 2.2, depth: 0.2}
    env: [[0, 0], [0.6, 0.8], [1.6, 1], [3.0, 0]]
    gain: 0.7
  - type: pcm
    osc: sine
    pitch: 1823
    am: {rate: 5.5, depth: 0.5}
    env: [[0, 0], [0.9, 0.5], [2.0, 0.4], [2.95, 0]]
    gain: 0.25
  - type: wave
    table: tri
    pitch: 165
    env: [[0, 0], [0.4, 0.5], [2.5, 0.5], [3.0, 0]]
    gain: 0.25
