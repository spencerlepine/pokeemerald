name: detonator_beep
constant: SE_DETONATOR_BEEP
brief: "Thermal detonator arming beep: one short high beep, played 5 times accelerating. DETONATE (Explosion) and SELF-DESTRUCT arm beat."
seed: 66
layers:
  # One arming beep (the call site repeats it): a hard-edged 50 % square at E7 with a hint of a lower
  # PCM partial so it reads through battle music; short enough to stack five times fast.
  - type: square
    duty: 2
    pitch: 2637
    env: [[0, 1], [0.065, 1], [0.08, 0]]
    gain: 0.5
  - type: pcm
    osc: square
    pitch: 1318
    filter: {type: lp, cutoff: 3000, q: 1}
    env: [[0, 0], [0.002, 0.6], [0.06, 0.5], [0.08, 0]]
    gain: 0.3
