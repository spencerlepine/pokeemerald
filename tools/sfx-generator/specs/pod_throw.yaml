name: pod_throw
replaces: SE_BALL_THROW
constant: SE_POD_THROW
brief: "Capture pod thrown: whoosh with a small repulsor whine."
seed: 7
layers:
  # Air whoosh past the ear: band-passed noise sweeping up then down.
  - type: pcm
    osc: noise
    filter: {type: bp, cutoff: [[0, 500], [0.18, 2200], [0.45, 700]], q: 2}
    env: [[0, 0], [0.12, 1], [0.25, 0.8], [0.45, 0]]
    gain: 0.8
  # The pod's tiny repulsor: a thin 12.5 % square whine climbing in pitch with a fast frame-rate vibrato.
  - type: square
    at: 0.05
    pitch: [[0, 900], [0.3, 1700]]
    duty: 0
    vibrato: {rate: 14, depth: 0.6}
    env: [[0, 0], [0.05, 0.5], [0.25, 0.4], [0.38, 0]]
    gain: 0.35
