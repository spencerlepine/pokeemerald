name: pod_tray_enter
replaces: SE_BALL_TRAY_ENTER
constant: SE_POD_TRAY_ENTER
brief: "Battle pod tray slides in: servo."
seed: 25
layers:
  # Servo motor rising as the tray slides in: a buzzy band-passed saw with gear ripple (AM), ending in a stop tick.
  - type: pcm
    osc: saw
    pitch: [[0, 170], [0.17, 300]]
    filter: {type: bp, cutoff: [[0, 900], [0.17, 1600]], q: 2}
    am: {rate: 55, depth: 0.35}
    env: [[0, 0], [0.02, 1], [0.16, 0.9], [0.19, 0]]
    gain: 0.8
  - type: pcm
    at: 0.17
    osc: noise
    filter: {type: bp, cutoff: 2400, q: 3}
    env: [[0, 0], [0.001, 1], [0.025, 0]]
    gain: 0.45
