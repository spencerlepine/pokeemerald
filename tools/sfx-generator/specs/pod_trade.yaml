name: pod_trade
replaces: SE_BALL_TRADE
constant: SE_POD_TRADE
brief: "Capture pod sent through a trade link: data-transfer zap."
seed: 23
layers:
  # Data zap: a fast FM chirp shooting upward with a staircase of square blips (bits on the wire).
  - type: pcm
    osc: sine
    pitch: [[0, 500], [0.2, 3600]]
    fm: {ratio: 1.5, index: [[0, 2.5], [0.22, 0.4]]}
    env: [[0, 0], [0.005, 1], [0.16, 0.7], [0.24, 0]]
    gain: 0.75
  - type: square
    duty: 1
    pitch: [[0, 1046], [0.04, 1046], [0.041, 1568], [0.08, 1568], [0.081, 2093], [0.12, 2093], [0.121, 3136], [0.2, 3136]]
    env: [[0, 0.8], [0.18, 0.6], [0.22, 0]]
    gain: 0.35
  - type: noise
    clock: 262144
    short: true
    env: [[0, 0.6], [0.05, 0]]
    gain: 0.15
