    osc: saw
    unison: [-15, 15]
    pitch: [[0, 1800], [0.08, 600], [0.3, 140]]
    fm: {ratio: 0.5, index: [[0, 2.5], [0.3, 0.8]]}
    filter: {type: lp, cutoff: [[0, 5500], [0.3, 1500]], q: 2}
    env: [[0, 0], [0.004, 1], [0.15, 0.7], [0.32, 0]]
    gain: 0.8
