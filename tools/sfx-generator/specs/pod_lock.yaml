name: pod_lock
replaces: SE_RG_BALL_CLICK
constant: SE_POD_LOCK
brief: "Capture pod locks (catch confirmed): heavy magnetic clamp."
seed: 49
layers:
  # A magnetic clamp slamming shut: a driven low thud, a heavy metal clank (inharmonic FM ring), and a
  # short electrical buzz as the magnet bites.
  - type: pcm
    osc: sine
    pitch: [[0, 130], [0.1, 55]]
    env: [[0, 0], [0.002, 1], [0.05, 0.5], [0.15, 0]]
    drive: 2.5
    gain: 1.0
  - type: pcm
    osc: sine
    pitch: 560
    fm: {ratio: 2.76, index: [[0, 2.0], [0.15, 0.3]]}
    env: [[0, 0], [0.002, 1], [0.03, 0.4], [0.16, 0]]
    gain: 0.6
  - type: pcm
    osc: saw
    pitch: 120
    filter: {type: bp, cutoff: 1500, q: 2}
    am: {rate: 60, depth: 0.5}
    env: [[0, 0], [0.01, 0.6], [0.16, 0]]
    gain: 0.3
