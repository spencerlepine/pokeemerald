name: saber_ignite
constant: SE_SABER_IGNITE
brief: "Lightsaber ignition snap-hiss: SABER SLASH wind-up and cutscenes where a saber is drawn."
seed: 4
layers:
  # Snap: a crack of LFSR noise with its clock falling (bright to dark) - the "kssh".
  - type: noise
    clock: [[0, 262144], [0.08, 65536], [0.25, 16384]]
    env: [[0, 1], [0.05, 0.8], [0.25, 0]]
    gain: 0.5
  # The blade powers up: a buzzy low drone that swoops up in pitch and opens its filter, then settles.
  - type: pcm
    osc: saw
    unison: [-9, 0, 11]
    pitch: [[0, 55], [0.12, 128], [0.3, 104], [0.9, 98]]
    filter: {type: lp, cutoff: [[0, 300], [0.1, 2600], [0.4, 1200], [0.9, 900]], q: 2.5}
    am: {rate: 4.5, depth: 0.15}
    env: [[0, 0], [0.03, 1], [0.6, 0.85], [0.9, 0]]
    drive: 1.6
    gain: 0.9
  - type: pcm
    osc: saw
    pitch: [[0, 220], [0.12, 512], [0.3, 416], [0.9, 392]]
    filter: {type: bp, cutoff: [[0, 600], [0.12, 2200], [0.9, 1500]], q: 3}
    env: [[0, 0], [0.04, 0.6], [0.5, 0.35], [0.9, 0]]
    gain: 0.35
