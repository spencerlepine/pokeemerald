name: saber_retract
constant: SE_SABER_RETRACT
brief: "Lightsaber retract: the ignite in reverse, short. SABER SLASH retract beat and saber cutscenes."
seed: 82
layers:
  # The ignition run backwards: the idling blade hum swells briefly, then swoops down in pitch while its
  # filter closes, and ends on a soft dark "fsst" as the blade collapses into the hilt.
  - type: pcm
    osc: saw
    unison: [-9, 0, 11]
    pitch: [[0, 98], [0.15, 110], [0.42, 50]]
    filter: {type: lp, cutoff: [[0, 900], [0.12, 1800], [0.42, 250]], q: 2.5}
    am: {rate: 4.5, depth: 0.15}
    env: [[0, 0], [0.04, 0.8], [0.15, 1], [0.44, 0]]
    drive: 1.6
    gain: 0.9
  - type: pcm
    osc: saw
    pitch: [[0, 392], [0.15, 440], [0.42, 200]]
    filter: {type: bp, cutoff: [[0, 1500], [0.42, 500]], q: 3}
    env: [[0, 0], [0.05, 0.35], [0.42, 0]]
    gain: 0.3
  - type: noise
    at: 0.3
    clock: [[0, 32768], [0.2, 8192]]
    env: [[0, 0], [0.03, 0.6], [0.2, 0]]
    gain: 0.3
