name: leia_back
kit: trainerback64x4
replaces: graphics/trainers/back_pics/steven.png
front: ../../sprite-trainer-generator/output/leia/leia.png
# LEIA ORGANA, back view (multi battle partner). Repaint of Steven's back pic (an adult throwing
# from the same 3/4 turn), matching the approved Leia front pic: his big spiky silver hair is
# trimmed down to a smaller head of brown hair with a side bun, the black suit -> her white
# gown, the silver cuff stays silver. The palette is Leia's front palette, index for index: the
# game builds Steven's back palette from the front pic PNG (front_pics/steven.png).
palette:
  - [115, 197, 164]  # 0 transparent
  - [16, 16, 24]     # K outline
  - [248, 224, 200]  # a skin light
  - [232, 176, 144]  # b skin base
  - [192, 136, 104]  # c skin shadow
  - [64, 32, 24]     # d hair outline
  - [168, 112, 64]   # h hair light
  - [120, 72, 40]    # i hair base
  - [88, 48, 32]     # j hair shadow
  - [232, 232, 240]  # w gown light
  - [200, 200, 216]  # x gown base
  - [144, 144, 168]  # y gown shadow
  - [248, 248, 248]  # W white
  - [64, 64, 80]     # g metal dark
  - [104, 104, 120]  # G metal
legend: {'.': 0, K: 1, a: 2, b: 3, c: 4, d: 5, h: 6, i: 7, j: 8, w: 9, x: 10, y: 11, W: 12, g: 13, G: 14}
repaint:
  pic: graphics/trainers/back_pics/steven.png
  # steven: 1-3 skin, 4 skin edge, 9/A/B hair light -> dark (and the cuff), 7/8 suit (7 also
  # the hair outline), 14 white, 15 outline
  remap: {1: a, 2: b, 3: c, 4: d, 7: w, 8: x, 9: h, 10: i, 11: j, 14: W, 15: K}
# The head is the same drawing on every frame, moved: frame 1 (+2, -1), 2 (-7, -1), 3 (+3, -1).
layers:
  # hair outline (was the suit grey) -> dark brown
  - {name: hair outline, shape: poly, pts: [[8, 6], [50, 6], [50, 32], [8, 32]], recolour: "w:d", shift: {1: [2, -1], 2: [-7, -1], 3: [3, -1]}}
  # cut the spiky mane down to a smaller, smooth head
  - name: trim
    shape: trim
    box: [6, 4, 46, 30]
    keep: {shape: ellipse, at: [31, 22], r: [12.5, 13.5]}
    shift: {1: [2, -1], 2: [-7, -1], 3: [3, -1]}
  - {name: hair edge, shape: edge, chars: "hij", to: d}
  # the near side bun at the back of the head, coiled
  - {name: near bun, shape: ellipse, at: [20, 23], r: [5.2, 5.6], ramp: jih, outline: d, shift: {1: [2, -1], 2: [-7, -1], 3: [3, -1]}}
  - name: bun coil
    shape: pixels
    x: 17
    y: 20
    rows: |
      __jj
      _j__j
      _j_j_j
      __jj_j
      ____j
    shift: {1: [2, -1], 2: [-7, -1], 3: [3, -1]}
  # Steven's silver cuff stays silver: it was drawn with the hair colours
  - {name: cuffs, shape: poly, pts: [[0, 38], [64, 38], [64, 64], [0, 64]], recolour: "h:W i:G j:g"}
