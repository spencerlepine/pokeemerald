name: luke_back
kit: trainerback64x4
replaces: graphics/trainers/back_pics/wally.png
front: ../../sprite-trainer-generator/output/luke/luke.png
# LUKE SKYWALKER, back view (the catching tutorial). Repaint of Wally's own back pic, matching
# the approved Luke front pic (repaint of Wally's front): green hair -> sandy blond, white shirt
# -> Tatooine tunic. The palette is Luke's front palette, index for index: the game loads
# graphics/trainers/palettes/wally.pal for both pics, so `install` of either writes it.
palette:
  - [115, 197, 164]  # 0 transparent
  - [16, 16, 24]     # K outline
  - [248, 232, 208]  # a skin light
  - [224, 176, 152]  # b skin base
  - [184, 136, 104]  # c skin shadow
  - [248, 248, 248]  # e tunic white
  - [216, 216, 224]  # f tunic light
  - [160, 152, 176]  # g tunic shadow
  - [112, 104, 128]  # h tunic dark
  - [248, 224, 136]  # i hair light
  - [216, 176, 88]   # j hair base
  - [160, 112, 56]   # k hair shadow
  - [96, 64, 48]     # n brown (boots, belt, skin edge)
  - [160, 120, 80]   # m boot highlight
  - [80, 144, 248]   # o saber glow
  - [232, 248, 248]  # p saber core
legend: {'.': 0, K: 1, a: 2, b: 3, c: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, n: 12, m: 13, o: 14, p: 15}
repaint:
  pic: graphics/trainers/back_pics/wally.png
  # wally: 1-3 skin, 4 skin edge, 7/8/10/11 green hair light -> darkest, 9/14/13 shirt white,
  # 5/6 shirt shadow, 12 blue, 15 outline
  remap: {1: a, 2: b, 3: c, 4: n, 5: g, 6: h, 7: i, 8: j, 9: f, 10: k, 11: n, 12: f, 13: f, 14: e, 15: K}
# The head is the same drawing on every frame, moved: frame 1 (+6, -2), 2 (-6, -1), 3 (+2, 0).
layers:
  # trim the top spike, as on the front pic
  - {name: spike tip, shape: poly, pts: [[25, 14], [37, 14], [36, 19], [29, 20], [25, 19]], erase: true, shift: {1: [6, -2], 2: [-6, -1], 3: [2, 0]}}
  # Wally's dark-green hair outline -> a dark-gold selective outline, like the front pic
  - {name: hair edge, shape: edge, chars: "nij", to: k}
