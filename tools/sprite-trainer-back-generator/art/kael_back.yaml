name: kael_back
kit: trainerback64x4
replaces: graphics/trainers/back_pics/brendan.png
front: ../../sprite-trainer-generator/output/kael/kael.png
# KAEL (player, boy), back view throwing a capture pod. Repaint of Brendan's own back pic: his
# white hat with the spiky top already reads as tousled hair once it is brown, and the green
# band becomes Kael's kyber-blue headband (walker look). Navy shirt -> sand wrap tunic, green
# pack -> brown satchel, red gloves -> white arm wraps.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200]  # a skin light
  - [232, 176, 144]  # b skin base
  - [200, 136, 104]  # c skin shadow
  - [96, 56, 40]     # d dark brown (skin edge, hair and leather shadow)
  - [248, 232, 184]  # s sand light
  - [224, 200, 144]  # t sand base
  - [184, 152, 104]  # u sand shadow
  - [128, 104, 64]   # v sand dark
  - [176, 112, 64]   # h hair / leather light
  - [136, 184, 232]  # o kyber light
  - [64, 112, 184]   # q kyber base
  - [128, 80, 48]    # m hair / leather mid
  - [200, 200, 216]  # w wrap shadow
  - [248, 248, 248]  # W white
  - [16, 16, 24]     # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, s: 5, t: 6, u: 7, v: 8, h: 9, o: 10, q: 11, m: 12, w: 13, W: 14, K: 15}
repaint:
  pic: graphics/trainers/back_pics/brendan.png
  # brendan: 1-4 skin, 5-8 navy (shirt, and the hat's selective outline), 9 hat grey, 14 white,
  # 10/11 green (hat band, pack, wristband), 12/13 red (collar, gloves), 15 black (hair, outline)
  remap: {1: a, 2: b, 3: c, 4: d, 5: s, 6: t, 7: u, 8: v, 9: w, 10: o, 11: q, 12: W, 13: w, 14: W, 15: K}
# The head is the same drawing on every frame, moved: frame 1 (+5, +1), 2 (-6, +2), 3 (+4, -1).
layers:
  # body first: green pack and wristband -> brown leather satchel and bracer
  - {name: satchel, shape: poly, pts: [[0, 36], [64, 36], [64, 64], [0, 64]], recolour: "q:m o:h"}
  - {name: wrist, shape: poly, pts: [[0, 0], [64, 0], [64, 36], [0, 36]], recolour: "o:h"}
  # hat -> tousled brown hair: white -> hair light, grey -> hair mid, its navy outline -> dark brown
  - name: hair
    shape: poly
    pts: [[10, 12], [46, 12], [46, 24], [38, 24], [38, 36], [10, 36]]
    recolour: "W:h w:m s:d t:d u:d v:d h:o"
    shift: {1: [5, 1], 2: [-6, 2], 3: [4, -1]}
  # Brendan's black hair under the hat -> brown, shaded
  - name: nape
    shape: poly
    pts: [[21, 29], [32, 29], [32, 37], [21, 37]]
    recolour: "K:m v:d"
    shift: {1: [5, 1], 2: [-6, 2], 3: [4, -1]}
  # the headband wraps round the back of the head to a knot, two tails hanging behind
  - name: band and knot
    shape: pixels
    x: 9
    y: 23
    rows: |
      ________________________
      ________________________
      _____________________KK_
      _________________KKKKqo_
      ______________KKKooooqq_
      _____KKK__KKKKooqqqqqKK_
      ____KoqqKKoqooqqqKKKK___
      ____KqqqKoqqqqKKK_______
      ____KqKKqqKKKK__________
      __KoKKqKKK______________
      __KqKKqK________________
      _KoK_KqK________________
      _KqKKqK_________________
      KoK_KqK_________________
      KqK__K__________________
      KK______________________
    shift: {1: [5, 1], 2: [-6, 2], 3: [4, -1]}
