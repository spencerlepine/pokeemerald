# CREDIT TOSS (was PAY DAY): coins become Imperial credit chips. Only PAY DAY loads ANIM_TAG_COIN and
# the game only ever shows slot 2 (ANIMCMD_FRAME(8, 1)), spun by the affine unit, so slot 2 is the
# drawing that matters; slots 0, 1, 3 are the chip turning, kept for completeness.
name: credit_chips
title: CREDIT TOSS chip
row: graphics/battle_anims/sprites/coin.png
bucket: RESKIN
replaces: graphics/battle_anims/sprites/coin.png
brief: >
  A small rectangular Imperial credit chip: durasteel body with a gold inlay window and a tiny
  status light, rimmed in its own dark tones like Emerald's coin (no black outline).
theme: [imperial-order, kyber-gold]
palette:
  mode: new
  transparent: "#009090"         # vanilla key colour
  ramps:
    steel: ["#F0F0F0", "#C0C8D0", "#8890A0", "#586070", "#303848"]
    gold:  ["#F8F0A0", "#F8D000", "#B88800", "#604000"]
    light: ["#F83030"]
frames: [0, 1, 2, 3]
vars:
  # how far the chip has turned toward us in each slot (1 = face on)
  turn: "=[0.3, 0.62, 1.0, 1.0][i]"
frame_ops:
  2:
    - grid:
        x: 4
        y: 1
        light: [-1, -1]
        depth: 2
        rows:
          - "..cccc.."
          - ".cccccc."
          - "cccccccc"
          - "cggggggc"
          - "cgGGGGgc"
          - "cgGGGGgc"
          - "cggggggc"
          - "cccccccc"
          - "cccccccc"
          - "cssssssc"
          - "cccccccc"
          - "ccccrccc"
          - ".cccccc."
          - "..cccc.."
        shade: {c: steel, g: gold}
        legend: {G: gold.1, s: steel.3, r: light}
    - selout: {light: [-1, -1]}
  0:
    - copy: {frame: 2, scalex: 0.3, cx: 7.5}
  1:
    - copy: {frame: 2, scalex: 0.62, cx: 7.5}
  3:
    - copy: {frame: 2, scale: 1.0}
    - transform: {rotate: 25}
preview:
  scene: battle
  # AnimCoinThrow: a chip arcs from the attacker to the target, spinning (affine)
  motion: {kind: projectile, frames: 24, arc: 28, spin: 15, count: 3, stagger: 5, frame: 2}
  length: 44
romtest:
  move: MOVE_PAY_DAY
