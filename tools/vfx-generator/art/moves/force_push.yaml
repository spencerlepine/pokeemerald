# FORCE PUSH (PSYCHIC, Force 90). Storyboard S3 in wiki/bible/MOVE_EFFECTS.md.
# The arena drops into the Force backdrop (BG_FORCE, shared by every Force move: indigo bands that flow
# outward), the attacker rears, three shock rings fly at the target, the target is shoved back, squashed,
# dusted, shaken, and slides home.
name: force_push
title: FORCE PUSH
doc: S3
host: Move_PSYCHIC
romtest: {move: MOVE_PSYCHIC}
kit:
  - force_ring             # owns the palette
  - force_dust             # kit palette
bgs:
  BG_FORCE:
    name: force
    path: graphics/battle_anims/backgrounds/sw/force
    gen:
      kind: ripple
      cx: 128
      cy: 80
      spacing: 8
      wobble: 0.6
      petals: 4
      colors: ["#080418", "#100828", "#140C34", "#181040", "#1C1450", "#241C68", "#3830A0", "#6870E0",
               "#B8C8FF", "#5058C8", "#282080", "#181048", "#0C0624", "#000000", "#000000", "#000000"]
templates:
  gForceRingSpriteTemplate:
    sheet: force_ring
    blend: true
    callback: TranslateAnimSpriteToTargetMonLocation   # x0, y0, x1, y1, frames, coords
    anim: [[0, 3], [1, 3], [2, 3], [3, 6]]
  gForceGatherRingSpriteTemplate:
    sheet: force_ring
    blend: true
    callback: AnimSpriteOnMonPos
    anim: [[3, 3], [2, 3], [1, 3], [0, 3], [1, 2], [0, 4]]
  gForceDustSpriteTemplate:
    sheet: force_dust
    callback: AnimSpriteOnMonPos
    anim: [[0, 4], [1, 6], [2, 8]]
code: |
  static void AnimTask_SW_Knockback_Step(u8 taskId)
  {
      struct Task *task = &gTasks[taskId];
      struct Sprite *mon = &gSprites[task->data[0]];
      s16 t = task->data[5]++;
      s16 out = task->data[2], hold = task->data[3], back = task->data[4];

      if (t < out)
          mon->x2 = task->data[1] * (t + 1) / out;
      else if (t < out + hold)
          mon->x2 = task->data[1];
      else if (t < out + hold + back)
          mon->x2 = task->data[1] * (out + hold + back - t - 1) / back;
      else
      {
          mon->x2 = 0;
          DestroyAnimVisualTask(taskId);
      }
  }

  // Shove a battler away from the attacker and bring it home.
  // args: battler, distance (px), out frames, hold frames, back frames
  void AnimTask_SW_Knockback(u8 taskId)
  {
      struct Task *task = &gTasks[taskId];
      u8 spriteId = GetAnimBattlerSpriteId(gBattleAnimArgs[0]);
      s16 dist = gBattleAnimArgs[1];

      u8 battler = gBattleAnimArgs[0] == ANIM_TARGET ? gBattleAnimTarget : gBattleAnimAttacker;

      if (GetBattlerSide(battler) == B_SIDE_PLAYER)
          dist = -dist;
      task->data[0] = spriteId;
      task->data[1] = dist;
      task->data[2] = gBattleAnimArgs[2];
      task->data[3] = gBattleAnimArgs[3];
      task->data[4] = gBattleAnimArgs[4];
      task->data[5] = 0;
      task->func = AnimTask_SW_Knockback_Step;
  }
script: |
  loadspritegfx ANIM_TAG_SW_FORCE_RING
  loadspritegfx ANIM_TAG_SW_FORCE_DUST
  monbg ANIM_DEF_PARTNER
  setalpha 8, 8
  @ gather: the arena falls into the Force, the attacker rears, a ring closes on it
  fadetobg BG_FORCE
  waitbgfadeout
  createvisualtask AnimTask_SetPsychicBackground, 5
  waitbgfadein
  playsewithpan SE_M_CHARGE, SOUND_PAN_ATTACKER
  createvisualtask AnimTask_RotateMonSpriteToSide, 2, 8, -256, ANIM_ATTACKER, 0
  createsprite gForceGatherRingSpriteTemplate, ANIM_ATTACKER, 3, 0, 0, 0, 0
  createvisualtask AnimTask_BlendMonInAndOut, 5, ANIM_ATTACKER, RGB(20, 24, 31), 10, 1, 1
  delay 22
  @ push: three rings leave the attacker, the arena shudders
  playsewithpan SE_FORCE_PUSH, SOUND_PAN_ATTACKER
  createsprite gForceRingSpriteTemplate, ANIM_TARGET, 3, 16, 0, 0, 0, 14, 0
  createvisualtask AnimTask_HorizontalShake, 5, MAX_BATTLERS_COUNT + 1, 2, 16
  delay 5
  createsprite gForceRingSpriteTemplate, ANIM_TARGET, 3, 16, 0, 0, 0, 14, 0
  delay 5
  createsprite gForceRingSpriteTemplate, ANIM_TARGET, 3, 16, 0, 0, 0, 14, 0
  delay 6
  @ impact: shoved back, squashed, dust at its feet, shaken; then it slides home
  playsewithpan SE_M_TAKE_DOWN, SOUND_PAN_TARGET
  createvisualtask AnimTask_SW_Knockback, 5, ANIM_TARGET, 20, 6, 14, 20
  createvisualtask AnimTask_ScaleMonAndRestore, 5, 24, -24, 8, ANIM_TARGET, 1
  createvisualtask AnimTask_BlendMonInAndOut, 5, ANIM_TARGET, RGB_WHITE, 12, 1, 1
  createsprite gForceDustSpriteTemplate, ANIM_TARGET, 2, -14, 18, 1, 0
  createsprite gForceDustSpriteTemplate, ANIM_TARGET, 2, 10, 20, 1, 0
  delay 6
  createvisualtask AnimTask_ShakeMon, 5, ANIM_TARGET, 0, 3, 10, 1
  createvisualtask AnimTask_RotateMonSpriteToSide, 2, 8, -256, ANIM_ATTACKER, 1
  waitforvisualfinish
  @ settle
  clearmonbg ANIM_DEF_PARTNER
  blendoff
  delay 1
  restorebg
  waitbgfadeout
  setarg 7, 0xFFFF
  waitbgfadein
  end
