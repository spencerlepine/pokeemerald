# FORCE BOLT (SHOCK WAVE, Electric 60, never misses). Storyboard S5 in wiki/bible/MOVE_EFFECTS.md.
# Force lightning from the fingertips on the dark-side backdrop (BG_FORCE_DARK, defined by force_choke:
# build and film the two together). Charging particles, three crawling forked arcs stretched from the
# attacker to the target, screen flashes, the target flashes, shakes and smokes.
name: force_bolt
title: FORCE BOLT
doc: S5
host: Move_SHOCK_WAVE
romtest: {move: MOVE_SHOCK_WAVE}
kit:
  - force_arc
templates:
  gForceArcSpriteTemplate:
    sheet: force_arc
    affine: double
    blend: true
    callback: AnimSW_SpanArc            # args: target x, y offset, frames, start slot (0-2)
    anims:
      - [[0, 4], [1, 4], [2, 4]]
      - [[1, 4], [2, 4], [0, 4]]
      - [[2, 4], [0, 4], [1, 4]]
    loop: true
code: |
  static void AnimSW_SpanArc_Step(struct Sprite *sprite)
  {
      if (--sprite->data[0] <= 0)
          DestroyAnimSprite(sprite);
  }

  // Stretch a flat (left-to-right) 64-px sprite from the attacker to a point on the target and rotate it onto
  // that line (AffineDouble so the rotated, scaled sprite is not clipped).
  static void AnimSW_SpanArc(struct Sprite *sprite)
  {
      s16 ax, ay, tx, ty;
      s32 dx, dy, d2, dist;
      u16 rot;

      if (GetBattlerSide(gBattleAnimAttacker) != B_SIDE_PLAYER)
          gBattleAnimArgs[0] = -gBattleAnimArgs[0];
      ax = GetBattlerSpriteCoord(gBattleAnimAttacker, BATTLER_COORD_X_2);
      ay = GetBattlerSpriteCoord(gBattleAnimAttacker, BATTLER_COORD_Y_PIC_OFFSET);
      tx = GetBattlerSpriteCoord(gBattleAnimTarget, BATTLER_COORD_X_2) + gBattleAnimArgs[0];
      ty = GetBattlerSpriteCoord(gBattleAnimTarget, BATTLER_COORD_Y_PIC_OFFSET) + gBattleAnimArgs[1];
      dx = tx - ax;
      dy = ty - ay;
      d2 = dx * dx + dy * dy;
      dist = 1;
      while ((dist + 1) * (dist + 1) <= d2)
          dist++;
      sprite->x = (ax + tx) / 2;
      sprite->y = (ay + ty) / 2;
      rot = ArcTan2Neg(dx, dy);
      // the rot/scale parameter is an inverse scale: 0x100 * 64 / dist stretches the 64 px art to dist
      TrySetSpriteRotScale(sprite, FALSE, (64 * 0x100) / dist, 0x100, rot);
      StartSpriteAnim(sprite, gBattleAnimArgs[3]);
      sprite->data[0] = gBattleAnimArgs[2];
      sprite->callback = AnimSW_SpanArc_Step;
  }
script: |
  loadspritegfx ANIM_TAG_SW_FORCE_ARC
  loadspritegfx ANIM_TAG_ELECTRIC_ORBS
  loadspritegfx ANIM_TAG_SW_BLASTER_SMOKE
  monbg ANIM_TARGET
  setalpha 12, 8
  @ charge: dark-side backdrop, energy collapses into the attacker
  fadetobg BG_FORCE_DARK
  waitbgfadeout
  createvisualtask AnimTask_SetPsychicBackground, 5
  waitbgfadein
  createvisualtask AnimTask_ElectricChargingParticles, 2, ANIM_ATTACKER, 20, 0, 2
  playsewithpan SE_M_CHARGE, SOUND_PAN_ATTACKER
  createvisualtask AnimTask_BlendMonInAndOut, 5, ANIM_ATTACKER, RGB(20, 24, 31), 10, 2, 2
  delay 24
  @ arcs: three forked arcs crawl from the attacker to the target
  loopsewithpan SE_FORCE_LIGHTNING, SOUND_PAN_TARGET, 9, 4
  createsprite gForceArcSpriteTemplate, ANIM_TARGET, 3, 0, 0, 36, 0
  invert_screen_color scenery=TRUE, attacker=TRUE, target=TRUE
  delay 1
  invert_screen_color scenery=TRUE, attacker=TRUE, target=TRUE
  createvisualtask AnimTask_ShakeMon, 5, ANIM_TARGET, 2, 0, 18, 1
  delay 3
  createsprite gForceArcSpriteTemplate, ANIM_TARGET, 3, -10, -8, 32, 1
  delay 4
  createsprite gForceArcSpriteTemplate, ANIM_TARGET, 3, 10, 6, 28, 2
  delay 4
  invert_screen_color scenery=TRUE, attacker=TRUE, target=TRUE
  delay 1
  invert_screen_color scenery=TRUE, attacker=TRUE, target=TRUE
  delay 11
  invert_screen_color scenery=TRUE, attacker=TRUE, target=TRUE
  delay 1
  invert_screen_color scenery=TRUE, attacker=TRUE, target=TRUE
  delay 12
  @ impact: white flashes, the pattern shake, a moment of black, smoke
  playsewithpan SE_M_TRI_ATTACK2, SOUND_PAN_TARGET
  createvisualtask AnimTask_BlendMonInAndOut, 5, ANIM_TARGET, RGB_WHITE, 12, 2, 1
  createvisualtask AnimTask_ShakeTargetInPattern, 2, 30, 3, TRUE, 0
  delay 8
  simple_palette_blend selector=F_PAL_TARGET, delay=0, initial_blend_y=8, target_blend_y=8, color=RGB_BLACK
  delay 12
  simple_palette_blend selector=F_PAL_TARGET, delay=1, initial_blend_y=8, target_blend_y=0, color=RGB_BLACK
  createsprite gBlasterSmokeSpriteTemplate, ANIM_TARGET, 2, -6, 2, -1
  delay 6
  createsprite gBlasterSmokeSpriteTemplate, ANIM_TARGET, 2, 6, 0, 1
  waitforvisualfinish
  clearmonbg ANIM_TARGET
  blendoff
  delay 1
  restorebg
  waitbgfadeout
  setarg 7, 0xFFFF
  waitbgfadein
  end
