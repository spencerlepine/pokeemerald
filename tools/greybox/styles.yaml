# Per-art-id colour and variant overrides for the greybox tool. The model name (`build`) and the
# footprint come from wiki/mapping/world_art.csv, the one asset list; an entry here only adds colours
# (wall, roof, trim, glass, field, rock), `height`, `fork`, or `variants` (partial entries picked by seed).
# Keys are art ids. `kind` is the old flat-shape name, still used for props without a 3D model.
shapes:
