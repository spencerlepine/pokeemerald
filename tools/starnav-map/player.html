<title>StarNAV Map Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one GBA screen centred, style tabs above it, a D-pad and A/B under it. Single dark look on purpose. */
:root {
  --bg: #0b0d14; --panel: #151a26; --line: #283444; --fg: #e8e6dc; --dim: #8a93a6; --gold: #f8d000;
  --display: "Silkscreen", ui-monospace, monospace; --body: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .06em; margin: 0; color: var(--gold); }
p { margin: 0; color: var(--dim); line-height: 1.5; max-width: 65ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: 13px var(--body); background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 7px 11px; cursor: pointer; }
.tabs button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tabs .round { flex-basis: 100%; font: 12px var(--display); color: var(--dim); letter-spacing: .08em; margin-top: 4px; }
.tabs button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gba { background: #000; border: 1px solid var(--line); padding: 8px; justify-self: center; max-width: 100%; box-sizing: border-box; }
canvas { display: block; width: 720px; max-width: 100%; aspect-ratio: 3 / 2; image-rendering: pixelated; }
.pad { display: flex; justify-content: center; gap: 36px; align-items: center; flex-wrap: wrap; }
.dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 2px; }
.pad button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); font: 16px var(--display); cursor: pointer; touch-action: manipulation; }
.pad button:active { background: var(--line); }
.ab { display: flex; gap: 12px; }
.ab button { width: 56px; height: 56px; border-radius: 50%; }
.keys { font-size: 13px; color: var(--dim); text-align: center; }
#note { color: var(--fg); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Silkscreen&display=swap">
<div class="wrap">
  <h1>STARNAV MAP</h1>
  <p>Styles for the StarNAV map screen, drawn at the GBA's 240x160 from the world blockout. Move the cursor, zoom in with A and out with B.</p>
  <div class="tabs" id="tabs"></div>
  <p id="note"></p>
  <div class="gba"><canvas id="screen" width="240" height="160"></canvas></div>
  <div class="pad">
    <div class="dpad">
      <span></span><button id="k-up" aria-label="Up">▲</button><span></span>
      <button id="k-left" aria-label="Left">◀</button><span></span><button id="k-right" aria-label="Right">▶</button>
      <span></span><button id="k-down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="ab"><button id="k-b">B</button><button id="k-a">A</button></div>
  </div>
  <div class="keys">Keyboard: arrows move, Z or Enter zooms in, X or Esc zooms out, number keys switch style.</div>
</div>
<script>/*DATA*/</script>
<script>/*PLAYER*/</script>
<script>
(function () {
  const tabs = document.getElementById("tabs");
  const note = document.getElementById("note");
  function sync() {
    [...tabs.querySelectorAll("button")].forEach((b, i) => b.setAttribute("aria-pressed", i === SN.state.style));
    note.textContent = STARNAV_DATA.styles[SN.state.style].style.note;
  }
  let lastRound = null;
  STARNAV_DATA.styles.forEach((s, i) => {
    if (s.round !== lastRound) {
      lastRound = s.round;
      const l = document.createElement("span"); l.className = "round"; l.textContent = "Round " + s.round;
      tabs.appendChild(l);
    }
    const b = document.createElement("button");
    b.textContent = (i + 1) + " " + s.style.title;
    b.onclick = () => { SN.setStyle(i); sync(); };
    tabs.appendChild(b);
  });
  window.onStyle = sync;
  ["up", "down", "left", "right", "a", "b"].forEach(k => document.getElementById("k-" + k).onclick = () => SN.key(k));
  sync();
})();
</script>
