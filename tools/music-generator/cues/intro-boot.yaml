  - {name: raider_near_3,  frame: 1452, kind: soft,     tol: 6, source: "sRaiderSpawns 1440 + rise"}
  - {name: raider_far_3,   frame: 1476, kind: soft,    tol: 6, source: "sRaiderSpawns 1470"}
  - {name: raider_near_4,  frame: 1542, kind: soft,     tol: 6, source: "sRaiderSpawns 1530 + rise"}
  - {name: player_hold,    frame: 1576, kind: soft,    tol: 6, source: TIMER_PLAYER_HOLD_POSITION}
  - {name: raider_trio,    frame: 1616, kind: soft,    tol: 6, source: "sRaiderSpawns 1610, 1618, 1626"}
