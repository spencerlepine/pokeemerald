# Boot cutscene (game/src/intro.c, scenes 1 and 2): the frames MUS_INTRO has to hit.
# frame = gIntroFrameCounter (Task_Scene1_FadeIn zeroes it and calls m4aSongNumStart(MUS_INTRO)). The song's
# own time line is not quite that counter: measured on the ROM (romsync.py --as-is, log.csv), the engine plays
# clock 0 on the frame the counter reads 2, and loading scene 2 (Task_Scene2_Load, LZ77 into VRAM) costs 3 lag
# frames on which the counter stands still while the music keeps going. `shift` turns a counter value into a
# song frame (Song.frame_of: the frame a clock plays on): song frame = frame + the last shift at or below it.
# Scene 3 (Task_Scene3_Load) starts MUS_INTRO_BATTLE at counter 2069, which cuts this song off.
#   kind: hit      a visible event the music must land on (an accent within `tol` frames)
#                  (the raider pops were hits in the first draft; the owner found a stab on every one choppy, so
#                  they are soft now: the chase grooves through them)
#         section  a structural change (scene cut, camera move): a bar line, within `tol`
#         soft     a gesture that should start near it (the drop sliding, a fade)
# `source` says where the frame comes from: a TIMER_* in intro.c, a sprite callback worked out from the code,
# or measured from the ROM (cuesync.py rom).
scene_end: 2068
shift: [[0, -2], [1029, 1]]
cues:
  - {name: fade_in,        frame: 2,    kind: section, tol: 2, source: "Task_Scene1_FadeIn: fade from black, MUS_INTRO starts"}
  - {name: drop_slide,     frame: 76,   kind: soft,    tol: 4, source: TIMER_BIG_DROP_START (drop starts along the overhang)}
  - {name: drop_fall,      frame: 251,  kind: soft,    tol: 4, source: TIMER_BIG_DROP_FALLS}
  - {name: drop_splash,    frame: 271,  kind: hit,     tol: 3, source: "SpriteCB_WaterDrop_Fall: y 46 -> 120 at 4 px a frame; the ring shows on the ROM capture at 269-273"}
  - {name: small_splash_1, frame: 398,  kind: hit,     tol: 3, source: "measured: the drop vanishes into the pool (TIMER_SMALL_DROP_1 + 28 frames of fall); its ripple shows 8 frames later"}
  - {name: small_splash_2, frame: 415,  kind: hit,     tol: 3, source: "measured: the drop vanishes into the pool (TIMER_SMALL_DROP_2 + 30 frames); ripple 8 frames later"}
  - {name: pan_up,         frame: 561,  kind: section, tol: 3, source: "TIMER_SPARKLES: glints, then Task_Scene1_PanUp starts the rise"}
  - {name: shuttle,        frame: 833,  kind: hit,     tol: 3, source: "TIMER_FLYGON_SILHOUETTE_APPEAR: Lambda shuttle sweeps up"}
  - {name: tie_advanced,   frame: 857,  kind: hit,     tol: 3, source: TIMER_TIE_ADVANCED_APPEAR}
  - {name: twin_suns,      frame: 904,  kind: section, tol: 3, source: "TIMER_END_PAN_UP: the pan stops on the twin suns"}
  - {name: fade_white,     frame: 1008, kind: soft,    tol: 6, source: "TIMER_END_SCENE_1: fade to white"}
  - {name: scene2,         frame: 1029, kind: section, tol: 3, source: "Task_Scene2_CreateSprites: speeder chase fades in from white"}
  - {name: raider_far_1,   frame: 1066, kind: soft,    tol: 6, source: "sRaiderSpawns 1060 (far, rises 1 px / 2 frames)"}
  - {name: raider_near_1,  frame: 1112, kind: soft,     tol: 6, source: "sRaiderSpawns 1100 + 10 (x -16 -> 24) + rise"}
  - {name: player_back,    frame: 1109, kind: soft,    tol: 6, source: TIMER_PLAYER_DRIFT_BACK}
  - {name: player_surge,   frame: 1214, kind: section, tol: 3, source: "TIMER_PLAYER_MOVE_FORWARD: the speeder surges ahead"}
  - {name: raider_far_2,   frame: 1256, kind: soft,    tol: 6, source: "sRaiderSpawns 1250 and 1258"}
  - {name: raider_near_2,  frame: 1322, kind: soft,     tol: 6, source: "sRaiderSpawns 1310 + rise"}
