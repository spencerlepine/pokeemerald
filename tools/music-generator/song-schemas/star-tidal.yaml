# STAR TIDAL starliner (SS Tidal corridors, decks and rooms): hot-swap of MUS_SAILING (wiki audio:MUS_SAILING).
# ARRANGE of "Star Wars Main Title and The Arrival at Naboo" (ref_tracks soundtrack:phantom-menace:01, ref_notes:
# the Arrival at Naboo half). From the cue (analyze_reference --start 95: D major, 86 bpm, the A-sus pedal
# under Am7 / Esus4, the bright D-Bb-D side-step, the closing Am7-G7-Dsus4 turn to G): its harmony, tempo and
# texture (high woodwind over shimmering strings and harp, soft low pedal), cut to a 16-bar loop with a
# floating flute line on top, xylophone and square sparkles for the stars passing the viewport.
# Vanilla: sailing voicegroup, 156 bpm, 32.5 s; this runs at the cue's 86 bpm, 16 bars, 44.7 s.
# Brief (sw_subject): cruising through space, calm wonder.
name: star-tidal
replaces: MUS_SAILING
form: LOOP
voicegroup: sailing                   # flute 73, strings 48, harp 46, xylophone 13, fretless 35, squares 80/81, wave 82
master_volume: 86
tempo: 86
steps_per_beat: 4
time_signature: [4, 4]
seed: 86

parts:
