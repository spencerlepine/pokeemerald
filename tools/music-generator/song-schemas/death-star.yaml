# Death Star (construction site, post-game): net-new dungeon loop (wiki row net:mus-death-star).
# ARRANGE of "Rescue of the Princess" (ref_tracks soundtrack:new-hope:07, the 1977 album cue built from the
# Death Star / detention-block music). Kept from the cue (analyze_reference, 0-50 s): its tempo (99.4 -> 100),
# A minor home, the Bb -> Am half-step that opens it (the Imperial menace of the first film), the Gm and D
# side-steps, and the brighter rescue span (Am7 | A | Esus4 | Bbm7 | A | Esus4 | Edim | A) where the brass
# climbs. The draft melody on an orchestra was too rough to quote note for note, so the half-step motif is
# written out from the cue's harmony: horn in a (the station), trumpet in b (the rescue).
# Chiptune cut-down: tuba roots, a wave-channel bass ticking eighths like machinery, a high string pedal,
# timpani on the downbeats, a 12.5 % square churning sixteenths and noise hiss as the station's hum.
# Brief (sw_subject): Death Star construction site (post-game): vast, mechanical, oppressive.
