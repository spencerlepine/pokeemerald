# Victory over a trainer: hot-swap of MUS_VICTORY_TRAINER (wiki audio:MUS_VICTORY_TRAINER). SCRATCH: no film cue,
# written from the brief (sw_subject): "Won a trainer battle."
# The everyday Rebel win: a 2-bar trumpet fanfare in D (arpeggio up, triplet kick on the A7), then an 8-bar
# victory loop in the Star Wars idiom: a bright trumpet tune with the flat-seven lift (C over the D pedal),
# tuba oom-pah, square-wave arpeggios and off-beats, and a light noise-channel snare and hats.
# 144 bpm (vanilla 136; 144 lands intro and loop on whole frames), 8-bar loop (13.3 s; vanilla 16.2 s), on the vanilla victory_trainer voicegroup.
