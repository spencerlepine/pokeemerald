# Boot cutscene (audio:MUS_INTRO, hot-swap): game/src/intro.c scenes 1 and 2, from the fade-in after the copyright
# screen until scene 3 starts MUS_INTRO_BATTLE (intro frame 2069, about 34.6 s). Original music in the Star Wars
# idiom (the wiki brief: "original composition; do not quote film themes"), scored to the picture like a film cue:
# the tempo changes from section to section (as vanilla MUS_INTRO does, 8 times) so every scene change lands on
# a bar line, and the hits inside a section sit on the 12-steps-per-beat grid at the frame of the event.
# Every position below is checked against the frames in ../cues/intro-boot.yaml by `cuesync.py check` (engine
# timing) and on the real ROM by `romsync.py` (frame log + recording).
#
#   bars 1-2   dawn, 108 -> 106 bpm  canyon before sunrise, D minor. Flute line rises as the big drop slides along
#                                    the overhang (bar 1 beat 3.25 = frame 74); harp runs down as it falls
#   bars 3-4   splash, 100 -> 98     bar 3 downbeat = the drop hits the pool (frame 269): low harp, timpani, strings
#                                    move to Bb; the two small drops ping on 3:4.5 and 4:1 (harp + square glints)
#   bars 5-7   rise, 126             the camera climbs the canyon: horn theme over harp and string arpeggios,
#                                    sparkles on the downbeat. Bar 7 is the Empire: the Lambda shuttle on beat 2.5
#                                    (Eb minor stab, frame 831), the TIE escort a triplet after beat 3 (D minor stab
#                                    and a square shriek, frame 855)
#   bar 8      suns, 114             the pan stops on the twin suns (frame 902): D major tutti, crash; cymbal swell
#                                    under the fade to white. D major is also the dominant of the chase
#   bars 9-17  chase, 156 (bar 17 160)  speeder vs Tusken raiders, G minor. Scene 2 lands on bar 9 (frame 1029, after
#                                    the 3 lag frames of the scene load). String ostinato, tuba, square arpeggios;
#                                    a steady snare groove and long brass lines under the raiders (no stab per pop:
#                                    the owner found that choppy). Trumpet theme when the speeder surges (bar 11),
#                                    sequence when it falls back (bar 13), held tension (15), run up as it races off
#   bars 18-19 finale, 136           the scrolling stops (frame 1857): G major hit, horn call under the fade to white
