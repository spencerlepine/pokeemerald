# Showcase Link 1 (Contest Hall, link play): hot-swap of MUS_LINK_CONTEST_P1 (wiki audio:MUS_LINK_CONTEST_P1,
# FACILITY / LOOP). The same piece as showcase.yaml (MUS_CONTEST), re-voiced, as the row asks: ARRANGE of
# "Augie's Great Municipal Band" (soundtrack:phantom-menace:17, the parade half), the Emperor's theme turned into
# a bright A major parade march over an A-E pedal, 144 bpm, 24-bar loop.
# Variant 1 re-voices it for the band organ: organ on the first strain, flute over a horn pad in the middle,
# trumpet and organ together on the return. 7 tracks like the vanilla link song.
# Brief (sw_subject): Link Showcase stage, variant 1.
