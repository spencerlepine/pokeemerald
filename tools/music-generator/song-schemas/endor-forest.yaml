# Endor Forest (MUS_ROUTE119, hot-swap): Endor's Route 119 and the open seas of Dagobah and Kamino (129-134).
# STYLE of "Ewok Celebration and Finale" (wiki audio:MUS_ROUTE119, ref soundtrack:return-jedi:11): an original
# melody, not a quote. Taken from the cue: its pulse (analyze_reference 73.8 bpm; doubled to 144 here, which
# makes the loop a whole number of frames, with the tunes moving in half time over it), its G minor / Bb major
# colour, the wooden hand drums of the Ewok chant and the finale's broad brass and strings.
#   intro 2 bars  hand drums, timpani, a held horn D to F#
#   a     8 bars  a chant-like tune on horn over hand drums (G minor)
#   b     8 bars  Bb major, the strings sing a broad line, harp underneath
#   c     8 bars  wandering: glockenspiel and a square trace arpeggios through Gm, Eb, Cm, D
#   d     8 bars  huge: trumpet over horn and strings, timpani and crash, landing on D for the return
# Brief (sw_subject): lush, wandering, huge scale. Vanilla voicegroup route119. Loop 32 bars, 53.3 s
# (vanilla 56.5 s).
