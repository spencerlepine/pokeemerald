# Encounter: cool trainers (pilots, aces). Hot-swap of MUS_ENCOUNTER_COOL (wiki audio:MUS_ENCOUNTER_COOL,
# ENCOUNTER / LOOP). STYLE of "The Last Battle" (wiki ref_tracks soundtrack:new-hope:15): an original tune, not a
# quote. Taken from the cue: its 136 bpm, the minor-key 16th-note ostinato under heroic brass calls, the snare
# and the climb into a bright major strain (the Rebel attack run). Brief (sw_subject): eye-contact jingle,
# cool trainers (pilots, aces). 2-bar sting, then a 16-bar loop (28.2 s; vanilla 27.4 s): E minor attack (8),
# the heroic C-D-G strain that turns on B7 (8). Trumpet, slap bass eighths, organ pad, square ostinato and
# off-beat stabs, wave counter-line, kick/snare, noise hats.
