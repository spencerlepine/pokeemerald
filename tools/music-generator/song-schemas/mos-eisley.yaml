# Mos Eisley spaceport (Tatooine), hot-swap of MUS_SLATEPORT. ARRANGE of "Inner City" (wiki
# soundtrack:new-hope:08, analyzed 0-90 s: 108 bpm, A minor, creeping chromatic harmony with Bb7 and F against
# Am7). Kept: the tempo (108), A minor, the cue's creeping chromatic low line and its Bb7/F7 side-steps (the
# shady part), now swung, with a reedy 12.5% square lead and a jazzy alien-band bridge (organ off-beats, flute
# with blue notes, rim and hats), so the street swaggers the way the cantina next door does.
#   intro  2 bars  walking bass and rim
#   a      8 bars  the creeping theme, reedy square over pizzicato and walking wave bass
#   b      8 bars  the band: flute, organ off-beats, a ii-V turnaround and the Bb7 tritone step to E7
#   a2     8 bars  the theme again with bell and a second square
#   c      8 bars  D minor bridge and the Bb7-E7 turn home
# 32-bar loop, 71 s (vanilla 82.3 s); vanilla slateport voicegroup. Swung eighths.
# Brief (sw_subject): Mos Eisley spaceport: shady and swaggering, jazzy alien-band colour, ships coming and going.
