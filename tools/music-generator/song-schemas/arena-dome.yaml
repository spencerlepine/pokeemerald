# Arena Dome (Grand Arena's Battle Dome): hot-swap of MUS_B_DOME (wiki audio:MUS_B_DOME). STYLE of "Augie's
# Great Municipal Band and End Credits" (wiki ref_tracks soundtrack:phantom-menace:17): an original melody, not a
# quote. Taken from the cue: a bright major-key victory parade, repeated-note fanfare pickups, a march beat with
# snare rolls and the Williams flat-side lift (G A Bb C back to D) for the big finish.
# Brief (sw_subject): Battle Dome bracket, crowd and fanfare. D major, 144 bpm (vanilla tempo) on the vanilla
# rock voicegroup: 75% square fanfare doubled an octave down by the organ, chugging overdrive guitar, wave bass,
# frlg kit march with noise hats, crash and snare rolls for the crowd. 28-bar loop (A, B, A, 4-bar lift),
# 46.7 s (vanilla 46.7 s).
