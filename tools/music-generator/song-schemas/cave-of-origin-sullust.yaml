    A3:4 C4:2 E4:2 | F4:6 E4:2 | E4:4 C4:2 A3:2 | A3:8 |
    D4:4 F4:2 A4:2 | Bb4:4 A4:2 F4:2 | A4:4 G4:2 F4:2 | G#4:8
  bell_a: "E4:8 | r:8 | r:8 | r:8 | r:8 | r:8 | r:8 | r:8"
  bell_turn: "r:8 | E4:8"

sections:
