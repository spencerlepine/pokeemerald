# Cave of Origin, Sullust: net-new per-planet split of MUS_CAVE_OF_ORIGIN (wiki row
# net:mus-cave-of-origin-sullust), for Starfall Cavern. SCRATCH: no film cue, written from the brief.
# The Dagobah original is a dark-side vergence (whispering pads, heartbeat pulse); on Sullust the same dread sits
# in a volcanic cave where meteor fire fell: E Phrygian (the E-F half step everywhere), a timpani lub-dub
# heartbeat pedal on E, a tuba groaning under a single string line, a 50 % square ember melody first, then the
# horn takes it into Bb (the tritone) before a 2-bar turn back. Tempo, voicegroup and loop length from the
# vanilla song (MUS_CAVE_OF_ORIGIN: cave_of_origin, 100 bpm, 43.8 s AMBIENT loop).
# Brief (sw_subject): Sullust version of MUS_CAVE_OF_ORIGIN, same role and mood family; theme to be decided.
name: cave-of-origin-sullust
constant: MUS_CAVE_OF_ORIGIN_SULLUST
form: AMBIENT
voicegroup: cave_of_origin        # vanilla's own: bell 14, harp 46, timpani 47, strings 48, tuba 58, horn 60, squares, waves
master_volume: 80
tempo: 100
steps_per_beat: 2                 # eighth-note grid
time_signature: [4, 4]
seed: 8

parts:
  ember:   {program: 5,  channel: 0, volume: 56,  pan: 14,  gate: 0.9, mono: true}
  horn:    {program: 60, channel: 1, volume: 90,  pan: -10, gate: 0.95, humanize: {vel: 4}}
  strings: {program: 48, channel: 2, volume: 64,  pan: 24,  gate: 1.0}
  tuba:    {program: 58, channel: 3, volume: 84,  pan: -20, gate: 0.95}
  timpani: {program: 47, channel: 4, volume: 90,  pan: 6,   gate: 1.0}
  bell:    {program: 14, channel: 5, volume: 60,  pan: -32, gate: 1.0}
  bass:    {program: 81, channel: 6, volume: 76,  pan: 0,   octave: 2, role: bass, gate: 0.95}
  flicker: {program: 80, channel: 7, volume: 36,  pan: 36,  octave: 4, gate: 0.5, mono: true}

