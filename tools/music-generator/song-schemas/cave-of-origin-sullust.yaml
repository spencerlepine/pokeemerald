    E4:3 F4:1 G4:4 | A4:2 G4:2 F4:4 | E4:3 F4:1 G4:2 B4:2 | C5:6 A4:2 |
    D5:3 C5:1 A4:4 | C5:2 A4:2 F4:4 | G4:3 F4:1 E4:4 | E4:6 r:2
