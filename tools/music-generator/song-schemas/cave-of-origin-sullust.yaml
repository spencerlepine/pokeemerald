  tuba_a: "E2:6 F2:2 | F2:8 | E2:6 F2:2 | F2:8 | D2:8 | F2:8 | E2:8 | E2:6 F2:2"
  tuba_b: "A1:8 | F2:8 | A1:8 | F2:8 | D2:8 | Bb1:8 | F2:8 | E2:8"
