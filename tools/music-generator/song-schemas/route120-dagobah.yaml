# Dagobah long routes (Routes 126-128): net-new per-planet split of MUS_ROUTE120. STYLE of "Yoda and the Force"
# (wiki net:mus-route120-dagobah, ref_tracks soundtrack:empire-strikes-back:13): an original melody, not Yoda's
# theme. Taken from the cue: a slow, reverent Eb major with Williams' borrowed minor chords (Abm, Gb) for the
# mystery, a broad horn and string line answered by flute, harp shimmer and a twinkling square line like the
# cue's celesta. Tempo the cue's own, about 76. Tech from the placeholder MUS_ROUTE120 (LOOP, ~57 s): loop 16
# bars, 50.5 s, on the placeholder's route120 voicegroup.
# Brief (sw_subject): Dagobah version of Route 120, same hopeful and sweeping long-route mood.
