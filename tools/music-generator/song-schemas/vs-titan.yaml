# Vs Titan. Hot-swap of MUS_VS_KYOGRE_GROUDON (wiki audio:MUS_VS_KYOGRE_GROUDON): the battles with SANDO and
# GREATKRAYT. ARRANGE of "Anakin vs. Obi-Wan" (soundtrack:revenge-sith:09), from analyze_reference over 0:00-1:15
# (92 bpm, the melody draft per bar; its best loop candidate is bars 9-21) plus knowledge of the cue: the low
# D minor statement (A D A D... D E F, E C E, home to D) that opens the duel, the B minor stretch over a pedal with
# its E-major lifts and the climb to F#5, and the turn through Am7 and G minor into E Phrygian and a held F#. Made
# colossal for the brief: the opening line on low horn, pounding sixteenth timpani in place of a kick, a low string
# ostinato, tubular bell and crash on the big downbeats. Kept at the cue's 92 bpm. Vanilla voicegroup. Brief
# (sw_subject): SANDO and GREATKRAYT: colossal, primal.
