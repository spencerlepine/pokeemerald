# Victory over an arena leader: hot-swap of MUS_VICTORY_GYM_LEADER (wiki audio:MUS_VICTORY_GYM_LEADER). STYLE of
# "The Throne Room and End Title" (wiki ref_tracks soundtrack:new-hope:16): an original tune, not a quote (the
# title screen already arranges the Throne Room march). Taken from the cue: a 120 bpm ceremonial march, the tune
# over a tonic pedal that slides to the flat-sixth and the minor-four chords above it (Gb/Bb, Ebm/Bb), brass
# triplet pickups, timpani and orchestral snare, a lyrical second strain for flute and horn.
# Brief (sw_subject): "Beat an arena leader: bigger victory." Bigger than the trainer victory: a 2-bar fanfare,
# then a 24-bar processional in Bb major (march, second strain, full tutti) that loops on its own F7 triplet
# pickup.
# 120 bpm like vanilla, 24-bar loop (48 s, as vanilla, frame-exact), vanilla victory_gym_leader voicegroup.
