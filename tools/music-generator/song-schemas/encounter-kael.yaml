# Encounter: KAEL, the rival (when the player is MIRA). Hot-swap of MUS_ENCOUNTER_BRENDAN
# (wiki audio:MUS_ENCOUNTER_BRENDAN, ENCOUNTER / LOOP). STYLE of "Anakin's Theme" (wiki ref_tracks
# soundtrack:phantom-menace:03): an original tune, not a quote. Taken from the cue: a lyrical, hopeful melody in A
# that keeps turning dark (the minor iv, Dm, and a Bb shadow) and a closing strain that hints at what the rival
# could become; the cue's ~78 bpm doubled to 156 so it drives like a rival encounter.
# Brief (sw_subject): rival theme. 2-bar sting, then a 20-bar loop (30.8 s; vanilla 30.0 s):
#   a  8 bars  flute: the innocent tune (A, F#m, D, E / A, C#m, Dm, E)
#   b  8 bars  trumpet: the bolder answer through F, G, Em, Am, Dm, Bb
#   c  4 bars  trumpet: the shadow, Am / Bb / Am / E over square 16ths, back to the tune
# Nylon guitar arpeggios, synth bass eighths, square harmony, wave doubling, kick/snare, noise hats.
