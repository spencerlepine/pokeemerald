# Cloud City (Bespin), hot-swap of MUS_LILYCOVE. ARRANGE of "The City in the Clouds" (wiki
# soundtrack:empire-strikes-back:11, analyzed 0-90 s: 86 bpm, G minor; Gm, Eb, Cm7, G, Dsus4 in the opening bars).
# Kept: the tempo (86), G minor with the cue's Gm-Eb-Cm-D opening, its shimmering harp/celesta sixteenths, the
# long airy woodwind line over string pads and the warm horn answer; the hidden edge is the minor ninth (Eb) the
# harp leans on over each D chord.
#   intro  2 bars  harp shimmer on Gm
#   a      8 bars  flute line over harp, strings, square bells
#   b      8 bars  the horn answers in Bb, ending on D for the return
# 16-bar loop, 44.7 s (vanilla 55.9 s); vanilla lilycove voicegroup.
# Brief (sw_subject): Big sky and sea cities: elegant and airy, shimmering strings, luxury with a hidden edge.
name: cloud-city
replaces: MUS_LILYCOVE
