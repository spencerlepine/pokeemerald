# Medal ceremony (Yavin 4): hot-swap of MUS_HALL_OF_FAME (wiki audio:MUS_HALL_OF_FAME, EVENT / LOOP).
# The row's ref_use is ARRANGE of the Throne Room march (soundtrack:new-hope:16), but its brief (sw_subject) says
# "original composition; do not quote film themes", and the march itself is already the title screen
# (title-throne.yaml). So this takes the cue's idiom, not its tune: an original ceremonial march at the cue's
# 120 bpm (119.3), stately dotted brass over Williams' borrowed chords (Ebm, Gb, Ab: iv, bVI, bVII in Bb major).
# Brief (sw_subject): medal ceremony on Yavin 4, triumphant and ceremonial.
#   intro  2 bars, once: trumpet call
#   loop   18 bars, 36 s (vanilla 35.7 s): march (8), second strain through Gb and Ab (8), a 2-bar turn on F7
# Trumpet tune, horn inner line, string pad, wave bass, timpani on the bass line, noise snare, crash,
# both squares as after-beat chords.
