# Encounter: rich trainers. Hot-swap of MUS_ENCOUNTER_RICH (wiki audio:MUS_ENCOUNTER_RICH): eye-contact music for
# the 17 nobles and gamblers. SCRATCH (no film cue): an original courtly waltz in Eb, the kind of string-and-flute
# salon music a Star Wars palace or casino plays, with a sly V/V (F7) turn before the loop. Tuba oom on the
# downbeat, piano and square on the pah-pah, flute on top, strings swelling into the last phrase. Kept on the
# vanilla voicegroup and tempo. Brief (sw_subject): eye-contact jingle, rich trainers (nobles, gamblers).
