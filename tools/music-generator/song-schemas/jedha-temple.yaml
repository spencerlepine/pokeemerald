# Inside Jedha Temple (and the Espa Generator / Wampa Cave interiors until their splits land): hot-swap of
# MUS_MT_PYRE (wiki audio:MUS_MT_PYRE, AMBIENT). STYLE of "Anakin's Dream" (ref_tracks soundtrack:revenge-sith:02):
# no quote. Taken from the cue: a slow, grieving D minor, a choir-like sustained chord pad that moves by
# common tones (Dm, Bb, Gm/Bb, A with its suspension), a solemn horn line, and a bell for the vigil. The temple:
# the chords as a string "choir", a soft wave hum under them, a breath of noise, and a square echo that
# repeats the horn's phrase ends from far away. Vanilla: mt_pyre voicegroup, 90 bpm, 53.3 s loop; this one 56 bpm,
# 12 bars, 51.4 s.
# Brief (sw_subject): reverent and eerie, choral pads.
