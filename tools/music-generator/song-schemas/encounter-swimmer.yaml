# Encounter: swimmers. Hot-swap of MUS_ENCOUNTER_SWIMMER (wiki audio:MUS_ENCOUNTER_SWIMMER): eye-contact music for
# the 94 swimmers. SCRATCH (no film cue): an original sunny F major tune with a lilting 3+3+2 calypso bass, the
# water-planet side of Star Wars (Naboo lakes, Mon Cala reefs): bright square lead, horn holding the harmony,
# harp rippling in eighths, kick and tambourine. Vanilla voicegroup and tempo. Brief (sw_subject): eye-contact
# jingle, swimmers.
