# Ancient vaults with Aurebesh puzzles (Tusken Ruins, Ancient Tomb, Ice Grotto, Sealed Vault): hot-swap of
# MUS_SEALED_CHAMBER (wiki audio:MUS_SEALED_CHAMBER, AMBIENT). STYLE of "The Walls Converge" (ref_tracks
# soundtrack:new-hope:13): no quote. Taken from the cue: a quick, mechanical pulse (136, just under the vanilla 140), a low
# ostinato grinding on C against Db, horn stabs a tritone apart, timpani that lurch in off the beat. Made
# eerie and sparse for a puzzle room: the ostinato plays soft and drops out for bars at a time, a square
# ticks like a lock mechanism, a bell pings each solved glyph, a high flute hangs over it all.
# Vanilla: sealed_chamber voicegroup, 140 bpm, 36.0 s loop; this one 136 bpm, 20 bars, 35.3 s.
# Brief (sw_subject): eerie and sparse.
