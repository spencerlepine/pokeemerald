# the 120 bpm pulse (its double-time candidate, also the vanilla tempo). Brief (sw_subject): the EXOGORTH descends
# from the asteroid field and calms the titans; awe, huge low choir.
#   bars 1-4   swirl: low organ choir on Am / Gm, square 16ths circling, taiko rumble, wave pedal
