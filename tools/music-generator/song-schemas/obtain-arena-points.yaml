# Obtain arena points (MUS_OBTAIN_B_POINTS, hot-swap): a one-shot sting. SCRATCH (wiki audio:MUS_OBTAIN_B_POINTS,
# no film cue). Brief: "Earned Grand Arena points." A short gladiatorial brass call in C in the Star Wars idiom:
# repeated-note trumpet pickup, a leap up the triad, then the flat-seventh Bb chord (the Williams lift) and three
# hammered Cs into a high C, with horn harmony, a tubular bell on the last hit, snare and crash, wave bass and
# square arpeggios. 122 bpm (vanilla's), two 4/4 bars: 3.9 s against vanilla's 4.1 s, on the vanilla b_frontier
# voicegroup.
