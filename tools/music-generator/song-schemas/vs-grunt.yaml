# Vs Grunt. Hot-swap of MUS_VS_AQUA_MAGMA (wiki audio:MUS_VS_AQUA_MAGMA): battles against stormtroopers and cartel
# thugs. ARRANGE of "Imperial Attack" (soundtrack:new-hope:02), from analyze_reference over 0:00-1:15 (A minor,
# 76 bpm with a 148-152 double, chords Am-E and the Bb-E tritone swing) plus knowledge of the cue: the triplet
# brass call that answers the Tantive IV chase (ta-ta-ta TAA, a fourth up) over an Am-Bb string ostinato, the
# Phrygian E-F menace strain in the low brass, and a held E pedal with timpani that winds the loop back. Played at
# the cue's double time (152) for a battle, horn lead since the vanilla voicegroup has no trumpet, orchestral
# snare and timpani the way the vanilla battle songs drum. Brief (sw_subject): stormtroopers and cartel thugs:
# menacing march, works for both factions.
