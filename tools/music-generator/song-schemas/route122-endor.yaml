    E5:4 E5:2 F#5:2 G5:4 A5:4 | B5:4 A5:2 F#5:2 D5:8 | E5:2 D5:2 C5:4 D5:2 E5:2 F#5:4 | E5:12 r:4
  horn_a: |
    r:16 | r:8 F#4:4 E4:4 | r:16 | r:8 C#4:4 E4:4 | r:16 | r:8 A4:4 F#4:4 | G4:8 A4:8 | B4:12 r:4
  chant_b: |
    G5:6 E5:2 C5:8 | A5:6 F#5:2 D5:8 | B5:4 A5:4 G5:4 F#5:4 | E5:12 r:4 |
    G5:6 E5:2 C5:8 | A5:6 F#5:2 D5:8 | D5:4 F#5:4 E5:4 C#5:4 | D#5:12 r:4
  horn_b: |
    C4:16 | D4:16 | E4:16 | B3:16 | C4:16 | D4:16 | D4:8 C#4:8 | D#4:16
  pad: "^2:16"
  bass_a: "^1:4 r:2 ^1:2 ^5-:4 ^1:4"
