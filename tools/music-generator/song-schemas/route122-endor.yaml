# Endor road (Route 123): net-new per-planet split of MUS_ROUTE122. SCRATCH (wiki net:mus-route122-endor, no
# film cue): written from the brief. The Jedha original is a mystic pilgrim road with a chant-like line; this is
# its forest cousin: E dorian at the placeholder's 124 bpm, a modal flute chant answered by horn, a hollow
# square drone, wave bass and Ewok-style log drums (toms and congas) instead of a kit backbeat.
# Tech from the placeholder MUS_ROUTE122 (route122 voicegroup, LOOP, ~50 s): loop 24 bars, 46.5 s.
# Brief (sw_subject): Endor version of Route 122, same mystic-road mood family as the Jedha original.
name: route122-endor
constant: MUS_ROUTE122_ENDOR          # wiki sw_constant (net:mus-route122-endor)
form: LOOP
voicegroup: route122                  # flute 73, horn 60, strings 48, tuba 58, timpani 47, kit 0, squares, wave
master_volume: 84
tempo: 124
steps_per_beat: 4
time_signature: [4, 4]
seed: 122

parts:
  flute:   {program: 73, channel: 0, volume: 98,  pan: 10,  range: [E4, E6], gate: 0.94, lfo_speed: 30, lfo_delay: 20, mod: 4, humanize: {vel: 6}}
  horn:    {program: 60, channel: 1, volume: 92,  pan: -10, range: [B3, E5], gate: 0.95}
  strings: {program: 48, channel: 2, volume: 60,  pan: -24, octave: 4, range: [G3, B4], gate: 1.0}
  bass:    {program: 81, channel: 3, volume: 104, pan: 0,   octave: 2, range: [E2, E3], gate: 0.75, role: bass}
  logs:    {program: 0,  channel: 4, volume: 76,  pan: 14,  role: drums, kit: {lo: 41, mid: 43, hi: 45, conga: 62, congalo: 64, tamb: 54}}
  drone:   {program: 80, channel: 5, volume: 34,  pan: -30, range: [E3, E5], gate: 1.0, mono: true}
  echo:    {program: 82, channel: 6, volume: 36,  pan: 32,  range: [E4, E6], gate: 0.6, mono: true}

progressions:
  intro: "Em | Em"
  a:     "Em | D | Em | A | Em | D | C:8 D:8 | Em"
  b:     "C | D | Em | Em | C | D | Bm:8 A:8 | B"

