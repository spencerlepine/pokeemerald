    r:8 E6:2 r:6 | r:8 D6:2 r:6 | r:8 B5:2 r:6 | r:8 E6:2 r:6 | r:8 G5:2 r:6 | r:8 A5:2 r:6 | r:8 F#5:2 r:6 | r:8 B5:2 r:6

