# Showcase Link 2 (Contest Hall, link play): hot-swap of MUS_LINK_CONTEST_P2 (wiki audio:MUS_LINK_CONTEST_P2,
# FACILITY / LOOP). The same piece as showcase.yaml (MUS_CONTEST), re-voiced, as the row asks: ARRANGE of
# "Augie's Great Municipal Band" (soundtrack:phantom-menace:17, the parade half), the Emperor's theme turned into
# a bright A major parade march over an A-E pedal, 144 bpm, 24-bar loop.
# Variant 2 re-voices it lighter: nylon guitar plucks the first strain over strings, flute and a square
# sparkle in the middle, trumpet with a square-wave echo on the return. 7 tracks like the vanilla link song.
# Brief (sw_subject): Link Showcase stage, variant 2.
