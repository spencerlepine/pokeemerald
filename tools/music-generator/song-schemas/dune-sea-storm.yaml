# Dune Sea Storm (MUS_DESERT, hot-swap): the Route 111 sandstorm on the Dune Sea. ARRANGE of "The Land of the
# Sandpeople" (wiki audio:MUS_DESERT, ref soundtrack:new-hope:10). The row has no tech notes (MUS_DESERT is not a
# .mid in this game's midi.cfg; its slot plays mus_route111), so they come from vanilla mus_route111: voicegroup
# route111, volume 76, 120 bpm, 40 s loop. analyze_reference read the cue at 112.3 bpm (112 here) around D, with
# the loop candidate on its first ten bars: the Tusken music's low, stamping ostinato on a half-step (D, Eb, C)
# under primitive drums, and the wailing double-reed line that bends a half step above the fifth (A, Bb).
#   a  8 bars  the ostinato on the wave channel, toms, congas and timpani, the storm in the noise channel
#   b  8 bars  the wail on horn over a string drone, a square shriek answering it
#   c  4 bars  the storm peaks: tom rolls, timpani, the wind up high, then back to the ostinato
# Brief (sw_subject): howling wind, driving percussion. Loop 20 bars, 42.9 s (AMBIENT range 34.7-77 s).
name: dune-sea-storm
