# Route 104, Kashyyyk version (MUS_ROUTE104_KASHYYYK, net-new): the Kashyyyk archipelago routes (105-109).
# SCRATCH (wiki net:mus-route104-kashyyyk has no film cue): written from the brief, in the family of the Tatooine
# Canyon Route (plucked strings and wind over hand drums) but greener and bigger: D Mixolydian (the C natural
# gives it a folk, open-air lift), a broad horn tune for the Wookiee forests, a wave-channel "flute" for the sea
# breeze, harp plucks, and log-drum toms. Tech notes from the placeholder vanilla MUS_ROUTE104: voicegroup
# route104, volume 97, 128 bpm.
#   intro 1 bar  harp and drums
#   a     8 bars the horn tune (D, C, G: Mixolydian)
#   b     8 bars B minor: the wave "flute" sings over the harp, horn holding
#   c     4 bars drum break with horn calls, turning on A back to a
# Brief (sw_subject): Kashyyyk version of the Tatooine coast-route theme, same role and mood family.
# Loop 20 bars, 37.5 s (the vanilla loop exactly).
