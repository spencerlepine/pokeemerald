# Opening crawl (net:mus-intro-crawl, MUS_INTRO_CRAWL): plays once, new game only, from the moment the logo
# starts receding on the title screen (title_screen.c StartTitleScreenCrawlOut) through the crawl
# (intro_crawl.c) until the fade into the main menu, about 77 s. ARRANGE of the 1977 main title as it plays
# under the original crawl (wiki ref concept:intro-crawl-1977, the owner's recording; also
# soundtrack:new-hope:01): Bb major, ~101 bpm in the film, 102 here.
#   bars 1-4   fanfare blast while the logo recedes
#   bars 5-20  the main theme: A, A, B, A (crawl text starts during bar 2)
#   bars 21-28 softer: theme on flute over harp, the B strain on strings
#   bars 29-32 the crawl's ending: high strings settling, as the film pans down into space
#   bars 33-36 coda: a quiet loop, so a long pause on the "Skip intro?" box never ends in silence
# The scene fades the music out (FadeOutBGM) around bar 33, so the full arrangement is longer than the scene.
name: intro-crawl
constant: MUS_INTRO_CRAWL
form: CUE
voicegroup: title             # trumpet 56, horn 60, strings 48, timpani 47, harp 46, flute 73, glock 9, squares, wave
master_volume: 90
tempo: 102
steps_per_beat: 12            # triplet eighths (4) and dotted eighth + sixteenth (9 + 3) on one grid
