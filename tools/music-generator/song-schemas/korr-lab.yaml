# Prof. Korr's Lab (Mos Pelgo, Tatooine): hot-swap of MUS_BIRCH_LAB (wiki row audio:MUS_BIRCH_LAB).
# SCRATCH: no film cue, written from the brief. A bouncy F major building loop with a curious streak: the
# melody keeps peeking at odd corners (a B diminished seventh, a D7 side-step, a Db -> C7 slide back home).
# Strings play pizzicato (staccato eighths), a 50 % square bubbles sixteenth-note arpeggios, the flute has the
# tune in a and b, the other square answers in c (the flute joins its last bar), fretless bass and a light kick / hat / clap kit.
# Vanilla voicegroup, volume and tempo (birch_lab, 80, 100 bpm); 12-bar loop at 100 = 28.8 s, the vanilla length.
# Brief (sw_subject): Prof. Korr's xenobiology lab: curious and bubbly, light synth arpeggios over pizzicato
# strings.
