# Mustafar (MUS_MT_CHIMNEY, hot-swap): the dangerous places (Mustafar Peak, the Sandcrawler, the Krayt Graveyard,
# the Drowned Cavern, the Asteroid Spire until their own versions are in). STYLE of "The Immolation Scene" (wiki
# audio:MUS_MT_CHIMNEY, ref soundtrack:revenge-sith:12): an original melody, not a quote. Taken from the cue: its
# pulse (analyze_reference 136 bpm, the lament moving in half time over it), E minor with the Phrygian-tinged
# turns to C and B, the tragic low-brass line over a pounding pedal, and the brass climax.
#   intro 2 bars  the heartbeat pedal on the wave channel, timpani, horn and tuba holding E
#   a     8 bars  the lament on horn, anvil strokes on 3
#   a2    8 bars  the lament again with a string counter-line
#   b     8 bars  the climax: trumpet takes the line, horn below, crash and anvils
#   c     8 bars  agitated string eighths over A minor, snare building
#   a3    8 bars  horn and tuba together, low and heavy, back to a
# Brief (sw_subject): ominous heat, low brass and anvil hits. vanilla voicegroup mt_chimney. Loop 40 bars,
# 70.6 s (vanilla 90 s; the longest loop the LOOP range allows at this tempo in whole 8-bar phrases).
