# Cantina band (Chalmun's Spaceport Cantina, Mos Eisley): net-new MUS_CANTINA_BAND (wiki net:mus-cantina-band).
# The row's ref_use is ARRANGE of "Cantina Band" (wiki ref_tracks soundtrack:new-hope:09), but its sw_subject and the
# design (bible/NET_NEW_DESIGNS.md, Music) ask for an original tune, NOT the film's melody, so this takes the cue's
# idiom and nothing else: a hot small-band swing in A minor with the cue's Asus4 / Am7 / Dm colour (analyze_reference,
# 0-60 s), bluesy chromatic leading notes, a reedy clarinet-like lead, kloo-horn offbeat pushes, steel-drum-like
# mallets in the bridge, walking bass and brushed drums.
# Brief (sw_subject): Mos Eisley Cantina band loop for the cantina map. Tech notes from the placeholder MUS_GAME_CORNER
# (game_corner voicegroup, volume 72). 200 bpm with triplet swing, short 32-bar loop (A, A, bridge, A), 38.4 s.
