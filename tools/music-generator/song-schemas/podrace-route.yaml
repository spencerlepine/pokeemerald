# Podrace Route (MUS_ROUTE110, hot-swap): Tatooine's and Sullust's main overland routes, the Boonta Eve course
# among them. ARRANGE of "Anakin Defeats Sebulba" (wiki audio:MUS_ROUTE110, ref soundtrack:phantom-menace:09).
# analyze_reference read the cue at 86.1 bpm with 167 as the double candidate: the race runs in cut time over a
# 16th-note engine ostinato, so it is written at 172 (double, even). Taken from the cue: the D minor race with
# its repeated-note brass calls over the pounding engine figure, then the turn to D major when Anakin crosses the
# line. The analyzer's melody draft was unusable on the full orchestra, so the brass lines are written in the
# cue's manner:
#   intro 2 bars  engine ostinato (square 16ths), wave bass and timpani
#   a     8 bars  D minor race: trumpet calls, horn hits, snare and tambourine
#   b     8 bars  D major: the victory tune on trumpet, square counter-line
#   c     8 bars  the race again with the horn on the tune and string hits, back to a
# Brief (sw_subject): fast, engine-driven, energetic. Loop 24 bars, 33.5 s (vanilla 36.4 s).
