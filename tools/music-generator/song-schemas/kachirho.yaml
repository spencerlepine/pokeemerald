    Bb3:6 C4:2 D4:4 F4:4 | E4:6 D4:2 C4:8 | A3:6 C4:2 E4:4 A3:4 | A3:8 C#4:8
  echo_b: |
    r:12 F5:2 D5:2 | r:12 E5:2 G5:2 | r:12 A5:2 F5:2 | r:8 D5:2 F5:2 A5:2 D6:2 |
    r:12 F5:2 D5:2 | r:12 G5:2 E5:2 | r:12 C5:2 E5:2 | r:8 E5:2 C#5:2 A4:4
