# Kachirho (Kashyyyk), hot-swap of MUS_DEWFORD. SCRATCH: written from the brief, no film cue. D minor
# pentatonic over a log-drum groove (low and high toms, kick, congas on the vanilla rs kit), a wooden flute tune,
# a warm low horn that takes the tune in the middle, xylophone calls in the canopy section.
#   intro  2 bars  log drums and the wave bass
#   a      8 bars  flute tune, horn pad
#   b      8 bars  the horn sings the tune low, flute answers on the square echo
#   c      8 bars  high flute, xylophone ostinato, the drums open up; ends on A major back to D minor
# 94 bpm (vanilla's), 24-bar loop of 61 s against vanilla's 66.4 s; vanilla dewford voicegroup.
# Brief (sw_subject): Kachirho on Kashyyyk: Wookiee tree-village, deep log drums, wooden flutes and warm low horns.
name: kachirho
replaces: MUS_DEWFORD
form: LOOP
voicegroup: dewford               # kit 0, xylophone 13, horn 60, flute 73, squares 80/81, wave 82, noise 126
master_volume: 80
tempo: 94
steps_per_beat: 4
time_signature: [4, 4]
seed: 12

parts:
  flute:  {program: 73, channel: 0, volume: 100, pan: 10,  range: [D4, D6], gate: 0.95, lfo_speed: 30, lfo_delay: 20, mod: 6, humanize: {vel: 6}}
  horn:   {program: 60, channel: 1, volume: 94,  pan: -14, octave: 3, range: [A2, F4], gate: 0.97}
  xylo:   {program: 13, channel: 2, volume: 74,  pan: 26,  octave: 5, range: [D5, A6], gate: 0.6}
  bass:   {program: 82, channel: 3, volume: 100, pan: 0,   octave: 2, range: [D2, D3], gate: 0.75, role: bass}
  drums:  {program: 0,  channel: 4, volume: 92,  pan: -4, role: drums, kit: {kick: 36, tlo: 41, tmid: 45, thi: 48, conga: 62, clo: 64}}
  shaker: {program: 126, channel: 5, volume: 30, pan: 18, role: drums, kit: {s: A6}}
  echo:   {program: 80, channel: 6, volume: 40,  pan: -32, range: [D4, D6], gate: 0.5, mono: true}

progressions:
  intro: "Dm | Dm"
  a:     "Dm | C | Dm | Am | Dm | C | Bb | C"
  b:     "Bb | C | Dm | Dm | Bb | C | Am | A"
  c:     "Dm | F | G | Dm | Dm | F | C | A"

