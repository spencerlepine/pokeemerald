# vs. the Warden golems: hot-swap of MUS_VS_REGI (wiki audio:MUS_VS_REGI). STYLE of "The Duel" (wiki ref_tracks
# soundtrack:empire-strikes-back:14): an original melody, not a quote. Taken from the cue: its ~150-160 bpm pulse,
# B minor shadowed by chords a semitone off (C over a B pedal, Bb minor, Ab against G), low brass over grinding
# ostinatos, timpani. Brief (sw_subject): "Warden golems behind the Aurebesh vaults: mechanical, ancient."
# Mechanical: a square-wave clockwork ostinato, pizzicato ticks and a fixed industrial drum pattern that never
# swings. Ancient: a slow horn chant that moves by step and half step, answered by high strings.
# 160 bpm like vanilla, 2-bar intro, 40-bar loop (60 s, as vanilla; any bar count is frame-exact at 160 bpm),
# on the vanilla vs_regi voicegroup.
