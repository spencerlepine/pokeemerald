# Bright Tree Village (Endor), hot-swap of MUS_FORTREE. ARRANGE of "Parade of the Ewoks" (wiki
# soundtrack:return-jedi:04, analyzed 0-90 s: 117.5 bpm, A minor, a two-beat parade with modal turns to G minor
# and Bb). Kept: the parade's tempo (120, frame-exact for the loop), A minor, its oom-pah bassoon bass and
# off-beat chords, a piccolo-style tune with snapped dotted figures on the flute (written in the parade's manner:
# the analyzer's melody draft was too rough to quote the march note for note), and its wooden toy percussion
# (congas, tambourine, light snare on the vanilla petalburg kit, noise shaker).
#   intro  1 bar   bass and drums
#   a      8 bars  the parade tune, flute, square off-beats
#   b      8 bars  the trio in C major: square lead, flute answering high, back to E for the return
# 16-bar loop, 32 s (vanilla 33.8 s); vanilla fortree voicegroup.
# Brief (sw_subject): Bright Tree Village on Endor: Ewok treetop village, playful wooden percussion, pipes and canopy echoes.
