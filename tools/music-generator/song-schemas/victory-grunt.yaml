# Victory over grunts: hot-swap of MUS_VICTORY_AQUA_MAGMA (wiki audio:MUS_VICTORY_AQUA_MAGMA). SCRATCH: no film cue,
# written from the brief (sw_subject): "Beat Imperial or cartel grunts."
# A short Rebel brass fanfare (Bb major, rising fourths and a flat-seven F7 kick, Williams' heroic shape) and then
# a cocky little 8-bar victory loop: trumpet tune over a fretless walking bass, square-wave arpeggios, harp and a
# noise snare, with the Eb -> F lift and a Cm-F7 turnaround back into the top.
# 144 bpm (vanilla 142; 144 makes the loop a whole number of frames), 2-bar fanfare, 8-bar loop (13.3 s; vanilla
# 12.1 s), on the vanilla victory_aqua_magma voicegroup.
