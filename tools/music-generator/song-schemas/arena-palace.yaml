  root:  "^1:6 ^3:2"
  pad:   "^2:8"
  tune_a: |
    B4:4 E5:2 D5:2 | E5:3 D5:1 C5:2 B4:2 | A4:4 C5:2 E5:2 | D5:6 r:2 |
    B4:2 G4:2 A4:2 B4:2 | C5:4 E5:2 G5:2 | F#5:3 E5:1 D5:2 A4:2 | B4:6 r:2
  tune_b: |
