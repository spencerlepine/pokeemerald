# Arena Palace (Grand Arena): hot-swap of MUS_B_PALACE (wiki audio:MUS_B_PALACE, FACILITY / LOOP).
# STYLE of "The High Council Meeting and Qui-Gon's Funeral" (soundtrack:phantom-menace:16): an original melody,
# not a quote. Taken from the cue: E minor colour, the funeral's slow 76 bpm pulse (the cue's 152 halved), a
# solemn line over a gently rocking accompaniment, a low drum like the pyre's procession, bells at the phrase ends.
# Brief (sw_subject): Battle Palace, calm, meditative, temple-like.
name: arena-palace
replaces: MUS_B_PALACE
form: LOOP
voicegroup: b_palace              # vanilla: gamelan 10, nylon guitar 24, fretless 35, harp 46, drumset 0, squares, waves
master_volume: 100
tempo: 76
steps_per_beat: 2                 # eighth-note grid
time_signature: [4, 4]
seed: 21

parts:
  gamelan: {program: 10, channel: 0, volume: 96,  pan: 6,   range: [E4, G5], gate: 0.95, humanize: {vel: 5}}
  harp:    {program: 46, channel: 1, volume: 78,  pan: -22, octave: 3, gate: 0.9, humanize: {vel: 6}}
  bass:    {program: 35, channel: 2, volume: 96,  pan: 0,   octave: 2, gate: 0.92, role: bass}
  drums:   {program: 0,  channel: 3, volume: 70,  pan: 14,  role: drums, kit: {taiko: 50, tri: 80, gong: 61}}
