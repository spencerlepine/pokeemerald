# Fortress Vader (Mustafar): net-new dungeon loop. ARRANGE of "The Imperial March (Darth Vader's Theme)"
# (wiki ref_tracks soundtrack:empire-strikes-back:05). Chiptune cut-down: trumpet theme, horn doubling an octave
# down, one string line, wave-channel bass moving with the brass chords, timpani on the strong bars, noise snare.
