# Arena pit (Grand Arena's Battle Arena): hot-swap of MUS_B_ARENA (wiki audio:MUS_B_ARENA). ARRANGE of "Love
# Pledge and the Arena" (wiki ref_tracks soundtrack:attack-clones:12), the Arena half as ref_notes asks
# (analyze_reference --start 330 --end 450): the cue's driving pulse (its 133 bpm candidate, 132 here), A minor
# darkened by the Phrygian Bb and the E-Bb tritone (its Edim / Bb7 bars), the Bm7-Gm-Gm swing of its middle
# (bars 20-27) and the Bbm Bb7 Fm C7 E climb (bars 42-48). The brass call is cut down to a modal line for the
# vanilla voicegroup's shakuhachi with the square taking the heroic answer; the cue's pounding ostinato goes to the
# wave bass and koto.
# Brief (sw_subject): Battle Arena, gladiator pit, pounding drums. Vanilla b_arena voicegroup: taiko kit,
# shakuhachi, koto, harp, squares, waves. 28-bar loop (call, answer, climb, 4-bar drum break), 50.9 s (vanilla 50.7 s).
