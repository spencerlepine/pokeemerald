# Canyon Route (MUS_ROUTE104, hot-swap): the breezy coast and island routes (Tatooine's Route 104, 115-116).
# ARRANGE of the "Kids at Play" half of "Watto's Deal and Kids at Play" (wiki audio:MUS_ROUTE104, ref
# soundtrack:phantom-menace:11, ref_notes "the Kids at Play half"; analyze_reference --start 150 --end 280).
# Taken from the cue: its tempo (99.4 bpm, 100 here), the skipping scherzo feel of the slave-quarters children
# (light woodwind over plucked strings and hand percussion) and its harmony, A major with the cue's turn to
# A minor and F. The analyzer's melody draft was too rough on the orchestra to use, so the tune is a jaunty line
# written on that harmony:
#   a  8 bars  A major: square "woodwind" over harp arpeggios, synth bass, a held string note and congas
#   b  8 bars  the A minor / F turn, the square off-beat counter louder, ending on E7 back to a
# Brief (sw_subject): breezy coast and island routes, plucked strings and wind. Loop 16 bars, 38.4 s (vanilla 37.5 s).
