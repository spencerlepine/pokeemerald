  timp_big: "F2:12 r:36 | r:48 | F2:12 r:36 | r:24 C3:12 C3:12 | F2:12 r:36 | r:48 | C3:12 r:12 C3:12 r:12 | F2:12 r:12 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3"
  timp_fanfare: "C3:12 r:36 | r:48 | r:48 | C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3 C3:3"

