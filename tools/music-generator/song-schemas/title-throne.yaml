# Title screen (MUS_TITLE, hot-swap): a loop. ARRANGE of the Throne Room march from the A New Hope finale
# ("The Throne Room and End Title", wiki soundtrack:new-hope:16, 0:00-0:50), so the title sounds like the film's
# victory music and the opening crawl (MUS_INTRO_CRAWL, the main title) stays its own moment.
# Transcribed from the soundtrack with a harmonic-salience pitch tracker on a 16th-note grid (melody) and
# per-half-bar chroma (harmony); the cue runs at 119.3 bpm, 120 here, in F.
#   intro      4 bars, once  the cue's opening fanfare cut down: C, Eb, G (Williams' chromatic mediants), C7 pickup
#   loop       32 bars, 64 s, from a1:
#     a1       8 bars  the march, trumpet, over the F pedal (C over the F pedal, Db, Csus4, Bb, Dm6, C7b9: the cue's major/minor mix)
#     a2       8 bars  its second strain, horn joins on the tune
#     soft     8 bars  the first strain again, quiet: flute over harp and strings
#     big      8 bars  the second strain, full: trumpet and horn on the tune, high strings, timpani, cymbals;
#                      it ends on a C pickup, the note the march starts from, so the seam is the tune's own
# Vanilla MUS_TITLE plays once (about 100 s) and the title screen restarts the boot intro when it ends; this one
# loops, so the title screen waits until a button is pressed.
name: title-throne
replaces: MUS_TITLE
form: LOOP
voicegroup: title             # trumpet 56, horn 60, strings 48, timpani 47, harp 46, flute 73, kit, squares, wave
master_volume: 90
tempo: 120
steps_per_beat: 12            # 8ths, 16ths and the brass triplets on one grid
time_signature: [4, 4]
seed: 4

