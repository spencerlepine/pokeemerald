  horn:    {program: 60, channel: 1, volume: 94,  pan: -12, range: [C4, C5], gate: 0.95, transpose: -12}
  strings: {program: 48, channel: 2, volume: 74,  pan: -26, range: [A3, F5], gate: 1.0}
  flute:   {program: 73, channel: 3, volume: 92,  pan: 14,  range: [E4, F5], gate: 0.95, lfo_speed: 30, lfo_delay: 24, mod: 4}
  harp:    {program: 46, channel: 4, volume: 78,  pan: 28,  octave: 4, range: [F3, F5], gate: 0.9}
  timpani: {program: 47, channel: 5, volume: 100, pan: 0,   range: [C2, C3], gate: 1.0}
  cymbal:  {program: 0,  channel: 6, volume: 80,  pan: 20, role: drums, kit: {crash: 57, snare: 40}}
  bass:    {program: 82, channel: 7, volume: 104, pan: 0,   octave: 1, range: [C1, C2], gate: 0.85, role: bass}
  sq1:     {program: 80, channel: 8, volume: 50,  pan: 34,  octave: 4, range: [A3, F5], gate: 0.6, mono: true}
  sq2:     {program: 81, channel: 9, volume: 44,  pan: -34, octave: 4, range: [F3, C5], gate: 0.6, mono: true}

