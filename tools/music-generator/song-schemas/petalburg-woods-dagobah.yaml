    chords: intro
    ramp: {str_lo: [-14, 0], str_hi: [-14, 0]}
    parts: {str_lo: pad_lo, str_hi: pad_hi, bass: murk, bubble: "r:3 G5':1 r:2 C6':1 r:1 | r:8", pizz: drips}
  a:
    bars: 8
    chords: a
    parts: {flute: flute_a, str_lo: pad_lo, str_hi: pad_hi, pizz: drips, bass: murk, bubble: bubbles}
  b:
