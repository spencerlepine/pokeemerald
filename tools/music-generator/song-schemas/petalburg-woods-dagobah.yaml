  pad_hi: "^3:8"
  murk: "^1:6 ^1:2"
  drips: "^1+:1 r:3 ^3:1 r:3 | r:2 ^2:1 r:5"
  bubbles: "r:3 G5':1 r:2 C6':1 r:1 | r:8 | r:5 Eb6':1 r:2 | r:1 D6':1 r:6"
