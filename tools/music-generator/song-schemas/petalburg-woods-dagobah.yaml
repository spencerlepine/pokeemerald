  a: "Cm | Ab | Cm | Bb | Fm | Ab | G | G"
  b: "Ab | Bb | Gm | Cm | Ab | Bb | Dm7b5 | G"
  c: "Cm | Ab | Cm | G | Fm | Fm | Ab | G"

