# Petalburg Woods, Dagobah: net-new per-planet split of MUS_PETALBURG_WOODS (wiki row
# net:mus-petalburg-woods-dagobah), for Marine Cave and its underwater room. SCRATCH: no film cue, written from
# the brief. The Tatooine original (Jundland Wastes) is tense and echoing; Dagobah's version keeps the tension
# but turns it murky and mystical: C minor with Ab / Bb colour and a G major dominant, a flute line that rises
# and hangs in a, a low piano answer in b, then c thins to flute fragments over soft congas (swamp life).
# Pizzicato drips, a 12.5 % square bubbling in the gaps, a wave-channel bass and a two-voice string pad.
# Tempo, voicegroup and length from the vanilla song (MUS_PETALBURG_WOODS: petalburg_woods, 130 bpm, 42.2 s):
# 24 bars at 130 = 44.3 s.
# Brief (sw_subject): Dagobah version of MUS_PETALBURG_WOODS, same role and mood family; theme to be decided.
name: petalburg-woods-dagobah
constant: MUS_PETALBURG_WOODS_DAGOBAH
form: AMBIENT
voicegroup: petalburg_woods       # vanilla's own: piano 1, pizz 45, strings 48, flute 73, squares 5/80, wave 81, kit 0
master_volume: 80
tempo: 130
steps_per_beat: 2                 # eighth-note grid
time_signature: [4, 4]
seed: 13

parts:
  flute:   {program: 73, channel: 0, volume: 94,  pan: 10,  gate: 0.95, lfo_speed: 26, lfo_delay: 20, mod: 6, humanize: {vel: 5}}
  piano:   {program: 1,  channel: 1, volume: 84,  pan: -12, gate: 0.95, humanize: {vel: 6}}
  str_hi:  {program: 48, channel: 2, volume: 58,  pan: 26,  octave: 3, gate: 1.0}
  str_lo:  {program: 48, channel: 3, volume: 54,  pan: -26, octave: 3, gate: 1.0}
  pizz:    {program: 45, channel: 4, volume: 70,  pan: -20, octave: 4, gate: 0.8, humanize: {vel: 8}}
  bass:    {program: 81, channel: 5, volume: 80,  pan: 0,   octave: 2, role: bass, gate: 0.9}
  bubble:  {program: 5,  channel: 6, volume: 38,  pan: 34,  gate: 0.5, mono: true}
  congas:  {program: 0,  channel: 7, volume: 62,  pan: 18,  role: drums, kit: {lo: 64, hi: 62}}

