    C5:4 F5:2 Ab5:2 | G5:4 Eb5:2 C5:2 | D5:4 B4:2 G4:2 | G4:8
  piano_b: |
    Ab3:4 C4:4 | Bb3:4 D4:4 | G3:4 Bb3:2 D4:2 | C4:8 |
    Ab3:4 Eb4:4 | D4:4 F4:4 | F4:4 D4:2 Ab3:2 | B3:8
  flute_c: "r:8 | G5:2 F5:2 Eb5:4 | r:8 | D5:8 | r:8 | C5:2 Bb4:2 Ab4:4 | r:8 | B4:8"

grooves:
