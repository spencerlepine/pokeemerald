# vs. Darth Vader: net-new boss battle (wiki net:mus-vs-vader, MUS_VS_VADER; tech notes from its placeholder
# audio:MUS_VS_AQUA_MAGMA_LEADER: volume 80, priority 1, ~80 s loop). The row's ref_use is ARRANGE of "Enter Lord
# Vader" and "The Imperial March" (soundtrack:revenge-sith:11 | empire-strikes-back:05), but its brief says
# "Original composition; do not quote film themes", so the cues' harmony and groove are arranged and the tune is
# new: G minor against E-flat minor over the G pedal (the March's own colour), the Fm -> E and Bb7 -> E tritone
# swings from Enter Lord Vader (its draft bars 38-66), a relentless long-short triplet gallop in the low strings
# and wave bass, choir and timpani on the strong beats, and a noise-channel snare.
# Brief (sw_subject): "Boss battle against Darth Vader: relentless, operatic, choir hits."
# Voicegroup rg_vs_champion instead of the placeholder's vs_aqua_magma_leader, for its choir (slot 53) next to
# trumpet, horn, strings and timpani. 144 bpm (frame-exact), triplet grid, 2-bar intro, 48-bar loop (80 s).
