# Endor Crossing (MUS_ROUTE118, hot-swap): Route 118, the crossing from Tatooine to Endor. STYLE of "Luke and Leia"
# (wiki audio:MUS_ROUTE118, ref soundtrack:return-jedi:03): an original melody, not a quote. Taken from the cue:
# its Ab major (analyze_reference, r=0.36), its tempo (112.3 bpm, 112 here) and the tender, wide-leaping line
# over warm horn and strings with harp and glockenspiel colour. The row has no tech notes (MUS_ROUTE118 is the
# split-map marker, not a song), so the voicegroup is route119's (Endor's route): its horn, strings, harp,
# glockenspiel and timpani are the forest the brief opens into.
#   a  8 bars  dry: the tune on a 50% square over wave bass, a thin string note and rim-like snare taps
#   b  8 bars  it opens: a second strain on horn, harp arpeggios, the strings moving, timpani
#   c  8 bars  forest colour: the tune on horn with glockenspiel doubling, thinning to the dry reprise
# Brief (sw_subject): starts dry and opens into forest colour. Loop 24 bars, 51.4 s.
