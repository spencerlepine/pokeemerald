# Vs Arena Boss. Hot-swap of MUS_VS_FRONTIER_BRAIN (wiki audio:MUS_VS_FRONTIER_BRAIN): the Grand Arena bosses,
# bounty hunters. ARRANGE of "Jango's Escape" (soundtrack:attack-clones:07), from analyze_reference over 0:00-1:30
# (152 bpm, A minor, Am-Bb-E harmony, E sections with F and G# over them, a Gm strain) plus knowledge of the cue:
# the low chromatic-neighbour ostinato (A G A Bb) that drives it, brass figures climbing in fourths and fifths
# (E A E / F Bb F), the E Phrygian-dominant colour (E F G# A) of the chase, the Gm brass strain (G C G / G Bb D Eb)
# and its climb to Bb7 and E. Made gritty for the brief with the voicegroup's low distortion guitar on the E riff.
# Kept at the cue's tempo (150 for a frame-exact loop). Vanilla voicegroup. Brief (sw_subject): Grand Arena bosses (bounty hunters): gritty,
# mercenary.
