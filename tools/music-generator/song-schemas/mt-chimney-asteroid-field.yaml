# Mt. Chimney, Asteroid Field version (MUS_MT_CHIMNEY_ASTEROID_FIELD, net-new): the dangerous-place music for the
# Asteroid Field maps (the Asteroid Spire). ARRANGE of "The Asteroid Field" (wiki net:mus-mt-chimney-asteroid-field,
# ref soundtrack:empire-strikes-back:10). analyze_reference read the cue at 83.4 bpm with 167 as the double: the
# chase runs fast in cut time, so it is written at 168. Its melody draft is too rough to use, so the arrangement
# is written in the cue's manner from the tune as it goes: a heroic Eb major brass call (rising fourth, held
# third, falling triplets, the lift to F major) over swirling string eighths, a minor-key horn bridge, then
# the call again in full. The tech notes come from the placeholder vanilla MUS_MT_CHIMNEY: its voicegroup
# mt_chimney (trumpet, horn, strings, timpani) and volume 78.
#   intro 1 bar   the square swirls, wave bass, string pad and snare on Bb
#   a     8 bars  the call on trumpet, square swirl, wave bass, noise snare, timpani on the phrase starts
#   b     8 bars  C minor bridge: horn over a string pad and timpani
#   c     8 bars  the call on trumpet and horn together, timpani and rolls, ending on Bb back to a
# Brief (sw_subject): Asteroid Field version of Mustafar's dangerous-place theme, same role and mood family.
# Loop 24 bars, 34.3 s.
