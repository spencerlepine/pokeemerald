# Route 110, Sullust version (MUS_ROUTE110_SULLUST, net-new): the Sullust overland route (Route 114). STYLE of
# "Passage Through the Planet Core" (wiki net:mus-route110-sullust, ref soundtrack:phantom-menace:10): an
# original melody, not a quote. Taken from the cue: C major (analyze_reference, r=0.59) with its bright lifts to
# D7 (the Lydian sharp four) and its chromatic-mediant swerves (Ab, Bb), the churning string ostinato under
# heroic brass, and a fast pulse (the 144.5 bpm candidate, 144 here: the loop is a whole number of frames).
# Tech notes from the placeholder vanilla MUS_ROUTE110 (voicegroup route110, volume 80): energetic, the same
# role and mood family as the Tatooine Podrace Route.
#   intro 1 bar  the square ostinato, drums, horn and strings on G
#   a     8 bars the horn tune: C, D7, Am, F, the D7 lift to G
#   b     8 bars the swerve: trumpet through Ab and Bb back to C, second square arpeggio
#   c     8 bars the tune on strings with the trumpet answering, tubular bell on the phrase starts
# Brief (sw_subject): Sullust version of the Tatooine podrace-route theme, same role and mood family.
# Loop 24 bars, 40 s (vanilla 36.4 s).
