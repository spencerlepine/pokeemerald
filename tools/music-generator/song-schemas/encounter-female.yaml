# Encounter: female trainers. Hot-swap of MUS_ENCOUNTER_FEMALE (wiki audio:MUS_ENCOUNTER_FEMALE, ENCOUNTER / LOOP).
# SCRATCH (no film cue): an original eye-contact tune in the lyrical Star Wars idiom (the graceful side of the
# Naboo / Leia writing), at the vanilla 90 bpm. Brief (sw_subject): eye-contact jingle, generic female trainers.
# 1-bar flute run-up on Bb7, then a 4-bar loop (10.7 s, vanilla 10.7 s) in Eb: Eb, Cm, Ab, Bb7, its last Ab
# falling to the G that opens it. Flute tune, pizzicato eighths, string pad, fretless bass, square arpeggios
# and a second square echo, noise shaker, soft kick.
