# Sealed Chamber, Kashyyyk: net-new per-planet split of MUS_SEALED_CHAMBER (wiki row
# net:mus-sealed-chamber-kashyyyk), for the Ice Grotto. SCRATCH: no film cue, written from the brief. The
# Tatooine original is an eerie, sparse vault; this one is a frozen grotto, so it rocks slowly in 6/8 under harp
# arpeggios like dripping ice: F minor with a C major dominant, a flute line in a, a low horn in b, an icy 25 %
# square over the Neapolitan Gb in c, and d settles over timpani before the loop. Vanilla voicegroup and tempo
# (MUS_SEALED_CHAMBER: sealed_chamber, 140 bpm, 36.0 s): 28 bars of 6/8 at 140 = 36.0 s.
# Brief (sw_subject): Kashyyyk version of MUS_SEALED_CHAMBER, same role and mood family; theme to be decided.
name: sealed-chamber-kashyyyk
constant: MUS_SEALED_CHAMBER_KASHYYYK
form: AMBIENT
voicegroup: sealed_chamber        # vanilla's own: bell 14, harp 46, timpani 47, strings 48, horn 60, flute 73, squares 80/81, wave 87
master_volume: 100
tempo: 140
steps_per_beat: 2                 # eighth-note grid, 6 steps a 6/8 bar
