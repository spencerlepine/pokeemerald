# Opening-movie battle (MUS_INTRO_BATTLE, hot-swap): a one-shot action cue. ARRANGE of the "Ambush on Coruscant"
# half of "Star Wars Main Title and Ambush on Coruscant" (wiki soundtrack:attack-clones:01, analyzed 110-200 s:
# ~100 bpm, D minor colour, Bb7 and Gm against D, a chromatic Ab/C7 lurch). Kept: the tempo (100), the low-string
# sixteenth ostinato on D with its Eb neighbour, the menacing brass line over it, the Bb-to-D lurch, timpani and
# snare, and a climb to a last D minor stab.
#   bars 1-2  ostinato + horns + timpani, the noise snare driving
#   bars 3-4  trumpet threat over Bb and Gm
#   bars 5-6  chromatic climb (Bb, B, C, C#) with a snare roll
#   bar 7     the stab and its ring
# Vanilla is 14.8 s and plays once; this is 16.8 s.
# Brief (sw_subject): Battle in the opening movie: short, punchy action cue.
