# Comlink register (MUS_REGISTER_MATCH_CALL, hot-swap): a one-shot sting. SCRATCH (wiki
# audio:MUS_REGISTER_MATCH_CALL, no film cue). Brief: "New comlink contact: chirpy two-note comms sting." A comms
# chirp built on one two-note cell, B up to E: called on square 1, echoed an octave down a sixteenth late on
# square 2 (the other end answering), doubled by xylophone, then confirmed up to the high B, over a wave-bass
# blip and a triangle ping. 96 bpm (vanilla's), one 3/4 bar, 1.9 s like vanilla, on the vanilla
# register_match_call voicegroup.
