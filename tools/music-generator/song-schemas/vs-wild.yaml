# vs. Wild companion: hot-swap of MUS_VS_WILD (wiki audio:MUS_VS_WILD). ARRANGE of "The Battle in the Snow"
# (wiki ref_tracks soundtrack:empire-strikes-back:09), 0:38-1:40 of the cue, read with analyze_reference.py at
# the cue's ~172 bpm and fixed by ear from the draft:
#   - the low E pedal grinding up a semitone to F (and the E / E-diminished alternation, bars 24-36 of the draft)
#   - the A pedal with Bb and F above it (Phrygian A, bars 15-21) and its clipped brass call F-E . E-F . C#-Bb
#   - the opening's B minor with a Bb major shadow (bars 1-9), and the Bb7 that swings back to E
# cut to a 36-bar loop: a (the E grind, trumpet over it), b (A Phrygian, horn figure then the brass call),
# c (B minor / Bb, rising to B7), d (the E grind full, horn and timpani), e (Bb7 turnaround into the loop).
# Brief (sw_subject): "Wild companion battle: urgent orchestral action loop, the most-heard battle track."
# 172 bpm (the cue's 172.3; vanilla 196), 2-bar intro, 36-bar loop (50 s; vanilla 52.7 s), vanilla vs_wild voicegroup.
