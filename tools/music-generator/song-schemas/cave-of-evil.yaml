# Cave of Evil, the dark-side vergence on Dagobah (and Starfall Cavern until its Sullust split lands): hot-swap
# of MUS_CAVE_OF_ORIGIN (wiki audio:MUS_CAVE_OF_ORIGIN, AMBIENT). STYLE of "Palpatine's Teachings" (ref_tracks
# soundtrack:revenge-sith:06): no quote. Taken from the cue: a hushed Bb minor that never settles, a low string
# line on the chord thirds (Bbm, Gb over Bb, the A natural rubbing against it), a lone horn line rising by
# semitones, a low tuba floor. The cave: a timpani heartbeat (lub-dub, once a bar), whispering 12.5% squares
# trading half-step trills, a distant tubular bell. Vanilla: cave_of_origin voicegroup, 100 bpm, 43.8 s loop;
# this is 64 bpm (a resting heart), 12 bars, 45 s.
# Brief (sw_subject): unsettling, whispering pads, heartbeat pulse.
