# Captured intro (MUS_RG_CAUGHT_INTRO, hot-swap): a one-shot sting before MUS_CAPTURED. SCRATCH (wiki
# audio:MUS_RG_CAUGHT_INTRO, no film cue). Brief: "Capture pod locks: short sting before MUS_CAPTURED." The pod
# clamps shut on beat one (piano and tuba low C, kick, two square lock beeps), a snare roll builds while the brass
# climbs in triplets through Eb and F (Williams' flat-side lift) and lands on a held G major with the cymbal, the
# dominant that hands over to the capture loop. 64 bpm (vanilla's), one 4/4 bar: 3.75 s against vanilla's 3.6 s,
# on the vanilla rg_caught_intro voicegroup.
