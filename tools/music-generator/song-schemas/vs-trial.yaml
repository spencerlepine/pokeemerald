# Vs Trial. Hot-swap of MUS_VS_ELITE_FOUR (wiki audio:MUS_VS_ELITE_FOUR): the Four Trials, Force visions of Maul,
# Qui-Gon, Ki-Adi-Mundi and Anakin. ARRANGE of "Duel of the Fates" (soundtrack:phantom-menace:02), from
# analyze_reference over 0:00-2:00 (forced to the cue's 160 bpm: E minor, the Em / Cm chromatic-mediant swing,
# Am7-Bm7 in the middle) plus knowledge of the cue: the string ostinato (G E F# G A / B A G F# E), the choral call
# (B up to a long E, a lift to F#, then C-Eb-C-Eb on C minor), the brass motif that answers it, and the middle
# strain over Am7 and Bm7. Choir parts go to trumpet and horn (the vanilla voicegroup has no choir), the ostinato
# moves between strings and a square. Kept at the cue's 160 bpm on an eighth grid. Brief (sw_subject): the Four
# Trials: dreamlike, dangerous.
