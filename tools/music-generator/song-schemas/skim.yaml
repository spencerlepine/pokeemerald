# Riding a companion across water (Surf): hot-swap of MUS_SURF (wiki audio:MUS_SURF). ARRANGE of "Jar Jar's
# Introduction and The Swim to Otoh Gunga" (ref_tracks soundtrack:phantom-menace:04, ref_notes: the swim).
# From the cue (analyze_reference: ~90 bpm, the swim's wonder passage at 181-217 s: F, Am7, the darkening Fm and
# Ab, Dm7-Am, a C7 build turning through D7 to G): its harmony, tempo and texture (soaring horn and strings over
# rippling harp, a bubbling high pulse), cut to a 24-bar loop. The melody is written on that harmony; a
# lilting pizzicato bounce and soft kit keep it moving, buoyant rather than dreamy.
# Vanilla: surf voicegroup, 82 bpm, 71.3 s; this is 90 bpm (the cue's), 24 bars, 64 s.
# Brief (sw_subject): riding a companion across water, buoyant travel theme.
