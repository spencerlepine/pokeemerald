# Encounter: a Trial's vision. Hot-swap of MUS_ENCOUNTER_ELITE_FOUR (wiki audio:MUS_ENCOUNTER_ELITE_FOUR,
# ENCOUNTER / LOOP). STYLE of "The Droid Invasion and The Appearance of Darth Maul", the Maul half (wiki ref_tracks
# soundtrack:phantom-menace:14): an original tune, not a quote. Taken from the cue: its ~100 bpm, the dark E minor
# with the flat-second (F) and tritone (Bb) shadows, a low choral organ under menacing brass and a relentless
# 16th-note pulse. Brief (sw_subject): a Trial's vision appears.
# 1-bar swell, then an 8-bar loop (19.2 s; vanilla 21.5 s): trumpet line over organ chords (Em, C, Em, F / Em,
# C, Am-Bb, B), square 16th ostinato and an echo a 6th above, wave bass, timpani, noise snare.
