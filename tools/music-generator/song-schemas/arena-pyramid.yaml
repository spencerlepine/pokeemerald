# Arena Pyramid (Grand Arena): hot-swap of MUS_B_PYRAMID (wiki audio:MUS_B_PYRAMID, FACILITY / LOOP).
# ARRANGE of "Into the Trap" (soundtrack:return-jedi:02), the cue's middle (about 1:03-2:00): the low-string
# ostinato rocking between G minor and A minor 7 over a D pedal, the horn figure that leaps up a sixth and sinks
# (D-Bb-C-A-G), and the rising brass stabs as the trap springs (Gm-Dm-A-Bb ... E-A). 120 bpm (the cue's 123,
# frame-exact loop), D minor. Cut to a 40-bar loop: horn theme, trumpet theme, the trap, a sparse flute stretch for the maze.
# Brief (sw_subject): Battle Pyramid floors, dark maze exploration.
