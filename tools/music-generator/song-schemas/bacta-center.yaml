# Bacta Center: hot-swap of MUS_POKE_CENTER (wiki audio:MUS_POKE_CENTER). SCRATCH (no film cue): written from
# the brief. Brief (sw_subject): Bacta Center tended by 2-1B, calm, healing, soft bubbling bacta tanks.
# F major, 104 bpm (vanilla tempo): a warm flute tune over soft offbeat piano and wave bass, then strings and
# pizzicato under the second strain; a 12.5% square plays little rising ripples at the bar ends (the bubbles in
# the tanks) and a 25% square hums a counter-line. No drums. 16-bar loop, 36.9 s (vanilla 39.2 s).
