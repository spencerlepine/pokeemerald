# vs. Trainer: hot-swap of MUS_VS_TRAINER (wiki audio:MUS_VS_TRAINER). ARRANGE of "The Forest Battle" (wiki
# ref_tracks soundtrack:return-jedi:07), the cue's opening minute (0:00-0:60), read with analyze_reference.py at
# 160 bpm (the cue's 161.5) and fixed by ear from the draft:
#   - the low string ostinato that churns D-F-A over the long A pedal (the draft's "Asus4" bars 1-22)
#   - the brass wail that grinds Bb against A and climbs to C# (bars 23-30), over Bb, E and G minor
#   - the Bm7 / E / Bb7 / Esus4 tritone pair (bars 10-14) as a trumpet fanfare strain
# cut down to a 48-bar loop: a (ostinato build), b (the wail), c (the fanfare), a2 (ostinato under a D-minor
# trumpet line), b2 (the wail, full), d (climax in D minor, landing on the A pedal the loop starts on).
# Brief (sw_subject): "Trainer battle: driving brass and strings."
# 160 bpm (the cue's; vanilla 198), 2-bar intro, 48-bar loop (72 s; vanilla 89.7 s; frame-exact), vanilla
# vs_trainer voicegroup.
