# Encounter: hikers and prospectors. Hot-swap of MUS_ENCOUNTER_HIKER (wiki audio:MUS_ENCOUNTER_HIKER, ENCOUNTER /
# LOOP). SCRATCH (no film cue): an original, sturdy eye-contact tune in the comic-heavy Star Wars idiom (the Jawa
# and sandcrawler writing: tuba oom-pah, plodding horn). Brief (sw_subject): eye-contact jingle, hikers and
# prospectors. 128 bpm (vanilla): 1-bar D7 horn pickup, then an 8-bar loop in G (15.0 s, vanilla 15.0 s,
# frame-exact): horn tune, tuba oom-pah, both squares on the "pah", bell like a pick on rock, timpani on the
# downbeats, wave counter-line, noise snare and hats.
