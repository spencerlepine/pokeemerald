# Crystal Caves (Ilum): hot-swap of MUS_VICTORY_ROAD. STYLE of "Anakin's Betrayal"
# (wiki row audio:MUS_VICTORY_ROAD, ref_tracks soundtrack:revenge-sith:04): an original melody, not a quote.
# Taken from the cue: A minor lament, the Esus4 -> Am sighs and the bVI / Neapolitan (F, Bb) colour, a choral
# string pad under a lone woodwind that hands over to horn as it swells. The cue's double-time tempo (133) is the
# vanilla song's own 134, so the pulse sits at 132 on an eighth grid.
# Brief (sw_subject): Crystal Caves and the Trial chambers: resonant kyber shimmer, building tension.
# Kyber shimmer = tubular bell and a 12.5 % square arpeggio; tension builds a with flute, b with horn and
# timpani pulse, c with both over a noise heartbeat, then d falls back to the bell before the loop.
