# Arena Pike (Grand Arena): hot-swap of MUS_B_PIKE (wiki audio:MUS_B_PIKE, FACILITY / LOOP). SCRATCH: no film cue,
# written from the brief in the Star Wars idiom: D minor shot through with flat-second and diminished turns (Eb over
# D, C#dim, A7 at the phrase ends), a coiling synth-bass ostinato, square arpeggios that twist back on themselves,
# strings then organ on the line, a choir pad and a taiko/snare groove under it. 120 bpm like the vanilla song.
# Brief (sw_subject): Battle Pike, twisting, uneasy.
