# Encounter: twins and pairs. Hot-swap of MUS_ENCOUNTER_TWINS (wiki audio:MUS_ENCOUNTER_TWINS): eye-contact music
# for the 35 twin and pair trainers. SCRATCH (no film cue): an original bouncy D major duet, two 25% squares
# moving together in parallel thirds (the "twins"), nylon guitar on the off-beats, flute holding soft notes, then
# doubling the lead in the second phrase, synth bass and a light kit. Vanilla voicegroup and tempo. Brief (sw_subject): eye-contact
# jingle, twins and pairs.
