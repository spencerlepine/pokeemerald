# Sevii Cave, Grand Arena: net-new per-planet split of MUS_RG_SEVII_CAVE (wiki row
# net:mus-rg-sevii-cave-grand-arena), for Altering Cave. SCRATCH: no film cue (the Mortis original is SCRATCH
# too), written from the brief. Same mood family as Mortis Depths, otherworldly and echoing, and a cave that
# alters: A minor that keeps slipping by thirds (Am-Fm, Am-C#m, the A-C#-F augmented cycle in c), a piano line
# with a 50 % square echoing it three eighths late, nylon guitar arpeggios, a two-voice string pad, a high
# square line floating over c. On the vanilla rg_mt_moon voicegroup at its 110 bpm; 34 bars = 74.2 s, which is
# shorter than the vanilla 92.1 s loop to stay inside the AMBIENT loop range the checks use (35-77 s).
# Brief (sw_subject): Grand Arena version of MUS_RG_SEVII_CAVE, same role and mood family; theme to be decided.
name: rg-sevii-cave-grand-arena
constant: MUS_RG_SEVII_CAVE_GRAND_ARENA
form: AMBIENT
voicegroup: rg_mt_moon            # vanilla's own: piano 1, guitar 24, strings 48, squares 80/81, wave 83
master_volume: 90
tempo: 110
steps_per_beat: 2                 # eighth-note grid
time_signature: [4, 4]
seed: 34

parts:
  piano:   {program: 1,  channel: 0, volume: 92,  pan: -10, gate: 0.95, humanize: {vel: 6}}
  strings: {program: 48, channel: 1, volume: 80,  pan: 14,  gate: 1.0, humanize: {vel: 4}}
  guitar:  {program: 24, channel: 2, volume: 74,  pan: -24, octave: 3, gate: 0.9, humanize: {vel: 8}}
  str_hi:  {program: 48, channel: 3, volume: 54,  pan: 28,  octave: 3, gate: 1.0}
  str_lo:  {program: 48, channel: 4, volume: 50,  pan: -28, octave: 3, gate: 1.0}
  bass:    {program: 83, channel: 5, volume: 80,  pan: 0,   octave: 2, role: bass, gate: 0.95}
  echo:    {program: 80, channel: 6, volume: 34,  pan: 36,  gate: 0.85, mono: true}
  float:   {program: 81, channel: 7, volume: 38,  pan: -34, gate: 0.95, mono: true}

progressions:
  intro: "Am | E"
  a: "Am | Fm | Am | C#m | Am | F | Dm | E"
  b: "F | Ab | Db | E | F | Ab | Bm7b5 | E"
  c: "Am | C#m | Fm | Am | Am | C#m | F | E"
  turn: "Dm | E"

