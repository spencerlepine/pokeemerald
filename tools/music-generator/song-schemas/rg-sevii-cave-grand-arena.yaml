  pad_lo: "^1:8"
  pad_hi: "^3:8"
  root: "^1:8"
  piano_a: |
    E5:4 C5:2 A4:2 | Ab4:6 C5:2 | E5:4 B4:2 A4:2 | G#4:8 |
    E5:4 C5:2 A4:2 | A4:4 C5:2 F5:2 | F5:4 D5:2 A4:2 | G#4:6 B4:2
  echo_a: "r:1 B4:2 E5:4 C5:1 | ~:1 A4:2 Ab4:5 | ~:1 C5:2 E5:4 B4:1 | ~:1 A4:2 G#4:5 | ~:3 E5:4 C5:1 | ~:1 A4:2 A4:4 C5:1 | ~:1 F5:2 F5:4 D5:1 | ~:1 A4:2 G#4:5"
  strings_b: |
    A4:8 | C5:8 | Db5:6 F5:2 | E5:8 |
    F5:4 C5:4 | Eb5:4 C5:4 | D5:4 F5:4 | E5:6 G#4:2
  float_c: "A5:8 | G#5:8 | Ab5:8 | A5:8 | E5:8 | E5:8 | F5:8 | E5:8"

sections:
  intro:
    bars: 2
    chords: intro
    parts: {guitar: arp, str_lo: pad_lo, str_hi: pad_hi, bass: root, piano: "A4:8 | r:4 B4:2 D5:2"}
  a:
    bars: 8
    chords: a
    parts: {piano: piano_a, echo: echo_a, str_lo: pad_lo, str_hi: pad_hi, bass: root}
  b:
    bars: 8
    chords: b
    parts: {strings: strings_b, guitar: arp, str_lo: pad_lo, bass: root}
  a2:
    bars: 8
    chords: a
    gain: {guitar: -8}
