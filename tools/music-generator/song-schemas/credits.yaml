# Credits (MUS_CREDITS, hot-swap): a one-shot suite. ARRANGE of the end-credits medleys the row names:
# "A New Hope and End Credits" (wiki soundtrack:revenge-sith:15) and "The Throne Room and End Title"
# (soundtrack:new-hope:16). Kept from the cues: the main title theme in Bb with its brass triplets, the Force theme
# as the quiet middle (horn over harp, C minor, slower), the Throne Room march (the same transcription as
# title-throne, in F at 120), and the end-title close on the main theme's last phrase and a held Bb chord.
#   open     2 bars  Bb fanfare hits, square triplets, timpani
#   main     16 bars main theme (trumpet, horn below) and its middle strain, 108 bpm
#   force    16 bars Force theme, horn then flute over harp, 80 bpm (the reflective turn)
#   throne   16 bars Throne Room march, 120 bpm (triumphant again)
#   finale   8 bars  main theme reprise and the last chord, 108 bpm
# Plays once (loops=no in the row), about 2:20 against vanilla's 172 s.
# Brief (sw_subject): Credits roll: suite of the game's themes, triumphant then reflective.
