# vs. the Wellspring's companion: hot-swap of MUS_VS_MEW (wiki audio:MUS_VS_MEW). SCRATCH: no film cue, written
# from the brief (sw_subject): "The Wellspring's mythical companion: playful, elusive."
# A battle scherzo in the Star Wars idiom: F major with Williams-style chromatic-mediant side steps (F -> Ab,
# Db -> Eb, D7), a staccato trumpet tune that skips and stops short, square-wave arpeggios, a wave bass that
# bounces octaves, and a B strain where the tune slips away onto the Game Boy squares (the elusive part).
# 180 bpm (vanilla 182; 180 makes the loop a whole number of frames); 2-bar run-in, 32-bar loop (42 s; vanilla 44.8 s), on the vanilla vs_mew voicegroup.
