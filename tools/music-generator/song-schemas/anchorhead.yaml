# Anchorhead (Tatooine), hot-swap of MUS_VERDANTURF. ARRANGE of "The Meadow Picnic" (wiki
# soundtrack:attack-clones:08, analyzed 0-90 s: 76 bpm, D major, long Dsus4/Asus4 pedals, a Dm shading).
# Kept: the tempo (80, the cue's 76 made frame-exact for a clean seam), D major with the cue's suspended colour (the Dsus4 sigh that ends each strain), its gentle
# pastoral woodwind tune over broken chords, and the strings taking the second strain; the quiet moisture-farm
# morning has no drums, as vanilla Verdanturf has none.
#   intro  1 bar   piano and bass
#   a      8 bars  flute tune over piano broken chords and a square echo
#   b      8 bars  the strings sing the second strain, flute descant, Dsus4 to D
# 16-bar loop, 48 s (vanilla 49.1 s); vanilla verdanturf voicegroup.
# Brief (sw_subject): Anchorhead: sleepy moisture-farm town, gentle and pastoral.
