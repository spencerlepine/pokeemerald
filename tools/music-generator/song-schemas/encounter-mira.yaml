# Encounter: Mira (the rival). Hot-swap of MUS_ENCOUNTER_MAY (wiki audio:MUS_ENCOUNTER_MAY): the rival's theme
# when the player is KAEL. STYLE of "Princess Leia's Theme" (soundtrack:new-hope:03): an original tune, not a
# quote. Taken from the cue: D major with its chromatic-mediant lift (D to Bb), a lyrical flute line that leaps a
# sixth and falls by step, harp-like broken chords (square arpeggio) and a horn-like second strain (trumpet).
# Kept at the vanilla 128 bpm with a light backbeat so it still works as an encounter. Brief (sw_subject): rival
# theme (MIRA when the player is KAEL).
