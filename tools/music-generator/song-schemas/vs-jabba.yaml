# Vs Jabba. Hot-swap of MUS_VS_AQUA_MAGMA_LEADER (wiki audio:MUS_VS_AQUA_MAGMA_LEADER): the boss battle against
# Jabba and his lieutenants (Vader uses it too until net:mus-vs-vader lands). STYLE of "Han Solo Returns (At the
# Court of Jabba the Hutt)" (soundtrack:return-jedi:05): an original tune, not a quote. Taken from the cue: its
# ~140 bpm, D minor with the chromatic Bb7 / Eb7 side-steps, a low, waddling brass melody (horn in its bottom
# register where the cue has tuba and bassoon), brass stabs answering it, a slap-bass walk and a heavy backbeat,
# then a trumpet strain with a swagger and a crash-and-timpani breakdown. Vanilla voicegroup. Brief (sw_subject):
# boss battle against Jabba: heavy, grotesque swagger.
