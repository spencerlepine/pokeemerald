# Endor settlements (the Route 119 research station): net-new MUS_RUSTBORO_ENDOR, the Endor split of
# MUS_RUSTBORO (desert-city). STYLE of "The Magic Tree" (wiki soundtrack:empire-strikes-back:15): an original
# tune, not a quote. Taken from the cue (analyzer 0-120 s): its pulse (117.5, 118 here), D minor with the cue's
# Gm/Bb7/Asus4 motion and its tritone-away Ab minor colour, and the swirling woodwind ostinato that makes the
# forest feel watched; kept in desert-city's family (a busy settlement) by a steady kit groove and a walking
# wave bass. Tech notes from the vanilla song it splits from (MUS_RUSTBORO): rustboro voicegroup, volume 85, a
# loop near 63.5 s.
#   intro  1 bar   kit and the piano ostinato
#   a      8 bars  flute tune over the ostinato
#   b      8 bars  75% square lead with the Ab colour
#   a2     8 bars  the flute tune again, square 25% ostinato and organ
#   c      8 bars  strings strain over Gm and Bb7, E7 and A7 back to D minor
# 32-bar loop, 65 s.
# Brief (sw_subject): Endor version of MUS_RUSTBORO (MUS_DESERT_CITY) for Route 119; same role and mood family as the Tatooine original.
