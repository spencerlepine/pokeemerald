# Mt. Pyre, Tatooine: net-new per-planet split of MUS_MT_PYRE (wiki row net:mus-mt-pyre-tatooine), for the
# Espa Generator (New Mauville). SCRATCH: no film cue, written from the brief. The Jedha original is reverent and
# eerie; this is the same hush inside an old desert power plant: D Phrygian dominant (D-Eb-F#, the desert
# colour), a nylon guitar line in a, a slow horn chant in b, a 2-bar string pad throughout, and the generator
# itself on the Game Boy side: a square throbbing on D in sixteenths, wave-channel roots, noise crackle.
# c drops to the machine, a bell and timpani before the loop. Tempo, voicegroup and length from the vanilla
# song (MUS_MT_PYRE: mt_pyre, 90 bpm, 53.3 s): 20 bars at 90 = 53.3 s.
# Brief (sw_subject): Tatooine version of MUS_MT_PYRE, same role and mood family; theme to be decided.
name: mt-pyre-tatooine
constant: MUS_MT_PYRE_TATOOINE
form: AMBIENT
voicegroup: mt_pyre               # vanilla's own: bell 14, guitar 24, timpani 47, strings 48, horn 60, squares 80/81, wave 82, noise 126
master_volume: 88
tempo: 90
steps_per_beat: 4                 # 16th-note grid for the generator pulse
time_signature: [4, 4]
seed: 90

parts:
  guitar:  {program: 24, channel: 0, volume: 96,  pan: 12,  gate: 0.95, humanize: {vel: 8}}
  horn:    {program: 60, channel: 1, volume: 90,  pan: -10, gate: 0.96, humanize: {vel: 4}}
  str_hi:  {program: 48, channel: 2, volume: 58,  pan: 26,  octave: 3, gate: 1.0}
  str_lo:  {program: 48, channel: 3, volume: 54,  pan: -26, octave: 3, gate: 1.0}
  bell:    {program: 14, channel: 4, volume: 62,  pan: -30, gate: 1.0}
  timpani: {program: 47, channel: 5, volume: 82,  pan: 12,  gate: 1.0}
  bass:    {program: 82, channel: 6, volume: 80,  pan: 0,   octave: 2, role: bass, gate: 0.9}
  gen:     {program: 80, channel: 7, volume: 34,  pan: 30,  gate: 0.7, mono: true}
  crackle: {program: 126, channel: 8, volume: 30, pan: -20, role: drums, kit: {z: C6, k: D5}}

progressions:
  intro: "D | Eb"
  a: "D | Eb | D | Cm | D | Eb | Gm | D"
  b: "Gm | Gm | Eb | D | Gm | Cm | Eb | D"
  c: "Eb | D | Eb | D"

phrases:
  pad_lo: "^1:16"
  pad_hi: "^3:16"
  roots: "^1:12 ^1:4"
  throb: "D3:2 D4:1 D3:1 D3:2 D4:1 D3:1 D3:2 D4:1 D3:1 D3:2 A3:1 D3:1"
  guitar_a: |
    D4:4 Eb4:2 F#4:2 G4:8 | F#4:4 Eb4:4 D4:8 | A4:4 Bb4:2 A4:2 G4:4 F#4:4 | G4:4 Eb4:4 C4:8 |
    D4:4 Eb4:2 F#4:2 A4:8 | Bb4:4 A4:2 G4:2 F#4:4 Eb4:4 | D4:4 G4:4 Bb4:4 A4:4 | A4:16
  guitar_b: "^1:2 ^2:2 ^3:2 ^2:2 ^1+:2 ^3:2 ^2:2 ^3:2"
  horn_b: |
    G3:8 Bb3:8 | D4:12 C4:4 | Bb3:8 G3:8 | A3:16 |
    G3:8 Bb3:8 | C4:8 Eb4:8 | D4:8 Bb3:4 G3:4 | F#3:16
  bell_c: "Eb4:16 | D4:16 | G4:16 | F#4:16"
  timp_c: "Eb2:4 r:12 | D2:4 r:12 | Eb2:4 r:12 | D2:4 r:4 D2:1 D2:1 D2:1 D2:1 D2:1 D2:1 D2:1 D2:1"

grooves:
  crackle_a: {z: "..x.......o.....|......o.......x.", k: "................|x..............."}
  crackle_c: {z: "..x...o...x...o.|..x.o.....x.o.x."}

sections:
  intro:
    bars: 2
    chords: intro
    ramp: {gen: [-20, 0]}
    parts: {gen: throb, str_lo: pad_lo, str_hi: pad_hi, bass: roots, crackle: crackle_a}
  a:
    bars: 8
    chords: a
    parts: {guitar: guitar_a, str_lo: pad_lo, str_hi: pad_hi, bass: roots, gen: throb, crackle: crackle_a}
  b:
    bars: 8
    chords: b
    gain: {guitar: -22, gen: -8}
    parts: {horn: horn_b, guitar: guitar_b, str_lo: pad_lo, str_hi: pad_hi, bass: roots, gen: throb}
  c:
    bars: 4
    chords: c
    parts: {bell: bell_c, timpani: timp_c, str_lo: pad_lo, str_hi: pad_hi, bass: roots, gen: throb, crackle: crackle_c}

arrangement: [intro, a, b, c]
loop_start: a
