# Encounter: Atollon. Hot-swap of MUS_RG_ENCOUNTER_DEOXYS (wiki audio:MUS_RG_ENCOUNTER_DEOXYS): plays when
# Atollon's ancient companion appears. SCRATCH (no film cue): an original E minor mystery built like the vanilla
# song (no drums; a pulsing synth bass, a racing square arpeggio, choir), in the Star Wars mystical idiom: a slow
# choir line rising a minor sixth, tubular bell tolls on the phrase heads, a wave-channel counter-line and the
# major-IV / major-VII colour (C, D, B) that makes Force music feel old and strange. Vanilla voicegroup and tempo.
# Brief (sw_subject): Atollon's companion appears.
