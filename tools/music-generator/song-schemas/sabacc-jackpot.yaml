# Sabacc Jackpot (casino minigame): hot-swap of MUS_SLOTS_JACKPOT (wiki audio:MUS_SLOTS_JACKPOT, MINIGAME / JINGLE).
# SCRATCH: no film cue, written from the brief in the Star Wars fanfare idiom: a C major trumpet call that climbs
# through the Williams flat-six and flat-seven (Ab, Bb) to a high C, horn under it, square arpeggios racing up,
# a timpani roll and snare build, then glockenspiel sparkle and a crash on the last chord. 120 bpm like the
# vanilla jingle, three bars of 3/4 (4.5 s), one-shot on the SE2 player like vanilla.
# Brief (sw_subject): Sabacc jackpot, flashy win.
