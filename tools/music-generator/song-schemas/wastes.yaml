# Jundland Wastes and the other canyons and tunnels: hot-swap of MUS_PETALBURG_WOODS (wiki
# audio:MUS_PETALBURG_WOODS, AMBIENT). ARRANGE of "The Tusken Camp and The Homestead" (ref_tracks
# soundtrack:attack-clones:11, ref_notes: the Tusken Camp half). From the cue (analyze_reference 0-160 s: ~108 bpm,
# B minor over a long Bm7 pedal, the Daug / Bbaug shudders, the D7-Am-C7-G drift and the Dsus4 / Asus4 hangs):
# a low string pedal on B pulsing in the cue's tempo with the C natural leaning on it, the augmented chords
# as a pad, and long-spaced calls from far away. The vanilla voicegroup has no horn, so the distant calls are a
# square with vibrato answered by the flute; pizzicato and metallic noise rattle like wind in the rocks.
# Vanilla: petalburg_woods voicegroup, 130 bpm, 42.2 s loop; this one 108 bpm, 20 bars, 44.4 s.
# Brief (sw_subject): tense and echoing, low strings and distant original horn calls.
