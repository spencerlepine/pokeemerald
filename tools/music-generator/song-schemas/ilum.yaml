# Ilum (MUS_EVER_GRANDE, hot-swap; also the link rooms). ARRANGE of "Yoda and the Younglings" (wiki
# soundtrack:attack-clones:04, analyzed 0-90 s: 86 bpm, D major, long Asus4/Esus4 pedals, then a turn to G minor
# and D minor in bars 17-24). Kept: the tempo (90, the cue's 86 made frame-exact), D major over sustained suspended harmony, the cue's lyrical
# Yoda-theme-style melody (rising fourth, stepwise turns, long held notes), the celesta-like shimmer (square
# arpeggios and tubular bell here), and its modal G minor turn before the return.
#   intro  2 bars  bell and organ on D
#   a      8 bars  the theme, flute, organ, square shimmer
#   b      8 bars  the theme's second half, majestic on trumpet with crash and snare swells
#   c      8 bars  the cue's G minor turn: flute and bell, ending on A for the return
# 24-bar loop, 67 s (vanilla 68 s); vanilla ever_grande voicegroup.
# Brief (sw_subject): Ilum, the frozen crystal world and last destination (also the link rooms): majestic and cold.
