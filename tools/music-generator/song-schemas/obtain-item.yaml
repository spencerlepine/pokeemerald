# Obtain item (MUS_OBTAIN_ITEM, hot-swap): a one-shot sting heard constantly. SCRATCH (wiki audio:MUS_OBTAIN_ITEM,
# no film cue). Brief: "Got an item: short heroic sting (heard constantly)." Kept short and bright so it does not
# wear: a three-note trumpet pickup, a leap to C and up to E, then F - D - Bb over the flat-seventh Bb chord (the
# Star Wars cadence) home to C, with horn harmony, tuba, a square arpeggio and a square answer, and one cymbal on
# the landing. 120 bpm (vanilla's), two bars of 3/4: 3 s against vanilla's 2.8 s, on the vanilla fanfare voicegroup.
