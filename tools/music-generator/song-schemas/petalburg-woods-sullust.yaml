# Petalburg Woods, Sullust: net-new per-planet split of MUS_PETALBURG_WOODS (wiki row
# net:mus-petalburg-woods-sullust), for Ashen Pass and the Magma Tunnels. SCRATCH: no film cue, written from the
# brief. The Tatooine original is tense and echoing, low strings and distant horn calls; Sullust's version
# runs hot: C# minor on a 16th-note chug, a low string line in a, a flute climbing over it in b, then c hammers
# piano octaves under a 12.5 % square riff with the Neapolitan D (C#m-D) grinding before the G# dominant leads
# back. Kick and snare keep it moving, a wave-channel bass, metallic noise for steam vents.
# 24 bars at 130 = 44.3 s, vanilla tempo and voicegroup (MUS_PETALBURG_WOODS: petalburg_woods, 130 bpm, 42.2 s).
# Brief (sw_subject): Sullust version of MUS_PETALBURG_WOODS, same role and mood family; theme to be decided.
name: petalburg-woods-sullust
constant: MUS_PETALBURG_WOODS_SULLUST
form: AMBIENT
voicegroup: petalburg_woods       # vanilla's own: piano 1, strings 48, flute 73, squares 5/82, wave 81, kit 0, noise 127
master_volume: 80
tempo: 130
steps_per_beat: 4                 # 16th-note grid
time_signature: [4, 4]
seed: 52

parts:
  strings: {program: 48, channel: 0, volume: 84,  pan: -12, gate: 1.0, humanize: {vel: 4}}
  flute:   {program: 73, channel: 1, volume: 92,  pan: 12,  gate: 0.94, lfo_speed: 26, lfo_delay: 20, mod: 5, humanize: {vel: 5}}
  pad:     {program: 48, channel: 2, volume: 54,  pan: 26,  octave: 3, gate: 1.0}
  piano:   {program: 1,  channel: 3, volume: 82,  pan: -4,  octave: 2, gate: 0.85}
  kit:     {program: 0,  channel: 4, volume: 62,  pan: 8,   role: drums, kit: {k: 36, s: 38}}
  bass:    {program: 81, channel: 5, volume: 84,  pan: 0,   octave: 2, role: bass, gate: 0.6}
  riff:    {program: 5,  channel: 6, volume: 38,  pan: 32,  octave: 4, gate: 0.6, mono: true}
  vent:    {program: 127, channel: 7, volume: 28, pan: -32, role: drums, kit: {v: C4}}

progressions:
  intro: "C#m | G#"
  a: "C#m | C#m | A | B | C#m | C#m | F#m | G#"
  b: "A | B | G#m | C#m | A | F#m | D | G#"
  c: "C#m | D | C#m | D | A | F#m | D | G#"

phrases:
  chug: "^1:2 ^1:1 ^1:1 ^1+:2 ^1:2 ^1:2 ^1:1 ^1:1 ^1+:2 ^1:2"
  hammer: "^1:2 r:2 ^1:2 r:2 ^1:4 r:4"
  hammer_c: "^1:2 r:2 ^1:2 r:2 ^1:2 r:2 ^1:1 ^1:1 ^1:2"
  pad3: "^3:16"
  riff16: "^1:1 ^1:1 ^2:1 ^1:1 ^3:1 ^1:1 ^2:1 ^1:1 ^1:1 ^1:1 ^2:1 ^1:1 ^3:1 ^2:1 ^1+:1 ^3:1"
  str_a: |
    G#4:8 E4:8 | C#4:16 | E4:8 C#4:8 | D#4:16 |
    G#4:8 B4:8 | C#5:16 | A4:8 F#4:8 | G#4:16
  flute_b: |
    C#5:4 E5:4 A5:8 | F#5:6 D#5:2 B4:8 | B4:4 D#5:4 G#5:8 | E5:12 r:4 |
    A5:4 G#5:4 E5:4 C#5:4 | F#5:8 C#5:8 | D5:4 F#5:4 A5:4 F#5:4 | G#5:8 C5:8

grooves:
  drive: {k: "x.......x.x.....", s: "....o.......o..."}
  drive_c: {k: "x.....x...x.....", s: "....x.......x..o|....x.......x.xx"}
  vents: {v: "................|..........x.....|................|................"}

sections:
  intro:
    bars: 2
    chords: intro
    ramp: {bass: [-16, 0]}
    parts: {bass: chug, kit: drive, pad: pad3}
  a:
    bars: 8
    chords: a
    parts: {strings: str_a, piano: hammer, bass: chug, kit: drive, vent: vents}
  b:
    bars: 8
    chords: b
    parts: {flute: flute_b, pad: pad3, piano: hammer, bass: chug, kit: drive, vent: vents}
  c:
    bars: 8
    chords: c
    ramp: {riff: [-12, 0]}
    parts: {piano: hammer_c, riff: riff16, pad: pad3, bass: chug, kit: drive_c, vent: vents}

arrangement: [intro, a, b, c]
loop_start: a
