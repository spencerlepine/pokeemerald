# Garindan's Trick House (Route 110, Tatooine): hot-swap of MUS_TRICK_HOUSE (wiki audio:MUS_TRICK_HOUSE).
# SCRATCH (no film cue): written from the brief. Brief (sw_subject): Garindan's Trick House, sneaky and comic.
# E minor, 136 bpm (vanilla tempo), lightly swung: a tiptoe xylophone line full of chromatic approach notes and
# sliding sighs, a muted-trumpet answer strain, then a creeping Neapolitan (Em-F) and chromatic G-F# climb with
# timpani pops; staccato wave bass, 12.5% square offbeat pecks, soft kick, ghost snare and noise ticks.
# 24-bar loop, 42.4 s (vanilla 44.1 s).
