# Victory in a Trial: hot-swap of MUS_VICTORY_LEAGUE (wiki audio:MUS_VICTORY_LEAGUE). STYLE of "Ewok Celebration
# and Finale" (wiki ref_tracks soundtrack:return-jedi:11): an original tune, not a quote of Yub Nub. Taken from
# the cue: a bouncing folk-dance pulse around 140 bpm, a sing-along chant tune with call and answer, the
# Mixolydian flat-seven (Bb in C), hand drums and tambourine, flute on top and bells at the climax.
# Brief (sw_subject): "Passed a Trial / beat Obi-Wan." A village-celebration victory: 2-bar drum-and-bell pickup,
# then a 20-bar dance loop (flute chant, brass answer, bell-and-tutti tag ending on G7 back into the chant).
# 144 bpm (vanilla 140; 144 makes the loop frame-exact), 20-bar loop (33.3 s; vanilla 34.9 s), vanilla
# victory_league voicegroup.
name: victory-trials
replaces: MUS_VICTORY_LEAGUE
form: LOOP
voicegroup: victory_league        # kit 0 (congas, tambourine), tubular bell 14, pizzicato 45, timpani 47, trumpet 56, horn 60, flute 73, squares 12/80, wave 81
