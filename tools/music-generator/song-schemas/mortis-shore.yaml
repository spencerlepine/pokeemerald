# Mortis Shore (MUS_RG_SEVII_ROUTE, hot-swap): the Mortis Gate harbor and shore. SCRATCH (wiki
# audio:MUS_RG_SEVII_ROUTE has no film cue): written from the brief, "strange calm". D Lydian (the raised fourth,
# G#, over a D / E-over-D sway) gives the calm its strangeness; the B section slips through B minor and C major
# (a borrowed flat VII) to an E major turnaround.
#   a  8 bars  flute over harp arpeggios, a single organ note, wave bass, square twinkles
#   b  8 bars  the tune lower and darker (Bm, G, Em, C), the organ moving, the E-to-A turn home
# Brief (sw_subject): Mortis Gate harbor and shore, strange calm. Vanilla voicegroup rg_sevii_route, 124 bpm.
# Loop 16 bars, 31 s (vanilla 32.9 s).
