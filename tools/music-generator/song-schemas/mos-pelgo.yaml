  force: |
    r:12 E4:4 | A4:12 B4:4 | C5:6 D5:2 C5:4 E4:4 | A4:16 |
    r:4 E4:4 A4:4 E5:4 | D5:12 C5:2 B4:2 | C5:6 B4:2 A4:4 G#4:4 | A4:16
  strain: |
    C5:8 A4:4 C5:4 | E5:12 D5:2 C5:2 | D5:6 E5:2 F5:4 A4:4 | E5:16 |
    F5:6 E5:2 D5:4 C5:4 | E5:8 G4:4 C5:4 | B4:6 C5:2 D5:4 G#4:4 | B4:12 r:4
  pad: "^1:16"
  pad3: "^3:16"
  bass: "^1:16"
  bass_b: "^1:8 ^5-:8"
  pizz: "^1:4 ^3:4 ^5:4 ^3:4"
  echo_a: "r:16 | r:16 | r:16 | r:8 E6:4 A5:4 | r:16 | r:16 | r:16 | r:8 E6:4 A5:4"
  echo_b: "r:8 A5:4 C6:4 | r:8 G5:4 E5:4 | r:8 F5:4 A5:4 | r:8 E6:4 C6:4 | r:8 A5:4 F5:4 | r:8 E5:4 G5:4 | r:8 B5:4 G#5:4 | r:16"
  sq_b: "^3:16"

grooves:
  pulse: {lo: "x.......x.......", hi: "..........x...x."}
  pulse_b: {lo: "x.......x.......", hi: "....x.....x...x."}

sections:
  intro:
    bars: 1
    chords: intro
    parts: {conga: pulse, bass: bass, strings: pad3}
  a:
    bars: 8
    chords: a
    parts: {flute: force, strings: pad3, bass: bass, conga: pulse, echo: echo_a}
  b:
    bars: 8
    chords: b
    parts: {flute: strain, strings: pad, bass: bass_b, pizz: pizz, conga: pulse_b, echo: echo_b, sq: sq_b}

arrangement: [intro, a, b]
loop_start: a
