# Mos Pelgo homestead (Tatooine), the player's home: hot-swap of MUS_LITTLEROOT. ARRANGE of the Force theme
# statement in "The Return Home" (Binary Sunset; wiki soundtrack:new-hope:12, analyzed 0-90 s: ~64 bpm, A minor,
# Am/C/E then F and Am7). Kept: the tempo (64, also frame-exact for the loop), A minor, the Force theme itself
# (pickup, the rising fourth, the turn and the climb to the fifth, the slow descent through the leading tone)
# played on the flute as the cue's horn and woodwinds do, under a string pad and a slow conga pulse, then a
# second strain that lifts to C and F major (the beginnings) and turns on E back to the theme.
#   intro  1 bar   conga pulse and bass
#   a      8 bars  the Force theme, flute
#   b      8 bars  the continuation, flute higher, square echoes, pizzicato
# 16-bar loop, 60 s (vanilla 54.2 s); vanilla littleroot voicegroup.
# Brief (sw_subject): Mos Pelgo homestead: sparse desert morning, warm woodwinds over a slow hand-drum pulse, a theme of beginnings.
name: mos-pelgo
replaces: MUS_LITTLEROOT
form: LOOP
voicegroup: littleroot            # kit 0, squares 4-7, fretless 35, pizzicato 45, strings 48, flute 73
master_volume: 96
tempo: 64
steps_per_beat: 4
time_signature: [4, 4]
seed: 2

parts:
  flute:   {program: 73, channel: 0, volume: 104, pan: 6,   range: [E4, F5], gate: 0.97, lfo_speed: 26, lfo_delay: 30, mod: 6, humanize: {vel: 4}}
  strings: {program: 48, channel: 1, volume: 66,  pan: -22, octave: 4, range: [C4, C5], gate: 1.0}
  bass:    {program: 35, channel: 2, volume: 92,  pan: 0,   octave: 2, range: [E2, E3], gate: 0.95, role: bass}
  pizz:    {program: 45, channel: 3, volume: 74,  pan: 24,  octave: 4, range: [A3, A5], gate: 0.6}
  conga:   {program: 0,  channel: 4, volume: 76,  pan: -10, role: drums, kit: {lo: 64, hi: 62}}
  echo:    {program: 4,  channel: 5, volume: 36,  pan: 34,  range: [A4, A6], gate: 0.5, mono: true}
  sq:      {program: 5,  channel: 6, volume: 28,  pan: -34, octave: 4, range: [E4, E5], gate: 0.95, mono: true}

progressions:
  intro: "Am"
  a:     "Am | Am | F | Am | Am | Dm | F:8 E:8 | Am"
  b:     "F | C | Dm | Am | F | C | E | E"

