# Medal hall (Ilum): hot-swap of MUS_HALL_OF_FAME_ROOM (wiki audio:MUS_HALL_OF_FAME_ROOM). STYLE of "The Birth
# of the Twins and Padme's Destiny" (wiki ref_tracks soundtrack:revenge-sith:14): an original melody, not a quote.
# Taken from the cue: a slow minor-key elegy, a lone horn then flute singing over harp arpeggios and a soft string
# bed, harmony moving by step through the flat side (Dm Bb Gm A).
# Brief (sw_subject): walk into the medal hall, hushed, expectant. D minor, 108 bpm (a touch under the vanilla 114,
# to reach the AMBIENT loop range), no drums: horn phrase, then flute answering with the horn held under it, harp, strings, wave bass, a high square glint.
# AMBIENT, 16-bar loop, 35.6 s (vanilla 34.2 s).
