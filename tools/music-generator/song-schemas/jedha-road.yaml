# Jedha Road (MUS_ROUTE122, hot-swap): Routes 122-123 to Jedha. STYLE of "The High Council Meeting and Qui-Gon's
# Funeral" (wiki audio:MUS_ROUTE122, ref soundtrack:phantom-menace:16): an original chant-like line, not a quote.
# Taken from the cue: its tempo (analyze_reference 152 bpm, candidates 148-152.5; 150 here, where every clock is
# one frame), the funeral's processional pulse with the chant moving in half time over it, D minor modal colour,
# and the choral parallel fifths (horn with the tuba a fifth below) over a drone.
#   intro 2 bars  the D-A drone, timpani, the pilgrim's bell, horn on D then A with the tuba a fifth below
#   a     8 bars  the chant: horn, tuba a fifth below
#   b     8 bars  the flute answers high over a horn pedal
#   c     8 bars  the chant on trumpet with the horn and tuba, timpani rolls, settling back to the drone
# Brief (sw_subject): mystic pilgrim road, original chant-like line. Vanilla voicegroup route122. Loop 24 bars,
# 38.4 s (vanilla 46.5 s).
