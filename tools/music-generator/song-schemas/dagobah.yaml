# Dagobah, hot-swap of MUS_SOOTOPOLIS. ARRANGE of "Yoda's Theme" (wiki soundtrack:empire-strikes-back:02,
# analyzed 0-90 s: ~100 bpm, E minor; C, Em, G, Am, F#m in the misty opening, F# and Bm later). Kept: the tempo
# (100), the cue's misty E minor opening harmony on flute and harp, then Yoda's theme itself in the warm major
# (G here) on the horn, its second half on the flute over strings, and the turn back to the mist on B7. The swamp:
# soft glockenspiel bells, a harp drift, and insects on the Game Boy side (noise ticks, a high square chirp).
#   intro  2 bars  insects and harp
#   a      8 bars  the mist, flute low over harp and bells
#   b      8 bars  Yoda's theme, horn
#   c      8 bars  its second half, flute and strings, back to B7
# 24-bar loop, 57.6 s (vanilla 54.5 s); vanilla sootopolis voicegroup.
# Brief (sw_subject): Dagobah: misty swamp, mysterious and wise; woodwinds, soft bells, insects.
