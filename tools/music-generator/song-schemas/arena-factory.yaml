# Arena Factory (Grand Arena's Battle Factory, a droid foundry): hot-swap of MUS_B_FACTORY (wiki
# audio:MUS_B_FACTORY). ARRANGE of "Grievous and the Droids" (wiki ref_tracks soundtrack:revenge-sith:07). From the
# cue (analyze_reference, 0-90 s): 78 bpm with a 148 double-time candidate, counted here in double time at 156 so
# the cue's driving 16th figure becomes a machine-like 8th ostinato; G minor with its Bb7 and E (tritone) bars
# (1-8), the Gm-Edim rocking (16-21) and the Ab-G-D grind (22-25). The brass line is cut down to the cue's
# repeated-note menace motifs on trumpet with the horn underneath; the percussion becomes kit, anvil and timpani.
# Brief (sw_subject): Battle Factory, droid foundry, mechanical rhythm. Vanilla b_factory voicegroup: trumpet,
# horn, xylophone and tubular-bell clanks, 25% and 12.5% square ostinati, wave bass, frlg kit with the
# atarigane as an anvil, timpani, noise hats. 40-bar loop (build, motif, Gm-Edim, alarm, Ab-G grind), 61.5 s
# (vanilla 64.6 s).
