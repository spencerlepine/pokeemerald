# Fruit Crush (link minigame, Berry Crush): hot-swap of MUS_RG_GAME_CORNER (wiki audio:MUS_RG_GAME_CORNER,
# MINIGAME / LOOP). SCRATCH: no film cue, written from the brief in the Star Wars idiom of the Jawa scurries: a
# reedy organ tune in D dorian (Dm-G, the bright B natural), a scampering 12.5% square in sixteenths, a pumping
# wave bass, then trumpet and horn for a broader strain and a timpani "crush" break. 146 bpm like the vanilla song.
