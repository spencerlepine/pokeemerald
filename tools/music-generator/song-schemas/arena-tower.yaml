# Arena Tower (Grand Arena): hot-swap of MUS_B_TOWER (wiki audio:MUS_B_TOWER, FACILITY / LOOP).
# ARRANGE of "Bounty Hunter's Pursuit" (soundtrack:attack-clones:09), its opening chase (about 0:00-0:45): the
# driving staccato string ostinato in A minor, the Phrygian lean onto B-flat (Am-Bb, Bb7 to an A/E cadence), brass
# stabs and a trumpet line that climbs and slips down by half steps, timpani and snare pushing it. 132 bpm (the
# cue's 133, even). Cut to a 28-bar loop: chase (trumpet), climb (horn, rising chords), chase, a Bb-A break.
# Brief (sw_subject): Battle Tower (bounty hunter tower), tense climb.
