# Jedha Summit (MUS_MT_PYRE_EXTERIOR, hot-swap): Jedha's summit where the Guardians keep the kyber. STYLE of
# "Qui-Gon's Noble End" (wiki audio:MUS_MT_PYRE_EXTERIOR, ref soundtrack:phantom-menace:15): an original melody,
# not a quote. Taken from the cue: A minor (analyze_reference, r=0.41), its slow tempo (the 87.5 bpm candidate,
# 88 here), the choir-like sustained strings and the lament's modal turns (Am, F, G, Dm, the E major cadence).
#   intro 2 bars  wind in the noise channel, the string pad, the horn's A to B
#   a     8 bars  the melody on flute over harp and pad
#   b     8 bars  a low horn chant, the flute answering high
#   c     8 bars  square bells echo the melody, the flute's high answer over it, the wind higher
# Brief (sw_subject): windy, haunting, holy. Vanilla voicegroup mt_pyre_exterior. Loop 24 bars, 65.5 s
# (vanilla 61.2 s).
