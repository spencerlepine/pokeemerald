# Encounter: Empire. Hot-swap of MUS_ENCOUNTER_MAGMA (wiki audio:MUS_ENCOUNTER_MAGMA): eye-contact music for the
# 32 Imperial trainers. STYLE of "Imperial Attack" (soundtrack:new-hope:02): an original tune, not a quote. Taken
# from the cue: its 148 bpm drive, A minor pulled toward Bb (the half-step Imperial menace), brass on top, a
# military snare and a pounding low ostinato. Brief (sw_subject): Imperial troops appear: cold, marching.
