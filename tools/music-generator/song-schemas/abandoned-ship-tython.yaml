# Abandoned Ship, Tython: net-new per-planet split of MUS_ABANDONED_SHIP (wiki row net:mus-abandoned-ship-tython).
# SCRATCH: no film cue, written from the brief. Tython Isle is where the Jedi began, so the wreck there is less
# menace and more old mystery: D minor with a Phrygian-free, almost modal hush, an organ pad that creaks between
# two notes, harp lines that fall like water drips, a far-off horn call in the second half, a tolled bell, and
# short high square "drips" in the gaps. Tempo, voicegroup and loop length from the vanilla song it splits off
# (MUS_ABANDONED_SHIP: abandoned_ship, 100 bpm, 39.3 s AMBIENT loop).
# Brief (sw_subject): Tython version of MUS_ABANDONED_SHIP; same role and mood family (creaking hull, eerie,
# drips and groans), theme to be decided.
name: abandoned-ship-tython
constant: MUS_ABANDONED_SHIP_TYTHON
form: AMBIENT
voicegroup: abandoned_ship        # vanilla's own: organ 17, harp 46, bell 14, horn 60, timpani 47, squares 7/8, wave 81
master_volume: 80
tempo: 100
steps_per_beat: 2                 # eighth-note grid
time_signature: [4, 4]
seed: 3

parts:
  harp:    {program: 46, channel: 0, volume: 92,  pan: -14, gate: 0.95, humanize: {vel: 8}}
  horn:    {program: 60, channel: 1, volume: 86,  pan: 12,  gate: 0.95, humanize: {vel: 4}}
  org_hi:  {program: 17, channel: 2, volume: 50,  pan: 26,  octave: 3, gate: 1.0}
  org_lo:  {program: 17, channel: 3, volume: 48,  pan: -26, octave: 3, gate: 1.0}
  bell:    {program: 14, channel: 4, volume: 64,  pan: -30, gate: 1.0}
  timpani: {program: 47, channel: 5, volume: 80,  pan: 18,  gate: 1.0}
  bass:    {program: 81, channel: 6, volume: 84,  pan: 0,   octave: 2, role: bass, gate: 0.95}
  drip:    {program: 8,  channel: 7, volume: 40,  pan: 36,  gate: 0.5, mono: true}
  creak:   {program: 7,  channel: 8, volume: 34,  pan: -36, gate: 0.9, mono: true}

progressions:
  intro: "Dm | A"
  a: "Dm | Bb | Gm | A | Dm | Bb | Em7b5 | A"
  b: "Gm | Dm | Eb | Dm | Gm | Bb | Em7b5 | A7"

phrases:
  pad_lo: "^1:8"
  pad_hi: "^3:8"
  creak_pad: "^2:6 ^2-:2"
  groan: "^1:8"
  groan_b: "^1:6 ^1-:2"
  harp_a: |
    A4:2 F4:2 D4:2 E4:2 | F4:4 D4:2 Bb3:2 | G4:2 Bb4:2 D5:2 C5:2 | C#5:6 r:2 |
    A4:2 F4:2 D4:2 E4:2 | F4:2 G4:2 A4:2 D5:2 | Bb4:4 G4:2 E4:2 | E4:6 r:2
  horn_b: |
    G3:4 Bb3:2 D4:2 | A3:8 | G3:4 Bb3:2 Eb4:2 | D4:8 |
    G4:4 F4:2 D4:2 | F4:6 D4:2 | E4:4 G4:2 Bb4:2 | A4:6 C#4:2
  bell_a: "D4:8 | r:8 | r:8 | r:8 | D4:8 | r:8 | r:8 | A3:8"
  drip_a: "r:3 A5':1 r:4 | r:6 D6':1 r:1 | r:8 | F5':1 r:7 | r:5 E6':1 r:2 | r:8 | r:2 A5':1 r:5 | r:8"
  drip_b: "r:8 | r:5 G5':1 r:2 | r:8 | r:1 D6':1 r:6 | r:8 | r:3 F6':1 r:4 | r:8 | r:6 C#6':1 r:1"
  drip_intro: "r:3 A5':1 r:4 | r:6 D6':1 r:1"
  timp_b: "G2:2 r:6 | D2:2 r:6 | r:8 | D2:2 r:6 | G2:2 r:6 | r:8 | r:8 | A2:1 A2:1 A2:1 A2:1 A2:4"

sections:
  intro:
    bars: 2
    chords: intro
    ramp: {org_lo: [-10, 0], org_hi: [-14, 0]}
    parts: {org_lo: pad_lo, org_hi: pad_hi, harp: "D4:2 A3:2 F4:2 A3:2 | E4:2 A3:2 C#4:4", bell: "D4:8 | r:8", bass: groan, drip: drip_intro}
  a:
    bars: 8
    chords: a
    parts: {harp: harp_a, org_hi: pad_hi, org_lo: pad_lo, bell: bell_a, bass: groan, drip: drip_a, creak: creak_pad}
  b:
    bars: 8
    chords: b
    ramp: {horn: [-4, -8], timpani: [0, -16]}
    parts: {horn: horn_b, org_hi: pad_hi, org_lo: pad_lo, timpani: timp_b, bass: groan_b, drip: drip_b}

arrangement: [intro, a, b]
loop_start: a
