# Too bad (MUS_TOO_BAD, hot-swap): a one-shot sting. SCRATCH (wiki audio:MUS_TOO_BAD, no film cue). Brief: "Lost a
# round: deflating trombone." A bright trumpet start (C - E - G) that the low brass lets down: the horn, played as
# a trombone, sags F# - F - E - Eb over a tuba sinking chromatically to low C (C minor), while a square slides down
# twelve semitones like air going out, with one dull kick on the landing. 180 bpm (vanilla's), one bar of 7/4:
# 2.3 s like vanilla, on the vanilla fanfare voicegroup.
