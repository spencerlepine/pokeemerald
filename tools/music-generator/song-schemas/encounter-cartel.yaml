# Encounter: Hutt Cartel thugs. Hot-swap of MUS_ENCOUNTER_AQUA (wiki audio:MUS_ENCOUNTER_AQUA, ENCOUNTER / LOOP).
# STYLE of "Han Solo Returns (At the Court of Jabba the Hutt)" (wiki ref_tracks soundtrack:return-jedi:05): an
# original tune, not a quote. Taken from the cue: its 136 bpm, the low, lurching palace swagger, chromatic
# slides and flat-ninth bite. Brief (sw_subject): Hutt Cartel thugs appear, sleazy, threatening.
# D minor shuffle: 2-bar sting (a chromatic trumpet slither onto A7), then a 16-bar loop (28.2 s; vanilla 27.4 s)
# of two strains (Dm-Bb7-A7 / Gm-Dm-Eb7-A7). Trumpet tune, slap bass, organ drone, both squares as the 3rd and
# 7th shell of each chord on the off-beats, wave doubling the trumpet an octave down in the second strain,
# kick and snare, noise hats.
