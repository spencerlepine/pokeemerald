# Encounter: suspicious trainers. Hot-swap of MUS_ENCOUNTER_SUSPICIOUS (wiki audio:MUS_ENCOUNTER_SUSPICIOUS):
# eye-contact music for the 50 smugglers and cultists. SCRATCH (no film cue): an original creeping tune in E minor
# with the Phrygian F and chromatic slips, in the sneaking-Jawa idiom: staccato pizzicato ostinato, low flute
# on tiptoe, a nasal 12.5% square answering in the second strain, hand-drum congas and a noise shaker. Vanilla
# voicegroup and tempo. Brief (sw_subject): eye-contact jingle, suspicious trainers (smugglers, cultists).
