# Diving (Dagobah's underwater routes, Drowned Cavern; Kashyyyk and Yavin 4 until their splits land): hot-swap of
# MUS_UNDERWATER (wiki audio:MUS_UNDERWATER, AMBIENT). STYLE of "Passage Through the Planet Core" (ref_tracks
# soundtrack:phantom-menace:10): no quote. Taken from the cue: its F minor and the deep, murky orchestration
# (low strings, harp, a woodwind line above, the bassy sea-monster pedal), but slowed right down to drift, as the
# brief asks: a long flute line over a single string voice, harp figures that rise and sink, a wave-channel
# pedal, the voicegroup's own bubbles sample and a square glint now and then from the surface far above.
# Vanilla: underwater voicegroup, 86 bpm, 86.5 s loop; this one 66 bpm, 20 bars, 72.7 s.
# Brief (sw_subject): muffled, slow, floating.
