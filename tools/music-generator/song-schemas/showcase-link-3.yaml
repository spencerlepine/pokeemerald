# Showcase Link 3 (Contest Hall, link play): hot-swap of MUS_LINK_CONTEST_P3 (wiki audio:MUS_LINK_CONTEST_P3,
# FACILITY / LOOP). The same piece as showcase.yaml (MUS_CONTEST), re-voiced, as the row asks: ARRANGE of
# "Augie's Great Municipal Band" (soundtrack:phantom-menace:17, the parade half), the Emperor's theme turned into
# a bright A major parade march over an A-E pedal, 144 bpm, 24-bar loop.
# Variant 3 re-voices it soft and warm: horn on the first strain over strings, flute in the middle, flute and
# horn together on the return; a lighter snare-and-kick march. 7 tracks like the vanilla link song.
# Brief (sw_subject): Link Showcase stage, variant 3.
