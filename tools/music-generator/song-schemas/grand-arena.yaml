# Grand Arena grounds (Lando's battle resort): hot-swap of MUS_B_FRONTIER (wiki audio:MUS_B_FRONTIER). ARRANGE of
# "Lando's Palace" (wiki ref_tracks soundtrack:empire-strikes-back:16). From the cue (analyze_reference, 0-90 s):
# 63 bpm, played here in double time at 126 for the resort's swagger; E major floating on Esus4 with the borrowed
# Am7, the Dm-G7 side-step (bars 1-11), and the Abm, G, Bb augmented colour of its second half (bars 12-20); the
# cue's shimmering harp/celesta figure under a soaring line. The line is written in the cue's manner for trumpet,
# then a flashy C-D-E (bVI-bVII-I) strain of our own to drive the loop home.
# Brief (sw_subject): Grand Arena grounds, flashy, confident. Vanilla b_frontier voicegroup: trumpet, harp,
# strings, horn, timpani, 25% square shimmer, wave bass, frlg kit with tambourine, noise hats. 24-bar loop, 45.7 s
# (vanilla 43.5 s).
