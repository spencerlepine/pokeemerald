# Obtain hunter mark (MUS_OBTAIN_SYMBOL, hot-swap): a one-shot sting. SCRATCH (wiki audio:MUS_OBTAIN_SYMBOL, no
# film cue). Brief: "Earned an Arena Boss symbol (bounty hunter mark)." A bounty-hunter flavour in A minor: a lone
# nylon-guitar riff and a dark horn line over a dry wave bass and noise ticks (the Mandalorian idiom), turning to A
# major at the end (the mark is earned) with a timpani roll, a tubular bell and a square arpeggio. 122 bpm
# (vanilla's), two bars of 5/4: 4.9 s against vanilla's 5.2 s, on the vanilla b_frontier voicegroup.
