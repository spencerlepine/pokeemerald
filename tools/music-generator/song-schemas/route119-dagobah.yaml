  run: "^1:2 ^2:2 ^3:2 ^2:2 ^1:2 ^2:2 ^3:2 ^2:2"
  run_hi: "^1:2 ^3:2 ^5:2 ^3:2 ^2:2 ^3:2 ^5:2 ^3:2"
  walk: "^1:4 ^1:2 ^5-:2 ^1:4 ^5-:4"
