# Dagobah open seas (Routes 129-130): net-new per-planet split of MUS_ROUTE119. ARRANGE of "The Training of a
# Jedi Knight" (wiki net:mus-route119-dagobah, ref_tracks soundtrack:empire-strikes-back:03): the cue's running
# training music, Luke carrying Yoda through the swamp, with the Force theme stated broadly over it.
# Taken from the cue (analyze_reference: D minor / A-sus colour, Bb and Gm side-steps, ~131 bpm running pulse):
# the Force theme (5-1-2-b3, 4-b3, 5-1-2-b3) on horn then trumpet, a running string ostinato, wave bass on the
# roots, a light kit. Tech from the placeholder MUS_ROUTE119: route119 voicegroup, LOOP, ~73 s (this loop 58 s).
# Brief (sw_subject): Dagobah version of Route 119, same lush, wandering, huge-scale route mood.
name: route119-dagobah
constant: MUS_ROUTE119_DAGOBAH        # wiki sw_constant (net:mus-route119-dagobah)
form: LOOP
voicegroup: route119                  # harp 46, timpani 47, strings 48, trumpet 56, horn 60, glock 9, kit 0, squares, wave
master_volume: 90
tempo: 132
steps_per_beat: 4
time_signature: [4, 4]
seed: 19

parts:
  horn:    {program: 60, channel: 0, volume: 100, pan: -8,  range: [A3, D5], gate: 0.95, humanize: {vel: 4}}
  trumpet: {program: 56, channel: 1, volume: 96,  pan: 8,   range: [A3, A5], gate: 0.92, humanize: {vel: 4}}
  strings: {program: 48, channel: 2, volume: 70,  pan: -24, octave: 4, range: [A3, A4], gate: 0.7}
  bass:    {program: 84, channel: 3, volume: 104, pan: 0,   octave: 2, range: [D2, D3], gate: 0.7, role: bass}
  timpani: {program: 47, channel: 4, volume: 90,  pan: 14,  range: [A1, D3], gate: 1.0}
  drums:   {program: 0,  channel: 5, volume: 70,  pan: 10,  role: drums, kit: {kick: 36, sn: 38, hat: 42, crash: 57}}
  arp:     {program: 81, channel: 6, volume: 42,  pan: 30,  octave: 4, range: [D4, D6], gate: 0.5, mono: true}
  echo:    {program: 80, channel: 7, volume: 38,  pan: -32, range: [A3, A5], gate: 0.8, mono: true}

