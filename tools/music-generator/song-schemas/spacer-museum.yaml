# Spacer museum (Mos Eisley): hot-swap of MUS_OCEANIC_MUSEUM (wiki audio:MUS_OCEANIC_MUSEUM). STYLE of "He Is
# the Chosen One" (wiki ref_tracks soundtrack:phantom-menace:08): an original melody, not a quote. Taken from the
# cue: its hushed sense of wonder, a single line floating high over harp and sustained strings, Lydian
# brightness (G over F) and Williams' chromatic-mediant lifts (Ab, Bb, C).
# Brief (sw_subject): wonder at old starships, gentle synth. C major, 120 bpm (vanilla tempo): square-wave synth
# lead with vibrato, a twinkling square echo, harp arpeggios, string pad, fretless bass, soft kick and tambourine
# from the middle on. 36-bar loop (A, B, A with the strings on the tune, the mediant climb, a 4-bar tag), 72 s
# (vanilla 80.1 s).
