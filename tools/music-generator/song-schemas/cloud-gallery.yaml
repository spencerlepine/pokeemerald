# soundtrack:attack-clones:02): an original melody, not a quote. Taken from the cue: D minor, slow and yearning,
# a long string line rising through the triad, the flat-side colour (Bb, Gm, the Eb Neapolitan turn) and a
# half-cadence on A at each phrase end, broken-chord piano under it.
# Brief (sw_subject): refined, slow chamber strings. 68 bpm (vanilla tempo): first-violin tune and second-violin
# counter on the strings sample, pizzicato bass, piano broken chords, a soft square echo in the last strain.
# 24-bar loop (A, B, A'), 84.7 s (vanilla 89.1 s).
