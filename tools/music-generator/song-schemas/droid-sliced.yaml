# Droid sliced (MUS_DROID_SLICED, net-new): a one-shot sting before the capture loop when a droid is sliced. SCRATCH
# (wiki net:mus-droid-sliced, no film cue; tech notes from its placeholder audio:MUS_RG_CAUGHT_INTRO). Brief: "A
# droid is sliced (the droid version of a capture): short sting before the capture loop." The hack: two beats of
# scrambled square arpeggios and tritone piano stabs over a pulsing wave bass and claps (the slicer working the
# lock), access-granted beeps on the second square and a scale running up into D, then strings, trumpet and horn
# land on D major with the cymbal. 64 bpm and the rg_caught_intro voicegroup (the placeholder's), one 4/4 bar:
# 3.75 s against the placeholder's 3.6 s.
name: droid-sliced
constant: MUS_DROID_SLICED
form: JINGLE
loop: false
player: SE2
song_priority: 5
voicegroup: rg_caught_intro   # frlg fanfare kit 0, piano 2, strings 48, trumpet 56, horn 60, squares 80/81, wave 87
master_volume: 94
tempo: 64
steps_per_beat: 6
time_signature: [4, 4]
seed: 20

parts:
  scramble: {program: 80, channel: 0, volume: 50,  pan: 26,  range: [D5, F6], gate: 0.5, mono: true}
  beeps:    {program: 81, channel: 1, volume: 50,  pan: -26, range: [A5, D6], gate: 0.5, mono: true}
  bass:     {program: 87, channel: 2, volume: 76,  pan: 0,   range: [A1, D2], gate: 0.7, mono: true}
  piano:    {program: 2,  channel: 3, volume: 80,  pan: 12,  range: [F4, B4], gate: 0.6}
  strings:  {program: 48, channel: 4, volume: 72,  pan: -22, range: [A3, D4], gate: 1.0}
  trumpet:  {program: 56, channel: 5, volume: 102, pan: 4,   range: [D5, D5], gate: 0.95}
  horn:     {program: 60, channel: 6, volume: 88,  pan: -12, range: [F#4, F#4], gate: 0.95}
  kit:      {program: 0,  channel: 7, volume: 76,  pan: 14,  role: drums, kit: {clap: 39, crash: 49}}

grooves:
  slice:
    clap:  "...x.....x..o.o.o.......|"
    crash: "..................x.....|"

sections:
  sting:
    bars: 1
    parts:
      scramble: "D6:1 A5:1 F6:1 C6:1 G#5:1 E6:1 D6:1 B5:1 F6:1 C#6:1 G5:1 E6:1 D5:1 E5:1 F#5:1 A5:1 B5:1 D6:1 r:6"
      beeps:    "r:12 A5':1 r:1 A5':1 r:1 D6:2 r:6"
      bass:     "D2:1 r:2 D2:1 r:2 D2:1 r:2 D2:1 r:2 A1:6 D2:6"
      piano:    "F4:1 r:2 B4:1 r:2 F4:1 r:2 B4:1 r:2 r:12"
      strings:  "r:12 A3:6 D4:6"
      trumpet:  "r:18 D5:6"
      horn:     "r:18 F#4:6"
      kit:      slice

arrangement: [sting]
