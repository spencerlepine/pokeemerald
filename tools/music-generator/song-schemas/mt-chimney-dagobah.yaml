# Mt. Chimney, Dagobah version (MUS_MT_CHIMNEY_DAGOBAH, net-new): the dangerous-place music for the Dagobah maps
# (the Drowned Cavern). SCRATCH (wiki net:mus-mt-chimney-dagobah has no film cue): written from the brief, in the
# family of Mustafar's theme (low brass, a pulse, a dark minor) but wet instead of hot: C minor with the flat
# second (Db) and the flat fifth (Gb) for the swamp's menace, water dripping on 12.5% squares, a creeping wave
# bass, and bubbles in the noise channel. Tech notes from the placeholder vanilla MUS_MT_CHIMNEY: voicegroup
# mt_chimney, 124 bpm.
#   intro 2 bars  the pedal and the first drips
#   a     8 bars  drips over a string drone (C against Db) and the low pedal
#   b     8 bars  a lonely horn line sinking through Db and Gb, timpani heartbeat
#   c     8 bars  the creeping bass ostinato, strings moving in half steps, drips
#   d     8 bars  the horn line again with the tuba under it, fading back to the drone
# Brief (sw_subject): Dagobah version of Mustafar's dangerous-place theme, same role and mood family.
# Loop 32 bars, 61.9 s.
name: mt-chimney-dagobah
constant: MUS_MT_CHIMNEY_DAGOBAH
form: LOOP
voicegroup: mt_chimney        # horn 60, tuba 58, strings 48, timpani 47, squares 81/83, wave 82, noise 127
master_volume: 80
tempo: 124
steps_per_beat: 4
time_signature: [4, 4]
seed: 13

parts:
  horn:    {program: 60, channel: 0, volume: 94,  pan: -8,  gate: 0.96, humanize: {vel: 4}}
  tuba:    {program: 58, channel: 1, volume: 80,  pan: 6,   gate: 0.96, transpose: -12}
  strings: {program: 48, channel: 2, volume: 62,  pan: -26, gate: 1.0}
  timpani: {program: 47, channel: 3, volume: 80,  pan: 0,   gate: 1.0}
  bass:    {program: 82, channel: 4, volume: 86,  pan: 0,   gate: 0.7, mono: true}
  drip:    {program: 81, channel: 5, volume: 44,  pan: 30,  gate: 0.3, mono: true}
  drip2:   {program: 83, channel: 6, volume: 30,  pan: -34, gate: 0.3, mono: true}
  bubble:  {program: 127, channel: 7, volume: 26, pan: 10,  role: drums, kit: {b1: C4, b2: G4}}

phrases:
  pedal: "C2:16"
  creep: "C2:2 r:2 C2:2 Db2:2 r:4 C2:2 r:2 | C2:2 r:2 Eb2:2 D2:2 r:4 Db2:2 r:2"
  drone: "C4:16 | Db4:16"
  drone_move: "C4:16 | Db4:16 | D4:16 | Db4:16 | C4:16 | B3:16 | C4:16 | Db4:16"
  drops: "r:3 G5:1 r:6 Eb6:1 r:5 | r:8 C6:1 r:4 G5:1 r:2"
  drops2: "r:11 Db6:1 r:4 | r:2 Ab5:1 r:13"
  lonely: |
    C4:8 Eb4:4 D4:4 | Db4:16 | C4:8 G4:4 F4:4 | Gb4:16 | Ab4:8 G4:4 F4:4 | Eb4:8 D4:8 | Db4:16 | C4:16
  heart: "C2:2 r:2 C2:2 r:10 | r:16"

grooves:
  bubbles:
    b1: "......o.........|..........o....."
    b2: "...........o....|...o............"

sections:
  intro:
    bars: 2
    parts: {bass: pedal, drip: drops, strings: drone, bubble: bubbles, tuba: "C3:16 | C3:16"}
  a:
    bars: 8
    parts: {bass: pedal, strings: drone, drip: drops, drip2: drops2, bubble: bubbles, tuba: "C3:16 | C3:16"}
  b:
    bars: 8
    parts: {horn: lonely, bass: pedal, strings: drone, timpani: heart, drip: drops, bubble: bubbles}
  c:
    bars: 8
    parts: {bass: creep, strings: drone_move, drip: drops, drip2: drops2, timpani: heart, bubble: bubbles, tuba: "C3:16 | C3:16"}
  d:
    bars: 8
    ramp: {horn: [0, -16], tuba: [-6, -22]}
    parts: {horn: lonely, tuba: lonely, bass: pedal, strings: drone, drip: drops, bubble: bubbles}

arrangement: [intro, a, b, c, d]
loop_start: a
