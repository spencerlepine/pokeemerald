  horn:  {program: 60, channel: 1, volume: 94,  pan: -12, range: [G3, A4], gate: 0.95}
  tuba:  {program: 58, channel: 2, volume: 100, pan: 0,   octave: 2, range: [E2, A3], gate: 0.5, role: bass}
  pizz:  {program: 45, channel: 3, volume: 80,  pan: 22,  octave: 4, range: [C4, B4], gate: 0.5}
  echo:  {program: 80, channel: 4, volume: 40,  pan: -30, range: [E4, A6], gate: 0.6, mono: true}
  tick:  {program: 84, channel: 5, volume: 30,  pan: 30,  range: [A5, A5], gate: 0.2, mono: true}
  wave:  {program: 81, channel: 6, volume: 36,  pan: -20, range: [A3, A5], gate: 0.5, mono: true}

