# Frontier outposts (Tosche Station, Tatooine), hot-swap of MUS_OLDALE. ARRANGE of "The Desert and the Robot
# Auction" (wiki soundtrack:new-hope:04, analyzed 0-90 s: 58.7 bpm with a 115-119 double, minor with chromatic
# diminished turns). Kept: the Jawa scene's jaunty double-time pulse (116), a minor key with a dorian F#, the
# bassoon-and-tuba oom-pah, plucked off-beats and a reedy tune full of snapped grace figures (flute and squares
# here; written in the cue's manner, as the orchestral draft was too rough to quote note for note), then a lazy
# horn strain in C that turns on E back home. Vanilla oldale has no drum kit and this keeps it that way: the
# rhythm is tuba, pizzicato and a square tick.
#   intro  1 bar   tuba and pizzicato
#   a      8 bars  the tune, flute with a square echo
#   b      8 bars  horn strain, flute chirps
# 16-bar loop, 33 s (vanilla 38.4 s); vanilla oldale voicegroup.
# Brief (sw_subject): Small frontier settlements: relaxed, friendly, a little dusty.
name: outpost
replaces: MUS_OLDALE
form: LOOP
voicegroup: oldale                # squares 4-7/80/82-84, wave 81, pizzicato 45, strings 48, tuba 58, horn 60, flute 73
master_volume: 82
tempo: 116
steps_per_beat: 4
