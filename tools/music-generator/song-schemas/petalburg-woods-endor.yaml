# Petalburg Woods, Endor: net-new per-planet split of MUS_PETALBURG_WOODS (wiki row
# net:mus-petalburg-woods-endor), for Scorched Hollow. STYLE of "Into the Trap" (ref_tracks
# soundtrack:return-jedi:02): an original melody, not a quote. Taken from the cue (analyze_reference, 0-90 s):
# its tempo (123 -> 122), the Gm / Am7 rocking harmony with D as the dominant, and the texture: a driving low
# ostinato under long, tense string lines, woodwind answers and distant brass calls (here a 50 % square, since
# the vanilla voicegroup has no brass). a strings over the ostinato, b flute and the far calls, c strings climb
# on a held D-E over an orchestra-snare build and a 12.5 % square arpeggio. 24 bars at 122 = 47.2 s.
# Brief (sw_subject): Endor version of MUS_PETALBURG_WOODS (tense and echoing, low strings, distant horn calls);
# theme to be decided.
