# Pirin (Sullust): net-new MUS_OLDALE_SULLUST, the Sullust split of MUS_OLDALE (outpost). STYLE of "Return to
# Tatooine" (wiki soundtrack:attack-clones:10): an original tune, not a quote. Taken from the cue (analyzer
# 0-120 s): its tempo (86), A minor with its darkening F and Bb minor turns and the E that keeps pulling home,
# the low horn and strings colour and a slow plucked heartbeat; kept in outpost's family (a small friendly
# settlement) by a flute strain that lifts in F and C. Tech notes from the vanilla song it splits from
# (MUS_OLDALE): oldale voicegroup, no drum kit, volume 80.
#   intro  1 bar   tuba and pizzicato heartbeat
#   a      8 bars  the horn tune over strings, Bb minor shading
#   b      8 bars  the flute strain, square ember echoes, back to E
# 16-bar loop, 44.7 s (vanilla 38.4 s).
# Brief (sw_subject): Sullust version of MUS_OLDALE (MUS_OUTPOST) for Pirin; same role and mood family as the Tatooine original.
