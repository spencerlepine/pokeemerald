# Mos Entha (Tatooine), Dad's arena town: hot-swap of MUS_PETALBURG. ARRANGE of "Panaka and the Queen's
# Protectors" (wiki soundtrack:phantom-menace:12, analyzed 0-90 s: 152 bpm, A minor with Bb and G minor turns,
# E and Esus4 as the dominant). Kept: the tempo (152, felt in two as a march), A minor with the cue's Bb
# (Neapolitan) edge and its G minor/Bb passage, the brass fanfare figures (75% squares, the Game Boy brass), the
# string line and a light military snare, as a proud guards' march rather than the cue's chase.
#   intro   2 bars  snare and bass
#   a       8 bars  square fanfare tune over strings and snare
#   b       8 bars  the strings take a broad proud line, flute above
#   bridge  4 bars  the cue's G minor/Bb turn, square ostinato and a snare roll back to the top
# 20-bar loop, 31.6 s (vanilla 32.4 s); vanilla petalburg voicegroup.
# Brief (sw_subject): Mos Entha, Dad's arena town: steady and proud with a light military snare (Doran is an ex-Republic veteran).
