# Tipoca City (Kamino): net-new MUS_LILYCOVE_KAMINO, the Kamino split of MUS_LILYCOVE (Cloud City). SCRATCH:
# written from the brief, no film cue. Same family as cloud-city (elegant and airy with an edge) but wet and
# clinical: D minor with Bbmaj7 colour, a pizzicato ostinato like the cloning lines ticking over, a cool flute line,
# strings for the second strain, and rain on the noise channel. Tech notes from the vanilla song it replaces on
# the Kamino maps (MUS_LILYCOVE): lilycove voicegroup, volume 85, a loop near 56 s.
#   intro  2 bars  rain and the pizzicato ostinato
#   a      8 bars  flute line, harp, square glints
#   b      8 bars  strings take the second strain in F, ending on A7 for the return
# 80 bpm, 18 bars counting the intro, 16-bar loop of 48 s.
# Brief (sw_subject): Kamino version of MUS_LILYCOVE (MUS_CLOUD_CITY) for Tipoca City; same role and mood family as the Bespin original.
name: lilycove-kamino
constant: MUS_LILYCOVE_KAMINO
form: LOOP
voicegroup: lilycove              # pizzicato 45, harp 46, strings 48, horn 60, flute 73, squares 80/81, wave 82, noise 127
master_volume: 85
tempo: 80
steps_per_beat: 4
time_signature: [4, 4]
seed: 18

parts:
  flute:   {program: 73, channel: 0, volume: 96,  pan: 8,   range: [D5, C6], gate: 0.96, lfo_speed: 26, lfo_delay: 24, mod: 4, humanize: {vel: 4}}
  strings: {program: 48, channel: 1, volume: 84,  pan: -14, range: [F4, Bb5], gate: 1.0}
  pizz:    {program: 45, channel: 2, volume: 80,  pan: 22,  octave: 4, range: [D4, D5], gate: 0.6, humanize: {vel: 6}}
  harp:    {program: 46, channel: 3, volume: 66,  pan: -26, octave: 3, range: [D3, D5], gate: 0.9}
  bass:    {program: 82, channel: 4, volume: 92,  pan: 0,   octave: 2, range: [D2, D3], gate: 0.9, role: bass}
  glint:   {program: 81, channel: 5, volume: 30,  pan: 34,  range: [A5, A6], gate: 0.4, mono: true}
  rain:    {program: 127, channel: 6, volume: 22, pan: -10, role: drums, kit: {r: A6, d: C5}}

progressions:
  intro: "Dm | Dm"
  a:     "Dm | Bbmaj7 | Gm | A | Dm | Bbmaj7 | Gm:8 C:8 | A"
  b:     "F | C | Dm | Am | Bb | F | Gm | A7"

phrases:
  line: |
    A5:8 F5:4 D5:4 | D5:6 E5:2 F5:8 | G5:6 A5:2 Bb5:4 G5:4 | E5:12 r:4 |
    A5:8 F5:4 D5:4 | A5:6 C6:2 A5:8 | G5:4 Bb5:4 E5:4 G5:4 | E5:12 r:4
  strain: |
    C5:8 A4:4 F4:4 | G4:6 A4:2 E5:8 | F5:6 E5:2 D5:4 A4:4 | C5:12 r:4 |
    D5:8 F5:4 Bb5:4 | A5:6 G5:2 F5:8 | G5:6 F5:2 D5:4 Bb4:4 | C#5:8 E5:4 G5:4
  tick: "^1:2 ^2:2 ^3:2 ^2:2 ^1:2 ^2:2 ^3:2 ^4:2"
  harp: "^1:4 ^3:4 ^5:8"
  bass: "^1:12 ^1:4"
  glints: "r:14 A6:2 | r:16 | r:12 D6:2 G6:2 | r:16"

grooves:
  rain:
    r: "x.x.xx.x.x.xx.x.|.x.x.x.xx.x.x.x.|x.x.x.x.x.xx.x.x|.x.xx.x.x...x..x"
    d: "................|................|................|..........x....."

sections:
  intro:
    bars: 2
    chords: intro
    parts: {pizz: tick, rain: rain, bass: bass, flute: "r:16 | r:12 C#5:2 E5:2"}
  a:
    bars: 8
    chords: a
    parts: {flute: line, pizz: tick, harp: harp, bass: bass, glint: glints, rain: rain}
  b:
    bars: 8
    chords: b
    parts: {strings: strain, pizz: tick, harp: harp, bass: bass, rain: rain}

arrangement: [intro, a, b]
loop_start: a
