# Long Route (MUS_ROUTE120, hot-swap): the long travel routes across Endor, Yavin 4 and Dagobah (120-128).
# ARRANGE of "Han Solo and the Princess" (wiki audio:MUS_ROUTE120, ref soundtrack:empire-strikes-back:07).
# analyze_reference read the cue at 92.3 bpm (92 here); its chords wander through the love theme's keys and the
# melody draft is too rough to use, so the theme is written from the tune, moved to C: the rising sixth that
# opens it, the stepwise fall back, and the bridge's turn to the minor iv (F minor, Williams' romantic colour).
#   a   8 bars  the theme on flute over harp arpeggios, a string line and wave bass
#   a2  8 bars  the theme on trumpet, horn counter-line, squares glinting
#   b   8 bars  the bridge (A minor, F, the F minor turn), timpani swell into the G7 that leads back to a
# Brief (sw_subject): hopeful and sweeping. Loop 24 bars, 62.6 s (vanilla 57.3 s at 134 bpm; the love theme
# needs its own slower tempo).
