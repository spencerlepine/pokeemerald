# Felucia Reserve: hot-swap of MUS_SAFARI_ZONE (wiki audio:MUS_SAFARI_ZONE). STYLE of "The Trip to the Naboo
# Temple and The Audience with Boss Nass" (wiki ref_tracks soundtrack:phantom-menace:06): an original melody, not
# a quote. Taken from the cue: the Gungan bounce, a comic oom-pah low end, bright mallet colour and hand
# percussion, and a Mixolydian major with the flat seventh (C in D) and a flat-six lift (Bb) before the turn.
# Brief (sw_subject): alien fungal jungle, colourful and bouncy. D Mixolydian, 142 bpm (vanilla tempo): xylophone
# tune, staccato wave bass, square offbeat stabs and a 12.5% square sparkle, congas, kick, tambourine-like noise
# shaker, timpani pops in the turn. 12-bar loop, 20.3 s (vanilla 20.5 s).
