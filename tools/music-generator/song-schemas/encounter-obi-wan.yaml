# Encounter: Obi-Wan. Hot-swap of MUS_ENCOUNTER_CHAMPION (wiki audio:MUS_ENCOUNTER_CHAMPION, ENCOUNTER / LOOP).
# STYLE of "The Return Home" (wiki ref_tracks soundtrack:new-hope:12): an original melody, not the Force theme.
# Taken from the cue: its slow, noble 66 bpm pulse (doubled to 132 here so it moves like an encounter), the
# D minor / F major warmth with the Gm-A turn of the Force theme's harmony, a long-breathed brass line.
# Brief (sw_subject): Obi-Wan greets the player in the temple.
# 2-bar sting, then a 16-bar loop (29.1 s; vanilla 27.0 s): trumpet states the tune (Dm, Bb, F, C), the flute
# answers higher (Bb, F, Gm, Dm, C) and turns on A back to the start. Nylon guitar arpeggios, organ pad, wave bass,
# timpani on the downbeats, square counter-line and arpeggios, noise brush pattern.
