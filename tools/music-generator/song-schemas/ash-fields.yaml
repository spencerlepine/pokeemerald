# Ash Fields (MUS_ROUTE113, hot-swap): Route 113, Sullust's ash fields. SCRATCH (wiki audio:MUS_ROUTE113 has no
# film cue): written from the brief. D minor and its relatives (Bb, F, C, Gm), two bars to a chord, so the
# harmony drifts like the ash; the "muted bells" are short high harp notes and 12.5% squares falling in thirds,
# with a soft noise hiss underneath.
#   a  8 bars  a sparse flute line over falling harp bells and a string pad
#   b  8 bars  a low horn phrase through G minor, the bells continuing
#   c  8 bars  bells, pad and hiss only (the quiet heart of the loop)
#   d  8 bars  the flute line again over a nylon-guitar arpeggio, turning back to D minor
# Brief (sw_subject): soft falling-ash ambience, muted bells. Vanilla voicegroup route113, 128 bpm. Loop 32 bars,
# 60 s (vanilla 67.5 s).
