# Mortis Gate and the event-island caves: hot-swap of MUS_RG_SEVII_CAVE (wiki audio:MUS_RG_SEVII_CAVE, AMBIENT).
# SCRATCH (no film cue): written from the brief. Mortis is the realm of the Father, the Son and the Daughter, so
# the loop turns between light and dark on one E pedal: 8 bars of E lydian (the raised A# glowing), 8 of E
# phrygian (the F natural pulling down), then 8 where they overlap. A piano figure is echoed in canon by the
# two squares (an eighth and a quarter later, softer each time) so the cave answers itself; strings hold a
# single high line, the wave holds the pedal. Vanilla: rg_mt_moon voicegroup, 110 bpm, 92.1 s loop; this one
# 80 bpm, 24 bars, 72 s (the long end of the vanilla AMBIENT range).
# Brief (sw_subject): otherworldly, echoing.
