# Evolution: hot-swap of MUS_EVOLUTION (wiki audio:MUS_EVOLUTION, EVENT / LOOP). SCRATCH (no film cue): an
# original Force-mystery loop. Brief (sw_subject): evolution in progress, rising, mysterious, Force-like hum.
# D minor with Williams-style mediant turns (Dm, Bb, Gm, A / Dm, F, Eb, A) at the vanilla 120 bpm: 16 bars,
# 32 s (vanilla 32.0 s, frame-exact). Rising square arpeggios over a wave-channel drone (the hum), a slow horn
# line, a held square pad that breaks into pulses in the second half, soft timpani swells into each half.
