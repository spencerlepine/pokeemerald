# Arena Pyramid Top (Grand Arena): hot-swap of MUS_B_PYRAMID_TOP (wiki audio:MUS_B_PYRAMID_TOP, FACILITY / LOOP).
# STYLE of "The Return of the Jedi" (soundtrack:return-jedi:10): an original fanfare-like melody, not a quote.
# Taken from the cue: D major, its broad 74 bpm, the Williams flat-six lift (D to Bb) before G and A, horn on the
# tune with strings and choir sustained under it, harp-like arpeggios. Kept short like the vanilla loop (13 s).
# Brief (sw_subject): Battle Pyramid summit, grand reveal.
name: arena-pyramid-top
replaces: MUS_B_PYRAMID_TOP
form: LOOP
voicegroup: b_pyramid_top         # vanilla: strings 48, horn 60, choir 53, bell 14, drumset 0, waves, squares
master_volume: 77
tempo: 74
steps_per_beat: 4
time_signature: [4, 4]
seed: 9

