# vs. Rival: hot-swap of MUS_VS_RIVAL (wiki audio:MUS_VS_RIVAL). STYLE of "The Sith Spacecraft and The Droid
# Battle" (wiki ref_tracks soundtrack:phantom-menace:05, the Droid Battle half): an original melody, not a quote.
# Taken from the cue: its brisk ~112-120 bpm march with sixteenth-note string ostinatos, a martial snare, brass
# fanfares, and Williams' flat-six / flat-seven lift into the tonic (Bb-C-D). Brief (sw_subject): "Rival (Mira /
# Kael, and Luke at the end): friendly competition, energetic." So D major and heroic rather than menacing: a
# trumpet tune that keeps one-upping itself, a B-minor strain for the contest, and a development that climbs to
# an A7 turnaround back into the tune.
# 120 bpm (the cue's march, with a 16th-note drive), 2-bar intro, 32-bar loop (64 s; vanilla 64.9 s; frame-exact),
# on the vanilla vs_rival voicegroup.
