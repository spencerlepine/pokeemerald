# Big settlements (Mos Espa, Bestine, the Yavin 4 base) and route houses: hot-swap of MUS_RUSTBORO. ARRANGE of
# the Flag Parade march in "The Arrival at Tatooine and The Flag Parade" (wiki soundtrack:phantom-menace:07,
# analyzed 120-243 s: 92 bpm, A with Bb7 and Asus4, a Gm-F-Bb7-F block). Kept: the tempo (92), the parade's A
# major-with-Bb (phrygian dominant) fanfare colour and its Gm/F/Bb middle block, bright brass fanfares (the 75%
# squares are the Game Boy brass, as vanilla Rustboro has no brass sample), and the crowd's busy percussion.
#   intro   1 bar   percussion
#   a       8 bars  square brass fanfare in two parts over strings, congas and tambourine
#   b       8 bars  the Gm/F/Bb block: flute tune, organ off-beats
#   c       8 bars  the market break: droid bleeps on the 25% square, organ stabs, flute calls, A pedal
# 24-bar loop, 62.6 s (vanilla 63.5 s); vanilla rustboro voicegroup.
# Brief (sw_subject): Big settlements: bustling marketplace percussion, bright brass, droids and traders.
name: desert-city
replaces: MUS_RUSTBORO
