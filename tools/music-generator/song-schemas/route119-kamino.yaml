# Kamino ocean routes (Routes 131-134): net-new per-planet split of MUS_ROUTE119. STYLE of "Anakin and Padme"
# (wiki net:mus-route119-kamino, ref_tracks soundtrack:attack-clones:06, the Across the Stars love theme):
# an original melody, not a quote. Taken from the cue: D minor, a slow yearning 4/4 (84 here), a long-breathed
# woodwind line over harp and a string pad, the minor iv and the flat-VI lifting the phrase ends.
# Kamino colour: steady rain on the Game Boy squares (a soft 16th pulse) and a grey wave-channel bass.
# Tech from the placeholder MUS_ROUTE119 (LOOP, ~73 s): this loop 24 bars, 68.6 s. Net-new, so the voicegroup
# is route120 (flute, harp, strings, horn, squares, wave) instead of route119, which has no woodwind.
# Brief (sw_subject): Kamino version of Route 119, same lush, wandering, huge-scale route mood.
name: route119-kamino
constant: MUS_ROUTE119_KAMINO         # wiki sw_constant (net:mus-route119-kamino)
form: LOOP
voicegroup: route120                  # flute 73, harp 46, strings 48, horn 60, timpani 47, squares, wave 81
master_volume: 88
tempo: 84
steps_per_beat: 4
