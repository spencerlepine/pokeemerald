# Hyperspace trips between planets (Falcon or shuttle): net-new MUS_HYPERSPACE (wiki net:mus-hyperspace).
# ARRANGE of "Hyperspace" (ref_tracks soundtrack:empire-strikes-back:08): the cue's last jump, where the
# hyperdrive finally kicks in and the orchestra bursts into the main theme and ends in C (analyze_reference: 92
# bpm with a 183 double-time pulse, the Bb7 / Gm / Am / F brass swells, the closing turn into C).
# Kept: the rush (a 2-bar string and square run up with a timpani roll and crash, played once), then a 16-bar
# loop: the main theme on trumpet over brass chords and running square triplets (8 bars), then a soaring
# strain on the cue's Bb-Gm-Am-F swells, horn and strings, that turns through Ab to G and the theme's own
# triplet pickup back to the top. Net-new: route119 voicegroup for its trumpet, horn, strings and timpani (the
# placeholder MUS_SAILING's voicegroup has no brass). Placeholder length 32.5 s; this loop 41.7 s.
# Brief (sw_subject): rush into hyperspace, then a soaring travel theme.
