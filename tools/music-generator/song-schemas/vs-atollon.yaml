# Vs Atollon. Hot-swap of MUS_RG_VS_DEOXYS (wiki audio:MUS_RG_VS_DEOXYS): the battle on Atollon (Deoxys's island).
# STYLE of "Star Wars and The Revenge of the Sith" (soundtrack:revenge-sith:01), the space-battle opening: an
# original tune, not a quote. Taken from the cue: a heroic-minor trumpet line over a driving eighth-note bass and
# snare, horns holding the harmony, strings taking the answering strain, timpani on the turnaround. Made alien and
# glitchy for the brief: a square that echoes the trumpet one sixteenth late, racing square arpeggios, and a
# choir break that slides between D minor and Eb. Vanilla voicegroup. Brief (sw_subject): battle on Atollon
# (Deoxys's island): alien, glitchy.
