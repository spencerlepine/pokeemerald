# Obtain shard (MUS_OBTAIN_BADGE, hot-swap): a one-shot victory sting. SCRATCH (wiki audio:MUS_OBTAIN_BADGE, no
# film cue). Brief: "Won a kyber shard: crystalline, resonant victory sting." An original brass call in Bb in the
# Star Wars idiom (triplet pickup, a leap to the fifth, a lift to Eb, then the high tonic held), horn harmony,
# glockenspiel and square arpeggios for the crystal shimmer, wave bass and a timpani roll under the last chord so it
# rings. 120 bpm (vanilla's), two bars of 5/4: 5 s against vanilla's 5.2 s, on the vanilla fanfare voicegroup.
name: obtain-shard
replaces: MUS_OBTAIN_BADGE
form: JINGLE
loop: false
player: SE2
