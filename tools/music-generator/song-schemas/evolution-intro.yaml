# Evolution intro: hot-swap of MUS_EVOLUTION_INTRO (wiki audio:MUS_EVOLUTION_INTRO, EVENT / JINGLE, SE2 player).
# SCRATCH (no film cue): a one-second shimmer that leads into the evolution loop (evolution.yaml, D minor).
# Brief (sw_subject): a companion starts to evolve, shimmering lead-in. One bar of 2/4 at the vanilla 120 bpm
# (1.0 s, plays once): two squares race up a D minor arpeggio in 32nds, a third apart, over the wave hum, a horn
# swell on A and a timpani roll that crescendos.
name: evolution-intro
