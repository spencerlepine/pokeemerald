# D minor, the melody draft per bar) plus knowledge of the cue: the theme's pickup D, long F falling to E, D-C-E
# and home to D, then the answer from A down through F and D; the climb at the climax where the line steps up a
# key each bar (F minor, G minor) before falling back; all over the cue's driving sixteenth string ostinato,
# eighth bass and pounding timpani. Kept at the cue's 92 bpm (sixteenth grid). Trumpet theme, horn standing in for
# the choir, squares taking the ostinato when the strings rest. Vanilla voicegroup. Brief (sw_subject): final
# battle against Obi-Wan Kenobi: noble and climactic.
