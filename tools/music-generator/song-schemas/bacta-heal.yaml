# Bacta Center heal: hot-swap of MUS_HEAL (wiki audio:MUS_HEAL), a one-shot jingle on the SE2 player. SCRATCH: no
# film cue, written from the brief (sw_subject): "Party healed at a Bacta Center: soothing bubbling chime."
# One 5/4 bar in G: glockenspiel chime up the tonic triad and back (G - C - G), harp arpeggios under it, a
# 12.5%-feel square bubbling in sixteenths (the bacta tank), a soft wave pad and one flute note to close.
# 132 bpm like vanilla, 1 bar of 5/4, 2.3 s (vanilla 2.3 s), no loop; vanilla fanfare voicegroup, priority 5.
name: bacta-heal
replaces: MUS_HEAL
form: JINGLE
loop: false
player: SE2
voicegroup: fanfare               # glockenspiel 9, harp 46, flute 73, squares 81, wave 87
master_volume: 90
song_priority: 5
tempo: 132
steps_per_beat: 4                 # sixteenth-note grid
time_signature: [5, 4]
seed: 181

parts:
  glock:   {program: 9,  channel: 0, volume: 92,  pan: 10,  range: [G5, G6], gate: 0.95}
  harp:    {program: 46, channel: 1, volume: 80,  pan: -20, range: [G4, D6], gate: 0.9}
  bubbles: {program: 81, channel: 2, volume: 40,  pan: 30,  range: [D5, G6], gate: 0.4, mono: true}
  pad:     {program: 87, channel: 3, volume: 54,  pan: 0,   range: [G3, C4], gate: 0.95}
  flute:   {program: 73, channel: 4, volume: 80,  pan: -8,  range: [B5, B5], gate: 0.9, lfo_speed: 30, lfo_delay: 10, mod: 4}

sections:
  heal:
    bars: 1
    parts:
      glock:   "G5:2 B5:2 D6:2 G6:4 r:2 D6:2 G6:6"
      harp:    "G4:1 B4:1 D5:1 G5:1 B5:1 D6:1 r:2 C5:1 E5:1 G5:1 C6:1 r:2 B4:1 D5:1 G5:4"
      bubbles: "D5:1 G5:1 D6:1 r:1 E5:1 A5:1 E6:1 r:1 G5:1 C6:1 G6:1 r:1 D5:1 G5:1 B5:1 D6:1 G6:2 r:2"
      pad:     "G3:8 C4:6 G3:4 r:2"
      flute:   "r:12 B5:6 r:2"

arrangement: [heal]
