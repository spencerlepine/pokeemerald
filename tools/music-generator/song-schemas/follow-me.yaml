# Follow me: hot-swap of MUS_FOLLOW_ME (wiki audio:MUS_FOLLOW_ME, EVENT / LOOP). STYLE of "Watto's Deal and
# Kids at Play" (wiki ref_tracks soundtrack:phantom-menace:11): an original tune, not a quote. Taken from the cue:
# its tempo (about 100 bpm), the D-centred Mos Espa colour with the flat seventh (C natural) and a Bb/C side-step,
# light woodwind over pizzicato and a skipping bass. Brief (sw_subject): someone leads the player somewhere,
# bouncy walking theme. 12 bars, 28.8 s (vanilla 26.2 s): flute tune, pizzicato and fretless bass on the beat,
# a square on the off-beats, the other square as counter-line in the B strain, kick/snare and noise hats.
