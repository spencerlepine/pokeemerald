  trumpet: {program: 56, channel: 1, volume: 96,  pan: 4,   gate: 0.92, humanize: {vel: 4}}
  horn:    {program: 60, channel: 2, volume: 84,  pan: -12, octave: 4, gate: 0.95}
  piano:   {program: 1,  channel: 3, volume: 66,  pan: 22,  octave: 4, gate: 0.6, humanize: {vel: 6}}
  strings: {program: 48, channel: 4, volume: 56,  pan: -26, octave: 4, gate: 1.0}
  timpani: {program: 47, channel: 5, volume: 84,  pan: 0,   octave: 2, gate: 1.0, role: bass}
  bass:    {program: 81, channel: 6, volume: 84,  pan: 0,   octave: 2, gate: 0.8, role: bass, mono: true}
  sq:      {program: 82, channel: 7, volume: 56,  pan: -30, gate: 0.85, mono: true}
  sq2:     {program: 80, channel: 8, volume: 34,  pan: 32,  gate: 0.85, mono: true}
  drums:   {program: 0,  channel: 9, volume: 64,  pan: 10,  role: drums, kit: {kick: 36, sn: 38, hh: 42}}

