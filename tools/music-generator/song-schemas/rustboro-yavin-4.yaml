# Rustboro, Yavin 4 version (MUS_RUSTBORO_YAVIN_4, net-new): the town music for the Yavin 4 maps (the Rebel base).
# ARRANGE of "Rebel Briefing" (wiki net:mus-rustboro-yavin-4, ref soundtrack:return-jedi:08). analyze_reference
# read the cue at 123 bpm (124 here) in G minor (r=0.64); its draft melody is too rough to use, so the two themes
# the briefing turns on are written from the tunes themselves, in G minor: the Force theme (the Rebellion's hymn)
# and the Rebel fanfare's triplet call. The tech notes come from the placeholder vanilla MUS_RUSTBORO (128 bpm,
# 60 s loop, a town groove); the voicegroup is route120's for its trumpet and horn, which the fanfare needs.
#   a  8 bars  the Force theme on flute over a walking wave bass, piano off-beats and a light kit
#   b  8 bars  its climbing second half on trumpet
#   c  8 bars  the Rebel fanfare: triplet calls on trumpet, horn answering, timpani
#   d  8 bars  the Force theme again, a square doubling the softer flute, the D that leads back to a
# Brief (sw_subject): Yavin 4 version of the Tatooine town theme, same role and mood family. Loop 32 bars, 61.9 s.
name: rustboro-yavin-4
constant: MUS_RUSTBORO_YAVIN_4
form: LOOP
voicegroup: route120          # flute 73, trumpet 56, horn 60, piano 1, strings 48, timpani 47, squares 80/82, wave 81, rs kit
master_volume: 85
tempo: 124
steps_per_beat: 6             # the fanfare's triplet eighths (2) with straight eighths (3)
time_signature: [4, 4]
seed: 4

parts:
