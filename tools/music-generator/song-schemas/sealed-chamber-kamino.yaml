# Sealed Chamber, Kamino: net-new per-planet split of MUS_SEALED_CHAMBER (wiki row
# net:mus-sealed-chamber-kamino), for the Sealed Vault. SCRATCH: no film cue, written from the brief. The
# Tatooine original is an eerie, sparse vault; Kamino's is cold and clean under endless rain: E minor with
# Lydian floating (C-D swaps, a B major and a C augmented that never settle), a slow tubular-bell line in a,
# strings in b, harp and timpani pulses in c, the bell alone in d. The rain is on the Game Boy side: a 25 %
# square dripping staccato notes and a soft noise hiss. Vanilla voicegroup and tempo (MUS_SEALED_CHAMBER:
# sealed_chamber, 140 bpm, 36.0 s): 22 bars of 4/4 at 140 = 37.7 s.
# Brief (sw_subject): Kamino version of MUS_SEALED_CHAMBER, same role and mood family; theme to be decided.
