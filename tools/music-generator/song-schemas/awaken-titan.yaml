# A titan awakens: hot-swap of MUS_AWAKEN_LEGEND (wiki audio:MUS_AWAKEN_LEGEND), a one-shot jingle on the SE2
# player. STYLE of "The Emperor" (wiki ref_tracks soundtrack:return-jedi:09): an original line, not a quote.
# Taken from the cue: a slow low chant in D minor that leans on its flat-two and flat-five (Eb, Ab), dark low
# brass over a string tremolo, a timpani roll that grows, and a cluster that does not resolve.
# Brief (sw_subject): "SANDO or GREATKRAYT awakens: long ominous swell." Six bars: tremolo and tuba drone from
# nothing, the horn chant, a two-bar crescendo of strings and timpani, a final hit on D minor with the Eb above.
# 120 bpm like vanilla, 6 bars, 12 s (vanilla 11.4 s), no loop; vanilla fanfare voicegroup, priority 5.
name: awaken-titan
replaces: MUS_AWAKEN_LEGEND
form: JINGLE
loop: false
player: SE2
voicegroup: fanfare               # timpani 47, strings 48, tuba 58, horn 60, squares 80/81, wave 87
master_volume: 90
song_priority: 5
tempo: 120
steps_per_beat: 4                 # sixteenth-note grid: the tremolo
time_signature: [4, 4]
