# Hutt Hideout under Cloud City (and Fortress Vader until net:mus-fortress-vader lands): hot-swap of
# MUS_AQUA_MAGMA_HIDEOUT (wiki audio:MUS_AQUA_MAGMA_HIDEOUT). ARRANGE of "Han Solo Returns (At the Court of
# Jabba the Hutt)" (ref_tracks soundtrack:return-jedi:05). From the cue (analyze_reference: a 67/136 bpm pulse,
# G minor against D, the chromatic E / Ab side-slips and Asus4 hangs, the low lumbering line that opens it):
# its slow two-feel at 68 bpm, the G minor court harmony with the bII/III side-steps, a heavy chromatic
# bass line for the Hutt (slap bass, doubled by the wave an octave down), muted trumpet stabs, an organ
# smear for the palace, swung noise hats and a soft kit. 16-bar loop, 56.5 s (vanilla 118 bpm, 40.7 s).
# Brief (sw_subject): menacing, slinking bass, gangster swagger.
