# Sabacc Den (Mos Espa): hot-swap of MUS_GAME_CORNER (wiki audio:MUS_GAME_CORNER). ARRANGE of "Lapti Nek
# (Jabba's Palace Band)" (wiki ref_tracks soundtrack:return-jedi:06). From the cue (analyze_reference, 0-90 s):
# about 129 bpm (130 here), G minor with the Gm7 / Am7 dorian vamp that runs through the whole song, Bb7 and D7
# turnarounds; kept the cue's synth-pop band groove (16th-note synth bass, organ stabs, square synth lead, four-on-
# the-floor-ish kick with a backbeat) and wrote the vocal-style hook from the draft and the song's character.
# Brief (sw_subject): smoky alien jazz band, card-table bustle. 2-bar bass-and-drums count-in, then a 32-bar loop
# (hook, bridge, hook, breakdown riff), 59 s (vanilla 70 s).
