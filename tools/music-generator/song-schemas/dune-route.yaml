# Dune Route (MUS_ROUTE101, hot-swap): the first desert routes out of Mos Pelgo. ARRANGE of "Mouse Robot and
# Blasting Off" (wiki audio:MUS_ROUTE101, ref soundtrack:new-hope:11): the Falcon's escape, where the main title
# theme comes back as an adventure tune. analyze_reference read the cue at 103.4 bpm (104 here); its draft is too
# rough on the orchestra to use, so the theme is written from the tune itself, moved to C for the squares:
#   a  8 bars  the main theme's first strain (triplet pickups, the fifth leap, the falling triplets to high C)
#   b  8 bars  its middle strain cut down, ending on a G7 and the triplet pickup that starts the loop again
# Brief (sw_subject): open and adventurous walking theme, brass melody over heat-shimmer pads. A walking wave
# bass, nylon-guitar arpeggios and a sustained string note are the heat shimmer; the vanilla route101 kit
# (kick, snare) walks under a noise hat. Loop 16 bars, 36.9 s (vanilla 33.7 s).
