# Grand Arena halls: hot-swap of MUS_B_TOWER_RS (wiki audio:MUS_B_TOWER_RS). STYLE of "Lando's Palace"
# (wiki ref_tracks soundtrack:empire-strikes-back:16): an original melody, not a quote. Taken from the cue:
# E major floating on sus4 chords with a borrowed Am7 colour, a twinkling high ostinato over a soft string bed.
# Brief (sw_subject): Grand Arena lounges, lobbies and halls, a smooth casino-lounge loop. 128 bpm with a light
# swing: square lead like a vibraphone, celesta-style square arpeggios, piano comping on the offbeats, wave bass
# walking, congas and tambourine from the vanilla route110 kit. 20-bar loop, 37.5 s (vanilla 39.8 s).
