# Sabacc Win (casino minigame): hot-swap of MUS_SLOTS_WIN (wiki audio:MUS_SLOTS_WIN, MINIGAME / JINGLE).
# SCRATCH: no film cue, written from the brief: a small, quick F major sting, a trumpet run up to the high F with
# the xylophone an octave above, a square arpeggio, wave bass, one snare flick. Smaller than the jackpot on
# purpose. 144 bpm like the vanilla jingle, two bars of 3/4 (2.5 s), one-shot on the SE2 player like vanilla.
# Brief (sw_subject): Sabacc small win.
