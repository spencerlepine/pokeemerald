# Companion Jump (link minigame, Pokemon Jump): hot-swap of MUS_RG_POKE_JUMP (wiki audio:MUS_RG_POKE_JUMP,
# MINIGAME / LOOP). SCRATCH: no film cue, written from the brief in the light Star Wars style of the droid and
# Ewok capers: a G major trumpet tune that springs up in leaps, a wave bass jumping octaves on every beat, square
# after-beats, a flute strain over strings, a tubular bell on each landing and a two-bar "jump" tag. 138 bpm like
# the vanilla song.
# Brief (sw_subject): link minigame (Pokemon Jump), bouncy.
name: companion-jump
replaces: MUS_RG_POKE_JUMP
form: LOOP
voicegroup: rg_game_corner        # vanilla: trumpet 56, flute 73, strings 48, bell 14, frlg drumset 0, square2 81, square1 87, wave 92, noise 126
master_volume: 90
tempo: 138
steps_per_beat: 2
time_signature: [4, 4]
seed: 31

parts:
  trumpet: {program: 56, channel: 0, volume: 98,  pan: 6,   gate: 0.8, humanize: {vel: 4}}
  flute:   {program: 73, channel: 1, volume: 96,  pan: 10,  gate: 0.85, lfo_speed: 30, lfo_delay: 20, mod: 4}
  strings: {program: 48, channel: 2, volume: 60,  pan: -22, octave: 4, gate: 1.0}
  bell:    {program: 14, channel: 3, volume: 58,  pan: 24,  gate: 1.0}
  drums:   {program: 0,  channel: 4, volume: 76,  pan: 4,   role: drums, kit: {kick: 36, sn: 38}}
  bass:    {program: 92, channel: 5, volume: 96,  pan: 0,   octave: 2, gate: 0.55, role: bass, mono: true}
  after:   {program: 81, channel: 6, volume: 38,  pan: -28, octave: 4, gate: 0.4, mono: true}
  hop:     {program: 87, channel: 7, volume: 40,  pan: 30,  gate: 0.5, mono: true}
  hats:    {program: 126, channel: 8, volume: 30, pan: -8,  role: drums, kit: {hh: C7}}

progressions:
  spring: "G | D | Em | C | G | D | C:4 D:4 | G"
  float:  "C | G | Am | D | C | G | A | D"
  jump:   "C:4 D:4 | D"
  intro:  "G | D"

phrases:
  leap:   "^1:2 ^1+:2 ^3:2 ^1+:2"
  offb:   "r:1 ^3:1 r:1 ^2:1 r:1 ^3:1 r:1 ^2:1"
  pad:    "^2:8"
  tune_a: |
    D4:1 G4:1 B4:2 D5:2 B4:2 | A4:2 F#4:1 A4:1 D5:4 | E5:2 B4:2 G4:2 E5:2 | C5:4 E5:2 G5:2 |
    D5:1 B4:1 G4:2 D5:2 G5:2 | F#5:2 D5:2 A4:2 D5:2 | E5:2 C5:2 F#5:2 D5:2 | G5:6 r:2
  tune_b: |
    E5:2 G5:2 C6:4 | B5:2 G5:2 D5:4 | C5:2 E5:2 A5:4 | F#5:2 A5:2 D5:4 |
    E5:2 C5:2 G5:2 E5:2 | D5:2 B4:2 G5:4 | A5:2 C#5:2 E5:2 G5:2 | F#5:4 A5:2 D5:2
  dings:  "G5:8 | r:8 | E5:8 | r:8 | G5:8 | r:8 | r:8 | G5:8"
  dings_b: "C5:8 | r:8 | A4:8 | r:8 | C5:8 | r:8 | A4:8 | r:8"
  jump_t: "C5:1 E5:1 G5:1 r:1 D5:1 F#5:1 A5:1 r:1 | D5:1 D6:1 r:2 D5:1 D6:1 r:2"
  jump_h: "C4:1 C5:1 r:2 D4:1 D5:1 r:2 | A4:1 C5:1 D5:1 F#5:1 A5:2 r:2"

grooves:
  bounce:
    kick: "x...x...|x...x...|x...x...|x...x..x"
    sn:   "..x...x.|..x...x.|..x...x.|..x.x.x."
  jump:
    kick: "x...x...|x.x.x.x."
    sn:   "..x...x.|.x.x.x.x"
  tick:
    hh:   "o.o.o.o."

sections:
  intro:
    bars: 2
    chords: intro
    parts: {bass: leap, after: offb, drums: bounce, hats: tick, strings: pad, hop: "G4:1 B4:1 D5:1 r:5 | A4:1 D5:1 F#5:1 r:5"}
  a:
    bars: 8
    chords: spring
    parts: {trumpet: tune_a, bass: leap, after: offb, drums: bounce, hats: tick, bell: dings}
  b:
    bars: 8
    chords: float
    parts: {flute: tune_b, strings: pad, bass: leap, after: offb, drums: bounce, hats: tick, bell: dings_b}
  tag:
    bars: 2
    chords: jump
    parts: {trumpet: jump_t, hop: jump_h, bass: leap, drums: jump, hats: tick, strings: pad}

arrangement: [intro, a, b, a, tag]
loop_start: a
