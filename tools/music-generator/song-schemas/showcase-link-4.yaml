# Showcase Link 4 (Contest Hall, link play): hot-swap of MUS_LINK_CONTEST_P4 (wiki audio:MUS_LINK_CONTEST_P4,
# FACILITY / LOOP). The same piece as showcase.yaml (MUS_CONTEST), re-voiced, as the row asks: ARRANGE of
# "Augie's Great Municipal Band" (soundtrack:phantom-menace:17, the parade half), the Emperor's theme turned into
# a bright A major parade march over an A-E pedal, 144 bpm, 24-bar loop.
# Variant 4 re-voices it as a five-track chip band like the vanilla link song: square lead, square oom-pah,
# wave bass, noise snare, and the flute for the middle strain only.
# Brief (sw_subject): Link Showcase stage, variant 4.
