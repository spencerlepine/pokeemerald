# Titan storm (abnormal weather): hot-swap of MUS_ABNORMAL_WEATHER (wiki audio:MUS_ABNORMAL_WEATHER, AMBIENT).
# STYLE of "Anakin's Dark Deeds" (wiki ref_tracks soundtrack:revenge-sith:10): an original lament, not a quote.
# Taken from the cue: A minor (the analyzer: Am / Esus4 / Bm7, 86 bpm), a slow mourning line over a pulsing low
# ostinato, tolling bells and heavy drums. Brief (sw_subject): storms over the worlds while SANDO and GREATKRAYT
# rage: dread, crashing percussion. Horn lament, string third, wave-bass eighths, toms/kick/crash, noise thunder
# and rain hiss, a square tremolo that tightens in the second half.
name: titan-storm
replaces: MUS_ABNORMAL_WEATHER
form: AMBIENT
voicegroup: abnormal_weather          # bell 14, strings 48, horn 60, flute 73, squares 80/81, wave 82, noise 126/127, kit 0
master_volume: 80
tempo: 86
steps_per_beat: 4
time_signature: [4, 4]
seed: 7

parts:
  horn:    {program: 60, channel: 0, volume: 100, pan: 8,   range: [D4, E5], gate: 0.95, humanize: {vel: 4}}
  strings: {program: 48, channel: 1, volume: 70,  pan: -22, octave: 3, range: [F3, D4], gate: 1.0}
  bell:    {program: 14, channel: 2, volume: 70,  pan: 26,  gate: 1.0}
  drums:   {program: 0,  channel: 3, volume: 104, pan: 0,   role: drums, kit: {kick: 36, tom: 41, tomh: 45, crash: 57}}
  bass:    {program: 82, channel: 4, volume: 96,  pan: 0,   octave: 2, gate: 0.7, role: bass}
  trem:    {program: 80, channel: 5, volume: 42,  pan: -34, octave: 4, gate: 0.5, mono: true}
  storm:   {program: 126, channel: 6, volume: 60, pan: 14,  gate: 1.0, mono: true}   # thunder (low key) and rain hiss (high key) on the one noise channel

