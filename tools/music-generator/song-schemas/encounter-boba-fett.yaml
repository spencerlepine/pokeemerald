# Encounter: Boba Fett. Net-new MUS_ENCOUNTER_BOBA_FETT (wiki net:mus-encounter-boba-fett): Boba spots the player
# before each of his four bounty-hunt battles (paired with MUS_VS_BOBA_FETT). ARRANGE of "Departure of Boba Fett"
# (soundtrack:empire-strikes-back:06), from analyze_reference over 0:00-1:00 plus knowledge of the cue: the
# opening G minor fall (Bb A G) as the hit, then the low, winding chromatic motif the bassoons and bass clarinet
# lurk on (Bb Eb G Eb Bb / Bb Eb Bb D C# / F# Bb Eb C# ...) over a Gm-Eb-D ground, first on organ low, then
# trumpet an octave up, and a turnaround back to the fall. Kept at the cue's 80 bpm, driven by a wave-channel
# sixteenth ostinato. Placeholder tech from MUS_ENCOUNTER_AQUA (Matt's encounter, the slot he uses until now):
# voicegroup encounter_aqua, volume 86. Brief (sw_subject): eye-contact jingle that leads into MUS_VS_BOBA_FETT.
