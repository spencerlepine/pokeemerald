# Fruit Picking (link minigame, Dodrio Berry Picking): hot-swap of MUS_RG_BERRY_PICK (wiki audio:MUS_RG_BERRY_PICK,
# MINIGAME / LOOP). SCRATCH: no film cue, written from the brief in the Star Wars idiom of the Ewok romps: a
# skipping F major flute tune, tuba oom-pah, plucky square after-beats and a tambourine-and-snare skip, with a
# D minor middle strain over strings. 148 bpm like the vanilla song.
# Brief (sw_subject): link minigame (Dodrio Berry Picking), bouncy.
name: fruit-picking
