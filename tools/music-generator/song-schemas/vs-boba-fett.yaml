# vs. Boba Fett: net-new boss battle (wiki net:mus-vs-boba-fett, MUS_VS_BOBA_FETT; tech notes from its placeholder
# audio:MUS_VS_FRONTIER_BRAIN: vs_frontier_brain voicegroup, volume 90, priority 1). STYLE of "Departure of Boba
# Fett" (wiki ref_tracks soundtrack:empire-strikes-back:06): an original melody, not a quote. Taken from the cue:
# its ~86 bpm pulse (played here in double time, 180 to make the loop frame-exact, for a battle), A minor shaded by G minor and an Ab/G/E7
# slide (the cue's bars 45-48), low reeds creeping by semitones, and a sparse, cold texture.
# Brief (sw_subject): "Boba Fett's bounty-hunt boss battles: cold, percussive, western-tinged." Western: a
# galloping nylon guitar, an Andalusian cadence (Am-G-F-E) under a lone trumpet, and a thin 12.5%-duty square
# that whistles the hunter's call; cold and percussive: taiko and noise shaker, a creeping low horn in the break.
# 180 bpm, 2-bar intro, 48-bar loop (64 s; placeholder 93.6 s), 9 tracks.
