# Mt. Chimney, Tatooine version (MUS_MT_CHIMNEY_TATOOINE, net-new): the dangerous-place music for the Tatooine
# maps (the Krayt Graveyard, the Sandcrawler). ARRANGE of "The Little People Work" (wiki
# net:mus-mt-chimney-tatooine, ref soundtrack:new-hope:06), the Jawa music. analyze_reference read the cue at
# 112.3 bpm (112 here), its harmony sitting on G minor; its melody draft is too rough to use, so the Jawas' tune
# is written in the cue's manner: a scurrying, staccato minor line with chromatic neighbour notes for the double
# reeds, over a bassoon-like oom-pah. On the placeholder's voicegroup (vanilla MUS_MT_CHIMNEY's mt_chimney, which
# has no woodwinds) the oboe is a 12.5% square and the bassoon the tuba.
#   intro 1 bar   the oom-pah alone, a shaker in the noise channel
#   a     8 bars  the Jawa tune on the "oboe" square, tuba oom-pah, wave bass
#   b     8 bars  the danger: string tremolo on G minor and Ab (the Phrygian half step), low horn, timpani
#   c     8 bars  the tune again, a second square answering in long notes, landing on D for the return
# Brief (sw_subject): Tatooine version of Mustafar's dangerous-place theme, same role and mood family.
# Loop 24 bars, 51.4 s.
name: mt-chimney-tatooine
constant: MUS_MT_CHIMNEY_TATOOINE
form: LOOP
voicegroup: mt_chimney        # tuba 58, horn 60, strings 48, timpani 47, squares 81/80, wave 82, noise 127
master_volume: 80
tempo: 112
steps_per_beat: 4
time_signature: [4, 4]
seed: 6

parts:
  oboe:    {program: 81, channel: 0, volume: 72,  pan: 10,  gate: 0.7, mono: true, humanize: {vel: 5}}
  tuba:    {program: 58, channel: 1, volume: 90,  pan: -6,  octave: 2, gate: 0.5, role: bass}
  horn:    {program: 60, channel: 2, volume: 88,  pan: -14, gate: 0.95, transpose: -12}
  strings: {program: 48, channel: 3, volume: 64,  pan: 24,  octave: 4, gate: 0.8}
  timpani: {program: 47, channel: 4, volume: 86,  pan: 0,   octave: 2, gate: 1.0, role: bass}
  bass:    {program: 82, channel: 5, volume: 64,  pan: 0,   octave: 2, gate: 0.4, role: bass, mono: true}
  answer:  {program: 80, channel: 6, volume: 40,  pan: -32, gate: 0.9, mono: true}
  shaker:  {program: 127, channel: 7, volume: 30, pan: 20,  role: drums, kit: {sh: A5}}

