# Yavin 4 long routes (Routes 124-125): net-new per-planet split of MUS_ROUTE120. STYLE of "The Princess Appears"
# (wiki net:mus-route120-yavin-4, ref_tracks soundtrack:new-hope:14): an original melody, not Leia's theme.
# Taken from the cue: D major at a gentle 72, a lyrical solo horn line over soft strings and harp, flute
# answering at the phrase ends, the IV-iv and bVI colours of Williams' romantic writing. Yavin colour: a
# square-wave bird call in the jungle canopy and a soft nylon-guitar pulse. Tech from the placeholder
# MUS_ROUTE120 (LOOP, ~57 s): loop 16 bars, 53.3 s, on the placeholder's route120 voicegroup.
# Brief (sw_subject): Yavin 4 version of Route 120, same hopeful and sweeping long-route mood.
