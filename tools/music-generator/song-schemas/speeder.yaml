# Speeder / swoop riding: hot-swap of MUS_CYCLING (wiki audio:MUS_CYCLING). ARRANGE of "Zam the Assassin and
# The Chase Through Coruscant" (ref_tracks soundtrack:attack-clones:03, ref_notes: the speeder chase).
# From the cue (analyze_reference: 157-161 bpm double-time pulse, A minor, the chase harmony circling Am, Bb7,
# Gm and E with Asus4 pedals): a running 16th string/square ostinato on A, low brass punches on the off-beats,
# the trumpet's rising chase motif (A-C-B-A-E, answered a step up on Bb), snare-driven kit, noise hats.
# Cut to a 32-bar loop at 160 bpm (48 s; vanilla 138 bpm, 50.4 s) on the vanilla cycling voicegroup.
# Brief (sw_subject): riding a hover-bike (swoop or speeder), fast repulsor-engine groove.
