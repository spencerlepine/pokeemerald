# Shuttle ride up to Mustafar: hot-swap of MUS_CABLE_CAR (wiki audio:MUS_CABLE_CAR, music_form CUE, loops no).
# STYLE of "Enter Lord Vader" (ref_tracks soundtrack:revenge-sith:11): an original line, not the Imperial March.
# Taken from the cue: C minor, low brass in Williams' dark-side colour (minor chords a tritone or a third apart:
# Cm-F#m, Cm-Abm), a steady ominous pulse, rising trumpet stabs. The glide is a wave-channel ostinato under
# square arpeggios; the horn carries the melody, tuba the floor. Plays once and ends on a held C minor chord.
# Vanilla: cable_car voicegroup, 120 bpm, 66 s, no loop; this is 30 bars, 60 s.
# Brief (sw_subject): gliding, ominous view of lava.
