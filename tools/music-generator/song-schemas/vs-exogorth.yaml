# vs. the Exogorth: hot-swap of MUS_VS_RAYQUAZA (wiki audio:MUS_VS_RAYQUAZA). STYLE of "The Asteroid Field"
# (wiki ref_tracks soundtrack:empire-strikes-back:10): an original melody, not a quote. Taken from the cue: its
# ~167 bpm drive, the A-minor/Dorian colour with chords planing a step (Am, G/A, Gm, C7), a whirling eighth-note
# ostinato under a broad brass tune, timpani and cymbal swells. Brief (sw_subject): "The EXOGORTH: vast and
# cosmic." The tune is long-breathed over the fast swirl (the beast's size against the asteroid speed); the C
# strain drops to bass, squares and horn for a moment of open space, then the brass comes back in full.
# 168 bpm, 2-bar intro, 28-bar loop (40 s, a whole number of frames; vanilla 49 s), vanilla vs_rayquaza voicegroup.
