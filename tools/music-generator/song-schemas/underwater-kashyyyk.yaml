  strings_b: |
    C5:6 Eb5:2 | D5:8 | Bb4:4 D5:2 G5:2 | G5:6 Eb5:2 |
    Eb5:4 C5:4 | F5:4 D5:4 | G5:4 Eb5:2 Bb4:2 | B4:8
  glock_c: "G5:2 r:2 Eb6:2 r:2 | C6:8 | Ab5:2 r:2 Eb6:2 r:2 | C6:8 | F5:2 r:2 C6:2 r:2 | Ab5:8 | B5:2 r:2 D6:2 r:2 | G5:8"
  far_c: "C4:8 | Eb4:8 | C4:8 | Ab3:8 | C4:8 | F4:8 | D4:8 | B3:8"
  timp_d: "Ab2:2 r:6 | G2:2 r:6"

