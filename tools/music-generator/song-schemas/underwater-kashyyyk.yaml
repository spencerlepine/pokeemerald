# Underwater, Kashyyyk: net-new per-planet split of MUS_UNDERWATER (wiki row net:mus-underwater-kashyyyk), for
# the Republic Wreck's flooded holds and Route 105's sea floor. SCRATCH: no film cue, written from the brief.
# The Dagobah original is muffled, slow and floating; here the diver drifts past a sunken Republic cruiser, so
# the float carries some old heroism and loss: C minor with Eb / Bb brightness and a G major dominant, a slow
# flute in a, strings in b, glockenspiel glints in c, harp arpeggios all through, the voicegroup's own bubbles
# sample rising now and then, a wave-channel bass (rounder than the fretless when muffled), and a 50 % square
# far in the back. Vanilla voicegroup and tempo (MUS_UNDERWATER: underwater, 86 bpm, 86.5 s); 26 bars at 86 =
# 72.6 s, inside the AMBIENT loop range the checks use (35-77 s).
# Brief (sw_subject): Kashyyyk version of MUS_UNDERWATER, same role and mood family; theme to be decided.
name: underwater-kashyyyk
constant: MUS_UNDERWATER_KASHYYYK
form: AMBIENT
voicegroup: underwater            # vanilla's own: glock 9, bubbles 23, harp 46, timpani 47, strings 48, flute 73, squares 80/92, wave 82
master_volume: 94
tempo: 86
steps_per_beat: 2                 # eighth-note grid
time_signature: [4, 4]
seed: 105

parts:
  flute:   {program: 73, channel: 0, volume: 90,  pan: 10,  gate: 0.96, lfo_speed: 22, lfo_delay: 24, mod: 6, humanize: {vel: 5}}
  strings: {program: 48, channel: 1, volume: 76,  pan: -10, gate: 1.0, humanize: {vel: 4}}
  glock:   {program: 9,  channel: 2, volume: 58,  pan: 20,  gate: 0.9}
  harp:    {program: 46, channel: 3, volume: 68,  pan: -24, octave: 3, gate: 0.9, humanize: {vel: 8}}
  pad:     {program: 48, channel: 4, volume: 46,  pan: 28,  octave: 3, gate: 1.0}
  bubbles: {program: 23, channel: 5, volume: 52,  pan: -30, gate: 1.0}
  timpani: {program: 47, channel: 6, volume: 70,  pan: 10,  gate: 1.0}
  bass:    {program: 82, channel: 7, volume: 74,  pan: 0,   octave: 2, role: bass, gate: 0.95}
  far:     {program: 92, channel: 8, volume: 26,  pan: 36,  gate: 0.95, mono: true}

