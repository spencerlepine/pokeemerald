# Mystery Gift screen (MUS_RG_MYSTERY_GIFT, hot-swap): a short loop. STYLE of "Rebel Briefing" (wiki
# soundtrack:return-jedi:08): an original tune, not a quote. Taken from the cue: its tempo (analyzer 123, 124 here,
# which is also vanilla's), G minor, the steady march-like pulse under a briefing (soft military snare, a ticking
# pulse) and a melody that lifts toward hope at the end of each phrase.
# Kept the vanilla voicegroup (rg_mystery_gift: nylon guitar, two squares, wave, frlg kit, noise) and a loop close
# to vanilla's 17.4 s: 8 bars, 15.5 s, plus a 1-bar count-in.
# Brief (sw_subject): Mystery Gift screen.
