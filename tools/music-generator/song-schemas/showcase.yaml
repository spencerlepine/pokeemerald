# Showcase (Contest Hall): hot-swap of MUS_CONTEST (wiki audio:MUS_CONTEST, FACILITY / LOOP).
# ARRANGE of "Augie's Great Municipal Band" (soundtrack:phantom-menace:17, the parade half, 0:00-1:30): the
# Naboo victory parade, where the Emperor's dark choral theme comes back as a bright major-key march for band
# and children's choir. Kept from the cue: A major over a tonic/dominant (A-E) pedal, the brisk march at 144 bpm
# (the cue's 143.6), trumpets on the tune, a high choir-like line (flute and bells here) in the middle strain,
# oom-pah bass and snare. The tune is a festive march written in the parade's shape, not a note-for-note quote.
# Brief (sw_subject): Showcase stage performance, showy, upbeat gala music.
