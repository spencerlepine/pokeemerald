# Vs Mortis. Hot-swap of MUS_RG_VS_LEGEND (wiki audio:MUS_RG_VS_LEGEND): the legendary battles at Mortis Gate.
# STYLE of "Palpatine's Teachings" (soundtrack:revenge-sith:06): an original tune, not a quote. Taken from the
# cue: B minor, dark low horn line moving in long notes, a chant-like sustained voice (organ standing in for the
# choir), augmented and diminished colour (F#aug, C#dim) and the Neapolitan C pulling at B minor. Set over a battle
# pulse at the vanilla 182 rounded to 180 (the melody moves at half-time, the cue's own pace): driving eighth
# bass, string tremolo, toms, racing squares. Vanilla voicegroup. Brief (sw_subject): Mortis Gate legendary
# battles.
