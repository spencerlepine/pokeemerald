accept:
  skin_tones: no skin shows under the armour
  hair_rows: helmet, no hair; the dome takes rows 9-14 above the lenses
  eye_row: lenses are on row 7 from the top but are not black-on-skin eyes
  height: '22 rows: Vader stands a head over every NPC on purpose'
  step_change: the floor-length cape hides arms and legs; the bob, the swaying hem and the boots are what moves (Emerald's hex maniac robe is 0.597)
  orphans: armour is smooth by design; specks are on the dome, cheeks, chest box and cape edge only
