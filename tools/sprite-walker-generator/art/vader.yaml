name: vader
description: 'Darth Vader walker, v2 (replaces Maxie). Drawn from the ground up in Emerald''s style: coloured outlines in the navy ramp, the dome lit from above, lenses and grill in greys, cape flaring
  past the shoulders, chest box lights in pink.'
kit: person16x32
replaces: graphics/object_events/pics/people/team_magma/maxie.png
graphics_info: Maxie
notes: 'v1 (approved, then scrapped) was outlined 100% in black and scored 30/100. v2 follows STYLE.md: 7 (8 16 32) outlines, 6 base, 5 highlight; black only on lenses, boots and the cape''s deepest folds.
  Taller than any NPC on purpose (top row 9).'
