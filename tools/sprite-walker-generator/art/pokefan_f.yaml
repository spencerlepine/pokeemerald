name: pokefan_f
description: 'RACE FAN (f): blue Twi''lek woman with two long head-tails (one draped over her shoulder), a pink headwrap and an orange racing-team scarf (replaces Pokefan F).'
kit: person16x32
replaces: graphics/object_events/pics/people/pokefan_f.png
graphics_info: PokefanF
notes: 'Recast b, B style: the Pokefan F''s own body as regions (top -> olive O, skirt and apron -> pink Q, shoes -> olive boots D, arms -> blue skin), new bald round Twi''lek head on ramp b (blue, as on
  the RACE FAN front pic) with a pink headwrap and two long hand-toned head-tails (one draped over the shoulder onto the chest, one behind), orange team scarf on the skin ramp. Moves to NPC_1 for the blue
  skin.'
