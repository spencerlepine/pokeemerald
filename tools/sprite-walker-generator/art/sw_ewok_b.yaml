name: sw_ewok_b
description: 'NEW WALKER (net:walker-ewok): variant B. Ewok scout like the film''s Wicket: burnt-orange rust leather hood with a bone-bead cord, draping as a short ragged cape to the belly, small grizzled
  grey face deep in the hood, small dark eyes, dark brown-black fur, dark ear tufts, empty hands (placeholder: Boy 1). Used by the EWOK and SHAMAN trainers.'
kit: person16x32
replaces: graphics/object_events/pics/people/boy_1.png
graphics_info: SwEwok
notes: 'Recast group d2 round 3, variant B (A is art/sw_ewok.yaml on NPC_2). 16x32 kit, 19 rows, on Boy 1''s kid body as regions (walk and bob kept), all hand-toned on NPC_3: hood and cape on the rust ramp
  c (205 98 74 / 148 57 41 / 82 16 0) with a dark cord, white and pale-grey bone beads, a dark 82 16 0 line under the cape hem; a small face (6 px) in grey ramp a with skin-light flecks, slate brow, 1-px
  black eyes, black nose, dark mouth; the body is dark fur (123 65 65 base, black and rust-dark outline, sparse 222 148 115 strands, grey arm tips); dark ear tufts with a grey tip. Brown-black furred and
  hornless, unlike grey-furred, bone-horned Chirpa (winona) who shares the rust hood ramp.'
