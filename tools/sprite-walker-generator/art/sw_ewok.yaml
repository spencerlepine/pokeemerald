name: sw_ewok
description: 'NEW WALKER (net:walker-ewok): Ewok scout: brown multi-tone fur, ochre leather hood with round fur ears poking through, big glinting black eyes, tan muzzle, hide strap and pouch, a small stone-tipped
  spear (placeholder: Boy 1). Used by the EWOK and SHAMAN trainers.'
kit: person16x32
replaces: graphics/object_events/pics/people/boy_1.png
graphics_info: SwEwok
notes: 'Recast group d2 (redraw of the 16x16 r_rcd.py version, rejected as too squished): 16x32 kit, 19 rows tall, shade mode on Boy 1''s kid body as regions (shirt -> torso fur T, arms/legs -> fur B, shorts
  and shoes -> lower fur D). Hand-toned head: brown fur face lit on brow and cheeks, tan muzzle with a black nose, big eyes with white glints, ochre hood framing the face with a back drape and a red crown
  bead, round fur ears through it. Hide strap to a tan hip pouch; spear (dark shaft, red binding, white stone tip). Brown and hornless, unlike grey horn-hooded Chirpa (winona).'
