name: sw_ewok
description: 'NEW WALKER (net:walker-ewok): Ewok scout like the film''s Wicket: muted tan-rust leather hood with a bone-bead cord, draping as a short ragged cape to the belly, pale fur face ring, small
  dark eyes, dark shaggy brown fur, small fur ear tufts, empty hands (placeholder: Boy 1). Used by the EWOK and SHAMAN trainers.'
kit: person16x32
replaces: graphics/object_events/pics/people/boy_1.png
graphics_info: SwEwok
notes: 'Recast group d2 round 3 (owner: closer to the film, no spear, less cute and bright). 16x32 kit, 19 rows, on Boy 1''s kid body as regions (walk and bob kept), all hand-toned on NPC_2: muted tan-rust
  leather hood and short ragged cape (skin shade lit, burnt-umber ramp-a dark body, ramp-b dark deep folds), dark cord with a bone and an amber bead, pale beige face ring, heavy brow, 1-px dark eyes, dark
  muzzle, black nose, mouth line, small dark ear tufts; the body is dark shaggy brown fur with empty swinging arms. Brown-furred and hornless, unlike grey-furred, bone-horned Chirpa (winona).'
