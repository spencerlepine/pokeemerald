name: farmhand
kit: trainer64
replaces: graphics/trainers/front_pics/camper.png
# FARMHAND (replaces Camper). Repaint of the Camper: a Tatooine moisture-farm boy. Teal outfit ->
# sand tunic and shorts, orange kerchief -> rust, cap -> a pale desert cap, socks -> wraps.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200] # a skin light
  - [240, 200, 152] # b skin base
  - [200, 152, 112] # c skin shadow
  - [112, 80, 64]   # d skin edge
  - [240, 216, 168] # e tunic light
  - [208, 176, 120] # f tunic base
  - [200, 200, 216] # g pale
  - [136, 104, 64]  # h tunic dark
  - [80, 56, 40]    # i boots
  - [176, 120, 72]  # j leather light
  - [120, 80, 48]   # k leather
  - [216, 96, 64]   # m rust light
  - [152, 64, 48]   # n rust
  - [248, 248, 248] # W white
  - [16, 16, 24]    # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, m: 12, n: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/camper.png
      # camper: 1-4 skin, 5/6/8 teal outfit, 7 pale blue, 9 navy, 10/11 blue, 12/13 orange, 14 white, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: e, 6: f, 7: g, 8: h, 9: i, 10: j, 11: k, 12: m, 13: n, 14: W, 15: K}
    rig:
      layers:
        # cap badge goes: a plain desert cap
        - {name: cap badge, shape: poly, pts: [[29, 19], [37, 19], [37, 23], [29, 23]], recolour: "n:e m:e"}
        # the ball -> a capture pod (durasteel grey)
        - {name: pod, shape: poly, pts: [[9, 31], [16, 31], [16, 36], [9, 36]], recolour: "m:g n:g"}
