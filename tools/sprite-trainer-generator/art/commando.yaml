name: commando
kit: trainer64
replaces: graphics/trainers/front_pics/pokemon_ranger_m.png
# PATHFINDER (m), a forest commando (replaces Pokemon Ranger M). Repaint of the Ranger himself:
# a field scout with a pack, mid-stride. Cap -> a brimmed field helmet with a camo cover
# (parts/field_helmet), red jacket -> mottled green camo poncho (speckle), grey trousers ->
# khaki fatigues, boots -> brown.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200] # a skin light
  - [240, 184, 144] # b skin base
  - [200, 144, 112] # c skin shadow
  - [112, 80, 72]   # d skin edge
  - [72, 48, 32]    # e boots
  - [152, 136, 104] # f fatigues light
  - [112, 96, 72]   # g fatigues base
  - [72, 64, 48]    # h fatigues dark
  - [216, 216, 208] # i pale
  - [136, 104, 64]  # j camo brown
  - [136, 160, 96]  # k camo light
  - [88, 112, 64]   # m camo base
  - [48, 64, 40]    # n camo dark
  - [248, 248, 248] # W white
  - [16, 16, 24]    # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, m: 12, n: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/pokemon_ranger_m.png
      # pokemon_ranger_m: 1-4 skin, 5 dark brown boots, 6-8 grey trousers, 9 white, 10 yellow, 11/12/13 orange-red jacket and cap, 14 white, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: e, 6: f, 7: g, 8: h, 9: i, 10: j, 11: k, 12: m, 13: n, 14: W, 15: K}
    rig:
      layers:
        - {name: cap, shape: poly, pts: [[23, 5], [44, 5], [44, 14], [23, 14]], erase: true}
        - {name: helmet, shape: part, part: field_helmet, at: [26, 8], paint: {"1234": "nmkk", "56": "hg"}}
        - {name: helmet camo, shape: speckle, box: [26, 8, 15, 6], chars: "mk", to: j, every: 5}
        - {name: poncho camo, shape: speckle, box: [10, 20, 44, 20], chars: "m", to: n, every: 5}
        - {name: poncho camo 2, shape: speckle, box: [10, 20, 44, 20], chars: "k", to: j, every: 6}
