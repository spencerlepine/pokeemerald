name: bounty_hunter_f
kit: trainer64
replaces: graphics/trainers/front_pics/aqua_admin_f.png
# BOUNTY HUNTER (f), armoured hunter for the Cartel (replaces Aqua Admin F). Repaint of Shelly:
# the same hand-on-hip swagger. Head -> a an angular hunter's helmet (parts/hunter_helmet, dusty tan,
# eye slit and a red targeting lens),
# her big hair -> a short rust cape off the shoulders, wetsuit -> charcoal flight suit,
# bare chest and arms -> tan armour plates and suit, the ball -> a blaster pistol.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200] # a skin light
  - [240, 184, 144] # b skin base
  - [200, 144, 112] # c skin shadow
  - [112, 80, 72]   # d skin edge
  - [136, 136, 144] # e suit light
  - [96, 96, 104]   # f suit base
  - [64, 64, 72]    # g suit shadow
  - [40, 40, 48]    # h suit dark
  - [208, 184, 136] # i armour light
  - [160, 128, 88]  # j armour base
  - [104, 80, 56]   # k armour shadow
  - [152, 72, 56]   # m cloak light
  - [104, 48, 40]   # n cloak base
  - [248, 248, 248] # W white
  - [16, 16, 24]    # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, m: 12, n: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/aqua_admin_f.png
      # aqua_admin_f: 1-4 skin, 5-8 blue wetsuit light->dark, 9 white, 10/12/13 orange hair light->dark, 14 white, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: e, 6: f, 7: g, 8: h, 9: i, 10: j, 11: k, 12: m, 13: n, 14: W, 15: K}
    rig:
      layers:
        - {name: head, shape: poly, pts: [[19, 0], [46, 0], [46, 9], [41, 9], [41, 22], [25, 22], [25, 9], [19, 9]], erase: true}
        - {name: helmet, shape: part, part: hunter_helmet, at: [26, 1], paint: {"1234": "kjiW", "567": "nmi", "89": "hW"}}
        # her hair puffs -> gone above the shoulders; what falls below them is a short rust cape
        - {name: left puff, shape: poly, pts: [[12, 9], [26, 9], [26, 21], [12, 21]], erase: true}
        - {name: right puff, shape: poly, pts: [[40, 10], [52, 10], [52, 21], [40, 21]], erase: true}
        - {name: neck, shape: capsule, from: [31, 19], to: [35, 22], r: [2.5, 2.5], ramp: hg, behind: true}
        - {name: chest plate, shape: poly, pts: [[27, 26], [41, 26], [41, 32], [27, 32]], recolour: "a:i b:j c:k d:k"}
        - {name: arm suit, shape: poly, pts: [[15, 26], [27, 26], [27, 37], [15, 37]], recolour: "a:e b:f c:g d:h"}
        - {name: ball, shape: poly, pts: [[14, 36], [22, 36], [22, 42], [14, 42]], erase: true}
        - {name: blaster, shape: part, part: blaster_pistol, at: [11, 35], paint: {"123": "hgf", "5": "k"}}
    finish: {outline: K, box: [8, 0, 46, 40], pixel_perfect: true}
