name: saboteur_f
kit: trainer64
replaces: graphics/trainers/front_pics/leader_flannery.png
# SABOTEUR (f), the arena leader who replaces Flannery: a punk demolitions tech. Repaint of
# Flannery with the same fiery lean-in. Her wild hair stays but turns teal with orange streaks,
# flight goggles (parts/goggles) pushed up on her brow, black top and bare midriff -> orange
# chest armour, jeans -> grey flight suit, a thermal charge clipped to the belt.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200] # a skin light
  - [240, 184, 144] # b skin base
  - [200, 144, 112] # c skin shadow
  - [112, 80, 72]   # d skin edge
  - [176, 176, 192] # e suit light
  - [128, 128, 144] # f suit base
  - [88, 88, 104]   # g suit shadow
  - [48, 48, 64]    # h suit dark
  - [216, 216, 224] # i pale
  - [32, 72, 88]    # j teal dark
  - [248, 176, 96]  # k orange light
  - [64, 136, 152]  # m teal
  - [232, 112, 48]  # n orange
  - [248, 248, 248] # W white
  - [16, 16, 24]    # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, m: 12, n: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/leader_flannery.png
      # leader_flannery: 1-4 skin, 5-8 blue jeans light->dark, 10/12/13 red hair and belt, 11 grey, 14 white, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: e, 6: f, 7: g, 8: h, 9: i, 10: j, 11: k, 12: m, 13: n, 14: W, 15: K}
    rig:
      layers:
        - {name: goggles, shape: part, part: goggles, at: [29, 8], flip: true, paint: {"6": "g", "89": "hi", "5": "h"}}
        - {name: chest armour, shape: poly, pts: [[24, 25], [40, 25], [40, 32], [24, 32]], recolour: "a:k b:n c:n d:j"}
