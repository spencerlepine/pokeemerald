name: mystic
kit: trainer64
replaces: graphics/trainers/front_pics/psychic_m.png
# MYSTIC (m) in a hooded robe (replaces Psychic M). Repaint of the Psychic: mid-gesture,
# leaning in with an open hand. Purple hair -> under a raised hood (parts/mystic_hood), navy
# clothes -> beige tunic and brown robe, the psychic aura and ball -> a green energy blade lit
# in his hand.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200] # a skin light
  - [240, 184, 144] # b skin base
  - [200, 144, 112] # c skin shadow
  - [112, 80, 72]   # d skin edge
  - [232, 216, 176] # e tunic light
  - [200, 176, 128] # f tunic base
  - [96, 232, 96]   # g blade glow
  - [104, 72, 48]   # h robe dark
  - [168, 120, 80]  # i robe light
  - [128, 88, 56]   # j robe base
  - [88, 56, 40]    # k robe shadow
  - [128, 128, 136] # m hilt
  - [80, 80, 88]    # n hilt dark
  - [248, 248, 248] # W white
  - [16, 16, 24]    # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, m: 12, n: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/psychic_m.png
      # psychic_m: 1-4 skin, 5/6/8 navy clothes, 7 green aura, 9-11 purple hair, 12/13 ball, 14 white, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: e, 6: f, 7: g, 8: h, 9: i, 10: j, 11: k, 12: m, 13: n, 14: W, 15: K}
    rig:
      layers:
        - {name: aura, shape: poly, pts: [[0, 0], [64, 0], [64, 64], [0, 64]], recolour: "g:."}
        - {name: hair, shape: poly, pts: [[20, 6], [52, 6], [52, 27], [20, 27]], recolour: "i:. j:. k:."}
        - {name: hood, shape: part, part: mystic_hood, at: [26, 12], flip: true, paint: {"1234": "kjii"}}
        - {name: stray hair, shape: poly, pts: [[37, 8], [40, 8], [40, 11], [37, 11]], erase: true}
        - {name: stray hair 2, shape: poly, pts: [[44, 11], [48, 11], [48, 13], [44, 13]], erase: true}
        - {name: stray hair 3, shape: poly, pts: [[46, 14], [48, 14], [48, 16], [46, 16]], erase: true}
        - {name: brow shadow, shape: poly, pts: [[36, 16], [43, 16], [43, 21], [36, 21]], recolour: ".:k"}
        - {name: ball, shape: poly, pts: [[3, 43], [12, 43], [12, 51], [3, 51]], erase: true}
        - {name: hilt, shape: capsule, from: [13, 37], to: [10, 33], r: [1.0, 1.0], ramp: nm}
        - {name: blade, shape: capsule, from: [9, 31], to: [2, 14], r: [1.4, 1.4], ramp: W, outline: g}
    finish: {outline: K, selective: "gW", box: [0, 8, 50, 40], pixel_perfect: true}
