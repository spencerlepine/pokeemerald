name: brawler_m
kit: trainer64
replaces: graphics/trainers/front_pics/black_belt.png
# BRAWLER (m), sculpted (D14): a pit fighter in a boxer's guard, 3/4 view facing the viewer's
# left, wide low stance. Black topknot, open navy vest over a bare chest, red sash, baggy grey
# trousers, wrapped feet.
palette:
  - [115, 197, 164]  # 0 transparent
  - [24, 16, 24]     # K outline
  - [104, 56, 40]    # d skin edge
  - [176, 104, 72]   # c skin shadow
  - [216, 144, 104]  # b skin base
  - [240, 192, 144]  # a skin light
  - [32, 32, 48]     # e hair dark
  - [72, 72, 96]     # f hair light
  - [32, 48, 96]     # g vest shadow
  - [56, 80, 152]    # h vest base
  - [104, 136, 200]  # i vest light
  - [144, 32, 40]    # j sash dark
  - [216, 64, 56]    # k sash
  - [88, 88, 104]    # m trousers shadow
  - [144, 144, 160]  # n trousers base
  - [200, 200, 208]  # p trousers light
legend: {'.': 0, K: 1, d: 2, c: 3, b: 4, a: 5, e: 6, f: 7, g: 8, h: 9, i: 10, j: 11, k: 12, m: 13, n: 14, p: 15}
frames:
  front:
    sculpt:
      materials: {skin: dcba, hair: ef, vest: ghi, sash: jk, pants: mnp, wrap: mnp}
      joints:
        sh_far: [24, 24]
        sh_near: [40, 24]
        el_far: [17, 31]
        wr_far: [20, 22]
        el_near: [46, 32]
        wr_near: [40, 29]
        hip_far: [28, 41]
        hip_near: [36, 41]
        kn_far: [21, 50]
        kn_near: [42, 50]
        an_far: [18, 58]
        an_near: [44, 58]
      groups:
        - name: far arm
          mat: skin
          round: 3
          shapes:
            - {limb: [sh_far, el_far, wr_far], r: [3.6, 3.0, 2.4]}
            - {ellipse: [20, 19], r: [3.0, 3.2]}
          paint:
            - {mat: vest, shape: {ellipse: sh_far, r: [4.2, 4.2]}}
            - {mat: wrap, shape: {limb: [[18, 27], wr_far], r: [2.6, 2.6]}}
        - name: far leg
          mat: pants
          round: 4
          shapes:
            - {limb: [hip_far, kn_far, an_far], r: [5.2, 4.4, 3.0]}
            - {limb: [an_far, [13, 61]], r: [2.6, 2.2]}
          paint:
            - {mat: wrap, shape: {limb: [[18, 57], [13, 61]], r: [3.0, 2.4]}}
          creases:
            - {pts: [[25, 45], [22, 50]], tone: 0}
        - name: near leg
          mat: pants
          round: 4
          shapes:
            - {limb: [hip_near, kn_near, an_near], r: [5.4, 4.6, 3.2]}
            - {limb: [an_near, [39, 61]], r: [2.8, 2.4]}
          paint:
            - {mat: wrap, shape: {limb: [[44, 57], [39, 61]], r: [3.2, 2.6]}}
          creases:
            - {pts: [[38, 45], [42, 50]], tone: 0}
            - {pts: [[43, 52], [42, 55]], tone: 0}
        - name: torso
          mat: skin
          round: 5
          shapes:
            - {limb: [[32, 16], [33, 21]], r: [3.2, 3.8]}
            - {poly: [sh_far, [32, 20], sh_near, [42, 31], [39, 40], [26, 40], [23, 31]], soft: 1.5}
          paint:
            - {mat: vest, shape: {poly: [[20, 20], [29, 21], [29, 36], [26, 41], [20, 41]]}}
            - {mat: vest, shape: {poly: [[36, 21], [46, 20], [46, 41], [38, 41], [35, 36]]}}
            - {mat: sash, shape: {limb: [[24, 39], [41, 39]], r: [2.2, 2.2]}}
          creases:
            - {pts: [[31, 27], [34, 27]], tone: 1}
            - {pts: [[32, 31], [32, 35]], tone: 1}
        - name: head
          mat: skin
          round: 6
          shapes:
            - {ellipse: [30, 12], r: [7.0, 7.2]}
            - {ellipse: [27, 17], r: [3.8, 3.0], blend: 2.5}
        - name: hair
          mat: hair
          round: 3
          line: dark
          shapes:
            - {blob: [[34, 7, 4.8], [38, 10, 3.8]], k: 3}
            - {curve: [[34, 4], [29, 3], [25, 7]], r: [2.4, 1.0]}
            - {curve: [[36, 7], [34, 9], [34, 12]], r: [1.6, 0.6]}
            - {ellipse: [37, 2], r: [2.4, 2.0]}
            - {limb: [[37, 3], [36, 6]], r: [1.2, 1.4]}
        - name: near arm
          mat: skin
          round: 3
          shapes:
            - {limb: [sh_near, el_near, wr_near], r: [3.8, 3.2, 2.6]}
            - {ellipse: [38, 27], r: [3.2, 3.2]}
          paint:
            - {mat: vest, shape: {ellipse: sh_near, r: [4.4, 4.4]}}
            - {mat: wrap, shape: {limb: [[44, 31], wr_near], r: [2.8, 2.8]}}
    finish: {pixel_perfect: true, strays: true, outline: K}
    details:
      - {name: face, shape: part, part: face_stern, at: [24, 9], paint: {"89": "ef", "s": "c", "t": "d", "W": "a"}}
