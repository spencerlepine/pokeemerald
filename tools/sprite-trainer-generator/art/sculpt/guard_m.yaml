          creases:
            - {pts: [[33, 24], [32, 36]], tone: 0}
            - {pts: [[26, 33], [30, 36]], tone: 0}
            - {pts: [[39, 32], [35, 36]], tone: 0}
        - name: far pauldron
          mat: steel
          round: 3
          shapes:
