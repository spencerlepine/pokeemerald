            - {ellipse: [27, 16], r: [3.8, 3.2], blend: 2.5}
        - name: hair
          mat: hair
          round: 3
          line: dark
          shapes:
            - {blob: [[33, 6, 4.8], [37, 9, 3.8], [28, 5, 2.8]], k: 3}
            - {curve: [[29, 3], [25, 4], [23, 7]], r: [2.2, 0.7]}
            - {curve: [[32, 4], [29, 6], [28, 8]], r: [1.8, 0.6]}
            - {curve: [[36, 3], [40, 3], [42, 6]], r: [1.8, 0.6]}
            - {curve: [[39, 8], [42, 10], [41, 14]], r: [1.8, 0.6]}
        - name: near arm
          mat: suit
          round: 3
          shapes:
            - {limb: [sh_near, el_near, wr_near], r: [3.6, 3.0, 2.6]}
            - {ellipse: [40, 38], r: [2.8, 2.4]}
          paint:
            - {mat: steel, shape: {limb: [[46, 32], wr_near], r: [3.2, 3.0]}}
            - {mat: skin, shape: {ellipse: [39, 38], r: [2.6, 2.4]}}
        - name: near pauldron
          mat: steel
          round: 3
          shapes:
            - {ellipse: [42, 25], r: [5.0, 4.0], angle: 20}
          creases:
            - {pts: [[39, 27], [45, 28]], tone: 0}
    finish: {pixel_perfect: true, strays: true, outline: K}
    details:
      - {name: face, shape: part, part: face_stern, at: [24, 8], paint: {"89": "ef", "s": "c", "t": "d", "W": "a"}}
