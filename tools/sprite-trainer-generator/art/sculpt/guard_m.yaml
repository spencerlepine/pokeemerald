name: guard_m
kit: trainer64
replaces: graphics/trainers/front_pics/magma_grunt_m.png
# GUARD (m), sculpted (D14): an armoured city guard standing his ground, 3/4 view facing the
# viewer's left, near hand on his belt, far arm at his side, a short red cape behind. Cropped
# brown hair, steel chest plate and pauldrons over a charcoal under-suit, steel greaves.
palette:
  - [115, 197, 164]  # 0 transparent
  - [24, 16, 24]     # K outline
  - [112, 64, 48]    # d skin edge
  - [192, 120, 88]   # c skin shadow
  - [232, 168, 128]  # b skin base
  - [248, 208, 168]  # a skin light
  - [56, 40, 32]     # e hair dark
  - [104, 72, 48]    # f hair light
  - [88, 96, 120]    # g steel shadow
  - [152, 160, 184]  # h steel base
  - [216, 224, 240]  # i steel light
  - [40, 40, 56]     # j suit dark
  - [72, 72, 96]     # k suit base
  - [112, 32, 40]    # m cape dark
  - [176, 48, 56]    # n cape base
legend: {'.': 0, K: 1, d: 2, c: 3, b: 4, a: 5, e: 6, f: 7, g: 8, h: 9, i: 10, j: 11, k: 12, m: 13, n: 14}
frames:
  front:
    sculpt:
      materials: {skin: dcba, hair: ef, steel: ghi, suit: jk, cape: mn}
      joints:
        sh_far: [24, 24]
        sh_near: [40, 24]
        el_far: [21, 33]
        wr_far: [20, 41]
        el_near: [47, 31]
        wr_near: [41, 37]
        hip_far: [28, 41]
        hip_near: [36, 41]
        kn_far: [25, 50]
        kn_near: [39, 50]
        an_far: [23, 58]
        an_near: [41, 58]
      groups:
        - name: cape
          mat: cape
          round: 3
          shapes:
            - {poly: [[26, 21], [42, 20], [49, 34], [53, 52], [47, 55], [42, 50], [36, 52], [30, 46]], soft: 1}
          creases:
            - {pts: [[45, 30], [49, 50]], tone: 0}
            - {pts: [[44, 42], [43, 49]], tone: 0}
        - name: far arm
          mat: suit
          round: 3
          shapes:
            - {limb: [sh_far, el_far, wr_far], r: [3.4, 2.8, 2.6]}
            - {ellipse: [20, 43], r: [2.6, 2.8]}
          paint:
            - {mat: steel, shape: {limb: [[21, 35], wr_far], r: [3.0, 3.0]}}
            - {mat: skin, shape: {ellipse: [20, 44], r: [2.6, 2.4]}}
        - name: far leg
          mat: suit
          round: 3
          shapes:
            - {limb: [hip_far, kn_far, an_far], r: [4.4, 3.6, 3.0]}
            - {limb: [an_far, [19, 61]], r: [3.0, 2.6]}
          paint:
            - {mat: steel, shape: {limb: [[25, 51], an_far], r: [3.6, 3.4]}}
            - {mat: suit, shape: {limb: [an_far, [19, 61]], r: [3.2, 2.8]}}
        - name: near leg
          mat: suit
          round: 3
          shapes:
            - {limb: [hip_near, kn_near, an_near], r: [4.6, 3.8, 3.2]}
            - {limb: [an_near, [37, 61]], r: [3.2, 2.8]}
