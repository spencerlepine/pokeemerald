name: kid_m
kit: trainer64
replaces: graphics/trainers/front_pics/youngster.png
# KID (m), sculpted (D14): a small, excited kid jumping with both arms flung up, 3/4 view
# facing the viewer's left, knees tucked. Spiky red hair, an oversized yellow jacket with the
# sleeves rolled, blue shorts, white sneakers.
palette:
  - [115, 197, 164]  # 0 transparent
  - [24, 16, 24]     # K outline
  - [120, 64, 48]    # d skin edge
  - [208, 136, 104]  # c skin shadow
  - [240, 184, 144]  # b skin base
  - [248, 224, 192]  # a skin light
  - [136, 32, 32]    # e hair dark
  - [208, 64, 48]    # f hair base
  - [248, 120, 80]   # g hair light
  - [176, 128, 24]   # h jacket dark
  - [232, 184, 48]   # i jacket base
  - [248, 232, 128]  # j jacket light
  - [32, 64, 136]    # k shorts dark
  - [64, 112, 200]   # m shorts
  - [176, 184, 200]  # n shoe shadow
  - [248, 248, 248]  # W shoe
legend: {'.': 0, K: 1, d: 2, c: 3, b: 4, a: 5, e: 6, f: 7, g: 8, h: 9, i: 10, j: 11, k: 12, m: 13, n: 14, W: 15}
frames:
  front:
    sculpt:
      materials: {skin: dcba, hair: efg, jacket: hij, shorts: km, shoe: nW}
      joints:
        sh_far: [26, 30]
        sh_near: [38, 30]
        el_far: [19, 25]
        wr_far: [15, 17]
        el_near: [45, 25]
        wr_near: [49, 17]
        hip_far: [29, 44]
        hip_near: [36, 44]
        kn_far: [24, 50]
        kn_near: [41, 50]
        an_far: [27, 56]
        an_near: [41, 58]
      groups:
        - name: far arm
          mat: jacket
          round: 3
          shapes:
            - {limb: [sh_far, el_far, wr_far], r: [3.4, 3.0, 2.2]}
            - {ellipse: [14, 14], r: [2.6, 2.8]}
          paint:
            - {mat: skin, shape: {limb: [[16, 19], [14, 13]], r: [2.4, 2.8]}}
        - name: far leg
          mat: skin
          round: 3
          shapes:
            - {limb: [hip_far, kn_far, an_far], r: [3.8, 3.0, 2.6]}
            - {limb: [an_far, [23, 59]], r: [3.0, 2.8]}
          paint:
            - {mat: shorts, shape: {limb: [hip_far, [26, 48]], r: [4.4, 4.0]}}
            - {mat: shoe, shape: {limb: [[27, 56], [23, 59]], r: [3.2, 3.0]}}
        - name: near leg
          mat: skin
          round: 3
          shapes:
            - {limb: [hip_near, kn_near, an_near], r: [4.0, 3.2, 2.8]}
            - {limb: [an_near, [37, 61]], r: [3.2, 3.0]}
          paint:
            - {mat: shorts, shape: {limb: [hip_near, [39, 48]], r: [4.6, 4.2]}}
            - {mat: shoe, shape: {limb: [[41, 58], [37, 61]], r: [3.4, 3.2]}}
        - name: jacket
          mat: jacket
          round: 5
          shapes:
            - {poly: [sh_far, [32, 27], sh_near, [41, 38], [40, 46], [24, 46], [23, 38]], soft: 1.8}
          paint:
            - {mat: skin, shape: {poly: [[29, 27], [35, 27], [33, 32], [31, 32]]}}
          creases:
            - {pts: [[33, 32], [33, 45]], tone: 0}
            - {pts: [[27, 40], [26, 45]], tone: 0}
        - name: head
          mat: skin
          round: 6
          shapes:
            - {ellipse: [31, 17], r: [7.6, 7.6]}
            - {ellipse: [28, 22], r: [3.8, 3.0], blend: 2.5}
        - name: hair
          mat: hair
          round: 3
          line: dark
          shapes:
            - {blob: [[34, 11, 5.6], [38, 15, 4.2], [28, 11, 3.2]], k: 3}
            - {curve: [[30, 9], [26, 4], [22, 6]], r: [2.6, 0.6]}
            - {curve: [[34, 8], [34, 3], [31, 1]], r: [2.6, 0.6]}
            - {curve: [[38, 10], [41, 5], [44, 5]], r: [2.6, 0.6]}
            - {curve: [[41, 14], [45, 14], [46, 18]], r: [2.2, 0.6]}
            - {curve: [[28, 12], [24, 13], [23, 16]], r: [2.0, 0.6]}
        - name: near arm
          mat: jacket
          round: 3
          shapes:
            - {limb: [sh_near, el_near, wr_near], r: [3.6, 3.2, 2.4]}
            - {ellipse: [50, 14], r: [2.8, 3.0]}
          paint:
            - {mat: skin, shape: {limb: [[48, 19], [50, 13]], r: [2.6, 3.0]}}
    finish: {pixel_perfect: true, strays: true, outline: K}
    details:
      - {name: face, shape: part, part: face_grin, at: [25, 17], paint: {"89": "ef", "s": "c", "t": "d", "W": "W"}}
    patches:
      - {x: 25, y: 16, rows: "ee___ee"}
