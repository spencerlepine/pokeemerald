name: scout_f
kit: trainer64
replaces: graphics/trainers/front_pics/picnicker.png
# DUNE SCOUT (f), sculpted from the ground up (D14): a young desert scout, 3/4 view facing the
# viewer's left, weight on the near leg, near hand on her hip, far hand raised in a wave.
# Wavy auburn bob, teal scarf with a trailing tail, sand tunic belted at the waist, brown
# trousers tucked into wrapped boots.
palette:
  - [115, 197, 164]  # 0 transparent
  - [24, 16, 24]     # K outline
  - [120, 72, 56]    # d skin edge
  - [200, 128, 96]   # c skin shadow
  - [240, 176, 136]  # b skin base
  - [248, 216, 184]  # a skin light
  - [64, 32, 40]     # e hair dark
  - [128, 64, 48]    # f hair base
  - [184, 104, 64]   # g hair light
  - [144, 104, 64]   # h tunic shadow
  - [200, 160, 104]  # i tunic base
  - [240, 216, 160]  # j tunic light
  - [32, 88, 104]    # k scarf shadow
  - [64, 152, 152]   # m scarf base
  - [64, 48, 48]     # n trousers dark
  - [112, 80, 64]    # p trousers base
legend: {'.': 0, K: 1, d: 2, c: 3, b: 4, a: 5, e: 6, f: 7, g: 8, h: 9, i: 10, j: 11, k: 12, m: 13, n: 14, p: 15}
frames:
  front:
    sculpt:
      materials: {skin: dcba, hair: efg, tunic: hij, scarf: km, legs: np, boots: Kn}
      joints:
        head: [31, 13]
        neck: [32, 21]
        sh_far: [26, 25]
        sh_near: [39, 25]
        el_far: [19, 23]
        wr_far: [16, 15]
        el_near: [45, 32]
        wr_near: [41, 37]
        hip_far: [29, 38]
        hip_near: [36, 38]
        kn_far: [26, 48]
        kn_near: [38, 48]
        an_far: [24, 58]
        an_near: [40, 58]
      groups:
        - name: hair back
          mat: hair
          round: 4
          shapes:
            - {blob: [[33, 12, 8], [36, 17, 6], [28, 17, 5]]}
        - name: far arm
          mat: tunic
          round: 2.5
          shapes:
            - {limb: [sh_far, el_far, wr_far], r: [3.2, 2.6, 2.0]}
            - {ellipse: [15, 12], r: [2.6, 3.2], angle: 15}
          paint:
            - {mat: skin, shape: {limb: [[17, 18], wr_far, [15, 12]], r: [2.2, 2.2, 2.6]}}
        - name: far leg
          mat: legs
          round: 3
          shapes:
            - {limb: [hip_far, kn_far, an_far], r: [4, 3.2, 2.6]}
            - {limb: [an_far, [20, 61]], r: [2.8, 2.4]}
          paint:
            - {mat: boots, shape: {limb: [[25, 53], an_far, [20, 61]], r: [3.0, 3.0, 2.6]}}
        - name: near leg
          mat: legs
          round: 3
          shapes:
            - {limb: [hip_near, kn_near, an_near], r: [4.2, 3.4, 2.8]}
            - {limb: [an_near, [36, 61]], r: [3.0, 2.6]}
          paint:
            - {mat: boots, shape: {limb: [[39, 53], an_near, [36, 61]], r: [3.2, 3.2, 2.8]}}
        - name: torso
          mat: tunic
          round: 4
          shapes:
            - {poly: [sh_far, sh_near, [40, 30], [37, 35], [42, 44], [33, 46], [23, 44], [28, 35], [25, 30]], soft: 1.2}
          paint:
            - {mat: legs, shape: {limb: [[27, 35], [38, 35]], r: [1.1, 1.1]}}
          creases:
            - {pts: [[32, 37], [31, 45]], tone: 0}
            - {pts: [[37, 38], [39, 43]], tone: 0}
            - {pts: [[33, 27], [35, 31]], tone: 0}
        - name: scarf
          mat: scarf
          round: 2.5
          shapes:
            - {ellipse: [32, 23], r: [6.5, 3], angle: 5}
            - {curve: [[36, 24], [41, 28], [38, 34]], r: [2.4, 1.4]}
        - name: head
          mat: skin
          round: 6
          shapes:
            - {ellipse: [30, 13], r: [7.0, 7.2]}
            - {ellipse: [27, 18], r: [3.6, 2.8], blend: 2.5}
        - name: hair front
          mat: hair
          round: 3
          line: dark
          shapes:
            - {blob: [[33, 7, 5.4], [38, 11, 4.4], [27, 6, 3]], k: 3}
            - {curve: [[28, 5], [24, 7], [24, 10]], r: [2.2, 0.8]}
            - {curve: [[32, 6], [29, 8], [28, 10]], r: [2.0, 0.7]}
            - {curve: [[35, 8], [34, 11], [34, 13]], r: [1.8, 0.7]}
            - {curve: [[38, 12], [40, 17], [38, 21]], r: [2.6, 1.0]}
          creases:
            - {pts: [[30, 3], [29, 6]], tone: 0}
            - {pts: [[35, 5], [36, 8]], tone: 0}
        - name: near arm
          mat: tunic
          round: 2.5
          shapes:
            - {limb: [sh_near, el_near, wr_near], r: [3.4, 2.8, 2.2]}
            - {ellipse: [40, 38], r: [2.6, 2.2]}
          paint:
            - {mat: skin, shape: {limb: [[43, 35], wr_near, [39, 38]], r: [2.2, 2.4, 2.4]}}
    finish: {pixel_perfect: true, strays: true, outline: K}
    details:
      - {name: face, shape: part, part: face_a, at: [25, 11], paint: {"89": "ef", "s": "c", "t": "d", "W": "a"}}
    patches:
      - {x: 25, y: 10, rows: "ff___ff"}
