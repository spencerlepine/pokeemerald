name: noble_f
kit: trainer64
replaces: graphics/trainers/front_pics/lady.png
# NOBLE (f), sculpted (D14): a poised aristocrat, 3/4 view facing the viewer's left, hands
# folded at her waist. Blonde hair pinned up in a high bun with a loose lock, high white
# collar, plum gown with a gold trim that flares to the floor.
palette:
  - [115, 197, 164]  # 0 transparent
  - [24, 16, 24]     # K outline
  - [120, 72, 64]    # d skin edge
  - [208, 144, 120]  # c skin shadow
  - [240, 192, 160]  # b skin base
  - [248, 224, 200]  # a skin light
  - [160, 112, 40]   # e hair dark
  - [216, 168, 64]   # f hair base
  - [248, 224, 128]  # g hair light
  - [64, 32, 72]     # h gown dark
  - [112, 56, 120]   # i gown base
  - [168, 104, 168]  # j gown light
  - [176, 128, 40]   # k trim dark
  - [240, 200, 88]   # m trim light
  - [200, 200, 216]  # n collar shadow
  - [248, 248, 248]  # W collar
legend: {'.': 0, K: 1, d: 2, c: 3, b: 4, a: 5, e: 6, f: 7, g: 8, h: 9, i: 10, j: 11, k: 12, m: 13, n: 14, W: 15}
frames:
  front:
    sculpt:
      materials: {skin: dcba, hair: efg, gown: hij, trim: km, collar: nW}
      joints:
        sh_far: [26, 26]
        sh_near: [38, 26]
        el_far: [24, 35]
        el_near: [41, 35]
        hands: [32, 39]
      groups:
        - name: bun
          mat: hair
          round: 3
          shapes:
            - {ellipse: [36, 4], r: [4.4, 3.6]}
          creases:
            - {pts: [[34, 2], [37, 6]], tone: 0}
        - name: skirt
          mat: gown
          round: 4
          flat: 0.8
          shapes:
            - {poly: [[27, 38], [38, 38], [46, 54], [48, 62], [16, 62], [19, 52]], soft: 1}
          paint:
            - {mat: trim, shape: {poly: [[10, 59], [54, 59], [54, 64], [10, 64]]}}
          creases:
            - {pts: [[30, 42], [26, 58]], tone: 0}
            - {pts: [[36, 43], [39, 58]], tone: 0}
            - {pts: [[33, 46], [33, 58]], tone: 2}
        - name: far arm
          mat: gown
          round: 3
          shapes:
            - {limb: [sh_far, el_far, hands], r: [3.0, 2.6, 2.2]}
        - name: torso
          mat: gown
          round: 4
          shapes:
            - {poly: [sh_far, [32, 22], sh_near, [38, 32], [36, 40], [28, 40], [26, 32]], soft: 1.2}
          paint:
            - {mat: trim, shape: {limb: [[27, 38], [37, 38]], r: [1.0, 1.0]}}
          creases:
            - {pts: [[32, 28], [32, 37]], tone: 2}
        - name: collar
          mat: collar
          round: 2
          shapes:
            - {poly: [[26, 22], [38, 22], [37, 27], [32, 29], [27, 27]], soft: 0.5}
            - {limb: [[29, 18], [31, 22]], r: [2.4, 2.8]}
        - name: head
          mat: skin
          round: 6
          shapes:
            - {ellipse: [31, 13], r: [6.8, 7.0]}
            - {ellipse: [28, 18], r: [3.4, 2.6], blend: 2.5}
        - name: hair
          mat: hair
          round: 3
          line: dark
          shapes:
            - {blob: [[33, 8, 5.4], [37, 11, 4.0], [27, 8, 3.0]], k: 3}
            - {curve: [[29, 7], [25, 9], [24, 12]], r: [2.0, 0.8]}
            - {curve: [[37, 13], [39, 18], [37, 23]], r: [1.6, 0.6]}
        - name: near arm
          mat: gown
          round: 3
          shapes:
            - {limb: [sh_near, el_near, hands], r: [3.2, 2.8, 2.4]}
          paint:
            - {mat: collar, shape: {limb: [[37, 38], [35, 39]], r: [2.0, 2.0]}}
        - name: hands
          mat: skin
          round: 2
          shapes:
            - {ellipse: hands, r: [3.0, 2.2]}
    finish: {pixel_perfect: true, strays: true, outline: K}
    details:
      - {name: face, shape: part, part: face_a, at: [25, 11], paint: {"89": "hi", "s": "c", "t": "d", "W": "W"}}
    patches:
      - {x: 25, y: 10, rows: "ee___ee"}
