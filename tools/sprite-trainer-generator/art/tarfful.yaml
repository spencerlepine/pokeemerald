name: tarfful
kit: trainer64
replaces: graphics/trainers/front_pics/leader_brawly.png
# TARFFUL, Kachirho arena leader (Wookiee chieftain; replaces Brawly). Repaint of the Sailor, not
# Brawly: the Sailor's flexed arm and bared-teeth grin are a Wookiee's show of strength, and his
# bulk is the right mass. Skin -> brown fur, white uniform -> paler chest and leg fur, the
# sailor hat -> a fur crown, collar stripes -> a leather belt, plus a bandolier across the chest.
palette:
  - [115, 197, 164]  # 0 transparent
  - [16, 16, 24]     # K outline
  - [208, 168, 120]  # l fur light
  - [168, 120, 80]   # m fur base
  - [120, 80, 48]    # n fur shadow
  - [80, 56, 40]     # o fur dark
  - [224, 192, 144]  # p fur pale (chest)
  - [152, 96, 56]    # s leather
  - [96, 56, 32]     # t leather dark
  - [184, 184, 192]  # g metal
  - [248, 248, 240]  # W white (teeth, glints)
  - [192, 152, 104]  # q fur chest base
  - [144, 104, 64]   # r fur chest shadow
legend: {'.': 0, K: 1, l: 2, m: 3, n: 4, o: 5, p: 6, s: 7, t: 8, g: 9, W: 10, q: 11, r: 12}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/sailor.png
      # sailor: 1-4 skin light -> dark, 14/9/5/10 white uniform light -> dark, 11/6/7 blue hat
      # band and collar stripes, 8 dark grey (shoes), 12/13 red, 15 outline
      remap: {1: l, 2: m, 3: n, 4: o, 5: r, 6: s, 7: t, 8: o, 9: q, 10: n, 11: q, 12: o, 13: o, 14: p, 15: K}
    rig:
      layers:
        # the hat goes; a domed crown of fur takes its place behind the brow
        - {name: hat, shape: poly, pts: [[26, 0], [48, 0], [48, 7], [44, 9], [30, 8], [26, 8]], erase: true}
        - {name: crown, shape: ellipse, at: [37, 8], r: [9.5, 6.5], ramp: nml, behind: true}
        # face: Wookiee brow, dark eyes under it, teeth stay white
        - {name: teeth, shape: poly, pts: [[31, 14], [40, 14], [40, 18], [31, 18]], recolour: "p:W q:W"}
        - {name: brow, shape: pixels, x: 31, y: 9, rows: "onno__ono\n_KW____KW"}
        # shaggy fringe along the silhouette: tufts on the crown, the flexed arm and the legs
        - {name: tufts, shape: pixels, x: 29, y: 1, rows: "____KmK__KlK__K\n___KmlnK_KmmK_KmK\n"}
        # bandolier from the near shoulder across to the hip, with metal pouches
        - name: bandolier
          shape: pixels
          x: 25
          y: 20
          rows: |
            __________________KtsK
            ________________KtssK
            ______________KtssK
            ____________KtgggK
            ___________KtgWgK
            __________KtsgggK
            ________KtssKKK
            ______KtgggK
            _____KtgWgK
            ____KtsgggK
            __KtssKKK
            _KtssK
            KtssK
        # fur: strands inside, a shaggy fringe all round the silhouette
        - {name: strands, shape: speckle, chars: "lmq", to: n, every: 9}
        - {name: chest strands, shape: speckle, chars: "p", to: r, every: 7}
        - {name: fringe, shape: fringe, chars: "lmnopqr", every: 3}
