name: kael
kit: trainer64
replaces: graphics/trainers/front_pics/brendan.png
# KAEL (player / rival front pic). Repaint of Brendan's own front pic, same recipe as the back
# pic (sprite-trainer-back-generator art/kael_back.yaml) and the SAME palette index for index:
# the game loads graphics/trainers/palettes/brendan.pal for both. White hat -> tousled brown
# hair, green band -> kyber-blue headband, navy -> sand wrap tunic and trousers, green strap ->
# brown satchel strap, red top -> white crossover, red gloves -> white arm wraps, red shoes ->
# brown boots, the ball -> a capture pod.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200]  # a skin light
  - [232, 176, 144]  # b skin base
  - [200, 136, 104]  # c skin shadow
  - [96, 56, 40]     # d dark brown (skin edge, hair and leather shadow)
  - [248, 232, 184]  # s sand light
  - [224, 200, 144]  # t sand base
  - [184, 152, 104]  # u sand shadow
  - [128, 104, 64]   # v sand dark
  - [176, 112, 64]   # h hair / leather light
  - [136, 184, 232]  # o kyber light
  - [64, 112, 184]   # q kyber base
  - [128, 80, 48]    # m hair / leather mid
  - [200, 200, 216]  # w wrap shadow
  - [248, 248, 248]  # W white
  - [16, 16, 24]     # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, s: 5, t: 6, u: 7, v: 8, h: 9, o: 10, q: 11, m: 12, w: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/brendan.png
      remap: {1: a, 2: b, 3: c, 4: d, 5: s, 6: t, 7: u, 8: v, 9: w, 10: o, 11: q, 12: W, 13: w, 14: W, 15: K}
    rig:
      layers:
        - {name: strap, shape: poly, pts: [[18, 24], [40, 24], [40, 52], [18, 52]], recolour: "q:m o:h"}
        - {name: hair, shape: poly, pts: [[17, 6], [40, 6], [40, 13], [36, 17], [20, 17], [17, 13]], recolour: "W:h w:m s:d t:d u:d v:d"}
        - {name: side hair, shape: poly, pts: [[19, 13], [25, 13], [25, 19], [19, 19]], recolour: "K:m"}
        - {name: boots, shape: poly, pts: [[16, 52], [44, 52], [44, 64], [16, 64]], recolour: "w:m W:h s:h t:m u:d v:d q:d o:h"}
        - {name: bracer, shape: poly, pts: [[13, 36], [21, 36], [21, 46], [13, 46]], recolour: "q:m o:h"}
        # tousled tufts over the top of the head (light from the upper left)
        - name: tufts
          shape: pixels
          x: 22
          y: 5
          rows: |
            ______d_____
            _d___dhd___d
            dhd__dmd__dmd
            _dhddhmhddmd
        # the ball -> a capture pod: durasteel shell, kyber-blue band, lit from the upper left
        - {name: ball, shape: poly, pts: [[42, 27], [51, 27], [51, 36], [42, 36]], erase: true}
        - name: pod
          shape: pixels
          x: 42
          y: 28
          rows: |
            ___KKK__
            __KWWwK_
            _KWWwwvK
            _KoqqqqK
            _KwwwwvK
            __KwwvK_
            ___KKK__
