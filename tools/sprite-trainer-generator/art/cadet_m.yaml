name: cadet_m
kit: trainer64
replaces: graphics/trainers/front_pics/school_kid_m.png
# CADET (m) with a datapad (generic class, replaces School Kid M). Repaint of the School Kid
# himself: same pose (adjusting his glasses, the other hand down), navy hair -> brown, light-blue
# shirt -> olive-grey academy tunic, khaki trousers -> slate grey, his book bag -> a datapad with
# a lit screen.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200]  # a skin light
  - [232, 176, 144]  # b skin base
  - [208, 144, 112]  # c skin shadow
  - [120, 88, 80]    # d skin edge
  - [152, 152, 160]  # t grey light
  - [128, 88, 56]    # h hair
  - [72, 48, 40]     # j hair dark
  - [80, 80, 96]     # u grey dark
  - [200, 232, 248]  # e screen light
  - [88, 168, 232]   # g screen glow
  - [112, 112, 128]  # B grey base
  - [168, 176, 136]  # o tunic light
  - [112, 120, 88]   # O tunic base
  - [248, 248, 248]  # W white
  - [16, 16, 24]     # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, t: 5, h: 6, j: 7, u: 8, e: 9, g: 10, B: 11, o: 12, O: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/school_kid_m.png
      # school_kid_m: 1-4 skin, 6/7 navy hair, 12/13 light-blue shirt (and the glasses), 5/11/8
      # khaki trousers light -> dark, 9/10/14 bag and shoes, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: t, 6: h, 7: j, 8: u, 9: e, 10: g, 11: B, 12: o, 13: O, 14: W, 15: K}
    rig:
      layers:
        # glasses were drawn in the shirt blues: pale lenses, dark frames
        - {name: glasses, shape: poly, pts: [[22, 21], [37, 21], [37, 25], [22, 25]], recolour: "o:e O:K"}
        # shoes: dark boots
        - {name: boots, shape: poly, pts: [[20, 57], [44, 57], [44, 64], [20, 64]], recolour: "e:B O:u W:t g:u"}
        # rank tab on the chest, far side
        - {name: rank tab, shape: pixels, x: 28, y: 33, rows: "gK\nWK"}
        # book bag -> datapad held low in the near hand, screen lit; the hand is grafted back
        # from the base on top so the fingers wrap the pad's edge
        - {name: bag, shape: poly, pts: [[42, 42], [51, 42], [51, 58], [37, 58], [37, 47], [42, 47]], erase: true}
        - name: datapad
          shape: pixels
          x: 38
          y: 46
          rows: |
            _KKKKKKKK_
            KtttttttBK
            KteeeeggBK
            KtegggggBK
            KteKKKggBK
            KtegggggBK
            KteKKgKgBK
            KtggggggBK
            KBBBBBBuuK
            _KKKKKKKK_
        - name: hand
          shape: graft
          pic: graphics/trainers/front_pics/school_kid_m.png
          box: [37, 43, 5, 4]
          remap: {1: a, 2: b, 3: c, 4: d, 7: j, 12: '.', 15: K}
        - {name: fingers, shape: pixels, x: 38, y: 47, rows: "Kbd\n_K"}
