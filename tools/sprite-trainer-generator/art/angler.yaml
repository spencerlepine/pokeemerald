name: angler
kit: trainer64
replaces: graphics/trainers/front_pics/fisherman.png
# ANGLER (replaces Fisherman). Repaint of the Fisherman, rod and all: orange life vest -> a sand
# work vest, navy -> slate-grey spacer coveralls, cap -> a brown wide cap.
palette:
  - [115, 197, 164]  # 0 transparent
  - [248, 224, 200] # a skin light
  - [240, 200, 152] # b skin base
  - [200, 152, 112] # c skin shadow
  - [88, 64, 56]    # d skin edge
  - [120, 112, 112] # e grey
  - [112, 120, 136] # f coverall base
  - [224, 192, 136] # g vest light
  - [184, 144, 96]  # h vest base
  - [208, 208, 216] # i white shadow
  - [128, 88, 56]   # j brown
  - [64, 72, 88]    # k coverall dark
  - [208, 168, 112] # m cap light
  - [152, 112, 72]  # n cap base
  - [240, 240, 248] # W white
  - [16, 16, 24]    # K outline
legend: {'.': 0, a: 1, b: 2, c: 3, d: 4, e: 5, f: 6, g: 7, h: 8, i: 9, j: 10, k: 11, m: 12, n: 13, W: 14, K: 15}
frames:
  front:
    repaint:
      pic: graphics/trainers/front_pics/fisherman.png
      # fisherman: 1-4 skin, 5 grey, 6/11 navy, 7/8 yellow, 9/14 white, 10 brown, 12/13 orange, 15 outline
      remap: {1: a, 2: b, 3: c, 4: d, 5: e, 6: f, 7: g, 8: h, 9: i, 10: j, 11: k, 12: m, 13: n, 14: W, 15: K}
    rig:
      layers:
        # the ball on the line -> a pale float
        - {name: float, shape: poly, pts: [[15, 55], [22, 55], [22, 61], [15, 61]], recolour: "m:i n:i"}
        # white cap -> a sand cap with a darker brim
        - {name: cap, shape: poly, pts: [[40, 10], [64, 10], [64, 20], [40, 20]], recolour: "W:m i:n"}
