# place `at` so the eyes sit on the head's middle row. 8-9 iris dark/light, s skin shadow
# (nose, mouth), t skin edge.
rows: |
  KK...KKKK
  K9...K9WK
  K8...K88K
  .........
  ..s......
  .........
  ..tt.....
