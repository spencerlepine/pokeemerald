# A Tipoca landing platform or walkway hub (Attack of the Clones: Obi-Wan lands the Delta-7 on a round
# pad on pylons, an access tube leading off to the city). A round deck on thick pylons with a raised
# landing ring, lamp posts on the rim, and on some an access tube, a control pod or a beacon mast.
# Narrow ones (3-4) are walkway hubs: a rail on the front rim and a lamp mast in the middle.
name: platform
style: kamino
about: Round deck on pylons; landing ring, rim lamps, access tube, control pod or mast; hubs get rails.
width: [3, 4, 5, 6]
choose:
  R: "=w_max / 2 - 0.02"
  ry: "=[0.55, 0.62][seed % 2]"
  z: [0.4, 0.55]
  cy: "=R * ry + 0.05"
  ring: {pick: [true, false], weights: "=[3, 1] if W >= 5 else [0, 1]"}
  extra: {pick: [tube, pod, mast, none], weights: "=[3, 2, 2, 1] if W >= 5 else [0, 0, 3, 1]"}
  side: {pick: [-1, 1]}
  lamps: {pick: [2, 4], weights: [2, 1]}
parts:
  - {use: pylon, name: core, at: [0, "=cy", 0], with: {h: "=z", r: "=R * 0.32"}}
  - repeat: 2
    parts:
      - {use: pylon, name: "=f'leg{i}'", at: ["=(R * 0.65) * (1 if i else -1)", "=cy - R * ry * 0.35", 0], with: {h: "=z", r: 0.15}}
  - {use: disc, name: deck, at: [0, "=cy", 0], with: {R: "=R", ry: "=ry", z: "=z", t: 0.16}}
  - when: "=ring"
    parts:
      - {name: ring, mat: pylon, cylinder: {a: [0, "=cy", "=z - 0.02"], b: [0, "=cy", "=z + 0.03"], r1: "=R * 0.62"},
         squash: {scale: [1, "=ry", 1], center: [0, "=cy", 0]}}
      - {name: ring-in, mat: shell, cylinder: {a: [0, "=cy", "=z - 0.01"], b: [0, "=cy", "=z + 0.05"], r1: "=R * 0.48"},
         squash: {scale: [1, "=ry", 1], center: [0, "=cy", 0]}}
  - repeat: "=lamps"
    parts:
      - {name: "=f'lamp{i}'", mat: pylon, cylinder: {a: ["=R * 0.88 * cos(radians(200 + i * 140 / max(1, n - 1)))", "=cy + R * ry * 0.88 * sin(radians(200 + i * 140 / max(1, n - 1)))", "=z"],
                                                     b: ["=R * 0.88 * cos(radians(200 + i * 140 / max(1, n - 1)))", "=cy + R * ry * 0.88 * sin(radians(200 + i * 140 / max(1, n - 1)))", "=z + 0.3"], r1: 0.07}}
      - {name: "=f'lamphead{i}'", mat: shell, ellipsoid: {c: ["=R * 0.88 * cos(radians(200 + i * 140 / max(1, n - 1)))", "=cy + R * ry * 0.88 * sin(radians(200 + i * 140 / max(1, n - 1)))", "=z + 0.32"], r: [0.12, 0.1, 0.08]}}
  - when: "=extra == 'tube'"
    parts:
      - {name: tube, mat: shell, cylinder: {a: ["=side * R * 0.55", "=cy + R * ry * 0.3", "=z + 0.3"], b: ["=side * (R + 0.2)", "=cy + R * ry + 0.6", "=z + 0.3"], r1: 0.32}}
      - {name: tube-band, mat: glass, cylinder: {a: ["=side * R * 0.7", "=cy + R * ry * 0.45", "=z + 0.3"], b: ["=side * (R + 0.2)", "=cy + R * ry + 0.6", "=z + 0.3"], r1: 0.34},
         squash: {scale: [1, 1, 0.35], center: [0, 0, "=z + 0.3"]}}
      - {name: tube-mouth, mat: glass, ellipsoid: {c: ["=side * R * 0.55", "=cy + R * ry * 0.3", "=z + 0.3"], r: [0.3, 0.12, 0.3]}}
  - when: "=extra == 'pod'"
    parts:
      - {use: saucer, name: pod, at: ["=side * R * 0.62", "=cy + R * ry * 0.55", 0], with: {R: 0.62, ry: 0.7, z0: "=z", skirt: 0.0, wall: 0.42, hk: 0.45}}
      - {use: saucer-band, name: pod-band, at: ["=side * R * 0.62", "=cy + R * ry * 0.55", 0], with: {R: 0.62, ry: 0.7, z0: "=z", wall: 0.42, lo: 0.4, hi: 0.8}}
  - when: "=extra == 'mast'"
    parts:
      - {use: mast, name: mast, at: ["=0 if W < 5 else side * R * 0.6", "=cy + (0 if W < 5 else R * ry * 0.5)", "=z"], with: {h: "=1.0 if W < 5 else 1.3", head: 0.24}}
  - when: "=W < 5"
    parts:
      - {use: rail, name: rail-w, at: ["=-R * 0.55", "=cy - R * ry * 0.8", "=z"], with: {w: "=R * 0.6", h: 0.3}}
      - {use: rail, name: rail-e, at: ["=R * 0.55", "=cy - R * ry * 0.8", "=z"], with: {w: "=R * 0.6", h: 0.3}}
