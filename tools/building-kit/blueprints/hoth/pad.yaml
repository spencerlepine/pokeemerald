# A Rebel survey shuttle pad (The Empire Strikes Back: the landing area cleared outside Echo Base): a
# chamfered plate laid on the packed snow, landing lights on the corners, drifts creeping over the edges,
# and on some a small control module, fuel tanks or a beacon mast.
name: pad
style: hoth
about: Chamfered plate on the snow with landing lights; drifts, control module, fuel tanks or beacon mast.
width: [4, 5, 6]
choose:
  w: "=w_max - 0.05"
  d: "=min(2.9, (H or 4) - 1.0)"
  t: [0.12, 0.2]
  extra: {pick: [module, tanks, mast], weights: [2, 2, 2]}
  side: {pick: [-1, 1]}
  mark: {pick: [cross, bars]}
parts:
  - name: plate
    mat: plate
    prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=d"], ["=-w / 2", "=d"]], z: [0, "=t"], top: ["=(w - 0.2) / w", "=(d - 0.2) / d"], round: 0.02}
  - when: "=mark == 'cross'"
    parts:
      - {name: mark-x, mat: snow, box: {c: [0, "=d / 2", "=t + 0.01"], half: ["=w * 0.3", 0.12, 0.03]}}
      - {name: mark-y, mat: snow, box: {c: [0, "=d / 2", "=t + 0.01"], half: [0.12, "=d * 0.3", 0.03]}}
    else:
      - repeat: 3
        parts:
          - {name: "=f'bar{i}'", mat: snow, box: {c: ["=(i - 1) * w * 0.22", "=d / 2", "=t + 0.01"], half: [0.14, "=d * 0.3", 0.03]}}
  - repeat: 4
    parts:
      - {name: "=f'light{i}'", mat: snow, box: {c: ["=(w / 2 - 0.2) * (1 if i % 2 else -1)", "=0.2 if i < 2 else d - 0.2", "=t + 0.08"], half: [0.1, 0.1, 0.08], radius: 0.02}}
  - {use: drift, name: drift-1, at: ["=side * (w_max / 2 - 0.6)", "=d * 0.7", 0], with: {rx: 0.58, ry: "=d * 0.4", hz: 0.4}}
  - {use: drift, name: drift-2, at: ["=-side * (w_max / 2 - 0.8)", "=d", 0], with: {rx: 0.78, ry: 0.35, hz: 0.3}}
  - when: "=extra == 'module'"
    parts:
      - {use: module, name: control, at: ["=-side * (w / 2 - 0.75)", "=d - 0.95", 0], with: {w: 1.3, d: 0.9, h: 0.95, ch: 0.2}}
      - {use: window-slot, name: control-win, at: ["=-side * (w / 2 - 0.75)", "=d - 0.97", 0.62], with: {w: 0.7, h: 0.2, glass: hole, trim: plate}}
  - when: "=extra == 'tanks'"
    parts:
      - repeat: 2
        parts:
          - {name: "=f'tank{i}'", mat: prefab, cylinder: {a: ["=-side * (w / 2 - 0.25)", "=d - 0.35 - i * 0.55", 0.3], b: ["=-side * (w / 2 - 1.35)", "=d - 0.35 - i * 0.55", 0.3], r1: 0.26}}
          - {name: "=f'tankfoot{i}'", mat: plate, box: {c: ["=-side * (w / 2 - 0.8)", "=d - 0.35 - i * 0.55", 0.1], half: [0.4, 0.2, 0.1]}}
  - when: "=extra == 'mast'"
    parts:
      - {name: mast, mat: prefab, cylinder: {a: ["=-side * (w / 2 - 0.3)", "=0.5", 0], b: ["=-side * (w / 2 - 0.3)", "=0.5", 1.6], r1: 0.09, r2: 0.06}}
      - {name: beacon, mat: snow, box: {c: ["=-side * (w / 2 - 0.3)", 0.48, 1.65], half: [0.14, 0.1, 0.12], radius: 0.03}}
      - {name: mast-foot, mat: plate, box: {c: ["=-side * (w / 2 - 0.3)", 0.5, 0.15], half: [0.25, 0.2, 0.15]}}
