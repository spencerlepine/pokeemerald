# A Rebel sensor tower (The Empire Strikes Back: the dish antennas on the Echo Base ridge, the power
# generators the walkers march on): a prefab hut at the foot of a tall post with a dish or a pole
# antenna, or a squat generator shed with heater stacks.
name: sensor-tower
style: hoth
about: Prefab hut with a tall dish post or pole antenna; or a generator shed with stacks; drifts.
width: [2, 3, 4]
choose:
  form: {pick: [dish, pole, generator], weights: [2, 1, 2]}
  ph: [1.6, 2.4]
  side: {pick: [-1, 1]}
  w: "=w_max * 0.9"
parts:
  - when: "=form == 'generator'"
    parts:
      - {use: module, name: shed, at: [0, 0.15, 0], with: {w: "=w", d: 1.3, h: 0.95, ch: 0.25}}
      - {name: drum, mat: plate, cylinder: {a: ["=-side * w * 0.22", 0.9, 0.7], b: ["=-side * w * 0.22", 0.9, 1.25], r1: "=min(0.42, w * 0.2)"}}
      - {use: stack, name: stack1, at: ["=side * w * 0.25", 0.8, 0.7], with: {h: 0.6, r: 0.16}}
      - {use: stack, name: stack2, at: ["=side * w * 0.25 + side * 0.0", 1.15, 0.7], with: {h: 0.85, r: 0.14}}
      - {use: door-hatch, name: door, at: [0, 0.15, 0], with: {w: 0.75, h: 0.75}}
    else:
      - {use: module, name: hut, at: ["=side * (w / 2 - 0.55) if W > 2 else 0", 0.15, 0], with: {w: "=min(1.2, w)", d: 0.9, h: 0.75, ch: 0.18}}
      - when: "=form == 'dish'"
        parts:
          - {use: dish, name: dish, at: ["=-side * (w / 2 - 0.5) if W > 2 else 0", 1.25, 0], with: {h: "=ph", r: "=min(0.62, w * 0.42)", tilt: 55}}
        else:
          - {name: pole, mat: prefab, cylinder: {a: ["=-side * (w / 2 - 0.4) if W > 2 else 0", 1.2, 0], b: ["=-side * (w / 2 - 0.4) if W > 2 else 0", 1.2, "=ph + 0.6"], r1: 0.1, r2: 0.05}}
          - {name: crossbar, mat: plate, box: {c: ["=-side * (w / 2 - 0.4) if W > 2 else 0", 1.15, "=ph + 0.2"], half: [0.45, 0.06, 0.06]}}
          - {name: crossbar2, mat: plate, box: {c: ["=-side * (w / 2 - 0.4) if W > 2 else 0", 1.15, "=ph - 0.3"], half: [0.32, 0.06, 0.06]}}
  - {use: drift, name: drift, at: ["=side * w * 0.4", 0.7, 0], with: {rx: 0.5, ry: 0.5, hz: 0.35}}
