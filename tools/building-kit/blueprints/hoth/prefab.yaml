# The Rebel prefab buildings of Echo Base and the survey outposts (The Empire Strikes Back): grey
# modules with chamfered roofs, ribbed half-cylinder huts, a dug-in dome bunker, all half buried in snow.
# Varies: the body (module, two stacked modules, ribbed quonset, dome bunker with an entry module), the
# door (hatch or wide cargo door), drifts on one or both sides, snow on the roof, a dish, heater stacks,
# slot windows, crates.
name: prefab
style: hoth
about: Prefab module, stacked modules, ribbed quonset or dome bunker; hatch or cargo door, drifts, dish, stacks.
width: [3, 4, 5, 6]
choose:
  form: {pick: [module, stacked, quonset, bunker], weights: [3, 2, 3, 2]}
  w: ["=w_max * 0.8", "=w_max * 0.95"]
  d: [1.3, 1.7]
  h: "=[1.0, 0.85, 0, 0][['module', 'stacked', 'quonset', 'bunker'].index(form)]"
  dx0: ["=-w / 2 + 0.7", "=w / 2 - 0.7"]
  dx: "=door_x if door_x is not None else dx0 * 0.6"
  doorkind: {pick: [hatch, cargo], weights: [3, 1]}
  side: "=1 if dx < 0 else -1"
  roofsnow: {pick: [true, false]}
  extra: {pick: [dish, stacks, crates, none], weights: [2, 2, 2, 1]}
  wins: {pick: [true, false], weights: [2, 1]}
parts:
  - when: "=form == 'module'"
    parts:
      - {use: module, name: body, at: [0, 0.15, 0], with: {w: "=w", d: "=d", h: "=h", ch: 0.28}}
  - when: "=form == 'stacked'"
    parts:
      - {use: module, name: body, at: [0, 0.15, 0], with: {w: "=w", d: "=d", h: "=h", ch: 0.12}}
      - {use: module, name: upper, at: ["=-side * w * 0.18", "=0.15 + d * 0.3", "=h - 0.02"], with: {w: "=w * 0.55", d: "=d * 0.6", h: 0.65, ch: 0.2}}
  - when: "=form == 'quonset'"
    parts:
      - {use: quonset, name: body, at: ["=dx", 0.15, 0], with: {r: "=min(1.15, w / 2)", d: "=d * 1.1", k: "=min(1.0, 1.15 / min(1.15, w / 2))"}}
      - when: "=w > 2.9"
        parts:
          - {use: quonset, name: body2, at: ["=dx + side * (min(1.15, w / 2) + 0.55)", 0.45, 0], with: {r: 0.65, d: "=d * 0.9", k: 1.0}}
  - when: "=form == 'bunker'"
    parts:
      - {name: dome, mat: prefab, ellipsoid: {c: ["=-side * w * 0.12", "=0.35 + d * 0.55", 0], r: ["=w * 0.42", "=d * 0.6", "=min(1.25, w * 0.32)"]}}
      - {name: dome-ring, mat: plate, ellipsoid: {c: ["=-side * w * 0.12", "=0.35 + d * 0.55", "=min(1.25, w * 0.32) * 0.82"], r: ["=w * 0.18", "=d * 0.28", 0.18]}}
      - {use: module, name: entry, at: ["=dx", 0.12, 0], with: {w: 1.35, d: 0.9, h: 1.05, ch: 0.18}}
  - when: "=roofsnow and form in ('module', 'stacked')"
    parts:
      - {use: drift, name: roof-snow, at: ["=side * w * 0.2", "=0.15 + d * 0.6", "=h - 0.05"], with: {rx: "=w * 0.3", ry: "=d * 0.32", hz: 0.12}}
  - {use: drift, name: drift-a, at: ["=-side * (w_max / 2 - 0.45)", "=0.15 + d * 0.4", 0], with: {rx: 0.45, ry: "=d * 0.5", hz: 0.55}}
  - when: "=W >= 5"
    parts:
      - {use: drift, name: drift-b, at: ["=side * (w_max / 2 - 0.5)", "=0.15 + d * 0.6", 0], with: {rx: 0.48, ry: "=d * 0.4", hz: 0.4}}
  - when: "=wins and form in ('module', 'stacked')"
    parts:
      - {use: window-slot, name: win, at: ["=dx + side * 1.05", 0.13, "=0.62 if form != 'quonset' else 0.55"], with: {w: 0.6, h: 0.22, glass: hole, trim: plate}}
  - when: "=extra == 'dish'"
    parts:
      - {use: dish, name: dish, at: ["=-side * (w / 2 - 0.45)", "=0.15 + d * 0.55", "=max(h, 0.6)"], with: {h: 0.45, r: 0.36}}
  - when: "=extra == 'stacks'"
    parts:
      - {use: stack, name: stack, at: ["=-side * (w / 2 - 0.4)", "=0.15 + d * 0.65", "=max(h - 0.2, 0.4)"], with: {h: 0.45, r: 0.17}}
  - when: "=extra == 'crates'"
    parts:
      - {use: crate, name: crate1, at: ["=side * (w / 2 - 0.25)", -0.05, 0], with: {s: 0.45, mat: plate}}
      - {use: crate, name: crate2, at: ["=side * (w / 2 - 0.28)", -0.02, 0.45], with: {s: 0.36, mat: prefab}}
  - when: "=doorkind == 'hatch'"
    parts:
      - {use: door-hatch, name: door, at: ["=dx", "=0.15 if form != 'bunker' else 0.12", 0], with: {w: 0.8, h: 0.82}}
    else:
      - {use: hangar-door, name: door, at: ["=dx", "=0.12 if form != 'bunker' else 0.1", 0], with: {w: 1.05, h: 0.8, frame: 0.14, open: 0.55}}
