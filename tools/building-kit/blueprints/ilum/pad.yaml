# An Ilum landing pad (Jedi: Fallen Order: the Mantis sets down on the frozen shelf below the temple; The
# Clone Wars: the Jedi transport lands by the pilgrims' path): a six-sided stone platform swept of snow,
# a dark emblem ring in the middle, crystal beacons or stone obelisks on its corners, drifts at the edge.
name: pad
style: ilum
about: Six-sided stone platform with an emblem ring; crystal beacons or obelisks at the corners, drifts.
width: [4, 5, 6]
choose:
  a: "=w_max / 2 - 0.05"
  d: "=min(2.8, (H or 4) - 1.1)"
  t: [0.14, 0.22]
  posts: {pick: [kyber, obelisk, mixed]}
  side: {pick: [-1, 1]}
  ring: {pick: [true, false], weights: [3, 1]}
parts:
  - name: plate
    mat: stone
    prism: {poly: [["=-a * 0.6", 0], ["=a * 0.6", 0], ["=a", "=d / 2"], ["=a * 0.6", "=d"], ["=-a * 0.6", "=d"], ["=-a", "=d / 2"]], z: [0, "=t"], top: 0.96, round: 0.02}
  - when: "=ring"
    parts:
      - {name: ring, mat: darkst, cylinder: {a: [0, "=d / 2", "=t - 0.02"], b: [0, "=d / 2", "=t + 0.02"], r1: "=d * 0.36"}, squash: {scale: [1.25, 1, 1], center: [0, "=d / 2", 0]}}
      - {name: ring-in, mat: stone, cylinder: {a: [0, "=d / 2", "=t - 0.01"], b: [0, "=d / 2", "=t + 0.03"], r1: "=d * 0.26"}, squash: {scale: [1.25, 1, 1], center: [0, "=d / 2", 0]}}
  - repeat: 4
    parts:
      - pick:
          - set: {px: "=(a * 0.6 - 0.15) * (1 if i % 2 else -1)", py: "=0.15 if i < 2 else d - 0.2"}
            parts:
              - when: "=posts == 'kyber' or (posts == 'mixed' and i < 2)"
                parts:
                  - {use: crystal-cluster, name: "=f'beacon{i}'", at: ["=px", "=py", "=t"], with: {s: "=0.75 if i < 2 else 0.95"}}
                else:
                  - {name: "=f'obelisk{i}'", mat: darkst, prism: {poly: [["=px - 0.17", "=py - 0.12"], ["=px + 0.17", "=py - 0.12"], ["=px + 0.17", "=py + 0.12"], ["=px - 0.17", "=py + 0.12"]], z: ["=t", "=t + 0.85"], top: 0.5, round: 0.02}}
  - {use: drift, name: drift-1, at: ["=side * (a - 0.35)", "=d * 0.85", 0], with: {rx: 0.42, ry: 0.4, hz: 0.32}}
  - {use: drift, name: drift-2, at: ["=-side * (a - 0.3)", "=d * 0.15", 0], with: {rx: 0.32, ry: 0.3, hz: 0.25}}
