# Jedi stone buildings on Ilum (The Clone Wars "The Gathering", Jedi: Fallen Order, and the stepped
# Jedi Temple of Coruscant): a sloped stone base, a hall with walls that lean in, a hipped or pyramid
# roof, and on some a short spire; kyber crystals as lamps by the door.
# Varies: one or two steps of base, roof (hipped, pyramid, flat with spire, twin spires), a side wing,
# crystal lamps (none, one, two), a narrow Jedi door or a wide one.
name: stone-hall
style: ilum
about: Sloped stone base, leaning-walled hall, hipped/pyramid/spire roof, side wing, crystal lamps.
width: [3, 4, 5, 6]
choose:
  w: ["=w_max * 0.72", "=w_max * 0.88"]
  d: [1.4, 1.9]
  base: {pick: [1, 2]}
  bh: [0.15, 0.25]
  h: [0.85, 1.1]
  roof: {pick: [hip, pyramid, step, spire, twin], weights: [1, 2, 2, 2, 1]}
  wing: {pick: [true, false], weights: [1, 2]}
  lamps: {pick: [0, 1, 2], weights: [1, 2, 2]}
  dx: "=door_x if door_x is not None else 0"
  side: "=1 if dx <= 0 else -1"
  rise: [0.5, 0.75]
parts:
  - {use: stepped, name: base, at: [0, 0, 0], with: {w: "=w + 0.4", d: "=d + 0.3", h: "=bh", s: 0.94}}
  - when: "=base == 2"
    parts:
      - {use: stepped, name: base2, at: [0, 0.15, "=bh"], with: {w: "=w + 0.15", d: "=d + 0.05", h: "=bh * 0.8", s: 0.95}}
  - {use: stepped, name: hall, at: [0, 0.25, "=bh * (1.8 if base == 2 else 1)"], with: {w: "=w", d: "=d - 0.2", h: "=h", s: 0.8}}
  - when: "=roof == 'hip'"
    parts:
      - {use: hip-roof, name: roof, at: [0, 0.25, 0], with: {w: "=w * 0.82", d: "=(d - 0.2) * 0.82", z: "=bh * (1.8 if base == 2 else 1) + h", rise: "=rise", ridge: 0.35, over: 0.12, mat: snow}}
  - when: "=roof == 'pyramid'"
    parts:
      - {use: hip-roof, name: roof, at: [0, 0.25, 0], with: {w: "=w * 0.82", d: "=(d - 0.2) * 0.82", z: "=bh * (1.8 if base == 2 else 1) + h", rise: "=rise + 0.25", ridge: 0.02, over: 0.1, mat: snow}}
  - when: "=roof == 'step'"
    parts:
      - {use: stepped, name: tier2, at: [0, "=0.25 + (d - 0.2) * 0.15", "=bh * (1.8 if base == 2 else 1) + h - 0.02"], with: {w: "=w * 0.62", d: "=(d - 0.2) * 0.6", h: "=h * 0.5", s: 0.75}}
      - {use: drift, name: tier2-snow, at: [0, "=0.25 + (d - 0.2) * 0.45", "=bh * (1.8 if base == 2 else 1) + h * 1.48"], with: {rx: "=w * 0.22", ry: "=(d - 0.2) * 0.2", hz: 0.1}}
      - {use: crystal, name: tier2-kyber, at: [0, "=0.25 + (d - 0.2) * 0.45", "=bh * (1.8 if base == 2 else 1) + h * 1.48"], with: {h: 0.6, r: 0.14}}
  - when: "=roof in ('spire', 'twin')"
    parts:
      - {use: stepped, name: crown, at: [0, "=0.25 + (d - 0.2) * 0.12", "=bh * (1.8 if base == 2 else 1) + h"], with: {w: "=w * 0.72", d: "=(d - 0.2) * 0.65", h: 0.2, s: 0.85}}
      - repeat: "=1 if roof == 'spire' else 2"
        parts:
          - pick:
              - set: {X: "=0 if n == 1 else (w * 0.22 if i else -w * 0.22)", Y: "=0.25 + (d - 0.2) * 0.3"}
                parts:
                  - name: "=f'spire{i}'"
                    mat: stone
                    prism: {poly: [["=X - 0.22", "=Y"], ["=X + 0.22", "=Y"], ["=X + 0.22", "=Y + 0.4"], ["=X - 0.22", "=Y + 0.4"]], z: ["=bh * (1.8 if base == 2 else 1) + h + 0.18", "=bh * (1.8 if base == 2 else 1) + h + 0.18 + rise * 1.4"], top: [0.15, 0.2], round: 0.02}
  - when: "=wing and W >= 4"
    parts:
      - {use: stepped, name: wing, at: ["=side * (w_max / 2 - min(1.0, (w_max - w) + 0.5) / 2)", 0.45, 0], with: {w: "=min(1.0, (w_max - w) + 0.5)", d: "=d * 0.7", h: "=h * 0.75", s: 0.85}}
  - {use: door-jedi, name: door, at: ["=dx", 0.22, "=bh * (1.8 if base == 2 else 1)"], with: {w: 0.78, h: "=min(1.0, h - 0.05)"}}
  - repeat: "=lamps"
    parts:
      - {use: crystal-cluster, name: "=f'lamp{i}'", at: ["=dx + (1 if i else -1) * 0.85", -0.02, 0], with: {s: 1.0}}
