# A long mud lodge on Dagobah (Yoda's hut grown long, The Empire Strikes Back): a barrel-vaulted mud
# hall lying east-west with a dome at one or both ends, a row of portholes, a round-topped door,
# chimneys; some stand on a plank deck over the bog. The Bacta Center and the bigger homes.
name: mud-lodge
style: dagobah
about: Long mud barrel vault with end domes, a row of portholes, round door, chimneys; deck or bank.
width: [5, 6]
choose:
  lim: "=(H if H else 4) - 0.3"
  vr: [0.62, 0.8]
  ry: [0.75, 0.9]
  ends: {pick: [both, one], weights: [2, 1]}
  side: "=1 if (seed % 2) else -1"
  er: "=vr * 1.25"
  vl: "=w_max - 2 * er * (1.0 if ends == 'both' else 0.7) - 0.3"
  vx: "=0 if ends == 'both' else -er * 0.4"
  cy: "=vr * ry + 0.15"
  base: {pick: [deck, bank, none], weights: [2, 2, 1]}
  z0: "=0.25 if base == 'deck' else 0.0"
  dx: "=door_x if door_x is not None else vx"
  wins: {int: [2, 3]}
  chims: {int: [1, 2]}
parts:
  - when: "=base == 'deck'"
    parts:
      - {use: deck, name: deck, at: [0, 0.05, 0], with: {w: "=w_max", d: "=cy * 2 + 0.1", z: "=z0", t: 0.14, mat: plank}}
      - {use: stilts, name: stilts, at: [0, 0.05, 0], with: {w: "=w_max", d: "=cy * 2 + 0.1", h: "=z0 - 0.1", r: 0.1, mat: root}}
  - when: "=base == 'bank'"
    parts:
      - {name: bank, mat: moss, cylinder: {a: [0, "=cy", 0], b: [0, "=cy", 0.1], r1: "=w_max / 2"}, squash: {scale: [1, "=(cy + 0.15) / (w_max / 2)", 1], center: [0, "=cy", 0]}}
  - {name: vault, mat: mud, cylinder: {a: ["=vx - vl / 2", "=cy", "=z0"], b: ["=vx + vl / 2", "=cy", "=z0"], r1: "=vr"},
     squash: {scale: [1, "=ry", 1.35], center: [0, "=cy", "=z0"]}, noise: {amp: 0.03, freq: 2.2, seed: "=seed"}}
  - {use: mud-dome, name: end-e, at: ["=vx + vl / 2", "=cy + 0.05", "=z0"], with: {r: "=er", ry: "=ry * 0.75", hk: "=min(0.9, (lim - cy - z0 - 0.4) / er)", seed: "=seed + 1"}}
  - when: "=ends == 'both'"
    parts:
      - {use: mud-dome, name: end-w, at: ["=vx - vl / 2", "=cy + 0.05", "=z0"], with: {r: "=er * 0.9", ry: "=ry * 0.75", hk: "=min(0.85, (lim - cy - z0 - 0.4) / er)", seed: "=seed + 2"}}
  - {use: mud-door, name: door, at: ["=dx", "=cy - vr * ry + 0.08", "=z0"], with: {w: 0.55, h: "=min(0.62, vr * 0.85)"}}
  - repeat: "=wins"
    parts:
      - {use: porthole, name: "=f'win{i}'", at: ["=max(-w_max / 2 + 0.6, min(w_max / 2 - 0.6, dx + side * [0.85, -0.85, 1.65][i]))", "=cy - vr * ry * 0.75 + 0.05", "=z0 + vr * 0.75"], with: {r: 0.19}}
  - repeat: "=chims"
    parts:
      - {use: chimney, name: "=f'chim{i}'", at: ["=vx + (i - 0.5) * vl * 0.55 + side * 0.2", "=cy + 0.15", "=z0 + vr * 1.3"], with: {h: 0.32}}
  - chance: 0.5
    parts:
      - {use: bog-lamp, name: lamp, at: ["=dx - side * 0.75", -0.05, 0], with: {h: 0.9}}
