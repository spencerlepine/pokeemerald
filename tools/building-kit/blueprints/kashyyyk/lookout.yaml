# A Wookiee lookout (Revenge of the Sith: the Kachirho shore watch posts): splayed timber legs carrying a
# platform with a small round hut or an open woven canopy on top; a store hut at the foot. Tall, so a
# shallow plan: 3 or 4 cells wide, 5 or 6 tall.
name: lookout
style: kashyyyk
about: Splayed timber legs, a platform with a round hut or open canopy, a store hut with a door at the foot.
width: [3, 4]
choose:
  B: "=(H if H else 5) - 0.35"
  cy: [0.72, 0.85]
  ry: 0.7
  pr: "=min(w_max / 2 / 0.924, [1.05, 1.25][seed % 2])"   # platform radius
  crown: {pick: [hut, canopy], weights: [3, 2]}
  roofr: "=pr * (1.08 if crown == 'hut' else 1.12)"
  rise: [0.8, 1.05]
  hw: "=0.55 if crown == 'hut' else 0.7"
  pz: "=max(1.4, B - cy - rise - hw - 0.15)"       # platform height
  legs: {pick: [3, 4]}
  dxx: "=door_x if door_x is not None else 0"
parts:
  - repeat: "=legs"
    parts:
      - {name: leg, mat: bark, cylinder: {a: ["=(pr * 1.0) * cos(radians(90 + 360 * i / n + 45 * (n == 4)))", "=cy + ry * pr * 1.0 * sin(radians(90 + 360 * i / n + 45 * (n == 4)))", 0],
                                           b: ["=(pr * 0.55) * cos(radians(90 + 360 * i / n + 45 * (n == 4)))", "=cy + ry * pr * 0.55 * sin(radians(90 + 360 * i / n + 45 * (n == 4)))", "=pz"], r1: 0.16, r2: 0.13}}
  - {use: octo, name: platform, with: {r: "=pr", ry: "=ry", cy: "=cy", z0: "=pz - 0.15", z1: "=pz", top: 1, mat: plank}}
  - when: "=crown == 'hut'"
    parts:
      - {use: octo, name: hut, with: {r: "=pr * 0.72", ry: "=ry", cy: "=cy", z0: "=pz", z1: "=pz + hw", top: 1, mat: wood}}
      - {use: slat-window, name: slit, at: [0, "=cy - pr * 0.72 * ry * 0.924", "=pz + hw * 0.55"], with: {w: 0.5, h: 0.22}}
    else:
      - repeat: 2
        parts:
          - {name: cpost, mat: wood, box: {c: ["=(i * 2 - 1) * pr * 0.55", "=cy - pr * ry * 0.5", "=pz + hw / 2"], half: [0.08, 0.08, "=hw / 2"]}}
  - {use: flare-roof, name: roof, with: {r: "=roofr", ry: "=ry", cy: "=cy", z: "=pz + hw", skirt: 0.15, kink: 0.6, rise: "=rise - 0.15"}}
  - {use: box-block, name: store, at: ["=dxx * 0.6", "=cy - 0.45", 0], with: {w: 1.1, d: 0.8, h: 0.95, mat: wood}}
  - {use: gable-roof, name: store-roof, at: ["=dxx * 0.6", "=cy - 0.45", 0], with: {w: 1.1, d: 0.8, z: 0.95, rise: 0.3, over: 0.1, mat: thatch}}
  - {use: wook-door, name: door, at: ["=dxx * 0.6", "=cy - 0.45", 0], with: {w: 0.62, h: 0.78, frame: 0.12}}
  - name: ladder
    mat: plank
    box: {c: ["=dxx * 0.6 + (0.72 if dxx <= 0 else -0.72)", "=cy - pr * ry * 0.8", "=pz / 2"], half: [0.13, 0.05, "=pz / 2"]}
