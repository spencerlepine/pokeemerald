# Kachirho's working timber (Revenge of the Sith: the shore sheds and the Wookiee catamaran yards): a
# closed trade shed with a wide shutter, a workshop with an open lean-to and a smoke stack, or an open
# market platform of woven awnings on posts. Crates and carved tusks round them.
name: trade-shed
style: kashyyyk
about: Timber shed with a wide shutter, a workshop with lean-to and stack, or an open platform of woven awnings.
width: [4, 5, 6]
choose:
  B: "=(H if H else 4) - 0.35"
  mode: {pick: [shed, workshop, stall], weights: [2, 2, 1]}
  dxx: "=door_x if door_x is not None else 0"
  sw: "=w_max * (0.9 if mode == 'shed' else 0.62)"          # shed width
  sx: "=0 if mode == 'shed' else max(-w_max / 2 + sw / 2, min(w_max / 2 - sw / 2, dxx + (0.35 if seed % 2 else -0.35)))"
  d: [1.3, 1.8]
  h: [1.05, 1.3]
  roof: {pick: [hip, front], weights: [1, 1]}
  rise: "=max(0.35, min(1.0, B - d - h - 0.2))"
  lx: "=(w_max / 2 + sx + sw / 2) / 2 if sx < 0 else (-w_max / 2 + sx - sw / 2) / 2"   # lean-to centre
  lw: "=w_max - sw - 0.05"
  na: {pick: [2, 3]}
  crates: {pick: [true, false], weights: [3, 1]}
parts:
  - when: "=mode != 'stall'"
    parts:
      - {use: box-block, name: shed, at: ["=sx", 0, 0], with: {w: "=sw", d: "=d", h: "=h", mat: wood}}
      - when: "=roof == 'hip'"
        parts:
          - {use: hip-roof, name: roof, at: ["=sx", 0, 0], with: {w: "=sw", d: "=d", z: "=h", rise: "=rise", ridge: "=max(0.05, 1 - d / sw)", over: 0.15, mat: thatch}}
        else:
          - name: roof
            mat: thatch
            extrude: {axis: y, profile: [["=sx - sw / 2 - 0.14", "=h"], ["=sx + sw / 2 + 0.14", "=h"], ["=sx", "=h + rise"]], span: [-0.14, "=d + 0.14"], round: 0.03}
      - {name: lintel, mat: plank, box: {c: ["=dxx", -0.04, "=min(0.98, h - 0.1) + 0.08"], half: [0.82, 0.07, 0.09], radius: 0.02}}
      - {use: door-slab, name: door, at: ["=dxx", 0, 0], with: {w: 1.35, h: "=min(0.98, h - 0.1)", door: dark, trim: plank}}
  - when: "=mode == 'workshop'"
    parts:
      - repeat: 2
        parts:
          - {name: lean-post, mat: bark, cylinder: {a: ["=lx + (i * 2 - 1) * (lw / 2 - 0.2)", 0.15, 0], b: ["=lx + (i * 2 - 1) * (lw / 2 - 0.2)", 0.15, 0.95], r1: 0.13}}
      - name: lean-roof
        mat: thatch
        extrude: {axis: x, profile: [[-0.1, 0.92], ["=d", "=h - 0.05"], ["=d", "=h + 0.06"], [-0.1, 1.03]], span: ["=lx - lw / 2", "=lx + lw / 2"], round: 0.03}
      - {use: crate, name: bench, at: ["=lx", "=d * 0.55", 0], with: {s: 0.6, mat: plank}}
      - {use: vent, name: stack, at: ["=sx + (sw / 2 - 0.4) * (1 if lx < sx else -1)", "=d * 0.7", "=h"], with: {r: 0.2, h: "=min(0.7, rise + 0.3)", mat: bark}}
  - when: "=mode == 'stall'"
    parts:
      - {use: deck, name: deck, at: [0, 0.05, 0], with: {w: "=w_max", d: "=d", z: 0.2, t: 0.2, mat: plank}}
      - repeat: "=na"
        parts:
          - {name: post-w, mat: bark, cylinder: {a: ["=-w_max / 2 + (i + 0.5) * w_max / n - w_max / n / 2 + 0.25", 0.25, 0.2], b: ["=-w_max / 2 + (i + 0.5) * w_max / n - w_max / n / 2 + 0.25", 0.25, 1.05], r1: 0.12}}
          - {name: post-e, mat: bark, cylinder: {a: ["=-w_max / 2 + (i + 0.5) * w_max / n + w_max / n / 2 - 0.25", 0.25, 0.2], b: ["=-w_max / 2 + (i + 0.5) * w_max / n + w_max / n / 2 - 0.25", 0.25, 1.05], r1: 0.12}}
          - name: awning
            mat: thatch
            extrude: {axis: y, profile: [["=-w_max / 2 + i * w_max / n + 0.06", 1.0], ["=-w_max / 2 + (i + 1) * w_max / n - 0.06", 1.0], ["=-w_max / 2 + (i + 0.5) * w_max / n", "=1.0 + min(0.75, B - d - 1.1)"]],
                      span: [0.05, "=d"], round: 0.03}
          - {use: crate, name: goods, at: ["=-w_max / 2 + (i + 0.5) * w_max / n", "=d * 0.5", 0.2], with: {s: 0.5, mat: wood}}
  - when: "=crates and mode == 'shed'"
    parts:
      - {use: crate, name: crate, at: ["=dxx + (1.25 if dxx <= 0 else -1.25)", -0.05, 0], with: {s: 0.5, mat: plank}}
