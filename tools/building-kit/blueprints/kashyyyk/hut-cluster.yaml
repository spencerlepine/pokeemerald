# A cluster of Wookiee round houses on one timber deck (Revenge of the Sith: the Kachirho shore; the
# Holiday Special's Rwookrrorro): a big drum in the middle with one or two smaller ones against it, each
# under its own steep woven cone. `use` picks what it is: homes, storage pods (low, no windows, many
# small drums) or a bacta lodge (a dark glass band round the big drum and a landing light on top).
name: hut-cluster
style: kashyyyk
about: Two or three round timber drums with cone roofs side by side; homes, storage pods or a bacta lodge.
width: [5, 6, 7]
choose:
  B: "=(H if H else 4) - 0.35"
  mode: {pick: [homes, pods], weights: [3, 2]}
  ry: [0.62, 0.74]
  n: {pick: [2, 3], weights: [2, 3]}
  dxx: "=door_x if door_x is not None else 0"
  mx: "=dxx if mode != 'pods' else 0"
  Rm: "=min((w_max / 2 - abs(mx)) / 0.924 * (0.62 if n == 3 else 0.75), (B - 0.55) / (ry * 0.924 * 2.3 + 0.9 / 1.0) * 0.95, 1.65)"
  rm: "=Rm / 1.15"
  hm: "=0.95 if mode != 'pods' else 0.75"
  cym: "=0.3 + rm * ry * 0.924"
  riseM: "=max(0.55, min(1.25, B - cym - hm - 0.12))"
  rs: "=max(0.45, min(Rm * 0.62, (w_max / 2 - abs(mx) - Rm * 0.924) / 1.474))"
  side: {pick: [-1, 1]}
  sx: "=mx + side * (Rm * 0.924 + rs * 0.55)"
  sx2: "=mx - side * (Rm * 0.924 + rs * 0.5)"
parts:
  # the big drum
  - {use: octo, name: wall, at: ["=mx", 0, 0], with: {r: "=rm", ry: "=ry", cy: "=cym", z0: 0, z1: "=hm", top: 1, mat: wood}}
  - when: "=mode == 'bacta'"
    parts:
      - {use: octo, name: glass, at: ["=mx", 0, 0], with: {r: "=rm + 0.05", ry: "=ry", cy: "=cym", z0: 0.14, z1: "=min(0.5, hm - 0.2)", top: 1, mat: dark}}
  - {use: flare-roof, name: roof, at: ["=mx", 0, 0], with: {r: "=Rm", ry: "=ry", cy: "=cym", z: "=hm", skirt: 0.2, kink: 0.58, rise: "=riseM - 0.2"}}
  - when: "=mode == 'bacta'"
    parts:
      - {name: beacon, mat: light, cylinder: {a: ["=mx", "=cym", "=hm + riseM - 0.3"], b: ["=mx", "=cym", "=hm + riseM + 0.05"], r1: 0.2, r2: 0.18}}
      - {name: beacon-cap, mat: trim, cylinder: {a: ["=mx", "=cym", "=hm + riseM + 0.05"], b: ["=mx", "=cym", "=hm + riseM + 0.13"], r1: 0.26}}
  # the side drums
  - repeat: "=n - 1"
    parts:
      - {use: octo, name: swall, at: ["=sx if i == 0 else sx2", 0, 0], with: {r: "=rs / 1.15", ry: "=ry", cy: "=cym + 0.12", z0: 0, z1: "=hm * 0.8", top: 1, mat: wood}}
      - {use: octo, name: sroof, at: ["=sx if i == 0 else sx2", 0, 0], with: {r: "=rs", ry: "=ry", cy: "=cym + 0.12", z0: "=hm * 0.8", z1: "=hm * 0.8 + riseM * 0.62", top: 0.06, mat: thatch}}
  # the way in
  - when: "=mode == 'pods'"
    parts:
      - {use: door-slab, name: door, at: ["=mx", "=cym - rm * ry * 0.924", 0], with: {w: 0.8, h: 0.62, door: dark, trim: plank}}
    else:
      - when: "=mode == 'bacta'"
        parts:
          - {use: porch, name: porch, at: ["=mx", 0, 0], with: {w: 2.3, d: 0.8, h: "=hm * 0.98", rise: 0.16, mat: light}}
          - {name: glass-w, mat: dark, box: {c: ["=mx - 0.82", -0.03, "=hm * 0.5"], half: [0.2, 0.05, 0.22]}}
          - {name: glass-e, mat: dark, box: {c: ["=mx + 0.82", -0.03, "=hm * 0.5"], half: [0.2, 0.05, 0.22]}}
        else:
          - {use: porch, name: porch, at: ["=mx", 0, 0], with: {w: 1.3, d: 0.75, h: "=hm * 0.98", rise: 0.16}}
      - {use: wook-door, name: door, at: ["=mx", 0, 0], with: {w: 0.78, h: "=min(0.8, hm - 0.17)"}}
