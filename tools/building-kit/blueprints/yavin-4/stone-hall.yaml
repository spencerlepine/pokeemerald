# A Massassi stone hall the Rebels moved into (Yavin 4's lesser temples and annexes: quarters, the
# sabacc den, the medic's hut): one or two battered stone tiers with deep window slots, a Rebel slab
# door fitted into the stone, Rebel kit on the roof (a prefab module, a mast, a light), vines.
name: stone-hall
style: yavin-4
about: Battered Massassi stone hall in one or two tiers, window slots, Rebel slab door, prefab or mast on the roof.
width: [4, 5, 6, 8]
choose:
  w: ["=w_max * 0.85", "=w_max"]
  d: ["=max(1.3, (H or 4) * 0.4)", "=max(1.5, (H or 4) * 0.5)"]
  h: [1.0, 1.25]
  tiers: {pick: [1, 2], weights: [2, 3]}
  roof: {pick: [module, mast, plain, tarp], weights: [3, 2, 1, 2]}
  side: {pick: [-1, 1]}
  dx: "=door_x if door_x is not None else 0"
  porch: {pick: [true, false], weights: [2, 3]}
parts:
  - {use: stone-tier, name: hall, with: {w: "=w", d: "=d", h: "=h", top: 0.9}}
  - {use: slot-row, name: slots, at: [0, 0.08, "=h * 0.6"], with: {w: "=w * 0.86", n: "=max(2, min(6, round(w / 1.15)))", sw: 0.3, sh: 0.26}}
  - when: "=tiers == 2"
    parts:
      - {use: stone-tier, name: upper, at: ["=side * w * 0.12", "=d * 0.25", "=h"], with: {w: "=w * 0.58", d: "=d * 0.6", h: 0.6, top: 0.86}}
      - {name: upper-slot, mat: dark, box: {c: ["=side * w * 0.12", "=d * 0.25 + 0.02", "=h + 0.3"], half: ["=w * 0.12", 0.05, 0.13]}}
  - when: "=porch"
    parts:
      - {name: lintel, mat: massassi, box: {c: ["=dx", -0.1, "=h * 0.82"], half: [0.75, 0.2, 0.1], radius: 0.02}}
      - {name: post-w, mat: massassi, box: {c: ["=dx - 0.62", -0.18, "=h * 0.4"], half: [0.13, 0.13, "=h * 0.4"], radius: 0.02}}
      - {name: post-e, mat: massassi, box: {c: ["=dx + 0.62", -0.18, "=h * 0.4"], half: [0.13, 0.13, "=h * 0.4"], radius: 0.02}}
  - {use: door-slab, name: door, at: ["=dx", 0.05, 0], with: {w: 0.85, h: "=min(0.8, h * 0.66)", door: metal, trim: prefab}}
  - when: "=roof == 'module'"
    parts:
      - {use: module, name: module, at: ["=-side * w * 0.2", "=d * 0.3", "=h"], with: {w: "=min(1.6, w * 0.35)", d: "=d * 0.5", h: 0.42, rise: 0.12}}
  - when: "=roof == 'mast'"
    parts:
      - {use: mast, name: mast, at: ["=-side * (w / 2 - 0.5)", "=d * 0.6", "=h"], with: {h: 1.0, dish: 0.26}}
  - when: "=roof == 'tarp'"
    parts:
      - {name: tarp, mat: tarp, extrude: {axis: x, profile: [[0.1, "=h + 0.3"], [0.1, "=h + 0.36"], ["=d * 0.7", "=h + 0.2"], ["=d * 0.7", "=h + 0.14"]], span: ["=-side * w * 0.4", "=-side * w * 0.05"], round: 0.02}}
      - {name: tarp-pole, mat: metal, box: {c: ["=-side * w * 0.22", 0.14, "=h + 0.15"], half: [0.05, 0.05, 0.15]}}
  - chance: 0.7
    parts:
      - {use: vines, name: vine, at: ["=side * (w / 2 - 0.5)", 0.02, "=h - 0.03"], with: {w: 0.7, h: "=h * 0.5"}}
  - chance: 0.5
    parts:
      - {use: crate, name: crate, at: ["=-side * (w / 2 - 0.3)", 0.0, 0], with: {s: 0.42}}
