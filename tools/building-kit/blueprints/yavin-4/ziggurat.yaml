# The Great Temple of the Massassi (A New Hope; Rogue One): a stepped stone ziggurat of battered tiers,
# rows of deep window slots, a long hangar mouth at its foot with the Rebel blast door half raised, a
# stair up the middle or a shrine block on top; vines down the tiers. Small and broken (`ruin`), it is
# a jungle shrine the Rebels never moved into.
name: ziggurat
style: yavin-4
about: Stepped Massassi ziggurat, window slot rows, hangar mouth at the foot, central stair or crown block, vines.
width: [4, 6, 8, 10]
choose:
  w: ["=w_max * 0.94", "=w_max"]
  big: "=W >= 7"
  ruin: "=W < 7"
  tiers: "=4 if big else 2"
  th: ["=0.8 if big else 0.6", "=0.92 if big else 0.75"]
  D: "=min((H or 8) * 0.5, w * 0.5) if big else min((H or 4) * 0.6, w * 0.62)"
  step: "=D * (0.17 if big else 0.3)"
  shrink: "=w * (0.17 if big else 0.26)"
  crown: {pick: [stair, block, cap], weights: [3, 2, 2]}
  mouth: "=big"
  mw: ["=w * 0.32", "=w * 0.42"]
  dx: "=door_x if door_x is not None else 0"
  open: [0.65, 0.85]
  vn: {int: [1, 2]}
  side: {pick: [-1, 1]}
parts:
  - repeat: "=tiers"
    parts:
      - {use: stone-tier, name: tier, at: [0, "=i * step", "=i * th"], with: {w: "=w - i * shrink", d: "=D - i * step * 1.6", h: "=th", top: 0.9}}
      - when: "=i > 0 or not mouth"
        parts:
          - {use: slot-row, name: slots, at: [0, "=i * step + 0.06", "=i * th + th * 0.5"], with: {w: "=(w - i * shrink) * 0.78", n: "=max(2, min(6, round((w - i * shrink) / 1.3)))", sw: 0.32, sh: "=th * 0.42"}}
  - when: "=crown == 'block'"
    parts:
      - {use: stone-tier, name: crown, at: [0, "=tiers * step + D * 0.05", "=tiers * th"], with: {w: "=w * 0.24", d: "=D * 0.22", h: "=th * 1.1", top: 0.86}}
      - {name: crown-slot, mat: dark, box: {c: [0, "=tiers * step + D * 0.05 - 0.04", "=tiers * th + th * 0.5"], half: [0.16, 0.05, "=th * 0.28"]}}
  - when: "=crown == 'stair'"
    parts:
      - {name: stair, mat: massassi, prism: {poly: [["=dx - 0.55", "=0.0 if not mouth else step * 0.95"], ["=dx + 0.55", "=0.0 if not mouth else step * 0.95"], ["=dx + 0.45", "=tiers * step + 0.3"], ["=dx - 0.45", "=tiers * step + 0.3"]], z: [0, "=tiers * th + 0.05"], top: [0.8, 0.12], lean: [0, "=tiers * step * 0.45"], round: 0.03}}
      - {use: stone-tier, name: crown, at: [0, "=tiers * step + D * 0.02", "=tiers * th"], with: {w: "=w * 0.18", d: "=D * 0.16", h: "=th * 0.7", top: 0.85}}
  - when: "=mouth"
    parts:
      - {use: hangar-mouth, name: door, at: ["=dx", 0, 0], with: {w: "=mw", h: "=th * 0.85", open: "=open"}}
    else:
      - {use: door-slab, name: door, at: ["=dx", 0, 0], with: {w: 0.8, h: "=th * 0.75", door: dark, trim: massassi}}
  - repeat: "=vn"
    parts:
      - {use: vines, name: vine, at: ["=side * (w * 0.3 - i * w * 0.24)", "=step * min(i, tiers - 1) - 0.02", "=th * (min(i, tiers - 1) + 1) - 0.02"], with: {w: 0.7, h: "=th * 0.6"}}
  - when: "=ruin"
    parts:
      - {name: rubble1, mat: massassi, hull: {points: [["=-side * (w / 2 - 0.2)", -0.05, 0], ["=-side * (w / 2 - 0.75)", -0.05, 0], ["=-side * (w / 2 - 0.3)", 0.4, 0], ["=-side * (w / 2 - 0.45)", 0.15, 0.4]]}}
      - {name: gap, mat: moss, box: {c: ["=-side * w * 0.25", "=step + D * 0.25", "=th * 2 + 0.02"], half: ["=w * 0.12", "=D * 0.12", 0.04]}}
