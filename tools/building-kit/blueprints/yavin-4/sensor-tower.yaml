# A Rebel sensor tower on Yavin 4 (the base's long-range scanners): a tall lattice-like mast of stacked
# frames on a Massassi stone plinth, a dish or a ring of sensor vanes on top, a small equipment hut.
name: sensor-tower
style: yavin-4
about: Tall Rebel sensor mast on a Massassi plinth, dish or vane ring on top, an equipment hut at its foot.
width: [2, 3]
choose:
  mh: [2.0, 2.6]
  head: {pick: [dish, vanes], weights: [1, 1]}
  hut: "=W >= 3"
  mx: "=-0.35 if W >= 3 else 0"
parts:
  - {use: stone-tier, name: plinth, at: ["=mx", 0.2, 0], with: {w: 0.95, d: 0.8, h: 0.3, top: 0.88}}
  - {name: leg-w, mat: metal, prism: {poly: [["=mx - 0.32", 0.35], ["=mx - 0.2", 0.35], ["=mx - 0.2", 0.5], ["=mx - 0.32", 0.5]], z: [0.3, "=mh"], lean: [0.2, 0], round: 0.01}}
  - {name: leg-e, mat: metal, prism: {poly: [["=mx + 0.2", 0.35], ["=mx + 0.32", 0.35], ["=mx + 0.32", 0.5], ["=mx + 0.2", 0.5]], z: [0.3, "=mh"], lean: [-0.2, 0], round: 0.01}}
  - repeat: 3
    parts:
      - {name: brace, mat: metal, box: {c: ["=mx", 0.42, "=0.3 + (i + 1) * (mh - 0.3) / 4"], half: ["=0.3 - (i + 1) * 0.045", 0.07, 0.06]}}
  - when: "=head == 'dish'"
    parts:
      - {name: dish, mat: light, ellipsoid: {c: ["=mx", 0.3, "=mh + 0.3"], r: [0.45, 0.12, 0.38]}}
      - {name: horn, mat: metal, box: {c: ["=mx", 0.15, "=mh + 0.3"], half: [0.06, 0.12, 0.06]}}
    else:
      - {name: hub, mat: prefab, cylinder: {a: ["=mx", 0.42, "=mh"], b: ["=mx", 0.42, "=mh + 0.3"], r1: 0.22}}
      - {name: vane-w, mat: light, box: {c: ["=mx - 0.38", 0.42, "=mh + 0.2"], half: [0.2, 0.05, 0.28]}}
      - {name: vane-e, mat: light, box: {c: ["=mx + 0.38", 0.42, "=mh + 0.2"], half: [0.2, 0.05, 0.28]}}
      - {name: tip, mat: metal, box: {c: ["=mx", 0.42, "=mh + 0.5"], half: [0.05, 0.05, 0.2]}}
  - when: "=hut"
    parts:
      - {use: module, name: hut, at: [0.75, 0.1, 0], with: {w: 0.95, d: 0.75, h: 0.6, rise: 0.12}}
      - {name: hut-door, mat: dark, box: {c: [0.75, 0.04, 0.27], half: [0.2, 0.05, 0.27]}}
