# A Mos Eisley docking bay (A New Hope, Docking Bay 94), seen as the street sees it: a wide, low, open-roof
# ring of battered adobe wall, faceted, its south face head-on with a tall gate block and a big blast door,
# the inner face of the far wall and the sunken floor showing through the open top. No ship inside (the
# owner, 2026-11-04: a parked ship never reads in this camera). Some bays get crates by the inner wall,
# a fuel tank or a vent.
name: docking-bay
style: tatooine
about: Open-roof ring of battered adobe wall with a tall gate block and blast door; crates, tank or crane inside.
width: [7, 8]
choose:
  hh: "=H if H else 7"
  h: [1.7, 2.1]                                   # wall height
  t: [0.45, 0.6]                                  # wall thickness
  n: {pick: [8, 10], weights: [3, 2]}                          # facets
  rx: "=w_max / 2 - 0.05"                         # outer half-width
  ry: "=min((hh - h - 1.7) / 2, rx * 0.7)"       # round things show r * 0.7 deep (greybox rule)       # outer half-depth (the lot's height less the wall)
  cy: "=ry + 0.15"
  ex0: [-0.8, 0.8]
  ex: "=door_x if door_x is not None else ex0"
  gw: [2.3, 2.8]                                  # gate block width
  gh: "=h + 0.6"
  extra: {pick: [crates, tank, none], weights: [3, 2, 1]}
  vent: {pick: [true, false]}
parts:
  # the sunken floor, a step below the ground
  - {name: floor, mat: dark, cylinder: {a: [0, "=cy", 0], b: [0, "=cy", 0.04], r1: "=rx - t"}, squash: {scale: [1, "=(ry - t) / (rx - t)", 1], center: [0, "=cy", 0]}}
  # the ring wall: one battered segment per facet, between the outer and the inner polygon
  - repeat: "=n"
    parts:
      - name: "=f'wall{i}'"
        mat: wall
        prism:
          poly:
            - ["=rx * cos(2 * pi * i / n + pi / n)", "=cy + ry * sin(2 * pi * i / n + pi / n)"]
            - ["=rx * cos(2 * pi * (i + 1) / n + pi / n)", "=cy + ry * sin(2 * pi * (i + 1) / n + pi / n)"]
            - ["=(rx - t) * cos(2 * pi * (i + 1) / n + pi / n)", "=cy + (ry - t) * sin(2 * pi * (i + 1) / n + pi / n)"]
            - ["=(rx - t) * cos(2 * pi * i / n + pi / n)", "=cy + (ry - t) * sin(2 * pi * i / n + pi / n)"]
          z: [0, "=h"]
          top: 0.96
          round: 0.04
      - name: "=f'rim{i}'"
        mat: trim
        prism:
          poly:
            - ["=(rx + 0.04) * cos(2 * pi * i / n + pi / n)", "=cy + (ry + 0.04) * sin(2 * pi * i / n + pi / n)"]
            - ["=(rx + 0.04) * cos(2 * pi * (i + 1) / n + pi / n)", "=cy + (ry + 0.04) * sin(2 * pi * (i + 1) / n + pi / n)"]
            - ["=(rx - t - 0.04) * cos(2 * pi * (i + 1) / n + pi / n)", "=cy + (ry - t - 0.04) * sin(2 * pi * (i + 1) / n + pi / n)"]
            - ["=(rx - t - 0.04) * cos(2 * pi * i / n + pi / n)", "=cy + (ry - t - 0.04) * sin(2 * pi * i / n + pi / n)"]
          z: ["=h - 0.14", "=h + 0.04"]
          round: 0.03
  # the gate block on the street side, taller than the ring, with the blast door
  - {use: adobe-block, name: gate, at: ["=ex", 0, 0], with: {w: "=gw", d: 1.0, h: "=gh", batter: 0.16, rnd: 0.1}}
  - {use: roof-lip, name: gate-lip, at: ["=ex", 0, 0], with: {w: "=gw", d: 1.0, h: "=gh", batter: 0.16, t: 0.18}}
  - {use: door-slab, name: door, at: ["=ex", 0, 0], with: {w: 1.1, h: "=gh * 0.62"}}
  # what is in the bay
  - when: "=extra == 'crates'"
    parts:
      - {use: crate, name: crate1, at: ["=-rx * 0.45", "=cy + ry - t - 0.45", 0], with: {s: 0.6}}
      - {use: crate, name: crate2, at: ["=-rx * 0.45 + 0.65", "=cy + ry - t - 0.4", 0], with: {s: 0.5}}
      - {use: crate, name: crate3, at: ["=rx * 0.4", "=cy + ry - t - 0.5", 0], with: {s: 0.65}}
  - when: "=extra == 'tank'"
    parts:
      - {name: tank, mat: metal, cylinder: {a: ["=-rx + t + 0.55", "=cy + 0.3", 0], b: ["=-rx + t + 0.55", "=cy + 0.3", 1.0], r1: 0.42}}
      - {name: tank-cap, mat: metal, ellipsoid: {c: ["=-rx + t + 0.55", "=cy + 0.3", 1.0], r: [0.42, 0.42, 0.2]}}
  - when: "=vent"
    parts:
      - {use: vent, name: vent, at: ["=-(rx - t / 2) * 0.62 * (1 if seed % 2 else -1)", "=cy + (ry - t / 2) * 0.8", "=h"], with: {r: 0.2, h: 0.4}}
