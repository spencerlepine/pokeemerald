# The Anchorhead farm co-op: a long battered hall where the moisture farmers pool their water (the
# Tosche Station and Anchorhead sets, A New Hope), with a row of vaporators behind it, a round storage
# drum at one end and a barrel-vault or banded roof.
name: farm-co-op
style: tatooine
about: Long battered hall, vaulted or banded roof, a storage drum at one end, vaporators behind.
width: [6, 7]
choose:
  w: ["=w_max * 0.82", "=w_max * 0.92"]
  d: [1.15, 1.4]
  h: [0.9, 1.1]
  batter: [0.08, 0.14]
  roof: {pick: [vault, lip, domes], weights: [3, 2, 2]}
  dx: "=door_x if door_x is not None else 0"
  silo: {pick: [-1, 1, 0], weights: [2, 2, 1]}
  vaps: {int: [2, 4]}
  hx: "=silo * -0.35"                             # the hall shifts away from the silo
parts:
  - {use: adobe-block, name: hall, at: ["=hx", 0, 0], with: {w: "=w - (0.7 if silo else 0)", d: "=d", h: "=h", batter: "=batter"}}
  - when: "=roof == 'vault'"
    parts:
      - {name: vault, mat: roof, squash: {scale: [1, 1, 0.55], center: ["=hx", 0, "=h"]},
         cylinder: {a: ["=hx - (w - (0.7 if silo else 0)) / 2 + batter + 0.05", "=d / 2", "=h"],
                    b: ["=hx + (w - (0.7 if silo else 0)) / 2 - batter - 0.05", "=d / 2", "=h"], r1: "=d / 2 - batter"}}
  - when: "=roof == 'lip'"
    parts:
      - {use: roof-lip, name: lip, at: ["=hx", 0, 0], with: {w: "=w - (0.7 if silo else 0)", d: "=d", h: "=h", batter: "=batter"}}
  - when: "=roof == 'domes'"
    parts:
      - {use: roof-lip, name: lip, at: ["=hx", 0, 0], with: {w: "=w - (0.7 if silo else 0)", d: "=d", h: "=h", batter: "=batter"}}
      - {use: dome, name: dome-w, at: ["=hx - w * 0.22", "=d / 2", "=h"], with: {r: 0.55, ry: 0.85, hk: 0.6}}
      - {use: dome, name: dome-e, at: ["=hx + w * 0.22", "=d / 2", "=h"], with: {r: 0.55, ry: 0.85, hk: 0.6}}
  - when: "=silo != 0"
    parts:
      - {use: drum, name: silo, at: ["=silo * (w / 2 - 0.45)", 0.55, 0], with: {r: 0.5, h: "=h + 0.4"}}
      - {use: dome, name: silo-cap, at: ["=silo * (w / 2 - 0.45)", 0.55, "=h + 0.4"], with: {r: 0.46, ry: 1.0, hk: 0.45}}
  - {use: door-slab, name: door, at: ["=dx", 0, 0], with: {w: 1.1, h: 0.82}}
  - {use: window-slot, name: win-w, at: ["=dx - 1.3", 0, "=h * 0.58"], with: {w: 0.6, h: 0.22}}
  - {use: window-slot, name: win-e, at: ["=dx + 1.3", 0, "=h * 0.58"], with: {w: 0.6, h: 0.22}}
  - repeat: "=vaps"
    parts:
      - {use: vaporator, name: "=f'vap-{i}'", at: ["=hx + (i - (n - 1) / 2) * min(1.25, (w - 1.4) / max(1, n - 1))", "=d + 0.25", 0], with: {h: 1.3}}
