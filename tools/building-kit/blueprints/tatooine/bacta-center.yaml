# A Tatooine Bacta Center (always 5x4): a public building, so a wide front and a wide door. Built like
# the Mos Espa and Mos Eisley civic blocks: a battered hall with a big low dome on top (the cantina and
# Watto's shop domes), or a round rotunda between two wings, or a hall between two drum towers. A
# beacon stack on the roof marks it from afar; the sign in front says what it is.
name: bacta-center
style: tatooine
about: Wide battered hall or rotunda with a big low dome, a wide door and a roof beacon.
width: [5]
choose:
  mass: {pick: [hall, rotunda, towers], weights: [3, 3, 2]}
  w: ["=w_max * 0.9", "=w_max"]
  d: [1.35, 1.6]
  h: [1.05, 1.25]
  batter: [0.08, 0.16]
  R: [1.05, 1.3]
  hk: [0.5, 0.68]
  dx: "=door_x if door_x is not None else 0"
  door: {pick: [slab, arch, porch], weights: [3, 2, 2]}
  wins: {pick: [slot, round, band], weights: [2, 2, 2]}
  beacon: {pick: [stack, vent, none], weights: [3, 2, 1]}
parts:
  # --- massing
  - when: "=mass == 'hall'"
    parts:
      - {use: adobe-block, name: hall, with: {w: "=w", d: "=d", h: "=h", batter: "=batter"}}
      - {use: roof-lip, name: lip, with: {w: "=w", d: "=d", h: "=h", batter: "=batter"}}
      - {use: dome, name: dome, at: [0, "=d * 0.58", "=h"], with: {r: "=R", ry: 0.62, hk: "=hk"}}
  - when: "=mass == 'rotunda'"
    parts:
      - {use: adobe-block, name: wing-w, at: ["=-w * 0.3", 0.25, 0], with: {w: "=w * 0.4", d: "=d - 0.2", h: "=h * 0.75", batter: "=batter"}}
      - {use: adobe-block, name: wing-e, at: ["=w * 0.3", 0.25, 0], with: {w: "=w * 0.4", d: "=d - 0.2", h: "=h * 0.75", batter: "=batter"}}
      - {use: drum, name: rot, at: [0, "=R * 0.75", 0], with: {r: "=R * 0.95", h: "=h"}}
      - {use: dome, name: dome, at: [0, "=R * 0.75", "=h"], with: {r: "=R * 0.88", ry: 0.95, hk: "=hk * 0.9"}}
  - when: "=mass == 'towers'"
    parts:
      - {use: adobe-block, name: hall, at: [0, 0.1, 0], with: {w: "=w - 0.9", d: "=d", h: "=h", batter: "=batter"}}
      - {use: roof-lip, name: lip, at: [0, 0.1, 0], with: {w: "=w - 0.9", d: "=d", h: "=h", batter: "=batter"}}
      - {use: dome, name: dome, at: [0, "=d * 0.62", "=h"], with: {r: "=R * 0.85", ry: 0.6, hk: "=hk"}}
      - {use: drum, name: tw-w, at: ["=-w / 2 + 0.45", 0.5, 0], with: {r: 0.45, h: "=h + 0.35"}}
      - {use: drum, name: tw-e, at: ["=w / 2 - 0.45", 0.5, 0], with: {r: 0.45, h: "=h + 0.35"}}
      - {use: dome, name: tc-w, at: ["=-w / 2 + 0.45", 0.5, "=h + 0.35"], with: {r: 0.42, ry: 1.0, hk: 0.55}}
      - {use: dome, name: tc-e, at: ["=w / 2 - 0.45", 0.5, "=h + 0.35"], with: {r: 0.42, ry: 1.0, hk: 0.55}}
  # --- the wide front door
  - when: "=door == 'slab'"
    parts:
      - {use: door-slab, name: door, at: ["=dx", 0, 0], with: {w: 1.35, h: 0.92, frame: 0.14}}
  - when: "=door == 'arch'"
    parts:
      - {use: door-arch, name: door, at: ["=dx", 0, 0], with: {w: 1.2, h: 0.68, frame: 0.14}}
  - when: "=door == 'porch'"                     # a vaulted porch block standing out in front
    parts:
      - {use: entry-vault, name: porch, at: ["=dx", -0.35, 0], with: {w: 1.7, d: 0.6, h: 0.62, mat: trim}}
      - {use: door-arch, name: door, at: ["=dx", -0.35, 0], with: {w: 1.15, h: 0.62, frame: 0.1}}
  # --- windows either side of the door
  - when: "=wins == 'slot' and mass != 'towers'"
    parts:
      - {use: window-slot, name: win-w, at: ["=dx - 1.45", 0, "=h * 0.55"], with: {w: 0.65, h: 0.24}}
      - {use: window-slot, name: win-e, at: ["=dx + 1.45", 0, "=h * 0.55"], with: {w: 0.65, h: 0.24}}
  - when: "=wins == 'round' and mass != 'towers'"
    parts:
      - {use: window-round, name: win-w, at: ["=dx - 1.4", 0, "=h * 0.55"], with: {r: 0.2}}
      - {use: window-round, name: win-e, at: ["=dx + 1.4", 0, "=h * 0.55"], with: {r: 0.2}}
  - when: "=wins == 'band' and mass == 'hall'"   # a dark glass band across the hall top
    parts:
      - {name: band, mat: dark, box: {c: [0, -0.02, "=h - 0.32"], half: ["=w / 2 - batter - 0.25", 0.05, 0.1]}}
  - when: "=mass == 'towers'"
    parts:
      - {use: window-round, name: win-w, at: ["=-w / 2 + 0.45", 0.02, "=h * 0.75"], with: {r: 0.17}}
      - {use: window-round, name: win-e, at: ["=w / 2 - 0.45", 0.02, "=h * 0.75"], with: {r: 0.17}}
  # --- the roof beacon
  - when: "=beacon == 'stack' and mass != 'rotunda'"
    parts:
      - {use: vent, name: beacon, at: [0, "=d * 0.58", "=h + R * hk - 0.12"], with: {r: 0.2, h: 0.35, mat: light}}
  - when: "=beacon == 'stack' and mass == 'rotunda'"
    parts:
      - {use: vent, name: beacon, at: [0, "=R * 0.75", "=h + R * 0.88 * hk * 0.9 - 0.12"], with: {r: 0.2, h: 0.3, mat: light}}
  - when: "=beacon == 'vent'"
    parts:
      - {use: vent, name: vent-w, at: ["=-w * 0.36", "=d * 0.62", "=h * (0.75 if mass == 'rotunda' else 1)"], with: {r: 0.15, h: 0.32}}
      - {use: vent, name: vent-e, at: ["=w * 0.36", "=d * 0.62", "=h * (0.75 if mass == 'rotunda' else 1)"], with: {r: 0.15, h: 0.32}}
