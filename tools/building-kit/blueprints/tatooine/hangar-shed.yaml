# A Mos Eisley hangar shed (A New Hope, The Phantom Menace): a long low battered block with a wide dark
# hangar mouth, under a faceted vault, a flat roof band or a row of low domes. Shipyards, the sail barge
# dock shed, cargo warehouses.
name: hangar-shed
style: tatooine
about: Long low shed with a wide hangar mouth; faceted vault, flat band or dome row on top; crates, a gantry.
width: [5, 6, 7, 8]
choose:
  hh: "=H if H else 5"
  w: ["=w_max * 0.88", "=w_max"]
  d: ["=hh * 0.42", "=hh * 0.5"]
  h: ["=hh * 0.26", "=hh * 0.32"]
  roof: {pick: [vault, flat, domes], weights: [3, 2, 2]}
  rise: ["=min(d * 0.32, hh - d - h - 0.25)", "=min(d * 0.4, hh - d - h - 0.2)"]
  mw: ["=min(2.6, w * 0.45)", "=min(3.2, w * 0.55)"]   # hangar mouth width
  mx0: ["=-(w / 2 - mw / 2 - 0.3)", "=(w / 2 - mw / 2 - 0.3)"]
  mx: "=max(-(w / 2 - mw / 2 - 0.2), min(w / 2 - mw / 2 - 0.2, door_x)) if door_x is not None else mx0"
  mh: "=h * 0.85"
  mouth: {pick: [square, arch], weights: [3, 2]}
  mwe: "=min(mw, 2 * (mh - 0.4)) if mouth == 'arch' else mw"
  extra: {pick: [crates, gantry, tank, none], weights: [2, 2, 1, 1]}
  ex: "=(w / 2 - 0.55) * (-1 if mx > 0 else 1)"
parts:
  - {use: adobe-block, name: shed, with: {w: "=w", d: "=d", h: "=h", batter: 0.14, rnd: 0.08}}
  - when: "=roof == 'flat'"
    parts:
      - {use: roof-lip, name: lip, with: {w: "=w", d: "=d", h: "=h", batter: 0.14, t: 0.18}}
      - {use: adobe-block, name: upper, at: ["=-mx * 0.4", "=d * 0.45", "=h"], with: {w: "=w * 0.35", d: "=d * 0.45", h: "=min(0.5, rise)", batter: 0.08}}
  - when: "=roof == 'vault'"                      # a low-poly barrel vault, east-west
    parts:
      - name: vault
        mat: roof
        extrude: {axis: x, span: ["=-w / 2 + 0.16", "=w / 2 - 0.16"], round: 0.04,
                  profile: [["=0.14", "=h - 0.02"], ["=d * 0.2", "=h + rise * 0.7"], ["=d * 0.42", "=h + rise"],
                            ["=d * 0.62", "=h + rise"], ["=d * 0.82", "=h + rise * 0.7"], ["=d - 0.14", "=h - 0.02"]]}
      - {name: vault-end-w, mat: trim, box: {c: ["=-w / 2 + 0.22", "=d / 2", "=h + rise * 0.4"], half: [0.1, "=d * 0.42", "=rise * 0.55"], radius: 0.03}}
      - {name: vault-end-e, mat: trim, box: {c: ["=w / 2 - 0.22", "=d / 2", "=h + rise * 0.4"], half: [0.1, "=d * 0.42", "=rise * 0.55"], radius: 0.03}}
  - when: "=roof == 'domes'"
    parts:
      - {use: roof-lip, name: lip, with: {w: "=w", d: "=d", h: "=h", batter: 0.14, t: 0.16}}
      - repeat: "=max(2, int(w // 1.8))"
        parts:
          - {use: dome, name: dome, at: ["=-w / 2 + (i + 0.5) * w / n", "=d * 0.52", "=h"],
             with: {r: "=min(w / n * 0.42, d * 0.4)", ry: 0.9, hk: "=min(0.6, rise / max(0.3, min(w / n * 0.42, d * 0.4)))"}}
  # the hangar mouth: a wide dark opening in a heavy frame
  - {use: hangar-mouth, name: door, at: ["=mx", 0, 0], with: {w: "=mwe", h: "=mh", arch: "=1 if mouth == 'arch' else 0"}}
  - when: "=extra == 'crates'"
    parts:
      - {use: crate, name: crate1, at: ["=ex", -0.05, 0], with: {s: 0.55}}
      - {use: crate, name: crate2, at: ["=ex - 0.1 * (1 if ex > 0 else -1)", 0.05, 0.55], with: {s: 0.42}}
  - when: "=extra == 'gantry'"                    # a loading gantry: two posts and a beam
    parts:
      - {name: g-post, mat: metal, box: {c: ["=ex", -0.1, "=h * 0.6"], half: [0.1, 0.1, "=h * 0.6"]}}
      - {name: g-beam, mat: metal, box: {c: ["=ex - 0.3 * (1 if ex > 0 else -1)", -0.1, "=h * 1.15"], half: [0.4, 0.1, 0.08]}}
  - when: "=extra == 'tank'"                      # a fuel tank against the wall
    parts:
      - {name: tank, mat: light, cylinder: {a: ["=ex", 0.25, 0], b: ["=ex", 0.25, "=h * 0.8"], r1: 0.32}}
      - {name: tank-cap, mat: metal, ellipsoid: {c: ["=ex", 0.25, "=h * 0.8"], r: [0.32, 0.32, 0.15]}}
