# A speeder garage or repair shed (Watto's yard, the Lars garage, the Mos Espa podracer hangars): a
# battered block or a squat vault with a wide dark bay facing the street, a speeder or a podracer
# engine nosing out, tool crates and a fuel drum.
name: speeder-garage
style: tatooine
about: Battered block or vault with a wide dark bay, a speeder or engine nosing out, crates and a fuel drum.
width: [4, 5, 6]
choose:
  mass: {pick: [block, vault], weights: [1, 1]}
  w: ["=w_max * 0.85", "=w_max"]
  d: [1.3, 1.6]
  h: [1.0, 1.2]
  bw: "=min(2.2, w - 0.9)"                        # bay width
  bx: "=door_x if door_x is not None else ((w - bw) / 2 - 0.35) * (1 if seed % 2 else -1)"
  out: {pick: [speeder, engine, crates], weights: [2, 2, 1]}
  side: "=-1 if bx > 0 else 1"
parts:
  - when: "=mass == 'block'"
    parts:
      - {use: adobe-block, name: shed, at: [0, 0.35, 0], with: {w: "=w", d: "=d", h: "=h", batter: 0.1}}
      - {use: roof-lip, name: lip, at: [0, 0.35, 0], with: {w: "=w", d: "=d", h: "=h", batter: 0.1}}
      - {use: bay-door, name: door, at: ["=bx", 0.35, 0], with: {w: "=bw", h: "=h * 0.72"}}
      - {use: vent, name: vent, at: ["=side * w * 0.3", "=0.35 + d * 0.6", "=h"], with: {r: 0.16, h: 0.35}}
  - when: "=mass == 'vault'"
    parts:
      - {name: shed, mat: wall, squash: {scale: [1, 1, "=h / (w / 2)"], center: [0, 0, 0]}, cylinder: {a: [0, 0.35, 0], b: [0, "=0.35 + d", 0], r1: "=w / 2"}}
      - {name: rib, mat: trim, squash: {scale: [1, 1, "=h / (w / 2)"], center: [0, 0, 0]}, cylinder: {a: [0, 0.28, 0], b: [0, 0.48, 0], r1: "=w / 2 + 0.05"}}
      - {name: bay, mat: dark, squash: {scale: [1, 1, "=h / (w / 2)"], center: [0, 0, 0]}, cylinder: {a: ["=bx", 0.2, 0], b: ["=bx", 0.3, 0], r1: "=min(bw / 2, w / 2 - 0.3)"}}
      - {use: gate-gap, name: door, at: ["=bx", 0.25, 0], with: {w: 0.8}}
  - when: "=out == 'speeder'"
    parts:
      - name: speeder
        mat: light
        hull: {points: [["=bx - 0.45", 0.0, 0.16], ["=bx + 0.45", 0.0, 0.16], ["=bx - 0.55", 0.6, 0.16], ["=bx + 0.55", 0.6, 0.16],
                        ["=bx - 0.35", 0.06, 0.32], ["=bx + 0.35", 0.06, 0.32], ["=bx - 0.45", 0.6, 0.42], ["=bx + 0.45", 0.6, 0.42]], round: 0.04}
  - when: "=out == 'engine'"                      # a podracer engine on blocks
    parts:
      - {name: engine, mat: metal, cylinder: {a: ["=bx", 0.0, 0.32], b: ["=bx", 0.75, 0.32], r1: 0.28, r2: 0.22}}
      - {name: intake, mat: dark, cylinder: {a: ["=bx", -0.04, 0.32], b: ["=bx", 0.02, 0.32], r1: 0.2}}
      - {name: stand, mat: dark, box: {c: ["=bx", 0.4, 0.06], half: [0.22, 0.25, 0.06]}}
  - {use: crate, name: crate, at: ["=side * (w / 2 - 0.35)", 0.15, 0], with: {s: 0.45}}
  - when: "=out == 'crates'"
    parts:
      - {use: crate, name: crate-2, at: ["=side * (w / 2 - 0.35)", 0.15, 0.45], with: {s: 0.36}}
  - {name: drum, mat: metal, cylinder: {a: ["=side * (w / 2 - 0.85)", 0.18, 0], b: ["=side * (w / 2 - 0.85)", 0.18, 0.5], r1: 0.17}}
