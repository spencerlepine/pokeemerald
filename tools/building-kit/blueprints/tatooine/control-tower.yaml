# The Mos Eisley spaceport control tower (A New Hope): a slender battered shaft on a squat base, a wide
# disc cab on top with a dark window band, an antenna or a small dome above.
name: control-tower
style: tatooine
about: Slender shaft on a squat base, a wide disc cab with a window band on top, an antenna or dome above.
width: [3, 4, 5]
choose:
  hh: "=H if H else 6"
  bw: ["=w_max * 0.7", "=w_max * 0.85"]
  bd: [1.0, 1.3]
  bh: [0.9, 1.1]
  sr: [0.38, 0.5]
  cr: "=min(w_max / 2 - 0.05, sr * 2.4)"
  cy: "=bd * 0.55"
  sh: "=hh - 0.6 - cy - cr - 0.5"               # shaft top
  top: {pick: [antenna, dome]}
parts:
  - {use: adobe-block, name: base, with: {w: "=bw", d: "=bd", h: "=bh", batter: 0.14}}
  - {use: roof-lip, name: base-lip, with: {w: "=bw", d: "=bd", h: "=bh", batter: 0.14}}
  - {name: shaft, mat: wall, cylinder: {a: [0, "=cy", "=bh"], b: [0, "=cy", "=sh"], r1: "=sr", r2: "=sr * 0.85"}}
  - {name: cab-under, mat: wall, cylinder: {a: [0, "=cy", "=sh - 0.25"], b: [0, "=cy", "=sh"], r1: "=sr * 0.85", r2: "=cr"}}
  - {name: cab, mat: trim, cylinder: {a: [0, "=cy", "=sh"], b: [0, "=cy", "=sh + 0.45"], r1: "=cr"}}
  - {name: cab-band, mat: dark, cylinder: {a: [0, "=cy", "=sh + 0.12"], b: [0, "=cy", "=sh + 0.33"], r1: "=cr + 0.03"}}
  - when: "=top == 'antenna'"
    parts:
      - {name: mast, mat: metal, cylinder: {a: [0, "=cy", "=sh + 0.45"], b: [0, "=cy", "=sh + 0.95"], r1: 0.07}}
      - {name: mast-ball, mat: light, ellipsoid: {c: [0, "=cy", "=sh + 0.75"], r: [0.14, 0.14, 0.14]}}
    else:
      - {use: dome, name: cap, at: [0, "=cy", "=sh + 0.45"], with: {r: "=cr * 0.55", ry: 1.0, hk: 0.5}}
  - {use: door-slab, name: door, at: ["=door_x or 0", 0, 0], with: {w: 0.85, h: "=bh * 0.75"}}
