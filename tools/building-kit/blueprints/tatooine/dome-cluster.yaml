# The Mos Eisley cantina type: one big low dome with smaller domes against it, a deep arched entry
# block in front, sometimes a tall vent tower.
name: dome-cluster
style: tatooine
about: Big low dome with 1-2 smaller domes, a deep arched entry block, a vent tower on some.
width: [6, 7]
choose:
  R: ["=w_max * 0.22", "=w_max * 0.27"]
  hk: [0.5, 0.65]
  ry: [0.6, 0.72]
  n: {pick: [1, 2], weights: [2, 3]}
  ex: ["=-0.4", "=0.4"]
  eh: [0.95, 1.15]
  ed: [0.8, 1.1]
  tower: {pick: [true, false], weights: [2, 3]}
parts:
  - {use: dome, name: main, at: [0, "=ed * 0.6 + R * ry", 0], with: {r: "=R", ry: "=ry", hk: "=hk"}}
  - {use: dome, name: west, at: ["=-(R * 1.3)", "=ed * 0.6 + R * ry * 0.9", 0], with: {r: "=R * 0.62", ry: "=ry", hk: "=hk * 0.95"}}
  - when: "=n == 2"
    parts:
      - {use: dome, name: east, at: ["=R * 1.3", "=ed * 0.6 + R * ry * 1.05", 0], with: {r: "=R * 0.55", ry: "=ry", hk: "=hk"}}
  - {use: adobe-block, name: entry, at: ["=ex", 0, 0], with: {w: 1.5, d: "=ed", h: "=eh", batter: 0.16, rnd: 0.12}}
  - {use: door-arch, name: door, at: ["=ex", 0, 0], with: {w: 0.85, h: "=eh * 0.6"}}
  - when: "=tower"
    parts:
      - {use: drum, name: tower, at: ["=R * 1.05 * (1 if seed % 2 else -1)", "=ed * 0.6 + 0.15", 0], with: {r: 0.32, h: "=R * hk + 0.9"}}
      - {use: vent, name: tower-cap, at: ["=R * 1.05 * (1 if seed % 2 else -1)", "=ed * 0.6 + 0.15", "=R * hk + 0.9"], with: {r: 0.2, h: 0.12}}
