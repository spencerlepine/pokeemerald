# A Mustafar mining facility hall (Revenge of the Sith, Klegger Corp): a dark battered hall with a band
# of lit windows, heavy shield plates leaning on its front against the heat, then a stepped upper
# block, a shed roof sloping north, a gantry with a collector arm, or heat vents.
name: mining-hall
style: mustafar
about: Dark battered hall, lit window band, leaning shield plates; stepped, shed, gantry or vented roof.
width: [4, 5, 6, 7]
choose:
  Hb: "=H if H else 4"
  w: ["=w_max * 0.78", "=w_max * 0.95"]
  d: "=min(2.2, max(1.3, Hb * 0.45))"
  h: "=min(1.4, max(0.95, Hb * 0.3))"
  roof: {pick: [step, shed, gantry, vents], weights: [3, 2, 2, 2]}
  dx0: ["=-(w / 2 - 0.9)", "=(w / 2 - 0.9)"]
  dxx: "=door_x if door_x is not None else dx0"
  side: "=-1 if dxx > 0 else 1"
  shields: {int: [0, 2]}
  wmat: {pick: [iron, plate], weights: [3, 1]}
parts:
  - {use: bastion, name: hall, with: {w: "=w", d: "=d", h: "=h", batter: 0.14, front: 0.3, mat: "=wmat"}}
  - when: "=roof == 'step'"
    parts:
      - {use: bastion, name: upper, at: ["=side * w * 0.18", "=d * 0.35", "=h - 0.03"], with: {w: "=w * 0.5", d: "=d * 0.5", h: "=min(0.65, Hb - d - h - 0.4)", batter: 0.1, front: 0.2, mat: plate}}
  - when: "=roof == 'shed'"
    parts:
      - name: shed
        mat: plate
        extrude: {axis: x, profile: [["=0.3", "=h - 0.03"], ["=d - 0.12", "=h - 0.03"], ["=d - 0.12", "=h + min(0.55, Hb - d - h - 0.4)"]], span: ["=-w / 2 + 0.2", "=w / 2 - 0.2"], round: 0.03}
  - when: "=roof == 'gantry'"
    parts:
      - {use: pylon, name: pylon, at: ["=-side * (w / 2 - 0.4)", "=d * 0.6", "=h - 0.05"], with: {r: 0.24, h: "=min(1.1, Hb - d - h - 0.3)"}}
      - {name: arm, mat: plate, box: {c: ["=-side * (w / 2 - 1.15)", "=d * 0.6", "=h + min(1.1, Hb - d - h - 0.3) - 0.1"], half: [0.75, 0.14, 0.12]}, rot: [0, 0, "=-side * 10"]}
  - when: "=roof == 'vents'"
    parts:
      - repeat: 2
        parts:
          - {use: vent, name: "=f'vent{i}'", at: ["=-side * (w / 2 - 0.5 - i * 0.6)", "=d * 0.7", "=h - 0.05"], with: {r: 0.18, h: 0.4, mat: plate}}
  - {use: window-band, name: win, at: ["=dxx + side * (0.6 + min(1.8, w - 2.2) / 2 + 0.15)", 0.07, "=h * 0.62"], with: {w: "=max(0.6, min(1.8, w / 2 - 0.9))", h: 0.32}}
  - {use: door-slab, name: door, at: ["=dxx", -0.02, 0], with: {w: 0.9, h: "=min(0.9, h * 0.7)", door: dark}}
  - repeat: "=shields"
    parts:
      - {use: shield, name: "=f'sh{i}'", at: ["=-side * (w / 2 - 0.35 - i * 0.62)", -0.15, 0], with: {w: 0.52, h: "=h + 0.2 - i * 0.2", lean: 0.4}}
