# A Cloud City tower (The Empire Strikes Back): a white rounded tower in a squashed oval, ringed by
# curved bands of windows, under a flared saucer top, a sunset-glass dome, stepped rings, an oval spire
# or a flat roof with a mast. Side wings, a slim lift pylon or tall ribs change its outline. Tall, so
# its plan is shallow: drawn rows = plan depth + height.
name: cloud-tower
style: bespin
about: White oval tower; window bands with piers; saucer, glass dome, rings, spire or mast top; wings, pylon or ribs.
width: [5]
choose:
  Hc: "=H if H else 6"
  body: {pick: [drum, taper, stack, flare], weights: [3, 2, 3, 2]}
  cap: {pick: [saucer, dome, rings, spire, mast], weights: [3, 3, 2, 2, 1]}
  wings: {pick: [none, both, one, pylon, ribs], weights: [2, 3, 2, 2, 2]}
  side: {pick: [-1, 1]}
  nb: {int: [1, 3]}
  wf: [0.88, 1.0]
  w: "=wf * w_max * {'none': 0.86, 'both': 0.56, 'one': 0.68, 'pylon': 0.66, 'ribs': 0.74}[wings]"
  d: [1.3, 1.7]
  k1: "=0.72 if body == 'stack' else (0.85 if body == 'taper' else 1.0)"   # top of the body / its foot
  wt: "=w * k1"
  dt: "=d * k1"
  t0: [0.3, 0.42]
  t1: [0.2, 0.28]
  wc: "=min(w_max - 0.15, max(wt * 1.4, wt + 0.8))"
  dc: "=dt * 1.3"
  rise: [0.8, 1.15]
  need: >-
    =d / 2 + (max(dc / 2 + t0 + t1, t0 + t1 + 0.55) if cap == 'saucer' else
    (0.22 + sqrt((dt * 0.5) ** 2 + 0.65 ** 2) if cap == 'dome' else
    (max(dt * 0.54 + 0.3, dt * 0.25 + 1.05) if cap == 'rings' else
    (max(dt * 0.54 + 0.22, 0.22 + rise) if cap == 'spire' else max(dt * 0.54 + 0.25, 1.3)))))
  hb: "=Hc - 0.35 - need"
  h1: "=hb * 0.5"
  base: {pick: [true, false], weights: [1, 2]}
  door: {pick: [plain, canopy, porch], weights: [2, 2, 1]}
  bh: [0.3, 0.42]
  wh: ["=hb * 0.38", "=hb * 0.55"]
parts:
  # the body
  - when: "=body == 'drum'"
    parts:
      - {use: oval, name: body, with: {w: "=w", d: "=d", z0: 0, z1: "=hb"}}
  - when: "=body == 'taper'"
    parts:
      - {use: oval, name: body, with: {w: "=w", d: "=d", z0: 0, z1: "=hb", top: "=k1"}}
  - when: "=body == 'stack'"
    parts:
      - {use: oval, name: body, with: {w: "=w", d: "=d", z0: 0, z1: "=h1"}}
      - {use: oval, name: ledge, at: [0, -0.08, 0], with: {w: "=w + 0.16", d: "=d + 0.16", z0: "=h1 - 0.05", z1: "=h1 + 0.2", mat: cc-trim, top: 0.95}}
      - {use: oval, name: upper, at: [0, "=(d - dt) / 2", 0], with: {w: "=wt", d: "=dt", z0: "=h1", z1: "=hb"}}
  - when: "=body == 'flare'"                       # a waisted drum flaring out to the top, Cloud City's mushroom
    parts:
      - {use: oval, name: stem, at: [0, "=d * 0.1", 0], with: {w: "=w * 0.72", d: "=d * 0.8", z0: 0, z1: "=hb * 0.5"}}
      - {use: oval, name: body, at: [0, "=d * 0.1", 0], with: {w: "=w * 0.72", d: "=d * 0.8", z0: "=hb * 0.5", z1: "=hb", top: ["=1 / 0.72", "=1 / 0.8"]}}
  # window bands: each a glass ring with piers across the front
  - repeat: "=nb"
    parts:
      - pick:
          - set:
              bz: "=(1.45 if body != 'flare' else hb * 0.55) + (hb - 0.35 - bh - (1.45 if body != 'flare' else hb * 0.55)) * ((i + 0.5) / n if n > 1 else 0.5)"
            parts:
              - pick:
                  - set:
                      bk: "=(1 - 0.15 * bz / hb) if body == 'taper' else ((0.72 if bz > h1 else 1.0) if body == 'stack' else ((0.72 + 0.28 * (bz - hb * 0.5) / (hb * 0.5)) if body == 'flare' else 1.0))"
                      bkd: "=(1 - 0.15 * bz / hb) if body == 'taper' else ((0.72 if bz > h1 else 1.0) if body == 'stack' else ((0.8 + 0.2 * (bz - hb * 0.5) / (hb * 0.5)) if body == 'flare' else 1.0))"
                    parts:
                      - {use: window-band, name: "=f'band{bz:.2f}'", at: [0, "=(d - d * bkd) / 2", 0], with: {w: "=w * bk", d: "=d * bkd", z0: "=bz", z1: "=bz + bh"}}
                      - repeat: "=max(3, round(w * bk / 0.75 - 0.5))"
                        parts:
                          - {use: oval-pier, name: "=f'pier{bz:.2f}-{i}'", at: [0, "=(d - d * bkd) / 2", 0],
                             with: {x: "=(i - (n - 1) / 2) * (w * bk * 0.84 / n)", wk: "=w * bk", dk: "=d * bkd", z0: "=bz - 0.03", z1: "=bz + bh + 0.03"}}
  # the cap
  - when: "=cap == 'saucer'"
    parts:
      - {use: saucer, name: cap, at: [0, "=(d - dt) / 2", 0], with: {w: "=wt", d: "=dt", wc: "=wc", dc: "=dc", z: "=hb", t0: "=t0", t1: "=t1"}}
      - chance: 0.6
        parts:
          - {use: cupola, name: glass, at: [0, "=d / 2", "=hb + t0 + t1 - 0.05"], with: {rx: "=wt * 0.3", ry: "=dt * 0.28", rz: 0.42}}
  - when: "=cap == 'dome'"
    parts:
      - {use: oval, name: collar, at: [0, "=(d - dt) / 2 - 0.06", 0], with: {w: "=wt + 0.12", d: "=dt + 0.12", z0: "=hb - 0.05", z1: "=hb + 0.22", mat: cc-trim}}
      - {use: cupola, name: dome, at: [0, "=d / 2", "=hb + 0.2"], with: {rx: "=wt * 0.44", ry: "=dt * 0.46", rz: 0.62}}
  - when: "=cap == 'rings'"
    parts:
      - {use: oval, name: r1, at: [0, "=(d - dt * 1.08) / 2", 0], with: {w: "=wt * 1.08", d: "=dt * 1.08", z0: "=hb - 0.05", z1: "=hb + 0.3", mat: cc-trim}}
      - {use: oval, name: r2, at: [0, "=(d - dt * 0.74) / 2", 0], with: {w: "=wt * 0.74", d: "=dt * 0.74", z0: "=hb + 0.3", z1: "=hb + 0.68"}}
      - {use: oval, name: r3, at: [0, "=(d - dt * 0.48) / 2", 0], with: {w: "=wt * 0.48", d: "=dt * 0.48", z0: "=hb + 0.68", z1: "=hb + 1.02", mat: cc-glass}}
  - when: "=cap == 'spire'"
    parts:
      - {use: oval, name: lip, at: [0, "=(d - dt * 1.08) / 2", 0], with: {w: "=wt * 1.08", d: "=dt * 1.08", z0: "=hb - 0.05", z1: "=hb + 0.22", mat: cc-trim}}
      - {use: oval, name: spire, at: [0, "=(d - dt) / 2", 0], with: {w: "=wt", d: "=dt", z0: "=hb + 0.22", z1: "=hb + 0.22 + rise", top: 0.12, mat: cc-wall}}
  - when: "=cap == 'mast'"
    parts:
      - {use: oval, name: lip, at: [0, "=(d - dt * 1.08) / 2", 0], with: {w: "=wt * 1.08", d: "=dt * 1.08", z0: "=hb - 0.05", z1: "=hb + 0.25", mat: cc-trim}}
      - {name: mast, mat: metal, box: {c: ["=wt * 0.2 * side", "=d / 2", "=hb + 0.65"], half: [0.13, 0.13, 0.42]}}
      - {name: dish, mat: cc-trim, ellipsoid: {c: ["=-wt * 0.18 * side", "=d / 2", "=hb + 0.4"], r: [0.36, 0.3, 0.16]}}
  # wings, pylon or ribs
  - when: "=wings == 'both'"
    parts:
      - pick:
          - set: {ww: "=(w_max - w) / 2 + 0.4", wd: "=d * 0.78"}
            parts:
              - {use: oval, name: wing-w, at: ["=-(w / 2 + ww / 2 - 0.4)", "=(d - wd) / 2 + 0.12", 0], with: {w: "=ww", d: "=wd", z0: 0, z1: "=wh"}}
              - {use: oval, name: wing-e, at: ["=(w / 2 + ww / 2 - 0.4)", "=(d - wd) / 2 + 0.12", 0], with: {w: "=ww", d: "=wd", z0: 0, z1: "=wh"}}
              - {use: oval, name: wlid-w, at: ["=-(w / 2 + ww / 2 - 0.4)", "=(d - wd) / 2 + 0.06", 0], with: {w: "=ww + 0.12", d: "=wd + 0.12", z0: "=wh - 0.04", z1: "=wh + 0.18", mat: cc-trim}}
              - {use: oval, name: wlid-e, at: ["=(w / 2 + ww / 2 - 0.4)", "=(d - wd) / 2 + 0.06", 0], with: {w: "=ww + 0.12", d: "=wd + 0.12", z0: "=wh - 0.04", z1: "=wh + 0.18", mat: cc-trim}}
              - {use: window-band, name: wband-w, at: ["=-(w / 2 + ww / 2 - 0.4)", "=(d - wd) / 2 + 0.12", 0], with: {w: "=ww", d: "=wd", z0: "=wh - 0.55", z1: "=wh - 0.25"}}
              - {use: window-band, name: wband-e, at: ["=(w / 2 + ww / 2 - 0.4)", "=(d - wd) / 2 + 0.12", 0], with: {w: "=ww", d: "=wd", z0: "=wh - 0.55", z1: "=wh - 0.25"}}
  - when: "=wings == 'one'"
    parts:
      - pick:
          - set: {ww: "=w_max / 2 - w / 2 + 0.3", wd: "=d * 0.85", wx: "=side * (w_max / 2 - (w_max / 2 - w / 2 + 0.3) / 2)"}
            parts:
              - {use: oval, name: wing, at: ["=wx", "=(d - wd) / 2 + 0.1", 0], with: {w: "=ww", d: "=wd", z0: 0, z1: "=wh * 1.2"}}
              - {use: saucer, name: wcap, at: ["=wx", "=(d - wd) / 2 + 0.1", 0], with: {w: "=ww", d: "=wd", wc: "=ww + 0.2", dc: "=wd + 0.2", z: "=wh * 1.2", t0: 0.18, t1: 0.16}}
              - {use: window-band, name: wband, at: ["=wx", "=(d - wd) / 2 + 0.1", 0], with: {w: "=ww", d: "=wd", z0: "=wh * 1.2 - 0.6", z1: "=wh * 1.2 - 0.28"}}
  - when: "=wings == 'pylon'"                        # a slim lift shaft beside the tower, its own cap above
    parts:
      - pick:
          - set: {pw: 0.95, pd: 0.85, px: "=side * (w / 2 + 0.35)", ph: "=Hc - 0.4 - 0.85 - 0.5"}
            parts:
              - {use: oval, name: pylon, at: ["=px", 0.25, 0], with: {w: "=pw", d: "=pd", z0: 0, z1: "=ph"}}
              - {use: oval, name: pcap, at: ["=px", 0.19, 0], with: {w: "=pw + 0.12", d: "=pd + 0.12", z0: "=ph", z1: "=ph + 0.2", mat: cc-trim}}
              - {use: cupola, name: plight, at: ["=px", "=0.25 + pd / 2", "=ph + 0.18"], with: {rx: 0.3, ry: 0.26, rz: 0.28}}
              - {name: pslot, mat: cc-glass, box: {c: ["=px", 0.18, "=ph * 0.55"], half: [0.14, 0.06, "=ph * 0.32"], radius: 0.04}}
  - when: "=wings == 'ribs'"
    parts:
      - {use: rib, name: rib-w, at: ["=-w * 0.36", "=d * 0.5 * 0.2", 0], with: {h: "=hb * 0.85", t: 0.3, l: 0.32, peak: 0.45}}
      - {use: rib, name: rib-e, at: ["=w * 0.36", "=d * 0.5 * 0.2", 0], with: {h: "=hb * 0.85", t: 0.3, l: 0.32, peak: 0.45}}
  # base ring and door
  - when: "=base"
    parts:
      - {use: oval, name: base, at: [0, -0.16, 0], with: {w: "=min(w_max - 0.1, w + 0.5)", d: "=d + 0.32", z0: 0, z1: 0.3, mat: cc-trim}}
  - when: "=door == 'porch'"
    parts:
      - {use: oval, name: porch, at: ["=door_x or 0", -0.45, 0], with: {w: 1.5, d: 1.0, z0: 0, z1: 1.3, mat: cc-wall}}
      - {use: oval, name: porch-lid, at: ["=door_x or 0", -0.5, 0], with: {w: 1.62, d: 1.1, z0: 1.3, z1: 1.48, mat: cc-trim}}
      - {use: door-cc, name: door, at: ["=door_x or 0", -0.45, 0], with: {w: 0.85, h: 0.95}}
  - when: "=door == 'canopy'"
    parts:
      - {use: door-cc, name: door, at: ["=door_x or 0", "=-0.16 if base else 0", 0], with: {w: 0.9, h: 1.0}}
      - {use: canopy, name: canopy, at: ["=door_x or 0", "=-0.16 if base else 0", 0], with: {w: 1.6, d: 0.45, z: 1.2}}
  - when: "=door == 'plain'"
    parts:
      - {use: door-cc, name: door, at: ["=door_x or 0", "=-0.16 if base else 0", 0], with: {w: 0.9, h: 1.05}}
