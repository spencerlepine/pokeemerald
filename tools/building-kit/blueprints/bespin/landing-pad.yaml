# A Cloud City landing platform (The Empire Strikes Back: the Falcon's pad, the cloud-car bays): a
# round or eight-sided deck on a tapered pylon over the clouds, a landing ring painted in, a ramp up at
# the front, and a cloud car or two parked on it, or cargo.
name: landing-pad
style: bespin
about: Round or octagonal deck on a pylon, landing ring, front ramp; one or two cloud cars, or crates.
width: [5, 6]
choose:
  Hc: "=H if H else 5"
  zt: [0.42, 0.55]
  R: "=min(w_max / 2 - 0.05, (Hc - 0.35 - zt - 0.15) / 2)"
  shape: {pick: [round, oct], weights: [3, 2]}
  load: {pick: [one, two, cargo], weights: [3, 2, 1]}
  side: {pick: [-1, 1]}
  rx: "=door_x if door_x is not None else 0"
parts:
  - {name: pylon, mat: cc-trim, cylinder: {a: [0, "=R + 0.2", 0], b: [0, "=R + 0.2", "=zt"], r1: "=R * 0.45", r2: "=R * 0.7"}}
  - when: "=shape == 'round'"
    parts:
      - {name: deck, mat: cc-deck, cylinder: {a: [0, "=R + 0.15", "=zt - 0.18"], b: [0, "=R + 0.15", "=zt"], r1: "=R"}}
      - {name: ring, mat: cc-glass, cylinder: {a: [0, "=R + 0.15", "=zt - 0.05"], b: [0, "=R + 0.15", "=zt + 0.015"], r1: "=R * 0.62"}}
      - {name: pad, mat: cc-deck, cylinder: {a: [0, "=R + 0.15", "=zt - 0.04"], b: [0, "=R + 0.15", "=zt + 0.02"], r1: "=R * 0.48"}}
    else:
      - name: deck
        mat: cc-deck
        prism: {poly: [["=-R * 0.41", 0.15], ["=R * 0.41", 0.15], ["=R", "=R * 0.59 + 0.15"], ["=R", "=R * 1.41 + 0.15"], ["=R * 0.41", "=2 * R + 0.15"],
                       ["=-R * 0.41", "=2 * R + 0.15"], ["=-R", "=R * 1.41 + 0.15"], ["=-R", "=R * 0.59 + 0.15"]], z: ["=zt - 0.2", "=zt"], round: 0.03}
      - name: ring
        mat: cc-glass
        prism: {poly: [["=-R * 0.26", "=R * 0.37 + 0.15"], ["=R * 0.26", "=R * 0.37 + 0.15"], ["=R * 0.63", "=R * 0.74 + 0.15"], ["=R * 0.63", "=R * 1.26 + 0.15"],
                       ["=R * 0.26", "=R * 1.63 + 0.15"], ["=-R * 0.26", "=R * 1.63 + 0.15"], ["=-R * 0.63", "=R * 1.26 + 0.15"], ["=-R * 0.63", "=R * 0.74 + 0.15"]],
                z: ["=zt - 0.05", "=zt + 0.015"]}
      - {name: pad, mat: cc-deck, cylinder: {a: [0, "=R + 0.15", "=zt - 0.04"], b: [0, "=R + 0.15", "=zt + 0.02"], r1: "=R * 0.5"}}
  # the ramp up at the front (the way on: named door)
  - name: door
    at: ["=rx", 0, 0]
    mat: cc-trim
    extrude: {axis: x, profile: [[-0.55, 0], [0.4, 0], [0.4, "=zt"], [0.15, "=zt"]], span: [-0.48, 0.48], round: 0.03}
  - when: "=load == 'one'"
    parts:
      - {use: cloud-car, name: car, at: ["=side * R * 0.12", "=R + 0.3", "=zt - 0.05"], with: {s: "=min(1.15, R * 0.55)"}}
  - when: "=load == 'two'"
    parts:
      - {use: cloud-car, name: car1, at: ["=-R * 0.45", "=R + 0.45", "=zt - 0.05"], with: {s: "=R * 0.38"}}
      - {use: cloud-car, name: car2, at: ["=R * 0.45", "=R + 0.2", "=zt - 0.05"], with: {s: "=R * 0.38"}}
  - when: "=load == 'cargo'"
    parts:
      - {use: crate, name: c1, at: ["=side * R * 0.35", "=R + 0.4", "=zt"], with: {s: 0.6, mat: cc-trim}}
      - {use: crate, name: c2, at: ["=side * R * 0.35 - side * 0.65", "=R + 0.6", "=zt"], with: {s: 0.5, mat: works}}
      - {use: tank-lying, name: fuel, at: ["=-side * R * 0.3", "=R + 0.9", "=zt"], with: {l: 1.3, r: 0.32}}
  - chance: 0.6                                   # beacon posts at the rim
    parts:
      - {name: beacon-w, mat: cc-glass, cylinder: {a: ["=-R * 0.8", "=R * 1.6", "=zt"], b: ["=-R * 0.8", "=R * 1.6", "=zt + 0.45"], r1: 0.14}}
      - {name: beacon-e, mat: cc-glass, cylinder: {a: ["=R * 0.8", "=R * 1.6", "=zt"], b: ["=R * 0.8", "=R * 1.6", "=zt + 0.45"], r1: 0.14}}
