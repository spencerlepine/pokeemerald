# The Felucian farm domes (The Clone Wars, "Bounty Hunters"): squat grown domes with a dark band at the
# foot, a round porch-dome in front, a second dome on some, and a Republic stilt tank beside. `mode`
# makes it a home, a ranger hut (an antenna mast), a bacta dome (a dark glass band, a landing light) or
# a depot (a slab door, crates and the tank).
name: pod-dome
style: felucia
about: Squat grown domes with a porch dome and round door; second dome, stilt tank, mast, glass band, crates.
width: [4, 5, 6]
choose:
  B: "=(H if H else 4) - 0.35"
  mode: {pick: [home, ranger], weights: [3, 1]}
  dxx: "=door_x if door_x is not None else 0"
  ry: [0.65, 0.78]
  hk: [0.75, 0.95]
  extra: {pick: [none, dome2, tank], weights: [1, 2, 2]}
  side: {pick: [-1, 1]}
  R: "=min(1.6, (B - 0.35) / (ry * 2 * 0.95 + hk * 0.95), (w_max / 2 - abs(dxx) * 0.4) * (0.62 if extra != 'none' else 0.92))"
  hx: "=dxx * 0.4 - side * (0.45 if extra != 'none' else 0) * (W > 4)"
  cy: "=0.35 + R * ry"
  pr: 0.64                                    # porch dome radius
  ex: "=max(-w_max / 2 + 0.5, min(w_max / 2 - 0.5, hx + side * (R + 0.45)))"
parts:
  - {use: grown-dome, name: dome, at: ["=hx", 0, 0], with: {r: "=R", ry: "=ry", hk: "=hk", cy: "=cy"}}
  - when: "=mode == 'bacta'"
    parts:
      - {name: glass, mat: gill, cylinder: {a: ["=hx", "=cy", "=R * hk * 0.38"], b: ["=hx", "=cy", "=R * hk * 0.6"], r1: "=R * 0.95"}, squash: {scale: [1, "=ry", 1], center: ["=hx", "=cy", 0]}}
      - {name: beacon, mat: light, cylinder: {a: ["=hx", "=cy", "=R * hk - 0.1"], b: ["=hx", "=cy", "=R * hk + 0.3"], r1: 0.2, r2: 0.16}}
      - {name: beacon-cap, mat: trim, cylinder: {a: ["=hx", "=cy", "=R * hk + 0.3"], b: ["=hx", "=cy", "=R * hk + 0.38"], r1: 0.26}}
  - when: "=mode == 'ranger'"
    parts:
      - {name: mast, mat: metal, cylinder: {a: ["=hx - side * R * 0.35", "=cy", "=R * hk * 0.8"], b: ["=hx - side * R * 0.35", "=cy", "=R * hk + 0.6"], r1: 0.09}}
      - {name: dish, mat: light, cylinder: {a: ["=hx - side * R * 0.35", "=cy - 0.05", "=R * hk + 0.45"], b: ["=hx - side * R * 0.35", "=cy - 0.15", "=R * hk + 0.6"], r1: 0.25, r2: 0.18}}
  - when: "=extra == 'dome2'"
    parts:
      - {use: grown-dome, name: dome2, at: ["=ex", 0, 0], with: {r: "=min(0.9, R * 0.6)", ry: "=ry", hk: "=hk", cy: "=cy + 0.1"}}
  - when: "=extra == 'tank' or mode == 'depot'"
    parts:
      - {use: stilt-tank, name: tank, at: ["=max(-w_max / 2 + 0.6, min(w_max / 2 - 0.6, hx + side * (R + 0.2)))", "=cy - 0.1", 0], with: {r: 0.42, h: 0.55, z: "=max(0.35, min(1.3, B - cy - 0.75 - 0.85))"}}
  # the way in
  - {use: grown-dome, name: porch, at: ["=dxx", 0, 0], with: {r: "=pr", ry: 0.7, hk: 1.05, cy: "=pr * 0.55", band: false}}
  - when: "=mode == 'depot'"
    parts:
      - {use: door-slab, name: door, at: ["=dxx", 0, 0], with: {w: 0.85, h: 0.72, door: gill, trim: stalk}}
      - {use: crate, name: crate, at: ["=dxx + (1.0 if side < 0 else -1.0)", 0.0, 0], with: {s: 0.5}}
    else:
      - {use: pod-door, name: door, at: ["=dxx", 0, 0], with: {w: 0.72, h: 0.78}}
