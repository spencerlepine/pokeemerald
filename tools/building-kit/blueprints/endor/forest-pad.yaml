# A landing clearing in the Endor forest (Return of the Jedi): a flat duracrete pad or a cleared ring
# of logs, landing lights at its corners, cargo, and on the larger clearings a parked Lambda shuttle
# with its wings folded up, its ramp down at the entry.
name: forest-pad
style: endor
about: Octagon pad or log-ringed clearing, landing lights, cargo; a parked Lambda shuttle on wide lots.
width: [4, 5, 6, 8]
choose:
  lim: "=(H if H else 4) - 0.3"
  kind: {pick: [slab, logs], weights: [3, 2]}
  pw: "=w_max - 0.1"
  pd: "=min(lim * 0.7, 2.6)"
  ship: "=W >= 6"
  dx: "=door_x if door_x is not None else 0"
  side: "=1 if (seed % 2) else -1"
  cargo: {pick: [crates, baskets, none], weights: [3, 2, 1]}
  ss: "=min(1.0, (lim - pd * 0.55 - 0.1) / 2.2)"
parts:
  - when: "=kind == 'slab'"
    parts:
      - name: pad
        mat: concrete
        prism: {poly: [["=-pw / 2 + 0.4", 0.1], ["=pw / 2 - 0.4", 0.1], ["=pw / 2", 0.5], ["=pw / 2", "=pd - 0.4"], ["=pw / 2 - 0.4", "=pd"],
                       ["=-pw / 2 + 0.4", "=pd"], ["=-pw / 2", "=pd - 0.4"], ["=-pw / 2", 0.5]], z: [0, 0.12], round: 0.02}
      - name: mark
        mat: mid
        prism: {poly: [["=-pw / 2 + 0.75", 0.45], ["=pw / 2 - 0.75", 0.45], ["=pw / 2 - 0.75", "=pd - 0.35"], ["=-pw / 2 + 0.75", "=pd - 0.35"]], z: [0.1, 0.14], round: 0.01}
    else:
      - {name: ground, mat: sod, cylinder: {a: [0, "=pd / 2", 0], b: [0, "=pd / 2", 0.06], r1: "=pw / 2"}, squash: {scale: [1, "=pd / pw", 1], center: [0, "=pd / 2", 0]}}
      - repeat: 4
        parts:
          - name: "=f'log{i}'"
            mat: log
            cylinder: {a: ["=(-1 if i % 2 else 1) * (pw / 2 - 0.25)", "=0.25 if i < 2 else pd - 0.3", 0.16],
                       b: ["=(-1 if i % 2 else 1) * (pw / 2 - 1.15)", "=0.15 if i < 2 else pd - 0.2", 0.16], r1: 0.16}
  - {use: pad-light, name: light-w, at: ["=-pw / 2 + 0.25", 0.25, 0]}
  - {use: pad-light, name: light-e, at: ["=pw / 2 - 0.25", 0.25, 0]}
  - when: "=not ship"
    parts:
      - {use: pad-light, name: light-nw, at: ["=-pw / 2 + 0.3", "=pd - 0.3", 0]}
      - {use: pad-light, name: light-ne, at: ["=pw / 2 - 0.3", "=pd - 0.3", 0]}
      - {name: beacon, mat: metal, cylinder: {a: ["=-side * (pw / 2 - 0.7)", "=pd - 0.45", 0], b: ["=-side * (pw / 2 - 0.7)", "=pd - 0.45", "=min(1.4, lim - pd)"], r1: 0.12, r2: 0.09}}
      - {name: beacon-lamp, mat: light, box: {c: ["=-side * (pw / 2 - 0.7)", "=pd - 0.45", "=min(1.4, lim - pd) + 0.1"], half: [0.2, 0.14, 0.14], radius: 0.03}}
  - when: "=ship"
    parts:
      - {use: lambda, name: shuttle, at: ["=dx * 0.5", "=pd * 0.55", 0.08], with: {l: "=min(4.0, pw * 0.6)", s: "=ss"}}
      - name: door
        mat: steel
        hull: {points: [["=dx - 0.45", 0.1, 0.02], ["=dx + 0.45", 0.1, 0.02], ["=dx - 0.45", "=pd * 0.55 - 0.5 * ss", 0.02], ["=dx + 0.45", "=pd * 0.55 - 0.5 * ss", 0.02],
                        ["=dx - 0.45", "=pd * 0.55 - 0.5 * ss", "=0.42 * ss"], ["=dx + 0.45", "=pd * 0.55 - 0.5 * ss", "=0.42 * ss"]], round: 0.02}
    else:
      - {name: door, at: ["=dx", 0, 0], mat: mid, box: {c: ["=dx", 0.1, 0.05], half: [0.45, 0.12, 0.05]}}
  - when: "=cargo == 'crates'"
    parts:
      - {use: crate, name: c1, at: ["=side * (pw / 2 - 0.85)", "=pd - 0.7", 0.1], with: {s: 0.5, mat: steel}}
      - {use: crate, name: c2, at: ["=side * (pw / 2 - 1.3)", "=pd - 0.6", 0.1], with: {s: 0.4, mat: metal}}
  - when: "=cargo == 'baskets'"
    parts:
      - {use: basket, name: b1, at: ["=side * (pw / 2 - 0.8)", "=pd - 0.6", 0.05], with: {r: 0.22, h: 0.32}}
      - {use: basket, name: b2, at: ["=side * (pw / 2 - 1.25)", "=pd - 0.5", 0.05], with: {r: 0.2, h: 0.28}}
