# An Ewok lookout (Return of the Jedi: the sentries who blow the horn): a small thatched hut high on
# tall log stilts above the ferns, a slanted log ladder-ramp up to it, a horn or a torch at the top.
name: ewok-lookout
style: endor
about: Small thatch hut high on tall log stilts, a slanted log climb, a horn or torch.
width: [3]
choose:
  lim: "=(H if H else 5) - 0.3"
  z0: ["=min(1.3, lim - 2.6)", "=min(1.7, lim - 2.4)"]
  r: [0.55, 0.65]
  ry: 0.8
  wh: [0.45, 0.55]
  cy: "=(r + 0.15) * ry + 0.05"
  roof: {pick: [cone, bulb], weights: [3, 1]}
  rise: "=max(0.45, min(0.9, lim - cy - z0 - wh - 0.25))"
  side: "=1 if (seed % 2) else -1"
  dx: "=door_x if door_x is not None else 0"
parts:
  - {use: ewok-deck, name: deck, at: [0, "=cy", 0], with: {r: "=r + 0.25", ry: "=ry", z: "=z0", t: 0.18, post: 0.14}}
  - {name: brace, mat: log, hull: {points: [["=-r * 0.6", "=cy - (r + 0.25) * ry * 0.55", 0.2], ["=-r * 0.6 + 0.1", "=cy - (r + 0.25) * ry * 0.55", 0.2],
                                            ["=r * 0.6", "=cy - (r + 0.25) * ry * 0.55", "=z0 - 0.25"], ["=r * 0.6 - 0.1", "=cy - (r + 0.25) * ry * 0.55", "=z0 - 0.25"],
                                            ["=-r * 0.6", "=cy - (r + 0.25) * ry * 0.55 + 0.1", 0.2], ["=r * 0.6", "=cy - (r + 0.25) * ry * 0.55 + 0.1", "=z0 - 0.25"]], round: 0.02}}
  - {use: ewok-drum, name: drum, at: [0, "=cy", "=z0"], with: {r: "=r", ry: "=ry", h: "=wh"}}
  - when: "=roof == 'cone'"
    parts:
      - {use: thatch-cone, name: roof, at: [0, "=cy", 0], with: {r: "=r + 0.12", ry: "=ry", z: "=z0 + wh - 0.05", rise: "=rise", knot: 0.22}}
    else:
      - {use: thatch-bulb, name: roof, at: [0, "=cy", 0], with: {r: "=r + 0.12", ry: "=ry", z: "=z0 + wh - 0.08", rise: "=rise"}}
  - {use: ewok-door, name: door, at: ["=dx", "=cy - r * ry", "=z0"], with: {w: 0.42, h: "=wh * 0.75"}}
  - name: climb                                        # a slanted log from the ground up to the deck
    mat: wood
    hull: {points: [["=side * 0.95", -0.1, 0], ["=side * 0.95 - side * 0.28", -0.1, 0], ["=side * 0.95", 0.05, 0],
                    ["=side * 0.35", "=cy - r * ry", "=z0"], ["=side * 0.35 - side * 0.28", "=cy - r * ry", "=z0"], ["=side * 0.35", "=cy - r * ry + 0.15", "=z0"]], round: 0.03}
  - chance: 0.6
    parts:
      - {name: horn, mat: hide, cylinder: {a: ["=-side * (r + 0.05)", "=cy - 0.2", "=z0 + 0.05"], b: ["=-side * (r + 0.32)", "=cy - 0.2", "=z0 + 0.4"], r1: 0.08, r2: 0.16}}
