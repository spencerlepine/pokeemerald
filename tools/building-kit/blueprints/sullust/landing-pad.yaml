# A Sullustan landing zone: a round, eight-sided or square pad of stone and durasteel with a ring
# marking, a small control booth (dome or blast-door slab) where the path comes in, landing lights,
# sometimes a fuel tank.
name: landing-pad
style: sullust
about: Round, octagonal or square pad with a ring mark; dome or slab booth at the door; lights; fuel tank.
width: [5, 6, 7]
choose:
  Hb: "=H if H else 3"
  shape: {pick: [round, octagon, square], weights: [3, 2, 2]}
  ex: "=door_x if door_x is not None else -(w_max / 2 - 0.8)"
  pr: "=w_max / 2 - 0.05"
  pd: "=min(Hb - 0.8, 2.3)"
  booth: {pick: [dome, slab], weights: [1, 1]}
  tank: {pick: [true, false]}
parts:
  - when: "=shape == 'round'"
    parts:
      - {name: pad, mat: stone, cylinder: {a: [0, "=pd / 2 + 0.05", 0], b: [0, "=pd / 2 + 0.05", 0.18], r1: "=pr"}, squash: {scale: [1, "=pd / 2 / pr", 1], center: [0, "=pd / 2 + 0.05", 0]}}
  - when: "=shape == 'octagon'"
    parts:
      - {name: pad, mat: stone, prism: {poly: [["=-pr * 0.42", 0.05], ["=pr * 0.42", 0.05], ["=pr", "=pd * 0.3"], ["=pr", "=pd * 0.75"], ["=pr * 0.42", "=pd + 0.05"], ["=-pr * 0.42", "=pd + 0.05"], ["=-pr", "=pd * 0.75"], ["=-pr", "=pd * 0.3"]], z: [0, 0.18], round: 0.03}}
  - when: "=shape == 'square'"
    parts:
      - {name: pad, mat: stone, box: {c: [0, "=pd / 2 + 0.05", 0.09], half: ["=pr", "=pd / 2", 0.09], radius: 0.05}}
  - {name: mark, mat: dark, cylinder: {a: [0.3, "=pd / 2 + 0.1", 0.17], b: [0.3, "=pd / 2 + 0.1", 0.2], r1: "=pd * 0.42"}, squash: {scale: [1.6, 1, 1], center: [0.3, "=pd / 2 + 0.1", 0]}}
  - {name: mark-in, mat: stone, cylinder: {a: [0.3, "=pd / 2 + 0.1", 0.18], b: [0.3, "=pd / 2 + 0.1", 0.21], r1: "=pd * 0.28"}, squash: {scale: [1.6, 1, 1], center: [0.3, "=pd / 2 + 0.1", 0]}}
  - when: "=booth == 'dome'"
    parts:
      - {use: shell, name: booth, at: ["=ex", 0.55, 0], with: {r: 0.62, ry: 0.85, hk: 0.95}}
      - {use: hatch, name: door, at: ["=ex", 0.12, 0], with: {r: 0.3, frame: 0.08, zc: 0.3}}
    else:
      - {use: slab, name: booth, at: ["=ex", 0, 0], with: {w: 1.1, d: 0.9, h: 0.95, lean: 0.12, rnd: 0.08}}
      - {use: door-slab, name: door, at: ["=ex", 0, 0], with: {w: 0.7, h: 0.7}}
  - {name: light-w, mat: light, cylinder: {a: ["=-pr + 0.25", 0.25, 0], b: ["=-pr + 0.25", 0.25, 0.45], r1: 0.12}}
  - {name: light-e, mat: light, cylinder: {a: ["=pr - 0.25", 0.25, 0], b: ["=pr - 0.25", 0.25, 0.45], r1: 0.12}}
  - when: "=tank"
    parts:
      - {name: tank, mat: metal, cylinder: {a: ["=-ex / abs(ex) * (pr - 0.45) if ex else pr - 0.45", "=pd * 0.5", 0.15], b: ["=-ex / abs(ex) * (pr - 0.45) if ex else pr - 0.45", "=pd * 0.5", 0.6], r1: 0.32}}
