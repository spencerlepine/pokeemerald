# A Sullustan public dome (the SoroSuub civic domes of Sullust's cities, Battlefront): a wide stone dome
# on a low drum with a ring band, a deep flat-roofed entry block with a blast door or a round hatch,
# and either side vaults, portholes or a glass skylight. Bacta Centers, depots, halls.
name: civic-dome
style: sullust
about: Wide dome on a drum with a ring band; deep entry block; side vaults, portholes, skylight or stack.
width: [4, 5, 6]
choose:
  Hb: "=H if H else 4"
  R: ["=w_max * 0.3", "=w_max * 0.36"]
  ry: [0.6, 0.72]
  hk: [0.5, 0.68]
  hd: [0.3, 0.55]
  ed: [0.75, 1.0]
  cy: "=ed + R * ry * 0.7"
  ex: "=door_x if door_x is not None else 0"
  ew: [1.3, 1.7]
  door: {pick: [slab, hatch, arch], weights: [3, 2, 2]}
  sides: {pick: [wings, portholes, none], weights: [3, 2, 1]}
  dmat: {pick: [steel, stone], weights: [3, 1]}
  eh: [0.8, 1.0]
  emat: {pick: [basalt, stone], weights: [3, 2]}
  top: {pick: [skylight, stack, cap, none], weights: [3, 2, 2, 1]}
parts:
  - {name: drum, mat: stone, cylinder: {a: [0, "=cy", 0], b: [0, "=cy", "=hd"], r1: "=R"}, squash: {scale: [1, "=ry", 1], center: [0, "=cy", 0]}}
  - {name: band, mat: trim, cylinder: {a: [0, "=cy", "=hd - 0.12"], b: [0, "=cy", "=hd + 0.04"], r1: "=R + 0.07"}, squash: {scale: [1, "=ry", 1], center: [0, "=cy", 0]}}
  - {use: shell, name: dome, at: [0, "=cy", "=hd"], with: {r: "=R * 0.97", ry: "=ry", hk: "=hk", mat: "=dmat"}}
  - {use: slab, name: entry, at: ["=ex", 0, 0], with: {w: "=ew", d: "=cy", h: "=eh", lean: 0.12, rnd: 0.08, mat: "=emat"}}
  - {name: entry-lip, mat: trim, box: {c: ["=ex", "=cy * 0.45", "=eh - 0.02"], half: ["=ew / 2 + 0.08", "=cy * 0.45 + 0.05", 0.08], radius: 0.03}}
  - when: "=door == 'slab'"
    parts:
      - {use: door-slab, name: door, at: ["=ex", 0, 0], with: {w: 0.9, h: "=eh * 0.72"}}
  - when: "=door == 'hatch'"
    parts:
      - {use: hatch, name: door, at: ["=ex", 0, 0], with: {r: 0.4, zc: 0.4}}
  - when: "=door == 'arch'"
    parts:
      - {use: door-arch, name: door, at: ["=ex", 0, 0], with: {w: 0.85, h: "=eh * 0.52"}}
  - when: "=sides == 'wings'"
    parts:
      - {use: slab, name: wing-w, at: ["=-(R * 0.62 + 0.3)", "=cy - R * ry * 0.85", 0], with: {w: "=R * 0.75", d: "=R * ry * 1.4", h: "=hd + 0.35", lean: 0.12, rnd: 0.08}}
      - {use: slab, name: wing-e, at: ["=R * 0.62 + 0.3", "=cy - R * ry * 0.85", 0], with: {w: "=R * 0.75", d: "=R * ry * 1.4", h: "=hd + 0.35", lean: 0.12, rnd: 0.08}}
      - {use: window-round, name: win-w, at: ["=-(R * 0.62 + 0.3)", "=cy - R * ry * 0.85 + 0.02", "=(hd + 0.35) * 0.55"], with: {r: 0.17}}
      - {use: window-round, name: win-e, at: ["=R * 0.62 + 0.3", "=cy - R * ry * 0.85 + 0.02", "=(hd + 0.35) * 0.55"], with: {r: 0.17}}
  - when: "=sides == 'portholes'"
    parts:
      - {use: window-round, name: win-w, at: ["=-(R * 0.68)", "=cy - R * ry * 0.72", "=hd * 0.55"], with: {r: 0.2}}
      - {use: window-round, name: win-e, at: ["=R * 0.68", "=cy - R * ry * 0.72", "=hd * 0.55"], with: {r: 0.2}}
  - when: "=top == 'skylight'"
    parts:
      - {use: glass-dome, name: sky, at: [0, "=cy + 0.1", "=hd + R * hk * 0.8"], with: {r: "=R * 0.32", ry: 0.8, hk: 0.7, band: 0.12}}
  - when: "=top == 'stack'"
    parts:
      - {use: stack, name: stack, at: ["=R * 0.4 * (1 if seed % 2 else -1)", "=cy + R * ry * 0.3", "=hd + R * hk * 0.75"], with: {r: 0.18, h: 0.55}}
  - when: "=top == 'cap'"
    parts:
      - {name: cap, mat: trim, cylinder: {a: [0, "=cy", "=hd + R * hk - 0.2"], b: [0, "=cy", "=hd + R * hk + 0.08"], r1: "=R * 0.3"}, squash: {scale: [1, "=ry", 1], center: [0, "=cy", 0]}}
