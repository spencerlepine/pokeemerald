# A Sullustan heat tower (the vent stacks of Sullust's geothermal works): a stone or SoroSuub base hut
# with one to three tall stacks, or a flared cooling tower, venting the volcano's heat.
name: vent-tower
style: sullust
about: Stone or slab base with 1-3 tall stacks, or a flared cooling tower; door in the base.
width: [3, 4]
choose:
  Hb: "=H if H else 5"
  form: {pick: [stacks, cooling], weights: [3, 2]}
  n: {int: [1, 3]}
  sh: "=min(Hb - 2.2, 3.0)"
  base: {pick: [slab, drum]}
  ex: "=door_x if door_x is not None else 0"
parts:
  - when: "=base == 'slab'"
    parts:
      - {use: slab, name: base, with: {w: "=w_max * 0.95", d: 1.2, h: 0.85, lean: 0.15}}
    else:
      - {name: base, mat: stone, cylinder: {a: [0, 0.7, 0], b: [0, 0.7, 0.8], r1: "=w_max * 0.47"}, squash: {scale: [1, 0.6, 1], center: [0, 0.7, 0]}}
  - {use: door-slab, name: door, at: ["=ex", 0.02, 0], with: {w: 0.75, h: 0.65}}
  - when: "=form == 'stacks'"
    parts:
      - repeat: "=n"
        parts:
          - {use: stack, name: "=f'stack{i}'", at: ["=(i - (n - 1) / 2) * min(0.85, w_max / n)", "=0.75 + (0.15 if i % 2 else 0)", 0.75], with: {r: "=0.3 - 0.04 * n", h: "=sh - 0.35 * (i % 2)"}}
    else:
      - {name: tower, mat: stone, cylinder: {a: [0, 0.75, 0.7], b: [0, 0.75, "=0.7 + sh * 0.7"], r1: "=min(0.8, w_max * 0.3)", r2: "=min(0.55, w_max * 0.2)"}}
      - {name: flare, mat: stone, cylinder: {a: [0, 0.75, "=0.7 + sh * 0.7"], b: [0, 0.75, "=0.7 + sh * 0.85"], r1: "=min(0.55, w_max * 0.2)", r2: "=min(0.68, w_max * 0.25)"}}
      - {name: band, mat: trim, cylinder: {a: [0, 0.75, "=0.7 + sh * 0.3"], b: [0, 0.75, "=0.7 + sh * 0.3 + 0.15"], r1: "=min(0.76, w_max * 0.29)"}}
