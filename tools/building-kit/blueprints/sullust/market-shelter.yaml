# A Sullustan market shelter: an open stall under a lens-shaped stone canopy, a sloped durasteel shed
# roof or a gable, on posts, with a counter and crates under it.
name: market-shelter
style: sullust
about: "Open stall under a lens, shed or gable canopy on posts; counter, crates, a barrel."
width: [3, 4, 5]
choose:
  Hb: "=H if H else 3"
  roof: {pick: [lens, shed, gable], weights: [2, 2, 2]}
  w: ["=w_max * 0.85", "=w_max * 0.98"]
  d: "=min(1.3, Hb - 1.5)"
  z: "=min(1.05, Hb - d - 0.45)"
  side: {pick: [-1, 1]}
parts:
  - repeat: 2
    parts:
      - {name: "=f'post{i}'", mat: metal, box: {c: ["=(i * 2 - 1) * (w / 2 - 0.2)", 0.2, "=z / 2"], half: [0.08, 0.08, "=z / 2"]}}
  - {name: back, mat: stone, box: {c: [0, "=d - 0.15", "=z * 0.45"], half: ["=w / 2 - 0.15", 0.12, "=z * 0.45"], radius: 0.04}}
  - when: "=roof == 'lens'"
    parts:
      - {name: canopy, mat: stone, ellipsoid: {c: [0, "=d / 2", "=z + 0.05"], r: ["=w / 2 + 0.1", "=d / 2 + 0.25", 0.22]}}
  - when: "=roof == 'shed'"
    parts:
      - {name: canopy, mat: steel, prism: {poly: [["=-w / 2 - 0.1", -0.15], ["=w / 2 + 0.1", -0.15], ["=w / 2 + 0.1", "=d + 0.1"], ["=-w / 2 - 0.1", "=d + 0.1"]], z: ["=z", "=z + 0.12"], round: 0.02}, rot: [0, 0, -8]}
  - when: "=roof == 'gable'"
    parts:
      - {use: gable-roof, name: canopy, at: [0, -0.05, 0], with: {w: "=w", d: "=d", z: "=z - 0.1", rise: 0.35, over: 0.1, mat: stone}}
  - {name: counter, mat: trim, box: {c: [0, 0.3, 0.3], half: ["=w * 0.32", 0.18, 0.3], radius: 0.04}}
  - {use: crate, name: crate, at: ["=side * (w / 2 - 0.15)", -0.2, 0], with: {s: 0.42}}
  - chance: 0.6
    parts:
      - {name: barrel, mat: metal, cylinder: {a: ["=-side * (w / 2 - 0.1)", -0.15, 0], b: ["=-side * (w / 2 - 0.1)", -0.15, 0.5], r1: 0.2}}
