# A NiJedha trading house (the Supply Depot and the city's stores): a tall square sandstone block with
# a deep cloth awning across the whole front on poles, crates and jars under it; a cargo hoist beam,
# a roof shade or a small dome on top.
name: trade-house
style: jedha
about: Tall square sandstone store, a deep cloth awning across the front, crates and jars; roof kiosk, shade or dome.
width: [4, 5]
choose:
  w: ["=w_max * 0.9", "=w_max"]
  d: ["=max(1.3, (H or 4) * 0.36)", "=max(1.4, (H or 4) * 0.42)"]
  h: [1.3, 1.6]
  top: {pick: [hoist, shade, dome, none], weights: [2, 2, 2, 1]}
  side: {pick: [-1, 1]}
  dx: "=door_x if door_x is not None else 0"
  aw: {pick: [full, split], weights: [3, 2]}
parts:
  - {use: stone-block, name: store, with: {w: "=w", d: "=d", h: "=h"}}
  - {use: cornice, name: store-c, with: {w: "=w", d: "=d", h: "=h", t: 0.16, b: 0.16}}
  - {use: door-slab, name: door, at: ["=dx", 0, 0], with: {w: 0.9, h: 0.75, door: dark}}
  - when: "=aw == 'full'"
    parts:
      - {use: awning, name: awning, with: {w: "=w - 0.1", out: 0.42, hi: "=h * 0.72", lo: "=h * 0.72 - 0.25"}}
    else:
      - {use: awning, name: awning, at: ["=dx", 0, 0], with: {w: 1.3, out: 0.4, hi: "=h * 0.72", lo: "=h * 0.72 - 0.22"}}
      - {use: win-deep, name: hatch, at: ["=-side * (w / 2 - 0.5)", 0, "=h * 0.72"], with: {w: 0.5, h: 0.4}}
  - {use: crate, name: crate, at: ["=side * (w / 2 - 0.4)", -0.05, 0], with: {s: 0.5}}
  - chance: 0.6
    parts:
      - {use: crate, name: crate2, at: ["=side * (w / 2 - 0.42)", -0.02, 0.5], with: {s: 0.36}}
  - {use: jar, name: jar, at: ["=-side * (w / 2 - 0.35)", -0.05, 0], with: {r: 0.24}}
  - when: "=top == 'hoist'"
    parts:
      - {use: stone-block, name: kiosk, at: ["=side * (w / 2 - 0.65)", "=d * 0.35", "=h"], with: {w: 0.95, d: "=d * 0.45", h: 0.5}}
      - {name: kiosk-door, mat: dark, box: {c: ["=side * (w / 2 - 0.65)", "=d * 0.35 - 0.04", "=h + 0.2"], half: [0.22, 0.05, 0.2]}}
  - when: "=top == 'shade'"
    parts:
      - {use: canopy, name: shade, at: ["=-side * w * 0.15", "=d * 0.2", "=h + 0.02"], with: {w: "=w * 0.5", d: "=d * 0.6", z: 0.45, sag: 0.08}}
  - when: "=top == 'dome'"
    parts:
      - {use: drum-dome, name: dome, at: ["=-side * w * 0.15", "=d * 0.55", "=h"], with: {r: "=min(0.55, d * 0.35)", ry: 0.8, dh: 0.15, hk: 0.75, finial: false}}
