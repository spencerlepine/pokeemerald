# A NiJedha domed hall (Rogue One; the Bacta Center and other public halls): a square sandstone hall
# under a big stone dome on a tall drum, with a columned portico, an arcade of three arches or a cloth
# awning across the front; on some, lower side wings or small corner domes.
name: domed-hall
style: jedha
about: Square sandstone hall under a big drum dome; portico, arcade or awning front; wings or corner domes.
width: [5, 6]
choose:
  w: ["=w_max * 0.86", "=w_max"]
  d: ["=max(1.4, (H or 4) * 0.4)", "=max(1.5, (H or 4) * 0.48)"]
  h: [1.1, 1.3]
  front: {pick: [portico, arcade, awning], weights: [3, 2, 2]}
  extra: {pick: [none, wings, kiosks], weights: [2, 2, 2]}
  core: "=w * 0.62 if extra == 'wings' else w"
  R: "=min(0.85, core * 0.24, d * 0.42)"
  dh: [0.3, 0.45]
  dx: "=door_x if door_x is not None else 0"
parts:
  - {use: stone-block, name: hall, with: {w: "=core", d: "=d", h: "=h"}}
  - {use: cornice, name: hall-c, with: {w: "=core", d: "=d", h: "=h", t: 0.2}}
  - {use: drum-dome, name: dome, at: [0, "=d * 0.52", "=h"], with: {r: "=R", ry: 0.75, dh: "=dh", hk: 0.7}}
  - when: "=extra == 'wings'"
    parts:
      - {use: stone-block, name: wing-w, at: ["=-(core / 2 + (w - core) / 4)", "=d * 0.15", 0], with: {w: "=(w - core) / 2 + 0.05", d: "=d * 0.75", h: "=h * 0.72"}}
      - {use: stone-block, name: wing-e, at: ["=(core / 2 + (w - core) / 4)", "=d * 0.15", 0], with: {w: "=(w - core) / 2 + 0.05", d: "=d * 0.75", h: "=h * 0.72"}}
      - {use: cornice, name: wing-w-c, at: ["=-(core / 2 + (w - core) / 4)", "=d * 0.15", 0], with: {w: "=(w - core) / 2 + 0.05", d: "=d * 0.75", h: "=h * 0.72", t: 0.12, b: 0.14}}
      - {use: cornice, name: wing-e-c, at: ["=(core / 2 + (w - core) / 4)", "=d * 0.15", 0], with: {w: "=(w - core) / 2 + 0.05", d: "=d * 0.75", h: "=h * 0.72", t: 0.12, b: 0.14}}
  - when: "=extra == 'kiosks'"
    parts:
      - {use: drum-dome, name: kiosk-w, at: ["=-(w / 2 - 0.42)", "=d * 0.3", "=h"], with: {r: 0.32, ry: 0.8, dh: 0.25, hk: 0.8, finial: false}}
      - {use: drum-dome, name: kiosk-e, at: ["=(w / 2 - 0.42)", "=d * 0.3", "=h"], with: {r: 0.32, ry: 0.8, dh: 0.25, hk: 0.8, finial: false}}
  - when: "=front == 'portico'"
    parts:
      - {name: pediment, mat: trim, box: {c: ["=dx", 0.0, "=h - 0.12"], half: [1.1, 0.2, 0.12], radius: 0.02}}
      - {use: column, name: col-w, at: ["=dx - 0.9", -0.02, 0], with: {r: 0.14, h: "=h - 0.22"}}
      - {use: column, name: col-e, at: ["=dx + 0.9", -0.02, 0], with: {r: 0.14, h: "=h - 0.22"}}
      - {use: portal, name: door, at: ["=dx", 0, 0], with: {w: 0.8, h: "=min(0.6, h - 0.62)", frame: 0.12}}
  - when: "=front == 'arcade'"
    parts:
      - {use: door-arch, name: door, at: ["=dx", 0, 0], with: {w: 0.85, h: "=h - 0.5"}}
      - {use: door-arch, name: arch-w, at: ["=dx - 1.1 if dx - 1.1 > -w / 2 + 0.5 else dx + 2.2", 0, 0], with: {w: 0.7, h: "=h - 0.55", door: mid}}
      - {use: door-arch, name: arch-e, at: ["=dx + 1.1 if dx + 1.1 < w / 2 - 0.5 else dx - 2.2", 0, 0], with: {w: 0.7, h: "=h - 0.55", door: mid}}
  - when: "=front == 'awning'"
    parts:
      - {use: portal, name: door, at: ["=dx", 0, 0], with: {w: 0.8, h: "=min(0.6, h - 0.62)"}}
      - {use: awning, name: awning, at: [0, 0, 0], with: {w: "=core - 0.3", out: 0.32, hi: "=h - 0.18", lo: "=h - 0.36"}}
      - {use: win-deep, name: win-w, at: ["=dx - 1.25", 0, "=h * 0.45"], with: {w: 0.45, h: 0.35}}
      - {use: win-deep, name: win-e, at: ["=dx + 1.25", 0, "=h * 0.45"], with: {w: 0.45, h: 0.35}}
