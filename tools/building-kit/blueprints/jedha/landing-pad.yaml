# A NiJedha pilgrim landing pad (Rogue One: the city's stone pads where pilgrim shuttles set down): a
# raised sandstone platform, round or eight-sided, a landing ring on top, a stair up at the front,
# lamp posts or banners at the corners, on some a small stone gatehouse with a cloth shade.
name: landing-pad
style: jedha
about: Raised sandstone platform, round or eight-sided, landing ring, front stair, lamps or banners, gatehouse.
width: [5, 6, 7]
choose:
  w: ["=w_max * 0.9", "=w_max"]
  D: "=min((H or 4) - 0.6, w * 0.62)"
  ph: [0.35, 0.5]
  shape: {pick: [oct, round], weights: [3, 2]}
  posts: {pick: [lamps, banners, none], weights: [3, 2, 1]}
  house: {pick: [true, false], weights: [2, 3]}
  side: {pick: [-1, 1]}
  dx: "=door_x if door_x is not None else 0"
  c: "=min(0.7, w * 0.15)"
parts:
  - when: "=shape == 'oct'"
    parts:
      - {name: deck, mat: stone, prism: {poly: [["=-w / 2 + c", 0.25], ["=w / 2 - c", 0.25], ["=w / 2", "=0.25 + c"], ["=w / 2", "=0.25 + D - c"], ["=w / 2 - c", "=0.25 + D"], ["=-w / 2 + c", "=0.25 + D"], ["=-w / 2", "=0.25 + D - c"], ["=-w / 2", "=0.25 + c"]], z: [0, "=ph"], round: 0.03}}
    else:
      - {name: deck, mat: stone, cylinder: {a: [0, "=0.25 + D / 2", 0], b: [0, "=0.25 + D / 2", "=ph"], r1: "=w / 2"}, squash: {scale: [1, "=D / w", 1], center: [0, "=0.25 + D / 2", 0]}}
  - {name: ring, mat: trim, cylinder: {a: [0, "=0.25 + D / 2", "=ph"], b: [0, "=0.25 + D / 2", "=ph + 0.03"], r1: "=min(w, D * 1.6) * 0.32"}, squash: {scale: [1, 0.62, 1], center: [0, "=0.25 + D / 2", 0]}}
  - {name: ring-in, mat: stone, cylinder: {a: [0, "=0.25 + D / 2", "=ph"], b: [0, "=0.25 + D / 2", "=ph + 0.05"], r1: "=min(w, D * 1.6) * 0.32 - 0.22"}, squash: {scale: [1, 0.62, 1], center: [0, "=0.25 + D / 2", 0]}}
  # the stair up: named door so the warp lands at its foot
  - {name: door, mat: trim, box: {c: ["=dx", 0.2, "=ph / 2 - 0.02"], half: [0.62, 0.2, "=ph / 2 - 0.02"], radius: 0.02}}
  - {name: step, mat: trim, box: {c: ["=dx", 0.02, "=ph / 4"], half: [0.62, 0.12, "=ph / 4"], radius: 0.02}}
  - when: "=posts == 'lamps'"
    parts:
      - repeat: 2
        parts:
          - {name: lamp, mat: metal, box: {c: ["=(dx - 0.85) if i == 0 else (dx + 0.85)", 0.35, "=ph + 0.3"], half: [0.07, 0.07, 0.3]}}
          - {name: lamp-head, mat: light, ellipsoid: {c: ["=(dx - 0.85) if i == 0 else (dx + 0.85)", 0.35, "=ph + 0.66"], r: [0.14, 0.14, 0.11]}}
  - when: "=posts == 'banners'"
    parts:
      - repeat: 2
        parts:
          - {name: mast, mat: metal, box: {c: ["=(-w / 2 + 0.6) if i == 0 else (w / 2 - 0.6)", 0.6, "=ph + 0.55"], half: [0.06, 0.06, 0.55]}}
          - {name: flag, mat: cloth, box: {c: ["=(-w / 2 + 0.6) if i == 0 else (w / 2 - 0.6)", 0.52, "=ph + 0.75"], half: [0.18, 0.03, 0.3]}}
  - when: "=house"
    parts:
      - {use: stone-block, name: gatehouse, at: ["=side * (w / 2 - 0.8)", "=0.25 + D - 1.0", "=ph"], with: {w: 1.1, d: 0.85, h: 0.75}}
      - {use: canopy, name: gate-shade, at: ["=side * (w / 2 - 0.8)", "=0.25 + D - 1.1", "=ph + 0.75"], with: {w: 1.0, d: 0.8, z: 0.3, sag: 0.06}}
      - {name: gate-hole, mat: dark, box: {c: ["=side * (w / 2 - 0.8)", "=0.25 + D - 1.04", "=ph + 0.28"], half: [0.22, 0.05, 0.28]}}
