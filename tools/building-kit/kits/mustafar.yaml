# Mustafar kit: the Techno Union / Klegger Corp mining works (Revenge of the Sith) and Imperial bunkers.
# What makes them Mustafar: dark battered metal masses with steep sloped faces, tall shield plates
# leaning against the heat, long bands of lit windows, needle spires, collector arms on lattice
# pylons, decks on legs over the lava. Lit windows are the light ramp (lava glow, colour later).
materials:
  iron:  {ramp: dark,  bands: [0.12, 0.42, 0.78]}   # the dark hull of the works
  plate: {ramp: mid,   bands: [0.2, 0.5, 0.85]}     # shield plates, decks
  glow:  {ramp: light, bands: [0.0, 0.04, 0.12]}     # lit windows
  rock:  {ramp: dark,  bands: [0.2, 0.55, 0.9]}     # obsidian outcrop under a building
templates:
  # A battered block: walls lean in by `batter`, the front leans back further by `front`.
  bastion:
    params: {w: 3.0, d: 2.0, h: 1.3, batter: 0.15, front: 0.3, mat: iron}
    preview: {}
    parts:
      - name: block
        mat: "=mat"
        prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=d"], ["=-w / 2", "=d"]], z: [0, "=h"],
                top: ["=(w - 2 * batter) / w", "=(d - batter - front) / d"], lean: [0, "=(front - batter) / 2"], round: 0.03}
  # A tall shield plate leaning back against the heat, standing on its foot at y = 0.
  shield:
    params: {w: 0.7, t: 0.22, h: 1.6, lean: 0.35, mat: plate}
    preview: {}
    parts:
      - name: plate
        mat: "=mat"
        prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=t"], ["=-w / 2", "=t"]], z: [0, "=h"], top: [0.8, 1.0], lean: [0, "=lean"], round: 0.03}
  # A band of lit windows on a south face: a dark frame with light panes between mullions.
  window-band:
    params: {w: 2.0, h: 0.3, n: 4, mat: glow}
    preview: {at: [0, 0, 0.8]}
    parts:
      - {name: frame, mat: dark, box: {c: [0, -0.03, 0], half: ["=w / 2 + 0.06", 0.06, "=h / 2 + 0.06"], radius: 0.02}}
      - {name: glass, mat: "=mat", box: {c: [0, -0.07, 0], half: ["=w / 2", 0.04, "=h / 2"]}}
  # A needle spire: a tall four-sided pyramid stump.
  spire:
    params: {r: 0.4, h: 2.0, top: 0.15, mat: iron}
    preview: {at: [0, 0.4, 0]}
    parts:
      - {name: spire, mat: "=mat", prism: {poly: [["=-r", "=-r"], ["=r", "=-r"], ["=r", "=r"], ["=-r", "=r"]], z: [0, "=h"], top: "=top", round: 0.03}}
  # A collector pylon: a tapered square tower with a heavy cap.
  pylon:
    params: {r: 0.35, h: 2.4, mat: iron}
    preview: {at: [0, 0.4, 0]}
    parts:
      - {name: shaft, mat: "=mat", prism: {poly: [["=-r", "=-r"], ["=r", "=-r"], ["=r", "=r"], ["=-r", "=r"]], z: [0, "=h"], top: 0.65, round: 0.03}}
      - {name: cap, mat: plate, box: {c: [0, 0, "=h + 0.12"], half: ["=r * 0.9", "=r * 0.9", 0.14], radius: 0.03}}
  # An obsidian outcrop a building stands on.
  outcrop:
    params: {w: 5.0, d: 2.4, h: 0.35, mat: rock}
    preview: {}
    parts:
      - name: rock
        mat: "=mat"
        hull: {points: [["=-w / 2", 0.15, 0], ["=w / 2", 0.05, 0], ["=w / 2 - 0.2", "=d", 0], ["=-w / 2 + 0.15", "=d", 0],
                        ["=-w / 2 + 0.15", 0.25, "=h"], ["=w / 2 - 0.15", 0.2, "=h"], ["=w / 2 - 0.3", "=d - 0.1", "=h"], ["=-w / 2 + 0.3", "=d - 0.1", "=h"]],
               round: 0.04}
