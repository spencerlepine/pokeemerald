# Common kit: doors, windows and roof pieces every style may use.
# Axes: x east, y north, z up, 1 m = 1 cell = 16 px. Facade pieces sit on a south wall whose foot is
# at y = 0; they stand a little south of it (y < 0), because only south faces show head-on.
# Keep pieces big: a door is about one cell wide, a window at least half a cell. No fine detail.
materials:
  wall:  {ramp: bone,  bands: [0.22, 0.55, 0.88]}
  roof:  {ramp: bone,  bands: [0.12, 0.42, 0.72]}
  trim:  {ramp: light, bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  metal: {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
templates:
  # An arched doorway: a dark opening with a round top, in a thick frame.
  door-arch:
    params: {w: 0.85, h: 0.8, frame: 0.12, door: dark, trim: trim}
    preview: {}
    parts:
      - {name: frame, mat: "=trim", box: {c: [0, -0.03, "=h / 2"], half: ["=w / 2 + frame", 0.07, "=h / 2"], radius: 0.03}}
      - {name: frame-top, mat: "=trim", cylinder: {a: [0, -0.1, "=h"], b: [0, 0.04, "=h"], r1: "=w / 2 + frame"}}
      - {name: hole, mat: "=door", box: {c: [0, -0.08, "=h / 2"], half: ["=w / 2", 0.05, "=h / 2"]}}
      - {name: hole-top, mat: "=door", cylinder: {a: [0, -0.13, "=h"], b: [0, -0.03, "=h"], r1: "=w / 2"}}
  # A square blast door with a heavy lintel (Mos Eisley, Imperial).
  door-slab:
    params: {w: 0.9, h: 1.05, frame: 0.12, door: metal, trim: trim}
    preview: {}
    parts:
      - {name: frame, mat: "=trim", box: {c: [0, -0.03, "=(h + frame) / 2"], half: ["=w / 2 + frame", 0.07, "=(h + frame) / 2"], radius: 0.02}}
      - {name: slab, mat: "=door", box: {c: [0, -0.08, "=h / 2"], half: ["=w / 2", 0.05, "=h / 2"]}}
  # A round window (porthole).
  window-round:
    params: {r: 0.22, frame: 0.07, glass: dark, trim: trim}
    preview: {at: [0, 0, 0.6]}
    parts:
      - {name: ring, mat: "=trim", cylinder: {a: [0, -0.07, 0], b: [0, 0.05, 0], r1: "=r + frame"}}
      - {name: glass, mat: "=glass", cylinder: {a: [0, -0.1, 0], b: [0, -0.02, 0], r1: "=r"}}
  # A wide slot window.
  window-slot:
    params: {w: 0.7, h: 0.25, frame: 0.06, glass: dark, trim: trim}
    preview: {at: [0, 0, 0.7]}
    parts:
      - {name: frame, mat: "=trim", box: {c: [0, -0.03, 0], half: ["=w / 2 + frame", 0.06, "=h / 2 + frame"], radius: 0.02}}
      - {name: glass, mat: "=glass", box: {c: [0, -0.07, 0], half: ["=w / 2", 0.04, "=h / 2"]}}
  # A short round vent stack with a cap, for roofs.
  vent:
    params: {r: 0.16, h: 0.45, mat: metal}
    preview: {}
    parts:
      - {name: pipe, mat: "=mat", cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=r"}}
      - {name: cap, mat: "=mat", cylinder: {a: [0, 0, "=h"], b: [0, 0, "=h + 0.1"], r1: "=r + 0.07"}}
  # A cargo crate.
  crate:
    params: {s: 0.55, mat: metal}
    preview: {}
    parts:
      - {name: box, mat: "=mat", box: {c: [0, 0, "=s / 2"], half: ["=s / 2", "=s / 2", "=s / 2"], radius: 0.03}}
  # A plain block with softened edges, its front at y = 0.
  box-block:
    params: {w: 2.0, d: 1.5, h: 1.2, rnd: 0.05, mat: wall}
    preview: {}
    parts:
      - {name: block, mat: "=mat", box: {c: [0, "=d / 2", "=h / 2"], half: ["=w / 2", "=d / 2", "=h / 2"], radius: "=rnd"}}
  # A hipped roof (four slopes) over a w x d plan at height z; `ridge` is how much of it stays flat on top.
  hip-roof:
    params: {w: 2.4, d: 1.8, z: 1.0, rise: 0.8, ridge: 0.3, over: 0.12, mat: roof}
    preview: {}
    parts:
      - name: roof
        mat: "=mat"
        prism: {poly: [["=-w / 2 - over", "=-over"], ["=w / 2 + over", "=-over"], ["=w / 2 + over", "=d + over"], ["=-w / 2 - over", "=d + over"]],
                z: ["=z", "=z + rise"], top: ["=max(ridge, 0.02)", 0.04], round: 0.03}
  # A gable roof, ridge east-west, over a w x d plan at height z.
  gable-roof:
    params: {w: 2.4, d: 1.8, z: 1.0, rise: 0.7, over: 0.12, mat: roof}
    preview: {}
    parts:
      - name: roof
        mat: "=mat"
        extrude: {axis: x, profile: [["=-over", "=z"], ["=d + over", "=z"], ["=d / 2", "=z + rise"]], span: ["=-w / 2 - over", "=w / 2 + over"], round: 0.03}
  # A cone roof (thatch, a Wookiee or Ewok hut) of radius r at height z.
  cone-roof:
    params: {r: 1.2, z: 1.0, rise: 1.0, mat: roof}
    preview: {at: [0, 1.2, 0]}
    parts:
      - {name: cone, mat: "=mat", cylinder: {a: [0, 0, "=z"], b: [0, 0, "=z + rise"], r1: "=r", r2: 0.04}}
  # Four posts under a w x d deck (stilts over water or a swamp).
  stilts:
    params: {w: 2.4, d: 1.6, h: 0.6, r: 0.1, mat: metal}
    preview: {}
    parts:
      - {name: sw, mat: "=mat", cylinder: {a: ["=-w / 2 + 0.25", 0.2, 0], b: ["=-w / 2 + 0.25", 0.2, "=h"], r1: "=r"}}
      - {name: se, mat: "=mat", cylinder: {a: ["=w / 2 - 0.25", 0.2, 0], b: ["=w / 2 - 0.25", 0.2, "=h"], r1: "=r"}}
      - {name: nw, mat: "=mat", cylinder: {a: ["=-w / 2 + 0.25", "=d - 0.2", 0], b: ["=-w / 2 + 0.25", "=d - 0.2", "=h"], r1: "=r"}}
      - {name: ne, mat: "=mat", cylinder: {a: ["=w / 2 - 0.25", "=d - 0.2", 0], b: ["=w / 2 - 0.25", "=d - 0.2", "=h"], r1: "=r"}}
  # A flat deck or platform slab, its front at y = 0, top at z.
  deck:
    params: {w: 3.0, d: 2.0, z: 0.6, t: 0.15, mat: metal}
    preview: {}
    parts:
      - {name: deck, mat: "=mat", box: {c: [0, "=d / 2", "=z - t / 2"], half: ["=w / 2", "=d / 2", "=t / 2"], radius: 0.02}}
  # A sign on a post (what tells the player an arena, a Bacta Center or a depot apart). One cell.
  sign:
    params: {w: 0.8, h: 0.5, post: 0.5, mat: trim, face: dark}
    preview: {}
    parts:
      - {name: post, mat: metal, box: {c: [0, 0.1, "=post / 2"], half: [0.06, 0.06, "=post / 2"]}}
      - {name: board, mat: "=mat", box: {c: [0, 0.05, "=post + h / 2"], half: ["=w / 2", 0.07, "=h / 2"], radius: 0.02}}
      - {name: face, mat: "=face", box: {c: [0, -0.03, "=post + h / 2"], half: ["=w / 2 - 0.08", 0.03, "=h / 2 - 0.08"]}}
