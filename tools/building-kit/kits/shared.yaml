# Shared kit: pieces every planet places in front of its public buildings.
templates:
  # A low sign board on two short posts, one cell wide, with a raised emblem on its face.
  sign-board:
    params: {w: 0.78, h: 0.42, z0: 0.12, mat: trim}
    preview: {}
    parts:
      - {name: post-w, mat: metal, box: {c: ["=-w / 2 + 0.1", 0.12, "=z0 / 2"], half: [0.05, 0.05, "=z0 / 2"]}}
      - {name: post-e, mat: metal, box: {c: ["=w / 2 - 0.1", 0.12, "=z0 / 2"], half: [0.05, 0.05, "=z0 / 2"]}}
      - {name: board, mat: "=mat", box: {c: [0, 0.08, "=z0 + h / 2"], half: ["=w / 2", 0.08, "=h / 2"], radius: 0.03}}
