# Tatooine kit: sand-adobe masses (Mos Eisley, Mos Espa, Anchorhead, the Lars homestead).
# What makes them Star Wars and not Earth: battered walls that lean in, rounded corners, low domes,
# barrel-vaulted entry blocks with keyhole arches, sloped buttresses, round vents, vaporators.
uses: ["../../world-art/models/scenery/kits/tatooine"]
templates:
  # A battered adobe block: walls lean in by `batter`, every edge softened by `rnd`.
  adobe-block:
    params: {w: 3.0, d: 2.0, h: 1.4, batter: 0.14, rnd: 0.08, mat: wall}
    preview: {}
    parts:
      - name: block
        mat: "=mat"
        prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=d"], ["=-w / 2", "=d"]], z: [0, "=h"],
                top: ["=(w - 2 * batter) / w", "=(d - 2 * batter) / d"], round: "=rnd"}
  # The thick roof band Mos Eisley blocks have: a slab a little proud of the wall top.
  roof-lip:
    params: {w: 3.0, d: 2.0, h: 1.4, batter: 0.14, t: 0.16, out: 0.06, mat: trim}
    preview: {}
    parts:
      - name: lip
        mat: "=mat"
        prism: {poly: [["=-w / 2 + batter - out", "=batter - out"], ["=w / 2 - batter + out", "=batter - out"],
                       ["=w / 2 - batter + out", "=d - batter + out"], ["=-w / 2 + batter - out", "=d - batter + out"]],
                z: ["=h - t", "=h + 0.04"], round: 0.04}
  # A low dome. Plan radius r east-west, r * ry north-south, height r * hk.
  dome:
    params: {r: 1.0, ry: 0.8, hk: 0.7, mat: roof}
    preview: {at: [0, 0.8, 0]}
    parts:
      - {name: dome, mat: "=mat", ellipsoid: {c: [0, 0, 0], r: ["=r", "=r * ry", "=r * hk"]}}
  # The Lars entry block: a box with a barrel-vault roof, its front at y = 0.
  entry-vault:
    params: {w: 1.3, d: 0.9, h: 0.75, mat: wall}
    preview: {}
    parts:
      - {name: body, mat: "=mat", box: {c: [0, "=d / 2", "=h / 2"], half: ["=w / 2", "=d / 2", "=h / 2"], radius: 0.05}}
      - {name: vault, mat: "=mat", cylinder: {a: [0, 0, "=h"], b: [0, "=d", "=h"], r1: "=w / 2"}}
  # A sloped buttress leaning on the south wall, its foot `l` south of it.
  buttress:
    params: {l: 0.45, hh: 1.0, t: 0.2, mat: wall}
    preview: {}
    parts:
      - name: wedge
        mat: "=mat"
        extrude: {axis: x, profile: [["=-l", 0], [0.1, 0], [0.1, "=hh"]], span: ["=-t", "=t"], round: 0.04}
  # A round drum tower with a slight taper.
  drum:
    params: {r: 0.7, h: 1.6, mat: wall}
    preview: {at: [0, 0.7, 0]}
    parts:
      - {name: drum, mat: "=mat", cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=r", r2: "=r * 0.9"}}
