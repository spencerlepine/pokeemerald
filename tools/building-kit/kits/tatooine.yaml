# Tatooine kit: sand-adobe masses (Mos Eisley, Mos Espa, Anchorhead, the Lars homestead).
# What makes them Star Wars and not Earth: battered walls that lean in, rounded corners, low domes,
# barrel-vaulted entry blocks with keyhole arches, sloped buttresses, round vents, vaporators.
uses: ["../../world-art/models/scenery/kits/tatooine"]
templates:
  # A battered adobe block: walls lean in by `batter`, every edge softened by `rnd`.
  adobe-block:
    params: {w: 3.0, d: 2.0, h: 1.4, batter: 0.14, rnd: 0.08, mat: wall}
    preview: {}
    parts:
      - name: block
        mat: "=mat"
        prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=d"], ["=-w / 2", "=d"]], z: [0, "=h"],
                top: ["=(w - 2 * batter) / w", "=(d - 2 * batter) / d"], round: "=rnd"}
  # The thick roof band Mos Eisley blocks have: a slab a little proud of the wall top.
  roof-lip:
    params: {w: 3.0, d: 2.0, h: 1.4, batter: 0.14, t: 0.16, out: 0.06, mat: trim}
    preview: {}
    parts:
      - name: lip
        mat: "=mat"
        prism: {poly: [["=-w / 2 + batter - out", "=batter - out"], ["=w / 2 - batter + out", "=batter - out"],
                       ["=w / 2 - batter + out", "=d - batter + out"], ["=-w / 2 + batter - out", "=d - batter + out"]],
                z: ["=h - t", "=h + 0.04"], round: 0.04}
  # A low dome. Plan radius r east-west, r * ry north-south, height r * hk.
  dome:
    params: {r: 1.0, ry: 0.8, hk: 0.7, mat: roof}
    preview: {at: [0, 0.8, 0]}
    parts:
      - {name: dome, mat: "=mat", ellipsoid: {c: [0, 0, 0], r: ["=r", "=r * ry", "=r * hk"]}}
  # The Lars entry block: a box with a barrel-vault roof, its front at y = 0.
  entry-vault:
    params: {w: 1.3, d: 0.9, h: 0.75, mat: wall}
    preview: {}
    parts:
      - {name: body, mat: "=mat", box: {c: [0, "=d / 2", "=h / 2"], half: ["=w / 2", "=d / 2", "=h / 2"], radius: 0.05}}
      - {name: vault, mat: "=mat", cylinder: {a: [0, 0, "=h"], b: [0, "=d", "=h"], r1: "=w / 2"}}
  # A sloped buttress leaning on the south wall, its foot `l` south of it.
  buttress:
    params: {l: 0.45, hh: 1.0, t: 0.2, mat: wall}
    preview: {}
    parts:
      - name: wedge
        mat: "=mat"
        extrude: {axis: x, profile: [["=-l", 0], [0.1, 0], [0.1, "=hh"]], span: ["=-t", "=t"], round: 0.04}
  # A round drum tower with a slight taper.
  drum:
    params: {r: 0.7, h: 1.6, mat: wall}
    preview: {at: [0, 0.7, 0]}
    parts:
      - {name: drum, mat: "=mat", cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=r", r2: "=r * 0.9"}}
  # --- landmark pieces (docking bays, hangars, labs, arenas) ---
  # A wide hangar mouth: a dark opening `w` x `h` in a heavy frame with a metal lintel, its foot at the
  # entry's `at` (name the entry `door`). `arch: 1` gives it a round top.
  hangar-mouth:
    params: {w: 2.4, h: 1.2, frame: 0.16, arch: 0, trim: trim, hole: dark}
    preview: {}
    parts:
      - {name: frame, mat: "=trim", box: {c: [0, -0.02, "=(h - w / 2 if arch else h + frame) / 2"], half: ["=w / 2 + frame", 0.08, "=(h - w / 2 if arch else h + frame) / 2"], radius: 0.03}}
      - {name: frame-top, mat: "=trim", cylinder: {a: [0, -0.1, "=h - w / 2 if arch else 0.3"], b: [0, 0.06, "=h - w / 2 if arch else 0.3"], r1: "=w / 2 + frame if arch else 0.01"}}
      - {name: hole, mat: "=hole", box: {c: [0, -0.07, "=(h - w / 2 if arch else h) / 2"], half: ["=w / 2", 0.06, "=(h - w / 2 if arch else h) / 2"]}}
      - {name: hole-top, mat: "=hole", cylinder: {a: [0, -0.13, "=h - w / 2 if arch else 0.3"], b: [0, -0.01, "=h - w / 2 if arch else 0.3"], r1: "=w / 2 if arch else 0.01"}}
      - {name: lintel, mat: metal, box: {c: [0, -0.12, "=0.1 if arch else h - 0.08"], half: ["=w / 2", 0.05, 0.08]}}
  # A dish antenna on a short mast, the dish facing south and up (Mos Eisley rooftops, the Lars
  # garage). `r` is the dish radius.
  dish:
    params: {r: 0.45, mast: 0.5, mat: light}
    preview: {}
    parts:
      - {name: mast, mat: metal, cylinder: {a: [0, 0.1, 0], b: [0, 0.1, "=mast"], r1: 0.07}}
      - {name: dish, mat: "=mat", cylinder: {a: [0, "=0.12 + r * 0.25", "=mast + r * 0.7"], b: [0, "=0.0 - r * 0.15", "=mast + r * 0.85"], r1: "=r", r2: "=r * 0.92"}}
      - {name: horn, mat: metal, cylinder: {a: [0, "=-r * 0.1", "=mast + r * 0.85"], b: [0, "=-r * 0.45", "=mast + r * 0.95"], r1: 0.05}}
  # A tall power cell: a stack of drums with a domed cap (power converters, generator plants).
  power-cell:
    params: {r: 0.3, h: 1.2, mat: light}
    preview: {at: [0, 0.3, 0]}
    parts:
      - {name: base, mat: metal, cylinder: {a: [0, 0, 0], b: [0, 0, 0.2], r1: "=r + 0.06"}}
      - {name: body, mat: "=mat", cylinder: {a: [0, 0, 0.2], b: [0, 0, "=h"], r1: "=r"}}
      - {name: band, mat: metal, cylinder: {a: [0, 0, "=h * 0.55"], b: [0, 0, "=h * 0.55 + 0.12"], r1: "=r + 0.04"}}
      - {name: cap, mat: metal, ellipsoid: {c: [0, 0, "=h"], r: ["=r", "=r", "=r * 0.45"]}}
  # A pennant mast with a hanging banner facing south (arenas, the podrace grandstand).
  banner:
    params: {h: 1.6, w: 0.45, l: 0.7, mat: light}
    preview: {}
    parts:
      - {name: mast, mat: metal, cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: 0.06}}
      - {name: flag, mat: "=mat", box: {c: [0, -0.05, "=h - 0.05 - l / 2"], half: ["=w / 2", 0.04, "=l / 2"], radius: 0.02}}
  # A flat dark doorway on the ground (the gate gap of a walled yard). Placed with `at`, so the build
  # finds its column when it is named `door`.
  gate-gap:
    params: {w: 0.9, d: 0.1, mat: dark}
    preview: {}
    parts:
      - {name: gap, mat: "=mat", box: {c: [0, 0, 0.01], half: ["=w / 2", "=d / 2", 0.01]}}
  # A wide dark vehicle bay in a south wall, with a lintel over it (garages, hangars). Foot at y = 0.
  bay-door:
    params: {w: 2.0, h: 0.8, trim: trim, door: dark}
    preview: {}
    parts:
      - {name: bay, mat: "=door", box: {c: [0, -0.05, "=h / 2"], half: ["=w / 2", 0.06, "=h / 2"]}}
      - {name: lintel, mat: "=trim", box: {c: [0, -0.08, "=h + 0.06"], half: ["=w / 2 + 0.12", 0.08, 0.08]}}
