# Hoth kit: the Rebel survey outpost and Echo Base (The Empire Strikes Back). Ice cliffs cut flat where
# the doors go, huge two-leaf hangar doors in a heavy angled frame, grey prefab modules half buried in
# drifts, ribbed half-cylinder shelters, sensor dishes on posts, round heater stacks.
# What makes them Hoth and not Earth: nothing stands free of the snow; everything is low, dug in, prefab
# grey against white, with drifts heaped on the windward sides.
materials:
  snow:    {ramp: light, bands: [0.08, 0.36, 0.7]}    # drifts and snow caps: mostly the lightest tones
  ice:     {ramp: light, bands: [0.3, 0.58, 0.86]}    # cliff faces: a shade darker than snow
  prefab:  {ramp: mid,   bands: [0.2, 0.5, 0.84]}     # Rebel prefab panels
  plate:   {ramp: mid,   bands: [0.3, 0.6, 0.9]}      # blast doors, pads
  hole:    {ramp: dark,  bands: [0.3, 0.6, 0.95]}     # openings, glass
templates:
  # A chunk of ice cliff: a slab w x d x h, its top tipped and leaning, faceted. Front at y = 0.
  ice-block:
    params: {w: 2.0, d: 1.6, h: 2.0, top: 0.8, lean: 0.1, rnd: 0.06, mat: ice}
    preview: {}
    parts:
      - name: block
        mat: "=mat"
        prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=d"], ["=-w / 2", "=d"]], z: [0, "=h"],
                top: ["=top", "=top * 0.9"], lean: ["=lean", 0.1], round: "=rnd"}
  # A snow drift: a low squashed mound, plan rx by ry, height hz.
  drift:
    params: {rx: 0.9, ry: 0.5, hz: 0.35, mat: snow}
    preview: {at: [0, 0.6, 0]}
    parts:
      - {name: drift, mat: "=mat", ellipsoid: {c: [0, 0, 0], r: ["=rx", "=ry", "=hz"]}}
  # The Echo Base hangar door: a heavy angled frame, a dark opening, two blast-door leaves meeting part
  # open (the top one up, the bottom one down). Front at y = 0, `w` wide, `h` tall.
  hangar-door:
    params: {w: 3.6, h: 1.7, frame: 0.35, open: 0.4, mat: plate}
    preview: {}
    parts:
      - name: frame
        mat: prefab
        prism: {poly: [["=-w / 2 - frame", 0], ["=w / 2 + frame", 0], ["=w / 2 + frame", 0.3], ["=-w / 2 - frame", 0.3]],
                z: [0, "=h + frame"], top: ["=(w + frame) / (w + 2 * frame)", 1], round: 0.04}
      - {name: hole, mat: hole, box: {c: [0, -0.04, "=h / 2"], half: ["=w / 2", 0.06, "=h / 2"]}}
      - {name: leaf-top, mat: "=mat", box: {c: [0, -0.1, "=h - h * (1 - open) / 4"], half: ["=w / 2 - 0.04", 0.05, "=h * (1 - open) / 4"], radius: 0.02}}
      - {name: leaf-low, mat: "=mat", box: {c: [0, -0.1, "=h * (1 - open) / 4"], half: ["=w / 2 - 0.04", 0.05, "=h * (1 - open) / 4"], radius: 0.02}}
  # A ribbed half-cylinder vault running north (prefab or a tarp over a snow pen): its arched end faces
  # south, with a hoop at the front. Front at y = 0, half-width r, rise r * k, `d` deep.
  quonset:
    params: {r: 1.0, d: 1.8, k: 0.9, mat: prefab, hoop: plate}
    preview: {}
    parts:
      - {name: vault, mat: "=mat", cylinder: {a: [0, 0.04, 0], b: [0, "=d", 0], r1: "=r"},
         squash: {scale: [1, 1, "=k"], center: [0, 0, 0]}}
      - {name: hoop, mat: "=hoop", cylinder: {a: [0, -0.04, 0], b: [0, 0.14, 0], r1: "=r + 0.07"},
         squash: {scale: [1, 1, "=k"], center: [0, 0, 0]}}
  # A dark arched mouth on a quonset's front (an open end).
  arch-mouth:
    params: {r: 0.55, k: 0.9, mat: hole}
    parts:
      - {name: mouth, mat: "=mat", cylinder: {a: [0, -0.1, 0], b: [0, -0.02, 0], r1: "=r"},
         squash: {scale: [1, 1, "=k"], center: [0, 0, 0]}}
  # A prefab module: a box with chamfered roof edges (the Echo Base panels). Front at y = 0.
  module:
    params: {w: 2.4, d: 1.6, h: 1.0, ch: 0.3, mat: prefab, roof: plate}
    preview: {}
    parts:
      - {name: body, mat: "=mat", box: {c: [0, "=d / 2", "=(h - ch) / 2"], half: ["=w / 2", "=d / 2", "=(h - ch) / 2"], radius: 0.03}}
      - name: roof
        mat: "=roof"
        prism: {poly: [["=-w / 2", 0], ["=w / 2", 0], ["=w / 2", "=d"], ["=-w / 2", "=d"]], z: ["=h - ch - 0.01", "=h"],
                top: ["=(w - 2 * ch) / w", "=max(0.1, (d - 2 * ch) / d)"], round: 0.03}
  # A sensor dish on a post, tipped up to face south-up.
  dish:
    params: {h: 1.4, r: 0.55, tilt: 50, mat: prefab, face: plate}
    preview: {}
    parts:
      - {name: post, mat: "=mat", cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: 0.12, r2: 0.09}}
      - {name: dish, mat: "=face", rot: ["=tilt", 0, 0], ellipsoid: {c: [0, -0.05, "=h + 0.1"], r: ["=r", 0.12, "=r"]}}
      - {name: horn, mat: "=mat", cylinder: {a: [0, -0.1, "=h + 0.1"], b: [0, "=-0.45", "=h + 0.45"], r1: 0.05}}
  # A round heater / exhaust stack with a cap.
  stack:
    params: {r: 0.2, h: 0.8, mat: plate}
    preview: {}
    parts:
      - {name: pipe, mat: "=mat", cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=r"}}
      - {name: cap, mat: hole, cylinder: {a: [0, 0, "=h"], b: [0, 0, "=h + 0.08"], r1: "=r + 0.06"}}
  # A blocky Rebel blast door in a thick frame (the outpost's personnel doors).
  door-hatch:
    params: {w: 0.9, h: 0.95, frame: 0.14, door: plate, trim: prefab}
    preview: {}
    parts:
      - name: frame
        mat: "=trim"
        prism: {poly: [["=-w / 2 - frame", -0.1], ["=w / 2 + frame", -0.1], ["=w / 2 + frame", 0.05], ["=-w / 2 - frame", 0.05]],
                z: [0, "=h + frame"], top: ["=(w + frame * 0.6) / (w + 2 * frame)", 1], round: 0.03}
      - {name: slab, mat: "=door", box: {c: [0, -0.13, "=h / 2"], half: ["=w / 2", 0.04, "=h / 2"]}}
      - {name: seam, mat: hole, box: {c: [0, -0.18, "=h / 2"], half: [0.035, 0.02, "=h / 2 - 0.05"]}}
