# Endor's mossy fallen log (wiki art:endor:fallen-log): blocks a path edge. A fat round trunk lying east-west
# with a rounded root ball at one end, big moss humps on top.
name: fallen-log
style: endor
role: edge
about: Fat trunk lying east-west, a root ball at one end, big moss humps on top.
footprint: [[2, 1], [3, 1], [4, 1]]
fill: true
choose:
  r: [0.38, 0.44]
  side: {pick: [-1, 1]}
parts:
  - {name: log, mat: bark, cylinder: {a: ["=-side * (w_max / 2 - 0.55)", "=D * 0.5", "=r"], b: ["=side * (w_max / 2 - 0.25)", "=D * 0.5", "=r * 0.92"], r1: "=r", r2: "=r * 0.9"}, squash: {scale: [1, 0.85, 1], center: [0, "=D * 0.5", "=r"]}}
  - {name: end, mat: stone, ellipsoid: {c: ["=side * (w_max / 2 - 0.25)", "=D * 0.5", "=r * 0.92"], r: [0.1, "=r * 0.78", "=r * 0.88"]}}
  - {name: rootball, mat: bark, ellipsoid: {c: ["=-side * (w_max / 2 - 0.42)", "=D * 0.5", "=r * 1.15"], r: [0.38, "=min(D * 0.42, r * 1.2)", "=r * 1.4"]}}
  - repeat: "=W - 1"
    parts:
      - {name: moss, mat: leaf, ellipsoid: {c: ["=-w_max / 2 + 1.0 + i * (w_max - 1.4) / max(W - 1, 1)", "=D * 0.5 - 0.05", "=r * 1.8"], r: [0.32, 0.24, 0.16]}}
