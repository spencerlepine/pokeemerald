# Mustafar's obsidian rock (wiki art:mustafar:obsidian-spire): black glassy rock in big chunky shards with
# flat bevelled tops, never needles; the planet's route edge.
name: obsidian-spire
style: mustafar
role: edge
about: Black glassy rock in two or three big blunt shards on a rubble base.
footprint: [[2, 1], [2, 2], [1, 1]]
fill: true
materials:
  glass: {ramp: dark, bands: [0.0, 0.35, 0.7]}
choose:
  n: {int: ["=min(W, 2)", "=W + 1"]}
  h: ["=1.2 + 0.25 * D", "=1.6 + 0.35 * D"]
parts:
  - {rock: {c: [0, "=D * 0.5", 0], r: ["=w_max * 0.5", "=D * 0.46", 0.32], rings: [[0, 1.0], [0.4, 0.95], [1.0, 0.55]]}, mat: rock, name: base}
  - repeat: "=n"
    parts:
      - spike: {c: ["=w_max * (-0.5 + (i + 0.5) / n) * 0.6", "=D * (0.5 + 0.08 * (i % 2))", 0.1],
                r: "=w_max * 0.55 / n + 0.05", h: "=h * (1 - 0.3 * (i % 2))",
                lean: ["=0.25 * (-0.5 + (i + 0.5) / n)", 0], sides: 5, ry: "=min(0.9, D * 0.7)", top: "=w_max * 0.22 / n + 0.05"}
        mat: glass
        name: shard
