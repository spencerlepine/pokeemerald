# Hoth ice (wiki art:hoth:ice-stalagmites): chunky ice blocks pushing up out of a snow drift, blunt and
# bevelled, two or three to a cell; a route edge in the tundra and the ice caves.
name: ice-spikes
style: hoth
role: edge
about: Two or three chunky blunt ice blocks leaning out of a snow drift.
footprint: [[1, 1], [2, 1], [2, 2]]
fill: true
choose:
  n: {int: ["=W", "=W + 1"]}
  h: ["=0.8 + 0.25 * D", "=1.15 + 0.3 * D"]
parts:
  - {rock: {c: [0, "=D * 0.5", 0], r: ["=w_max * 0.5", "=D * 0.46", 0.3], rings: [[0, 1.0], [0.4, 0.95], [1.0, 0.6]]}, mat: light, name: drift}
  - repeat: "=n"
    parts:
      - spike: {c: ["=w_max * (-0.5 + (i + 0.5) / n) * 0.75", "=D * (0.45 + 0.12 * ((i + seed) % 2))", 0.05],
                r: "=w_max * 0.5 / n + 0.06", h: "=h * (0.6 + 0.4 * ((i * 0.53 + seed * 0.29) % 1))",
                lean: ["=0.2 * (-0.5 + (i + 0.5) / n)", 0], sides: 5, ry: 0.8}
        mat: ice
        name: block
