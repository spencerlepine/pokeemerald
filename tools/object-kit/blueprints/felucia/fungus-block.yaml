# Felucia's giant fungi as a forest block (wiki art:felucia:giant-fungus), from scratch on the vanilla tree's
# frame: one broad cap fills the 2x2 block edge to edge (a forest of them is a roof of caps), a dark gill
# band under it, a small cap peeking out on one side. On the forest edge the fat stalk shows.
name: fungus-block
style: felucia
role: edge
about: Forest block; one broad cap filling the block, a gill band, a small side cap; the stalk on the edge.
footprint: [2, 1]
fill: true
drawn: 2
foot: [16, 28]
render: {light: [-0.35, -0.4, 0.85], inner_lines: black, depth_jump: 0.07, supersample: 4}
materials:
  cap:   {ramp: bone, bands: [0.05, 0.45, 0.85]}
  gill:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
  stalk: {ramp: mid, bands: [0.2, 0.5, 0.85]}
drop_shadow: []
ground_shadow:
  - {rx: 16, ry: 9, dy: -5, color: "mid:1", checker: true}
  - {rx: 14, ry: 7, dy: -4, color: "mid:1"}
  - {rx: 11, ry: 4, dy: -1, color: "dark:0"}
choose:
  side: {pick: [-1, 1]}
  bump: [-0.06, 0.06]
parts:
  - {name: stalk, mat: stalk, cone: {a: [0, 0.3, 0], b: [0, 0.3, 0.75], r1: "=0.3 if edge else 0.24", r2: 0.2}}
  - {name: gills, mat: gill, cylinder: {a: [0, 0.32, 0.62], b: [0, 0.32, 0.74], r1: 0.88}, squash: {scale: [1, 0.5, 1], center: [0, 0.32, 0.7]}}
  - {name: cap, mat: cap, ellipsoid: {c: ["=bump", 0.33, 0.78], r: [0.97, 0.5, 0.4]}, squash: {scale: [1, 1, 0.85], center: [0, 0.33, 0.7]}}
  - {name: knob, mat: cap, ellipsoid: {c: ["=side * 0.3 + bump", 0.25, 1.06], r: [0.2, 0.14, 0.1]}}
  - when: "=edge"
    parts:
      - {name: small-stalk, mat: stalk, cylinder: {a: ["=side * -0.62", 0.0, 0], b: ["=side * -0.62", 0.0, 0.32], r1: 0.09}}
      - {name: small-cap, mat: cap, ellipsoid: {c: ["=side * -0.62", 0.0, 0.34], r: [0.22, 0.14, 0.13]}}
