# Felucia's giant fungi (wiki art:felucia:giant-fungus): the planet's route wall in place of trees. A fat
# stalk and a big round cap that fills the cells, a dark gill band under it; or a cluster of two or three.
name: giant-fungus
style: felucia
role: edge
about: Fat stalk with a big round cap and a gill band; single, or a cluster of two or three.
footprint: [[2, 1], [2, 2], [1, 1]]
fill: true
choose:
  kind: {pick: [single, cluster], weights: "=[2, 3] if W > 1 else [1, 0]"}
  h: [1.2, 1.8]
  cap: ["=w_max * 0.46", "=w_max * 0.5"]
  flat: [0.45, 0.6]
templates:
  shroom:
    params: {h: 1.6, cap: 0.8, flat: 0.5, stalk: 0.2}
    parts:
      - {name: stalk, mat: light, cone: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=stalk * 1.3", r2: "=stalk"}}
      - {name: gills, mat: dark, cylinder: {a: [0, 0, "=h - 0.1"], b: [0, 0, "=h + 0.02"], r1: "=cap * 0.9", r2: "=cap * 0.9"}, squash: {scale: [1, 0.6, 1], center: [0, 0, "=h"]}}
      - {name: cap, mat: fungus, ellipsoid: {c: [0, 0, "=h"], r: ["=cap", "=cap * 0.6", "=cap * flat"]}}
parts:
  - when: "=kind == 'single'"
    parts:
      - {use: shroom, name: a, at: [0, "=D * 0.5", 0], with: {h: "=h", cap: "=cap", flat: "=flat", stalk: "=0.18 + 0.05 * W"}}
  - when: "=kind == 'cluster'"
    parts:
      - {use: shroom, name: a, at: ["=-w_max * 0.18", "=D * 0.6", 0], with: {h: "=h", cap: "=cap * 0.72", flat: "=flat", stalk: 0.2}}
      - {use: shroom, name: b, at: ["=w_max * 0.24", "=D * 0.4", 0], with: {h: "=h * 0.55", cap: "=cap * 0.55", flat: "=flat", stalk: 0.17}}
