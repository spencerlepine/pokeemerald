# Giant wroshyr trunk as Kashyyyk's route wall (wiki art:kashyyyk:wroshyr-tree): too tall for the screen, so
# the sprite is cut at a fixed height (the canopy is the top layer, drawn on its own). A fat trunk with a
# few broad bark ridges, rounded buttress roots spreading at the foot, a shelf fungus on some seeds.
name: wroshyr-trunk
style: kashyyyk
role: edge
about: Giant trunk cut off at the top; broad bark ridges, rounded buttress roots, a shelf fungus.
footprint: [[3, 2], [2, 2]]
fill: true
drawn: 5
choose:
  R: ["=w_max * 0.32", "=w_max * 0.38"]
  yc: "=D * 0.55"
  nroot: {int: [2, 3]}
  fungus: {pick: [true, false]}
  sz: [1.8, 2.6]
parts:
  - {name: trunk, mat: bark, cylinder: {a: [0, "=yc", 0], b: [0, "=yc", 8], r1: "=R", r2: "=R * 0.92"}, squash: {scale: [1, 0.6, 1], center: [0, "=yc", 0]}}
  - ring: {c: [0, "=yc", 4], axis: z, r: "=R * 0.96", size: [0.3, 0.16, 8], n: 4, arc: [125, 235], round: 0.08}
    mat: bark
    name: ridge
    squash: {scale: [1, 0.6, 1], center: [0, "=yc", 0]}
  - repeat: "=nroot"
    parts:
      - name: root
        mat: bark
        ellipsoid: {c: ["=(R + 0.15) * cos(pi * (0.2 + 0.6 * (i + 0.5) / nroot) + pi)", "=yc - 0.2 - 0.25 * sin(pi * (0.2 + 0.6 * (i + 0.5) / nroot))", 0.15],
                    r: [0.42, 0.3, 0.5]}
  - {name: root-w, mat: bark, ellipsoid: {c: ["=-R - 0.1", "=yc", 0.12], r: [0.4, 0.3, 0.45]}}
  - {name: root-e, mat: bark, ellipsoid: {c: ["=R + 0.1", "=yc", 0.12], r: [0.4, 0.3, 0.45]}}
  - when: "=fungus"
    parts:
      - {name: shelf, mat: fungus, ellipsoid: {c: ["=R * 0.55", "=yc - R * 0.6", "=sz"], r: [0.4, 0.22, 0.12]}}
