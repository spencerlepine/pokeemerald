# Large Kashyyyk fern bush (wiki art:kashyyyk:fern-clump): replaces small trees and cuttable bushes. Built
# like the approved vanilla tree's crown: a few fat leaf clumps, each lit as its own ball, with a dark line
# where one clump stands in front of another. Here the clumps are long and splay out like fronds.
name: fern-clump
style: kashyyyk
role: noise
about: Round fern bush of fat frond clumps fanning out from the middle.
footprint: [[1, 1], [2, 1]]
render: {inner_lines: black, depth_jump: 0.1}
choose:
  n: {int: ["=3 + W", "=4 + W"]}
  L: ["=w_max * 0.24", "=w_max * 0.28"]
  h: [0.8, 1.05]
  yc: "=D * 0.55"
parts:
  - {name: heart, mat: leaf, group: heart, _new_group: true, ellipsoid: {c: [0, "=yc + 0.05", "=h * 0.55"], r: ["=w_max * 0.24", 0.24, "=h * 0.42"]}}
  - repeat: "=n"
    parts:
      - name: "='frond' + str(i)"
        group: "='frond' + str(i)"
        _new_group: true
        mat: leaf
        ellipsoid: {c: ["=L * cos(pi * (i + 0.5) / n)", "=yc - 0.12 * sin(pi * (i + 0.5) / n)", "=h * (0.3 + 0.35 * sin(pi * (i + 0.5) / n))"],
                    r: ["=max(0.2, L * 0.6 * abs(cos(pi * (i + 0.5) / n))) + 0.06", 0.2, 0.2]}
