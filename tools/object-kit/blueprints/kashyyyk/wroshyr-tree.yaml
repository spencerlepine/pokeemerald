# Kashyyyk's wroshyr tree as a forest block (wiki art:kashyyyk:wroshyr-tree), designed from scratch on the
# vanilla tree's frame: a 2x2 block whose canopy fills it edge to edge on every seed. What makes it a
# wroshyr: the leaves grow in flat shelves on a thick trunk (Revenge of the Sith, Kachirho), so the crown
# is one broad canopy with a flat top of leaf plates and fronds hanging off its rim, on a thick trunk:
# a flat-topped umbrella, not a ball.
# (A two-shelf pagoda was tried in round 3 and read as stacked cushions.) The south row
# of a forest shows the flared root base.
name: wroshyr-tree
style: kashyyyk
role: edge
about: Forest block; flat-topped canopy of leaf plates, fronds hanging from the rim, thick trunk; flared roots on the forest edge.
footprint: [2, 1]
fill: true
drawn: 2
foot: [16, 28]
render: {light: [-0.35, -0.4, 0.85], inner_lines: black, depth_jump: 0.07, supersample: 4}
materials:
  leaf:  {ramp: mid, bands: [0.3, 0.68, 0.94]}
  bark:  {ramp: dark, bands: [0.15, 0.45, 0.8]}
drop_shadow: []
ground_shadow:
  - {rx: 16, ry: 9, dy: -5, color: "mid:1", checker: true}
  - {rx: 14, ry: 7, dy: -4, color: "mid:1"}
  - {rx: 11, ry: 4, dy: -1, color: "dark:0"}
choose:
  shift: [-0.08, 0.08]         # the upper shelf sits a little off-centre
parts:
  - {name: trunk, mat: bark, cylinder: {a: [0, 0.3, 0], b: [0, 0.3, 0.5], r1: 0.3, r2: 0.22}}
  - when: "=edge"
    parts:
      - {name: root-w, mat: bark, hull: {points: [[-0.25, 0.2, 0], [-0.25, 0.4, 0], [-0.22, 0.3, 0.35], [-0.72, 0.12, 0], [-0.68, 0.22, 0.06]], round: 0.03}}
      - {name: root-e, mat: bark, hull: {points: [[0.25, 0.2, 0], [0.25, 0.4, 0], [0.22, 0.3, 0.35], [0.72, 0.12, 0], [0.68, 0.22, 0.06]], round: 0.03}}
  - {name: canopy, mat: leaf, ellipsoid: {c: ["=shift", 0.3, 0.68], r: [0.88, 0.48, 0.4]}}
  - lobes: {name: plate, within: {c: ["=shift", 0.3, 0.7], r: [0.98, 0.54, 0.4]}, rows: [[72, 3], [42, 6], [12, 8]], size: 0.19, k: 0.9, xs: 1.0, squash: [1.45, 1.0, 0.5]}
    mat: leaf
  - lobes: {name: frond, within: {c: ["=shift", 0.3, 0.66], r: [0.96, 0.54, 0.42]}, rows: [[-22, 8], [-50, 7]], size: 0.17, k: 0.9, xs: 1.0, squash: [0.9, 0.9, 1.4]}
    mat: leaf
