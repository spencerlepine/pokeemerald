# Dagobah's mangrove (wiki art:dagobah:gnarltree), round 4: built round in plan, so the 45° camera sees
# the top of the crown as a big disc of clumps, the way vanilla shows a tree's top, not a side view.
# Prop roots splay in every direction; the ones in front arch over the mud, the ones behind are hidden.
name: mangrove
style: dagobah
role: edge
about: Mangrove; round crown seen from above, prop roots splaying all round a short trunk.
footprint: [3, 2]
fill: true
render: {inner_lines: black, depth_jump: 0.08}
choose:
  yc: 1.0
  rootz: [0.55, 0.7]
  lean: [-0.15, 0.15]
  turn: [0, 60]
materials:
  leaf: {ramp: mid, bands: [0.25, 0.6, 0.88]}
parts:
  - roots: {c: [0, "=yc", "=rootz"], n: 6, reach: [0.85, 0.95], arc: ["=turn", "=turn + 360"], kind: arch, r: 0.2, sag: 0.12, bend_at: 0.45}
    mat: bark
    name: root
  - {name: trunk, mat: bark, cone: {a: [0, "=yc", "=rootz - 0.1"], b: ["=lean", "=yc", 1.7], r1: 0.26, r2: 0.22}}
  - {name: core, mat: leaf, ellipsoid: {c: ["=lean", "=yc + 0.05", 2.05], r: [1.15, 1.1, 0.45]}}
  - lobes:
      name: lobe
      within: {c: ["=lean", "=yc + 0.05", 2.05], r: [1.35, 1.3, 0.55]}
      rows: [[85, 1], [62, 6], [38, 9], [12, 11], [-15, 9]]
      size: 0.32
      k: 0.85
    mat: leaf
  - lobes:                      # the north half of the top: the camera sees it, so it gets clumps too
      name: back
      within: {c: ["=lean", "=yc + 0.7", 2.2], r: [1.0, 0.7, 0.45]}
      rows: [[70, 3], [35, 5]]
      size: 0.3
      k: 0.85
    mat: leaf
