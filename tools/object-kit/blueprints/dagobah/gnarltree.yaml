# Dagobah's gnarltree, mangrove-like (wiki art:dagobah:gnarltree): the swamp's route wall. Three thick prop
# roots arch out of the mud under a short bent trunk; the crown is built like the approved vanilla tree
# (round leaf clumps with dark lines between them), but wide and low, and drooping at the sides.
name: gnarltree
style: dagobah
role: edge
about: Mangrove-like tree; thick arching prop roots, a short bent trunk, a wide low clumped crown.
footprint: [[2, 2], [3, 2]]
fill: true
render: {inner_lines: black, depth_jump: 0.1}
choose:
  yc: "=D * 0.55"
  rootz: [0.6, 0.8]
  bend: [-0.25, 0.25]
  th: [1.0, 1.3]
  cw: ["=w_max * 0.48", "=w_max * 0.52"]
parts:
  - roots: {c: [0, "=yc", "=rootz"], n: 3, reach: ["=w_max * 0.4", "=w_max * 0.48"], arc: [190, 350], kind: arch, r: 0.2, sag: 0.1, bend_at: 0.45}
    mat: bark
    name: root
  - {name: trunk, mat: bark, cone: {a: [0, "=yc", "=rootz - 0.15"], b: ["=bend", "=yc", "=rootz + th"], r1: 0.3, r2: 0.24}}
  - {name: core, mat: leaf, ellipsoid: {c: ["=bend", "=yc", "=rootz + th + 0.3"], r: ["=cw * 0.8", "=D * 0.3", 0.36]}}
  - lobes:
      name: lobe
      within: {c: ["=bend", "=yc", "=rootz + th + 0.3"], r: ["=cw", "=D * 0.36", 0.42]}
      rows: [[70, 3], [35, 5], [0, 6], [-25, 4]]
      size: 0.3
      k: 0.85
    mat: leaf
