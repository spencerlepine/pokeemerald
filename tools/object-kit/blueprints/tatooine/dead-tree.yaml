# Bleached dead tree on the dunes (wiki art:tatooine:dead-tree): a sparse accent, never a wall. A thick trunk
# and two or three fat limbs with rounded stumps for ends, no twigs (they are too fine for the grid).
name: dead-tree
style: tatooine
role: noise
about: Thick bleached trunk with two or three fat limbs ending in rounded stumps.
footprint: [[1, 1], [2, 1]]
choose:
  th: [1.0, 1.3]
  lean: [-0.15, 0.15]
  arms: {int: ["=2", "=3 if W > 1 else 2"]}
  reach: ["=w_max * 0.28", "=w_max * 0.34"]
parts:
  - {name: base, mat: stone, ellipsoid: {c: [0, "=D * 0.5", 0.06], r: [0.3, 0.24, 0.14]}}
  - {name: trunk, mat: stone, cone: {a: [0, "=D * 0.5", 0], b: ["=lean", "=D * 0.5", "=th"], r1: 0.22, r2: 0.16}}
  - repeat: "=arms"
    parts:
      - name: arm
        mat: stone
        cone: {a: ["=lean * (0.5 + 0.2 * i)", "=D * 0.5", "=th * (0.45 + 0.22 * i)"],
               b: ["=reach * (1 if i % 2 == 0 else -1) * (1 - 0.25 * i)", "=D * 0.5 - 0.05", "=th * (0.85 + 0.2 * i)"], r1: 0.15, r2: 0.12}
      - name: knob
        mat: stone
        ellipsoid: {c: ["=reach * (1 if i % 2 == 0 else -1) * (1 - 0.25 * i)", "=D * 0.5 - 0.05", "=th * (0.85 + 0.2 * i)"], r: [0.14, 0.14, 0.14]}
  - {name: top, mat: stone, ellipsoid: {c: ["=lean", "=D * 0.5", "=th"], r: [0.17, 0.17, 0.15]}}
