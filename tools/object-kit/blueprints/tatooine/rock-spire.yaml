# Tall eroded hoodoo (wiki art:tatooine:rock-spire): route edges and canyon walls, the top layer over the
# player. A narrow waist under a wider cap, or a plain tapering needle. Shallow plan, so it draws tall.
name: rock-spire
style: tatooine
role: edge
about: Eroded hoodoo; a cap on a narrow waist, a tapering needle, or a twin spire.
footprint: [[2, 1], [1, 1]]
fill: true
choose:
  kind: {pick: [hoodoo, needle, twin], weights: "=[3, 2, 2] if W > 1 else [2, 3, 0]"}
  h: [1.7, 2.6]
  lx: [-0.12, 0.12]
parts:
  - when: "=kind == 'hoodoo'"
    parts:
      - rock: {c: [0, "=D * 0.5", 0], r: ["=w_max * 0.34", "=D * 0.32", "=h * 0.78"], n: 7, jitter: 0.1, lean: ["=lx", 0],
               rings: [[0, 1.0], [0.2, 0.8], [0.6, 0.6], [1.0, 0.5]]}
        mat: stone
        name: column
      - rock: {c: ["=lx * 0.8", "=D * 0.48", "=h * 0.72"], r: ["=w_max * 0.48", "=D * 0.42", "=h * 0.28"], n: 7, jitter: 0.12,
               rings: [[0, 0.7], [0.3, 1.0], [0.75, 0.9], [1.0, 0.45]]}
        mat: stone
        name: cap
  - when: "=kind == 'needle'"
    parts:
      - rock: {c: [0, "=D * 0.5", 0], r: ["=w_max * 0.48", "=D * 0.42", "=h"], n: 7, jitter: 0.12, lean: ["=lx * 2", 0],
               rings: [[0, 1.0], [0.25, 0.8], [0.55, 0.55], [0.85, 0.32], [1.0, 0.12]]}
        mat: stone
        name: body
  - when: "=kind == 'twin'"
    parts:
      - rock: {c: ["=-w_max * 0.22", "=D * 0.52", 0], r: ["=w_max * 0.27", "=D * 0.36", "=h"], n: 6, jitter: 0.12, lean: [-0.1, 0],
               rings: [[0, 1.0], [0.3, 0.75], [0.7, 0.55], [0.92, 0.6], [1.0, 0.3]]}
        mat: stone
        name: west
      - rock: {c: ["=w_max * 0.24", "=D * 0.45", 0], r: ["=w_max * 0.25", "=D * 0.34", "=h * 0.7"], n: 6, jitter: 0.12, lean: [0.1, 0],
               rings: [[0, 1.0], [0.3, 0.78], [0.75, 0.5], [1.0, 0.2]]}
        mat: stone
        name: east
