# Tatooine's main route blocker in place of the Hoenn tree (wiki art:tatooine:sandstone-boulder). Chunky and
# round like vanilla's boulders: a wide base, a domed top, one or two big masses that fill the cells.
name: sandstone-boulder
style: tatooine
role: edge
about: Wind-worn sandstone boulder; a dome, a flat-topped slab, or a big rock leaning on a small one.
footprint: [[1, 1], [2, 1], [2, 2]]
fill: true
choose:
  shape: {pick: [dome, slab, pair], weights: "=[3, 2, 2] if W > 1 else [3, 2, 0]"}
  h: ["=0.55 + 0.3 * D", "=0.75 + 0.35 * D"]
  sx: [-0.08, 0.08]
parts:
  - when: "=shape == 'dome'"
    parts:
      - rock: {c: ["=sx", "=D * 0.5", 0], r: ["=w_max * 0.5", "=D * 0.46", "=h"],
               rings: [[0, 0.9], [0.18, 1.0], [0.55, 0.92], [0.85, 0.66], [1.0, 0.3]]}
        mat: stone
        name: body
  - when: "=shape == 'slab'"
    parts:
      - rock: {c: ["=sx", "=D * 0.5", 0], r: ["=w_max * 0.5", "=D * 0.46", "=h * 0.8"],
               rings: [[0, 0.95], [0.25, 1.0], [0.8, 0.95], [1.0, 0.7]]}
        mat: stone
        name: body
  - when: "=shape == 'pair'"
    parts:
      - rock: {c: ["=-w_max * 0.14", "=D * 0.54", 0], r: ["=w_max * 0.36", "=D * 0.44", "=h"],
               rings: [[0, 0.9], [0.2, 1.0], [0.6, 0.9], [1.0, 0.4]]}
        mat: stone
        name: big
      - rock: {c: ["=w_max * 0.3", "=D * 0.4", 0], r: ["=w_max * 0.22", "=D * 0.36", "=h * 0.6"],
               rings: [[0, 0.9], [0.3, 1.0], [1.0, 0.45]]}
        mat: stone
        name: small
