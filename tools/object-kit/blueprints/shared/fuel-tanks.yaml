# Pressurised fuel tanks (wiki art:shared:fuel-tanks): industrial edge filler. Upright tanks with domed tops
# linked by a pipe, or long tanks lying on cradles.
name: fuel-tanks
style: shared
role: noise
fill: true
about: Upright domed tanks linked by a pipe, or long tanks lying on cradles.
footprint: [[2, 1], [2, 2], [3, 1]]
choose:
  kind: {pick: [upright, lying]}
  n: "=W"
  r: "=min(0.42, D * 0.4)"
  h: [1.0, 1.5]
parts:
  - when: "=kind == 'upright'"
    parts:
      - repeat: "=n"
        parts:
          - {name: tank, mat: light, cylinder: {a: ["=-W / 2 + 0.5 + i", "=D * 0.5", 0], b: ["=-W / 2 + 0.5 + i", "=D * 0.5", "=h * (1 - 0.15 * (i % 2))"], r1: "=r"}}
          - {name: dome, mat: light, ellipsoid: {c: ["=-W / 2 + 0.5 + i", "=D * 0.5", "=h * (1 - 0.15 * (i % 2))"], r: ["=r", "=r", "=r * 0.5"]}}
          - {name: ring, mat: metal, cylinder: {a: ["=-W / 2 + 0.5 + i", "=D * 0.5", "=h * 0.3"], b: ["=-W / 2 + 0.5 + i", "=D * 0.5", "=h * 0.3 + 0.08"], r1: "=r + 0.03"}}
      - {name: pipe, mat: metal, cylinder: {a: ["=-W / 2 + 0.5", "=D * 0.5 - r - 0.04", "=h * 0.6"], b: ["=W / 2 - 0.5", "=D * 0.5 - r - 0.04", "=h * 0.6"], r1: 0.06}}
  - when: "=kind == 'lying'"
    parts:
      - repeat: "=D"
        parts:
          - {name: tank, mat: light, cylinder: {a: ["=-W / 2 + 0.3", "=0.5 + i", "=0.5"], b: ["=W / 2 - 0.3", "=0.5 + i", "=0.5"], r1: 0.38}}
          - {name: endl, mat: light, ellipsoid: {c: ["=-W / 2 + 0.3", "=0.5 + i", 0.5], r: [0.16, 0.38, 0.38]}}
          - {name: endr, mat: light, ellipsoid: {c: ["=W / 2 - 0.3", "=0.5 + i", 0.5], r: [0.16, 0.38, 0.38]}}
          - {name: cradle1, mat: metal, box: {c: ["=-W / 2 + 0.7", "=0.5 + i", 0.18], half: [0.08, 0.36, 0.18]}}
          - {name: cradle2, mat: metal, box: {c: ["=W / 2 - 0.7", "=0.5 + i", 0.18], half: [0.08, 0.36, 0.18]}}
