# A small comm or signal tower: a tapering mast on a squat base, a dish or an antenna array on top, a light at
# the tip. Outposts, town edges, route checkpoints on every planet (recoloured per planet later).
name: comm-tower
style: shared
role: landmark
about: Signal mast on a squat base; a dish, a crossbar array or a sensor ball on top.
footprint: [[1, 1], [2, 1]]
choose:
  h: [2.2, 3.2]
  top: {pick: [dish, array, ball]}
  base: {pick: [block, legs], weights: "=[2, 2] if W > 1 else [2, 1]"}
  bw: "=min(w_max * 0.7, 1.2)"
parts:
  - when: "=base == 'block'"
    parts:
      - {name: base, mat: metal, box: {c: [0, "=D * 0.5", 0.25], half: ["=bw / 2", "=min(D * 0.38, 0.4)", 0.25], radius: 0.04}}
      - {name: hatch, mat: dark, box: {c: [0, "=D * 0.5 - min(D * 0.38, 0.4) - 0.02", 0.2], half: [0.14, 0.03, 0.17]}}
    else:
      - repeat: 2
        parts:
          - {name: leg, mat: metal, cone: {a: ["=(i * 2 - 1) * bw * 0.45", "=D * 0.4", 0], b: ["=(i * 2 - 1) * 0.08", "=D * 0.5", "=h * 0.55"], r1: 0.07, r2: 0.05}}
      - {name: brace, mat: metal, box: {c: [0, "=D * 0.42", "=h * 0.22"], half: ["=bw * 0.3", 0.04, 0.04]}}
  - {name: mast, mat: light, cone: {a: [0, "=D * 0.5", 0.4], b: [0, "=D * 0.5", "=h"], r1: 0.11, r2: 0.06}}
  - {name: deck, mat: metal, cylinder: {a: [0, "=D * 0.5", "=h * 0.62"], b: [0, "=D * 0.5", "=h * 0.62 + 0.08"], r1: 0.26}}
  - when: "=top == 'dish'"
    parts:
      - {use: dish, name: dish, at: [0.1, "=D * 0.5 - 0.1", "=h * 0.8"], with: {r: 0.34}}
  - when: "=top == 'array'"
    parts:
      - repeat: 2
        parts:
          - {name: bar, mat: metal, box: {c: [0, "=D * 0.5", "=h * 0.78 + i * 0.28"], half: ["=0.42 - i * 0.12", 0.04, 0.035]}}
          - {name: pod, mat: light, box: {c: ["=0.42 - i * 0.12", "=D * 0.5", "=h * 0.78 + i * 0.28 - 0.1"], half: [0.05, 0.05, 0.12]}}
          - {name: pod2, mat: light, box: {c: ["=-0.42 + i * 0.12", "=D * 0.5", "=h * 0.78 + i * 0.28 - 0.1"], half: [0.05, 0.05, 0.12]}}
  - when: "=top == 'ball'"
    parts:
      - {name: ball, mat: light, ellipsoid: {c: [0, "=D * 0.5", "=h * 0.86"], r: [0.26, 0.26, 0.26]}}
  - {name: tip, mat: dark, ellipsoid: {c: [0, "=D * 0.5", "=h + 0.04"], r: [0.06, 0.06, 0.06]}}
