# Calibration: the approved Hoenn route tree (tools/world-art/models/calibration/hoenn-tree.yaml) as an
# object-kit tree block, in greybox. Every tree family is a 2x2 block like this one: the crown fills the
# block edge to edge the same way on every seed, so a grid of them reads as one canopy.
name: broadleaf
style: hoenn
role: edge
about: The approved Hoenn tree in greybox; the reference every tree block is checked against.
footprint: [2, 1]
fill: true
drawn: 2
foot: [16, 27]
render: {light: [-0.35, -0.4, 0.85], inner_lines: black, depth_jump: 0.08, supersample: 4}
materials:
  leaf:  {ramp: mid, bands: [-0.1, 0.45, 0.85], shares: [0.15, 0.33, 0.32, 0.2]}
  trunk: {ramp: dark, bands: [0.2, 0.5, 0.8]}
drop_shadow: []
ground_shadow:
  - {rx: 16, ry: 13, dy: -9, color: "mid:1", checker: true}
  - {rx: 15, ry: 11, dy: -9, color: "mid:1"}
  - {rx: 12.5, ry: 6.5, dy: -2, color: "mid:0"}
  - {rx: 11.5, ry: 5.5, dy: -2.5, color: "dark:0"}
parts:
  - {name: trunk, mat: trunk, cylinder: {a: [0, 0.05, 0], b: [0, 0.05, 0.15], r1: 0.25, r2: 0.22}}
  - {name: core, mat: leaf, ellipsoid: {c: [0, 0.3, 0.6], r: [0.6912, 0.44, 0.44]}}
  - lobes: {name: lobe, within: {c: [0, 0.3, 0.6], r: [0.96, 0.55, 0.55]}, rows: [[80, 3], [52, 5], [24, 6], [-4, 7]], size: 0.24, k: 0.85, xs: 0.9}
    mat: leaf
