# Ilum's snow pine as a forest block (wiki art:ilum:snow-pine), on the vanilla tree's frame: the round-1
# pine (owner: "the older pine was okay") fitted to a 2x2 block so a grid of them closes up into one
# snowy wall: three stepped skirts, each one snow on top and
# green needles showing on its rim and underside, a short trunk on the forest edge.
name: pine-block
style: ilum
role: edge
about: Forest block; three stepped skirts, snow on top of each, green rims, filling the block; short trunk on the edge.
footprint: [2, 1]
fill: true
drawn: 2
foot: [16, 28]
render: {light: [-0.35, -0.4, 0.85], inner_lines: black, depth_jump: 0.1, supersample: 4}
materials:
  leaf: {ramp: dark, bands: [0.0, 0.4, 0.75]}
  snow: {ramp: light, bands: [0.1, 0.45, 0.8]}
  bark: {ramp: mid, bands: [0.2, 0.5, 0.85]}
drop_shadow: []
ground_shadow:
  - {rx: 15, ry: 8, dy: -4, color: "mid:1", checker: true}
  - {rx: 12, ry: 5, dy: -2, color: "dark:0"}
choose:
  lean: [-0.025, 0.025]   # each tier sits a little off the one below
parts:
  - {name: trunk, mat: bark, cylinder: {a: [0, 0.3, 0], b: [0, 0.3, 0.45], r1: 0.14, r2: 0.12}}
  - {name: green0, group: green0, mat: leaf, _new_group: true, cylinder: {a: ["=lean*0", 0.3, 0.24], b: ["=lean*0", 0.3, 0.52], r1: 0.97, r2: 0.42}}
  - {name: snow0, group: snow0, mat: snow, _new_group: true, cylinder: {a: ["=lean*0", 0.3, 0.378], b: ["=lean*0", 0.3, 0.56], r1: 0.777, r2: 0.42}}
  - {name: green1, group: green1, mat: leaf, _new_group: true, cylinder: {a: ["=lean*1", 0.3, 0.48], b: ["=lean*1", 0.3, 0.76], r1: 0.74, r2: 0.3}}
  - {name: snow1, group: snow1, mat: snow, _new_group: true, cylinder: {a: ["=lean*1", 0.3, 0.618], b: ["=lean*1", 0.3, 0.8], r1: 0.586, r2: 0.3}}
  - {name: green2, group: green2, mat: leaf, _new_group: true, cylinder: {a: ["=lean*2", 0.3, 0.72], b: ["=lean*2", 0.3, 0.98], r1: 0.52, r2: 0.2}}
  - {name: snow2, group: snow2, mat: snow, _new_group: true, cylinder: {a: ["=lean*2", 0.3, 0.851], b: ["=lean*2", 0.3, 1.02], r1: 0.408, r2: 0.2}}
  - {name: green3, group: green3, mat: leaf, _new_group: true, cylinder: {a: ["=lean*3", 0.3, 0.94], b: ["=lean*3", 0.3, 1.24], r1: 0.3, r2: 0.02}}
  - {name: snow3, group: snow3, mat: snow, _new_group: true, cylinder: {a: ["=lean*3", 0.3, 1.1], b: ["=lean*3", 0.3, 1.27], r1: 0.15, r2: 0.02}}
