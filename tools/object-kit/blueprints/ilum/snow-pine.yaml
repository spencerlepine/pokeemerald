# Ilum's snow-laden pine (wiki art:ilum:snow-pine): the route wall. Chunky like vanilla's tall route trees:
# two or three fat rounded skirts stacked, each with a thick snow cap, and a round top instead of a point.
name: snow-pine
style: ilum
role: edge
about: Chunky snowy conifer; two or three fat rounded skirts with snow caps and a round top.
footprint: [[1, 1], [2, 2]]
fill: true
materials:
  leaf: {ramp: dark, bands: [0.1, 0.4, 0.75]}    # dark needles so the snow caps read
choose:
  tiers: {int: [2, 3]}
  rad: ["=min(w_max, D) * 0.46", "=min(w_max, D) * 0.5"]
  top: ["=1.4 + 0.5 * W", "=1.7 + 0.6 * W"]
templates:
  skirt:
    params: {r: 0.5, h: 0.6}
    parts:
      - {name: needles, mat: leaf, cone: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=r", r2: "=r * 0.45"}, squash: {scale: [1, 1, 0.7], center: [0, 0, 0]}}
      - {name: snow, mat: ice, ellipsoid: {c: [0, -0.02, "=h * 0.62"], r: ["=r * 0.62", "=r * 0.55", "=h * 0.22"]}}
parts:
  - {name: trunk, mat: bark, cylinder: {a: [0, "=D * 0.5", 0], b: [0, "=D * 0.5", 0.35], r1: 0.14}}
  - repeat: "=tiers"
    parts:
      - {use: skirt, name: "='tier' + str(i)", at: [0, "=D * 0.5", "=0.25 + i * (top - 0.6) / tiers"], with: {r: "=rad * (1 - 0.28 * i)", h: "=(top - 0.4) / tiers * 1.3"}}
  - {name: tip, mat: ice, ellipsoid: {c: [0, "=D * 0.5", "=top - 0.15"], r: ["=rad * 0.32", "=rad * 0.3", 0.22]}}
