# The ship kit's shapes already read as a vessel (cabins, bunks, portholes, corridor rails). The wood panels
# become Imperial grey wall panels and the carpets become dark deck. Exact per-index overrides, because the
# wood and carpet ramps overlap in hue and a hue rule can't separate them.
name: star-destroyer
notes: Star Destroyer interior. Wood panels -> pale Imperial grey panels; carpet -> dark deck with a lighter dot; olive corridor walls -> mid grey; bunks keep green blankets; lifebuoy red kept as an accent.
