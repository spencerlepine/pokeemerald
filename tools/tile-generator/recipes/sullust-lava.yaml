# Variant: Sullust with the open water turned into lava (lava fields, Lavaridge/Fallarbor region).
# The General water bank (4) becomes a red -> orange -> yellow lava ramp (hue follows lightness, so the
# drawn wave crests glow) and the rocks standing in the water, which vanilla draws in the shared bank 1,
# are moved into bank 4's free slots as dark basalt with a glowing rim. Everything else is sullust.yaml.
name: sullust-lava
extends: sullust.yaml
notes: Sullust ash fields with lava flows instead of water. Water frames are reused as lava frames (same animation).
rules:
  - name: lava-glare
    match: {banks: ["general:4"], chroma_max: 20, light_min: 85}
    set:   {hue: 95, chroma: 50, light: -2}
  - name: lava-crust
    match: {banks: ["general:4"], chroma_max: 20, light_max: 72}
    set:   {hue: 30, chroma: 70, light: -6}
  - name: lava
    match: {banks: ["general:4"], hue: [240, 300], chroma_min: 15}
    set:   {hue_by_light: [10, 100], chroma: 72, light_scale: 1.3, light: 2}
overrides:                     # bank 4's free slots (vanilla magenta / duplicates) hold the basalt rocks
  "general:4": {1: "#f8e870", 3: "#8c8078", 4: "#605450", 5: "#483c3c", 7: "#302828", 15: "#201818"}
retexture:
  - op: speckle                # sullust's ash ground (a variant's retexture replaces the base's)
    tileset: primary
    metatiles: [1]
    tones: {base: 13, light: 12, dark: 14}
    seed: 5
    light_blobs: 1
    dark_dots: 5
    blob: 1
  - op: rebank                 # water rocks + foam: bank 1 -> bank 4 (cloned tiles, other bank-1 art untouched)
    tileset: primary
    metatiles_with_tiles: [432, 462]
    from: 1
    to: 4
    free_below: 432            # never clone into the animated tile ranges
    map: {1: 1, 2: 3, 3: 3, 4: 4, 5: 5, 6: 7, 7: 15}
