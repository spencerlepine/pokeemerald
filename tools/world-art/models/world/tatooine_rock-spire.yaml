# Rock spire (art:tatooine:rock-spire), hit box 2x3, drawn 2x5: the top 2 rows stand over the cells behind.
# Reference: the Jundland Wastes hoodoos and canyon pillars (A New Hope). A tall eroded column of layered
# sandstone on a scree mound, pinched in at the soft layers, with a wider cap stone on top.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box.
name: tatooine_rock-spire
art: art:tatooine:rock-spire
palette: greybox
cells: [2, 5]
foot: [16, 79]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  rock:  {ramp: mid,  bands: [0.25, 0.5, 0.8]}
  cap:   {ramp: bone, bands: [0.25, 0.55, 0.85]}
  seam:  {ramp: dark, bands: [0.25, 0.55, 0.85]}
  scree: {ramp: mid,  bands: [0.3, 0.6, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [30, 46]
parts:
  # the scree mound it stands on
  - name: mound
    mat: scree
    hull: {round: 0.06, points: [[-0.95, 0.15, 0], [0.0, 0.0, 0], [0.95, 0.2, 0], [0.95, 1.55, 0], [-0.95, 1.6, 0], [-0.6, 0.45, 0.38], [0.55, 0.4, 0.34], [0.6, 1.3, 0.4], [-0.6, 1.3, 0.42]]}
  # the column: layers of hard rock pinched by soft dark seams
  - {name: layer-1, mat: rock, prism: {poly: [[-0.8, 0.35], [0.6, 0.3], [0.9, 0.7], [0.7, 1.3], [-0.7, 1.35], [-0.95, 0.8]], z: [0.3, 1.15], top: 0.85, lean: [-0.06, 0], round: 0.05}}
  - {name: seam-1, mat: seam, prism: {poly: [[-0.5, 0.55], [0.42, 0.52], [0.58, 0.8], [0.45, 1.15], [-0.45, 1.18], [-0.62, 0.85]], z: [1.05, 1.25], round: 0.03}}
  - {name: layer-2, mat: rock, prism: {poly: [[-0.72, 0.45], [0.48, 0.42], [0.74, 0.78], [0.55, 1.22], [-0.6, 1.25], [-0.85, 0.82]], z: [1.2, 1.95], top: 0.82, lean: [0.1, 0], round: 0.05}}
  - {name: seam-2, mat: seam, prism: {poly: [[-0.4, 0.6], [0.38, 0.6], [0.5, 0.85], [0.38, 1.1], [-0.38, 1.12], [-0.5, 0.86]], z: [1.9, 2.12], round: 0.03}}
  - {name: neck, mat: rock, prism: {poly: [[-0.4, 0.58], [0.5, 0.56], [0.64, 0.84], [0.48, 1.14], [-0.38, 1.15], [-0.52, 0.86]], z: [2.08, 2.6], top: 0.85, lean: [-0.05, 0], round: 0.05}}
  # the cap stone: wider than the neck, flat and lit on top
  - {name: cap-under, mat: seam, prism: {poly: [[-0.55, 0.55], [0.5, 0.52], [0.66, 0.82], [0.52, 1.15], [-0.52, 1.18], [-0.7, 0.86]], z: [2.56, 2.66], round: 0.02}}
  - {name: cap, mat: cap, prism: {poly: [[-0.8, 0.5], [0.55, 0.42], [0.92, 0.78], [0.7, 1.2], [-0.6, 1.26], [-0.94, 0.9]], z: [2.64, 3.05], top: 0.8, lean: [0.08, 0.02], round: 0.06}}
ground:
  - {name: rock-1, mat: scree, hull: {round: 0.04, points: [[0.55, -0.02, 0], [0.9, 0.0, 0], [0.88, 0.25, 0], [0.6, 0.22, 0], [0.72, 0.1, 0.2]]}}
  - {name: rock-2, mat: scree, hull: {round: 0.04, points: [[-0.9, 0.02, 0], [-0.62, 0.0, 0], [-0.66, 0.2, 0], [-0.88, 0.22, 0], [-0.78, 0.1, 0.15]]}}
variants:
  spire: {}
  # its cap fallen: a stump, the cap stone lying broken at its foot
  capless:
    drop: ["cap", "cap-under"]
    ground:
      - {name: cap-down, mat: cap, hull: {round: 0.05, points: [[0.15, -0.05, 0], [0.95, 0.0, 0], [0.95, 0.4, 0], [0.2, 0.35, 0], [0.25, 0.0, 0.3], [0.85, 0.05, 0.28], [0.85, 0.32, 0.26], [0.3, 0.3, 0.3]]}}
      - {name: rock-2, mat: scree, hull: {round: 0.04, points: [[-0.9, 0.02, 0], [-0.62, 0.0, 0], [-0.66, 0.2, 0], [-0.88, 0.22, 0], [-0.78, 0.1, 0.15]]}}
