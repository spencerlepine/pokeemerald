# Wroshyr tree (art:kashyyyk:wroshyr-tree), footprint 3x3, drawn 3x6. The route wall of Kashyyyk.
# Reference: the wroshyr trees of Kashyyyk (Revenge of the Sith; Jedi: Fallen Order): a colossal grey
# trunk with deep vertical folds, flaring at the foot into tall buttress roots that run out over the
# ground. Stand-in (owner): trunk and roots only, no canopy; the trunk runs off the top of the sprite
# into the canopy layer, so it is cut at the top on purpose. Axes: x east, y north, z up, origin on the
# ground at the south middle of the hit box.
name: kashyyyk_wroshyr-tree
art: art:kashyyyk:wroshyr-tree
palette: greybox
kits: [../scenery/kits/kashyyyk-felucia-small.yaml]
cells: [3, 6]
foot: [24, 95]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  bark:  {ramp: mid,  bands: [0.25, 0.55, 0.85]}
  fold:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
  ridge: {ramp: mid,  bands: [0.15, 0.45, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [48, 48]
params:
  ty: 1.75          # the trunk's centre, north of the hit box's south edge
  tr: 1.0          # trunk radius at the foot
parts:
  # the trunk: a tapering many-sided column with dark folds between broad ridges
  - {name: trunk, mat: bark, cone: {a: [0, "=ty", 0], b: [0, "=ty", 6], r1: "=tr", r2: "=tr*0.82"}}
  - name: ribs
    mat: bark
    ring: {c: [0, "=ty", 3], axis: z, r: "=tr*0.9", n: 7, start: 10, size: [0.62, 0.32, 6], round: 0.06}
  - name: folds
    mat: fold
    ring: {c: [0, "=ty", 3], axis: z, r: "=tr*0.82", n: 7, start: 35, size: [0.16, 0.2, 6], round: 0.02}
  # buttress roots: broad rounded fins, two to the sides, two to the south-west and south-east and a
  # low one south; each a smooth ridge of wood running down onto the ground
  - {use: wroshyr-root, name: root-w,  at: [-0.8, "=ty+0.1", 0], turn: 192, with: {len: 0.62, h: 1.6, w: 0.62}}
  - {use: wroshyr-root, name: root-e,  at: [0.8, "=ty+0.1", 0], turn: -12, with: {len: 0.62, h: 1.5, w: 0.62}}
  - {use: wroshyr-root, name: root-sw, at: [-0.55, "=ty-0.65", 0], turn: 228, with: {len: 1.3, h: 1.2, w: 0.66}}
  - {use: wroshyr-root, name: root-se, at: [0.55, "=ty-0.65", 0], turn: 312, with: {len: 1.3, h: 1.25, w: 0.66}}
  - {use: wroshyr-root, name: root-s,  at: [-0.05, "=ty-0.85", 0], turn: 268, with: {len: 0.7, h: 0.7, w: 0.62}}
