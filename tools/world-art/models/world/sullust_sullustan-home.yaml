# Sullustan home (art:sullust:sullustan-home), hit box 5x4, drawn 5x6.
# A rounded house of volcanic stone half built into the slope (reference: the Sullust home concepts): a
# low dome on a round stone ledge, a big round porthole door to the south with steps up to it, small
# portholes either side, a vent stack on top, black rock heaped against its back and sides.
# Variants: home, and bunker (dug in to the eaves: only the door and its porthole show).
# Axes: x east, y north, z up, origin on the ground at the hit box's south edge, middle.
name: sullust_sullustan-home
art: art:sullust:sullustan-home
palette: greybox
kits: [../scenery/kits/sullust-mustafar.yaml]
cells: [5, 6]
foot: [40, 96]
scale: 0.97
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.25, 0.55, 0.85]}
  rock:  {ramp: dark,  bands: [0.15, 0.45, 0.78]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [76, 60]
params:
  dy: 2.2           # the dome's centre
  dz: 0.3           # the ledge's height
parts:
  # the round stone ledge the house sits on
  - {name: ledge, mat: light, prism: {poly: [[-1.0, 0.45], [1.0, 0.45], [2.05, 1.1], [2.3, 2.2], [2.05, 3.3], [1.0, 3.95], [-1.0, 3.95], [-2.05, 3.3], [-2.3, 2.2], [-2.05, 1.1]], z: [0, "=dz"], round: 0.04}}
  # the dome
  - {name: dome, mat: stone, ellipsoid: {c: [0, "=dy", "=dz"], r: [1.85, 1.45, 1.3]}}
  # the round door: a light frame, a dark porthole, steps up to it
  - {use: porthole, name: door, at: [-0.15, "=dy - 1.42", "=dz + 0.62"], with: {r: 0.55}}
  - {name: steps, mat: stone, prism: {poly: [[-0.6, 0.12], [0.3, 0.12], [0.3, 0.6], [-0.6, 0.6]], z: [0, "=dz"], top: [1.0, 0.6], lean: [0, 0.12], round: 0.02}}
  # small portholes either side
  - {use: porthole, name: port-w, at: [-1.3, "=dy - 1.08", "=dz + 0.5"], rot: [0, 28, 0], with: {r: 0.24}}
  - {use: porthole, name: port-e, at: [1.2, "=dy - 1.12", "=dz + 0.5"], rot: [0, -28, 0], with: {r: 0.24}}
  - {use: porthole, name: port-top, at: [0.7, "=dy - 0.62", "=dz + 1.08"], rot: [0, 0, -40], with: {r: 0.17}}
  # the vent stack on top at the back
  - {name: stack, mat: light, cylinder: {a: [1.0, "=dy + 0.5", "=dz + 0.9"], b: [1.0, "=dy + 0.5", "=dz + 1.7"], r1: 0.16}}
  - {name: stack-cap, mat: dark, cylinder: {a: [1.0, "=dy + 0.5", "=dz + 1.7"], b: [1.0, "=dy + 0.5", "=dz + 1.8"], r1: 0.2}}
  # the slope it is built into: black rock heaped against its back and sides
  - {name: slope-w, mat: rock, hull: {points: [[-2.4, 1.6, 0], [-1.3, 2.6, 0], [-1.3, 3.95, 0], [-2.4, 3.95, 0], [-2.2, 3.0, 0.75], [-1.7, 3.5, 0.95], [-2.35, 2.2, 0.35]], round: 0.04}}
  - {name: slope-e, mat: rock, hull: {points: [[2.4, 1.7, 0], [1.3, 2.7, 0], [1.3, 3.95, 0], [2.4, 3.95, 0], [2.2, 3.0, 0.7], [1.7, 3.5, 0.9], [2.35, 2.3, 0.3]], round: 0.04}}
  - {name: slope-n, mat: rock, hull: {points: [[-1.6, 3.4, 0], [1.6, 3.4, 0], [1.6, 3.95, 0], [-1.6, 3.95, 0], [-1.0, 3.7, 1.1], [0.6, 3.75, 1.2]], round: 0.04}}
  # the bunker drawing: rock heaped over the dome to the eaves (dropped for the home)
  - {name: berm, mat: rock, hull: {points: [[-2.4, 1.1, 0], [-0.9, 0.85, 0], [0.6, 0.85, 0], [2.4, 1.1, 0], [2.4, 3.95, 0], [-2.4, 3.95, 0],
                                            [-1.9, 1.7, 0.85], [1.9, 1.7, 0.85], [-1.0, 1.05, 1.2], [0.7, 1.05, 1.2], [-1.1, 2.6, 1.6], [1.0, 2.6, 1.6], [0, 3.2, 1.6]], round: 0.04}}
variants:
  # the house on its ledge, the slope at its back
  home:
    drop: ["berm-*"]
  # dug in: a mound of black rock over the house, only the round door and the ledge show
  bunker:
    drop: ["port-*", "stack*", "slope-*", "dome"]
