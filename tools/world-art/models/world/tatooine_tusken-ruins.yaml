# Tusken ruins (art:tatooine:tusken-ruins), hit box 5x5, drawn 5x7: the top 2 rows stand over the cells behind.
# Reference: Tusken Raider sacred sites and the worn stone circles of the Jundland Wastes (the Tusken camps
# of The Mandalorian and The Book of Boba Fett). A ring of weathered standing stones, each a tall slab worn
# round on top, on a low round sand-stone dais with a step, a fire stone in the middle. One stone has
# fallen. Kit: standing-stone.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_tusken-ruins
art: art:tatooine:tusken-ruins
palette: greybox
kits: [../scenery/kits/tatooine-rest.yaml]
cells: [5, 7]
foot: [40, 111]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid,  bands: [0.25, 0.55, 0.85]}
  dais:  {ramp: bone, bands: [0.35, 0.65, 0.92]}
  step:  {ramp: bone, bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark, bands: [0.3, 0.6, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [78, 78]
parts:
  # the dais: a low round platform with a step, its octagon edge worn
  - {name: step, mat: step, prism: {poly: [[-1.0, 0.05], [1.0, 0.05], [2.35, 1.1], [2.4, 3.9], [1.0, 4.95], [-1.0, 4.95], [-2.4, 3.9], [-2.35, 1.1]], z: [0, 0.14], top: 0.98, round: 0.03}}
  - {name: dais, mat: dais, prism: {poly: [[-0.9, 0.35], [0.9, 0.35], [2.1, 1.25], [2.15, 3.75], [0.9, 4.65], [-0.9, 4.65], [-2.15, 3.75], [-2.1, 1.25]], z: [0.12, 0.28], top: 0.98, round: 0.03}}
  # the fire stone in the middle: a ring of dark blocks
  - ring: {name: hearth, c: [0, 2.5, 0.34], axis: z, r: 0.38, n: 7, size: [0.26, 0.18, 0.14], round: 0.03}
    mat: stone
  - {name: ash, mat: dark, cylinder: {a: [0, 2.5, 0.27], b: [0, 2.5, 0.31], r1: 0.28}}
  # the ring of stones
  - {use: standing-stone, name: stone-1, at: [0.0, 4.25, 0.28], turn: 0.0, with: {h: 1.5, w: 0.72, d: 0.44, lean: 0.08}}
  - {use: standing-stone, name: stone-2, at: [-1.19, 3.84, 0.28], turn: 40.0, with: {h: 1.8, w: 0.72, d: 0.44, lean: -0.06}}
  - {use: standing-stone, name: stone-3, at: [-1.82, 2.8, 0.28], turn: 80.0, with: {h: 1.3, w: 0.72, d: 0.44, lean: 0.0}}
  - {use: standing-stone, name: stone-4, at: [-1.6, 1.62, 0.28], turn: 120.0, with: {h: 1.7, w: 0.72, d: 0.44, lean: 0.08}}
  - {use: standing-stone, name: stone-5, at: [-0.63, 0.86, 0.28], turn: 160.0, with: {h: 1.9, w: 0.72, d: 0.44, lean: -0.06}}
  - {use: standing-stone, name: stone-6, at: [0.63, 0.86, 0.28], turn: 200.0, with: {h: 1.6, w: 0.72, d: 0.44, lean: 0.0}}
  - {use: standing-stone, name: stone-7, at: [1.6, 1.62, 0.28], turn: 240.0, with: {h: 1.2, w: 0.72, d: 0.44, lean: 0.08}}
  - {use: standing-stone, name: stone-8, at: [1.82, 2.8, 0.28], turn: 280.0, with: {h: 1.75, w: 0.72, d: 0.44, lean: -0.06}}
  - {use: standing-stone, name: stone-9, at: [1.19, 3.84, 0.28], turn: 320.0, with: {h: 1.45, w: 0.72, d: 0.44, lean: 0.0}}
  # the fallen stone (only in the fallen-stone variant), lying on the dais
  - {use: standing-stone, name: down, at: [-1.95, 1.35, 0.28], rot: [0, 0, -84], turn: 75, with: {h: 1.3, w: 0.72, d: 0.44, lean: 0}}
variants:
  ruins:
    drop: ["down/*"]
  # a stone has fallen out of the ring onto the dais
  fallen-stone:
    drop: ["stone-4/*"]
