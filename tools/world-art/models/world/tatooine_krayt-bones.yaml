# Krayt bones (art:tatooine:krayt-bones), hit box 4x3, drawn 4x4: the top row stands over the cells behind.
# Reference: the krayt dragon skeleton in the Dune Sea (A New Hope) and the krayt skull studies. The skull
# lies in profile at the east end, jaw half in the sand; behind it the spine runs west and sinks into a
# dune, a few pairs of curved ribs standing up out of the sand. Kit: krayt-skull, vertebra, krayt-rib.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_krayt-bones
art: art:tatooine:krayt-bones
palette: greybox
kits: [../scenery/kits/tatooine-rest.yaml]
cells: [4, 4]
foot: [32, 63]
scale: 0.95
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  bone: {ramp: bone, bands: [0.25, 0.55, 0.85]}
  hole: {ramp: dark, bands: [0.3, 0.6, 0.9]}
  sand: {ramp: bone, bands: [0.55, 0.8, 0.97]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [62, 46]
params:
  sy: 1.15        # the spine's line (m north)
  rh: 2.15        # the tallest rib
parts:
  - {use: krayt-skull, name: skull, at: [0.0, 0.75, -0.1], turn: -8, with: {s: 0.9}}
  # the spine, west of the skull, sinking into the sand
  - {use: vertebra, name: v1, at: [0.0, "=sy", 0.08]}
  - {use: vertebra, name: v2, at: [-0.36, "=sy", 0.05]}
  - {use: vertebra, name: v3, at: [-0.72, "=sy", 0.02]}
  - {use: vertebra, name: v4, at: [-1.08, "=sy", 0.0], with: {t: 0.26}}
  - {use: vertebra, name: v5, at: [-1.44, "=sy", -0.05], with: {t: 0.24}}
  - {use: vertebra, name: v6, at: [-1.78, "=sy", -0.12], with: {t: 0.2}}
  # rib pairs: the south rib of each pair bows toward the camera
  - {use: krayt-rib, name: rib-1s, at: [-0.36, "=sy", 0.2], with: {h: "=rh", s: -1, w: 0.5, back: -0.6, r: 0.08}}
  - {use: krayt-rib, name: rib-1n, at: [-0.36, "=sy", 0.2], with: {h: "=rh * 0.95", s: 1, w: 0.45, back: -0.6, r: 0.08}}
  - {use: krayt-rib, name: rib-2s, at: [-0.72, "=sy", 0.18], with: {h: "=rh * 0.95", s: -1, w: 0.5, back: -0.6, r: 0.08}}
  - {use: krayt-rib, name: rib-2n, at: [-0.72, "=sy", 0.18], with: {h: "=rh * 0.9", s: 1, w: 0.45, back: -0.6, r: 0.08}}
  - {use: krayt-rib, name: rib-3s, at: [-1.08, "=sy", 0.15], with: {h: "=rh * 0.8", s: -1, w: 0.45, back: -0.6, r: 0.08}}
  - {use: krayt-rib, name: rib-3n, at: [-1.08, "=sy", 0.15], with: {h: "=rh * 0.75", s: 1, w: 0.4, back: -0.5, r: 0.07}}
  - {use: krayt-rib, name: rib-4s, at: [-1.44, "=sy", 0.1], with: {h: "=rh * 0.6", s: -1, w: 0.4, back: -0.5, r: 0.07}}
ground:
  # the dune the tail end is buried in, and sand drifted against the jaw
  - {name: dune-w, mat: sand, ellipsoid: {c: [-1.5, 1.15, 0], r: [0.4, 0.7, 0.16]}}
  - {name: drift-jaw, mat: sand, ellipsoid: {c: [0.9, 0.45, 0], r: [0.85, 0.2, 0.12]}}
variants:
  bones: {}
  # only the skull and a few ribs show: the rest is under the sand
  buried:
    drop: ["v5/*", "v6/*", "rib-3*", "rib-4*"]
    ground:
      - {name: dune-w, mat: sand, ellipsoid: {c: [-1.25, 1.15, 0], r: [0.7, 0.8, 0.3]}}
      - {name: drift-jaw, mat: sand, ellipsoid: {c: [0.9, 0.45, 0], r: [0.85, 0.2, 0.12]}}
