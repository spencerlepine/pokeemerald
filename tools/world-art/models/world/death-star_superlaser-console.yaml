# Superlaser console (art:death-star:superlaser-console), hit box 2x2, drawn 2x3.
# Reference: the Death Star's superlaser fire-control stations (A New Hope, Rogue One): a black desk with
# a sloped key face, a tall wall panel behind it with green screens, and the round targeting display
# (the planet in its crosshairs) above. Axes: x east, y north, z up, origin on the floor at the hit box's
# south edge centre.
name: death-star_superlaser-console
art: art:death-star:superlaser-console
palette: greybox
kits: [../scenery/kits/deathstar-arena-jedha.yaml]
cells: [2, 3]
foot: [16, 47]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: dark,  bands: [0.1, 0.4, 0.75]}
  plate: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.4, 0.7, 0.95]}
  glow:  {ramp: light, bands: [0.0, 0.1, 0.3]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [32, 32]
parts:
  - {use: imperial-console, name: con, at: [0, 0.1, 0], with: {w: 1.74, bh: 1.65}}
  # the targeting display: a round screen in the middle of the panel, a crosshair on it
  - {name: target-frame, mat: plate, cylinder: {a: [0, 1.0, 1.2], b: [0, 0.68, 1.2], r1: 0.42}}
  - {name: target, mat: dark, cylinder: {a: [0, 0.72, 1.2], b: [0, 0.64, 1.2], r1: 0.33}}
  - {name: cross-h, mat: glow, box: {c: [0, 0.62, 1.2], half: [0.27, 0.02, 0.025]}}
  - {name: cross-v, mat: glow, box: {c: [0, 0.62, 1.2], half: [0.025, 0.02, 0.27]}}
  - {name: blip, mat: glow, ellipsoid: {c: [0.1, 0.61, 1.3], r: [0.07, 0.02, 0.07]}}
