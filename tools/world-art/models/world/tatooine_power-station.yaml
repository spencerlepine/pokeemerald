# Power station (art:tatooine:power-station), hit box 6x4, drawn 6x5. Tosche Station, Mos Espa.
# Reference: Tosche Station (A New Hope deleted scenes; the Anchorhead set): a squat adobe converter block,
# a stack of round power cells beside it joined by a pipe, and a wall of cooling fins on the far side.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 2 (x = -0.5).
name: tatooine_power-station
art: art:tatooine:power-station
palette: greybox
kits: [../scenery/kits/tatooine-buildings.yaml]
cells: [6, 5]
foot: [48, 48]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  metal: {ramp: light, bands: [0.3, 0.6, 0.88]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [92, 60]
templates:
  # one round power cell: a drum with a dark band and a light cap
  cell:
    params: {r: 0.55, h: 0.6}
    parts:
      - {name: drum, mat: metal, cylinder: {a: [0, 0, 0], b: [0, 0, "=h"], r1: "=r"}}
      - {name: band, mat: dark, cylinder: {a: [0, 0, "=h * 0.35"], b: [0, 0, "=h * 0.55"], r1: "=r + 0.03"}}
      - {name: cap, mat: trim, cylinder: {a: [0, 0, "=h"], b: [0, 0, "=h + 0.08"], r1: "=r * 0.92", r2: "=r * 0.75"}}
parts:
  # the converter block
  - {use: block, name: block, at: [-0.45, -0.45, 0], with: {w: 3.0, d: 2.5, h: 1.25, mat: adobe}}
  - {use: block, name: roof-box, at: [-0.15, -0.1, 1.25], with: {w: 1.2, d: 1.0, h: 0.4, mat: trim}}
  - {use: doorway, name: door, at: [-0.5, -1.7, 0], with: {w: 0.6, h: 0.85}}
  - {use: slot, name: win, at: [-1.45, -1.7, 0], with: {z: 0.75, w: 0.4}}
  - {name: mast, mat: dark, cylinder: {a: [-1.4, 0.3, 1.25], b: [-1.4, 0.3, 2.3], r1: 0.04}}
  # the stack of power cells, piped to the block
  - {use: cell, name: cell-1, at: [2.0, 0.35, 0], with: {r: 0.72, h: 0.6}}
  - {use: cell, name: cell-2, at: [2.0, 0.35, 0.68], with: {r: 0.62, h: 0.55}}
  - {use: cell, name: cell-3, at: [2.0, 0.35, 1.31], with: {r: 0.5, h: 0.5}}
  - {name: pipe, mat: mid, cylinder: {a: [1.0, -0.2, 0.85], b: [1.6, -0.2, 0.85], r1: 0.13}}
  - {use: cell, name: cell-s, at: [2.15, -1.3, 0], with: {r: 0.45, h: 0.55}}
  # the cooling fin wall on the west side
  - {name: fin-base, mat: mid, box: {c: [-2.5, 0.7, 0.12], half: [0.45, 0.85, 0.12], radius: 0.02}}
  - {name: fin-0, mat: metal, box: {c: [-2.85, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
  - {name: fin-1, mat: metal, box: {c: [-2.71, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
  - {name: fin-2, mat: metal, box: {c: [-2.57, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
  - {name: fin-3, mat: metal, box: {c: [-2.43, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
  - {name: fin-4, mat: metal, box: {c: [-2.29, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
  - {name: fin-5, mat: metal, box: {c: [-2.15, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
  - {name: fin-6, mat: metal, box: {c: [-2.01, 0.7, 0.7], half: [0.035, 0.75, 0.55], radius: 0.015}}
