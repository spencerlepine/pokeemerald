# Turbolift (art:death-star:turbolift), hit box 2x2, drawn 2x3. A warp tile.
# Reference: the Death Star's turbolift doors (A New Hope) and the lift cars in their shafts (Rogue One):
# a door set in a block of grey wall panelling, two leaves meeting in the middle, a light bar above that
# blinks, a call panel at the side, a floor plate in front. Variants: closed, open (the car's dark inside).
# Axes: x east, y north, z up, origin on the floor at the hit box's south edge centre.
name: death-star_turbolift
art: art:death-star:turbolift
palette: greybox
kits: [../scenery/kits/deathstar-arena-jedha.yaml]
cells: [2, 3]
foot: [16, 47]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
groups: {body: {}, face: {}}
materials:
  wall:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.15, 0.5, 0.82]}
  hull:  {ramp: mid,   bands: [0.4, 0.7, 0.95]}
  dark:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  glow:  {ramp: light, bands: [0.0, 0.1, 0.3]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [32, 32]
parts:
  # the wall block the shaft runs up behind
  - {name: block, mat: wall, prism: {poly: [[-0.9, 0.75], [0.85, 0.75], [0.85, 1.25], [-0.9, 1.25]], z: [0, 1.65], round: 0.03}}
  - {name: ribs, mat: dark, box: {c: [0, 1.0, 1.66], half: [0.8, 0.2, 0.02]}}
  - {use: imperial-door, name: door, at: [0, 0.7, 0], with: {w: 1.05, h: 1.3}}
  - {name: split, mat: dark, group: face, box: {c: [0, 0.66, 0.65], half: [0.025, 0.03, 0.62]}}
  - {name: back, mat: dark, group: face, box: {c: [0, 0.82, 0.65], half: [0.53, 0.04, 0.65]}}
  # the call panel and the floor plate in front
  - {name: call, mat: glow, group: face, box: {c: [0.76, 0.56, 0.8], half: [0.05, 0.03, 0.09]}}
  - {name: plate, mat: plate, prism: {poly: [[-0.7, 0.04], [0.7, 0.04], [0.7, 0.75], [-0.7, 0.75]], z: [0, 0.05], round: 0.01}}
  - {name: plate-line, mat: dark, box: {c: [0, 0.25, 0.05], half: [0.55, 0.03, 0.01]}}
variants:
  closed: {}
  # doors open: the dark car inside, the light bar lit
  open:
    drop: ["door/leaf-l", "door/leaf-r", "split"]
