# Wookiee hut (art:kashyyyk:wookiee-hut), footprint 5x4, drawn 5x6.
# Reference: the shore huts of Kachirho (Revenge of the Sith): round wooden houses on stilts over the
# lagoon's edge, a woven conical thatch roof, a plank deck in front with a ladder down. Round in plan,
# but kept shallow (an oval) so it fits the hit box: the deck takes the front rows.
# Axes: x east, y north, z up, origin on the ground at the south middle of the hit box.
name: kashyyyk_wookiee-hut
art: art:kashyyyk:wookiee-hut
palette: greybox
cells: [5, 6]
foot: [40, 95]
scale: 0.97
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  wall:  {ramp: mid,  bands: [0.25, 0.55, 0.85]}
  roof:  {ramp: bone, bands: [0.35, 0.65, 0.92]}
  weave: {ramp: mid,  bands: [0.3, 0.6, 0.9]}
  plank: {ramp: bone, bands: [0.3, 0.6, 0.9]}
  post:  {ramp: mid,  bands: [0.3, 0.6, 0.9]}
  dark:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [80, 64]
params:
  hy: 2.2           # the hut's centre
  fl: 0.6           # floor height on its stilts
parts:
  # stilts under the hut and the deck
  - {name: stilt-1, mat: post, cylinder: {a: [-1.6, "=hy-0.6", 0], b: [-1.6, "=hy-0.6", "=fl"], r1: 0.12}}
  - {name: stilt-2, mat: post, cylinder: {a: [1.6, "=hy-0.6", 0], b: [1.6, "=hy-0.6", "=fl"], r1: 0.12}}
  - {name: stilt-3, mat: post, cylinder: {a: [-1.3, 0.35, 0], b: [-1.3, 0.35, "=fl"], r1: 0.11}}
  - {name: stilt-4, mat: post, cylinder: {a: [1.3, 0.35, 0], b: [1.3, 0.35, "=fl"], r1: 0.11}}
  # the round house: a low oval drum of wall with a dark band of windows, the door to the south
  - name: floor
    mat: post
    prism: {poly: [[1.89, "=hy+0.43"], [0.78, "=hy+1.04"], [-0.78, "=hy+1.04"], [-1.89, "=hy+0.43"], [-1.89, "=hy-0.43"], [-0.78, "=hy-1.04"], [0.78, "=hy-1.04"], [1.89, "=hy-0.43"]], z: ["=fl-0.12", "=fl"], round: 0.02}
  - name: wall
    mat: wall
    prism: {poly: [[1.71, "=hy+0.39"], [0.71, "=hy+0.94"], [-0.71, "=hy+0.94"], [-1.71, "=hy+0.39"], [-1.71, "=hy-0.39"], [-0.71, "=hy-0.94"], [0.71, "=hy-0.94"], [1.71, "=hy-0.39"]], z: ["=fl", "=fl+1.45"], top: 0.97, round: 0.03}
  - {name: door, mat: dark, box: {c: [0, "=hy-0.98", "=fl+0.55"], half: [0.36, 0.1, 0.55], radius: 0.04}}
  - {name: window-w, mat: dark, box: {c: [-1.15, "=hy-0.8", "=fl+0.85"], half: [0.2, 0.1, 0.16], radius: 0.03}}
  - {name: window-e, mat: dark, box: {c: [1.15, "=hy-0.8", "=fl+0.85"], half: [0.2, 0.1, 0.16], radius: 0.03}}
  # the woven conical roof: an eight-sided cone, its eaves just over the wall, a woven band and a knot
  - name: roof
    mat: roof
    prism: {poly: [[2.03, "=hy+0.46"], [0.84, "=hy+1.12"], [-0.84, "=hy+1.12"], [-2.03, "=hy+0.46"], [-2.03, "=hy-0.46"], [-0.84, "=hy-1.12"], [0.84, "=hy-1.12"], [2.03, "=hy-0.46"]], z: ["=fl+1.3", "=fl+3.0"], top: 0.05, round: 0.03}
  - name: band
    mat: weave
    prism: {poly: [[1.50, "=hy+0.35"], [0.62, "=hy+0.84"], [-0.62, "=hy+0.84"], [-1.50, "=hy+0.35"], [-1.50, "=hy-0.35"], [-0.62, "=hy-0.84"], [0.62, "=hy-0.84"], [1.50, "=hy-0.35"]], z: ["=fl+1.72", "=fl+1.86"], top: 0.93, round: 0.02}
  - {name: finial, mat: post, cylinder: {a: [0, "=hy", "=fl+2.85"], b: [0, "=hy", "=fl+3.12"], r1: 0.1, r2: 0.04}}
  # the plank deck in front and the ladder down to the sand
  - {name: deck, mat: plank, box: {c: [0, 0.75, "=fl-0.06"], half: [1.45, 0.55, 0.06], radius: 0.02}}
  - {name: rail-w, mat: post, box: {c: [-1.4, 0.75, "=fl+0.25"], half: [0.05, 0.5, 0.04]}}
  - {name: rail-e, mat: post, box: {c: [1.4, 0.75, "=fl+0.25"], half: [0.05, 0.5, 0.04]}}
  - {name: ladder-l, mat: post, box: {c: [-0.28, 0.12, "=fl/2"], half: [0.04, 0.04, "=fl/2"]}}
  - {name: ladder-r, mat: post, box: {c: [0.28, 0.12, "=fl/2"], half: [0.04, 0.04, "=fl/2"]}}
  - {name: rung-1, mat: post, box: {c: [0, 0.1, 0.25], half: [0.28, 0.03, 0.025]}}
  - {name: rung-2, mat: post, box: {c: [0, 0.1, 0.5], half: [0.28, 0.03, 0.025]}}
