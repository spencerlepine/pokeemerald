# Podrace arena (art:tatooine:podrace-arena), hit box 8x5, drawn 8x5. Mos Espa (Watto's arena).
# Reference: the Mos Espa Grand Arena (The Phantom Menace): a long outer wall with buttresses, the
# raked grandstand stepping down behind it toward the track, round domed towers at the ends, the
# central gate under a raised box, and flags along the top of the wall.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 4 (x = 0.5).
name: tatooine_podrace-arena
art: art:tatooine:podrace-arena
palette: greybox
kits: [../scenery/kits/tatooine-buildings.yaml]
cells: [8, 5]
foot: [64, 44]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [124, 76]
parts:
  # the grandstand, stepping down northward from the wall
  - {name: step-0, mat: trim, box: {c: [0, -0.99, 0.810], half: [3.0, 0.27, 0.810], radius: 0.02}}
  - {name: step-1, mat: adobe, box: {c: [0, -0.47, 0.690], half: [3.0, 0.27, 0.690], radius: 0.02}}
  - {name: step-2, mat: trim, box: {c: [0, 0.05, 0.570], half: [3.0, 0.27, 0.570], radius: 0.02}}
  - {name: step-3, mat: adobe, box: {c: [0, 0.57, 0.450], half: [3.0, 0.27, 0.450], radius: 0.02}}
  - {name: step-4, mat: trim, box: {c: [0, 1.09, 0.330], half: [3.0, 0.27, 0.330], radius: 0.02}}
  - {name: step-5, mat: adobe, box: {c: [0, 1.61, 0.210], half: [3.0, 0.27, 0.210], radius: 0.02}}
  # the outer wall with buttresses
  - {name: wall, mat: adobe, box: {c: [0, -1.55, 0.9], half: [3.1, 0.3, 0.9], radius: 0.04}}
  - {name: wall-cap, mat: trim, box: {c: [0, -1.5, 1.82], half: [3.1, 0.36, 0.06], radius: 0.02}}
  - {name: butt-1, mat: trim, box: {c: [-2.4, -1.9, 0.8], half: [0.14, 0.1, 0.8], radius: 0.02}}
  - {name: butt-2, mat: trim, box: {c: [-1.3, -1.9, 0.8], half: [0.14, 0.1, 0.8], radius: 0.02}}
  - {name: butt-3, mat: trim, box: {c: [2.1, -1.9, 0.8], half: [0.14, 0.1, 0.8], radius: 0.02}}
  - {use: slot, name: arch-1, at: [-1.85, -1.85, 0], with: {z: 0.7, w: 0.4, h: 0.55}}
  - {use: slot, name: arch-2, at: [-0.75, -1.85, 0], with: {z: 0.7, w: 0.4, h: 0.55}}
  - {use: slot, name: arch-3, at: [1.6, -1.85, 0], with: {z: 0.7, w: 0.4, h: 0.55}}
  - {use: slot, name: arch-4, at: [2.6, -1.85, 0], with: {z: 0.7, w: 0.4, h: 0.55}}
  # the central gate under the raised box
  - {use: block, name: gatehouse, at: [0.5, -1.55, 0], with: {w: 1.5, d: 1.0, h: 2.15, mat: trim, lip: adobe}}
  - {use: doorway, name: gate, at: [0.5, -2.05, 0], with: {w: 0.8, h: 1.05}}
  - {use: slot, name: box-win, at: [0.5, -2.05, 0], with: {z: 1.7, w: 0.9, h: 0.22}}
  # the end towers
  - {use: round-tower, name: tower-w, at: [-3.2, -1.25, 0], with: {r: 0.58, h: 2.0}}
  - {use: round-tower, name: tower-e, at: [3.2, -1.25, 0], with: {r: 0.58, h: 2.0}}
  # flags along the wall top
  - {use: flag, name: flag-1, at: [-2.4, -1.55, 1.85], with: {h: 0.75}}
  - {use: flag, name: flag-2, at: [-1.3, -1.55, 1.85], with: {h: 0.75}}
  - {use: flag, name: flag-3, at: [2.1, -1.55, 1.85], with: {h: 0.75}}
  - {use: flag, name: flag-4, at: [0.5, -1.15, 2.2], with: {h: 0.9, w: 0.5, cloth: trim}}
