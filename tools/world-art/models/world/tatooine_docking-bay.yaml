# Docking bay (art:tatooine:docking-bay), hit box 8x8, drawn 8x9. Mos Eisley (Docking Bay 94); also used at
# Jabba's palace, Kachirho and Route 118.
# Reference: Docking Bay 94 (A New Hope): a round pit open to the sky, ringed by a thick adobe wall with
# buttresses, the gate block on the south with its door, a light freighter standing on the floor inside.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 4 (x = 0.5).
name: tatooine_docking-bay
art: art:tatooine:docking-bay
palette: greybox
kits: [../scenery/kits/tatooine-buildings.yaml]
cells: [8, 9]
foot: [64, 80]
footprint: 8
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  floor: {ramp: bone,  bands: [0.75, 0.97, 0.99]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
groups:
  body: {}
  wall: {}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 8}
box: [124, 124]
params:
  ro: 3.72         # the wall's outside
  ri: 3.2          # its inside
  wh: 0.95         # its height
parts:
  # the ring wall and its buttresses
  - {name: wall, mat: adobe, group: wall, cylinder: {a: [0, 0, 0], b: [0, 0, "=wh"], r1: "=ro"}}
  - {name: well, mat: adobe, group: wall, op: subtract, cylinder: {a: [0, 0, 0.03], b: [0, 0, 2], r1: "=ri"}}
  - {name: cap, mat: trim, group: wall, cylinder: {a: [0, 0, "=wh - 0.06"], b: [0, 0, "=wh + 0.04"], r1: "=ro - 0.04"}}
  - name: ribs
    mat: trim
    ring: {c: [0, 0, "=wh / 2"], axis: z, r: "=ro", n: 18, start: 10, size: [0.3, 0.3, "=wh"], round: 0.02}
  - {name: floor, mat: floor, cylinder: {a: [0, 0, 0], b: [0, 0, 0.05], r1: "=ri + 0.05"}}
  - {name: pad, mat: mid, cylinder: {a: [-0.1, 0.25, 0], b: [-0.1, 0.25, 0.07], r1: 1.9}}
  # the gate block on the south, its door through the wall
  - {use: block, name: gate, at: [0.5, -3.38, 0], with: {w: 1.7, d: 0.75, h: 1.35, mat: trim, lip: adobe}}
  - {use: doorway, name: door, at: [0.5, -3.76, 0], with: {w: 0.7, h: 0.95}}
  # the freighter on the floor, and crates
  - {use: freighter, name: ship, at: [-0.2, 0.35, 0], turn: 25, with: {s: 0.95, lift: 0.28}}
  - {use: block, name: crate-1, at: [2.2, -1.2, 0], with: {w: 0.55, d: 0.5, h: 0.45, mat: mid, lip: mid, rnd: 0.03}}
  - {use: block, name: crate-2, at: [2.4, -0.55, 0], with: {w: 0.45, d: 0.45, h: 0.38, mat: trim, lip: trim, rnd: 0.03}}
variants:
  # a freighter in the bay
  occupied: {}
  # the bay empty
  empty:
    drop: ["ship/*"]
