# Freighter parked (art:tatooine:freighter-parked), hit box 6x4, drawn 6x5.
# Reference: a YT-1300 light freighter, the Millennium Falcon (freighter-parked__db_millennium-falcon,
# __web_1-3): a round saucer hull, two forward mandibles with the slot between them, the tube cockpit on
# the starboard side, a radar dish on the upper hull, the gun turret in the middle, the engine glow strip
# round the stern. Drawn for the 3/4 camera (owner, 2026-11-04): the saucer is an oval 0.7 as deep as
# wide on a thick side wall that shows head-on; nose east, the cockpit tube proud on the south side, the
# dish standing up. The hull is the `yt1300` template in kits/freighters.yaml. Short legs, its own shadow.
# Ship axes: x forward (nose), y to port (north), z up, origin on the ground under the saucer's centre.
name: tatooine_freighter-parked
art: art:tatooine:freighter-parked
palette: greybox
kits: [../scenery/kits/freighters.yaml]
cells: [6, 5]
foot: [42, 47]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: light, bands: [0.25, 0.55, 0.88]}
  plate: {ramp: mid,   bands: [0.15, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  glass: {ramp: dark,  bands: [0.4, 0.7, 0.95]}
  shade: {color: shade}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [96, 64]
groups: {body: {}, saucer: {}, engines: {}}
parts:
  - {use: yt1300, name: ship, with: {R: 1.9, k: 0.7, zh: 0.2, w: 0.62, d: 0.25, reach: 1.2}}
ground:
  # the ship's shadow on the deck under it, and the boarding ramp let down at the stern
  - {name: under, mat: shade, cylinder: {a: [0.3, -0.25, 0], b: [0.3, -0.25, 0.01], r1: 2.0}, squash: {scale: [1, 0.75, 1], center: [0.3, -0.25, 0]}}
  - {name: ramp, mat: plate, hull: {points: [[-1.7, -0.3, 0.3], [-1.7, 0.3, 0.3], [-2.45, -0.34, 0.0], [-2.45, 0.34, 0.0],
                                              [-1.7, -0.3, 0.36], [-1.7, 0.3, 0.36], [-2.45, -0.34, 0.06], [-2.45, 0.34, 0.06]], round: 0.01}}
variants:
  parked: {}
  # ready to leave: the boarding ramp up
  ramp-up:
    ground:
      - {name: under, mat: shade, cylinder: {a: [0.3, -0.25, 0], b: [0.3, -0.25, 0.01], r1: 2.0}, squash: {scale: [1, 0.75, 1], center: [0.3, -0.25, 0]}}
