# Band stage (art:new:band-stage), hit box 4x2, drawn 4x3.
# Reference: the Modal Nodes' corner of the Mos Eisley cantina (A New Hope) and the Max Rebo Band's
# stage in Jabba's palace (Return of the Jedi): a low round-fronted platform with a step, a curved
# shell wall behind it, speaker cabinets at the back corners and a microphone at the front.
# Axes: x east, y north, z up, origin on the ground at the footprint's south-west corner.
name: new_band-stage
art: art:new:band-stage
palette: greybox
cells: [4, 3]
foot: [0, 48]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  deck:  {ramp: bone,  bands: [0.25, 0.55, 0.85]}
  shell: {ramp: light, bands: [0.25, 0.55, 0.88]}
  front: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  grill: {ramp: mid,   bands: [0.45, 0.75, 0.95]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [62, 30]
groups: {shell: {}, body: {}}
params:
  cx: 1.97
  cy: 1.02
  sq: 0.46         # the oval's y squash
parts:
  # the platform: a flattened oval, a lower step in front
  - {name: step, mat: front, cylinder: {a: ["=cx", "=cy", 0], b: ["=cx", "=cy", 0.16], r1: 1.86}, squash: {scale: [1, "=sq", 1], center: ["=cx", "=cy", 0]}}
  - {name: deck, mat: front, cylinder: {a: ["=cx", "=cy + 0.05", 0], b: ["=cx", "=cy + 0.05", 0.34], r1: 1.7}, squash: {scale: [1, "=sq", 1], center: ["=cx", "=cy", 0]}}
  - {name: deck-top, mat: deck, cylinder: {a: ["=cx", "=cy + 0.05", 0.3], b: ["=cx", "=cy + 0.05", 0.36], r1: 1.67}, squash: {scale: [1, "=sq", 1], center: ["=cx", "=cy", 0]}}
  # the curved shell wall behind it, open to the south
  - {name: shell, mat: shell, group: shell, cylinder: {a: ["=cx", "=cy", 0], b: ["=cx", "=cy", 1.05], r1: 1.9}, squash: {scale: [1, "=sq", 1], center: ["=cx", "=cy", 0]}}
  - {name: shell-in, mat: shell, group: shell, op: subtract, cylinder: {a: ["=cx", "=cy", -0.1], b: ["=cx", "=cy", 2], r1: 1.67}, squash: {scale: [1, "=sq", 1], center: ["=cx", "=cy", 0]}}
  - {name: shell-cut, mat: shell, group: shell, op: subtract, box: {c: ["=cx", "=cy - 1.0", 0.8], half: [2.5, 1.0, 1.0]}}
  - {name: shell-top, mat: shell, group: shell, op: subtract, ellipsoid: {c: ["=cx", "=cy - 0.6", 1.75], r: [2.6, 1.0, 0.8]}}
  # speaker cabinets at the back corners
  - {name: spk-w, mat: dark, box: {c: [0.75, 1.42, 0.68], half: [0.28, 0.18, 0.34], radius: 0.03}}
  - {name: cone-w, mat: grill, cylinder: {a: [0.75, 1.24, 0.72], b: [0.75, 1.22, 0.72], r1: 0.16}, rot: [0, 0, 90]}
  - {name: spk-e, mat: dark, box: {c: [3.19, 1.42, 0.68], half: [0.28, 0.18, 0.34], radius: 0.03}}
  - {name: cone-e, mat: grill, cylinder: {a: [3.19, 1.24, 0.72], b: [3.19, 1.22, 0.72], r1: 0.16}, rot: [0, 0, 90]}
  # the microphone at the front
  - {name: mic, mat: dark, cylinder: {a: [2.4, 0.75, 0.34], b: [2.4, 0.75, 1.15], r1: 0.03}}
  - {name: mic-head, mat: grill, ellipsoid: {c: [2.4, 0.74, 1.18], r: [0.07, 0.07, 0.08]}}
  - {name: mic-foot, mat: dark, cylinder: {a: [2.4, 0.75, 0.34], b: [2.4, 0.75, 0.38], r1: 0.13}}
  # a horn instrument left on its stand
  - {name: horn, mat: grill, cone: {a: [1.3, 1.0, 0.5], b: [1.45, 0.9, 1.05], r1: 0.05, r2: 0.15}}
  # a drum set at the back and a second horn
  - {name: drum-1, mat: front, cylinder: {a: [1.75, 1.35, 0.34], b: [1.75, 1.35, 0.68], r1: 0.24}}
  - {name: drum-1-top, mat: deck, cylinder: {a: [1.75, 1.35, 0.68], b: [1.75, 1.35, 0.7], r1: 0.22}}
  - {name: drum-2, mat: front, cylinder: {a: [2.2, 1.4, 0.34], b: [2.2, 1.4, 0.6], r1: 0.17}}
  - {name: drum-2-top, mat: deck, cylinder: {a: [2.2, 1.4, 0.6], b: [2.2, 1.4, 0.62], r1: 0.15}}
  - {name: cym-post, mat: dark, cylinder: {a: [2.5, 1.5, 0.34], b: [2.5, 1.5, 0.95], r1: 0.025}}
  - {name: cymbal, mat: grill, cylinder: {a: [2.5, 1.5, 0.95], b: [2.5, 1.5, 0.98], r1: 0.2, r2: 0.05}}
  - {name: horn-2, mat: grill, cone: {a: [2.85, 0.95, 0.5], b: [2.75, 0.85, 0.95], r1: 0.05, r2: 0.14}}
