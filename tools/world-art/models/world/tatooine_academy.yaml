# Academy (art:tatooine:academy), hit box 6x4, drawn 6x5. Bestine.
# Reference: the Bestine school and civic halls (Star Wars Galaxies; Mos Espa's stepped adobe): a tall
# central hall under a dome with a spire, a big arched entrance, lower wings either side, and a holo
# board out front.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 3 (x = 0.5).
name: tatooine_academy
art: art:tatooine:academy
palette: greybox
kits: [../scenery/kits/tatooine-buildings.yaml]
cells: [6, 5]
foot: [48, 48]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [92, 60]
parts:
  # the central hall, its dome and spire
  - {use: block, name: hall, at: [0.5, -0.3, 0], with: {w: 2.3, d: 2.7, h: 1.6, mat: trim}}
  - {use: dome, name: dome, at: [0.5, -0.15, 1.6], with: {r: 0.95, h: 0.5, drum: 0.2, mat: adobe}}
  - {name: spire, mat: trim, cone: {a: [0.5, -0.15, 2.2], b: [0.5, -0.15, 2.75], r1: 0.09, r2: 0.02}}
  - {use: arch-frame, name: arch, at: [0.5, -1.7, 0], with: {w: 0.85, h: 1.35}}
  # the wings
  - {use: block, name: wing-w, at: [-1.75, -0.4, 0], with: {w: 2.3, d: 2.3, h: 1.0, mat: adobe, lip: trim}}
  - {use: block, name: wing-e, at: [2.2, -0.4, 0], with: {w: 1.3, d: 2.3, h: 1.0, mat: adobe, lip: trim}}
  - {use: slot, name: win-w1, at: [-2.4, -1.55, 0], with: {z: 0.55}}
  - {use: slot, name: win-w2, at: [-1.2, -1.55, 0], with: {z: 0.55}}
  - {use: slot, name: win-e1, at: [2.3, -1.55, 0], with: {z: 0.55}}
  # the holo board out front
  - {use: holo-board, name: board, at: [-1.75, -1.72, 0], with: {w: 1.0, h: 1.1}}
