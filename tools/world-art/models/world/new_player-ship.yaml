# Player's ship (art:new:player-ship), hit box 8x5, drawn 8x6. Parked in every hangar room.
# The owner's pick (2026-11-04): the Millennium Falcon, Han's YT-1300, which flies the player between
# planets from Act 1. Same model as art:tatooine:freighter-parked (references there), scaled up to the
# hangar's 8x5 hit box: the saucer, the two mandibles, the cockpit tube on the south side, the dish,
# the turret, the engine strip round the stern, landing legs and the boarding ramp. Drawn for the 3/4
# camera (owner, 2026-11-04): an oval saucer 0.7 as deep as wide on a thick side wall that shows
# head-on, the cockpit tube proud on the south side, the dish standing up (kits/freighters.yaml).
# Ship axes: x forward (nose), y to port (north), z up, origin on the ground under the saucer's centre.
name: new_player-ship
art: art:new:player-ship
palette: greybox
kits: [../scenery/kits/freighters.yaml]
cells: [8, 6]
foot: [55, 58]
scale: 1.2
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: light, bands: [0.25, 0.55, 0.88]}
  plate: {ramp: mid,   bands: [0.15, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  glass: {ramp: dark,  bands: [0.4, 0.7, 0.95]}
  shade: {color: shade}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [126, 78]
groups: {body: {}, saucer: {}, engines: {}}
parts:
  - {use: yt1300, name: ship, with: {R: 2.15, k: 0.63, zh: 0.2, w: 0.62, d: 0.25, reach: 1.4}}
ground:
  # the ship's shadow on the deck under it, and the boarding ramp let down on the south (starboard) side
  - {name: under, mat: shade, cylinder: {a: [0.4, -0.3, 0], b: [0.4, -0.3, 0.01], r1: 2.4}, squash: {scale: [1, 0.75, 1], center: [0.4, -0.3, 0]}}
  - {name: ramp, mat: plate, hull: {points: [[-1.3, -1.45, 0.3], [-0.5, -1.45, 0.3], [-1.35, -2.3, 0.0], [-0.45, -2.3, 0.0],
                                              [-1.3, -1.45, 0.36], [-0.5, -1.45, 0.36], [-1.35, -2.3, 0.06], [-0.45, -2.3, 0.06]], round: 0.01}}
variants:
  ramp-down: {}
  # ready to leave: the boarding ramp up
  ramp-up:
    ground:
      - {name: under, mat: shade, cylinder: {a: [0.4, -0.3, 0], b: [0.4, -0.3, 0.01], r1: 2.4}, squash: {scale: [1, 0.75, 1], center: [0.4, -0.3, 0]}}
