# Ash farm (art:sullust:ash-farm), hit box 6x4, drawn 6x6.
# A low stone farmhouse with a greenhouse dome (reference: the Sullust farm concepts): a round stone drum
# under a ribbed glass dome in the middle, two low stone wings with sloped glass roofs either side, and
# a gabled entry porch with steps on the south. Axes: x east, y north, z up, origin on the ground at the
# hit box's south edge, middle.
name: sullust_ash-farm
art: art:sullust:ash-farm
palette: greybox
kits: [../scenery/kits/sullust-mustafar.yaml]
cells: [6, 6]
foot: [48, 96]
scale: 0.97
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.25, 0.55, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  roof:  {ramp: dark,  bands: [0.1, 0.4, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [92, 60]
params:
  dy: 2.15          # the dome's centre
parts:
  # the stone drum and the glass dome on it
  - {name: drum, mat: stone, cylinder: {a: [0, "=dy", 0], b: [0, "=dy", 0.75], r1: 1.35}}
  - {name: drum-cap, mat: light, cylinder: {a: [0, "=dy", 0.72], b: [0, "=dy", 0.82], r1: 1.4}}
  - {use: glass-dome, name: dome, at: [0, "=dy", 0.8], with: {r: 1.3}}
  # the two wings, stone walls with a gabled glass roof and small dark windows
  - {name: wing-w, mat: stone, box: {c: [-2.03, 2.0, 0.42], half: [0.87, 1.15, 0.42], radius: 0.04}}
  - {name: win-w1, mat: dark, box: {c: [-2.5, 0.84, 0.45], half: [0.16, 0.04, 0.16]}}
  - {name: win-w2, mat: dark, box: {c: [-1.6, 0.84, 0.45], half: [0.16, 0.04, 0.16]}}
  - {name: wing-e, mat: stone, box: {c: [2.03, 2.0, 0.42], half: [0.87, 1.15, 0.42], radius: 0.04}}
  - {name: win-e1, mat: dark, box: {c: [1.6, 0.84, 0.45], half: [0.16, 0.04, 0.16]}}
  - {name: win-e2, mat: dark, box: {c: [2.5, 0.84, 0.45], half: [0.16, 0.04, 0.16]}}
  - {name: roof-w, mat: roof, extrude: {axis: x, span: [-2.84, -1.16], profile: [[0.82, 0.8], [3.12, 0.8], [3.12, 0.92], [2.1, 1.5], [0.82, 0.92]], round: 0.02}}
  - {name: mull-w0, mat: light, extrude: {axis: x, span: [-2.823, -2.745], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-w1, mat: light, extrude: {axis: x, span: [-2.415, -2.338], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-w2, mat: light, extrude: {axis: x, span: [-2.008, -1.930], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-w3, mat: light, extrude: {axis: x, span: [-1.600, -1.523], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-w4, mat: light, extrude: {axis: x, span: [-1.193, -1.115], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: roof-e, mat: roof, extrude: {axis: x, span: [1.16, 2.84], profile: [[0.82, 0.8], [3.12, 0.8], [3.12, 0.92], [2.1, 1.5], [0.82, 0.92]], round: 0.02}}
  - {name: mull-e0, mat: light, extrude: {axis: x, span: [1.115, 1.193], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-e1, mat: light, extrude: {axis: x, span: [1.523, 1.600], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-e2, mat: light, extrude: {axis: x, span: [1.930, 2.008], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-e3, mat: light, extrude: {axis: x, span: [2.338, 2.415], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  - {name: mull-e4, mat: light, extrude: {axis: x, span: [2.745, 2.823], profile: [[0.78, 0.86], [3.16, 0.86], [3.16, 0.98], [2.1, 1.58], [0.78, 0.98]], round: 0.01}}
  # the gabled entry porch, its door, the steps
  - {name: porch, mat: stone, extrude: {axis: y, span: [0.5, 1.2], profile: [[-0.6, 0], [0.6, 0], [0.6, 0.85], [0, 1.25], [-0.6, 0.85]], round: 0.03}}
  - {name: porch-roof, mat: light, extrude: {axis: y, span: [0.45, 1.25], profile: [[-0.7, 0.8], [0, 1.3], [0.7, 0.8], [0.7, 0.9], [0, 1.4], [-0.7, 0.9]], round: 0.02}}
  - {name: door, mat: dark, box: {c: [0, 0.47, 0.35], half: [0.25, 0.04, 0.35]}}
  - {name: steps, mat: light, prism: {poly: [[-0.45, 0.12], [0.45, 0.12], [0.45, 0.5], [-0.45, 0.5]], z: [0, 0.18], top: [1.0, 0.5], lean: [0, 0.1], round: 0.02}}
