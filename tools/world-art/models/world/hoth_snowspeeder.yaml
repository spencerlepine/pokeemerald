# Parked snowspeeder (art:hoth:snowspeeder), hit box 3x2, drawn 3x3.
# Reference: the T-47 airspeeder (The Empire Strikes Back; wiki/art/concept/hoth/snowspeeder__*): a flat
# wedge with an angular nose, the two-seat cockpit with its framed canopy in the middle, two long laser
# cannons along the sides and the boxy engine block with the harpoon gun at the back. Nose east,
# parked on the snow, turned a little off the grid.
# Axes: x forward (east), y north, z up, origin on the ground under the speeder's middle.
name: hoth_snowspeeder
art: art:hoth:snowspeeder
palette: greybox
cells: [3, 3]
foot: [24, 32]
footprint: 2
turn: -6
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  mid:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  snow:  {ramp: bone,  bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [44, 28]
parts:
  # the wedge body: wide at the back, faceted nose
  - name: body
    mat: hull
    hull: {points: [[-1.15, -0.75, 0.1], [-1.15, 0.75, 0.1], [-1.15, -0.65, 0.5], [-1.15, 0.65, 0.5],
                    [0.6, -0.55, 0.1], [0.6, 0.55, 0.1], [0.6, -0.4, 0.42], [0.6, 0.4, 0.42],
                    [1.35, -0.12, 0.12], [1.35, 0.12, 0.12], [1.3, -0.08, 0.2], [1.3, 0.08, 0.2]], round: 0.03}
  - {name: cockpit, mat: dark, prism: {poly: [[-0.45, -0.3], [0.35, -0.25], [0.35, 0.25], [-0.45, 0.3]], z: [0.4, 0.65], top: [0.7, 0.75], round: 0.03}}
  - {name: frame, mat: mid, box: {c: [-0.05, 0, 0.64], half: [0.04, 0.3, 0.03]}}
  - {name: engine, mat: mid, box: {c: [-0.95, 0, 0.55], half: [0.3, 0.45, 0.12], radius: 0.03}}
  - {name: harpoon, mat: dark, cylinder: {a: [-1.15, 0, 0.62], b: [-1.4, 0, 0.62], r1: 0.06}}
  # the laser cannons along each side
  - {name: gun-s, mat: mid, cylinder: {a: [-0.9, -0.78, 0.28], b: [1.0, -0.62, 0.28], r1: 0.07}}
  - {name: gun-n, mat: mid, cylinder: {a: [-0.9, 0.78, 0.28], b: [1.0, 0.62, 0.28], r1: 0.07}}
  - {name: tip-s, mat: dark, cylinder: {a: [1.0, -0.62, 0.28], b: [1.25, -0.6, 0.28], r1: 0.035}}
  - {name: tip-n, mat: dark, cylinder: {a: [1.0, 0.62, 0.28], b: [1.25, 0.6, 0.28], r1: 0.035}}
  - {name: flap-s, mat: mid, box: {c: [-1.0, -0.72, 0.3], half: [0.15, 0.05, 0.12]}}
  - {name: flap-n, mat: mid, box: {c: [-1.0, 0.72, 0.3], half: [0.15, 0.05, 0.12]}}
ground:
  - {name: drift, mat: snow, ellipsoid: {c: [0.3, -0.8, 0], r: [0.9, 0.15, 0.1]}}
variants:
  parked: {}
  # crashed nose-first in the snow (Luke's at the Battle of Hoth)
  crashed:
    tilt: [-12, 10]
    pivot: [1.2, 0]
    sink: 0.15
