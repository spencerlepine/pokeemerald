# Ice stalagmites (art:hoth:ice-stalagmites), hit box 1x2, drawn 1x3.
# Reference: the ice cave of the wampa (The Empire Strikes Back; wiki/art/concept/hoth/ice-stalagmites__*):
# tall pointed ice spikes rising from the cave floor. Three spikes of different heights, faceted cones,
# standing in a small frozen pool (flat, light) at their foot.
# Axes: x east, y north, z up, origin on the ground at the middle of the hit box.
name: hoth_ice-stalagmites
art: art:hoth:ice-stalagmites
palette: greybox
cells: [1, 3]
foot: [8, 32]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  ice:   {ramp: light, bands: [0.25, 0.55, 0.85]}
  pool:  {ramp: mid,   bands: [0.1, 0.4, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [14, 30]
parts:
  - {name: pool, mat: pool, cylinder: {a: [0, -0.35, 0], b: [0, -0.35, 0.03], r1: 0.45}, squash: [1, 0.7, 1]}
  - {name: spike-1, mat: ice, prism: {poly: [[-0.2, 0.15], [0.05, 0.05], [0.18, 0.3], [-0.05, 0.5], [-0.25, 0.35]], z: [0, 1.6], top: 0.05, lean: [0.03, 0], round: 0.02}}
  - {name: spike-2, mat: ice, prism: {poly: [[0.05, -0.35], [0.3, -0.3], [0.32, -0.05], [0.1, 0.0]], z: [0, 0.95], top: 0.05, lean: [0.05, 0], round: 0.02}}
  - {name: spike-3, mat: ice, prism: {poly: [[-0.38, -0.25], [-0.15, -0.3], [-0.12, -0.05], [-0.35, -0.02]], z: [0, 0.65], top: 0.05, lean: [-0.05, 0], round: 0.02}}
  - {name: spike-4, mat: ice, prism: {poly: [[0.12, 0.5], [0.35, 0.55], [0.3, 0.8], [0.12, 0.75]], z: [0, 1.05], top: 0.05, round: 0.02}}
