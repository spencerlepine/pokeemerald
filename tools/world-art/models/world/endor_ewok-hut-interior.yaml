  - {name: drape-e, mat: fur, prism: {poly: [[1.9, 5.95], [3.1, 5.95], [3.1, 6.0], [1.9, 6.0]], z: [0.5, 1.6], round: 0.02}}
  # the side walls, edge-on, and the low sill along the south with the doorway gap
  - {name: side-w, mat: log, box: {c: [-3.92, 3.1, 0.15], half: [0.08, 3.2, 0.15], radius: 0.02}}
  - {name: side-e, mat: log, box: {c: [3.92, 3.1, 0.15], half: [0.08, 3.2, 0.15], radius: 0.02}}
  - {name: sill-w, mat: log, cylinder: {a: [-3.95, 0.12, 0.12], b: [-1.05, 0.12, 0.12], r1: 0.12}}
  - {name: sill-e, mat: log, cylinder: {a: [1.05, 0.12, 0.12], b: [3.95, 0.12, 0.12], r1: 0.12}}
  # the tree trunk the hut is built round (cells 3-4, rows 2-3)
