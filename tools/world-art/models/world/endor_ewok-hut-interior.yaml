    mat: stone
    ring: {c: [0, 2.4, 0.12], axis: z, r: 0.72, n: 9, size: [0.38, 0.26, 0.24], round: 0.05}
  - {name: log-1, mat: log, cylinder: {a: [-0.35, 2.25, 0.14], b: [0.35, 2.55, 0.18], r1: 0.09}}
  # furs on the floor
  - {name: fur-w, mat: fur, hull: {points: [[-3.2, 1.2, 0.03], [-1.9, 1.0, 0.03], [-1.7, 2.1, 0.03], [-2.6, 2.4, 0.03], [-3.3, 1.9, 0.03], [-2.5, 1.6, 0.12]], round: 0.02}}
  - {name: fur-e, mat: basket, hull: {points: [[1.9, 2.4, 0.03], [3.2, 2.2, 0.03], [3.4, 3.2, 0.03], [2.4, 3.5, 0.03], [1.8, 3.1, 0.03], [2.6, 2.8, 0.12]], round: 0.02}}
  # baskets and pots in the corners by the north wall
  - {name: basket-1, mat: basket, cylinder: {a: [-3.35, 5.5, 0], b: [-3.35, 5.5, 0.5], r1: 0.3, r2: 0.36}}
  - {name: basket-2, mat: basket, cylinder: {a: [-2.75, 5.6, 0], b: [-2.75, 5.6, 0.35], r1: 0.22, r2: 0.27}}
  - {name: pot-1, mat: stone, ellipsoid: {c: [3.3, 5.5, 0.25], r: [0.3, 0.3, 0.28]}}
  - {name: basket-3, mat: basket, cylinder: {a: [2.7, 5.65, 0], b: [2.7, 5.65, 0.45], r1: 0.26, r2: 0.3}}
  - {name: bed, mat: basket, box: {c: [-3.3, 3.8, 0.12], half: [0.5, 0.9, 0.12], radius: 0.08}}
