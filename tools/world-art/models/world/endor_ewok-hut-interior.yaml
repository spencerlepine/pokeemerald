# Ewok hut interior (art:endor:ewok-hut-interior), a whole room, 8x8 cells.
# Reference: inside the Ewok huts of Bright Tree Village (Return of the Jedi;
# wiki/art/concept/endor/ewok-hut-interior__web_1.jpg and __web_2.jpg). Laid out on the Bright Tree
# house maps (wiki/world/endor/interiors/bright-tree-house-1.yaml): the north wall two cells high, a
# tree trunk through the floor at cells 3-4 of rows 2-3, the door in the middle of the south edge. Seen
# in the game camera: the plank floor in plan, the north wall of upright logs face-on, the side walls
# edge-on, a low log sill along the south. Fixtures: the fire pit, furs on the floor, baskets and pots
# in the corners, hide drapes on the wall. Axes: x east, y north, z up, origin at the middle of the
# south edge, on the floor.
name: endor_ewok-hut-interior
art: art:endor:ewok-hut-interior
palette: greybox
cells: [8, 8]
foot: [64, 127]
footprint: 1          # a room is walkable; the tool needs one row for its scene sheet
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  floor: {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  seam:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  log:   {ramp: mid,   bands: [0.0, 0.35, 0.7]}
  log2:  {ramp: mid,   bands: [0.1, 0.45, 0.8]}
  trunk: {ramp: dark,  bands: [-0.1, 0.3, 0.7]}
  fur:   {ramp: bone,  bands: [0.2, 0.5, 0.85]}
  stone: {ramp: light, bands: [0.2, 0.5, 0.85]}
  ember: {ramp: dark,  bands: [0.5, 0.8, 0.95]}
  basket: {ramp: bone, bands: [0.25, 0.55, 0.88]}
box: null
parts:
  # the plank floor and its seams
  - {name: floor, mat: floor, box: {c: [0, 3.1, 0.0], half: [3.98, 3.1, 0.02]}}
  - {name: seam-0, mat: seam, box: {c: [0, 0.50, 0.025], half: [3.85, 0.025, 0.01]}}
  - {name: seam-1, mat: seam, box: {c: [0, 1.50, 0.025], half: [3.85, 0.025, 0.01]}}
  - {name: seam-2, mat: seam, box: {c: [0, 2.50, 0.025], half: [3.85, 0.025, 0.01]}}
  - {name: seam-3, mat: seam, box: {c: [0, 3.50, 0.025], half: [3.85, 0.025, 0.01]}}
  - {name: seam-4, mat: seam, box: {c: [0, 4.50, 0.025], half: [3.85, 0.025, 0.01]}}
  - {name: seam-5, mat: seam, box: {c: [0, 5.50, 0.025], half: [3.85, 0.025, 0.01]}}
  # the north wall of upright logs, a beam along the top
  - {name: wall-log-0, mat: log, cylinder: {a: [-3.75, 6.25, 0], b: [-3.75, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-1, mat: log2, cylinder: {a: [-3.25, 6.25, 0], b: [-3.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-2, mat: log, cylinder: {a: [-2.75, 6.25, 0], b: [-2.75, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-3, mat: log2, cylinder: {a: [-2.25, 6.25, 0], b: [-2.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-4, mat: log, cylinder: {a: [-1.75, 6.25, 0], b: [-1.75, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-5, mat: log2, cylinder: {a: [-1.25, 6.25, 0], b: [-1.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-6, mat: log, cylinder: {a: [-0.75, 6.25, 0], b: [-0.75, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-7, mat: log2, cylinder: {a: [-0.25, 6.25, 0], b: [-0.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-8, mat: log, cylinder: {a: [0.25, 6.25, 0], b: [0.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-9, mat: log2, cylinder: {a: [0.75, 6.25, 0], b: [0.75, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-10, mat: log, cylinder: {a: [1.25, 6.25, 0], b: [1.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-11, mat: log2, cylinder: {a: [1.75, 6.25, 0], b: [1.75, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-12, mat: log, cylinder: {a: [2.25, 6.25, 0], b: [2.25, 6.25, 1.85], r1: 0.25}}
  - {name: wall-log-13, mat: log2, cylinder: {a: [2.75, 6.25, 0], b: [2.75, 6.25, 1.85], r1: 0.25}}
