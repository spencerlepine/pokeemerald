# AT-ST wreck (art:endor:at-st-wreck), hit box 3x3, drawn 3x4.
# Reference: the AT-ST scout walker (Return of the Jedi; wiki/art/concept/endor/at-st-wreck__db_at-st-walker.jpg
# and __web_2.jpg). Modelled standing like the real walker: the boxy head with its chin and the two
# square viewports in the angled front, the cheek guns, the hip block, two reverse-jointed legs on
# splayed feet. Posed toppled over by the Ewoks' log trap.
# Walker axes: x forward (the head's front), y to its left, z up, origin on the ground under the hips.
name: endor_at-st-wreck
art: art:endor:at-st-wreck
palette: greybox
cells: [3, 4]
foot: [24, 40]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  dirt:  {ramp: mid,   bands: [0.2, 0.5, 0.8]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [48, 48]
params:
  hip_z: 2.0
  thigh: -40         # thigh swing (deg from straight down, + forward)
  shin: 75           # shin bend from the thigh
templates:
  # one leg: thigh down and back, shin down and forward, a splayed foot
  atst-leg:
    params: {thigh: -40, shin: 75}
    parts:
      - name: leg
        mat: hull
        limb:
          root: [0, 0, 0]
          round: 0.03
          segments:
            - {len: 1.0, w: 0.26, d: 0.3, bend: "=thigh", joint: {r: 0.22, len: 0.36, mat: dark}}
            - {len: 1.15, w: 0.22, d: 0.24, bend: "=shin", joint: {r: 0.17, len: 0.3, mat: dark}}
          foot: {r: 0.36, r2: 0.3, h: 0.16, mat: dark}
parts:
  # the head: a box with a sloped roof, the front angled in to the chin
  - name: head
    mat: plate
    hull: {points: [[-0.75, -0.62, "=hip_z + 0.35"], [-0.75, 0.62, "=hip_z + 0.35"], [-0.8, -0.6, "=hip_z + 1.25"], [-0.8, 0.6, "=hip_z + 1.25"],
                    [0.45, -0.62, "=hip_z + 0.35"], [0.45, 0.62, "=hip_z + 0.35"], [0.4, -0.58, "=hip_z + 1.3"], [0.4, 0.58, "=hip_z + 1.3"],
                    [0.85, -0.5, "=hip_z + 0.95"], [0.85, 0.5, "=hip_z + 0.95"], [0.7, -0.4, "=hip_z + 0.45"], [0.7, 0.4, "=hip_z + 0.45"]], round: 0.04}
  - {name: port-l, mat: dark, box: {c: [0.72, 0.24, "=hip_z + 1.08"], half: [0.12, 0.14, 0.09], radius: 0.01}, rot: [-35, 0, 0]}
  - {name: port-r, mat: dark, box: {c: [0.72, -0.24, "=hip_z + 1.08"], half: [0.12, 0.14, 0.09], radius: 0.01}, rot: [-35, 0, 0]}
  - {name: gun-l, mat: dark, cylinder: {a: [0.2, 0.72, "=hip_z + 0.65"], b: [1.0, 0.72, "=hip_z + 0.65"], r1: 0.09}}
  - {name: gun-r, mat: dark, cylinder: {a: [0.2, -0.72, "=hip_z + 0.6"], b: [0.9, -0.72, "=hip_z + 0.6"], r1: 0.11}}
  - {name: chin, mat: dark, cylinder: {a: [0.8, -0.18, "=hip_z + 0.45"], b: [1.15, -0.18, "=hip_z + 0.45"], r1: 0.06}}
  # the hip block and the two legs
  - {name: hips, mat: dark, box: {c: [-0.1, 0, "=hip_z + 0.15"], half: [0.32, 0.5, 0.2], radius: 0.04}}
  - {use: atst-leg, name: leg-l, at: [-0.1, 0.55, "=hip_z"], with: {thigh: "=thigh", shin: "=shin"}}
  - {use: atst-leg, name: leg-r, at: [-0.1, -0.55, "=hip_z"], with: {thigh: "=thigh", shin: "=shin"}}
variants:
  # the legs knocked out from under it: the head down in the dirt facing south, canted over, one leg
  # torn off and lying to the east, the other folded under the hips
  toppled:
    turn: -100
    tilt: [0, 18]
    pivot: [0, 0]
    sink: 1.95
    scale: 0.9
    params: {thigh: 60, shin: -120}
    foot: [23, 40]
    drop: ["leg-l/*"]
    ground:
      - {use: atst-leg, name: lost-leg, at: [-0.75, -0.75, 0.15], rot: [0, 90, 0], turn: 20, with: {thigh: 0, shin: 30}}
      - {name: dirt-1, mat: dirt, ellipsoid: {c: [-0.3, -0.85, 0], r: [0.7, 0.2, 0.12]}}
  # on its side, both legs stretched out to the west
  fallen:
    turn: -90
    tilt: [0, 90]
    pivot: [0, 0]
    scale: 0.7
    foot: [6, 36]
