# Carbonite block (art:new:carbonite-block), hit box 1x2, drawn 1x3.
# Reference: Han Solo frozen in carbonite (The Empire Strikes Back): a tall flat slab with rounded
# corners, the figure in low relief on its front (head thrown back, both hands raised), control boxes
# on its sides. It stands leaning back on the hover sled it was carried out on. Axes: x east, y north,
# z up; the slab is built upright, its front face to the south, then leaned back with `tilt`.
name: new_carbonite-block
art: art:new:carbonite-block
palette: greybox
cells: [1, 3]
foot: [0, 48]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  slab:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  relief: {ramp: light, bands: [0.1, 0.45, 0.8]}
  dark:   {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  inset:  {ramp: mid,   bands: [0.45, 0.75, 0.95]}
  sled:   {ramp: mid,   bands: [0.35, 0.65, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [14, 28]
params:
  y0: 0.5         # the slab's front face
  h: 1.66         # slab height
  z0: 0.2         # it stands on the sled
tilt: [0, 10]
pivot: [0.5, 0.75]
parts:
  - {name: slab, mat: slab, box: {c: [0.48, "=y0 + 0.13", "=z0 + h / 2"], half: [0.36, 0.13, "=h / 2"], radius: 0.06}}
  # the frame round the face
  - {name: rim, mat: slab, box: {c: [0.48, "=y0 - 0.01", "=z0 + h / 2"], half: [0.38, 0.04, "=h / 2 + 0.01"], radius: 0.04}}
  - {name: face, mat: inset, box: {c: [0.48, "=y0 - 0.03", "=z0 + h / 2"], half: [0.31, 0.03, "=h / 2 - 0.08"], radius: 0.03}}
  # the figure in relief
  - {name: head, mat: relief, ellipsoid: {c: [0.48, "=y0 - 0.08", "=z0 + h - 0.34"], r: [0.13, 0.09, 0.15]}}
  - name: body
    mat: relief
    hull: {points: [["=0.48 - 0.24", "=y0 - 0.05", "=z0 + h - 0.54"], ["=0.48 + 0.24", "=y0 - 0.05", "=z0 + h - 0.54"],
                    ["=0.48 - 0.17", "=y0 - 0.05", "=z0 + 0.2"], ["=0.48 + 0.17", "=y0 - 0.05", "=z0 + 0.2"],
                    ["=0.48 - 0.23", "=y0 - 0.13", "=z0 + h - 0.6"], ["=0.48 + 0.23", "=y0 - 0.13", "=z0 + h - 0.6"],
                    ["=0.48 - 0.17", "=y0 - 0.12", "=z0 + 0.3"], ["=0.48 + 0.17", "=y0 - 0.12", "=z0 + 0.3"]], round: 0.03}
  - {name: legs, mat: inset, box: {c: [0.48, "=y0 - 0.1", "=z0 + 0.5"], half: [0.02, 0.04, 0.32], radius: 0.01}}
  - {name: hand-l, mat: relief, ellipsoid: {c: [0.24, "=y0 - 0.09", "=z0 + h - 0.4"], r: [0.08, 0.07, 0.12]}}
  - {name: hand-r, mat: relief, ellipsoid: {c: [0.72, "=y0 - 0.09", "=z0 + h - 0.4"], r: [0.08, 0.07, 0.12]}}
  # control boxes on the sides
  - {name: box-l, mat: dark, box: {c: [0.13, "=y0 + 0.13", "=z0 + h * 0.62"], half: [0.03, 0.08, 0.14], radius: 0.01}}
  - {name: box-r, mat: dark, box: {c: [0.83, "=y0 + 0.13", "=z0 + h * 0.62"], half: [0.03, 0.08, 0.14], radius: 0.01}}
ground:
  # the hover sled it stands on
  - {name: sled, mat: sled, prism: {poly: [[0.07, 0.1], [0.89, 0.1], [0.89, 1.2], [0.07, 1.2]], z: [0.05, 0.22], top: [0.96, 0.95], round: 0.03}}
  - {name: skirt, mat: dark, prism: {poly: [[0.13, 0.16], [0.83, 0.16], [0.83, 1.14], [0.13, 1.14]], z: [0, 0.06], round: 0.01}}
variants:
  # leaning back on its sled
  on-sled: {}
  # lying flat on the floor, face up, as it came out of the freezing pit
  lying:
    tilt: [0, 90]
    pivot: [0.5, 0.12]
    params: {y0: -0.12, z0: 0.12}
    ground: []
