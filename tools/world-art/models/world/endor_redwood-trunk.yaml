# Redwood trunk (art:endor:redwood-trunk), hit box 3x3, drawn 3x6.
# Reference: the giant redwoods of the Endor forest (Return of the Jedi, filmed in the Redwood National
# Park; wiki/art/concept/endor/redwood-trunk__db_endor.jpg). Stand-in: trunk and roots only, the
# canopy comes later (owner). A trunk two cells wide running out of the top of the sprite on purpose (it
# goes on up into the canopy layer, so the art meets the top edge), deep vertical
# bark furrows on its south face, buttress roots flaring out over the forest floor.
# Axes: x east, y north, z up, origin on the ground under the trunk's centre.
name: endor_redwood-trunk
art: art:endor:redwood-trunk
palette: greybox
kits: [../scenery/kits/endor-dagobah.yaml]
cells: [3, 6]
foot: [24, 72]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  bark:   {ramp: mid,   bands: [-0.1, 0.3, 0.65]}
  root:   {ramp: mid,   bands: [0.2, 0.5, 0.8]}
  furrow: {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  moss:   {ramp: light, bands: [0.3, 0.6, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [48, 48]
params:
  R: 0.92           # trunk radius at the foot
  top: 4.6          # past the top edge: the trunk runs on up into the canopy layer
parts:
  - {name: trunk, mat: bark, cylinder: {a: [0, 0.1, 0], b: [0, 0.1, "=top"], r1: "=R", r2: "=R * 0.86"}}
  # the flared foot of the trunk
  - {name: flare, mat: bark, cylinder: {a: [0, 0.1, 0], b: [0, 0.1, 0.7], r1: "=R + 0.22", r2: "=R"}}
  # vertical bark furrows on the faces that show
  - {name: furrow-1, mat: furrow, box: {c: [-0.45, "=0.1 - R * 0.86", 2.3], half: [0.035, 0.05, 1.9], radius: 0.02}}
  - {name: furrow-2, mat: furrow, box: {c: [0.12, "=0.1 - R * 0.97", 1.7], half: [0.035, 0.05, 1.6], radius: 0.02}}
  - {name: furrow-3, mat: furrow, box: {c: [0.6, "=0.1 - R * 0.75", 2.6], half: [0.035, 0.05, 1.9], radius: 0.02}}
  - {name: furrow-4, mat: furrow, box: {c: [-0.2, "=0.1 - R * 0.95", 3.3], half: [0.03, 0.05, 1.0], radius: 0.02}}
  # buttress roots fanning out to the south, east and west
  - {use: buttress, name: root-sw, at: [-0.7, -0.45, 0], turn: 215, with: {len: 0.75, h: 0.8, mat: root}}
  - {use: buttress, name: root-s,  at: [0.15, -0.85, 0], turn: 280, with: {len: 0.55, h: 0.7, mat: root}}
  - {use: buttress, name: root-se, at: [0.7, -0.5, 0],  turn: 330, with: {len: 0.7, h: 0.8, mat: root}}
  - {use: buttress, name: root-w,  at: [-0.9, 0.3, 0],  turn: 175, with: {len: 0.5, h: 0.75, mat: root}}
  - {use: buttress, name: root-e,  at: [0.9, 0.35, 0],  turn: 10,  with: {len: 0.5, h: 0.75, mat: root}}
ground:
  - {name: moss-1, mat: moss, ellipsoid: {c: [-1.15, -1.1, 0], r: [0.25, 0.14, 0.1]}}
