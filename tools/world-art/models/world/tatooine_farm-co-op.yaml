# Farm co-op (art:tatooine:farm-co-op), hit box 6x4, drawn 6x5. Anchorhead.
# Reference: Anchorhead's low adobe halls and the moisture farms around it (A New Hope): a long hall with a
# shallow barrel-vaulted roof, its vaulted entry block on the south, and a row of moisture vaporators
# standing behind it, the co-op's shared array.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 3 (x = 0.5).
name: tatooine_farm-co-op
art: art:tatooine:farm-co-op
palette: greybox
kits: [../scenery/kits/tatooine.yaml, ../scenery/kits/tatooine-buildings.yaml]
cells: [6, 5]
foot: [48, 48]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  roof:  {ramp: light, bands: [0.35, 0.62, 0.8]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [92, 60]
params:
  hy: -0.35         # the hall's centre line
parts:
  # the long hall and its barrel roof
  - {name: walls, mat: adobe, box: {c: [0, "=hy", 0.5], half: [2.75, 1.15, 0.5], radius: 0.06}}
  - name: roof
    mat: roof
    extrude: {axis: x, span: [-2.82, 2.82], end: 1.0,
              profile: [["=hy - 1.22", 0.95], ["=hy - 1.0", 1.2], ["=hy - 0.55", 1.38], ["=hy", 1.45], ["=hy + 0.55", 1.38], ["=hy + 1.0", 1.2], ["=hy + 1.22", 0.95]], round: 0.04}
  - {name: rib-w, mat: adobe, box: {c: [-1.5, "=hy", 1.2], half: [0.09, 1.24, 0.3], radius: 0.03}}
  - {name: rib-e, mat: adobe, box: {c: [1.9, "=hy", 1.2], half: [0.09, 1.24, 0.3], radius: 0.03}}
  - {use: entry, name: entry, at: [0.5, -1.45, 0], with: {w: 1.0, d: 0.7, h: 1.05, mat: trim}}
  - {use: slot, name: win-1, at: [-2.2, -1.5, 0], with: {z: 0.6, w: 0.3}}
  - {use: slot, name: win-2, at: [-0.9, -1.5, 0], with: {z: 0.6, w: 0.3}}
  - {use: slot, name: win-3, at: [1.8, -1.5, 0], with: {z: 0.6, w: 0.3}}
  # the vaporator array behind
  - {use: vaporator, name: vap-1, at: [-2.35, 1.3, 0], with: {h: 1.3}}
  - {use: vaporator, name: vap-2, at: [-0.95, 1.4, 0], with: {h: 1.3}}
  - {use: vaporator, name: vap-3, at: [0.45, 1.3, 0], with: {h: 1.3}}
  - {use: vaporator, name: vap-4, at: [1.85, 1.4, 0], with: {h: 1.3}}
variants:
  # the hall with its full array
  co-op: {}
  # two vaporators taken down for repair
  array-gaps:
    drop: ["vap-2/*", "vap-4/*"]
