# Death Star trench wall (art:giant:trench-wall), hit box 25x2, drawn 25x4.
# Reference: the Death Star's surface trench walls (A New Hope): a sheer grey cliff of machinery, tall
# pilasters, dark recessed bays, stacked panel blocks and thin ledges. It rises far above the map, so
# the sprite shows only its foot and runs off the top edge (cut off on purpose). The face repeats every
# 5 m (80 px), so its tiles repeat. Axes: x east from the sprite's west edge, y north from its south
# edge, z up.
name: giant_trench-wall
art: art:giant:trench-wall
palette: greybox
cells: [25, 4]
foot: [0, 64]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  wall:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.15, 0.5, 0.82]}
  panel: {ramp: mid,   bands: [0.1, 0.4, 0.75]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
box: [400, 32]
params:
  fy: 0.5         # the wall face's line
  top: 7.0        # well above the sprite's top
templates:
  # one 5 m bay of the wall
  bay:
    parts:
      - {name: face, mat: wall, box: {c: [2.5, "=fy + 0.4", "=top/2"], half: [2.5, 0.4, "=top/2"]}}
      - {name: foot, mat: panel, box: {c: [2.5, "=fy - 0.25", 0.18], half: [2.5, 0.25, 0.18]}}
      - {name: pilaster, mat: plate, box: {c: [0.35, "=fy - 0.22", "=top/2"], half: [0.3, 0.22, "=top/2"]}}
      - {name: recess, mat: dark, box: {c: [1.85, "=fy - 0.02", "=top/2 + 0.75"], half: [0.65, 0.04, "=top/2"]}}
      - {name: recess-sill, mat: panel, box: {c: [1.85, "=fy - 0.12", 0.7], half: [0.7, 0.12, 0.1]}}
      - {name: block-1, mat: panel, box: {c: [3.75, "=fy - 0.15", 0.85], half: [0.75, 0.15, 0.45], radius: 0.02}}
      - {name: block-2, mat: plate, box: {c: [3.75, "=fy - 0.1", 1.85], half: [0.75, 0.1, 0.4], radius: 0.02}}
      - {name: vent, mat: dark, box: {c: [3.75, "=fy - 0.31", 0.85], half: [0.5, 0.02, 0.06]}}
      - {name: block-3, mat: panel, box: {c: [1.0, "=fy - 0.1", 3.1], half: [0.4, 0.1, 0.3], radius: 0.02}}
      - {name: block-4, mat: panel, box: {c: [3.3, "=fy - 0.1", 3.2], half: [1.0, 0.1, 0.35], radius: 0.02}}
      - {name: ledge, mat: plate, box: {c: [2.5, "=fy - 0.12", 2.55], half: [2.5, 0.12, 0.06]}}
parts:
  - {use: bay, name: bay-1, at: [0, 0, 0]}
  - {use: bay, name: bay-2, at: [5, 0, 0]}
  - {use: bay, name: bay-3, at: [10, 0, 0]}
  - {use: bay, name: bay-4, at: [15, 0, 0]}
  - {use: bay, name: bay-5, at: [20, 0, 0]}
