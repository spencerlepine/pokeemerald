# Throne room (art:death-star:throne-room), a whole room, 13x11 (greybox room). Replaces the Champion's room.
# Reference: the Emperor's throne room on the second Death Star (Return of the Jedi): a round chamber, the
# great round window with its spokes behind the throne, the throne on a stepped dais, stairs down to the
# lift, consoles at the sides. Drawn as Emerald draws an interior: the floor in plan, the north wall's
# face (five rows tall here, to hold the window), the side walls edge-on, the dais and throne in front of
# the window. Axes: x east, y north from the room's south-west corner, z up.
