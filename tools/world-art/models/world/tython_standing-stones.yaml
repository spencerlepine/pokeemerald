# Standing stone (art:tython:standing-stones), footprint 1x1, drawn 1x2. Four ring the clearing.
# Reference: weathered menhirs (Tython's ancient stones in The Clone Wars / The Old Republic art):
# a tall slab, thicker at the foot, its top worn to a slant, a notch knocked off one shoulder.
# The broad face looks south. Axes: x east, y north, z up, origin on the ground at the stone's middle.
name: tython_standing-stones
art: art:tython:standing-stones
palette: greybox
cells: [1, 2]
foot: [8, 27]
footprint: 1
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid, bands: [0.22, 0.52, 0.84]}
  moss:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 1}
box: [16, 16]
parts:
  - name: slab
    mat: stone
    hull: {points: [[-0.4, -0.16, 0], [0.4, -0.18, 0], [-0.4, 0.2, 0], [0.4, 0.18, 0],
                    [-0.34, -0.12, 0.85], [0.34, -0.12, 0.9], [-0.34, 0.14, 0.85], [0.34, 0.14, 0.9],
                    [-0.26, -0.08, 1.3], [0.06, -0.08, 1.42], [-0.26, 0.1, 1.3], [0.06, 0.1, 1.42], [0.28, -0.08, 1.16], [0.28, 0.1, 1.16]], round: 0.03}
  - {name: chip, mat: stone, op: subtract, box: {c: [-0.36, -0.2, 1.0], half: [0.1, 0.4, 0.1]}, rot: [0, 35, 0]}
  - {name: crack, mat: moss, box: {c: [0.1, -0.15, 0.55], half: [0.02, 0.03, 0.22]}, rot: [0, -12, 0]}
ground:
  - {name: base, mat: moss, hull: {points: [[-0.5, -0.24, 0], [0.5, -0.24, 0], [0.5, 0.0, 0], [-0.5, 0.0, 0], [0, -0.22, 0.08]], round: 0.02}}
variants:
  standing: {}
  # one of the four, fallen to a lean
  leaning:
    tilt: [-9, 0]
    scale: 0.92
    pivot: [0, 0]
