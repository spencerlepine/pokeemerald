# Spacer Museum (art:tatooine:spacer-museum), hit box 8x5, drawn 8x7. Mos Eisley.
# Reference: Mos Eisley's big stepped adobe blocks (A New Hope; Outlaws): a wide two-tier block with
# chamfered corners, a museum entrance under a deep lintel, and a light freighter mounted on the roof
# as the display ship.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 4 (x = 0.5).
name: tatooine_spacer-museum
art: art:tatooine:spacer-museum
palette: greybox
kits: [../scenery/kits/tatooine-buildings.yaml]
cells: [8, 7]
foot: [64, 72]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [124, 76]
parts:
  # the lower tier, corners chamfered
  - name: tier-1
    mat: trim
    prism: {poly: [[-3.4, -2.2], [3.4, -2.2], [3.85, -1.75], [3.85, 1.15], [3.4, 1.6], [-3.4, 1.6], [-3.85, 1.15], [-3.85, -1.75]], z: [0, 1.15], round: 0.06}
  # the upper tier
  - name: tier-2
    mat: adobe
    prism: {poly: [[-2.3, -1.2], [2.3, -1.2], [2.6, -0.9], [2.6, 1.0], [2.3, 1.3], [-2.3, 1.3], [-2.6, 1.0], [-2.6, -0.9]], z: [1.15, 1.85], round: 0.05}
  # the entrance
  - {name: lintel, mat: trim, box: {c: [0.5, -2.3, 1.0], half: [0.9, 0.15, 0.15], radius: 0.03}}
  - {use: doorway, name: door, at: [0.5, -2.2, 0], with: {w: 0.9, h: 0.85}}
  - {use: slot, name: win-1, at: [-2.7, -2.2, 0], with: {z: 0.65, w: 0.5, h: 0.3}}
  - {use: slot, name: win-2, at: [-1.4, -2.2, 0], with: {z: 0.65, w: 0.5, h: 0.3}}
  - {use: slot, name: win-3, at: [2.2, -2.2, 0], with: {z: 0.65, w: 0.5, h: 0.3}}
  - {use: slot, name: win-4, at: [3.3, -2.2, 0], with: {z: 0.65, w: 0.4, h: 0.3}}
  - {use: slot, name: win-u1, at: [-1.4, -1.2, 1.15], with: {z: 0.35, w: 0.5, h: 0.22}}
  - {use: slot, name: win-u2, at: [1.4, -1.2, 1.15], with: {z: 0.35, w: 0.5, h: 0.22}}
  # the display ship on its pylon
  - {name: plinth, mat: dark, cylinder: {a: [0, 0.1, 1.85], b: [0, 0.1, 2.25], r1: 0.2}}
  - {use: freighter, name: ship, at: [-0.15, 0.2, 2.05], turn: 12, with: {s: 0.78, lift: 0.2}}
