# Supply Depot interior (art:shared:supply-depot-interior), the whole room, 11x8 cells (Poke Mart).
# Seen by the game camera: the floor in plan, the north wall's face in the top two rows, the side
# walls edge-on. The sales counter on the west side by the door with a cash droid on it (the clerk
# stands behind it, an NPC), two freestanding shelves of crates and ration packs in the east half,
# a wall shelf of boxes, a rack of power cells against the north wall, and the door mat.
# Axes: x east, y north, z up; origin at the room's south-west corner on the floor.
name: shared_supply-depot-interior
art: art:shared:supply-depot-interior
palette: greybox
cells: [11, 8]
foot: [0, 128]
footprint: 1     # rooms have no hit box; the scene check needs one row, so the south wall row
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  floor: {ramp: light, bands: [0.3, 0.6, 0.9]}
  tile:  {ramp: mid,   bands: [0.3, 0.6, 0.95]}
  wall:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.15, 0.5, 0.82]}
  edge:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  crate: {ramp: bone,  bands: [0.2, 0.5, 0.85]}
  cell:  {ramp: light, bands: [0.2, 0.45, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 0}
box: null
templates:
  # a freestanding shelf, 4.4 m long: a dark frame, two light boards, crates and ration packs
  shelf:
    parts:
      - {name: frame, mat: dark, box: {c: [0, 0, 0.55], half: [2.2, 0.32, 0.55], radius: 0.03}}
      - {name: board-1, mat: trim, box: {c: [0, -0.02, 0.38], half: [2.15, 0.32, 0.04]}}
      - {name: board-2, mat: trim, box: {c: [0, -0.02, 1.1], half: [2.2, 0.34, 0.05], radius: 0.02}}
      - {name: crate-1, mat: crate, box: {c: [-1.55, -0.05, 0.62], half: [0.45, 0.24, 0.2], radius: 0.03}}
      - {name: crate-2, mat: crate, box: {c: [-0.5, -0.05, 0.62], half: [0.45, 0.24, 0.2], radius: 0.03}}
      - {name: packs, mat: wall, box: {c: [0.6, -0.05, 0.58], half: [0.5, 0.24, 0.16], radius: 0.03}}
      - {name: crate-3, mat: crate, box: {c: [1.6, -0.05, 0.62], half: [0.45, 0.24, 0.2], radius: 0.03}}
      - {name: top-1, mat: crate, box: {c: [-1.2, 0, 1.3], half: [0.5, 0.26, 0.16], radius: 0.03}}
      - {name: top-2, mat: wall, box: {c: [0.0, 0, 1.26], half: [0.4, 0.24, 0.12], radius: 0.03}}
      - {name: top-3, mat: crate, box: {c: [1.15, 0, 1.3], half: [0.55, 0.26, 0.16], radius: 0.03}}
      - {name: kick, mat: edge, box: {c: [0, -0.33, 0.12], half: [2.15, 0.02, 0.12]}}
  cellpack:
    parts:
      - {name: c, mat: cell, cylinder: {a: [0, 0, 0], b: [0, 0, 0.42], r1: 0.15}}
      - {name: t, mat: dark, cylinder: {a: [0, 0, 0.42], b: [0, 0, 0.5], r1: 0.08}}
parts:
  # the floor, a mid aisle from the door, the door mat
