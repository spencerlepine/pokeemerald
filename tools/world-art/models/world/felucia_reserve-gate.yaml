# Reserve gate (art:felucia:reserve-gate), footprint 5x4, drawn 5x6. The ranger gatehouse.
# Reference: Felucia's settlements (The Clone Wars: the farm domes beside the giant flared fungi) and
# the reserve's fungus forest: no straight walls, everything swollen and capped. A low domed hall with
# a big round-arched gateway in its south face, two bulb towers either side wearing fungus caps (the
# Felucia kit's fungus), ribbed like a mushroom's stalk. Axes: x east, y north, z up, origin on the
# ground at the south middle of the hit box.
name: felucia_reserve-gate
art: art:felucia:reserve-gate
palette: greybox
kits: [../scenery/kits/kashyyyk-felucia-small.yaml]
cells: [5, 6]
foot: [40, 95]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  shell: {ramp: bone,  bands: [0.25, 0.55, 0.85]}
  rib:   {ramp: mid,   bands: [0.2, 0.5, 0.82]}
  stalk: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  cap:   {ramp: light, bands: [0.2, 0.5, 0.8]}
  lobe:  {ramp: mid,   bands: [0.15, 0.45, 0.72]}
  gill:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  spot:  {ramp: mid,   bands: [0.1, 0.4, 0.7]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  path:  {ramp: bone,  bands: [0.35, 0.65, 0.92]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [80, 64]
params:
  hy: 2.2           # the hall's centre
parts:
  # the domed hall: a squat dome, ribs over it, the arched gateway cut through its south face
  - {name: hall, mat: shell, ellipsoid: {c: [0, "=hy", 0.2], r: [1.75, 1.2, 1.85]}}
  - {name: band, mat: rib, ellipsoid: {c: [0, "=hy", 0.95], r: [1.68, 1.16, 0.14]}}
  - {name: crown, mat: rib, ellipsoid: {c: [0, "=hy", 2.0], r: [0.38, 0.28, 0.2]}}
  - {name: arch, mat: rib, cylinder: {a: [0, "=hy-1.3", 0.85], b: [0, "=hy-0.9", 0.85], r1: 0.85}}
  - {name: arch-base, mat: rib, box: {c: [0, "=hy-1.1", 0.4], half: [0.85, 0.2, 0.42], radius: 0.05}}
  - {name: gate, mat: dark, cylinder: {a: [0, "=hy-1.36", 0.85], b: [0, "=hy-0.8", 0.85], r1: 0.6}}
  - {name: gate-low, mat: dark, box: {c: [0, "=hy-1.08", 0.43], half: [0.6, 0.28, 0.43]}}
  # the two bulb towers, capped like fungi, round windows in their south faces
  - {use: fungus, name: tower-w, at: [-1.68, "=hy-0.3", 0], with: {h: 3.0, r: 0.74, bulb: 0.62, neck: 0.36, lobes: 8}}
  - {use: fungus, name: tower-e, at: [1.68, "=hy-0.3", 0], with: {h: 2.7, r: 0.72, bulb: 0.6, neck: 0.34, lobes: 8}}
  - {name: window-w, mat: dark, cylinder: {a: [-1.68, "=hy-0.95", 0.75], b: [-1.68, "=hy-0.6", 0.75], r1: 0.17}}
  - {name: window-e, mat: dark, cylinder: {a: [1.68, "=hy-0.95", 0.75], b: [1.68, "=hy-0.6", 0.75], r1: 0.17}}
ground:
  # the path running out of the gateway
  - {name: path, mat: path, box: {c: [0, 0.55, 0.0], half: [0.62, 0.45, 0.03], radius: 0.02}}
