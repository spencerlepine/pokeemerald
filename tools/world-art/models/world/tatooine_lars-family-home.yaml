# Lars family home (art:tatooine:lars-family-home), hit box 6x4, drawn 6x5. Mos Entha.
# Reference: the Lars homestead (A New Hope / Attack of the Clones): the adobe dome with its vaulted entry
# block, a low garage block beside it with a wide bay door, and the family landspeeder parked in front.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 2 (x = -0.5).
name: tatooine_lars-family-home
art: art:tatooine:lars-family-home
palette: greybox
kits: [../scenery/kits/tatooine.yaml, ../scenery/kits/tatooine-buildings.yaml]
cells: [6, 5]
foot: [48, 47]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [92, 60]
parts:
  - {use: dome, name: dome, at: [-1.25, 0.4, 0], with: {r: 1.55, h: 1.05, drum: 0.3, mat: adobe}}
  - {use: entry, name: entry, at: [-0.5, -1.2, 0], with: {w: 1.1, d: 1.05, h: 1.15, mat: trim}}
  - {use: garage, name: garage, at: [1.75, 0.4, 0], with: {w: 2.3, d: 2.2, h: 1.0}}
  - {use: vaporator, name: vap, at: [0.4, 1.35, 0], with: {h: 1.3}}
ground:
  - {use: landspeeder, name: speeder, at: [1.75, -1.45, 0], turn: 180}
variants:
  # home with the speeder parked at the garage
  home: {}
  # the speeder is out
  no-speeder:
    ground: []
