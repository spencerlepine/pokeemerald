# Landing pad (art:shared:landing-pad), hit box 4x4, drawn 4x4.
# Reference: the round ferrocrete pads of Mos Eisley's docking bays and the Endor / Outlaws pads where
# a Lambda shuttle sets down: a low round deck on a sloped apron, a painted ring and edge dashes, a
# centre mark, a landing light on a short post at each corner.
# Axes: x east, y north, z up; origin on the ground at the pad's centre.
name: shared_landing-pad
art: art:shared:landing-pad
palette: greybox
cells: [4, 4]
foot: [32, 34]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  deck:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  apron: {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  paint: {ramp: light, bands: [0.1, 0.45, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  lamp:  {ramp: light, bands: [0.0, 0.3, 0.6]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [62, 62]
params:
  R: 1.78           # deck radius
  t: 0.2            # deck top
parts:
  # the apron (a sloped 16-gon) and the deck on it
  - name: apron
    mat: apron
    prism: {poly: [["=R", 0], ["=R*0.924", "=R*0.383"], ["=R*0.707", "=R*0.707"], ["=R*0.383", "=R*0.924"], [0, "=R"], ["=-R*0.383", "=R*0.924"], ["=-R*0.707", "=R*0.707"], ["=-R*0.924", "=R*0.383"], ["=-R", 0], ["=-R*0.924", "=-R*0.383"], ["=-R*0.707", "=-R*0.707"], ["=-R*0.383", "=-R*0.924"], [0, "=-R"], ["=R*0.383", "=-R*0.924"], ["=R*0.707", "=-R*0.707"], ["=R*0.924", "=-R*0.383"]], z: [0, "=t"], top: 0.9, round: 0.02}
  # the painted ring and the edge dashes
  - name: ring
    mat: paint
    ring: {c: [0, 0, "=t"], axis: z, r: "=R*0.68", n: 24, size: [0.3, 0.1, 0.03], round: 0.0}
  - name: dash
    mat: paint
    ring: {c: [0, 0, "=t"], axis: z, r: "=R*0.8", n: 8, start: 22.5, size: [0.34, 0.1, 0.03], round: 0.0}
  # the centre mark: a cross of two bars in a dark disc
  - {name: centre, mat: dark, cylinder: {a: [0, 0, "=t - 0.01"], b: [0, 0, "=t + 0.015"], r1: 0.42}}
  - {name: bar-a, mat: paint, box: {c: [0, 0, "=t + 0.015"], half: [0.32, 0.06, 0.015]}}
  - {name: bar-b, mat: paint, box: {c: [0, 0, "=t + 0.015"], half: [0.06, 0.32, 0.015]}}
  # four landing lights on short posts, at the corners
  - {name: post-1, mat: dark, cylinder: {a: ["=R*0.62", "=R*0.62", 0], b: ["=R*0.62", "=R*0.62", 0.42], r1: 0.08}}
  - {name: post-2, mat: dark, cylinder: {a: ["=-R*0.62", "=R*0.62", 0], b: ["=-R*0.62", "=R*0.62", 0.42], r1: 0.08}}
  - {name: post-3, mat: dark, cylinder: {a: ["=R*0.62", "=-R*0.62", 0], b: ["=R*0.62", "=-R*0.62", 0.42], r1: 0.08}}
  - {name: post-4, mat: dark, cylinder: {a: ["=-R*0.62", "=-R*0.62", 0], b: ["=-R*0.62", "=-R*0.62", 0.42], r1: 0.08}}
  - {name: lamp-1, mat: lamp, ellipsoid: {c: ["=R*0.62", "=R*0.62", 0.46], r: [0.11, 0.11, 0.09]}}
  - {name: lamp-2, mat: lamp, ellipsoid: {c: ["=-R*0.62", "=R*0.62", 0.46], r: [0.11, 0.11, 0.09]}}
  - {name: lamp-3, mat: lamp, ellipsoid: {c: ["=R*0.62", "=-R*0.62", 0.46], r: [0.11, 0.11, 0.09]}}
  - {name: lamp-4, mat: lamp, ellipsoid: {c: ["=-R*0.62", "=-R*0.62", 0.46], r: [0.11, 0.11, 0.09]}}
