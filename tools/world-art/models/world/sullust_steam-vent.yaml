# Steam vent (art:sullust:steam-vent), hit box 1x1, drawn 1x1.
# A crusted mound of volcanic rock with a dark vent in its top (the animated steam puff reuses
# the Lavaridge frames on top of this). Axes: x east, y north, z up, origin
# on the ground at the cell's south edge, middle.
name: sullust_steam-vent
art: art:sullust:steam-vent
palette: greybox
cells: [1, 1]
foot: [8, 16]
footprint: 1
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  rock:  {ramp: mid,   bands: [0.25, 0.5, 0.78]}
  hole:  {ramp: dark,  bands: [0.4, 0.7, 0.95]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 1}
box: [14, 14]
parts:
  # the crusted mound, a ring of rock round the vent
  - {name: mound, mat: rock, hull: {points: [[-0.42, 0.15, 0], [0.2, 0.12, 0], [0.42, 0.3, 0], [0.4, 0.62, 0], [-0.1, 0.68, 0], [-0.42, 0.5, 0],
                                              [-0.22, 0.28, 0.2], [0.18, 0.26, 0.22], [0.2, 0.5, 0.2], [-0.2, 0.52, 0.2]], round: 0.03}}
  - {name: vent, mat: hole, ellipsoid: {c: [0, 0.4, 0.21], r: [0.16, 0.11, 0.035]}}
  - {name: chip, mat: rock, hull: {points: [[0.2, 0.05, 0], [0.42, 0.06, 0], [0.42, 0.2, 0], [0.25, 0.2, 0], [0.33, 0.12, 0.09]], round: 0.02}}
