# Reference: crew quarters and corridors of an Imperial Star Destroyer (A New Hope, Star Wars Outlaws):
# grey deck plating, grey panelled walls with light strips, bunks with lockers, a mess table. Drawn as
# Emerald draws an interior: the floor in plan, the north wall's face across the top three rows, the
# side walls edge-on, three cabins along the north (low partitions, a bunk and a locker each, doorways
# to the corridor), a mess corner to the east, crates in the corridor. Axes: x east, y north from the
# room's south-west corner, z up.
