  - {name: jamb-w, group: gate, mat: stone, box: {c: [-0.75, 2.15, 1.25], half: [0.22, 0.12, 1.25], radius: 0.02}}
  - {name: jamb-e, group: gate, mat: stone, box: {c: [0.75, 2.15, 1.25], half: [0.22, 0.12, 1.25], radius: 0.02}}
  - {name: jamb-w2, group: gate, mat: stone, box: {c: [-1.0, 2.25, 1.05], half: [0.12, 0.12, 1.05], radius: 0.02}}
  - {name: jamb-e2, group: gate, mat: stone, box: {c: [1.0, 2.25, 1.05], half: [0.12, 0.12, 1.05], radius: 0.02}}
  - {name: doorway, group: gate, mat: dark, box: {c: [0, 2.3, 1.2], half: [0.55, 0.1, 1.2]}}
  - {name: door-w, group: gate, mat: stone, box: {c: [-0.27, 2.2, 1.1], half: [0.26, 0.04, 1.1], radius: 0.01}}
  - {name: door-e, group: gate, mat: stone, box: {c: [0.27, 2.2, 1.1], half: [0.26, 0.04, 1.1], radius: 0.01}}
