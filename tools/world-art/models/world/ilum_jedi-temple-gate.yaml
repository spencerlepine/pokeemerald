# Jedi temple gate (art:ilum:jedi-temple-gate), hit box 6x5, drawn 6x8.
# Reference: the Jedi Temple on Ilum (wiki/art/concept/ilum/jedi-temple-gate__web_1.jpg, __web_4.jpg):
# a tall narrow gate cut into a sheer ice cliff, a ring carved over it, the doors and stepped jambs of
# carved stone, crystals glowing in the jambs. Stepped approach: three wide steps up to the sill.
# Axes: x east, y north, z up, origin on the ground at the middle of the hit box's south edge.
name: ilum_jedi-temple-gate
art: art:ilum:jedi-temple-gate
palette: greybox
kits: [../scenery/kits/yavin-hoth-ilum.yaml]
cells: [6, 8]
foot: [48, 127]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  ice:   {ramp: light, bands: [0.3, 0.6, 0.88]}
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.4, 0.7, 0.9]}
  glow:  {ramp: light, bands: [0.1, 0.4, 0.75]}
  snow:  {ramp: bone,  bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [92, 76]
groups: {body: {}, gate: {}}
parts:
  # the ice cliff, faceted, either side of the gate
  - {name: cliff-w, mat: ice, hull: {points: [[-3.0, 2.0, 0], [-0.95, 2.1, 0], [-3.0, 5.0, 0], [-0.9, 5.0, 0], [-3.0, 2.6, 2.8], [-1.0, 2.3, 3.2], [-3.0, 4.5, 3.0], [-1.0, 4.6, 3.1]], round: 0.04}}
  - {name: cliff-e, mat: ice, hull: {points: [[0.95, 2.1, 0], [3.0, 2.0, 0], [0.9, 5.0, 0], [3.0, 5.0, 0], [1.0, 2.3, 3.2], [3.0, 2.5, 2.9], [1.0, 4.6, 3.1], [3.0, 4.5, 3.0]], round: 0.04}}
  - {name: cliff-top, mat: ice, hull: {points: [[-1.1, 2.4, 2.4], [1.1, 2.4, 2.4], [-1.1, 5.0, 2.4], [1.1, 5.0, 2.4], [-1.0, 2.5, 3.2], [1.0, 2.5, 3.2], [-1.0, 4.6, 3.2], [1.0, 4.6, 3.2]], round: 0.04}}
