  - {name: step-3, mat: stone, prism: {poly: [[-1.2, 1.5], [1.2, 1.5], [1.2, 2.1], [-1.2, 2.1]], z: [0.28, 0.42], round: 0.02}}
ground:
  - {name: drift-w, mat: snow, ellipsoid: {c: [-2.4, 1.6, 0], r: [0.8, 0.5, 0.25]}}
  - {name: drift-e, mat: snow, ellipsoid: {c: [2.4, 1.6, 0], r: [0.8, 0.5, 0.25]}}
variants:
