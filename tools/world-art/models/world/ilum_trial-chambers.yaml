# Trial chambers (art:ilum:trial-chambers), a whole room 13x14 (walkable; no hit box).
# Reference: the Jedi Temple's chambers (wiki/art/concept/ilum/trial-chambers__*): carved stone walls,
# pillars, light falling on a round meditation floor. Laid out on the vanilla Elite Four room
# (wiki/world/ilum/interiors/ilum-sidneys-room.yaml): the north wall's face in the top three rows with
# its door at x 6, an open band, the arena rows 4-8 between two-cell walls, the south walls rows 12-13
# with the three-cell door gap. Four variants, one per vision chamber: rock, sand, ice and dark.
# Axes: x east, y north, z up, origin at the room's south-west corner on the floor; 1 cell = 1 m.
name: ilum_trial-chambers
art: art:ilum:trial-chambers
palette: greybox
kits: [../scenery/kits/yavin-hoth-ilum.yaml]
cells: [13, 14]
foot: [0, 224]
footprint: 1
box: null
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  floor: {ramp: mid,   bands: [0.1, 0.4, 0.7]}
  top:   {ramp: dark,  bands: [0.2, 0.5, 0.95]}
  wall:  {ramp: light, bands: [0.25, 0.55, 0.85]}
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.4, 0.7, 0.9]}
  ring:  {ramp: light, bands: [0.1, 0.4, 0.75]}
  rock:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  sand:  {ramp: bone,  bands: [0.25, 0.55, 0.88]}
  glow:  {ramp: light, bands: [0.2, 0.5, 0.82]}
  void:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
parts:
  - {name: floor, mat: floor, box: {c: [6.5, 5.5, 0.03], half: [6.5, 5.5, 0.03]}}
  # the north wall's face, three rows, its door, carved pillars and a Jedi ring over the door
  - {name: wall-n, mat: wall, box: {c: [6.5, 11.1, 1.5], half: [6.5, 0.1, 1.5]}}
  - {name: door-n, mat: dark, box: {c: [6.5, 10.98, 0.8], half: [0.5, 0.04, 0.8], radius: 0.02}}
  - {name: ring-n, mat: dark, ring: {c: [6.5, 10.96, 2.25], axis: y, r: 0.45, n: 10, size: [0.24, 0.08, 0.14], round: 0.02}}
  - {name: pillar-1, mat: stone, box: {c: [2.5, 10.85, 1.5], half: [0.3, 0.18, 1.5], radius: 0.03}}
  - {name: pillar-2, mat: stone, box: {c: [4.6, 10.85, 1.5], half: [0.3, 0.18, 1.5], radius: 0.03}}
  - {name: pillar-3, mat: stone, box: {c: [8.4, 10.85, 1.5], half: [0.3, 0.18, 1.5], radius: 0.03}}
  - {name: pillar-4, mat: stone, box: {c: [10.5, 10.85, 1.5], half: [0.3, 0.18, 1.5], radius: 0.03}}
  # the arena's side walls (cols 0-1 and 11-12, rows 4-8) and the south walls with the door gap
  - {name: wall-w, mat: top, box: {c: [1.0, 7.5, 0.45], half: [1.0, 2.5, 0.45], radius: 0.03}}
  - {name: wall-e, mat: top, box: {c: [12.0, 7.5, 0.45], half: [1.0, 2.5, 0.45], radius: 0.03}}
  - {name: wall-sw, mat: top, box: {c: [2.5, 1.0, 0.45], half: [2.5, 1.0, 0.45], radius: 0.03}}
  - {name: wall-se, mat: top, box: {c: [10.5, 1.0, 0.45], half: [2.5, 1.0, 0.45], radius: 0.03}}
  # the round meditation floor where the trial master stands
  - {name: circle, mat: ring, cylinder: {a: [6.5, 7.5, 0], b: [6.5, 7.5, 0.08], r1: 2.2}}
  - {name: circle-in, mat: floor, cylinder: {a: [6.5, 7.5, 0], b: [6.5, 7.5, 0.1], r1: 1.8}}
  - {name: seal, mat: ring, cylinder: {a: [6.5, 7.5, 0], b: [6.5, 7.5, 0.12], r1: 0.45}}
  # rock chamber: boulders round the arena
  - {name: rock-1, mat: rock, hull: {points: [[2.2, 5.3, 0], [3.4, 5.2, 0], [3.3, 6.2, 0], [2.3, 6.1, 0], [2.6, 5.5, 0.8], [3.1, 5.6, 0.7]], round: 0.03}}
  - {name: rock-2, mat: rock, hull: {points: [[9.6, 8.7, 0], [10.8, 8.6, 0], [10.7, 9.7, 0], [9.7, 9.6, 0], [10.0, 8.9, 0.9], [10.4, 9.1, 0.8]], round: 0.03}}
  - {name: rock-3, mat: rock, hull: {points: [[2.3, 8.9, 0], [3.2, 8.8, 0], [3.1, 9.7, 0], [2.4, 9.6, 0], [2.6, 9.1, 0.6]], round: 0.03}}
  - {name: rock-4, mat: rock, hull: {points: [[9.8, 5.2, 0], [10.7, 5.3, 0], [10.6, 6.0, 0], [9.9, 6.0, 0], [10.2, 5.5, 0.55]], round: 0.03}}
  # sand chamber: dunes drifted over the floor
  - {name: dune-1, mat: sand, ellipsoid: {c: [3.0, 5.8, 0], r: [1.2, 0.6, 0.3]}}
  - {name: dune-2, mat: sand, ellipsoid: {c: [10.0, 9.2, 0], r: [1.2, 0.55, 0.28]}}
  - {name: dune-3, mat: sand, ellipsoid: {c: [10.0, 5.6, 0], r: [1.0, 0.45, 0.24]}}
  - {name: dune-4, mat: sand, ellipsoid: {c: [3.0, 9.3, 0], r: [1.0, 0.45, 0.24]}}
  # ice chamber: kyber and ice spires round the arena
  - {use: kyber, name: ice-1, at: [2.8, 5.7, 0], rot: [10, 0, 0], with: {h: 1.7, r: 0.3, tip: 0.35}}
  - {use: kyber, name: ice-2, at: [10.2, 9.2, 0], rot: [-10, 20, 0], with: {h: 1.9, r: 0.32, tip: 0.4}}
  - {use: kyber, name: ice-3, at: [2.8, 9.2, 0], rot: [12, 10, 0], with: {h: 1.5, r: 0.28, tip: 0.3}}
  - {use: kyber, name: ice-4, at: [10.2, 5.7, 0], rot: [-12, 0, 0], with: {h: 1.6, r: 0.3, tip: 0.35}}
  # dark chamber: black obelisks round the arena
  - {name: obelisk-1, mat: void, prism: {poly: [[2.5, 5.5], [3.1, 5.5], [3.1, 6.0], [2.5, 6.0]], z: [0, 1.6], top: 0.6, round: 0.02}}
  - {name: obelisk-2, mat: void, prism: {poly: [[9.9, 8.9], [10.5, 8.9], [10.5, 9.4], [9.9, 9.4]], z: [0, 1.6], top: 0.6, round: 0.02}}
  - {name: obelisk-3, mat: void, prism: {poly: [[2.5, 8.9], [3.1, 8.9], [3.1, 9.4], [2.5, 9.4]], z: [0, 1.6], top: 0.6, round: 0.02}}
  - {name: obelisk-4, mat: void, prism: {poly: [[9.9, 5.5], [10.5, 5.5], [10.5, 6.0], [9.9, 6.0]], z: [0, 1.6], top: 0.6, round: 0.02}}
variants:
  rock:
    drop: ["dune-*", "ice-*", "obelisk-*"]
  sand:
    drop: ["rock-*", "ice-*", "obelisk-*"]
  ice:
    drop: ["rock-*", "dune-*", "obelisk-*"]
  dark:
    drop: ["rock-*", "dune-*", "ice-*", "circle", "circle-in", "seal"]
