# Docked ship (art:new:docked-ship), hit box 8x4, drawn 8x5. In place of the S.S. Tidal at harbour rooms.
# Reference: the films' star liners and passenger shuttles (the Coruscant liners of Attack of the
# Clones, the Halcyon): a long smooth hull with a rounded prow, a row of passenger windows along its
# side, a raised bridge deck with dark glass, an engine block at the stern with three exhausts, the
# gangway down to the dock on the south side. Moored broadside, prow east.
# Axes: x east, y north, z up; origin on the floor at the middle of the hit box's south edge.
name: new_docked-ship
art: art:new:docked-ship
palette: greybox
cells: [8, 5]
foot: [64, 80]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:   {ramp: light, bands: [-0.1, 0.25, 0.85]}
  stripe: {ramp: mid,   bands: [0.0, 0.3, 0.75]}
  glass:  {ramp: dark,  bands: [0.1, 0.4, 0.8]}
  dark:   {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  deck:   {ramp: mid,   bands: [0.0, 0.5, 0.9]}
  ramp:   {ramp: bone,  bands: [0.0, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [126, 62]
params:
  cy: 1.95          # the hull's centre line (y)
  hb: 0.35          # its keel height
parts:
  # the long hull, rounded prow in the east, tapering stern in the west
  - name: hull
    mat: hull
    extrude: {axis: x, span: [-2.6, 2.0], profile: [["=cy - 1.05", "=hb + 0.15"], ["=cy - 0.8", "=hb"], ["=cy + 0.8", "=hb"], ["=cy + 1.05", "=hb + 0.15"], ["=cy + 1.0", "=hb + 0.95"], ["=cy - 1.0", "=hb + 0.95"]], round: 0.06}
  - name: prow
    mat: hull
    extrude: {axis: x, span: [2.0, 3.75], profile: [["=cy - 1.05", "=hb + 0.15"], ["=cy - 0.8", "=hb"], ["=cy + 0.8", "=hb"], ["=cy + 1.05", "=hb + 0.15"], ["=cy + 1.0", "=hb + 0.95"], ["=cy - 1.0", "=hb + 0.95"]], end: [0.25, 0.55], lean: [0, -0.1], round: 0.06}
  - {name: stripe, mat: stripe, box: {c: [0.3, "=cy - 1.0", "=hb + 0.3"], half: [2.95, 0.06, 0.07]}}
  # the passenger windows along the south side
  - {name: win-0, mat: glass, box: {c: [-2.20, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-1, mat: glass, box: {c: [-1.75, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-2, mat: glass, box: {c: [-1.30, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-3, mat: glass, box: {c: [-0.85, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-4, mat: glass, box: {c: [-0.40, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-5, mat: glass, box: {c: [0.05, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-6, mat: glass, box: {c: [0.50, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  - {name: win-7, mat: glass, box: {c: [0.95, "=cy - 1.06", "=hb + 0.62"], half: [0.13, 0.03, 0.09], radius: 0.01}}
  # the raised bridge deck with its glass, forward
  - name: bridge
    mat: deck
    prism: {poly: [[-1.2, "=cy - 0.7"], [1.6, "=cy - 0.7"], [2.3, "=cy - 0.3"], [2.3, "=cy + 0.3"], [1.6, "=cy + 0.7"], [-1.2, "=cy + 0.7"]], z: ["=hb + 0.94", "=hb + 1.4"], top: [0.92, 0.85], round: 0.04}
  - {name: bridge-glass, mat: glass, box: {c: [1.15, "=cy - 0.66", "=hb + 1.18"], half: [0.9, 0.03, 0.08], radius: 0.01}}
  - {name: mast, mat: dark, cylinder: {a: [0.2, "=cy", "=hb + 1.38"], b: [0.2, "=cy", "=hb + 1.75"], r1: 0.06}}
  # the engine block at the stern, three exhausts
  - {name: engines, mat: deck, box: {c: [-3.0, "=cy", "=hb + 0.5"], half: [0.45, 0.95, 0.45], radius: 0.06}}
  - {name: exhaust-1, mat: dark, cylinder: {a: [-3.5, "=cy - 0.55", "=hb + 0.5"], b: [-3.42, "=cy - 0.55", "=hb + 0.5"], r1: 0.25}}
  - {name: exhaust-2, mat: dark, cylinder: {a: [-3.5, "=cy + 0.0", "=hb + 0.5"], b: [-3.42, "=cy + 0.0", "=hb + 0.5"], r1: 0.25}}
  - {name: exhaust-3, mat: dark, cylinder: {a: [-3.5, "=cy + 0.55", "=hb + 0.5"], b: [-3.42, "=cy + 0.55", "=hb + 0.5"], r1: 0.25}}
  - {name: fin, mat: hull, extrude: {axis: y, span: ["=cy - 0.07", "=cy + 0.07"], profile: [[-3.4, "=hb + 0.9"], [-2.3, "=hb + 0.9"], [-3.0, "=hb + 1.55"], [-3.4, "=hb + 1.55"]], round: 0.02}}
  # the gangway to the dock and its door
  - {name: door, mat: dark, box: {c: [1.55, "=cy - 1.05", "=hb + 0.42"], half: [0.25, 0.04, 0.32], radius: 0.02}}
  - name: gangway
    mat: ramp
    hull: {points: [[1.3, "=cy - 1.05", "=hb + 0.1"], [1.8, "=cy - 1.05", "=hb + 0.1"], [1.3, 0.0, 0.0], [1.8, 0.0, 0.0], [1.3, "=cy - 1.05", "=hb + 0.03"], [1.8, "=cy - 1.05", "=hb + 0.03"]], round: 0.01}
variants:
  moored: {}
  # gangway in, about to leave
  leaving:
    drop: ["gangway"]
