art: art:kamino:stilt-walkway
palette: greybox
cells: [1, 1]
foot: [8, 13]
footprint: 1
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
