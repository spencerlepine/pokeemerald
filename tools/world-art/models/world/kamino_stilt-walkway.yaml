# Stilt walkway (art:kamino:stilt-walkway), one 1x1 tile of the walkway kit (east-west run).
# Reference: the walkways between Tipoca City's domes (Attack of the Clones): a grey metal deck on
# thin stilts above the sea, panel joints across it, a low rail on the north side. The deck runs edge
# to edge so tiles join. Axes: x east, y north, z up, origin on the sea at the cell's centre.
