# Ash greenhouse (art:sullust:ash-greenhouse), hit box 3x3, drawn 3x4.
# A glass dome on the ash plain (reference: the Sullust greenhouse concepts): dark glass panes on light
# ribs, a gabled glass porch to the south with its door, and crops banked round its foot. The plants
# inside do not show through grey glass, so they spill out round the base.
# Axes: x east, y north, z up, origin on the ground at the hit box's south edge, middle.
name: sullust_ash-greenhouse
art: art:sullust:ash-greenhouse
palette: greybox
kits: [../scenery/kits/sullust-mustafar.yaml]
cells: [3, 4]
foot: [24, 64]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  dark:  {ramp: dark,  bands: [0.25, 0.55, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  mid:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plant: {ramp: mid,   bands: [0.2, 0.45, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [44, 44]
parts:
  - {use: glass-dome, name: dome, at: [0, 1.6, 0], with: {r: 1.24}}
  # the gabled glass porch on the south side
  - {name: porch, mat: dark, extrude: {axis: y, span: [0.35, 1.0], profile: [[-0.42, 0], [0.42, 0], [0.42, 0.62], [0, 0.98], [-0.42, 0.62]], round: 0.02}}
  - {name: porch-frame, mat: light, extrude: {axis: y, span: [0.3, 0.38], profile: [[-0.48, 0], [0.48, 0], [0.48, 0.66], [0, 1.06], [-0.48, 0.66]], round: 0.02}}
  - {name: door, mat: dark, box: {c: [0, 0.28, 0.33], half: [0.24, 0.04, 0.33]}}
  - {name: step, mat: mid, box: {c: [0, 0.26, 0.05], half: [0.42, 0.1, 0.05]}}
ground:
  # crops banked round the foot of the dome
  - {name: bush-w1, mat: plant, ellipsoid: {c: [-1.15, 0.5, 0], r: [0.28, 0.22, 0.26]}}
  - {name: bush-w2, mat: plant, ellipsoid: {c: [-0.75, 0.35, 0], r: [0.22, 0.18, 0.2]}}
  - {name: bush-e1, mat: plant, ellipsoid: {c: [1.02, 0.45, 0], r: [0.28, 0.22, 0.24]}}
  - {name: bush-e2, mat: plant, ellipsoid: {c: [0.72, 0.3, 0], r: [0.2, 0.16, 0.18]}}
  - {name: bush-e3, mat: plant, ellipsoid: {c: [1.2, 0.85, 0], r: [0.12, 0.2, 0.22]}}
