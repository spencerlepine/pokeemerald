# Arena hall (art:kashyyyk:arena-hall), footprint 7x5, drawn 7x6. Tarfful's arena (the gym).
# Reference: Kachirho (Revenge of the Sith): Wookiee buildings of carved wood, broad curving roofs,
# log pillars, and the tusk and horn ornaments of Wookiee craft. A long hall of wood under a deep
# hipped roof whose ends sweep up, a tall gabled porch in the middle of the south face over the great
# door, a pair of crossed tusks on the porch peak and two big tusks flanking the steps.
# Axes: x east, y north, z up, origin on the ground at the south middle of the hit box.
name: kashyyyk_arena-hall
art: art:kashyyyk:arena-hall
palette: greybox
cells: [7, 6]
foot: [56, 95]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  wall:  {ramp: mid,  bands: [0.25, 0.55, 0.85]}
  log:   {ramp: mid,  bands: [0.15, 0.45, 0.75]}
  roof:  {ramp: mid,  bands: [0.3, 0.62, 0.92]}
  ridge: {ramp: mid,  bands: [0.2, 0.5, 0.8]}
  tusk:  {ramp: bone, bands: [0.2, 0.5, 0.82]}
  step:  {ramp: bone, bands: [0.35, 0.65, 0.92]}
  dark:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [112, 80]
params:
  wy0: 1.6          # the hall's south wall
  wy1: 3.55         # its north wall
  wh: 1.65          # wall height
templates:
  # a curved tusk rising from the origin, curling toward -x at yaw 0
  tusk:
    params: {s: 1.0, yaw: 0}
    parts:
      - name: horn
        mat: tusk
        limb:
          root: [0, 0, 0]
          yaw: "=yaw"
          segments:
            - {len: "=0.5*s", w: "=0.22*s", d: "=0.22*s", bend: 172, taper: 0.85}
            - {len: "=0.45*s", w: "=0.19*s", d: "=0.19*s", bend: 28, taper: 0.75}
            - {len: "=0.38*s", w: "=0.14*s", d: "=0.14*s", bend: 34, taper: 0.45}
parts:
  # the hall: log walls, a dark band of slit windows under the eaves
  - name: walls
    mat: wall
    hull: {points: [[-3.3, "=wy0", 0], [3.3, "=wy0", 0], [-3.3, "=wy1", 0], [3.3, "=wy1", 0],
                    [-3.2, "=wy0+0.05", "=wh"], [3.2, "=wy0+0.05", "=wh"], [-3.2, "=wy1-0.05", "=wh"], [3.2, "=wy1-0.05", "=wh"]], round: 0.04}
  - {name: slits, mat: dark, box: {c: [0, "=wy0-0.02", "=wh-0.35"], half: [2.9, 0.05, 0.1], radius: 0.01}}
  - {name: pillar-1, mat: log, cylinder: {a: [-3.15, "=wy0", 0], b: [-3.15, "=wy0", "=wh"], r1: 0.17}}
  - {name: pillar-2, mat: log, cylinder: {a: [-1.95, "=wy0", 0], b: [-1.95, "=wy0", "=wh"], r1: 0.15}}
  - {name: pillar-3, mat: log, cylinder: {a: [1.95, "=wy0", 0], b: [1.95, "=wy0", "=wh"], r1: 0.15}}
  - {name: pillar-4, mat: log, cylinder: {a: [3.15, "=wy0", 0], b: [3.15, "=wy0", "=wh"], r1: 0.17}}
  # the deep hipped roof, its east and west ends swept up into horns
  - name: roof
    mat: roof
    hull: {points: [[-3.4, "=wy0-0.3", "=wh-0.1"], [3.4, "=wy0-0.3", "=wh-0.1"], [-3.4, "=wy1+0.25", "=wh-0.1"], [3.4, "=wy1+0.25", "=wh-0.1"],
                    [-2.4, "=(wy0+wy1)/2", "=wh+1.05"], [2.4, "=(wy0+wy1)/2", "=wh+1.05"]], round: 0.05}
  - {name: ridge, mat: ridge, box: {c: [0, "=(wy0+wy1)/2", "=wh+1.03"], half: [2.5, 0.12, 0.08], radius: 0.03}}
  - {use: tusk, name: horn-w, at: [-2.45, "=(wy0+wy1)/2-0.1", "=wh+1.0"], with: {s: 0.6, yaw: 0}}
  - {use: tusk, name: horn-e, at: [2.45, "=(wy0+wy1)/2-0.1", "=wh+1.0"], with: {s: 0.6, yaw: 180}}
  # the porch: a tall gable over the great door, standing proud of the south face
  - name: porch
    mat: wall
    hull: {points: [[-1.25, 0.95, 0], [1.25, 0.95, 0], [-1.25, "=wy0+0.2", 0], [1.25, "=wy0+0.2", 0],
                    [-1.25, 0.95, "=wh+0.35"], [1.25, 0.95, "=wh+0.35"], [-1.25, "=wy0+0.2", "=wh+0.35"], [1.25, "=wy0+0.2", "=wh+0.35"]], round: 0.03}
  - name: gable
    mat: roof
    hull: {points: [[-1.55, 0.8, "=wh+0.25"], [1.55, 0.8, "=wh+0.25"], [-1.55, "=wy0+0.9", "=wh+0.25"], [1.55, "=wy0+0.9", "=wh+0.25"],
                    [0, 0.8, "=wh+1.55"], [0, "=wy0+0.9", "=wh+1.55"]], round: 0.04}
  - name: gable-face
    mat: log
    hull: {points: [[-1.3, 0.82, "=wh+0.3"], [1.3, 0.82, "=wh+0.3"], [0, 0.82, "=wh+1.35"], [-1.3, 0.92, "=wh+0.3"], [1.3, 0.92, "=wh+0.3"], [0, 0.92, "=wh+1.35"]], round: 0.02}
  - {name: door, mat: dark, box: {c: [0, 0.9, 0.68], half: [0.55, 0.08, 0.68], radius: 0.05}}
  - {name: lintel, mat: log, box: {c: [0, 0.88, 1.42], half: [0.78, 0.1, 0.09], radius: 0.03}}
  - {use: tusk, name: crest-w, at: [-0.12, 0.85, "=wh+1.3"], with: {s: 0.75, yaw: 180}}
  - {use: tusk, name: crest-e, at: [0.12, 0.85, "=wh+1.3"], with: {s: 0.75, yaw: 0}}
  # the steps and the two great tusks flanking them
  - {name: step-1, mat: step, box: {c: [0, 0.6, 0.1], half: [0.85, 0.35, 0.1], radius: 0.02}}
  - {name: step-2, mat: step, box: {c: [0, 0.25, 0.04], half: [0.95, 0.2, 0.04], radius: 0.02}}
  - {name: tusk-base-w, mat: log, cylinder: {a: [-1.55, 0.5, 0], b: [-1.55, 0.5, 0.3], r1: 0.22}}
  - {name: tusk-base-e, mat: log, cylinder: {a: [1.55, 0.5, 0], b: [1.55, 0.5, 0.3], r1: 0.22}}
  - {use: tusk, name: tusk-w, at: [-1.55, 0.5, 0.3], with: {s: 1.5, yaw: 180}}
  - {use: tusk, name: tusk-e, at: [1.55, 0.5, 0.3], with: {s: 1.5, yaw: 0}}
