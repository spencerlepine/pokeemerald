# Pod-race junk (art:tatooine:pod-race-junk), hit box 2x2, drawn 2x2.
# Reference: Watto's junkyard and the Mos Espa pits (pod-race-junk__db_podracer, __db_pit-droid, __web_2):
# a heap of scrap plates and engine parts with a broken podracer engine (the kit engine, its jaws gone)
# lying nose-up on it, and the flat round head of a pit droid in the sand.
# Axes: x east, y north, z up, origin on the ground at the centre of the hit box's south edge.
name: tatooine_pod-race-junk
art: art:tatooine:pod-race-junk
palette: greybox
kits: [../scenery/kits/tatooine-objects.yaml]
cells: [2, 2]
foot: [16, 30]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  mid:   {ramp: mid,   bands: [0.15, 0.5, 0.85]}
  light: {ramp: light, bands: [0.1, 0.45, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  scrap: {ramp: dark,  bands: [0.05, 0.4, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [32, 32]
parts:
  # the heap: two lumps of scrap slabs, with a dark plate and a drum sticking out
  - {name: heap-w, mat: scrap, hull: {points: [[-0.9, 0.4, 0], [0.1, 0.35, 0], [0.15, 1.25, 0], [-0.8, 1.3, 0], [-0.5, 0.85, 0.5], [-0.2, 0.8, 0.42]], round: 0.03}}
  - {name: heap-e, mat: scrap, hull: {points: [[-0.1, 0.3, 0], [0.85, 0.35, 0], [0.8, 1.1, 0], [-0.05, 1.15, 0], [0.4, 0.75, 0.32]], round: 0.03}}
  - {name: plate-1, mat: dark, box: {c: [-0.4, 0.95, 0.4], half: [0.3, 0.03, 0.24], radius: 0.01}, rot: [0, 10, -25]}
  - {name: plate-2, mat: mid, box: {c: [0.5, 0.95, 0.3], half: [0.22, 0.03, 0.2], radius: 0.01}, rot: [0, -20, -20]}
  - {name: drum, mat: mid, cylinder: {a: [-0.7, 1.05, 0.2], b: [-0.7, 1.05, 0.6], r1: 0.15}}
  - {name: drum-top, mat: dark, cylinder: {a: [-0.7, 1.05, 0.6], b: [-0.7, 1.05, 0.62], r1: 0.1}}
  # the broken engine lying across the heap, nose to the east, its jaws torn off
  - {use: pod-engine, name: eng, at: [-0.8, 0.55, 0.5], rot: [12, -10, 0], with: {L: 1.45, r: 0.22, core: light, cowl: mid}}
ground:
  # a pit droid's head, fallen in the sand: a flat disc with its round eye
  - {name: droid-head, mat: light, ellipsoid: {c: [-0.5, 0.14, 0.09], r: [0.24, 0.14, 0.08]}}
  - {name: droid-eye, mat: dark, ellipsoid: {c: [-0.5, 0.02, 0.1], r: [0.08, 0.04, 0.06]}}
  - {name: bit-1, mat: dark, box: {c: [0.55, 0.12, 0.05], half: [0.1, 0.07, 0.05], radius: 0.02}, rot: [0, 20, 0]}
variants:
  junk:
    drop: ["eng/jaw-*"]
  # stripped: the engine carted off, only the heap and the droid's head left
  stripped:
    drop: ["eng/*"]
