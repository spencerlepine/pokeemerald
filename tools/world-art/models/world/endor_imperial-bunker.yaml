# Imperial bunker (art:endor:imperial-bunker), hit box 6x5, drawn 6x7.
# Reference: the shield generator bunker on Endor (Return of the Jedi; wiki/art/concept/endor/
# imperial-bunker__web_2.jpg for the doorway, __web_3.jpg for the dish). A concrete doorway dug into a
# grassy hillside: a trapezoid face with sloped, slatted sides under a roof lip, the dark recess with
# the slatted blast door. Up on the hill behind it stands a small shield-generator dish on its tower.
# Axes: x east, y north, z up, origin on the ground at the centre of the hit box.
name: endor_imperial-bunker
art: art:endor:imperial-bunker
palette: greybox
cells: [6, 7]
foot: [48, 72]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hill:   {ramp: dark,  bands: [0.05, 0.35, 0.72]}
  hill2:  {ramp: dark,  bands: [0.15, 0.45, 0.8]}
  stone:  {ramp: light, bands: [0.25, 0.55, 0.85]}
  rib:    {ramp: mid,   bands: [0.15, 0.45, 0.8]}
  dark:   {ramp: dark,  bands: [0.4, 0.7, 0.95]}
  door:   {ramp: dark,  bands: [0.1, 0.4, 0.75]}
  metal:  {ramp: light, bands: [0.15, 0.5, 0.82]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [96, 80]
parts:
  # the hillside the bunker is dug into: low faceted mounds behind and beside the doorway
  - name: hill
    mat: hill
    hull: {points: [[-2.9, -1.4, 0], [2.85, -1.4, 0], [-2.9, 2.3, 0], [2.85, 2.3, 0],
                    [-2.2, -0.9, 1.1], [2.3, -0.8, 1.2], [-2.0, 1.7, 1.3], [2.1, 1.8, 1.2], [-0.4, 0.6, 1.75], [0.8, 0.9, 1.7]], round: 0.06}
  - name: hill-w
    mat: hill2
    hull: {points: [[-2.95, -2.3, 0], [-2.1, -2.3, 0], [-2.95, -0.6, 0], [-1.9, -0.7, 0], [-2.7, -1.3, 0.6], [-2.3, -1.2, 0.5]], round: 0.05}
  - name: hill-e
    mat: hill2
    hull: {points: [[2.1, -2.3, 0], [2.85, -2.3, 0], [1.9, -0.7, 0], [2.85, -0.6, 0], [2.3, -1.3, 0.6], [2.7, -1.25, 0.55]], round: 0.05}
  # boulders and ferns at the foot of the hill
  - {name: rock-w, mat: rib, hull: {points: [[-2.75, -2.25, 0], [-2.3, -2.3, 0], [-2.35, -1.95, 0], [-2.7, -1.95, 0], [-2.55, -2.1, 0.35]], round: 0.04}}
  # the concrete doorway: a trapezoid face with sloped sides, the roof lip, the slatted blast door
  - name: facade
    mat: stone
    extrude: {axis: y, span: [-2.15, -1.3], profile: [[-1.95, 0], [1.95, 0], [1.45, 1.75], [-1.45, 1.75]], round: 0.03}
  - {name: roof, mat: stone, box: {c: [0, -1.55, 1.82], half: [1.6, 0.62, 0.1], radius: 0.03}}
  - {name: recess, mat: dark, box: {c: [0, -2.17, 0.72], half: [0.82, 0.05, 0.72], radius: 0.02}}
  - {name: door-1, mat: door, box: {c: [0, -2.22, 0.22], half: [0.76, 0.02, 0.1], radius: 0.01}}
  - {name: door-2, mat: door, box: {c: [0, -2.22, 0.52], half: [0.76, 0.02, 0.1], radius: 0.01}}
  - {name: door-3, mat: door, box: {c: [0, -2.22, 0.82], half: [0.76, 0.02, 0.1], radius: 0.01}}
  - {name: door-4, mat: door, box: {c: [0, -2.22, 1.12], half: [0.76, 0.02, 0.1], radius: 0.01}}
  # the slats along the sloped sides
  - {name: slat-w1, mat: rib, box: {c: [-1.55, -2.17, 0.45], half: [0.06, 0.03, 0.45], radius: 0.01}, rot: [-16, 0, 0]}
  - {name: slat-w2, mat: rib, box: {c: [-1.3, -2.17, 0.85], half: [0.06, 0.03, 0.7], radius: 0.01}, rot: [-16, 0, 0]}
  - {name: slat-e1, mat: rib, box: {c: [1.55, -2.17, 0.45], half: [0.06, 0.03, 0.45], radius: 0.01}, rot: [16, 0, 0]}
  - {name: slat-e2, mat: rib, box: {c: [1.3, -2.17, 0.85], half: [0.06, 0.03, 0.7], radius: 0.01}, rot: [16, 0, 0]}
  # the shield-generator dish on its tower, up on the hill, tipped to the sky
  - {name: tower, mat: metal, cylinder: {a: [1.1, 1.3, 1.3], b: [1.1, 1.3, 2.05], r1: 0.22, r2: 0.16}}
  - {name: dish-back, mat: metal, cone: {a: [1.10, 1.28, 2.07], b: [1.10, 1.04, 2.31], r1: 0.12, r2: 0.62}}
  - {name: dish-rim, mat: metal, cylinder: {a: [1.10, 1.04, 2.31], b: [1.10, 1.00, 2.35], r1: 0.72}}
  - {name: dish, mat: dark, cylinder: {a: [1.10, 1.00, 2.35], b: [1.10, 0.99, 2.36], r1: 0.6}}
  - {name: feed, mat: metal, cylinder: {a: [1.10, 1.00, 2.35], b: [1.10, 0.75, 2.60], r1: 0.04}}
