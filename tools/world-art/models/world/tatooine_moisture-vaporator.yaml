# Moisture vaporator (art:tatooine:moisture-vaporator), hit box 1x2, drawn 1x2.
# Reference: the Lars farm vaporators (moisture-vaporator__db_moisture-vaporator, __db_lars-moisture-farm):
# a tall stepped column on a squat drum, a square valve box with a round wheel on its south face, condenser
# rings up the shaft, a thin antenna at the top and two slim side posts. The column
# is built here at 1-cell scale
# (the kit vaporator in kits/tatooine.yaml is too wide for one cell).
# Axes: x east, y north, z up, origin on the ground at the column's centre.
name: tatooine_moisture-vaporator
art: art:tatooine:moisture-vaporator
palette: greybox
cells: [1, 2]
foot: [8, 27]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  light: {ramp: light, bands: [-0.2, 0.25, 0.72]}
  mid:   {ramp: mid,   bands: [-0.1, 0.35, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [16, 32]
params: {h: 1.3}
parts:
  # the column: a squat drum, a slim stepped shaft with collars, a cap
  - {name: drum, mat: mid, cylinder: {a: [0, 0, 0], b: [0, 0, 0.26], r1: 0.22, r2: 0.2}}
  - {name: shaft, mat: light, cylinder: {a: [0, 0, 0.2], b: [0, 0, "=h"], r1: 0.12, r2: 0.09}}
  - {name: collar-1, mat: light, cylinder: {a: [0, 0, 0.62], b: [0, 0, 0.72], r1: 0.16}}
  - {name: collar-2, mat: mid, cylinder: {a: [0, 0, 0.9], b: [0, 0, 0.97], r1: 0.15}}
  - {name: collar-3, mat: mid, cylinder: {a: [0, 0, 1.1], b: [0, 0, 1.16], r1: 0.13}}
  - {name: cap, mat: mid, cylinder: {a: [0, 0, "=h"], b: [0, 0, "=h + 0.08"], r1: 0.11, r2: 0.07}}
  # the valve box on the south face, its wheel dark
  - {name: valve-box, mat: light, box: {c: [0, -0.1, 0.42], half: [0.15, 0.1, 0.13], radius: 0.02}}
  - {name: wheel, mat: dark, cylinder: {a: [0, -0.2, 0.42], b: [0, -0.22, 0.42], r1: 0.07}}
  # the two slim side posts with their cross arm and dark tips
  - {name: post-w, mat: mid, box: {c: [-0.36, -0.02, 0.4], half: [0.035, 0.035, 0.4], radius: 0.01}}
  - {name: post-e, mat: mid, box: {c: [0.36, -0.02, 0.4], half: [0.035, 0.035, 0.4], radius: 0.01}}
  - {name: arm, mat: mid, box: {c: [0, -0.02, 0.62], half: [0.36, 0.025, 0.025]}}
  - {name: tip-w, mat: dark, box: {c: [-0.36, -0.02, 0.82], half: [0.05, 0.05, 0.04], radius: 0.01}}
  - {name: tip-e, mat: dark, box: {c: [0.36, -0.02, 0.82], half: [0.05, 0.05, 0.04], radius: 0.01}}
  # the antenna
  - {name: antenna, mat: mid, box: {c: [0, 0, "=h + 0.24"], half: [0.022, 0.022, 0.16]}}
variants:
  working: {}
  # broken down: the posts gone, the column leaning
  dead:
    drop: ["post-*", "arm", "tip-*", "antenna"]
    tilt: [-7, 0]
