# Fuel tanks (art:shared:fuel-tanks), hit box 2x2, drawn 2x3.
# Reference: the pressure tanks round Mos Eisley's docking bays and Tosche Station (A New Hope): round
# tanks with domed tops, a band, a valve on top, joined by pipes. Two standing tanks with a pipe run
# and a valve wheel between them; a second variant has one tank lying on cradles.
# Axes: x east, y north, z up; origin on the ground at the hit box's south-centre.
name: shared_fuel-tanks
art: art:shared:fuel-tanks
palette: greybox
kits: [../scenery/kits/shared-a.yaml]
cells: [2, 3]
foot: [16, 46]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  mid:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  light: {ramp: light, bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  pipe:  {ramp: dark,  bands: [0.1, 0.4, 0.8]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [30, 30]
params:
  r: 0.4
parts:
  - {use: tank-standing, name: tank-w, at: [-0.46, 0.25, 0], with: {h: 1.45, r: "=r"}}
  - {use: tank-standing, name: tank-e, at: [0.47, 0.35, 0], with: {h: 1.2, r: 0.38}}
  # the pipe run between them, a valve wheel on it facing south
  - {name: pipe-low, mat: pipe, cylinder: {a: [-0.3, 0.42, 0.35], b: [0.3, 0.42, 0.35], r1: 0.07}}
  - {name: pipe-up, mat: pipe, cylinder: {a: [0, 0.42, 0.35], b: [0, 0.42, 0.9], r1: 0.06}}
  - {name: pipe-top, mat: pipe, cylinder: {a: [-0.2, 0.45, 0.9], b: [0.25, 0.45, 0.9], r1: 0.06}}
  - {name: wheel, mat: light, cylinder: {a: [0, 0.3, 0.6], b: [0, 0.26, 0.6], r1: 0.13}}
  - {name: hub, mat: dark, cylinder: {a: [0, 0.27, 0.6], b: [0, 0.24, 0.6], r1: 0.04}}
variants:
  standing: {}
  # one tank lying on its cradles in front of the other
  lying:
    drop: ["tank-e/*", "pipe-top", "pipe-up", "wheel", "hub"]
    parts:
      - {use: tank-standing, name: tank-w, at: [-0.46, 0.75, 0], with: {h: 1.25, r: 0.4}}
      - {use: tank-lying, name: tank-l, at: [0.04, 0.0, 0], with: {len: 1.7, r: 0.36}}
      - {name: pipe-low, mat: pipe, cylinder: {a: [-0.5, 1.0, 0.45], b: [0.6, 1.0, 0.45], r1: 0.07}}
      - {name: pipe-dn, mat: pipe, cylinder: {a: [0.6, 1.0, 0.45], b: [0.6, 0.6, 0.45], r1: 0.07}}
