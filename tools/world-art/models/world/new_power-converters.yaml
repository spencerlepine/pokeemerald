# Power converters (art:new:power-converters), hit box 4x2, drawn 4x3. Tosche Station (A New Hope:
# "I was going into Tosche Station to pick up some power converters"). A stock bench of three
# converters: squat boxy units with a ribbed coil drum on top and a dark socket face to the south,
# cabled together, on a low metal stand, a spare drum on the floor beside it.
# Axes: x east, y north from the hit box's south edge, z up; origin at the hit box's south-centre.
name: new_power-converters
art: art:new:power-converters
palette: greybox
cells: [4, 3]
foot: [32, 47]
scale: 0.97
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  body:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [62, 30]
templates:
  converter:
    params: {h: 0.8}
    parts:
      - {name: case, mat: body, box: {c: [0, 0, "=h / 2"], half: [0.42, 0.36, "=h / 2"], radius: 0.05}}
      - {name: face, mat: dark, box: {c: [0, -0.36, "=h / 2"], half: [0.28, 0.03, "=h / 2 - 0.1"], radius: 0.02}}
      - {name: plug-1, mat: trim, ellipsoid: {c: [-0.12, -0.39, "=h / 2"], r: [0.07, 0.03, 0.07]}}
      - {name: plug-2, mat: trim, ellipsoid: {c: [0.12, -0.39, "=h / 2"], r: [0.07, 0.03, 0.07]}}
      - {name: drum, mat: trim, cylinder: {a: [0, 0, "=h"], b: [0, 0, "=h + 0.32"], r1: 0.3}}
      - {name: rib-1, mat: body, cylinder: {a: [0, 0, "=h + 0.08"], b: [0, 0, "=h + 0.12"], r1: 0.32}}
      - {name: rib-2, mat: body, cylinder: {a: [0, 0, "=h + 0.18"], b: [0, 0, "=h + 0.22"], r1: 0.32}}
      - {name: cap, mat: body, cylinder: {a: [0, 0, "=h + 0.32"], b: [0, 0, "=h + 0.4"], r1: 0.22, r2: 0.14}}
      - {name: post, mat: dark, cylinder: {a: [0, 0, "=h + 0.4"], b: [0, 0, "=h + 0.52"], r1: 0.05}}
parts:
  # the low stand
  - {name: top, mat: trim, box: {c: [0, 0.72, 0.36], half: [1.88, 0.62, 0.05], radius: 0.02}}
  - {name: rail, mat: body, box: {c: [0, 0.14, 0.24], half: [1.82, 0.03, 0.08]}}
  - {name: leg-w, mat: body, box: {c: [-1.78, 0.85, 0.16], half: [0.07, 0.72, 0.16]}}
  - {name: leg-e, mat: body, box: {c: [1.78, 0.85, 0.16], half: [0.07, 0.72, 0.16]}}
  - {name: under, mat: dark, box: {c: [0, 0.9, 0.16], half: [1.7, 0.6, 0.16]}}
  # three converters
  - {use: converter, name: cv-1, at: [-1.2, 0.6, 0.41]}
  - {use: converter, name: cv-2, at: [0.0, 0.6, 0.41], with: {h: 0.9}}
  - {use: converter, name: cv-3, at: [1.2, 0.6, 0.41]}
  # cables slung between them
  - {name: cable-1, mat: dark, cylinder: {a: [-0.82, 0.55, 1.05], b: [-0.4, 0.55, 0.95], r1: 0.04}}
  - {name: cable-2, mat: dark, cylinder: {a: [0.4, 0.55, 0.95], b: [0.82, 0.55, 1.05], r1: 0.04}}
