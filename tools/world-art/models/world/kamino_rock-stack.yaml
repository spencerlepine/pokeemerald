# Rock stack (art:kamino:rock-stack), hit box 1x1, drawn 1x2.
# Reference: the black sea stacks off Kamino's rock islets (storm sea, The Clone Wars): a tall
# faceted black pillar, flat-ish top, white surf round its foot. Like the vanilla cone rock, a
# convex hull with soft edges, but taller and darker.
# Axes: x east, y north, z up, origin on the sea at the cell's centre.
name: kamino_rock-stack
art: art:kamino:rock-stack
palette: greybox
cells: [1, 2]
foot: [7.5, 23]
scale: 0.86
footprint: 1
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  rock: {ramp: dark,  bands: [0.25, 0.55, 0.85]}
  cap:  {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  foam: {ramp: light, bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 1}
box: [16, 16]
parts:
  - name: stack
    mat: rock
    hull: {points: [[-0.45, -0.25, 0], [0.0, -0.33, 0], [0.42, -0.2, 0], [0.45, 0.2, 0], [-0.1, 0.3, 0], [-0.44, 0.15, 0],
                    [-0.36, -0.2, 0.7], [0.32, -0.24, 0.85], [0.36, 0.1, 0.8], [-0.3, 0.15, 0.75],
                    [-0.22, -0.12, 1.3], [0.2, -0.14, 1.4], [0.12, 0.08, 1.45], [-0.18, 0.06, 1.35]], round: 0.025}
ground:
  - {name: surf, mat: foam, ellipsoid: {c: [0.0, -0.22, 0], r: [0.42, 0.1, 0.06]}}
