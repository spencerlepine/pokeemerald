# Fortress Vader halls (art:mustafar:fortress-halls), a whole room, 20x20 cells.
# The halls of Vader's castle (Rogue One): black stone, red-lit strips up the walls (light here), a lava
# conduit crossing the floor under a bridge, the raised dais of the meditation chamber against the
# north wall and Vader's upright bacta tank beside it. Seen in the game camera: the floor in plan, the
# north wall's face showing, the side walls edge-on, the door gap in the south wall.
# The fortress maps (wiki/world/mustafar/caves/fortress-vader-*) are cave grids; this is the room kit
# they share: halls, conduits, the chamber. Axes: x east, y north, z up, origin on the floor at the
# room's south edge, middle.
name: mustafar_fortress-halls
art: art:mustafar:fortress-halls
palette: greybox
cells: [20, 20]
foot: [160, 320]
footprint: 1        # a room has no hit box; this is the south wall's row, for the scene check
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  floor:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  runner: {ramp: dark,  bands: [0.2, 0.5, 0.95]}
  stone:  {ramp: dark,  bands: [0.15, 0.45, 0.75]}
  wall:   {ramp: mid,   bands: [0.35, 0.65, 0.95]}
  trim:   {ramp: light, bands: [0.15, 0.5, 0.82]}
  glow:   {ramp: light, bands: [0.1, 0.35, 0.65]}
  glass:  {ramp: light, bands: [0.2, 0.55, 0.88]}
  dark:   {ramp: dark,  bands: [0.3, 0.6, 0.95]}
box: null
parts:
