  - {name: floor, mat: floor, box: {c: [0, 8.6, 0.03], half: [9.7, 8.6, 0.03]}}
  - {name: runner, mat: runner, box: {c: [0, 6.0, 0.07], half: [1.2, 5.9, 0.03]}}
  # the north wall: its face with red light strips, a heavy cornice
  - {name: wall-n, mat: wall, box: {c: [0, 17.3, 1.2], half: [10.0, 0.3, 1.2]}}
  - {name: cornice-n, mat: stone, box: {c: [0, 17.0, 2.3], half: [10.0, 0.12, 0.1]}}
  # the side walls, edge-on
