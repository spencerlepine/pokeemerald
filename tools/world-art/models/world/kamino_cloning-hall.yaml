# Cloning hall (art:kamino:cloning-hall), a whole room 12x9, seen in the game camera.
# Reference: Tipoca City's cloning halls (Attack of the Clones): white curved walls, a smooth pale
# floor, banks of glass growth pods on dark plinths. Laid out like the area map
# (wiki/world/kamino/interiors/tipoca-city-cloning-hall.yaml, 26x16 there, drawn here at the row's
# 12x9): the north wall face with the sealed lab door in its middle, two pod banks along it, two more
# mid-room, the entrance gap in the south wall. Side walls edge-on, rounded at the north corners.
# Axes: x east, y north, z up, origin on the floor at the middle of the south edge.
name: kamino_cloning-hall
art: art:kamino:cloning-hall
palette: greybox
kits: [../scenery/kits/bespin-kamino.yaml]
cells: [12, 9]
foot: [96, 144]
footprint: 1
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
