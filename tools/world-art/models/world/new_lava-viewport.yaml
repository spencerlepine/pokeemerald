# Lava viewport (art:new:lava-viewport), hit box 3x3, drawn 3x4.
# Reference: the Mustafar mining facility's control centre (Revenge of the Sith), built out over the
# lava with wide armoured windows; here a viewport set into the floor: a heavy square frame with
# canted inner edges, a dark pane with the glowing lava river showing through it, divided by a cross
# of mullions, and a safety rail round it. Axes: x east, y north, z up, origin on the ground at the
# footprint's south-west corner.
name: new_lava-viewport
art: art:new:lava-viewport
palette: greybox
cells: [3, 4]
foot: [0, 64]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  frame: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  rim:   {ramp: light, bands: [0.1, 0.45, 0.8]}
  glass: {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  lava:  {ramp: bone,  bands: [-0.6, -0.3, 0.0]}
  rail:  {ramp: dark,  bands: [0.1, 0.4, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [46, 46]
groups: {frame: {}, body: {}}
parts:
  # the frame: a low square kerb with canted inner sides, the window cut out of it
  - name: kerb
    mat: frame
    group: frame
    prism: {poly: [[0.12, 0.12], [2.86, 0.12], [2.86, 2.86], [0.12, 2.86]], z: [0, 0.22], top: 0.97, round: 0.04}
  - name: well
    mat: frame
    group: frame
    op: subtract
    prism: {poly: [[0.55, 0.55], [2.43, 0.55], [2.43, 2.43], [0.55, 2.43]], z: [0.02, 0.4], top: 1.25, round: 0.0}
  - {name: rim, mat: rim, group: frame, prism: {poly: [[0.12, 0.12], [2.86, 0.12], [2.86, 2.86], [0.12, 2.86]], z: [0.2, 0.24], top: 0.99, round: 0.01}}
  # the pane, and the lava river glowing under it
  - {name: pane, mat: glass, prism: {poly: [[0.5, 0.5], [2.48, 0.5], [2.48, 2.48], [0.5, 2.48]], z: [0, 0.04], round: 0.0}}
  - {name: river-1, mat: lava, prism: {poly: [[0.52, 1.35], [0.95, 1.75], [1.45, 2.46], [0.95, 2.46], [0.52, 1.95]], z: [0, 0.06], round: 0.01}}
  - {name: river-2, mat: lava, prism: {poly: [[0.95, 1.2], [1.55, 0.85], [2.05, 1.35], [1.6, 1.9], [1.2, 1.7]], z: [0, 0.06], round: 0.01}}
  - {name: river-3, mat: lava, prism: {poly: [[1.85, 0.52], [2.46, 0.52], [2.46, 1.15], [2.15, 0.95]], z: [0, 0.06], round: 0.01}}
  - {name: mullion-x, mat: frame, box: {c: [1.49, 1.49, 0.07], half: [0.98, 0.05, 0.04], radius: 0.01}}
  - {name: mullion-y, mat: frame, box: {c: [1.49, 1.49, 0.07], half: [0.05, 0.98, 0.04], radius: 0.01}}
  # the safety rail: posts at the corners and mid-sides, a top rail on three sides, open to the south (a rail there would cross the window)
  - {name: post-sw, mat: rail, cylinder: {a: [0.22, 0.22, 0.2], b: [0.22, 0.22, 0.75], r1: 0.05}}
  - {name: post-se, mat: rail, cylinder: {a: [2.76, 0.22, 0.2], b: [2.76, 0.22, 0.75], r1: 0.05}}
  - {name: post-nw, mat: rail, cylinder: {a: [0.22, 2.76, 0.2], b: [0.22, 2.76, 0.75], r1: 0.05}}
  - {name: post-ne, mat: rail, cylinder: {a: [2.76, 2.76, 0.2], b: [2.76, 2.76, 0.75], r1: 0.05}}
  - {name: rail-w, mat: rim, cylinder: {a: [0.22, 0.22, 0.73], b: [0.22, 2.76, 0.73], r1: 0.045}}
  - {name: rail-e, mat: rim, cylinder: {a: [2.76, 0.22, 0.73], b: [2.76, 2.76, 0.73], r1: 0.045}}
  - {name: rail-n, mat: rim, cylinder: {a: [0.22, 2.76, 0.73], b: [2.76, 2.76, 0.73], r1: 0.045}}
