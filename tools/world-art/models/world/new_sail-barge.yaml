# Sail barge (art:new:sail-barge), hit box 12x4, drawn 12x8. Jabba's palace barge dock: the
# Khetanna (Return of the Jedi) moored, hovering a little over the dock floor. A long hull with a
# wide flared skirt, a band of dark ports along the side, a plank deck with a rail, the cabin block
# aft with a raised stern deck, two masts with tall sails facing the camera (south), and the deck
# cannon on the bow. Variant `sails-furled`: masts bare, sails down.
# Axes: x east (bow +x), y north from the hit box's south edge, z up; origin at the hit box's
# south-centre.
name: new_sail-barge
art: art:new:sail-barge
palette: greybox
cells: [12, 8]
foot: [95, 127]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  band:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  deck:  {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  sail:  {ramp: bone,  bands: [0.25, 0.55, 0.9]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [190, 62]
templates:
  port:
    parts:
      - {name: p, mat: dark, box: {c: [0, 0, 0], half: [0.24, 0.05, 0.16], radius: 0.03}}
  mast:
    params: {h: 5.4, w: 1.15, tw: 0.6}
    parts:
      - {name: pole, mat: dark, cylinder: {a: [0, 0, 1.85], b: [0, 0, "=h"], r1: 0.08, r2: 0.06}}
      - {name: yard, mat: dark, cylinder: {a: ["=-tw - 0.1", 0, "=h - 0.2"], b: ["=tw + 0.1", 0, "=h - 0.2"], r1: 0.05}}
      - {name: boom, mat: dark, cylinder: {a: ["=-w - 0.1", 0, 2.55], b: ["=w + 0.1", 0, 2.55], r1: 0.06}}
      - name: sail
        mat: sail
        extrude: {axis: y, span: [-0.14, -0.06], profile: [["=-w", 2.6], ["=w", 2.6], ["=tw", "=h - 0.25"], ["=-tw", "=h - 0.25"]], round: 0.02}
      - {name: roll, mat: sail, cylinder: {a: ["=-w", -0.02, 2.68], b: ["=w", -0.02, 2.68], r1: 0.14}}
      - {name: seam, mat: band, box: {c: [0, -0.15, "=(h + 2.35) / 2"], half: [0.04, 0.02, "=(h - 2.85) / 2"]}}
parts:
  # the skirt: flared out from a narrow keel to the wide hull
  - name: skirt
    mat: dark
    hull: {points: [[-5.1, 0.7, 0.3], [4.4, 0.7, 0.3], [-5.1, 2.9, 0.3], [4.4, 2.9, 0.3],
                    [-5.75, 0.08, 0.9], [5.0, 0.08, 0.9], [-5.75, 3.65, 0.9], [5.0, 3.65, 0.9], [5.85, 1.9, 0.9], [5.3, 1.9, 0.5]], round: 0.06}
  # the tall side with its row of dark ports, a light trim along the top
  - name: band
    mat: hull
    hull: {points: [[-5.8, 0.02, 0.85], [5.05, 0.02, 0.85], [-5.8, 3.7, 0.85], [5.05, 3.7, 0.85], [5.9, 1.9, 0.85],
                    [-5.8, 0.02, 1.75], [5.05, 0.02, 1.75], [-5.8, 3.7, 1.75], [5.05, 3.7, 1.75], [5.9, 1.9, 1.75]], round: 0.04}
  - name: trim
    mat: band
    hull: {points: [[-5.82, 0.0, 1.72], [5.07, 0.0, 1.72], [-5.82, 3.72, 1.72], [5.07, 3.72, 1.72], [5.94, 1.9, 1.72],
                    [-5.82, 0.0, 1.86], [5.07, 0.0, 1.86], [-5.82, 3.72, 1.86], [5.07, 3.72, 1.86], [5.94, 1.9, 1.86]], round: 0.03}
  - {use: port, name: port-1, at: [-4.6, 0.0, 1.3]}
  - {use: port, name: port-2, at: [-3.6, 0.0, 1.3]}
  - {use: port, name: port-3, at: [-2.6, 0.0, 1.3]}
  - {use: port, name: port-4, at: [-1.6, 0.0, 1.3]}
  - {use: port, name: port-5, at: [-0.6, 0.0, 1.3]}
  - {use: port, name: port-6, at: [0.4, 0.0, 1.3]}
  - {use: port, name: port-7, at: [1.4, 0.0, 1.3]}
  - {use: port, name: port-8, at: [2.4, 0.0, 1.3]}
  - {use: port, name: port-9, at: [3.4, 0.0, 1.3]}
  - {use: port, name: port-10, at: [4.4, 0.0, 1.3]}
  # the deck and its rail along the south side
  - name: deck
    mat: deck
    hull: {points: [[-5.7, 0.12, 1.8], [5.0, 0.12, 1.8], [-5.7, 3.6, 1.8], [5.0, 3.6, 1.8], [5.8, 1.9, 1.8],
                    [-5.7, 0.12, 1.9], [5.0, 0.12, 1.9], [-5.7, 3.6, 1.9], [5.0, 3.6, 1.9], [5.8, 1.9, 1.9]], round: 0.02}
  - {name: rail, mat: dark, box: {c: [0.3, 0.16, 2.14], half: [4.6, 0.03, 0.03]}}
  - {name: rail-n, mat: dark, box: {c: [0.3, 3.55, 2.12], half: [4.6, 0.03, 0.03]}}
  # the cabin block aft and the raised stern deck
  - name: cabin
    mat: band
    prism: {poly: [[-4.0, 1.0], [-1.0, 1.0], [-1.0, 3.2], [-4.0, 3.2]], z: [1.85, 2.75], top: [0.95, 0.9], round: 0.05}
  - {name: cabin-roof, mat: hull, box: {c: [-2.5, 2.1, 2.8], half: [1.5, 1.05, 0.06], radius: 0.03}}
  - {name: cabin-door, mat: dark, box: {c: [-2.5, 1.0, 2.2], half: [0.3, 0.05, 0.32], radius: 0.03}}
  - {name: cabin-win-w, mat: dark, box: {c: [-3.4, 1.02, 2.4], half: [0.3, 0.04, 0.12], radius: 0.03}}
  - {name: cabin-win-e, mat: dark, box: {c: [-1.6, 1.02, 2.4], half: [0.3, 0.04, 0.12], radius: 0.03}}
  - name: stern
    mat: hull
    prism: {poly: [[-5.75, 0.4], [-4.3, 0.4], [-4.3, 3.6], [-5.75, 3.6]], z: [1.85, 2.4], top: [1.0, 1.0], round: 0.04}
  - {name: stern-deck, mat: deck, box: {c: [-5.0, 2.0, 2.42], half: [0.72, 1.58, 0.04], radius: 0.02}}
  # two masts with their sails
  - {use: mast, name: mast-a, at: [0.4, 2.3, 0]}
  - {use: mast, name: mast-b, at: [3.0, 2.3, 0], with: {h: 4.9, w: 0.95, tw: 0.5}}
  # the deck cannon on the bow
  - {name: gun-base, mat: dark, cylinder: {a: [4.6, 2.0, 1.88], b: [4.6, 2.0, 2.2], r1: 0.32, r2: 0.26}}
  - {name: gun-body, mat: hull, box: {c: [4.65, 2.0, 2.35], half: [0.32, 0.22, 0.16], radius: 0.05}}
  - {name: gun-barrel, mat: dark, cylinder: {a: [4.9, 1.9, 2.38], b: [5.75, 1.35, 2.42], r1: 0.07}}
ground:
  # the barge hovers: its shadow on the dock floor
  - {name: hover-shadow, mat: dark, box: {c: [-0.2, 1.6, 0.04], half: [5.2, 1.5, 0.04], radius: 0.03}}
variants:
  sails-up:
    drop: ["mast-*/roll"]
  sails-furled:
    drop: ["mast-*/sail", "mast-*/seam"]   # rolled up on the booms
