# Wellspring pool (art:grand-arena:wellspring-pool), hit box 4x4, drawn 4x6.
# Reference: the Well of the Force on Mortis (The Clone Wars) and its glowing groves: a round pool of
# bright water in a ring of worn stones, with bare white trees whose branches fork like lightning
# standing behind it. Axes: x east, y north, z up, origin on the ground at the pool's centre.
name: grand-arena_wellspring-pool
art: art:grand-arena:wellspring-pool
palette: greybox
cells: [4, 6]
foot: [32, 63]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
groups: {body: {}, face: {}}
materials:
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  water: {ramp: light, bands: [0.2, 0.5, 0.9]}
  deep:  {ramp: light, bands: [0.0, 0.05, 0.2]}
  bark:  {ramp: bone,  bands: [0.15, 0.45, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [64, 64]
templates:
  # a bare tree, its branches forking upward like lightning
  ghost-tree:
    params: {h: 2.4, s: 1.0}
    parts:
      - {name: trunk, mat: bark, cylinder: {a: [0, 0, 0], b: [0.05, 0, "=h * 0.5"], r1: "=0.16*s", r2: "=0.11*s"}}
      - {name: root-w, mat: bark, cylinder: {a: [0, 0, 0.1], b: ["=-0.35*s", "=-0.1*s", 0], r1: "=0.08*s", r2: 0.04}}
      - {name: root-e, mat: bark, cylinder: {a: [0, 0, 0.1], b: ["=0.35*s", "=-0.05*s", 0], r1: "=0.08*s", r2: 0.04}}
      - {name: limb-w, mat: bark, cylinder: {a: [0.05, 0, "=h * 0.45"], b: ["=-0.45*s", -0.05, "=h * 0.8"], r1: "=0.09*s", r2: "=0.06*s"}}
      - {name: limb-e, mat: bark, cylinder: {a: [0.05, 0, "=h * 0.45"], b: ["=0.5*s", -0.05, "=h * 0.75"], r1: "=0.09*s", r2: "=0.06*s"}}
      - {name: limb-c, mat: bark, cylinder: {a: [0.05, 0, "=h * 0.45"], b: ["=0.1*s", 0, "=h"], r1: "=0.08*s", r2: "=0.04*s"}}
      - {name: twig-w1, mat: bark, cylinder: {a: ["=-0.45*s", -0.05, "=h * 0.8"], b: ["=-0.75*s", -0.05, "=h * 0.92"], r1: "=0.05*s", r2: 0.025}}
      - {name: twig-w2, mat: bark, cylinder: {a: ["=-0.45*s", -0.05, "=h * 0.8"], b: ["=-0.4*s", -0.05, "=h * 1.0"], r1: "=0.05*s", r2: 0.025}}
      - {name: twig-e1, mat: bark, cylinder: {a: ["=0.5*s", -0.05, "=h * 0.75"], b: ["=0.82*s", -0.05, "=h * 0.85"], r1: "=0.05*s", r2: 0.025}}
      - {name: twig-e2, mat: bark, cylinder: {a: ["=0.5*s", -0.05, "=h * 0.75"], b: ["=0.55*s", -0.05, "=h * 0.97"], r1: "=0.05*s", r2: 0.025}}
parts:
  # the stone ring and the pool in it
  - {name: rim, mat: stone, cylinder: {a: [0, -0.15, 0], b: [0, -0.15, 0.28], r1: 1.62, r2: 1.55}, squash: [1, 0.92, 1]}
  - {name: basin, mat: stone, op: subtract, cylinder: {a: [0, -0.15, 0.12], b: [0, -0.15, 0.5], r1: 1.28}, squash: [1, 0.92, 1]}
  - {name: water, mat: water, group: face, cylinder: {a: [0, -0.15, 0], b: [0, -0.15, 0.17], r1: 1.3}, squash: [1, 0.92, 1]}
  - {name: deep, mat: deep, group: face, cylinder: {a: [0.15, -0.05, 0], b: [0.15, -0.05, 0.18], r1: 0.75}, squash: [1, 0.8, 1]}
  # worn stones on the rim
  - {name: rock-1, mat: stone, hull: {points: [[-1.75, -0.7, 0], [-1.25, -0.85, 0], [-1.3, -0.4, 0], [-1.7, -0.35, 0], [-1.5, -0.6, 0.5]], round: 0.04}}
  - {name: rock-2, mat: stone, hull: {points: [[1.2, -1.05, 0], [1.7, -0.9, 0], [1.6, -0.55, 0], [1.25, -0.6, 0], [1.45, -0.8, 0.42]], round: 0.04}}
  - {name: rock-3, mat: stone, hull: {points: [[-0.3, 1.25, 0], [0.4, 1.3, 0], [0.35, 1.6, 0], [-0.25, 1.6, 0], [0.05, 1.45, 0.38]], round: 0.04}}
  # the white trees behind it
  - {use: ghost-tree, name: tree-w, at: [-1.15, 1.35, 0], with: {h: 2.5, s: 0.85}}
  - {use: ghost-tree, name: tree-e, at: [1.12, 1.45, 0], with: {h: 2.2, s: 0.8}}
