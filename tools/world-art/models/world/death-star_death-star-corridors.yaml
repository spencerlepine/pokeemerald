# Death Star corridors (art:death-star:death-star-corridors), a whole room, 20x20 (greybox room).
# Reference: the Death Star's corridors (A New Hope, Rogue One): black deck plates, grey wall panels
# with white light strips, blast doors and wall consoles. Drawn as Emerald draws an interior: the floor
# in plan, the north wall's face across the top three rows (a blast door in the middle, a turbolift door
# and consoles on it), the side walls edge-on as dark strips, and four panelled wall blocks that make a
# grid of corridors (like the DS decks' grids). The block tops are the dark void above the walls.
# Axes: x east, y north from the room's south-west corner, z up.
name: death-star_death-star-corridors
art: art:death-star:death-star-corridors
palette: greybox
kits: [../scenery/kits/deathstar-arena-jedha.yaml]
cells: [20, 20]
foot: [0, 320]
footprint: 1
box: null
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
groups: {body: {}, face: {}}
