# Prof. Korr's lab (art:tatooine:prof-korr-s-lab), hit box 7x5, drawn 7x5. Mos Pelgo.
# Reference: the flat-roofed adobe blocks of Tatooine's towns (the Ksar Hadada and Tataouine sets): a
# wide two-part adobe block, solar panels tilted up on the roof, a dish antenna on a mast at the corner,
# the entrance under a small porch.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre. Door: column 3 (x = 0).
name: tatooine_prof-korr-s-lab
art: art:tatooine:prof-korr-s-lab
palette: greybox
kits: [../scenery/kits/tatooine-buildings.yaml]
cells: [7, 5]
foot: [56, 40]
footprint: 5
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  adobe: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  mid:   {ramp: mid,   bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 5}
box: [108, 76]
parts:
  # the two blocks: the tall lab west, the lower annex east
  - {use: block, name: lab, at: [-0.85, -0.6, 0], with: {w: 4.5, d: 3.2, h: 1.35, mat: trim, lip: adobe}}
  - {use: block, name: annex, at: [2.3, -0.85, 0], with: {w: 1.9, d: 2.6, h: 1.0, mat: adobe}}
  # the porch and door
  - {name: porch, mat: adobe, box: {c: [0, -2.2, 1.0], half: [0.75, 0.2, 0.06], radius: 0.02}}
  - {name: post-w, mat: adobe, box: {c: [-0.65, -2.32, 0.5], half: [0.07, 0.07, 0.5], radius: 0.02}}
  - {name: post-e, mat: adobe, box: {c: [0.65, -2.32, 0.5], half: [0.07, 0.07, 0.5], radius: 0.02}}
  - {use: doorway, name: door, at: [0, -2.2, 0], with: {w: 0.6, h: 0.85}}
  - {use: slot, name: win-1, at: [-2.4, -2.2, 0], with: {z: 0.85, w: 0.45, h: 0.3}}
  - {use: slot, name: win-2, at: [-1.3, -2.2, 0], with: {z: 0.85, w: 0.45, h: 0.3}}
  - {use: slot, name: win-3, at: [2.3, -2.15, 0], with: {z: 0.6, w: 0.4, h: 0.25}}
  # solar panels on the lab roof, the dish on the annex
  - {use: solar, name: sol-1, at: [-2.15, -0.15, 1.35], with: {w: 1.0, d: 0.9, tilt: 30}}
  - {use: solar, name: sol-2, at: [-0.85, -0.15, 1.35], with: {w: 1.0, d: 0.9, tilt: 30}}
  - {use: solar, name: sol-3, at: [0.45, -0.15, 1.35], with: {w: 1.0, d: 0.9, tilt: 30}}
  - {use: dish, name: dish, at: [2.35, -0.3, 1.0], with: {r: 0.62, h: 0.75, tip: 55}}
