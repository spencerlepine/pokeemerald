# Ship cockpit (art:new:ship-cockpit), hit box 6x2, drawn 6x4. The helm of the ship rooms (the Rebel
# shuttle and the other hyperlane ships), set against the cabin's north wall. Seen from behind the
# pilots, like the Falcon's cockpit (A New Hope): a wide viewport of slanted panes with dark glass
# and light struts, a curved console of switches under it, and two pilot seats with their backs to
# the camera (south).
# Axes: x east, y north from the hit box's south edge, z up; origin at the hit box's south-centre.
name: new_ship-cockpit
art: art:new:ship-cockpit
palette: greybox
cells: [6, 4]
foot: [48, 63]
scale: 0.98
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.15, 0.5, 0.82]}
  glass: {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  seat:  {ramp: bone,  bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.15, 0.45, 0.8]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [94, 30]
templates:
  seat:
    parts:
      - {name: post, mat: dark, cylinder: {a: [0, 0.4, 0], b: [0, 0.4, 0.4], r1: 0.12}}
      - {name: cushion, mat: seat, box: {c: [0, 0.5, 0.48], half: [0.52, 0.34, 0.09], radius: 0.05}}
      - name: back
        mat: seat
        hull: {points: [[-0.58, 0.02, 0.3], [0.58, 0.02, 0.3], [-0.58, 0.26, 0.3], [0.58, 0.26, 0.3],
                        [-0.48, 0.1, 1.42], [0.48, 0.1, 1.42], [-0.48, 0.32, 1.42], [0.48, 0.32, 1.42]], round: 0.07}
      - {name: head, mat: hull, box: {c: [0, 0.08, 1.28], half: [0.3, 0.06, 0.13], radius: 0.04}}
      - {name: stripe, mat: hull, box: {c: [0, 0.02, 0.8], half: [0.44, 0.03, 0.05]}}
parts:
  # the wall frame round the viewport
  - name: frame
    mat: hull
    extrude: {axis: y, span: [1.78, 1.92], profile: [[-2.95, 0.0], [2.95, 0.0], [2.95, 1.45], [2.35, 1.95], [-2.35, 1.95], [-2.95, 1.45]], round: 0.04}
  # the viewport: dark panes divided by light struts, leaning back
  - name: glass
    mat: glass
    hull: {points: [[-2.6, 1.7, 0.85], [2.6, 1.7, 0.85], [-2.05, 1.76, 1.82], [2.05, 1.76, 1.82],
                    [-2.6, 1.74, 0.85], [2.6, 1.74, 0.85], [-2.05, 1.8, 1.82], [2.05, 1.8, 1.82]], round: 0.01}
  - {name: strut-1, mat: trim, box: {c: [-1.35, 1.7, 1.34], half: [0.07, 0.05, 0.5]}, rot: [0, -14, 0]}
  - {name: strut-2, mat: trim, box: {c: [0, 1.7, 1.34], half: [0.07, 0.05, 0.5]}}
  - {name: strut-3, mat: trim, box: {c: [1.35, 1.7, 1.34], half: [0.07, 0.05, 0.5]}, rot: [0, 14, 0]}
  - {name: sill, mat: trim, box: {c: [0, 1.66, 0.84], half: [2.75, 0.07, 0.05], radius: 0.02}}
  # the console: a low curved desk under the window, banks of switches
  - name: console
    mat: hull
    hull: {points: [[-2.7, 1.05, 0], [2.7, 1.05, 0], [-2.8, 1.75, 0], [2.8, 1.75, 0],
                    [-2.7, 1.1, 0.55], [2.7, 1.1, 0.55], [-2.8, 1.72, 0.8], [2.8, 1.72, 0.8],
                    [-1.6, 0.95, 0.0], [1.6, 0.95, 0.0], [-1.6, 1.0, 0.56], [1.6, 1.0, 0.56]], round: 0.04}
  - {name: keys-w, mat: trim, box: {c: [-1.55, 1.35, 0.7], half: [0.8, 0.16, 0.04], radius: 0.01}}
  - {name: keys-e, mat: trim, box: {c: [1.55, 1.35, 0.7], half: [0.8, 0.16, 0.04], radius: 0.01}}
  - {name: dials, mat: glass, box: {c: [0, 1.35, 0.7], half: [0.5, 0.16, 0.04], radius: 0.01}}
  # two pilot seats, backs to the camera
  - {use: seat, name: seat-w, at: [-1.05, 0.1, 0]}
  - {use: seat, name: seat-e, at: [1.05, 0.1, 0]}
