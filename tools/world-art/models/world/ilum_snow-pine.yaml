# Snow pine (art:ilum:snow-pine), hit box 2x3, drawn 2x5.
# Reference: snow-laden conifers (wiki/art/concept/ilum/snow-pine__web_*): narrow spruces whose tiers are
# heavy with snow. Two pines from the group kit, one in front and a taller one behind, so a row of them
# makes the route wall: dark tiers, each under a bone snow cap.
# Axes: x east, y north, z up, origin on the ground at the middle of the hit box.
name: ilum_snow-pine
art: art:ilum:snow-pine
palette: greybox
kits: [../scenery/kits/yavin-hoth-ilum.yaml]
cells: [2, 5]
foot: [16, 56]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  dark:  {ramp: dark,  bands: [0.15, 0.45, 0.8]}
  snow:  {ramp: bone,  bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [30, 44]
parts:
  - {use: snow-pine, name: back, at: [0.2, 0.8, 0], with: {h: 3.6, r: 0.85, n: 5}}
  - {use: snow-pine, name: front, at: [-0.15, -0.8, 0], with: {h: 2.9, r: 0.8, n: 4}}
ground:
  - {name: drift, mat: snow, ellipsoid: {c: [0, -0.8, 0], r: [0.85, 0.4, 0.12]}}
variants:
  pair: {}
  single:
    drop: ["back/*"]
