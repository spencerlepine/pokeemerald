  - {name: dune, mat: sand, ellipsoid: {c: [-2.5, 1.95, 0], r: [3.4, 0.7, 0.4]}}
  - {name: drift-jaw, mat: sand, ellipsoid: {c: [4.5, 0.62, 0], r: [1.5, 0.28, 0.16]}}
  - {name: drift-tail, mat: sand, ellipsoid: {c: [-6.6, 1.4, 0], r: [0.5, 0.8, 0.28]}}
variants:
