# Greater krayt skeleton (art:tatooine:greater-krayt-skeleton), hit box 14x3, drawn 14x6: the top 3 rows
# stand over the cells behind. Partly off the map on purpose.
# Reference: the krayt dragon skeleton C-3PO walks past in the Dune Sea (A New Hope) and the greater krayt
# of The Mandalorian. A long spine of big vertebrae lying over a dune, rising in the middle, with a fence
# of tall curved ribs swept back toward the tail, and the huge skull in profile at the east end, its jaw
# in the sand. The tail end runs off the west edge. Kit: krayt-skull, vertebra, krayt-rib.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_greater-krayt-skeleton
art: art:tatooine:greater-krayt-skeleton
palette: greybox
kits: [kits/tatooine-rest.yaml]
cells: [14, 6]
foot: [112, 95]
footprint: 3
render:
