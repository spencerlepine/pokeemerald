# Venator wreck (art:felucia:venator-wreck), hit box 20x3, drawn 20x6.
# Reference: the Venator-class Star Destroyer (Revenge of the Sith; The Clone Wars): a long dagger,
# the dorsal hull sloping down from the spine to a vertical side band (the Republic's red stripe),
# the flight-deck trench along the spine at the bow, two bridge towers side by side at the stern.
# It came down in the Felucia campaign with its spine along the reserve's north edge: only its south
# half is on the map (the north half is off it and not modelled), sunk into the ground, the bow
# east. Felucian fungi (the Felucia kit) grow up its flank.
# Axes: x east (bow), y north, z up, origin on the ground at the south middle of the hit box; the
# spine runs along y = 3, the north edge of the hit box.
name: felucia_venator-wreck
art: art:felucia:venator-wreck
palette: greybox
kits: [kits/kashyyyk-felucia-small.yaml]
cells: [20, 6]
foot: [160, 94]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  deck:   {ramp: light, bands: [0.25, 0.55, 0.88]}
  stripe: {ramp: light, bands: [0.1, 0.4, 0.75]}
  dark:   {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  stalk:  {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  cap:    {ramp: bone,  bands: [0.2, 0.5, 0.8]}
  lobe:   {ramp: mid,   bands: [0.15, 0.45, 0.72]}
  gill:   {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  spot:   {ramp: mid,   bands: [0.1, 0.4, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [320, 48]
params:
  sy: 3.0           # the spine's line
templates:
  # a bridge tower: a tall block narrowing upward, the bridge a wide dark-windowed box on top
  tower:
    parts:
      - {name: neck, mat: hull, prism: {poly: [[-0.6, -0.35], [0.4, -0.3], [0.4, 0.3], [-0.6, 0.35]], z: [0, 1.0], top: [0.7, 0.8], round: 0.03}}
      - {name: bridge, mat: deck, box: {c: [0.0, 0, 1.15], half: [0.55, 0.42, 0.2], radius: 0.03}}
      - {name: glass, mat: dark, box: {c: [0.0, -0.44, 1.15], half: [0.42, 0.04, 0.06], radius: 0.01}}
parts:
  # the dorsal hull's south half: from the spine down to the side band, the dagger narrowing to the bow
  - name: dorsal
    mat: deck
    hull: {points: [[-9.6, "=sy", 1.75], [9.7, "=sy", 0.85], [-9.6, 0.45, 1.15], [3.0, 2.0, 0.85], [9.7, "=sy-0.05", 0.7],
                    [-9.6, "=sy", 0], [9.7, "=sy", 0], [-9.6, 0.3, 0], [3.0, 1.9, 0]], round: 0.05}
  # the side band along the south edge: a vertical face carrying the stripe
  - name: band
    mat: hull
    hull: {points: [[-9.6, 0.2, 0], [-9.6, 0.42, 1.2], [-9.6, 0.62, 1.2], [3.0, 1.75, 0], [3.0, 1.95, 0.88], [3.0, 2.12, 0.88],
                    [9.7, "=sy-0.1", 0], [9.7, "=sy-0.05", 0.72], [-9.6, 0.62, 0], [3.0, 2.12, 0]], round: 0.04}
  - name: stripe
    mat: stripe
    hull: {points: [[-9.4, 0.27, 0.6], [-9.4, 0.36, 0.95], [3.0, 1.83, 0.45], [3.0, 1.9, 0.72], [9.3, 2.86, 0.36], [9.3, 2.9, 0.58],
                    [-9.4, 0.5, 0.6], [-9.4, 0.5, 0.95], [3.0, 2.0, 0.45], [3.0, 2.0, 0.72]], round: 0.02}
  # the flight-deck trench along the spine at the bow, and the tower base at the stern
  - {name: trench, mat: dark, box: {c: [3.4, "=sy-0.12", 1.2], half: [5.2, 0.16, 0.3]}, rot: [-4, 0, 0]}
  - name: tower-base
    mat: hull
    prism: {poly: [[-8.6, "=sy-1.0"], [-5.2, "=sy-0.7"], [-5.2, "=sy"], [-8.6, "=sy"]], z: [1.3, 2.0], top: [0.85, 0.9], round: 0.04}
  - {use: tower, name: tower-s, at: [-7.5, "=sy-0.55", 1.95]}
  - {use: tower, name: tower-n, at: [-6.1, "=sy-0.15", 1.95]}
  # the engines at the stern, their bells to the west
  - {name: engine-1, mat: dark, cylinder: {a: [-9.95, 1.3, 0.9], b: [-9.4, 1.3, 0.9], r1: 0.55}}
  - {name: engine-2, mat: dark, cylinder: {a: [-9.95, 2.45, 1.2], b: [-9.4, 2.45, 1.2], r1: 0.6}}
  # damage: a burnt hole in the dorsal hull
  - {name: breach, mat: dark, hull: {points: [[-1.8, 1.6, 1.1], [-0.4, 1.9, 1.02], [-0.9, 2.6, 1.22], [-2.0, 2.4, 1.28], [-1.2, 2.1, 1.38]], round: 0.03}}
  # Felucian fungi growing up the flank and in the open ground by the bow
  - {use: fungus, name: fungus-1, at: [-6.9, 0.15, 0], with: {h: 1.9, r: 0.75, bulb: 0.36, neck: 0.12, lobes: 8}}
  - {use: fungus, name: fungus-2, at: [-5.9, 0.2, 0], with: {h: 1.05, r: 0.46, bulb: 0.24, neck: 0.08, lobes: 7}}
  - {use: fungus, name: fungus-3, at: [3.6, 0.9, 0], with: {h: 2.3, r: 0.85, bulb: 0.4, neck: 0.13, lobes: 8}}
  - {use: fungus, name: fungus-4, at: [5.2, 0.55, 0], with: {h: 1.4, r: 0.6, bulb: 0.3, neck: 0.1, lobes: 7}}
  - {use: fungus, name: fungus-5, at: [6.4, 1.35, 0], with: {h: 1.9, r: 0.7, bulb: 0.34, neck: 0.11, lobes: 8}}
  - {use: fungus, name: fungus-6, at: [7.8, 0.6, 0], with: {h: 0.9, r: 0.42, bulb: 0.22, neck: 0.07, lobes: 6}}
  - {use: fungus, name: fungus-7, at: [8.9, 1.5, 0], with: {h: 1.3, r: 0.52, bulb: 0.26, neck: 0.09, lobes: 7}}
  - {use: fungus, name: fungus-8, at: [1.6, 0.5, 0], with: {h: 0.85, r: 0.4, bulb: 0.2, neck: 0.07, lobes: 6}}
variants:
  # in one piece, sunk to its side band
  sunk:
    sink: 0.0
  # without the fungi, for maps where the ground is bare
  bare:
    drop: ["fungus-*"]
