# Fallen gnarltree (art:dagobah:fallen-gnarltree), hit box 7x2, drawn 7x3.
# Reference: the gnarltrees of the Dagobah bog (The Empire Strikes Back;
# wiki/art/concept/dagobah/gnarltree__db_dagobah.jpg). A gnarltree fallen across a channel and broken
# in the middle: both halves sag into the water at the break, splintered; the west end still has its
# arching roots gripping the bank, the east end its dead limbs.
# Axes: x east (along the trunk), y north, z up, origin on the ground at the middle of the hit box.
name: dagobah_fallen-gnarltree
art: art:dagobah:fallen-gnarltree
palette: greybox
kits: [kits/endor-dagobah.yaml]
cells: [7, 3]
foot: [59, 32]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  bark:  {ramp: mid,   bands: [0.05, 0.42, 0.74]}
  root:  {ramp: mid,   bands: [0.15, 0.5, 0.8]}
  back:  {ramp: dark,  bands: [0.1, 0.45, 0.8]}
  wood:  {ramp: bone,  bands: [0.2, 0.5, 0.85]}
  earth: {ramp: dark,  bands: [0.1, 0.4, 0.75]}
  water: {color: shade}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [112, 32]
params:
  rz: 0.75           # where the roots leave the trunk
parts:
  # the two halves of the trunk, each bent, sagging down into the water at the break
  - {name: west-1, mat: bark, cone: {a: [-2.55, 0.15, "=rz"], b: [-1.3, -0.05, 0.62], r1: 0.5, r2: 0.44}}
  - {name: west-2, mat: bark, cone: {a: [-1.3, -0.05, 0.62], b: [-0.35, 0.1, 0.12], r1: 0.44, r2: 0.38}}
  - {name: east-1, mat: bark, cone: {a: [0.35, -0.1, 0.1], b: [1.4, -0.3, 0.55], r1: 0.38, r2: 0.34}}
  - {name: east-2, mat: bark, cone: {a: [1.4, -0.3, 0.55], b: [2.6, -0.1, 0.6], r1: 0.34, r2: 0.28}}
  - {name: knot-1, mat: back, ellipsoid: {c: [-1.7, -0.38, 0.7], r: [0.15, 0.06, 0.1]}}
  - {name: knot-2, mat: back, ellipsoid: {c: [1.6, -0.62, 0.55], r: [0.13, 0.05, 0.09]}}
  # splinters at the break, sticking up out of the water
  - {name: split-w1, mat: wood, cone: {a: [-0.45, 0.15, 0.3], b: [-0.12, 0.2, 0.62], r1: 0.15, r2: 0.02}}
  - {name: split-w2, mat: wood, cone: {a: [-0.45, -0.15, 0.2], b: [-0.15, -0.2, 0.38], r1: 0.12, r2: 0.02}}
  - {name: split-e1, mat: wood, cone: {a: [0.45, -0.15, 0.3], b: [0.15, -0.2, 0.6], r1: 0.13, r2: 0.02}}
  - {name: split-e2, mat: wood, cone: {a: [0.45, 0.1, 0.2], b: [0.2, 0.15, 0.35], r1: 0.1, r2: 0.02}}
  # the root end still in the bank: the bole and its arching roots
  - {name: bole, mat: bark, ellipsoid: {c: [-2.6, 0.15, "=rz"], r: [0.4, 0.45, 0.42]}}
  - {use: arch-root, name: root-w,  at: [-2.8, 0.15, "=rz"], turn: 180, with: {reach: 0.95, r: 0.19, mat: root}}
  - {use: arch-root, name: root-sw, at: [-2.75, 0.0, "=rz"], turn: 235, with: {reach: 0.95, r: 0.18, mat: root}}
  - {use: arch-root, name: root-s,  at: [-2.5, -0.1, "=rz"], turn: 280, with: {reach: 0.8, r: 0.17, mat: root}}
  - {use: arch-root, name: root-nw, at: [-2.75, 0.35, "=rz"], turn: 140, with: {reach: 0.85, r: 0.16, mat: root}}
  - {use: arch-root, name: root-n,  at: [-2.5, 0.4, "=rz"], turn: 90, with: {reach: 0.7, r: 0.15, mat: back}}
  # the dead limbs at the crown end
  - {name: limb-1, mat: bark, cone: {a: [2.5, -0.2, 0.6], b: [3.25, 0.25, 1.0], r1: 0.14, r2: 0.05}}
  - {name: limb-2, mat: bark, cone: {a: [2.5, -0.2, 0.5], b: [3.3, -0.55, 0.3], r1: 0.13, r2: 0.04}}
  - {name: limb-3, mat: back, cone: {a: [2.2, -0.1, 0.75], b: [2.6, 0.5, 1.15], r1: 0.1, r2: 0.03}}
ground:
  # the bank under the root end and the channel the trunk fell across
  - {name: bank, mat: earth, ellipsoid: {c: [-2.75, 0.1, 0], r: [0.7, 0.8, 0.22]}}
  - {name: channel, mat: water, cylinder: {a: [0.0, 0.0, 0], b: [0.0, 0.0, 0.01], r1: 1.0}, squash: [1.0, 0.92, 1]}
