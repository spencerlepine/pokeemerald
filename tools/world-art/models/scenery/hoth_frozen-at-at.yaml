# Frozen AT-AT (art:hoth:frozen-at-at), hit box 9x4, drawn 9x7.
# Reference: the AT-AT (The Empire Strikes Back). Modelled standing, like the real walker: the box body
# with chamfered top and armour skirts, the ribbed neck, the wedge head with cheek guns, four jointed
# legs from the walker kit. Each variant then poses it: toppled on its side, sunk in the lake ice,
# legs lost, turned. Snow lies on the ground around it (`ground`), never posed.
# Walker axes: x forward (head), y to its left, z up, origin on the ground under its middle.
# 1 m = 1 cell = 16 px; `scale` shrinks the whole walker to fit the drawn size.
name: hoth_frozen-at-at
art: art:hoth:frozen-at-at
palette: greybox
kits: [kits/walkers.yaml]
cells: [9, 7]
foot: [64, 104]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  snow:  {ramp: bone,  bands: [0.05, 0.3, 0.7]}
  shade: {color: shade}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [140, 60]
templates:
  # the head, its back at the origin: the wedge with the visor and the cheek guns
  atat-head:
    parts:
      - name: shell
        mat: hull
        hull: {points: [[0, -0.55, 0], [0, 0.55, 0], [0, -0.55, 1.05], [0, 0.55, 1.05],
                        [0.95, -0.48, 0.05], [0.95, 0.48, 0.05], [0.8, -0.45, 0.85], [0.8, 0.45, 0.85],
                        [1.4, -0.3, 0.2], [1.4, 0.3, 0.2], [1.3, -0.3, 0.6], [1.3, 0.3, 0.6]], round: 0.04}
      - {name: visor, mat: dark, box: {c: [1.1, 0, 0.7], half: [0.2, 0.32, 0.05], radius: 0.01}, rot: [20, 0, 0]}
      - {name: gun-l, mat: dark, cylinder: {a: [0.75, 0.55, 0.2], b: [1.7, 0.55, 0.2], r1: 0.08}}
      - {name: gun-r, mat: dark, cylinder: {a: [0.75, -0.55, 0.2], b: [1.7, -0.55, 0.2], r1: 0.08}}
params:
  hip_z: 4.25        # hip height: the body's underside
  hx: 1.55           # hips fore and aft of the middle
  hy: 1.05           # hips out from the centre line
  # leg poses (deg): front legs, back legs
  fhip: -8
  fknee: 12
  bhip: 8
  bknee: -4
parts:
  - name: body
    mat: hull
    hull: {points: [[-2.2, -0.95, 4.0], [2.2, -0.95, 4.0], [-2.2, 0.95, 4.0], [2.2, 0.95, 4.0],
                    [-2.3, -0.95, 4.9], [2.3, -0.95, 4.9], [-2.3, 0.95, 4.9], [2.3, 0.95, 4.9],
                    [-1.95, -0.65, 5.6], [1.9, -0.65, 5.6], [-1.95, 0.65, 5.6], [1.9, 0.65, 5.6]], round: 0.05}
  - {name: skirt-l, mat: plate, box: {c: [0, 0.98, 4.6], half: [1.95, 0.04, 0.42], radius: 0.02}}
  - {name: skirt-r, mat: plate, box: {c: [0, -0.98, 4.6], half: [1.95, 0.04, 0.42], radius: 0.02}}
  - {name: roof-plate, mat: plate, box: {c: [-0.05, 0, 5.6], half: [1.6, 0.45, 0.04], radius: 0.02}}
  - {name: neck, mat: dark, cylinder: {a: [2.1, 0, 4.85], b: [2.85, 0, 4.8], r1: 0.36}}
  - {use: atat-head, name: head, at: [2.75, 0, 4.25]}
  - {use: walker-leg, name: leg-fl, at: ["=hx", "=hy", "=hip_z"], with: {hip: "=fhip", knee: "=fknee"}}
  - {use: walker-leg, name: leg-fr, at: ["=hx", "=-hy", "=hip_z"], with: {hip: "=fhip", knee: "=fknee"}}
  - {use: walker-leg, name: leg-bl, at: ["=-hx", "=hy", "=hip_z"], with: {hip: "=bhip", knee: "=bknee"}}
  - {use: walker-leg, name: leg-br, at: ["=-hx", "=-hy", "=hip_z"], with: {hip: "=bhip", knee: "=bknee"}}
variants:
  # on its side, belly to the north: the body lies in the hit box, the upper pair of legs sticks up
  # into the air behind it (the walk-behind rows), the lower pair is buried in the ice
  toppled: &toppled
    scale: 0.85
    tilt: [4, -90]
    turn: -12
    pivot: [0, 0]
    sink: 0.4
    foot: [60, 22]
    params: {fhip: 30, fknee: -50, bhip: -20, bknee: 40}
    ground:
      - {name: ice-1, mat: snow, hull: {points: [[-3.6, -5.00, 0], [-2.7, -5.10, 0], [-2.9, -4.55, 0], [-3.5, -4.60, 0], [-3.2, -4.80, 0.2]], round: 0.03}}
      - {name: ice-2, mat: snow, hull: {points: [[0.4, -5.15, 0], [1.3, -5.20, 0], [1.2, -4.75, 0], [0.5, -4.80, 0], [0.8, -4.95, 0.16]], round: 0.03}}
  # the same, one raised leg torn off: it lies on the ice by the head
  toppled-three-legs:
    <<: *toppled
    drop: ["leg-fl/*"]
    ground:
      - {name: ice-1, mat: snow, hull: {points: [[-3.6, -5.00, 0], [-2.7, -5.10, 0], [-2.9, -4.55, 0], [-3.5, -4.60, 0], [-3.2, -4.80, 0.2]], round: 0.03}}
      - {name: lost-shin, mat: plate, box: {c: [2.9, -3.1, 0.16], half: [0.8, 0.17, 0.16], radius: 0.03}, rot: [0, 25, 0]}
      - {name: lost-knee, mat: dark, cylinder: {a: [2.2, -3.55, 0], b: [2.2, -3.55, 0.36], r1: 0.28}}
      - {name: lost-foot, mat: dark, cylinder: {a: [3.65, -2.75, 0], b: [3.65, -2.75, 0.34], r1: 0.42}}
  # the head shot off: it lies in the snow south-east of the neck stump
  toppled-headless:
    <<: *toppled
    drop: ["head/*"]
    ground:
      - {name: ice-1, mat: snow, hull: {points: [[-3.6, -5.00, 0], [-2.7, -5.10, 0], [-2.9, -4.55, 0], [-3.5, -4.60, 0], [-3.2, -4.80, 0.2]], round: 0.03}}
      - {use: atat-head, name: lost-head, at: [2.6, -4.9, 0.0], turn: 20}
  # frozen where it stood, sunk to the shins in the lake ice; its shadow on the ice shows its height
  standing:
    scale: 0.8
    sink: 0.9
    foot: [56, 89]
    ground:
      - {name: shadow, mat: shade, cylinder: {a: [0.35, 0.3, 0], b: [0.35, 0.3, 0.01], r1: 1.5}, squash: [1.4, 0.6, 1]}
      - {name: ice-fl, mat: snow, ellipsoid: {c: [1.3, -0.85, 0], r: [0.6, 0.32, 0.16]}}
      - {name: ice-bl, mat: snow, ellipsoid: {c: [-1.15, -0.85, 0], r: [0.6, 0.32, 0.16]}}
  # broken through the lake ice: only the roof, the top of the head and the hip joints show, tipped
  # to one side, with ice plates pushed up around it
  sunk:
    scale: 1.0
    tilt: [-5, 14]
    pivot: [0, 0]
    sink: 4.55
    foot: [64, 82]
    ground:
      - {name: plate-1, mat: snow, hull: {points: [[-3.2, -1.35, 0], [-1.6, -1.45, 0], [-1.8, -0.85, 0], [-3.0, -0.90, 0], [-2.6, -1.15, 0.22]], round: 0.03}}
      - {name: plate-2, mat: snow, hull: {points: [[-0.6, -1.50, 0], [0.9, -1.40, 0], [0.7, -0.90, 0], [-0.5, -0.95, 0], [0.1, -1.20, 0.18]], round: 0.03}}
      - {name: plate-3, mat: snow, hull: {points: [[1.5, -1.25, 0], [2.8, -1.05, 0], [2.6, -0.95, 0], [1.6, -0.80, 0], [2.1, -0.95, 0.2]], round: 0.03}}
      - {name: plate-4, mat: snow, hull: {points: [[-3.4, 0.6, 0], [-2.6, 0.4, 0], [-2.5, 1.0, 0], [-3.3, 1.1, 0], [-2.9, 0.8, 0.25]], round: 0.03}}
      - {name: hole, mat: shade, cylinder: {a: [0.3, -0.1, 0], b: [0.3, -0.1, 0.01], r1: 1.0}, squash: [2.9, 1.15, 1]}
