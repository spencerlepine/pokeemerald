# Frozen AT-AT (art:hoth:frozen-at-at), hit box 9x4, drawn 9x7.
# Reference: the AT-AT (The Empire Strikes Back). It lies on its left side in the frozen lake, sunk to
# half its depth: the long boxy body runs east-west along the back of the hit box, its belly faces south,
# and the four legs stick out south across the ice toward the camera (legs pointing north would hide
# behind the body), the front knee bent up into the air. The head sits on its neck at the east end.
# Small drifts of snow bank against the north side and the feet.
# Axes: x east, y north from the hit box's south edge, z up; 1 m = 1 cell = 16 px.
name: hoth_frozen-at-at
art: art:hoth:frozen-at-at
palette: greybox
cells: [9, 7]
foot: [72, 112]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.1, 0.45, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  snow:  {ramp: bone,  bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [140, 60]
sink: 0.0
parts:
  # the body on its side: its flank (now facing up) is the big face seen in plan, the roof is the
  # tall face to the north, the belly the low face to the south
  - name: body
    mat: hull
    hull: {points: [[-3.3, 1.7, 0], [2.0, 1.7, 0], [-3.3, 3.85, 0], [2.0, 3.85, 0],
                    [-3.2, 1.9, 1.3], [1.9, 1.9, 1.3], [-3.2, 3.5, 1.55], [1.9, 3.5, 1.55],
                    [-3.45, 2.6, 0.9], [2.15, 2.6, 0.9]], round: 0.06}
  # armour plates on the flank
  - {name: plate-1, mat: plate, box: {c: [-2.2, 2.7, 1.5], half: [0.75, 0.65, 0.05], radius: 0.03}}
  - {name: plate-2, mat: plate, box: {c: [-0.35, 2.7, 1.5], half: [0.75, 0.65, 0.05], radius: 0.03}}
  - {name: plate-3, mat: plate, box: {c: [1.25, 2.7, 1.5], half: [0.55, 0.65, 0.05], radius: 0.03}}
  # the neck and the head at the east end, chin down on the ice
  - {name: neck, mat: dark, cylinder: {a: [1.9, 2.8, 0.75], b: [2.9, 2.7, 0.6], r1: 0.3}}
  - name: head
    mat: hull
    hull: {points: [[2.75, 2.2, 0], [3.85, 2.4, 0], [2.75, 3.4, 0], [3.85, 3.2, 0],
                    [2.8, 2.3, 1.05], [3.6, 2.45, 0.9], [2.8, 3.3, 1.05], [3.6, 3.15, 0.9],
                    [4.3, 2.6, 0.35], [4.3, 3.0, 0.35]], round: 0.05}
  - {name: cheek-gun, mat: dark, cylinder: {a: [3.9, 2.4, 0.3], b: [4.45, 2.05, 0.25], r1: 0.07}}
  - {name: chin-gun, mat: dark, cylinder: {a: [3.95, 2.6, 0.15], b: [4.45, 2.3, 0.12], r1: 0.06}}
  - {name: viewport, mat: dark, box: {c: [4.05, 2.8, 0.62], half: [0.12, 0.28, 0.06]}}
  # the legs: three flat on the ice pointing south, the front one bent up at the knee
  - {name: hip-1, mat: dark, ellipsoid: {c: [-2.8, 1.8, 0.55], r: [0.32, 0.25, 0.32]}}
  - {name: leg-1, mat: plate, cylinder: {a: [-2.8, 1.8, 0.45], b: [-2.95, 0.45, 0.25], r1: 0.19}}
  - {name: foot-1, mat: dark, cylinder: {a: [-2.95, 0.35, 0.0], b: [-2.95, 0.35, 0.32], r1: 0.3}}
  - {name: hip-2, mat: dark, ellipsoid: {c: [-1.6, 1.8, 0.55], r: [0.32, 0.25, 0.32]}}
  - {name: leg-2, mat: plate, cylinder: {a: [-1.6, 1.8, 0.45], b: [-1.35, 0.5, 0.25], r1: 0.19}}
  - {name: foot-2, mat: dark, cylinder: {a: [-1.35, 0.4, 0.0], b: [-1.35, 0.4, 0.32], r1: 0.3}}
  - {name: hip-3, mat: dark, ellipsoid: {c: [0.35, 1.8, 0.55], r: [0.32, 0.25, 0.32]}}
  - {name: leg-3, mat: plate, cylinder: {a: [0.35, 1.8, 0.45], b: [0.2, 0.45, 0.25], r1: 0.19}}
  - {name: foot-3, mat: dark, cylinder: {a: [0.2, 0.35, 0.0], b: [0.2, 0.35, 0.32], r1: 0.3}}
  - {name: hip-4, mat: dark, ellipsoid: {c: [1.55, 1.8, 0.55], r: [0.32, 0.25, 0.32]}}
  - {name: thigh-4, mat: plate, cylinder: {a: [1.55, 1.8, 0.5], b: [1.75, 1.05, 1.5], r1: 0.2}}
  - {name: knee-4, mat: dark, ellipsoid: {c: [1.75, 1.05, 1.5], r: [0.24, 0.24, 0.24]}}
  - {name: shin-4, mat: plate, cylinder: {a: [1.75, 1.05, 1.5], b: [2.3, 0.45, 0.7], r1: 0.17}}
  - {name: foot-4, mat: dark, cylinder: {a: [2.35, 0.4, 0.45], b: [2.4, 0.3, 0.75], r1: 0.3}}
  # snow drifts: small, low mounds against the north side and around two feet
  - {name: drift-1, mat: snow, ellipsoid: {c: [-1.8, 3.9, 0.0], r: [1.2, 0.3, 0.45]}}
  - {name: drift-2, mat: snow, ellipsoid: {c: [1.0, 3.9, 0.0], r: [1.0, 0.3, 0.4]}}
  - {name: drift-3, mat: snow, ellipsoid: {c: [-3.05, 0.3, 0.0], r: [0.5, 0.3, 0.16]}}
  - {name: drift-4, mat: snow, ellipsoid: {c: [0.05, 0.25, 0.0], r: [0.55, 0.28, 0.14]}}
