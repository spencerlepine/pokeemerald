# B'omarr ruin (art:tatooine:bomarr-ruin), hit box 4x4, drawn 4x7: the top 3 rows stand over the cells
# behind. Reference: Jabba's palace, built on the B'omarr monastery (Return of the Jedi, The Book of Boba
# Fett): a fat round tower of smooth adobe with a low dome and dark slit windows, a squarer block beside
# it. This tower has caved in: its dome is gone but for a stub, the wall's top is broken and slanting,
# its hollow dark inside, a doorway at the foot and rubble heaped round it.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_bomarr-ruin
art: art:tatooine:bomarr-ruin
palette: greybox
cells: [4, 7]
foot: [32, 111]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  wall:   {ramp: light, bands: [0.3, 0.6, 0.9]}
  stone:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:   {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  rubble: {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  sand:   {ramp: bone,  bands: [0.55, 0.8, 0.97]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [62, 62]
groups: {body: {}, tower: {}}
params:
  ty: 2.05        # the tower's centre (m north)
  tr: 1.15        # its radius
  th: 3.15         # the wall's height where it still stands whole
parts:
  # the tower: a fat round wall, slightly tapered, a plinth ring at its foot
  - {name: plinth, mat: stone, group: tower, cylinder: {a: [-0.2, "=ty", 0], b: [-0.2, "=ty", 0.45], r1: "=tr + 0.15", r2: "=tr + 0.1"}}
  - {name: wall, mat: wall, group: tower, cylinder: {a: [-0.2, "=ty", 0.4], b: [-0.2, "=ty", "=th"], r1: "=tr", r2: "=tr - 0.12"}}
  - {name: dome-stub, mat: wall, group: tower, ellipsoid: {c: [-0.2, "=ty", "=th"], r: ["=tr - 0.12", "=tr - 0.12", 0.75]}}
  # caved in: a hollow inside and a slanting broken top (cut lower on the east), the dome mostly gone
  - {name: hollow, mat: dark, group: tower, op: subtract, cylinder: {a: [-0.2, "=ty", 1.0], b: [-0.2, "=ty", 6.0], r1: "=tr - 0.3"}}
  - {name: collapse, mat: wall, group: tower, op: subtract, hull: {points: [[-1.8, 0.0, 3.45], [1.8, 0.0, 2.6], [1.8, 4.0, 2.75], [-1.8, 4.0, 3.6], [-1.8, 0.0, 7], [1.8, 0.0, 7], [1.8, 4.0, 7], [-1.8, 4.0, 7]]}}
  - {name: notch, mat: wall, group: tower, op: subtract, hull: {points: [[-0.45, 0.0, 3.1], [0.15, 0.0, 2.55], [0.35, 2.0, 2.55], [-0.35, 2.0, 3.1], [-0.2, 0.0, 5], [1.0, 0.0, 5], [1.0, 2.0, 5], [-0.2, 2.0, 5]]}}
  - {name: notch-2, mat: wall, group: tower, op: subtract, hull: {points: [[-1.5, 0.0, 3.2], [-0.95, 0.0, 2.85], [-0.85, 2.0, 2.85], [-1.4, 2.0, 3.2], [-1.6, 0.0, 5], [-0.8, 0.0, 5], [-0.8, 2.0, 5], [-1.6, 2.0, 5]]}}
  # the dark inside: a plug in the hollow, below the lowest point of the broken rim
  - {name: inside, mat: dark, cylinder: {a: [-0.2, "=ty", 0.9], b: [-0.2, "=ty", 2.3], r1: "=tr - 0.29"}}
  # dark slit windows and the arched doorway on the south face
  - {name: slit-1, mat: dark, box: {c: [-0.75, "=ty - tr + 0.08", 2.2], half: [0.07, 0.12, 0.3], radius: 0.02}}
  - {name: slit-2, mat: dark, box: {c: [0.2, "=ty - tr + 0.05", 1.9], half: [0.07, 0.12, 0.3], radius: 0.02}}
  - {name: door, mat: dark, box: {c: [-0.35, "=ty - tr - 0.1", 0.7], half: [0.3, 0.2, 0.55], radius: 0.05}}
  - {name: door-top, mat: dark, cylinder: {a: [-0.35, "=ty - tr - 0.3", 1.25], b: [-0.35, "=ty - tr + 0.1", 1.25], r1: 0.3}}
  # the squarer block on the east, its roof broken too
  - {name: annex, mat: wall, prism: {poly: [[0.8, 0.9], [1.88, 0.95], [1.88, 2.9], [0.85, 2.9]], z: [0, 1.7], top: [0.92, 0.95], lean: [-0.03, 0], round: 0.06}}
  - {name: annex-door, mat: dark, box: {c: [1.4, 0.88, 0.5], half: [0.22, 0.06, 0.4], radius: 0.03}}
  - {name: annex-slit, mat: dark, box: {c: [1.5, 0.9, 1.25], half: [0.12, 0.06, 0.14]}}
ground:
  # rubble heaped round the foot, chunks of the fallen dome
  - {name: heap-e, mat: rubble, hull: {round: 0.06, points: [[0.6, 0.15, 0], [1.9, 0.1, 0], [1.9, 0.85, 0], [0.7, 0.9, 0], [1.0, 0.35, 0.45], [1.6, 0.4, 0.55], [1.4, 0.75, 0.6]]}}
  - {name: chunk-1, mat: wall, hull: {round: 0.05, points: [[-1.85, 0.1, 0], [-1.2, 0.05, 0], [-1.15, 0.55, 0], [-1.8, 0.6, 0], [-1.6, 0.2, 0.42], [-1.3, 0.25, 0.35], [-1.5, 0.5, 0.45]]}}
  - {name: chunk-2, mat: rubble, hull: {round: 0.04, points: [[-0.6, 0.0, 0], [-0.1, 0.0, 0], [-0.15, 0.3, 0], [-0.55, 0.3, 0], [-0.35, 0.12, 0.25]]}}
variants:
  caved-in: {}
  # the dome still on, only the wall split (before the last collapse)
  dome-whole:
    drop: ["collapse", "notch", "hollow"]
