# Statue of Lando (art:grand-arena:lando-statue), hit box 3x3, drawn 3x6.
# Reference: Lando Calrissian in Cloud City (The Empire Strikes Back): the long cape over one
# shoulder, shirt and belt, boots. A gold statue he paid for himself: feet apart, one fist on his hip,
# the other arm raised in a wave, the cape sweeping out behind him, on a stepped plinth with a plaque.
# Axes: x east, y north, z up, origin on the ground at the plinth's centre.
name: grand-arena_lando-statue
art: art:grand-arena:lando-statue
palette: greybox
kits: [kits/deathstar-arena-jedha.yaml]
cells: [3, 6]
foot: [24, 81]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid,   bands: [0.4, 0.7, 0.95]}
  trim:  {ramp: mid,   bands: [0.1, 0.45, 0.8]}
  gold:  {ramp: light, bands: [0.12, 0.42, 0.78]}
  cape:  {ramp: mid,   bands: [0.15, 0.45, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [48, 48]
params:
  pz: 0.6        # the plinth's top
  hip: 2.15      # hip height
  sh: 3.45        # shoulder height
parts:
  - {use: plinth, name: plinth, at: [0, 0, 0], with: {w: 2.8, d: 1.5, h: "=pz"}}
  - {name: plaque, mat: dark, box: {c: [0, -0.76, 0.28], half: [0.42, 0.03, 0.12], radius: 0.01}}
  # boots and legs, feet apart
  - {name: leg-l, mat: gold, prism: {poly: [[-0.42, -0.12], [-0.12, -0.12], [-0.12, 0.14], [-0.42, 0.14]], z: ["=pz", "=hip"], top: [0.85, 1], lean: [0.08, 0], round: 0.05}}
  - {name: leg-r, mat: gold, prism: {poly: [[0.12, -0.12], [0.42, -0.12], [0.42, 0.14], [0.12, 0.14]], z: ["=pz", "=hip"], top: [0.85, 1], lean: [-0.08, 0], round: 0.05}}
  - {name: boot-l, mat: cape, box: {c: [-0.3, -0.06, "=pz + 0.25"], half: [0.17, 0.22, 0.25], radius: 0.05}}
  - {name: boot-r, mat: cape, box: {c: [0.3, -0.06, "=pz + 0.25"], half: [0.17, 0.22, 0.25], radius: 0.05}}
  # the torso: a wedge from the belt to the shoulders, the belt a dark band
  - {name: torso, mat: gold, prism: {poly: [[-0.36, -0.18], [0.36, -0.18], [0.36, 0.18], [-0.36, 0.18]], z: ["=hip - 0.1", "=sh"], top: [1.45, 1.1], round: 0.07}}
  - {name: belt, mat: dark, box: {c: [0, -0.02, "=hip + 0.08"], half: [0.39, 0.2, 0.07], radius: 0.03}}
  - {name: buckle, mat: gold, box: {c: [0, -0.22, "=hip + 0.08"], half: [0.08, 0.02, 0.06], radius: 0.01}}
  # the head with its hair, on a short neck
  - {name: neck, mat: gold, cylinder: {a: [0, 0, "=sh - 0.05"], b: [0, 0, "=sh + 0.2"], r1: 0.13}}
  - {name: head, mat: gold, ellipsoid: {c: [0, -0.02, "=sh + 0.42"], r: [0.24, 0.24, 0.3]}}
  - {name: hair, mat: trim, ellipsoid: {c: [0, 0.05, "=sh + 0.55"], r: [0.27, 0.25, 0.22]}}
  - {name: mustache, mat: dark, box: {c: [0, -0.24, "=sh + 0.33"], half: [0.09, 0.02, 0.025], radius: 0.01}}
  # the right fist on the hip (elbow out east), the left arm raised in a wave
  - {name: uparm-r, mat: gold, cylinder: {a: [0.48, 0, "=sh - 0.1"], b: [0.8, -0.02, "=sh - 0.62"], r1: 0.13, r2: 0.11}}
  - {name: forearm-r, mat: gold, cylinder: {a: [0.8, -0.02, "=sh - 0.62"], b: [0.42, -0.08, "=hip + 0.22"], r1: 0.11, r2: 0.1}}
  - {name: uparm-l, mat: gold, cylinder: {a: [-0.48, 0, "=sh - 0.1"], b: [-0.85, -0.04, "=sh + 0.3"], r1: 0.13, r2: 0.11}}
  - {name: forearm-l, mat: gold, cylinder: {a: [-0.85, -0.04, "=sh + 0.3"], b: [-0.9, -0.05, "=sh + 0.85"], r1: 0.11, r2: 0.1}}
  - {name: hand-l, mat: gold, ellipsoid: {c: [-0.9, -0.05, "=sh + 0.98"], r: [0.12, 0.08, 0.14]}}
  # the cape: from the left shoulder down the back, sweeping out to the west behind the legs
  - {name: cape, mat: cape, hull: {points: [[-0.55, 0.12, "=sh + 0.05"], [0.45, 0.2, "=sh"], [-0.55, 0.3, "=sh - 0.1"], [0.35, 0.32, "=sh - 0.1"],
                                           [-1.25, 0.15, "=pz + 0.15"], [0.45, 0.4, "=pz + 0.5"], [-1.1, 0.55, "=pz + 0.1"], [0.3, 0.55, "=pz + 0.4"],
                                           [-1.3, -0.15, "=pz + 0.35"]], round: 0.06}}
  - {name: collar, mat: cape, ellipsoid: {c: [-0.1, 0.05, "=sh + 0.02"], r: [0.55, 0.26, 0.12]}}
