# Crashed frigate (art:yavin-4:crashed-frigate), hit box 12x4, drawn 12x7.
# Reference: the Pelta-class frigate (The Clone Wars). A long hull with a wedge prow, a wide engine block
# at the stern with three engines, the bridge tower on top at the back, a pair of side wings amidships.
# Built in two sections (templates `aft` and `fore`) so a variant can break its back with params.
# Modelled level, bow east (+x); posed nose-down in the jungle. Partly off the map on purpose.
# Axes: x east, y north, z up, origin on the ground under the hull's middle.
name: yavin-4_crashed-frigate
art: art:yavin-4:crashed-frigate
palette: greybox
cells: [12, 7]
foot: [94, 77]
scale: 0.92
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  deck:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  dirt:  {ramp: mid,   bands: [0.2, 0.5, 0.8]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [188, 60]
params:
  gap: 0           # how far the fore section has broken away (m, east)
  bend: 0          # and how far it has turned (deg)
  droop: 0         # and tipped nose-down (deg)
templates:
  # the stern: engine block, three engines, the bridge tower, the wing roots
  aft:
    parts:
      - name: block
        mat: hull
        hull: {points: [[-5.2, -1.55, 0.05], [-2.0, -1.55, 0.05], [-5.2, 1.55, 0.05], [-2.0, 1.55, 0.05],
                        [-5.2, -1.35, 1.75], [-2.0, -1.2, 1.55], [-5.2, 1.35, 1.75], [-2.0, 1.2, 1.55]], round: 0.05}
      - {name: deck-aft, mat: deck, box: {c: [-3.6, 0, 1.7], half: [1.5, 1.05, 0.05], radius: 0.02}}
      - name: tower
        mat: hull
        prism: {poly: [[-4.6, -0.55], [-2.9, -0.45], [-2.9, 0.45], [-4.6, 0.55]], z: [1.6, 2.55], top: [0.75, 0.8], lean: [0.2, 0], round: 0.04}
      - {name: bridge, mat: dark, box: {c: [-2.95, 0, 2.3], half: [0.08, 0.32, 0.1], radius: 0.01}}
      - {name: engine-1, mat: hull, cylinder: {a: [-5.65, -0.95, 0.85], b: [-5.1, -0.95, 0.85], r1: 0.45, r2: 0.5}}
      - {name: engine-2, mat: hull, cylinder: {a: [-5.65, 0, 0.95], b: [-5.1, 0, 0.95], r1: 0.5, r2: 0.55}}
      - {name: engine-3, mat: hull, cylinder: {a: [-5.65, 0.95, 0.85], b: [-5.1, 0.95, 0.85], r1: 0.45, r2: 0.5}}
      - {name: wing-s, mat: deck, prism: {poly: [[-2.5, -1.3], [0.5, -1.1], [-0.7, -2.35], [-2.3, -2.4]], z: [0.5, 0.64], round: 0.02}}
      - {name: wing-n, mat: deck, prism: {poly: [[-2.5, 1.3], [0.5, 1.1], [-0.7, 2.35], [-2.3, 2.4]], z: [0.5, 0.64], round: 0.02}}
  # the bow: the long hull tapering to the wedge prow
  fore:
    parts:
      - name: hull
        mat: hull
        hull: {points: [[-2.05, -1.2, 0.05], [-2.05, 1.2, 0.05], [-2.05, -1.1, 1.45], [-2.05, 1.1, 1.45],
                        [3.6, -0.75, 0.15], [3.6, 0.75, 0.15], [3.6, -0.6, 1.05], [3.6, 0.6, 1.05],
                        [5.3, -0.12, 0.3], [5.3, 0.12, 0.3], [5.2, -0.1, 0.6], [5.2, 0.1, 0.6]], round: 0.05}
      - name: deck-fore
        mat: deck
        prism: {poly: [[-1.9, -0.75], [3.4, -0.4], [4.6, -0.1], [4.6, 0.1], [3.4, 0.4], [-1.9, 0.75]], z: [1.2, 1.32], round: 0.02}
      - {name: spine, mat: dark, box: {c: [0.8, 0, 1.4], half: [2.4, 0.08, 0.06], radius: 0.01}}
parts:
  - {use: aft, name: aft}
  - {use: fore, name: fore, at: ["=gap", 0, 0], rot: ["=-droop", "=bend", 0]}
ground:
  # the furrow it ploughed: dirt heaped at the prow and along the south side
  - {name: heap-bow-s, mat: dirt, ellipsoid: {c: [5.15, -0.45, 0], r: [0.5, 0.3, 0.16]}}
  - {name: heap-bow-n, mat: dirt, ellipsoid: {c: [5.1, 0.55, 0], r: [0.45, 0.3, 0.14]}}
  - {name: heap-s1, mat: dirt, ellipsoid: {c: [1.6, -1.45, 0], r: [1.1, 0.25, 0.2]}}
  - {name: heap-s2, mat: dirt, ellipsoid: {c: [1.0, -1.85, 0], r: [0.6, 0.18, 0.16]}}
variants:
  # in one piece, the bow dug into the ground
  crashed:
    tilt: [-4, 3]
    pivot: [4.5, 0]
    sink: 0.25
  # broke its back on landing: the bow has slid on and turned
  broken:
    params: {gap: 0.6, bend: -9, droop: 3}
    tilt: [0, 3]
    sink: 0.2
  # stripped by the Rebels for parts: no wings or engines, the tower gone
  stripped:
    drop: ["aft/wing-*", "aft/engine-*", "aft/tower", "aft/bridge"]
    tilt: [-4, 3]
    pivot: [4.5, 0]
    sink: 0.25
