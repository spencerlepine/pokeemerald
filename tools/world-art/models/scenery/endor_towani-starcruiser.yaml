# Towani starcruiser wreck (art:endor:towani-starcruiser), hit box 8x4, drawn 8x6.
# Reference: the Towani family's star cruiser (Caravan of Courage: An Ewok Adventure, 1984;
# wiki/art/concept/endor/towani-starcruiser__web_1.jpg). Designed by Bill George on the wings of a
# full-size snowspeeder: a boxy faceted hull with chamfered edges and a flat roof with a hatch, an
# angled cockpit front with dark windows, a snowspeeder-style wedge wing on each side. Modelled level,
# nose east; posed crashed nose-down in the forest, the north wing torn off and lying against it,
# ferns and a fallen log overgrowing it. Axes: x east (forward), y north, z up, origin on the ground
# under the hull's middle.
name: endor_towani-starcruiser
art: art:endor:towani-starcruiser
palette: greybox
kits: [kits/endor-dagobah.yaml]
cells: [8, 6]
foot: [64, 62]
scale: 1.12
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  bark:  {ramp: mid,   bands: [0.05, 0.42, 0.74]}
  moss:  {ramp: mid,   bands: [0.1, 0.4, 0.75]}
  wood:  {ramp: bone,  bands: [0.2, 0.5, 0.85]}
  furrow: {ramp: dark, bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [128, 64]
templates:
  # a snowspeeder wedge wing: thick at the root, tapering out to a blunt tip; `side` +1 north, -1 south
  wedge-wing:
    params: {side: 1}
    parts:
      - name: wing
        mat: plate
        hull: {points: [[-1.5, "=side * 1.05", 0.2], [1.0, "=side * 1.05", 0.2], [-1.5, "=side * 1.05", 0.75], [0.6, "=side * 1.05", 0.7],
                        [-1.3, "=side * 2.1", 0.3], [-0.3, "=side * 2.1", 0.3], [-1.3, "=side * 2.1", 0.5], [-0.4, "=side * 2.1", 0.5]], round: 0.04}
      - {name: flap, mat: dark, box: {c: [-1.35, "=side * 1.6", 0.45], half: [0.08, 0.45, 0.06], radius: 0.01}}
parts:
  # the faceted hull: a long box, chamfered all round, the cockpit front angled down to the nose
  - name: body
    mat: hull
    hull: {points: [[-2.5, -0.85, 0], [1.6, -0.85, 0], [-2.5, 0.85, 0], [1.6, 0.85, 0],
                    [-2.7, -1.1, 0.5], [1.8, -1.1, 0.5], [-2.7, 1.1, 0.5], [1.8, 1.1, 0.5],
                    [-2.5, -0.75, 1.45], [0.9, -0.75, 1.5], [-2.5, 0.75, 1.45], [0.9, 0.75, 1.5],
                    [2.5, -0.55, 0.5], [2.5, 0.55, 0.5], [2.3, -0.45, 0.2], [2.3, 0.45, 0.2]], round: 0.05}
  - {name: roof, mat: plate, box: {c: [-0.8, 0, 1.5], half: [1.5, 0.6, 0.04], radius: 0.02}}
  - {name: hatch, mat: dark, cylinder: {a: [-0.9, 0, 1.52], b: [-0.9, 0, 1.6], r1: 0.32}}
  - {name: window-1, mat: dark, box: {c: [1.55, -0.3, 1.05], half: [0.3, 0.22, 0.05], radius: 0.01}, rot: [-50, 0, 0]}
  - {name: window-2, mat: dark, box: {c: [1.55, 0.3, 1.05], half: [0.3, 0.22, 0.05], radius: 0.01}, rot: [-50, 0, 0]}
  - {name: stripe, mat: plate, box: {c: [-0.4, -1.08, 0.5], half: [2.1, 0.03, 0.12], radius: 0.01}}
  - {name: vent, mat: dark, box: {c: [-2.72, 0, 0.7], half: [0.04, 0.6, 0.3], radius: 0.01}}
  - {use: wedge-wing, name: wing-s, with: {side: -1}}
  - {use: wedge-wing, name: wing-n, with: {side: 1}}
ground:
  # the torn-off wing leaning against the hull's north-east, a fallen log over the stern, ferns
  - {use: wedge-wing, name: lost-wing, at: [2.6, -1.45, -0.15], turn: 30, with: {side: 1}}
  - {use: log, name: log, at: [-3.1, 0.2, 0.0], turn: 75, with: {len: 2.6, r: 0.26, moss: moss}}
  - {name: fern-1, mat: moss, ellipsoid: {c: [-2.9, -1.2, 0], r: [0.4, 0.2, 0.2]}}
  - {name: fern-2, mat: moss, ellipsoid: {c: [1.2, -1.35, 0], r: [0.45, 0.18, 0.18]}}
  - {name: fern-3, mat: moss, ellipsoid: {c: [2.9, -0.6, 0], r: [0.3, 0.25, 0.2]}}
variants:
  # crashed nose-down, the north wing torn off
  crashed:
    tilt: [-7, 4]
    pivot: [2.0, 0]
    sink: 0.25
    turn: 8
    drop: ["wing-n/*"]
    foot: [64, 58]
  # landed hard but whole, both wings on
  landed:
    sink: 0.1
    turn: -6
    foot: [62, 62]
    ground:
      - {name: fern-1, mat: moss, ellipsoid: {c: [-2.9, -1.2, 0], r: [0.4, 0.2, 0.2]}}
      - {name: fern-2, mat: moss, ellipsoid: {c: [1.2, -1.35, 0], r: [0.45, 0.18, 0.18]}}
