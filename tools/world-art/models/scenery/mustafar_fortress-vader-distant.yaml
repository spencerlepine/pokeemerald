# Fortress Vader, distant (art:mustafar:fortress-vader-distant), hit box 6x3, drawn 6x9.
# Vader's castle (Rogue One) seen beyond the rim of Ashen Pass: the ribbed podium and the lava fall
# behind a ridge of black rock, the tower running off the top of the map (cut off on purpose). The
# castle is the kit's `vader-castle`, the same one as art:mustafar:fortress-vader.
# Axes: x east, y north, z up, origin on the ground at the hit box's south edge, middle.
name: mustafar_fortress-vader-distant
art: art:mustafar:fortress-vader-distant
palette: greybox
kits: [kits/sullust-mustafar.yaml]
cells: [6, 9]
foot: [48, 144]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  mid:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  rock:  {ramp: dark,  bands: [0.15, 0.45, 0.78]}
  lava:  {ramp: light, bands: [0.1, 0.35, 0.65]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [92, 44]
parts:
  # the castle, set back behind the rim
  - {use: vader-castle, name: castle, at: [0, 1.1, 0], with: {prong_w: 10.2, prong_e: 9.5}}
  # the black rock ridge of the pass in front, hiding the castle's foot, with a notch at the lava fall
  - name: ridge-w
    mat: rock
    hull: {points: [[-2.9, 0.1, 0], [-1.2, 0.12, 0], [-1.1, 0.95, 0], [-2.9, 1.0, 0], [-2.8, 0.45, 1.05], [-2.0, 0.5, 1.35], [-1.3, 0.55, 0.9]], round: 0.03}
  - name: ridge-mw
    mat: rock
    hull: {points: [[-1.5, 0.12, 0], [0.4, 0.1, 0], [0.5, 0.9, 0], [-1.5, 0.95, 0], [-1.3, 0.5, 0.95], [-0.5, 0.55, 1.2], [0.3, 0.5, 0.8]], round: 0.03}
  - name: ridge-me
    mat: rock
    hull: {points: [[0.2, 0.15, 0], [1.15, 0.12, 0], [1.2, 0.9, 0], [0.2, 0.9, 0], [0.5, 0.5, 0.9], [1.05, 0.5, 0.55]], round: 0.03}
  - name: ridge-e
    mat: rock
    hull: {points: [[1.7, 0.12, 0], [2.9, 0.15, 0], [2.9, 1.0, 0], [1.65, 0.95, 0], [2.6, 0.5, 1.25], [1.85, 0.5, 0.7], [2.2, 0.6, 1.1]], round: 0.03}
ground:
  # the lava fall's pool, glowing in the gap of the ridge
  - {name: pool, mat: lava, hull: {points: [[1.05, 0.15, 0], [1.8, 0.15, 0], [1.8, 1.1, 0], [1.1, 1.1, 0], [1.42, 0.6, 0.1]], round: 0.03}}
