# AT-TE wreck (art:shared:at-te-wreck), hit box 8x4, drawn 8x6.
# Reference: the AT-TE (Attack of the Clones, The Clone Wars; wiki/art/concept/shared/at-te-wreck__web_1.jpg).
# A long low armoured body in two modules (the front one with the sloped cockpit face and its two
# ball guns, the rear one squarer), the mass-driver cannon turret on top, and six short legs with big
# round knee joints and pad feet. Down on its belly: the legs buckled outward, knees up, feet flat on
# the ground either side; moss and creepers have grown over it.
# Walker axes: x forward (east), y to its left (north), z up; origin on the ground under the middle.
# 1 m = 1 cell = 16 px.
name: shared_at-te-wreck
art: art:shared:at-te-wreck
palette: greybox
cells: [8, 6]
foot: [63, 57]
scale: 1.03
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.15, 0.5, 0.82]}
  leg:   {ramp: mid,   bands: [0.1, 0.45, 0.8]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  glass: {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  moss:  {ramp: mid,   bands: [0.45, 0.75, 0.97]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [124, 60]
turn: -4
sink: 0.15
params:
  hy: 0.88         # hips out from the centre line
  hz: 0.55         # hip height
  hip: 112         # thigh angle from straight down (deg): out and up
  knee: -84        # knee bend back down
  cannon: 14       # cannon elevation (deg)
templates:
  # one AT-TE leg, bending out to the side `out` (deg, the plane it bends in)
  leg:
    params: {out: -90}
    parts:
      - name: l
        mat: leg
        limb:
          root: [0, 0, 0]
          yaw: "=out"
          segments:
            - {len: 0.82, w: 0.34, d: 0.3, bend: "=hip", joint: {r: 0.24, len: 0.42, mat: dark}}
            - {len: 0.95, w: 0.3, d: 0.28, bend: "=knee", taper: 0.85, joint: {r: 0.34, len: 0.5, mat: plate}}
          foot: {r: 0.3, r2: 0.26, h: 0.2, mat: dark, flat: true}
parts:
  # the rear module: a long squarish box with chamfered top edges
  - name: rear
    mat: hull
    hull: {points: [[-3.35, -0.85, 0.15], [-0.1, -0.85, 0.15], [-3.35, 0.85, 0.15], [-0.1, 0.85, 0.15],
                    [-3.45, -1.0, 0.95], [-0.1, -1.0, 0.95], [-3.45, 1.0, 0.95], [-0.1, 1.0, 0.95],
                    [-3.3, -0.75, 1.45], [-0.15, -0.75, 1.45], [-3.3, 0.75, 1.45], [-0.15, 0.75, 1.45]], round: 0.05}
  - {name: rear-plate, mat: plate, box: {c: [-1.75, -1.0, 0.75], half: [1.45, 0.04, 0.2], radius: 0.02}}
  - {name: rear-roof, mat: plate, box: {c: [-1.75, 0, 1.46], half: [1.3, 0.5, 0.04], radius: 0.02}}
  # the front module: the sloped cockpit face at the nose
  - name: front
    mat: hull
    hull: {points: [[0.0, -0.85, 0.15], [2.75, -0.8, 0.15], [0.0, 0.85, 0.15], [2.75, 0.8, 0.15],
                    [0.0, -1.0, 0.95], [2.6, -0.95, 0.95], [0.0, 1.0, 0.95], [2.6, 0.95, 0.95],
                    [0.05, -0.75, 1.5], [1.9, -0.7, 1.5], [0.05, 0.75, 1.5], [1.9, 0.7, 1.5],
                    [3.35, -0.5, 0.45], [3.35, 0.5, 0.45]], round: 0.05}
  - {name: front-plate, mat: plate, box: {c: [1.2, -0.98, 0.75], half: [1.15, 0.04, 0.2], radius: 0.02}}
  - name: windows
    mat: glass
    hull: {points: [[2.1, -0.55, 1.33], [2.1, 0.55, 1.33], [2.85, -0.45, 0.85], [2.85, 0.45, 0.85],
                    [2.13, -0.55, 1.4], [2.13, 0.55, 1.4], [2.9, -0.45, 0.9], [2.9, 0.45, 0.9]], round: 0.02}
  - {name: ballgun-s, mat: plate, ellipsoid: {c: [2.95, -0.62, 0.6], r: [0.22, 0.2, 0.2]}}
  - {name: ballgun-n, mat: plate, ellipsoid: {c: [2.95, 0.62, 0.6], r: [0.22, 0.2, 0.2]}}
  - {name: gun-s, mat: dark, cylinder: {a: [3.1, -0.62, 0.6], b: [3.45, -0.62, 0.58], r1: 0.04}}
  - {name: gun-n, mat: dark, cylinder: {a: [3.1, 0.62, 0.6], b: [3.45, 0.62, 0.58], r1: 0.04}}
  # the joint between the modules
  - {name: joint, mat: dark, box: {c: [-0.05, 0, 0.9], half: [0.08, 0.95, 0.55], radius: 0.02}}
  # the cannon turret on the front module's roof
  - {name: turret, mat: plate, prism: {poly: [[0.1, -0.45], [1.05, -0.4], [1.25, 0], [1.05, 0.4], [0.1, 0.45]], z: [1.45, 1.85], top: 0.8, round: 0.04}}
  - {name: cannon, mat: dark, cylinder: {a: [0.9, 0, 1.68], b: ["=0.9 + 2.3 * cos(radians(cannon))", 0, "=1.68 + 2.3 * sin(radians(cannon))"], r1: 0.12}}
  - {name: sleeve, mat: hull, cylinder: {a: [0.85, 0, 1.68], b: ["=0.85 + 0.6 * cos(radians(cannon))", 0, "=1.68 + 0.6 * sin(radians(cannon))"], r1: 0.19}}
  # six legs, buckled out to the sides
  - {use: leg, name: leg-fs, at: [2.0, "=-hy", "=hz"], with: {out: -55}}
  - {use: leg, name: leg-ms, at: [-0.05, "=-hy", "=hz"], with: {out: -100}}
  - {use: leg, name: leg-rs, at: [-2.3, "=-hy", "=hz"], with: {out: -125}}
  - {use: leg, name: leg-fn, at: [2.0, "=hy", "=hz"], with: {out: 55}}
  - {use: leg, name: leg-mn, at: [-0.05, "=hy", "=hz"], with: {out: 90}}
  - {use: leg, name: leg-rn, at: [-2.3, "=hy", "=hz"], with: {out: 125}}
  # moss and creepers grown over the roof and down the flank
  - {name: moss-1, mat: moss, hull: {points: [[-3.1, -0.3, 1.4], [-1.9, -0.5, 1.4], [-1.6, 0.4, 1.4], [-2.8, 0.6, 1.4], [-2.5, 0.0, 1.62], [-2.1, 0.1, 1.58]], round: 0.04}}
  - {name: moss-2, mat: moss, hull: {points: [[-1.3, -0.6, 1.42], [-0.6, -0.65, 1.42], [-0.7, -0.1, 1.42], [-1.2, 0.0, 1.42], [-0.95, -0.35, 1.58]], round: 0.04}}
  - {name: moss-3, mat: moss, hull: {points: [[1.2, 0.1, 1.45], [1.8, 0.05, 1.45], [1.75, 0.6, 1.45], [1.25, 0.6, 1.45], [1.5, 0.35, 1.6]], round: 0.04}}
  - {name: vine-1, mat: moss, box: {c: [-2.6, -1.01, 0.85], half: [0.14, 0.05, 0.6], radius: 0.04}}
  - {name: vine-2, mat: moss, box: {c: [-0.9, -1.01, 0.7], half: [0.1, 0.05, 0.45], radius: 0.04}}
  - {name: vine-3, mat: moss, box: {c: [1.6, -0.99, 0.95], half: [0.1, 0.05, 0.45], radius: 0.04}}
ground:
  - {name: bush-1, mat: moss, hull: {points: [[-3.9, -0.9, 0], [-3.2, -1.0, 0], [-3.1, -0.3, 0], [-3.8, -0.2, 0], [-3.5, -0.6, 0.45], [-3.4, -0.4, 0.4]], round: 0.05}}
  - {name: bush-2, mat: moss, hull: {points: [[3.2, -1.5, 0], [3.7, -1.55, 0], [3.75, -1.1, 0], [3.25, -1.05, 0], [3.5, -1.3, 0.35]], round: 0.05}}
variants:
  # on its belly, legs buckled, overgrown
  down: {}
  # the cannon snapped off, lying in front, no moss: a fresher wreck
  bare:
    drop: ["moss-*", "vine-*", "cannon"]
    ground:
      - {name: cannon-down, mat: dark, cylinder: {a: [0.4, -1.75, 0.09], b: [2.2, -1.95, 0.09], r1: 0.09}}
