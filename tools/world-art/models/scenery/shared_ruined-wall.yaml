# Ruined wall (art:shared:ruined-wall), hit box 4x3, drawn 4x4.
# A broken building shell the player can't enter: the south wall facing the camera with an empty
# doorway full of rubble and a dark window hole, the west wall running north and falling away, the
# rest gone to a low foundation line. Cut stone blocks and the lost lintel lie about.
# Axes: x east, y north from the hit box's south edge, z up; 1 m = 1 cell = 16 px.
name: shared_ruined-wall
art: art:shared:ruined-wall
palette: greybox
kits: [kits/shared-scenery.yaml]
cells: [4, 4]
foot: [32, 62]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  wall:  {ramp: light, bands: [0.2, 0.5, 0.85]}
  stone: {ramp: mid,   bands: [0.1, 0.45, 0.8]}
  heap:  {ramp: mid,   bands: [0.4, 0.7, 0.95]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [60, 44]
params:
  t: 0.32          # wall thickness
  ys: 0.3          # the south wall's south face
  h: 2.0           # the standing wall's height
parts:
  # south wall, west of the door: full height, its top broken down toward the door
  - name: south-w
    mat: wall
    extrude: {axis: y, span: ["=ys", "=ys + t"], profile: [[-1.95, 0], [-0.35, 0], [-0.35, 1.25], [-0.75, "=h"], [-1.95, "=h"]], round: 0.03}
  # the window hole: dark, set into the south face
  - {name: window, mat: dark, box: {c: [-1.2, "=ys - 0.01", 1.1], half: [0.24, 0.03, 0.32], radius: 0.01}}
  - {name: window-sill, mat: stone, box: {c: [-1.2, "=ys - 0.04", 0.76], half: [0.3, 0.05, 0.04], radius: 0.01}}
  # south wall, east of the door: broken lower, falling away east
  - name: south-e
    mat: wall
    extrude: {axis: y, span: ["=ys", "=ys + t"], profile: [[0.55, 0], [1.75, 0], [1.75, 0.45], [1.3, 0.9], [0.55, 1.2]], round: 0.03}
  # the doorway: a dark gap behind, the jambs' stubs
  - {name: door-dark, mat: dark, box: {c: [0.1, "=ys + t + 0.1", 0.55], half: [0.45, 0.04, 0.55], radius: 0.01}}
  # west wall running north, its top stepping down
  - name: west-s
    mat: wall
    extrude: {axis: x, span: [-1.95, "=-1.95 + t"], profile: [["=ys", 0], [1.8, 0], [1.8, 1.5], [1.4, "=h"], ["=ys", "=h"]], round: 0.03}
  - name: west-n
    mat: wall
    extrude: {axis: x, span: [-1.95, "=-1.95 + t"], profile: [[1.8, 0], [2.85, 0], [2.85, 0.35], [2.3, 0.8], [1.8, 0.95]], round: 0.03}
  # the low foundation line where the north and east walls were
  - {name: found-n, mat: stone, box: {c: [0.0, 2.7, 0.12], half: [1.6, "=t/2", 0.12], radius: 0.03}}
  - {name: found-e, mat: stone, box: {c: [1.6, 1.85, 0.1], half: ["=t/2", 0.95, 0.1], radius: 0.03}}
  - {use: stone, name: blk-ne, at: [1.55, 2.6, 0], rot: [0, 10, 0], with: {s: [0.2, 0.2, 0.22], mat: stone}}
  # rubble filling the doorway and spilling south
  - name: door-heap
    mat: heap
    hull: {points: [[-0.45, 0.05, 0], [0.75, 0.0, 0], [0.8, 0.95, 0], [-0.5, 0.95, 0], [-0.1, 0.35, 0.45], [0.35, 0.45, 0.5], [0.1, 0.8, 0.55]], round: 0.04}
  - {use: stone, name: blk-1, at: [-0.05, 0.25, 0.12], rot: [6, -10, 20], with: {s: [0.18, 0.13, 0.11], mat: stone}}
  - {use: stone, name: blk-2, at: [0.45, 0.55, 0.3], rot: [-8, 14, -15], with: {s: [0.16, 0.12, 0.1], mat: wall}}
  # rubble inside along the walls
  - {use: chunk, name: in-1, at: [-1.25, 1.2, 0], with: {r: 0.3, h: 0.3, mat: heap}}
  - {use: chunk, name: in-2, at: [0.9, 2.1, 0], with: {r: 0.35, h: 0.28, mat: heap}}
  - {use: stone, name: in-blk, at: [0.8, 1.45, 0], rot: [0, 25, 0], with: {s: [0.22, 0.15, 0.13], mat: wall}}
ground:
  # the fallen lintel, south-east of the door
  - {use: stone, name: lintel, at: [1.2, 0.2, 0], rot: [0, -10, 0], with: {s: [0.42, 0.1, 0.1], mat: wall}}
variants:
  # two walls and a doorway full of rubble
  shell: {}
  # worse: the east half of the south wall down to its footing
  fallen:
    params: {h: 1.55}
    drop: ["south-e", "window*"]
