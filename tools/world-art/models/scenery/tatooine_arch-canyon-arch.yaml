# Arch Canyon arch (art:tatooine:arch-canyon-arch), hit box 7x2, drawn 7x5: the top 3 rows stand over the
# cells behind. Reference: the natural sandstone arch of Arch Canyon on the Boonta Eve course (The Phantom
# Menace) and desert rock arches. The arch broke: its two legs still stand at each end, each carrying a
# curved stub of the span, and the middle of the span lies fallen across the canyon floor between them in
# big blocks. It faces south, so the curve reads. Blocks the side canyon for good.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_arch-canyon-arch
art: art:tatooine:arch-canyon-arch
palette: greybox
cells: [7, 5]
foot: [56, 79]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  rock:  {ramp: mid,  bands: [0.25, 0.5, 0.8]}
  top:   {ramp: bone, bands: [0.25, 0.55, 0.85]}
  seam:  {ramp: dark, bands: [0.25, 0.55, 0.85]}
  scree: {ramp: mid,  bands: [0.3, 0.6, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [110, 30]
groups: {body: {}, arch: {k: 0.25}}
params:
  cz: 0.35        # height of the arch's centre (the span's blocks are written out in metres)
parts:
  # the two legs: stepped sandstone piers
  - {name: leg-w, mat: rock, prism: {poly: [[-3.45, 0.35], [-2.0, 0.3], [-1.95, 1.8], [-3.4, 1.75]], z: [0, 1.25], top: [0.88, 0.9], lean: [0.08, 0], round: 0.05}}
  - {name: leg-e, mat: rock, prism: {poly: [[2.0, 0.3], [3.45, 0.35], [3.4, 1.75], [1.95, 1.8]], z: [0, 1.25], top: [0.88, 0.9], lean: [-0.08, 0], round: 0.05}}
  - {name: seam-w, mat: seam, box: {c: [-2.7, 0.3, 0.75], half: [0.6, 0.03, 0.05]}}
  - {name: seam-e, mat: seam, box: {c: [2.7, 0.3, 0.75], half: [0.6, 0.03, 0.05]}}
  # the stubs of the span, curving up and in from each leg, broken off
  # the stubs of the span, curving up and in from each leg, broken off; their blocks blend into one
  # smooth rock (group `arch`, smooth union) so it reads as a natural arch, not masonry
  - ring: {name: span-w, c: [0, 1.05, "=cz"], axis: y, r: 2.5, n: 7, arc: [182, 252], size: [0.95, 0.95, 1.1], round: 0.08}
    mat: rock
    group: arch
  - ring: {name: span-e, c: [0, 1.05, "=cz"], axis: y, r: 2.5, n: 5, arc: [306, 358], size: [0.95, 1.0, 1.1], round: 0.08}
    mat: rock
    group: arch
  # where the span broke: lit rock
  - {name: break-w, mat: top, hull: {round: 0.04, points: [[-0.51, 0.5, 2.41], [-0.51, 1.6, 2.41], [-0.68, 0.5, 3.07], [-0.68, 1.6, 3.07], [-0.55, 1.05, 3.0]]}}
  - {name: break-e, mat: top, hull: {round: 0.04, points: [[1.12, 0.5, 2.15], [1.12, 1.6, 2.15], [1.51, 0.5, 2.77], [1.51, 1.6, 2.77], [1.35, 1.05, 2.7]]}}
ground:
  # the fallen middle of the span, broken in three blocks between the legs
  - {name: block-1, mat: rock, hull: {round: 0.1, points: [[-1.8, 0.2, 0], [-0.5, 0.1, 0], [-0.4, 1.7, 0], [-1.75, 1.75, 0], [-1.6, 0.35, 0.95], [-0.7, 0.3, 0.45], [-0.6, 1.5, 0.55], [-1.55, 1.55, 1.0]]}}
  - {name: block-2, mat: rock, hull: {round: 0.1, points: [[-0.45, 0.35, 0], [0.8, 0.25, 0], [0.9, 1.8, 0], [-0.4, 1.75, 0], [-0.3, 0.5, 0.35], [0.5, 0.55, 0.6], [0.7, 1.55, 0.45], [-0.2, 1.4, 0.3], [0.25, 1.0, 0.7]]}}
  - {name: block-3, mat: rock, hull: {round: 0.1, points: [[0.85, 0.15, 0], [1.95, 0.25, 0], [1.9, 1.65, 0], [0.9, 1.7, 0], [1.0, 0.35, 0.4], [1.8, 0.4, 0.85], [1.75, 1.5, 0.9], [1.05, 1.45, 0.45]]}}
  - {name: scree-1, mat: scree, hull: {round: 0.04, points: [[-0.6, -0.0, 0], [-0.1, 0.0, 0], [-0.2, 0.3, 0], [-0.55, 0.3, 0], [-0.35, 0.12, 0.25]]}}
  - {name: scree-2, mat: scree, hull: {round: 0.04, points: [[2.05, 0.0, 0], [2.5, 0.02, 0], [2.45, 0.3, 0], [2.1, 0.28, 0], [2.25, 0.12, 0.2]]}}
variants:
  broken: {}
  # still standing: the whole span (before the fall; for the podrace flashback or another canyon)
  whole:
    scale: 0.95
    parts:
      - {name: leg-w, mat: rock, prism: {poly: [[-3.45, 0.35], [-2.0, 0.3], [-1.95, 1.8], [-3.4, 1.75]], z: [0, 1.25], top: [0.88, 0.9], lean: [0.08, 0], round: 0.05}}
      - {name: leg-e, mat: rock, prism: {poly: [[2.0, 0.3], [3.45, 0.35], [3.4, 1.75], [1.95, 1.8]], z: [0, 1.25], top: [0.88, 0.9], lean: [-0.08, 0], round: 0.05}}
      - ring: {name: span, c: [0, 1.05, "=cz"], axis: y, r: 2.5, n: 16, arc: [182, 358], size: [0.95, 0.95, 1.1], round: 0.08}
        mat: rock
        group: arch
    ground:
      - {name: scree-2, mat: scree, hull: {round: 0.04, points: [[2.05, 0.0, 0], [2.5, 0.02, 0], [2.45, 0.3, 0], [2.1, 0.28, 0], [2.25, 0.12, 0.2]]}}
