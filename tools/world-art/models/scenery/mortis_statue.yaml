# Mortis statue (art:mortis:statue), hit box 4x2, drawn 4x7, faces south. Three drawings on one row.
# Reference (wiki/art/concept/mortis/statue__web_*.jpg): the Mortis gods (The Clone Wars, the Mortis arc;
# the Rebels "World Between Worlds" mural; the Peridea monument in Ahsoka). Colossal stone figures on a
# stepped plinth. Each god has its own silhouette, not only its own head:
#   father   a tall square robe with wide sleeves, a long light beard to the chest, the tall pointed
#            crown with its spiked brim, one arm out to the east with the open hand raised.
#   son      dark, a broad V torso on a wide stance, horned shoulder spikes and the high spiked collar
#            flaring behind a bald head, one fist thrust out to the west, the other clenched at the hip.
#   daughter light, a bell-shaped gown flaring to a wide hem, a narrow waist, a hood of long hair
#            falling round her shoulders to the waist, hands cupped round an orb at her breast.
# Axes: x east, y north, z up, origin on the ground at the south middle of the hit box.
