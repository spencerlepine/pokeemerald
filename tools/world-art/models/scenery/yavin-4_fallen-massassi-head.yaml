# Fallen Massassi head (art:yavin-4:fallen-massassi-head), hit box 4x3, drawn 4x4.
# Reference: the carved stone of the Massassi temples (wiki/art/concept/yavin-4/massassi-temple__*); the
# idol itself is this game's own. A blocky stone head: heavy brow over deep eye sockets, a broad flat
# nose, a slit mouth, cheek plates and a tall stepped headdress. Modelled upright, face to the south;
# posed fallen on its side in the river (the crown points east, the face still to the camera), sunk to
# the cheek, with creepers hanging from the eyes. Water rings in shade around it.
# Axes (upright head): x east, y north, z up, origin on the ground under the head's middle.
name: yavin-4_fallen-massassi-head
art: art:yavin-4:fallen-massassi-head
palette: greybox
cells: [4, 4]
foot: [5, 52]
footprint: 3
scale: 1.4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  cap:   {ramp: bone,  bands: [0.3, 0.6, 0.88]}
  dark:  {ramp: dark,  bands: [0.5, 0.8, 0.95]}
  moss:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  water: {color: shade}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [60, 44]
groups: {body: {}, inside: {}}
parts:
  - name: skull
    mat: stone
    hull: {points: [[-0.75, -0.5, 0], [0.75, -0.5, 0], [-0.75, 0.4, 0], [0.75, 0.4, 0],
                    [-0.9, -0.55, 1.15], [0.9, -0.55, 1.15], [-0.9, 0.45, 1.15], [0.9, 0.45, 1.15],
                    [-0.75, -0.5, 1.85], [0.75, -0.5, 1.85], [-0.75, 0.38, 1.85], [0.75, 0.38, 1.85]], round: 0.04}
  # the face: a heavy brow over two big deep eye sockets, a broad nose, a wide slit mouth
  - {name: brow, mat: cap, box: {c: [0, -0.62, 1.45], half: [0.85, 0.13, 0.13], radius: 0.03}}
  - {name: eye-cut-w, mat: stone, op: subtract, box: {c: [-0.42, -0.6, 1.08], half: [0.3, 0.25, 0.22]}}
  - {name: eye-cut-e, mat: stone, op: subtract, box: {c: [0.42, -0.6, 1.08], half: [0.3, 0.25, 0.22]}}
  - {name: eye-w, group: inside, mat: dark, box: {c: [-0.42, -0.38, 1.08], half: [0.3, 0.04, 0.22]}}
  - {name: eye-e, group: inside, mat: dark, box: {c: [0.42, -0.38, 1.08], half: [0.3, 0.04, 0.22]}}
  - name: nose
    mat: cap
    prism: {poly: [[-0.24, -0.55], [0.24, -0.55], [0.2, -0.78], [-0.2, -0.78]], z: [0.5, 1.1], top: [0.55, 0.55], round: 0.03}
  - {name: mouth-cut, mat: stone, op: subtract, box: {c: [0, -0.6, 0.28], half: [0.5, 0.15, 0.08]}}
  - {name: mouth, group: inside, mat: dark, box: {c: [0, -0.47, 0.28], half: [0.5, 0.04, 0.08]}}
  # the stepped headdress
  - {name: crown-1, mat: cap, prism: {poly: [[-0.8, -0.52], [0.8, -0.52], [0.8, 0.4], [-0.8, 0.4]], z: [1.85, 2.1], top: 0.95, round: 0.03}}
  - {name: crown-2, mat: stone, prism: {poly: [[-0.55, -0.42], [0.55, -0.42], [0.55, 0.32], [-0.55, 0.32]], z: [2.1, 2.5], top: 0.7, round: 0.03}}
  # creepers growing out of the eyes, hanging to the water once the head is on its side
  - {name: vine-w, group: inside, mat: moss, box: {c: [-0.75, -0.6, 1.0], half: [0.3, 0.05, 0.07], radius: 0.03}}
  - {name: vine-e, group: inside, mat: moss, box: {c: [0.1, -0.6, 0.95], half: [0.3, 0.05, 0.06], radius: 0.03}}
# fallen on its side in the river: crown to the east, face to the camera
tilt: [-90, 0]
pivot: [0, 0]
sink: -0.6
ground:
  - {name: ring-1, mat: water, cylinder: {a: [1.3, -0.1, 0], b: [1.3, -0.1, 0.01], r1: 1.0}, squash: [1.6, 0.8, 1]}
variants:
  # on its side, sunk to the cheek in the river
  in-river: {}
  # rolled face-up a little, the crown still to the east
  face-up:
    tilt: [-90, -30]
