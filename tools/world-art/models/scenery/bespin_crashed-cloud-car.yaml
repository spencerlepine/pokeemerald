# Crashed cloud car (art:bespin:crashed-cloud-car), hit box 4x2, drawn 4x3.
# Reference: the Storm IV twin-pod cloud car (The Empire Strikes Back): two rounded pods, cockpit
# bubbles, the engine block on the short wing between them (the kit's `cloud-car`). It clipped the
# refinery and lies tipped against the promenade railing (the kit's `rail-bay`), which it has bent;
# a broken panel lies by it. Modelled level, nose east, then tipped onto its north pod.
# Axes: x east, y north, z up, origin on the ground at the hit box's centre.
name: bespin_crashed-cloud-car
art: art:bespin:crashed-cloud-car
palette: greybox
kits: [kits/bespin-kamino.yaml]
cells: [4, 3]
foot: [32, 33]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  wall: {ramp: light, bands: [0.15, 0.5, 0.82]}
  mid:  {ramp: mid,   bands: [0.2, 0.5, 0.8]}
  dark: {ramp: dark,  bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [64, 32]
params: {k: 1.15}
parts:
  - {use: cloud-car, name: car, at: [-0.2, -0.1, 0], with: {k: "=k", gap: 0.6}}
tilt: [-6, 22]
turn: 12
pivot: [0, 0.6]
sink: 0.12
ground:
  # the railing it hit, behind it: one bay straight, one bent over
  - {use: rail-bay, name: rail-w, at: [-1.45, 0.75, 0], with: {w: 1.0, h: 0.5, post: dark}}
  - {use: rail-bay, name: rail-bent, at: [-0.4, 0.8, 0], rot: [0, 0, 35], with: {w: 1.1, h: 0.5, post: dark}}
  - {use: rail-bay, name: rail-e, at: [1.3, 0.85, 0], rot: [0, -14, 0], with: {w: 0.9, h: 0.5, post: dark}}
  # a torn hull panel and scraps on the deck
  - {name: panel, mat: hull, hull: {points: [[1.1, -0.62, 0], [1.6, -0.66, 0], [1.55, -0.35, 0], [1.15, -0.38, 0], [1.35, -0.5, 0.1]], round: 0.02}}
  - {name: scrap, mat: dark, box: {c: [-1.5, -0.6, 0.06], half: [0.18, 0.1, 0.06], radius: 0.02}, rot: [0, 30, 0]}
variants:
  # tipped against the railing
  tipped: {}
  # flat on the deck, nose crumpled, the railing intact
  belly-down:
    tilt: [-8, 4]
    turn: -6
    params: {k: 1.0}
    foot: [32, 31]
    sink: 0.15
