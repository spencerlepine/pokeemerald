# Shared-a kit: pieces for the shared town and hangar models (crates, fuel tanks, a racked TIE).
# Axes: x east, y north, z up; origin on the ground at the south-centre of each piece.
templates:
  # A durasteel cargo crate (A New Hope, Rogue One): a box with bevelled edges, a light lip under the lid, a dark
  # handle slot and two end ribs on its south face. `w`, `d`, `h` are its size (m).
  crate:
    params: {w: 0.9, d: 0.8, h: 0.7, body: mid, lid: light, slot: dark}
    parts:
      - {name: body, mat: "=body", box: {c: [0, "=d/2", "=h/2"], half: ["=w/2", "=d/2", "=h/2 - 0.02"], radius: 0.04}}
      - {name: lip, mat: "=lid", box: {c: [0, "=d/2", "=h - 0.07"], half: ["=w/2 + 0.025", "=d/2 + 0.025", 0.045], radius: 0.02}}
      - {name: slot, mat: "=slot", box: {c: [0, -0.01, "=h * 0.5"], half: ["=w * 0.18", 0.02, "=max(h * 0.08, 0.04)"], radius: 0.01}}
      - {name: rib-w, mat: "=lid", box: {c: ["=-w/2 + 0.07", -0.01, "=h/2 - 0.04"], half: [0.04, 0.025, "=h/2 - 0.08"]}}
      - {name: rib-e, mat: "=lid", box: {c: ["=w/2 - 0.07", -0.01, "=h/2 - 0.04"], half: [0.04, 0.025, "=h/2 - 0.08"]}}

  # A pressurised fuel tank lying on two cradles (Mos Eisley, Tosche Station): a cylinder along x with
  # domed ends, a light band at each end, dark cradles. `len` and `r` are its size; origin under its
  # middle on the ground.
  tank-lying:
    params: {len: 1.6, r: 0.4, body: light, band: mid, cradle: dark}
    parts:
      - {name: body, mat: "=body", cylinder: {a: ["=-len/2 + r*0.5", "=r", "=r + 0.12"], b: ["=len/2 - r*0.5", "=r", "=r + 0.12"], r1: "=r"}}
      - {name: cap-w, mat: "=body", ellipsoid: {c: ["=-len/2 + r*0.5", "=r", "=r + 0.12"], r: ["=r*0.5", "=r", "=r"]}}
      - {name: cap-e, mat: "=body", ellipsoid: {c: ["=len/2 - r*0.5", "=r", "=r + 0.12"], r: ["=r*0.5", "=r", "=r"]}}
      - {name: band-w, mat: "=band", cylinder: {a: ["=-len/2 + r*0.75", "=r", "=r + 0.12"], b: ["=-len/2 + r*0.95", "=r", "=r + 0.12"], r1: "=r + 0.03"}}
      - {name: band-e, mat: "=band", cylinder: {a: ["=len/2 - r*0.95", "=r", "=r + 0.12"], b: ["=len/2 - r*0.75", "=r", "=r + 0.12"], r1: "=r + 0.03"}}
      - {name: cradle-w, mat: "=cradle", box: {c: ["=-len*0.28", "=r", 0.14], half: [0.08, "=r*0.85", 0.14], radius: 0.02}}
      - {name: cradle-e, mat: "=cradle", box: {c: ["=len*0.28", "=r", 0.14], half: [0.08, "=r*0.85", 0.14], radius: 0.02}}

  # A pressurised tank standing upright on a short skirt: a cylinder with a domed top, a band, a valve.
  tank-standing:
    params: {h: 1.3, r: 0.4, body: light, band: mid, skirt: dark}
    parts:
      - {name: skirt, mat: "=skirt", cylinder: {a: [0, "=r", 0], b: [0, "=r", 0.2], r1: "=r*0.9"}}
      - {name: body, mat: "=body", cylinder: {a: [0, "=r", 0.18], b: [0, "=r", "=h - r*0.5"], r1: "=r"}}
      - {name: dome, mat: "=body", ellipsoid: {c: [0, "=r", "=h - r*0.5"], r: ["=r", "=r", "=r*0.5"]}}
      - {name: band, mat: "=band", cylinder: {a: [0, "=r", "=h*0.45"], b: [0, "=r", "=h*0.45 + 0.12"], r1: "=r + 0.03"}}
      - {name: valve, mat: "=skirt", cylinder: {a: [0, "=r", "=h - 0.05"], b: [0, "=r", "=h + 0.12"], r1: 0.06}}

  # A TIE/ln fighter seen broadside (A New Hope): two hexagonal wings standing in x-z planes (south
  # and north), each a dark panel in a light frame with six spars from the hub, the ball cockpit
  # between them on two pylons, its round window to the east. `s` scales it (1 = wings 1.7 m tall),
  # `z0` lifts it (a racked TIE hangs above the floor); origin under the ball's centre.
  tie-broadside:
    params: {s: 1.0, z0: 0.3, gap: 0.9, frame: frame, panel: panel, hull: hull}
    parts:
      - name: wing-s
        mat: "=frame"
        extrude: {axis: y, span: ["=-gap/2 - 0.04", "=-gap/2 + 0.04"], profile: [[0, "=z0"], ["=0.78*s", "=z0 + 0.42*s"], ["=0.78*s", "=z0 + 1.28*s"], [0, "=z0 + 1.7*s"], ["=-0.78*s", "=z0 + 1.28*s"], ["=-0.78*s", "=z0 + 0.42*s"]], round: 0.02}
      - name: panel-s
        mat: "=panel"
        extrude: {axis: y, span: ["=-gap/2 - 0.07", "=-gap/2 - 0.04"], profile: [[0, "=z0 + 0.1*s"], ["=0.68*s", "=z0 + 0.47*s"], ["=0.68*s", "=z0 + 1.23*s"], [0, "=z0 + 1.6*s"], ["=-0.68*s", "=z0 + 1.23*s"], ["=-0.68*s", "=z0 + 0.47*s"]], round: 0.0}
      - {name: spar-v, mat: "=frame", box: {c: [0, "=-gap/2 - 0.08", "=z0 + 0.85*s"], half: [0.035, 0.02, "=0.78*s"]}}
      - {name: spar-a, mat: "=frame", box: {c: [0, "=-gap/2 - 0.08", "=z0 + 0.85*s"], half: ["=0.8*s", 0.02, 0.035]}, rot: [0, 28, 0]}
      - {name: spar-b, mat: "=frame", box: {c: [0, "=-gap/2 - 0.08", "=z0 + 0.85*s"], half: ["=0.8*s", 0.02, 0.035]}, rot: [0, -28, 0]}
      - {name: hub, mat: "=frame", cylinder: {a: [0, "=-gap/2 - 0.1", "=z0 + 0.85*s"], b: [0, "=-gap/2", "=z0 + 0.85*s"], r1: "=0.14*s"}}
      - name: wing-n
        mat: "=hull"
        extrude: {axis: y, span: ["=gap/2 - 0.04", "=gap/2 + 0.04"], profile: [[0, "=z0"], ["=0.78*s", "=z0 + 0.42*s"], ["=0.78*s", "=z0 + 1.28*s"], [0, "=z0 + 1.7*s"], ["=-0.78*s", "=z0 + 1.28*s"], ["=-0.78*s", "=z0 + 0.42*s"]], round: 0.02}
      - {name: pylon, mat: "=hull", box: {c: [0, 0, "=z0 + 0.85*s"], half: ["=0.12*s", "=gap/2", "=0.1*s"], radius: 0.02}}
      - {name: ball, mat: "=hull", ellipsoid: {c: [0, 0, "=z0 + 0.85*s"], r: ["=0.36*s", "=0.33*s", "=0.36*s"]}}
