# Kit for the Kashyyyk, Felucia and small-ruin pieces: templates shared by several models.
# Axes: x east, y north, z up, origin on the ground at the piece's root, unless a template says otherwise.
# Materials are the model's own: each template names the materials it uses (the models define them).
templates:
  # Felucia (giant-fungus, venator-wreck): one fungus.
  # Materials: stalk, cap, lobe, gill, spot.
  # one fungus: bulb, stalk, the cap (a flattened dome over a dark gill ring, with a scalloped rim)
  fungus:
    params: {h: 2.6, r: 0.95, bulb: 0.45, neck: 0.16, lobes: 9}
    parts:
      - {name: bulb, mat: stalk, ellipsoid: {c: [0, 0, "=bulb*0.7"], r: ["=bulb", "=bulb*0.85", "=bulb"]}}
      - {name: stalk, mat: stalk, cone: {a: [0, 0, "=bulb"], b: [0, 0, "=h*0.86"], r1: "=bulb*0.7", r2: "=neck"}}
      - {name: gill, mat: gill, ellipsoid: {c: [0, 0, "=h*0.86"], r: ["=r*0.8", "=r*0.45", "=r*0.12"]}}
      - {name: cap, mat: cap, ellipsoid: {c: [0, 0, "=h*0.9"], r: ["=r*0.86", "=r*0.5", "=r*0.4"]}}
      - name: rim
        mat: lobe
        ring: {c: [0, 0, "=h*0.87"], axis: z, r: "=r*0.62", n: "=lobes", size: ["=r*0.42", "=r*0.4", 0.16], round: 0.06}
      - {name: knob, mat: spot, ellipsoid: {c: ["=-r*0.25", "=-r*0.15", "=h*0.9+r*0.3"], r: ["=r*0.14", "=r*0.08", "=r*0.06"]}}
  # Kashyyyk (wroshyr-tree, root-arch, fallen-wroshyr): a buttress root, a flat-sided fin of wood that
  # leaves the trunk at height `h` and runs out `len` along +x to a point on the ground. `w` is its
  # thickness. Material: bark.
  wroshyr-root:
    params: {len: 1.2, h: 1.1, w: 0.36}
    parts:
      - name: fin
        mat: bark
        hull: {points: [[0, "=-w/2", 0], [0, "=w/2", 0], [0, "=-w*0.35", "=h"], [0, "=w*0.35", "=h"],
                        ["=len*0.45", "=-w*0.45", "=h*0.32"], ["=len*0.45", "=w*0.45", "=h*0.32"],
                        ["=len", "=-w*0.2", 0], ["=len", "=w*0.2", 0], ["=len*0.5", "=-w*0.5", 0], ["=len*0.5", "=w*0.5", 0], ["=len*0.8", 0, "=h*0.12"]], round: 0.07}
  # A length of wroshyr trunk lying along +x from the origin, its axis at height r: a many-sided log
  # (`sides` flat faces) `len` its length, `r` its radius. Material: bark.
  log:
    params: {len: 4, r: 0.85, sides: 8}
    parts:
      - name: wood
        mat: bark
        ring: {c: ["=len/2", 0, "=r"], axis: x, r: "=r*0.82", n: "=sides", size: ["=2*pi*r*0.82/sides*1.12", "=r*0.36", "=len"], round: 0.04}
      - {name: core, mat: bark, cylinder: {a: [0, 0, "=r"], b: ["=len", 0, "=r"], r1: "=r*0.8"}}
  # Kashyyyk (catamaran-dock, catamaran-wreck): the Wookiee Oevvaor jet catamaran (Revenge of the Sith).
  # A slim curved wooden hull with a raised prow, the open cockpit amidships, two long outrigger floats
  # on swept struts, and two jet engines on pylons over the stern. Bow along +x, origin on the water
  # line under the hull's middle. Materials: hull, float, deck, metal, dark.
  catamaran:
    params: {L: 3.6, fy: 0.85}
    parts:
      # the hull: a stern half and a bow half tapering to the prow, which curls up
      - name: hull-aft
        mat: hull
        extrude: {axis: x, profile: [[-0.3, 0.05], [0.3, 0.05], [0.36, 0.42], [-0.36, 0.42]], span: [0, "=-L*0.45"], end: 0.55}
      - name: hull-fore
        mat: hull
        extrude: {axis: x, profile: [[-0.3, 0.05], [0.3, 0.05], [0.36, 0.42], [-0.36, 0.42]], span: [0, "=L*0.42"], end: 0.25}
      - name: prow
        mat: hull
        hull: {points: [["=L*0.38", -0.1, 0.25], ["=L*0.38", 0.1, 0.25], ["=L*0.38", 0, 0.45], ["=L*0.56", 0, 0.85], ["=L*0.52", 0, 0.9]], round: 0.03}
      - name: deck
        mat: deck
        prism: {poly: [["=-L*0.45", -0.22], ["=L*0.12", -0.3], ["=L*0.4", 0], ["=L*0.12", 0.3], ["=-L*0.45", 0.22]], z: [0.36, 0.45], round: 0.02}
      - {name: cockpit, mat: dark, box: {c: [0.1, 0, 0.47], half: [0.3, 0.16, 0.05], radius: 0.04}}
      - {name: seat, mat: hull, box: {c: [-0.45, 0, 0.5], half: [0.14, 0.2, 0.08], radius: 0.03}}
      # the outrigger floats on swept struts
      - name: float-s
        mat: float
        hull: {points: [["=-L*0.32", "=-fy-0.1", 0], ["=-L*0.32", "=-fy+0.1", 0], ["=L*0.3", "=-fy-0.08", 0], ["=L*0.3", "=-fy+0.08", 0],
                        ["=-L*0.32", "=-fy", 0.18], ["=L*0.28", "=-fy", 0.16], ["=L*0.42", "=-fy", 0.2]], round: 0.03}
      - name: float-n
        mat: float
        hull: {points: [["=-L*0.32", "=fy-0.1", 0], ["=-L*0.32", "=fy+0.1", 0], ["=L*0.3", "=fy-0.08", 0], ["=L*0.3", "=fy+0.08", 0],
                        ["=-L*0.32", "=fy", 0.18], ["=L*0.28", "=fy", 0.16], ["=L*0.42", "=fy", 0.2]], round: 0.03}
      - {name: strut-sf, mat: dark, box: {c: [0.45, "=-fy/2-0.1", 0.3], half: [0.06, "=fy/2", 0.04], radius: 0.01}, rot: [0, 0, 18]}
      - {name: strut-sa, mat: dark, box: {c: [-0.8, "=-fy/2-0.1", 0.3], half: [0.06, "=fy/2", 0.04], radius: 0.01}, rot: [0, 0, 18]}
      - {name: strut-nf, mat: dark, box: {c: [0.45, "=fy/2+0.1", 0.3], half: [0.06, "=fy/2", 0.04], radius: 0.01}, rot: [0, 0, -18]}
      - {name: strut-na, mat: dark, box: {c: [-0.8, "=fy/2+0.1", 0.3], half: [0.06, "=fy/2", 0.04], radius: 0.01}, rot: [0, 0, -18]}
      # two jet engines either side of the stern
      - {name: jet-s, mat: dark, cylinder: {a: [-1.45, -0.36, 0.5], b: [-0.75, -0.36, 0.5], r1: 0.15, r2: 0.13}}
      - {name: jet-n, mat: dark, cylinder: {a: [-1.45, 0.36, 0.5], b: [-0.75, 0.36, 0.5], r1: 0.15, r2: 0.13}}
      - {name: jet-s-in, mat: metal, cylinder: {a: [-1.47, -0.36, 0.5], b: [-1.43, -0.36, 0.5], r1: 0.1}}
      - {name: jet-n-in, mat: metal, cylinder: {a: [-1.47, 0.36, 0.5], b: [-1.43, 0.36, 0.5], r1: 0.1}}
  # Kashyyyk (beach-rocks, catamaran-wreck): a basalt column, a hexagon pushed up with its top cut at
  # a slant. `r` its radius, `h` its height. Material: rock.
  basalt:
    params: {r: 0.2, h: 0.5, slant: 0.06}
    parts:
      - name: col
        mat: rock
        hull: {points: [["=r", 0, 0], ["=r*0.5", "=r*0.87", 0], ["=-r*0.5", "=r*0.87", 0], ["=-r", 0, 0], ["=-r*0.5", "=-r*0.87", 0], ["=r*0.5", "=-r*0.87", 0],
                        ["=r", 0, "=h-slant"], ["=r*0.5", "=r*0.87", "=h"], ["=-r*0.5", "=r*0.87", "=h"], ["=-r", 0, "=h"], ["=-r*0.5", "=-r*0.87", "=h-slant"], ["=r*0.5", "=-r*0.87", "=h-slant*2"]], round: 0.03}
