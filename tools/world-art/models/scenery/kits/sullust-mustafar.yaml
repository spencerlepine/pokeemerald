# Sullust and Mustafar kit: pieces shared by the Mustafar mining scenery and Vader's fortress.
# Axes: x east, y north, z up, origin on the ground (or at the piece's anchor) under the piece's centre.
templates:
  # A lava collector head (Revenge of the Sith): a tall curved shield of vertical slats, bowed toward
  # the south, on a dark back frame with a top and bottom bar. Origin at the shield's bottom middle.
  # `r` is the bow's radius, `h` its height, `arc` how much of the circle it covers (deg).
  collector-head:
    params: {r: 0.8, h: 1.4, arc: 110, n: 6, slat: light, frame: dark, bar: mid}
    parts:
      - {name: slats, ring: {c: [0, "=r", 0], axis: z, r: "=r", n: "=n", arc: ["=180 - arc / 2", "=180 + arc / 2"],
                             size: ["=r * radians(arc) / n * 0.82", 0.12, "=h * 2"], round: 0.02}, mat: "=slat"}
      - {name: back, mat: "=frame", box: {c: [0, "=r * 0.62", "=h * 0.5"], half: ["=r * 0.62", 0.06, "=h * 0.45"], radius: 0.02}}
      - {name: bar-top, mat: "=bar", box: {c: [0, "=r * 0.35", "=h * 0.97"], half: ["=r * 0.78", 0.2, 0.07], radius: 0.02}}
      - {name: bar-low, mat: "=bar", box: {c: [0, "=r * 0.35", "=h * 0.06"], half: ["=r * 0.72", 0.18, 0.06], radius: 0.02}}
  # A lattice boom: two light rails and a dark web between them, with cross braces. Runs along +x from
  # the origin for `len`; `w` is its depth (y), `t` its height (z).
  boom:
    params: {len: 3.0, w: 0.3, t: 0.34, n: 5, rail: light, web: dark}
    parts:
      - {name: rail-top, mat: "=rail", box: {c: ["=len / 2", 0, "=t / 2 - 0.04"], half: ["=len / 2", "=w / 2", 0.05], radius: 0.02}}
      - {name: rail-low, mat: "=rail", box: {c: ["=len / 2", 0, "=-t / 2 + 0.04"], half: ["=len / 2", "=w / 2", 0.05], radius: 0.02}}
      - {name: web, mat: "=web", box: {c: ["=len / 2", 0, 0], half: ["=len / 2", "=w / 2 - 0.05", "=t / 2 - 0.05"]}}
      - {name: post-0, mat: "=rail", box: {c: ["=len * 0.04", 0, 0], half: [0.045, "=w / 2", "=t / 2"], radius: 0.01}}
      - {name: post-1, mat: "=rail", box: {c: ["=len * 0.27", 0, 0], half: [0.045, "=w / 2", "=t / 2"], radius: 0.01}}
      - {name: post-2, mat: "=rail", box: {c: ["=len * 0.5", 0, 0], half: [0.045, "=w / 2", "=t / 2"], radius: 0.01}}
      - {name: post-3, mat: "=rail", box: {c: ["=len * 0.73", 0, 0], half: [0.045, "=w / 2", "=t / 2"], radius: 0.01}}
      - {name: post-4, mat: "=rail", box: {c: ["=len * 0.96", 0, 0], half: [0.045, "=w / 2", "=t / 2"], radius: 0.01}}
  # Vader's castle (Rogue One): a ribbed podium, a tapering tower that splits into two prongs at the
  # top (the tuning fork), red-lit slits up its face (light here) and the lava fall pouring from a
  # slot in the podium. Origin at the podium's south edge, middle, on its ground.
  vader-castle:
    params: {body: mid, trim: light, slot: dark, glow: light, prong_w: 10.6, prong_e: 9.9}
    parts:
      - {name: podium, mat: "=body", prism: {poly: [[-2.6, 0], [2.6, 0], [2.6, 3.6], [-2.6, 3.6]], z: [0, 2.4], top: [0.95, 0.92], round: 0.04}}
      - {name: podium-cap, mat: "=trim", box: {c: [0, 0.1, 2.38], half: [2.55, 0.12, 0.1], radius: 0.02}}
      - {name: rib-0, mat: "=trim", box: {c: [-2.45, -0.06, 1.15], half: [0.11, 0.1, 1.15], radius: 0.02}}
      - {name: rib-1, mat: "=trim", box: {c: [-1.75, -0.06, 1.15], half: [0.11, 0.1, 1.15], radius: 0.02}}
      - {name: rib-2, mat: "=trim", box: {c: [-1.05, -0.06, 1.15], half: [0.11, 0.1, 1.15], radius: 0.02}}
      - {name: rib-3, mat: "=trim", box: {c: [1.05, -0.06, 1.15], half: [0.11, 0.1, 1.15], radius: 0.02}}
      - {name: rib-4, mat: "=trim", box: {c: [1.75, -0.06, 1.15], half: [0.11, 0.1, 1.15], radius: 0.02}}
      - {name: rib-5, mat: "=trim", box: {c: [2.45, -0.06, 1.15], half: [0.11, 0.1, 1.15], radius: 0.02}}
      - {name: gate, mat: "=slot", box: {c: [0, -0.04, 0.85], half: [0.5, 0.08, 0.85], radius: 0.03}}
      - {name: fall-slot, mat: "=slot", box: {c: [1.4, -0.04, 1.75], half: [0.24, 0.08, 0.5]}}
      - {name: fall, mat: "=glow", box: {c: [1.4, -0.12, 1.1], half: [0.15, 0.06, 1.1], radius: 0.02}}
      # the tower
      - name: tower
        mat: "=body"
        hull: {points: [[-1.7, 0.9, 2.3], [1.7, 0.9, 2.3], [1.7, 2.9, 2.3], [-1.7, 2.9, 2.3],
                        [-1.12, 1.35, 7.6], [1.12, 1.35, 7.6], [1.12, 2.5, 7.6], [-1.12, 2.5, 7.6]], round: 0.04}
      - name: band
        mat: "=trim"
        hull: {points: [[-1.45, 1.08, 4.0], [1.45, 1.08, 4.0], [1.45, 2.7, 4.0], [-1.45, 2.7, 4.0],
                        [-1.42, 1.1, 4.25], [1.42, 1.1, 4.25], [1.42, 2.68, 4.25], [-1.42, 2.68, 4.25]], round: 0.02}
      - {name: slit-w, mat: "=glow", hull: {points: [[-0.84, 0.841, 2.5], [-0.84, 0.971, 2.5], [-0.66, 0.841, 2.5], [-0.66, 0.971, 2.5], [-0.813, 0.985, 3.85], [-0.813, 1.115, 3.85], [-0.687, 0.985, 3.85], [-0.687, 1.115, 3.85]], round: 0.01}}
      - {name: slit-m, mat: "=glow", hull: {points: [[-0.09, 0.841, 2.5], [-0.09, 0.971, 2.5], [0.09, 0.841, 2.5], [0.09, 0.971, 2.5], [-0.063, 0.985, 3.85], [-0.063, 1.115, 3.85], [0.063, 0.985, 3.85], [0.063, 1.115, 3.85]], round: 0.01}}
      - {name: slit-e, mat: "=glow", hull: {points: [[0.66, 0.841, 2.5], [0.66, 0.971, 2.5], [0.84, 0.841, 2.5], [0.84, 0.971, 2.5], [0.687, 0.985, 3.85], [0.687, 1.115, 3.85], [0.813, 0.985, 3.85], [0.813, 1.115, 3.85]], round: 0.01}}
      - {name: slit-hw, mat: "=glow", hull: {points: [[-0.54, 1.043, 4.4], [-0.54, 1.173, 4.4], [-0.36, 1.043, 4.4], [-0.36, 1.173, 4.4], [-0.513, 1.277, 6.6], [-0.513, 1.407, 6.6], [-0.387, 1.277, 6.6], [-0.387, 1.407, 6.6]], round: 0.01}}
      - {name: slit-he, mat: "=glow", hull: {points: [[0.36, 1.043, 4.4], [0.36, 1.173, 4.4], [0.54, 1.043, 4.4], [0.54, 1.173, 4.4], [0.387, 1.277, 6.6], [0.387, 1.407, 6.6], [0.513, 1.277, 6.6], [0.513, 1.407, 6.6]], round: 0.01}}
      # the two prongs (flat-sided, their tops cut at a slant), the west one taller, the dark gap between
      - name: prong-w
        mat: "=body"
        hull: {points: [[-1.12, 1.35, 7.5], [-0.1, 1.35, 7.5], [-0.1, 2.5, 7.5], [-1.12, 2.5, 7.5],
                        [-0.95, 1.55, "=prong_w - 0.9"], [-0.25, 1.55, "=prong_w"], [-0.25, 2.3, "=prong_w"], [-0.95, 2.3, "=prong_w - 0.9"]], round: 0.03}
      - name: prong-e
        mat: "=body"
        hull: {points: [[0.1, 1.35, 7.5], [1.12, 1.35, 7.5], [1.12, 2.5, 7.5], [0.1, 2.5, 7.5],
                        [0.25, 1.55, "=prong_e"], [0.95, 1.55, "=prong_e - 0.9"], [0.95, 2.3, "=prong_e - 0.9"], [0.25, 2.3, "=prong_e"]], round: 0.03}
      - {name: gap, mat: "=slot", box: {c: [0, 2.1, 8.4], half: [0.12, 0.2, 1.0]}}
  # A drilling derrick (Imperial mining rig): four light corner legs tapering to a crown block, a dark
  # core, two cross bands, and the drill stem down its middle. Built upright, origin at its foot.
  derrick:
    params: {h: 3.5, w: 0.75, wt: 0.3, leg: light, core: dark, band: mid}
    parts:
      - {name: core, mat: "=core", prism: {poly: [["=-w + 0.08", "=-w + 0.08"], ["=w - 0.08", "=-w + 0.08"], ["=w - 0.08", "=w - 0.08"], ["=-w + 0.08", "=w - 0.08"]], z: [0, "=h"], top: "=wt / w", round: 0.02}}
      - {name: leg-sw, mat: "=leg", cylinder: {a: ["=-w", "=-w", 0], b: ["=-wt", "=-wt", "=h"], r1: 0.09, r2: 0.07}}
      - {name: leg-se, mat: "=leg", cylinder: {a: ["=w", "=-w", 0], b: ["=wt", "=-wt", "=h"], r1: 0.09, r2: 0.07}}
      - {name: leg-nw, mat: "=leg", cylinder: {a: ["=-w", "=w", 0], b: ["=-wt", "=wt", "=h"], r1: 0.09, r2: 0.07}}
      - {name: leg-ne, mat: "=leg", cylinder: {a: ["=w", "=w", 0], b: ["=wt", "=wt", "=h"], r1: 0.09, r2: 0.07}}
      - {name: band-1, mat: "=band", prism: {poly: [["=-(w - (w - wt) * 0.33) - 0.04", "=-(w - (w - wt) * 0.33) - 0.04"], ["=(w - (w - wt) * 0.33) + 0.04", "=-(w - (w - wt) * 0.33) - 0.04"], ["=(w - (w - wt) * 0.33) + 0.04", "=(w - (w - wt) * 0.33) + 0.04"], ["=-(w - (w - wt) * 0.33) - 0.04", "=(w - (w - wt) * 0.33) + 0.04"]], z: ["=h * 0.33 - 0.08", "=h * 0.33 + 0.08"], round: 0.02}}
      - {name: band-2, mat: "=band", prism: {poly: [["=-(w - (w - wt) * 0.66) - 0.04", "=-(w - (w - wt) * 0.66) - 0.04"], ["=(w - (w - wt) * 0.66) + 0.04", "=-(w - (w - wt) * 0.66) - 0.04"], ["=(w - (w - wt) * 0.66) + 0.04", "=(w - (w - wt) * 0.66) + 0.04"], ["=-(w - (w - wt) * 0.66) - 0.04", "=(w - (w - wt) * 0.66) + 0.04"]], z: ["=h * 0.66 - 0.08", "=h * 0.66 + 0.08"], round: 0.02}}
      - {name: crown, mat: "=band", box: {c: [0, 0, "=h + 0.12"], half: ["=wt + 0.15", "=wt + 0.15", 0.16], radius: 0.03}}
      - {name: stem, mat: "=leg", cylinder: {a: [0, "=-w * 0.2", 0], b: [0, "=-wt * 0.2", "=h"], r1: 0.1}}
  # A glass dome (the Sullust ash farms and greenhouses): a dark glass half sphere of radius `r` with
  # light ribs, four meridians and two rings, and a light base ring. Origin at the dome's centre on its
  # base (the dome is the half above z = 0).
  glass-dome:
    params: {r: 1.3, n: 9, glass: dark, rib: light}
    parts:
      - {name: glass, mat: "=glass", ellipsoid: {c: [0, 0, 0], r: ["=r", "=r", "=r"]}}
      - {name: rib-a, mat: "=rib", ring: {c: [0, 0, 0], axis: [1, 0, 0], r: "=r", n: "=n", arc: [182, 358], size: ["=r * 0.42", 0.08, 0.08], round: 0.01}}
      - {name: rib-b, mat: "=rib", ring: {c: [0, 0, 0], axis: [0.5, 0.866, 0], r: "=r", n: "=n", arc: [182, 358], size: ["=r * 0.42", 0.08, 0.08], round: 0.01}}
      - {name: rib-c, mat: "=rib", ring: {c: [0, 0, 0], axis: [0.5, -0.866, 0], r: "=r", n: "=n", arc: [182, 358], size: ["=r * 0.42", 0.08, 0.08], round: 0.01}}
      - {name: lat-1, mat: "=rib", ring: {c: [0, 0, "=r * 0.38"], axis: z, r: "=r * 0.925", n: 16, size: ["=r * 0.4", 0.07, 0.07], round: 0.01}}
      - {name: lat-2, mat: "=rib", ring: {c: [0, 0, "=r * 0.72"], axis: z, r: "=r * 0.694", n: 12, size: ["=r * 0.4", 0.07, 0.07], round: 0.01}}
      - {name: base, mat: "=rib", cylinder: {a: [0, 0, 0], b: [0, 0, 0.12], r1: "=r + 0.06"}}
  # A round porthole facing south (the Sullustan houses): a light rim and a dark glass disc, radius `r`.
  # Origin at its centre.
  porthole:
    params: {r: 0.3, rim: light, glass: dark}
    parts:
      - {name: rim, mat: "=rim", cylinder: {a: [0, 0.06, 0], b: [0, -0.06, 0], r1: "=r"}}
      - {name: glass, mat: "=glass", cylinder: {a: [0, -0.02, 0], b: [0, -0.09, 0], r1: "=r * 0.68"}}
