# Endor and Dagobah kit: pieces shared by the forest and swamp scenery and objects.
# Axes: x east, y north, z up, origin on the ground at the piece's centre.
templates:
  # A log lying along x: a bark cylinder (its tone bands run along it, so it reads round), moss lumps along
  # its top, a pale cut end at the west. `len` is its length, `r` its radius.
  log:
    params: {len: 3.0, r: 0.45, bark: bark, moss: moss, wood: wood, furrow: dark, taper: 0.85}
    parts:
      - {name: bark, mat: "=bark", cylinder: {a: ["=-len / 2", 0, "=r"], b: ["=len / 2", 0, "=r"], r1: "=r", r2: "=r * taper"}}
      # bark furrows along the log: dark grooves on its south face and top
      - {name: furrow-1, mat: "=furrow", box: {c: [0, "=-r * 0.92", "=r * 0.75"], half: ["=len * 0.42", 0.03, 0.025], radius: 0.01}}
      - {name: furrow-2, mat: "=furrow", box: {c: ["=len * 0.06", "=-r * 0.7", "=r * 1.62"], half: ["=len * 0.36", 0.03, 0.025], radius: 0.01}, rot: [0, 0, 45]}
      - {name: moss-1, mat: "=moss", ellipsoid: {c: ["=-len * 0.2", "=r * 0.1", "=r * 1.95"], r: ["=len * 0.16", "=r * 0.55", "=r * 0.22"]}}
      - {name: moss-2, mat: "=moss", ellipsoid: {c: ["=len * 0.15", "=r * 0.05", "=r * 1.9"], r: ["=len * 0.12", "=r * 0.5", "=r * 0.2"]}}
      - name: end-w
        mat: "=wood"
        extrude: {axis: x, span: ["=-len / 2 - 0.03", "=-len / 2 + 0.01"], round: 0.01,
                  profile: [["=-r * 0.33", "=r * 0.12"], ["=r * 0.33", "=r * 0.12"], ["=r * 0.85", "=r * 0.66"], ["=r * 0.85", "=r * 1.34"],
                            ["=r * 0.33", "=r * 1.88"], ["=-r * 0.33", "=r * 1.88"], ["=-r * 0.85", "=r * 1.34"], ["=-r * 0.85", "=r * 0.66"]]}
  # A buttress root: a low wedge flaring out from a trunk's foot, pointing along +x.
  # `len` how far it reaches, `h` its height at the trunk, `w` its thickness.
  buttress:
    params: {len: 0.9, h: 0.9, w: 0.42, mat: bark}
    parts:
      - name: root
        mat: "=mat"
        hull: {points: [[0, "=-w / 2", 0], [0, "=w / 2", 0], [0, "=-w * 0.35", "=h"], [0, "=w * 0.35", "=h"],
                        ["=len", "=-w * 0.3", 0], ["=len", "=w * 0.3", 0], ["=len * 0.45", "=-w * 0.35", "=h * 0.35"], ["=len * 0.45", "=w * 0.35", "=h * 0.35"]], round: 0.05}
  # An arching swamp root (Dagobah gnarltree): leaves the trunk going out and a little up, then bends
  # down into the water. Points along +x; `reach` scales it, `r` is its thickness.
  arch-root:
    params: {reach: 1.0, r: 0.16, mat: bark}
    parts:
      - name: root
        mat: "=mat"
        limb:
          root: [0, 0, 0]
          round: 0.04
          segments:
            - {len: "=0.55 * reach", w: "=r * 2", d: "=r * 2", bend: 105, taper: 0.85}
            - {len: "=0.55 * reach", w: "=r * 1.7", d: "=r * 1.7", bend: -55, taper: 0.8}
            - {len: "=0.6 * reach", w: "=r * 1.35", d: "=r * 1.35", bend: -40, taper: 0.7}
