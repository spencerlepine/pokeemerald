# Abandoned kyber drill (art:ilum:abandoned-kyber-drill), hit box 5x4, drawn 5x6.
# Reference: Imperial mining machinery (the Empire stripping Ilum's kyber, Star Wars Rebels / The Force
# Awakens' Starkiller Base); no single canon design, so this is a generic Imperial drill rig in the
# Empire's style: a tracked crawler with an angular grey hull, the cab's dark slit windows to the south,
# a lattice mast leaning east carrying the drill shaft and a conical bit bored into the ice. Snow lies
# on the hull and drifts against the treads.
# Axes: x east, y north, z up, origin on the ground at the middle of the hit box.
name: ilum_abandoned-kyber-drill
art: art:ilum:abandoned-kyber-drill
palette: greybox
cells: [5, 6]
foot: [40, 72]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  plate: {ramp: light, bands: [0.2, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.5, 0.8, 0.95]}
  tread: {ramp: dark,  bands: [0.2, 0.5, 0.82]}
  snow:  {ramp: bone,  bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [76, 60]
params:
  mx: 0.55         # the mast's foot (x)
  lean: 8         # the mast's lean toward the east (deg)
parts:
  # the treads, one each side
  - {name: tread-s, mat: tread, box: {c: [-0.75, -0.95, 0.35], half: [1.4, 0.32, 0.35], radius: 0.15}}
  - {name: tread-n, mat: tread, box: {c: [-0.75, 0.95, 0.35], half: [1.4, 0.32, 0.35], radius: 0.15}}
  - {name: wheel-s, mat: hull, box: {c: [-0.75, -1.28, 0.35], half: [1.2, 0.02, 0.16], radius: 0.01}}
  # the hull: an angular Imperial wedge, the cab block at the west end
  - name: hull
    mat: hull
    hull: {points: [[-2.0, -1.15, 0.65], [1.1, -1.15, 0.65], [-2.0, 1.15, 0.65], [1.1, 1.15, 0.65],
                    [-1.85, -0.95, 1.45], [0.95, -0.95, 1.45], [-1.85, 0.95, 1.45], [0.95, 0.95, 1.45]], round: 0.04}
  - name: cab
    mat: plate
    prism: {poly: [[-2.05, -1.0], [-0.7, -1.0], [-0.7, 0.9], [-2.05, 0.9]], z: [1.4, 2.25], top: [0.85, 0.8], lean: [0.05, 0.05], round: 0.04}
  - {name: window, mat: dark, box: {c: [-1.35, -0.95, 1.95], half: [0.5, 0.05, 0.1], radius: 0.01}}
  - {name: vent, mat: dark, box: {c: [0.0, -1.12, 1.05], half: [0.6, 0.04, 0.12], radius: 0.01}}
  # the mast: two leaning posts with cross braces, a head block, the drill shaft and its bit
  - {name: post-s, mat: plate, cylinder: {a: ["=mx", -0.45, 1.4], b: ["=mx + 2.6 * tan(radians(lean))", -0.35, 3.6], r1: 0.09}}
  - {name: post-n, mat: plate, cylinder: {a: ["=mx", 0.45, 1.4], b: ["=mx + 2.6 * tan(radians(lean))", 0.35, 3.6], r1: 0.09}}
  - {name: brace-1, mat: hull, cylinder: {a: ["=mx + 0.2", -0.43, 2.2], b: ["=mx + 0.2", 0.43, 2.2], r1: 0.06}}
  - {name: brace-2, mat: hull, cylinder: {a: ["=mx + 0.4", -0.4, 3.0], b: ["=mx + 0.4", 0.4, 3.0], r1: 0.06}}
  - {name: brace-x, mat: hull, cylinder: {a: ["=mx + 0.05", -0.44, 1.6], b: ["=mx + 0.38", -0.38, 3.0], r1: 0.05}}
  - {name: head, mat: hull, box: {c: ["=mx + 0.65", 0, 3.6], half: [0.55, 0.45, 0.25], radius: 0.04}}
  - {name: arm, mat: hull, box: {c: ["=mx + 1.15", 0, 3.5], half: [0.45, 0.2, 0.15], radius: 0.03}}
  - {name: shaft, mat: tread, cylinder: {a: ["=mx + 1.5", 0, 3.45], b: ["=mx + 1.5", 0, 0.5], r1: 0.13}}
  - {name: motor, mat: plate, cylinder: {a: ["=mx + 1.5", 0, 2.5], b: ["=mx + 1.5", 0, 3.1], r1: 0.28}}
  - {name: bit, mat: dark, cone: {a: ["=mx + 1.5", 0, 0.75], b: ["=mx + 1.5", 0, -0.2], r1: 0.35, r2: 0.05}}
  # snow on the hull
  - {name: snow-cab, mat: snow, box: {c: [-1.4, 0.0, 2.25], half: [0.5, 0.65, 0.05], radius: 0.04}}
  - {name: snow-deck, mat: snow, box: {c: [-0.1, 0.25, 1.46], half: [0.5, 0.5, 0.04], radius: 0.04}}
ground:
  - {name: drift-w, mat: snow, ellipsoid: {c: [-2.15, -0.3, 0], r: [0.28, 0.8, 0.25]}}
  - {name: drift-s, mat: snow, ellipsoid: {c: [-1.2, -1.32, 0], r: [0.7, 0.16, 0.14]}}
  - {name: bore, mat: snow, ellipsoid: {c: ["=mx + 1.5", 0, 0], r: [0.55, 0.45, 0.2]}}
variants:
  # frozen where it worked, the bit still in the ice
  frozen: {}
  # the mast has come down across the snow to the east
  mast-down:
    drop: ["post-*", "brace-*", "head", "arm", "shaft", "motor", "bit"]
    ground:
      - {name: drift-w, mat: snow, ellipsoid: {c: [-2.15, -0.3, 0], r: [0.28, 0.8, 0.25]}}
      - {name: drift-s, mat: snow, ellipsoid: {c: [-1.2, -1.32, 0], r: [0.7, 0.16, 0.14]}}
      - {name: post-s, mat: plate, cylinder: {a: [1.3, -0.4, 0.75], b: [2.4, -1.6, 0.1], r1: 0.09}}
      - {name: post-n, mat: plate, cylinder: {a: [1.3, 0.4, 0.75], b: [2.45, -0.75, 0.1], r1: 0.09}}
      - {name: head, mat: hull, box: {c: [2.15, -1.35, 0.22], half: [0.3, 0.5, 0.22], radius: 0.04}, rot: [0, 40, 0]}
