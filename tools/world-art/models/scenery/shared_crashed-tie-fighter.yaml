# Crashed TIE fighter (art:shared:crashed-tie-fighter), hit box 3x2, drawn 3x4.
# Reference: the TIE/ln (A New Hope). The ball cockpit sits on the ground with its round window to the
# south; the port wing stands upright behind it facing the camera (a hexagon reads only face-on in this
# view: edge-on it is a line), the starboard wing lies torn off and flat to the east.
# Axes: x east, y north from the hit box's south edge, z up; 1 m = 1 cell = 16 px.
name: shared_crashed-tie-fighter
art: art:shared:crashed-tie-fighter
palette: greybox
cells: [3, 4]
foot: [22, 62]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.1, 0.45, 0.8]}
  panel: {ramp: dark,  bands: [0.1, 0.45, 0.8]}
  frame: {ramp: light, bands: [0.1, 0.45, 0.8]}
  glass: {ramp: dark,  bands: [0.3, 0.6, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [44, 28]
parts:
  # upright wing: a hexagon in the x-z plane (straight sides, pointed top and bottom), facing south
  - name: wing-frame
    mat: frame
    extrude: {axis: y, span: [1.42, 1.56], profile: [[-1.32, 0.45], [-0.35, 0.0], [0.62, 0.45], [0.62, 1.45], [-0.35, 1.92], [-1.32, 1.45]], round: 0.03}
  - name: wing-panel
    mat: panel
    extrude: {axis: y, span: [1.3, 1.42], profile: [[-1.2, 0.5], [-0.35, 0.12], [0.5, 0.5], [0.5, 1.4], [-0.35, 1.8], [-1.2, 1.4]], round: 0.02}
  # spars from the hub to the six corners: what makes a TIE wing read at 16 px
  - {name: spar-v, mat: frame, box: {c: [-0.35, 1.26, 0.96], half: [0.07, 0.04, 0.86], radius: 0.02}}
  - {name: spar-a, mat: frame, box: {c: [-0.35, 1.26, 0.96], half: [0.9, 0.04, 0.06], radius: 0.02}, rot: [27, 0, 0]}
  - {name: spar-b, mat: frame, box: {c: [-0.35, 1.26, 0.96], half: [0.9, 0.04, 0.06], radius: 0.02}, rot: [-27, 0, 0]}
  - {name: hub, mat: frame, ellipsoid: {c: [-0.35, 1.24, 0.96], r: [0.2, 0.06, 0.2]}}
  - name: pylon
    mat: hull
    box: {c: [-0.05, 1.05, 0.6], half: [0.3, 0.22, 0.1], radius: 0.05}
  # the ball cockpit, its round window facing south
  - name: ball
    mat: hull
    ellipsoid: {c: [0.3, 0.62, 0.48], r: [0.5, 0.42, 0.46]}
  - name: window
    mat: glass
    ellipsoid: {c: [0.3, 0.3, 0.52], r: [0.24, 0.14, 0.22]}
  # the torn-off wing, flat on the ground in the south-east corner
  - name: flat-wing
    mat: panel
    prism: {poly: [[0.85, 0.12], [1.15, 0.0], [1.45, 0.12], [1.45, 0.62], [1.15, 0.74], [0.85, 0.62]], z: [0.0, 0.12], round: 0.02}
  - {name: flat-spar, mat: frame, box: {c: [1.15, 0.37, 0.13], half: [0.05, 0.34, 0.03]}}
  - name: flat-frame
    mat: frame
    prism: {poly: [[0.8, 0.08], [1.15, -0.04], [1.5, 0.08], [1.5, 0.66], [1.15, 0.78], [0.8, 0.66]], z: [0.0, 0.07], round: 0.02}
