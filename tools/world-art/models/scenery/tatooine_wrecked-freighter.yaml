# Wrecked freighter (art:tatooine:wrecked-freighter), hit box 8x4, drawn 8x6: the top 2 rows stand over
# the cells behind. Reference: the Corellian YT-series light freighters (A New Hope's docking bay 94, the
# parked freighter concepts): a flat round saucer hull with a raised centre, two forward mandibles with a
# slot between them, the cockpit tube on one side, the engine band round the back. This one came in too
# low on the coast cliffs: it lies nose-down in the sand, rolled a little, a mandible broken off, sand
# drifted over the low side. Drawn for the 3/4 camera (owner, 2026-11-04): the saucer is the oval
# `yt1300` hull from kits/freighters.yaml on its thick side wall, so it never reads as a disc facing the
# camera; the cockpit tube shows on the south side.
# Modelled level, bow east (+x); posed tipped. `mirror` gives the west-facing one.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_wrecked-freighter
art: art:tatooine:wrecked-freighter
palette: greybox
kits: [kits/freighters.yaml]
cells: [8, 6]
foot: [52, 93]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: light, bands: [0.3, 0.6, 0.9]}
  plate: {ramp: mid,   bands: [0.15, 0.5, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  glass: {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  sand:  {ramp: bone,  bands: [0.55, 0.8, 0.97]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [124, 62]
tilt: [12, 4]
pivot: [0, 2.25]
sink: 0.15
params: {cy: 2.25}
groups: {body: {}, saucer: {}, engines: {}}
parts:
  - {use: yt1300, name: ship, at: [0, "=cy", 0], with: {R: 2.45, k: 0.68, zh: 0.05, w: 0.62, d: 0.28, reach: 1.35}}
  # a scorched breach in the aft deck and a bent hull plate sticking up out of it
  - {name: breach, mat: dark, ellipsoid: {c: [-1.2, "=cy - 0.35", 1.0], r: [0.42, 0.3, 0.12]}}
  - {name: bent-plate, mat: plate, box: {c: [-1.05, "=cy - 0.5", 1.08], half: [0.3, 0.05, 0.16], radius: 0.02}, rot: [-35, 0, 0]}
ground:
  # sand drifted over the buried nose and the low south side
  - {name: drift-s, mat: sand, ellipsoid: {c: [0.6, 0.45, 0], r: [2.9, 0.45, 0.28]}}
  - {name: drift-e, mat: sand, ellipsoid: {c: [3.5, 1.5, 0], r: [0.9, 0.55, 0.22]}}
drop: ["ship/leg-1", "ship/leg-2", "ship/leg-3", "ship/dish-post"]
variants:
  tipped: {}
  # the south mandible snapped off and lying in the sand in front
  mandible-lost:
    drop: ["ship/leg-1", "ship/leg-2", "ship/leg-3", "ship/dish-post", "ship/mandible-s", "ship/tip-s"]
    ground:
      - {name: drift-s, mat: sand, ellipsoid: {c: [0.6, 0.45, 0], r: [2.9, 0.45, 0.28]}}
      - {name: drift-e, mat: sand, ellipsoid: {c: [3.5, 1.5, 0], r: [0.9, 0.55, 0.22]}}
      - {name: lost-mandible, mat: hull, prism: {poly: [[2.4, 0.15], [3.7, 0.1], [3.7, 0.55], [2.6, 0.75]], z: [0, 0.4], top: 0.9, round: 0.04}}
