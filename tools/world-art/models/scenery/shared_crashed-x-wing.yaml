# Crashed X-wing (art:shared:crashed-x-wing), hit box 6x3, drawn 6x4.
# Reference: the T-65 X-wing (A New Hope; wiki/art/concept/dagobah/sunken-x-wing__db_x-wing-starfighter.jpg).
# Seen from above, nose east, tipped nose-down into the ground. The S-foils are open: the north pair still
# up, the south pair broken and lying flat; one wing has snapped off and lies in the south-east corner.
# Axes: x east, y north from the hit box's south edge, z up; 1 m = 1 cell = 16 px.
name: shared_crashed-x-wing
art: art:shared:crashed-x-wing
palette: greybox
cells: [6, 4]
foot: [48, 64]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:   {ramp: light, bands: [0.1, 0.45, 0.8]}
  wing:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  metal:  {ramp: mid,   bands: [0.1, 0.45, 0.8]}
  vent:   {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  glass:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [92, 44]
tilt: [-6, 0]
pivot: [1.5, 1.5]
sink: 0.08
parts:
  # fuselage: a long box tapering to the nose
  - name: body
    mat: hull
    extrude: {axis: x, span: [-2.2, 0.7], profile: [[1.22, 0.1], [1.78, 0.1], [1.84, 0.55], [1.16, 0.55]], round: 0.05}
  - name: nose
    mat: hull
    extrude: {axis: x, span: [0.7, 2.75], profile: [[1.22, 0.1], [1.78, 0.1], [1.84, 0.55], [1.16, 0.55]], end: [0.35, 0.45], round: 0.04}
  - name: canopy
    mat: glass
    prism: {poly: [[0.15, 1.3], [0.95, 1.36], [0.95, 1.64], [0.15, 1.7]], z: [0.5, 0.78], top: [0.7, 0.75], round: 0.04}
  - {name: droid, mat: metal, ellipsoid: {c: [-0.35, 1.5, 0.62], r: [0.17, 0.17, 0.15]}}
  # the north pair of S-foils, still up
  - name: wing-n
    mat: wing
    prism: {poly: [[-2.0, 1.75], [-0.75, 1.75], [-1.2, 2.85], [-2.05, 2.85]], z: [0.48, 0.6], round: 0.02}
  - {name: cannon-n, mat: metal, cylinder: {a: [-2.1, 2.8, 0.55], b: [0.9, 2.8, 0.55], r1: 0.07}}
  # the south pair, broken flat on the ground
  - name: wing-s
    mat: wing
    prism: {poly: [[-2.0, 1.25], [-0.75, 1.25], [-1.25, 0.25], [-2.05, 0.25]], z: [0.0, 0.12], round: 0.02}
  - {name: cannon-s, mat: metal, cylinder: {a: [-2.1, 0.3, 0.08], b: [0.4, 0.3, 0.08], r1: 0.07}}
  # four engines at the wing roots
  - {name: engine-1, mat: metal, cylinder: {a: [-2.85, 1.05, 0.38], b: [-1.35, 1.05, 0.38], r1: 0.19}}
  - {name: engine-2, mat: metal, cylinder: {a: [-2.85, 1.95, 0.38], b: [-1.35, 1.95, 0.38], r1: 0.19}}
  - {name: engine-3, mat: metal, cylinder: {a: [-2.85, 1.15, 0.72], b: [-1.35, 1.15, 0.72], r1: 0.17}}
  - {name: engine-4, mat: metal, cylinder: {a: [-2.85, 1.85, 0.72], b: [-1.35, 1.85, 0.72], r1: 0.17}}
  - {name: nozzles, mat: vent, box: {c: [-2.86, 1.5, 0.55], half: [0.04, 0.68, 0.38], radius: 0.02}}
  # the snapped-off wing in the south-east corner
  - name: lost-wing
    mat: wing
    prism: {poly: [[1.3, 0.15], [2.6, 0.25], [2.55, 0.7], [1.4, 0.85]], z: [0.0, 0.1], round: 0.02}
  - {name: lost-cannon, mat: metal, cylinder: {a: [1.35, 0.12, 0.07], b: [2.9, 0.22, 0.07], r1: 0.06}}
