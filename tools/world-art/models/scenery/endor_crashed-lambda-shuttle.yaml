# Crashed Imperial shuttle (art:endor:crashed-lambda-shuttle), hit box 8x4, drawn 8x7.
# Reference: the Lambda-class T-4a shuttle (Return of the Jedi), wiki/art/concept/endor/crashed-lambda-shuttle__web_1-4:
# a boxy hull with an engine pod along each upper side, a pointed cockpit wedge low at the front, the tall
# dorsal fin (as tall as the ship is long: leading edge swept back, trailing edge straight up) and two long
# wings hinged under the pods that fold down for flight and up beside the fin for landing (the inverted Y).
# Modelled level, nose along +x, then turned nose toward the camera so the Y spreads across the screen
# (side on, every wing and the fin stand in one plane and draw as one vertical strip).
# Axes: x forward (the nose), y to its left, z up, origin on the ground under the hull's middle.
name: endor_crashed-lambda-shuttle
art: art:endor:crashed-lambda-shuttle
palette: greybox
cells: [8, 7]
foot: [64, 82]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: light, bands: [0.25, 0.55, 0.85]}
  plate: {ramp: mid,   bands: [0.2, 0.5, 0.82]}
  pod:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.3, 0.6, 0.9]}
  bark:  {ramp: mid,   bands: [-0.05, 0.35, 0.7]}
  moss:  {ramp: mid,   bands: [0.1, 0.4, 0.75]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [128, 64]
params:
  wl: 40             # left wing: degrees up from level (landing fold is about 80, flight about -55)
  wr: 40             # right wing
  sl: 2.6            # left wing span
  sr: 2.6            # right wing span
templates:
  # one wing: a long plate hinged under the engine pod, `side` +1 left, -1 right, raised `ang` from level.
  # Planform from the schematic: root chord about the fin's, trailing edge straight, leading edge swept.
  lambda-wing:
    params: {side: 1, ang: 0, span: 2.6}
    parts:
      - name: plate
        mat: plate
        hull: {points: [
          [0.0,  "=side * 0.95", 0.62], [-1.9, "=side * 0.95", 0.62],
          [0.0,  "=side * 0.95 - side * 0.12 * sin(radians(ang))", "=0.62 + 0.12 * cos(radians(ang))"],
          [-1.9, "=side * 0.95 - side * 0.12 * sin(radians(ang))", "=0.62 + 0.12 * cos(radians(ang))"],
          [-1.0, "=side * (0.95 + span * cos(radians(ang)))", "=0.62 + span * sin(radians(ang))"],
          [-1.9,  "=side * (0.95 + span * cos(radians(ang)))", "=0.62 + span * sin(radians(ang))"],
          [-1.0, "=side * (0.95 + span * cos(radians(ang))) - side * 0.12 * sin(radians(ang))", "=0.62 + span * sin(radians(ang)) + 0.12 * cos(radians(ang))"],
          [-1.9,  "=side * (0.95 + span * cos(radians(ang))) - side * 0.12 * sin(radians(ang))", "=0.62 + span * sin(radians(ang)) + 0.12 * cos(radians(ang))"]], round: 0.03}
parts:
  # the boxy main hull
  - name: body
    mat: hull
    hull: {points: [[-1.9, -0.7, 0.3], [0.7, -0.6, 0.3], [-1.9, 0.7, 0.3], [0.7, 0.6, 0.3],
                    [-1.9, -0.62, 1.3], [0.7, -0.55, 1.25], [-1.9, 0.62, 1.3], [0.7, 0.55, 1.25]], round: 0.05}
  # the engine pods along each upper side, the wings hang under them
  - {name: pod-l, mat: pod, cylinder: {a: [-2.05, 0.88, 0.92], b: [0.45, 0.88, 0.92], r1: 0.3}}
  - {name: pod-r, mat: pod, cylinder: {a: [-2.05, -0.88, 0.92], b: [0.45, -0.88, 0.92], r1: 0.3}}
  - {name: engines, mat: dark, box: {c: [-1.94, 0, 0.95], half: [0.04, 0.45, 0.25], radius: 0.01}}
  # the pointed cockpit wedge, low at the front, its window band on the sloped top
  - name: nose
    mat: hull
    hull: {points: [[0.65, -0.45, 0.35], [0.65, 0.45, 0.35], [0.65, -0.42, 1.2], [0.65, 0.42, 1.2],
                    [1.95, -0.22, 0.45], [1.95, 0.22, 0.45], [1.85, -0.2, 0.62], [1.85, 0.2, 0.62]], round: 0.04}
  - name: window
    mat: dark
    hull: {points: [[0.85, -0.38, 1.12], [0.85, 0.38, 1.12], [1.45, -0.28, 0.86], [1.45, 0.28, 0.86],
                    [0.85, -0.36, 1.2], [0.85, 0.36, 1.2], [1.45, -0.26, 0.93], [1.45, 0.26, 0.93]], round: 0.01}
  # the tall dorsal fin: root over the rear hull, leading edge swept back, trailing edge straight up
  - name: fin
    mat: plate
    extrude: {axis: y, span: [-0.08, 0.08], profile: [[-1.9, 1.2], [-0.05, 1.2], [-0.95, 3.8], [-2.0, 3.8]], round: 0.03}
  - {use: lambda-wing, name: wing-l, with: {side: 1, ang: "=wl", span: "=sl"}}
  - {use: lambda-wing, name: wing-r, with: {side: -1, ang: "=wr", span: "=sr"}}
ground:
  - {name: fern-1, mat: moss, ellipsoid: {c: [-3.2, -1.4, 0], r: [0.45, 0.22, 0.2]}}
  - {name: fern-2, mat: moss, ellipsoid: {c: [3.0, -1.2, 0], r: [0.4, 0.2, 0.18]}}
variants:
  crashed:
    turn: -58
    scale: 0.62
    foot: [68, 80]
    params: {wl: 68, wr: -10, sl: 3.0, sr: 1.8}
    tilt: [-5, -6]
    pivot: [2.0, 0]
    sink: 0.1
    ground:
      - {name: lost-wing, mat: plate, prism: {poly: [[-4.0, -1.0], [-2.7, -0.8], [-2.4, -1.6], [-3.7, -1.95]], z: [0.0, 0.1], round: 0.02}}
      - {name: dirt-1, mat: moss, ellipsoid: {c: [1.2, -2.0, 0], r: [0.6, 0.25, 0.18]}}
      - {name: fern-2, mat: moss, ellipsoid: {c: [3.3, -1.1, 0], r: [0.4, 0.2, 0.18]}}
  wings-up:
    turn: -62
    scale: 0.62
    foot: [64, 80]
    sink: 0.1
    params: {wl: 62, wr: 62, sl: 3.0, sr: 3.0}
