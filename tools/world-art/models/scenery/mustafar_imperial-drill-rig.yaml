# Imperial drill rig (art:mustafar:imperial-drill-rig), hit box 5x4, drawn 5x7.
# The Empire's machine drilling into the volcano (the Mustafar Peak story): a heavy angular platform on
# four track pads, a tapering derrick over the bore, the drill stem running down into it, a control
# cab to the west and fuel tanks to the east. Two drawings swapped by the map script: working, and
# toppled (the derrick down across the deck, the cab smashed, smoke rising) after Vader is beaten.
# Axes: x east, y north, z up, origin on the ground at the hit box's south edge, middle.
name: mustafar_imperial-drill-rig
art: art:mustafar:imperial-drill-rig
palette: greybox
kits: [kits/sullust-mustafar.yaml]
cells: [5, 7]
foot: [40, 112]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  mid:   {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  light: {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  rock:  {ramp: dark,  bands: [0.15, 0.45, 0.78]}
  smoke: {ramp: light, bands: [0.2, 0.55, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [76, 60]
params:
  dy: 1.95          # the derrick's place on the deck
  deck: 0.95        # deck height
parts:
  # the platform: an Imperial wedge deck on four dark track pads
  - {name: pad-sw, mat: dark, box: {c: [-1.8, 0.75, 0.25], half: [0.5, 0.42, 0.25], radius: 0.04}}
  - {name: pad-se, mat: dark, box: {c: [1.8, 0.75, 0.25], half: [0.5, 0.42, 0.25], radius: 0.04}}
  - {name: pad-nw, mat: dark, box: {c: [-1.8, 3.2, 0.25], half: [0.5, 0.42, 0.25], radius: 0.04}}
  - {name: pad-ne, mat: dark, box: {c: [1.8, 3.2, 0.25], half: [0.5, 0.42, 0.25], radius: 0.04}}
  - {name: deck, mat: mid, prism: {poly: [[-2.2, 0.55], [2.2, 0.55], [2.35, 1.0], [2.35, 3.35], [-2.35, 3.35], [-2.35, 1.0]], z: [0.35, "=deck"], top: 0.97, round: 0.04}}
  - {name: deck-trim, mat: light, box: {c: [0, 0.6, "=deck - 0.12"], half: [2.15, 0.08, 0.1], radius: 0.02}}
  - {name: bore, mat: dark, box: {c: [0, 0.55, 0.55], half: [0.45, 0.08, 0.2], radius: 0.02}}
  # the derrick over the bore
  - {use: derrick, name: derrick, at: [0, "=dy", "=deck"], with: {h: 3.1, w: 0.62, wt: 0.36}}
  # the control cab to the west: a sloped Imperial block with a dark window band
  - {name: cab, mat: mid, prism: {poly: [[-2.2, 1.6], [-1.15, 1.6], [-1.15, 3.1], [-2.2, 3.1]], z: ["=deck", "=deck + 1.05"], top: [0.8, 0.85], lean: [0.05, 0.1], round: 0.04}}
  - {name: cab-window, mat: dark, box: {c: [-1.67, 1.66, "=deck + 0.72"], half: [0.4, 0.06, 0.12], radius: 0.02}}
  # fuel tanks to the east
  - {name: tank-1, mat: light, cylinder: {a: [1.15, 1.45, "=deck + 0.32"], b: [2.2, 1.45, "=deck + 0.32"], r1: 0.32}}
  - {name: tank-2, mat: light, cylinder: {a: [1.15, 2.25, "=deck + 0.32"], b: [2.2, 2.25, "=deck + 0.32"], r1: 0.32}}
  - {name: tank-band, mat: dark, box: {c: [1.68, 1.85, "=deck + 0.32"], half: [0.06, 0.75, 0.34]}}
  # the toppled drawing: the derrick down across the deck, smoke over the wreck (dropped when working)
  - {use: derrick, name: fallen, at: [-1.55, 2.0, 1.75], rot: [-78, -8, 0], with: {h: 3.25, w: 0.62, wt: 0.36}}
  - {name: smoke-1, mat: smoke, ellipsoid: {c: [-1.3, 2.7, 2.15], r: [0.55, 0.3, 0.38]}}
  - {name: smoke-2, mat: smoke, ellipsoid: {c: [-0.85, 2.85, 2.55], r: [0.45, 0.28, 0.36]}}
  - {name: smoke-3, mat: smoke, ellipsoid: {c: [-1.35, 2.95, 2.85], r: [0.42, 0.25, 0.34]}}
  - {name: smoke-4, mat: smoke, ellipsoid: {c: [-1.0, 3.05, 3.25], r: [0.36, 0.22, 0.3]}}
ground:
  # spoil from the bore, heaped in front of the deck
  - {name: spoil-w, mat: rock, hull: {points: [[-1.2, 0.12, 0], [-0.3, 0.1, 0], [-0.2, 0.55, 0], [-1.25, 0.55, 0], [-0.75, 0.35, 0.22]], round: 0.03}}
  - {name: spoil-e, mat: rock, hull: {points: [[0.35, 0.1, 0], [1.1, 0.14, 0], [1.15, 0.55, 0], [0.3, 0.55, 0], [0.7, 0.3, 0.18]], round: 0.03}}
variants:
  # drilling: the derrick standing
  working:
    drop: ["fallen/*", "smoke-*"]
  # after Vader is beaten: the derrick down across the deck to the east, the cab caved in, smoke
  toppled:
    drop: ["derrick/*", "cab-window"]
