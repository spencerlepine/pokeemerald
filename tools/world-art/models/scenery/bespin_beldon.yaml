# Beldon (art:bespin:beldon), hit box 9x4, drawn 9x5.
# Reference: the beldon of Bespin (Star Wars Galactic Atlas, Wookieepedia): a huge lumpy gasbag like
# a jellyfish, a small face low on its front, a long mass of thin tentacles streaming out behind.
# Drifting east through the cloud sea below the platforms, its belly in the cloud tops. At this size
# it is a far-off giant, so it is shown partly off the map. Animated in game: it rises and sinks a pixel.
# Axes: x east (its front), y north, z up, origin on the cloud deck at the hit box's centre.
name: bespin_beldon
art: art:bespin:beldon
palette: greybox
cells: [9, 5]
foot: [72, 50]
footprint: 4
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  bag:   {ramp: mid,   bands: [0.2, 0.5, 0.82]}
  lump:  {ramp: light, bands: [0.25, 0.55, 0.88]}
  arm:   {ramp: mid,   bands: [0.3, 0.6, 0.9]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  cloud: {ramp: bone,  bands: [0.05, 0.3, 0.7]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 4}
box: [144, 64]
params: {bx: 1.5, bz: 0.15}
templates:
  # one tentacle streaming west behind it, gently waving
  tentacle:
    params: {l: 1.25, w: 0.18, droop: 84, wave: 14}
    parts:
      - name: t
        mat: arm
        limb:
          root: [0, 0, 0]
          yaw: 180
          segments:
            - {len: "=l", w: "=w", d: "=w", bend: "=droop"}
            - {len: "=l", w: "=w * 0.9", d: "=w * 0.9", bend: "=wave"}
            - {len: "=l", w: "=w * 0.8", d: "=w * 0.8", bend: "=-wave * 1.6"}
            - {len: "=l * 0.8", w: "=w * 0.7", d: "=w * 0.7", bend: "=wave * 1.4", taper: 0.4}
parts:
  # the gasbag: one big body and a few lumps on it
  - {name: bag, mat: bag, ellipsoid: {c: ["=bx", 0, "=bz + 0.9"], r: [2.3, 1.35, 1.5]}}
  - {name: lump-1, mat: lump, ellipsoid: {c: ["=bx - 0.7", -0.35, "=bz + 2.0"], r: [1.1, 0.8, 0.6]}}
  - {name: lump-2, mat: lump, ellipsoid: {c: ["=bx + 0.9", -0.5, "=bz + 1.75"], r: [0.9, 0.7, 0.55]}}
  - {name: lump-3, mat: bag, ellipsoid: {c: ["=bx - 1.6", -0.6, "=bz + 1.0"], r: [0.8, 0.7, 0.75]}}
  - {name: lump-4, mat: bag, ellipsoid: {c: ["=bx + 1.8", -0.55, "=bz + 0.7"], r: [0.75, 0.7, 0.7]}}
  # the face, low on the front
  - {name: eye-1, mat: dark, ellipsoid: {c: ["=bx + 1.55", -1.2, "=bz + 0.85"], r: [0.12, 0.1, 0.14]}}
  - {name: eye-2, mat: dark, ellipsoid: {c: ["=bx + 2.05", -1.0, "=bz + 0.9"], r: [0.12, 0.1, 0.14]}}
  - {name: mouth, mat: dark, box: {c: ["=bx + 1.85", -1.2, "=bz + 0.45"], half: [0.2, 0.06, 0.04], radius: 0.02}, rot: [0, 30, 0]}
  # the tentacles, from under its back, streaming west
  - {use: tentacle, name: ten-1, at: ["=bx - 1.6", -0.9, "=bz + 0.3"], with: {wave: 14}}
  - {use: tentacle, name: ten-2, at: ["=bx - 1.8", -0.3, "=bz + 0.5"], with: {wave: -12, droop: 80}}
  - {use: tentacle, name: ten-3, at: ["=bx - 1.7", 0.4, "=bz + 0.6"], with: {wave: 16, droop: 76}}
  - {use: tentacle, name: ten-4, at: ["=bx - 1.4", 0.9, "=bz + 0.4"], with: {wave: -10, droop: 82}}
  - {use: tentacle, name: ten-5, at: ["=bx - 1.2", -0.55, "=bz + 0.1"], with: {wave: -16, droop: 88, l: 1.1}}
  - {use: tentacle, name: ten-6, at: ["=bx - 1.0", 0.2, "=bz + 0.05"], with: {wave: 12, droop: 90, l: 1.2}}
ground:
  # cloud tops round its belly
  - {name: cloud-1, mat: cloud, ellipsoid: {c: [0.4, -1.3, 0.1], r: [1.4, 0.4, 0.4]}}
  - {name: cloud-2, mat: cloud, ellipsoid: {c: [3.4, -1.0, 0.1], r: [0.8, 0.45, 0.4]}}
  - {name: cloud-3, mat: cloud, ellipsoid: {c: [-2.6, -1.0, 0.05], r: [1.2, 0.4, 0.35]}}
