# Headless Jedi statue (art:jedha:headless-guardian), hit box 3x3, drawn 3x6.
# Reference: the Guardian statues of the Holy City (Rogue One, Jedi: Survivor): a tall robed Jedi in
# sandstone, hands clasped on the hilt of a lightsaber held point down in front of it. Its head broke
# off at the neck (the head is art:jedha:toppled-statue); a jagged stump and the cowl, thrown back
# on the shoulders, are what is left. Axes: x east, y north, z up, origin on the ground at the plinth's centre.
name: jedha_headless-guardian
art: art:jedha:headless-guardian
palette: greybox
kits: [kits/deathstar-arena-jedha.yaml]
cells: [3, 6]
foot: [24, 81]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: mid,   bands: [0.25, 0.55, 0.85]}
  trim:  {ramp: light, bands: [0.2, 0.55, 0.85]}
  robe:  {ramp: mid,   bands: [0.2, 0.5, 0.82]}
  fold:  {ramp: light, bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  rubble: {ramp: bone, bands: [0.35, 0.65, 0.93]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [48, 48]
params:
  pz: 0.55        # the plinth's top
  rz: 4.35        # the shoulders' height
parts:
  - {use: plinth, name: plinth, at: [0, 0, 0], with: {w: 2.8, d: 1.5, h: "=pz"}}
  # the robe: a trapezoid from the hem to the shoulders, wider at the hem
  - name: robe
    mat: robe
    prism: {poly: [[-0.95, -0.45], [0.95, -0.45], [0.95, 0.45], [-0.95, 0.45]], z: ["=pz", "=rz"], top: [0.68, 0.8], round: 0.06}
  - {name: shoulders, mat: robe, ellipsoid: {c: [0, 0.02, "=rz"], r: [0.82, 0.42, 0.2]}}
  # the cowl thrown back on the shoulders, and the neck stump with its broken top
  - {name: cowl, mat: fold, ellipsoid: {c: [0, 0.2, "=rz + 0.05"], r: [0.5, 0.28, 0.24]}}
  - {name: stump, mat: robe, cylinder: {a: [0, 0, "=rz"], b: [0, 0, "=rz + 0.32"], r1: 0.24, r2: 0.2}}
  - {name: break, mat: dark, hull: {points: [[-0.2, -0.12, "=rz + 0.3"], [0.2, -0.12, "=rz + 0.33"], [-0.18, 0.12, "=rz + 0.36"], [0.18, 0.12, "=rz + 0.31"], [0.0, 0.0, "=rz + 0.4"]], round: 0.01}}
  # the arms: long sleeves from the shoulders meeting in front, the hands on the hilt, the blade point down
  - {name: sleeve-l, mat: fold, hull: {points: [[-0.82, -0.42, "=rz - 0.05"], [-0.45, -0.45, "=rz - 0.05"], [-0.82, -0.1, "=rz - 0.05"], [-0.88, -0.45, "=rz - 1.0"], [-0.88, -0.1, "=rz - 1.0"], [-0.2, -0.66, 2.8], [-0.2, -0.66, 2.25], [-0.2, -0.3, 2.8], [-0.65, -0.58, 2.2], [-0.65, -0.25, 2.2]], round: 0.06}}
  - {name: sleeve-r, mat: fold, hull: {points: [[0.82, -0.42, "=rz - 0.05"], [0.45, -0.45, "=rz - 0.05"], [0.82, -0.1, "=rz - 0.05"], [0.88, -0.45, "=rz - 1.0"], [0.88, -0.1, "=rz - 1.0"], [0.2, -0.66, 2.8], [0.2, -0.66, 2.25], [0.2, -0.3, 2.8], [0.65, -0.58, 2.2], [0.65, -0.25, 2.2]], round: 0.06}}
  - {name: hands, mat: trim, box: {c: [0, -0.66, 2.5], half: [0.24, 0.14, 0.2], radius: 0.06}}
  - {name: hilt, mat: dark, box: {c: [0, -0.7, 2.18], half: [0.08, 0.06, 0.14], radius: 0.02}}
  - {name: guard, mat: dark, box: {c: [0, -0.7, 2.02], half: [0.2, 0.06, 0.04], radius: 0.01}}
  - {name: blade, mat: trim, box: {c: [0, -0.68, 1.27], half: [0.08, 0.05, 0.72], radius: 0.02}}
ground:
  - {name: rubble-1, mat: rubble, hull: {points: [[-1.45, -0.85, 0], [-1.1, -0.88, 0], [-1.12, -0.62, 0], [-1.4, -0.64, 0], [-1.25, -0.75, 0.18]], round: 0.03}}
  - {name: rubble-2, mat: rubble, hull: {points: [[1.05, -0.86, 0], [1.33, -0.84, 0], [1.3, -0.66, 0], [1.08, -0.68, 0], [1.18, -0.76, 0.14]], round: 0.03}}
