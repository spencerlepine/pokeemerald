# Sandcrawler at the map edge (art:tatooine:sandcrawler-far), hit box 12x3, drawn 12x7: the top 4 rows
# stand over the cells behind. Partly off the map on purpose.
# Reference: the Jawa sandcrawler (A New Hope), at true scale. Only its tread units and the lower hull
# show: the hull's south face rises off the top of the sprite and its stern runs off the west edge; the
# sloped lower nose comes down at the east end over the front treads. Kit: crawler-hull, crawler-tread.
# Modelled nose east (+x); `mirror` gives the west-facing one.
# Axes: x east, y north, z up; origin on the ground at the south edge of the hit box, centred.
name: tatooine_sandcrawler-far
art: art:tatooine:sandcrawler-far
palette: greybox
kits: [kits/tatooine-rest.yaml]
cells: [12, 7]
foot: [96, 111]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,  bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark, bands: [0.3, 0.6, 0.9]}
  deck:  {ramp: mid,  bands: [0.3, 0.6, 0.9]}
  tread: {ramp: dark, bands: [0.15, 0.45, 0.8]}
  wheel: {ramp: mid,  bands: [0.2, 0.5, 0.85]}
  sand:  {ramp: bone, bands: [0.55, 0.8, 0.97]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [190, 46]
params:
  cy: 3.4         # the hull's centre line (m north): its south face stands at the back of the hit box
parts:
  - {use: crawler-hull, name: hull, at: [-5.4, "=cy", 0], with: {L: 21.0, W: 3.6, H: 9.0, z0: 1.55, hull: hull, dark: dark, deck: deck}}
  # the hull's lower band of plates and the dark gap above the treads
  - {name: skirt, mat: dark, box: {c: [-2.5, "=cy - 1.82", 1.75], half: [6.2, 0.05, 0.16]}}
  - {name: plate-1, mat: dark, box: {c: [-3.0, "=cy - 1.83", 3.6], half: [0.05, 0.04, 1.6]}}
  - {name: plate-2, mat: dark, box: {c: [0.5, "=cy - 1.83", 3.6], half: [0.05, 0.04, 1.6]}}
  - {name: hatch, mat: dark, box: {c: [-1.2, "=cy - 1.84", 2.5], half: [0.5, 0.04, 0.55]}}
  # the tread units on the south side, each on a pylon up into the hull
  - {use: crawler-tread, name: tread-1, at: [3.0, 1.15, 0], with: {l: 2.4, w: 1.0, h: 1.45, mat: tread, wheel: wheel}}
  - {use: crawler-tread, name: tread-2, at: [-0.5, 1.15, 0], with: {l: 2.4, w: 1.0, h: 1.45, mat: tread, wheel: wheel}}
  - {use: crawler-tread, name: tread-3, at: [-4.0, 1.15, 0], with: {l: 2.4, w: 1.0, h: 1.45, mat: tread, wheel: wheel}}
  - {name: pylon-1, mat: hull, box: {c: [3.0, 1.5, 1.6], half: [0.4, 0.35, 0.25]}}
  - {name: pylon-2, mat: hull, box: {c: [-0.5, 1.5, 1.6], half: [0.4, 0.35, 0.25]}}
  - {name: pylon-3, mat: hull, box: {c: [-4.0, 1.5, 1.6], half: [0.4, 0.35, 0.25]}}
ground:
  # sand thrown up by the treads
  - {name: churn-1, mat: sand, ellipsoid: {c: [4.6, 0.55, 0], r: [0.75, 0.3, 0.18]}}
  - {name: churn-2, mat: sand, ellipsoid: {c: [1.2, 0.5, 0], r: [0.6, 0.25, 0.14]}}
variants:
  crawling: {}
  # stopped: the Jawas' ramp lowered at the front, a dark doorway in the nose
  ramp-down:
    parts:
      - {use: crawler-hull, name: hull, at: [-5.4, "=cy", 0], with: {L: 21.0, W: 3.6, H: 9.0, z0: 1.55, hull: hull, dark: dark, deck: deck}}
      - {name: skirt, mat: dark, box: {c: [-2.5, "=cy - 1.82", 1.75], half: [6.2, 0.05, 0.16]}}
      - {name: plate-1, mat: dark, box: {c: [-3.0, "=cy - 1.83", 3.6], half: [0.05, 0.04, 1.6]}}
      - {name: plate-2, mat: dark, box: {c: [0.5, "=cy - 1.83", 3.6], half: [0.05, 0.04, 1.6]}}
      - {use: crawler-tread, name: tread-1, at: [3.0, 1.15, 0], with: {l: 2.4, w: 1.0, h: 1.45, mat: tread, wheel: wheel}}
      - {use: crawler-tread, name: tread-2, at: [-0.5, 1.15, 0], with: {l: 2.4, w: 1.0, h: 1.45, mat: tread, wheel: wheel}}
      - {use: crawler-tread, name: tread-3, at: [-4.0, 1.15, 0], with: {l: 2.4, w: 1.0, h: 1.45, mat: tread, wheel: wheel}}
      - {name: pylon-1, mat: hull, box: {c: [3.0, 1.5, 1.6], half: [0.4, 0.35, 0.25]}}
      - {name: pylon-2, mat: hull, box: {c: [-0.5, 1.5, 1.6], half: [0.4, 0.35, 0.25]}}
      - {name: pylon-3, mat: hull, box: {c: [-4.0, 1.5, 1.6], half: [0.4, 0.35, 0.25]}}
      - {name: doorway, mat: dark, box: {c: [4.4, "=cy - 0.2", 3.2], half: [0.35, 1.2, 1.1]}}
      - {name: ramp, mat: deck, hull: {round: 0.04, points: [[4.3, "=cy - 1.3", 2.1], [4.3, "=cy + 0.9", 2.1], [4.45, "=cy - 1.3", 2.25], [4.45, "=cy + 0.9", 2.25],
                                                            [5.9, "=cy - 1.3", 0.0], [5.9, "=cy + 0.9", 0.0], [5.9, "=cy - 1.3", 0.12], [5.9, "=cy + 0.9", 0.12]]}}
