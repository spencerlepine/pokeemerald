# Fallen wroshyr trunk (art:kashyyyk:fallen-wroshyr), hit box 9x2, drawn 9x4.
# Reference: Kashyyyk's wroshyr trees (Revenge of the Sith; Jedi: Fallen Order), the fallen giants used
# as bridges. A trunk wide enough to walk on, lying east-west, snapped in the middle: both halves sag
# into the break, pale splinters stand up from the torn ends, a stub of a limb and a stump of root
# show along it. Axes: x east, y north, z up, origin on the ground at the south middle of the hit box.
name: kashyyyk_fallen-wroshyr
art: art:kashyyyk:fallen-wroshyr
palette: greybox
kits: [kits/kashyyyk-felucia-small.yaml]
cells: [9, 4]
foot: [72, 62]
footprint: 2
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  bark:  {ramp: mid,  bands: [0.3, 0.62, 0.92]}
  ridge: {ramp: mid,  bands: [0.15, 0.45, 0.75]}
  wood:  {ramp: bone, bands: [0.2, 0.5, 0.82]}
  dark:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 2}
box: [144, 32]
params:
  r: 0.78           # trunk radius
  ly: 1.0           # its line, north of the hit box's south edge
  gap: 0.45         # half the break
  sag: 6            # how far each half dips into the break (deg)
templates:
  # the splinters of a torn end: pale shards standing up and out of the wood, at the end's centre
  splinters:
    parts:
      - {name: s1, mat: wood, hull: {points: [[-0.75, -0.6, 0.9], [0.0, -0.6, 0.9], [-0.75, -0.2, 0.9], [0.0, -0.2, 0.9], [-0.1, -0.42, 2.3]], round: 0.03}}
      - {name: s2, mat: wood, hull: {points: [[-0.6, -0.15, 1.2], [0.0, -0.15, 1.2], [-0.6, 0.3, 1.2], [0.0, 0.3, 1.2], [-0.05, 0.05, 2.75]], round: 0.03}}
      - {name: s3, mat: wood, hull: {points: [[-0.5, 0.3, 1.0], [0.0, 0.3, 1.0], [-0.5, 0.65, 1.0], [0.0, 0.65, 1.0], [-0.15, 0.5, 2.2]], round: 0.03}}
      - {name: torn, mat: wood, cylinder: {a: [-0.12, 0, "=r"], b: [0.0, 0, "=r"], r1: "=r*0.85"}}
parts:
  # the west half, its root end to the west; it dips toward the break
  - {use: log, name: west, at: [-4.35, "=ly", 0], rot: ["=-sag", 0, 0], with: {len: "=4.35-gap", r: "=r"}}
  - {use: splinters, name: west-end, at: ["=-gap", "=ly", -0.25]}
  # the east half, the crown end to the east (off the map), turned to face it
  - {use: log, name: east, at: [4.35, "=ly", 0], turn: 180, rot: ["=-sag", 0, 0], with: {len: "=4.35-gap", r: "=r"}}
  - {use: splinters, name: east-end, at: ["=gap", "=ly", -0.25], turn: 180}
  # a broken limb stub on the east half, a root stump on the west end
  - {name: limb, mat: bark, cylinder: {a: [2.5, "=ly+0.2", "=r*1.5"], b: [2.9, "=ly+0.45", "=r*2.3"], r1: 0.34, r2: 0.26}}
  - {name: limb-end, mat: wood, cylinder: {a: [2.89, "=ly+0.45", "=r*2.29"], b: [2.92, "=ly+0.46", "=r*2.36"], r1: 0.25}}
  # dark bark grooves along the south face
  - {name: groove-w1, mat: dark, box: {c: [-2.4, "=ly-r*0.86", "=r*0.95"], half: [1.6, 0.06, 0.035]}, rot: ["=-sag", 0, 0]}
  - {name: groove-w2, mat: dark, box: {c: [-3.0, "=ly-r*0.7", "=r*0.45"], half: [1.0, 0.06, 0.035]}, rot: ["=-sag", 0, 0]}
  - {name: groove-e1, mat: dark, box: {c: [2.0, "=ly-r*0.86", "=r*1.05"], half: [1.3, 0.06, 0.035]}, rot: ["=sag", 0, 0]}
  - {name: groove-e2, mat: dark, box: {c: [3.0, "=ly-r*0.7", "=r*0.5"], half: [0.9, 0.06, 0.035]}, rot: ["=sag", 0, 0]}
  - {name: root-1, mat: bark, hull: {points: [[-4.35, "=ly-0.6", 0], [-4.0, "=ly-0.6", 0], [-4.35, "=ly-0.6", 1.3], [-4.35, "=ly-1.0", 0], [-4.2, "=ly-0.95", 0.1]], round: 0.05}}
  - {name: root-2, mat: bark, hull: {points: [[-4.35, "=ly+0.5", 0], [-4.0, "=ly+0.5", 0], [-4.35, "=ly+0.4", 1.5], [-4.35, "=ly+0.9", 0]], round: 0.05}}
ground:
  # the dark of the drop under the break
  - {name: drop, mat: dark, cylinder: {a: [0, "=ly", 0], b: [0, "=ly", 0.01], r1: 0.75}, squash: [0.8, 1.0, 1]}
variants:
  # snapped in the middle: the broken bridge
  snapped: {}
  # still whole, sagging: a bridge that holds
  whole:
    params: {gap: -0.05, sag: 2}
    drop: ["west-end/*", "east-end/*"]
    ground: []
