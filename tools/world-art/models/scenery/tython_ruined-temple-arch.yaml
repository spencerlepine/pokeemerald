# Ruined temple arch (art:tython:ruined-temple-arch), hit box 6x3, drawn 6x5, faces south.
# Reference: the ancient Jedi temple ruins of Tython (The Clone Wars concept, The Old Republic): plain
# heavy stonework, square pillars with stepped capitals, round arches of big voussoirs. Two pillars
# on stepped plinths carry a round arch; the arch has broken at its east haunch, so only the west half
# stands, and the fallen voussoirs lie in the grass. Axes: x east, y north, z up, origin on the ground
# at the south middle of the hit box. The arch's blocks run round it (ring axis y).
name: tython_ruined-temple-arch
art: art:tython:ruined-temple-arch
palette: greybox
cells: [6, 5]
foot: [48, 78]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  stone: {ramp: bone, bands: [0.25, 0.55, 0.85]}
  worn:  {ramp: mid,  bands: [0.25, 0.55, 0.85]}
  dark:  {ramp: dark, bands: [0.2, 0.5, 0.85]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [96, 48]
params:
  ay: 1.45          # the arch's line
  px: 1.75          # pillars out from the middle
  ph: 1.75          # pillar height (the arch springs from here)
  R: 1.4            # the arch's radius to the block centres
templates:
  # a square pillar on a stepped plinth with a stepped capital
  pillar:
    params: {h: 1.75}
    parts:
      - {name: plinth, mat: worn, box: {c: [0, 0, 0.14], half: [0.5, 0.5, 0.14], radius: 0.02}}
      - {name: shaft, mat: stone, box: {c: [0, 0, "=h/2"], half: [0.34, 0.34, "=h/2"], radius: 0.03}}
      - {name: capital, mat: worn, box: {c: [0, 0, "=h-0.08"], half: [0.44, 0.44, 0.1], radius: 0.02}}
parts:
  - {use: pillar, name: pillar-w, at: ["=-px", "=ay", 0], with: {h: "=ph"}}
  - {use: pillar, name: pillar-e, at: ["=px", "=ay", 0], with: {h: "=ph*0.82"}}
  # the arch: the west half still standing up to the crown
  - name: arch
    mat: stone
    ring: {c: [0, "=ay", "=ph"], axis: y, r: "=R+0.3", n: 6, arc: [180, 262], size: [0.68, 0.55, 0.62], round: 0.03}
  - {name: crown, mat: worn, box: {c: [-0.05, "=ay", "=ph+R+0.32"], half: [0.32, 0.31, 0.3], radius: 0.03}, rot: [-6, 0, 0]}
  # the east springer still on its pillar, broken off
  - {name: springer-e, mat: stone, hull: {points: [["=px-0.4", "=ay-0.3", "=ph*0.82"], ["=px+0.4", "=ay-0.3", "=ph*0.82"], ["=px-0.4", "=ay+0.3", "=ph*0.82"], ["=px+0.4", "=ay+0.3", "=ph*0.82"],
                                                  ["=px-0.05", "=ay-0.3", "=ph*0.82+0.55"], ["=px+0.35", "=ay-0.3", "=ph*0.82+0.4"], ["=px-0.05", "=ay+0.3", "=ph*0.82+0.55"], ["=px+0.35", "=ay+0.3", "=ph*0.82+0.4"]], round: 0.03}}
  # the dark of the gateway's floor slab
  - {name: sill, mat: worn, box: {c: [0, "=ay", 0.05], half: [1.3, 0.42, 0.05], radius: 0.02}}
ground:
  # fallen voussoirs in the grass east and south of the arch
  - {name: block-1, mat: stone, box: {c: [1.0, 0.55, 0.26], half: [0.36, 0.28, 0.26], radius: 0.03}, rot: [0, 0, 24]}
  - {name: block-2, mat: worn, box: {c: [2.4, 0.5, 0.22], half: [0.3, 0.26, 0.22], radius: 0.03}, rot: [0, 12, -15]}
  - {name: block-3, mat: stone, box: {c: [0.2, 0.35, 0.18], half: [0.26, 0.2, 0.18], radius: 0.03}, rot: [0, 0, 40]}
  - {name: chip, mat: worn, hull: {points: [[1.6, 0.15, 0], [1.9, 0.12, 0], [1.85, 0.35, 0], [1.7, 0.3, 0.14]], round: 0.02}}
variants:
  # the west half of the arch standing, the east fallen
  broken: {}
  # only the two pillars, the whole arch fallen
  pillars:
    drop: ["arch/*", "crown", "springer-e"]
