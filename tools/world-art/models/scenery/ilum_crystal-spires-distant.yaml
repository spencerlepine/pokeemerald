# Distant crystal spires (art:ilum:crystal-spires-distant), hit box 10x3, drawn 10x7.
# Reference: the kyber crystals of Ilum's Crystal Cave (wiki/art/concept/ilum/crystal-spires-distant__web_1.jpg,
# kyber-crystal-outcrop__web_1.jpg): long six-sided crystals with pointed tips growing in clusters.
# Here giant ones stand beyond the north cliffs: a wall of ice boulders along the hit box and a
# forest of tall spires leaning every way behind it, running off the top of the map on purpose.
# The spires are the light material (they glow faintly), the ice rocks mid. Crystal: the group kit.
# Axes: x east, y north, z up, origin on the ground at the middle of the hit box's south edge.
