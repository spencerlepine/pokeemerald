# Assault tank wreck (art:jedha:assault-tank-wreck), hit box 4x3, drawn 4x4, facing e (w mirrored).
# Reference: the TX-225 GAVw "Occupier" combat assault tank (Rogue One): a long, low armoured hull on
# two broad tread units, a flat cargo bed in front (where the kyber crates rode), the crew cab raised
# at the back with a slit windscreen, a twin blaster on the cab's front. Saw's partisans ambushed it in
# the street: it sits slewed across the road, nose down where the front of a tread blew off, a scorched
# the kyber crates still in the bed. Modelled at full size (7.3 m), then scaled to the cells.
# Tank axes: x forward (east), y to its left (north), z up, origin on the ground under its middle.
name: jedha_assault-tank-wreck
art: art:jedha:assault-tank-wreck
palette: greybox
cells: [4, 4]
foot: [31, 41]
footprint: 3
render:
  light: [-0.55, -0.3, 0.78]
  outline: false
  inner_lines: none
  ao: {strength: 0.0, threshold: 0.3}
  margin: 0
  cleanup: true
materials:
  hull:  {ramp: mid,   bands: [0.3, 0.6, 0.88]}
  plate: {ramp: light, bands: [0.15, 0.5, 0.82]}
  dark:  {ramp: dark,  bands: [0.2, 0.5, 0.85]}
  tread: {ramp: dark,  bands: [0.15, 0.45, 0.8]}
  bedm:  {ramp: dark,  bands: [0.0, 0.3, 0.6]}
  crate: {ramp: bone,  bands: [0.15, 0.45, 0.8]}
drop_shadow:
  - {dx: 1, dy: 1, color: shade, below: 3}
box: [64, 48]
scale: 0.5
turn: -10
tilt: [-6, 0]
pivot: [0, 0]
templates:
  # a tread unit: a long box with its ends sloped up, the running gear dark
  tread-unit:
    params: {len: 6.6}
    parts:
      - name: track
        mat: tread
        extrude: {axis: y, span: [-0.5, 0.5], end: 1.0, profile: [["=-len/2", 0.35], ["=-len/2 + 0.45", 0], ["=len/2 - 0.45", 0], ["=len/2", 0.35], ["=len/2 - 0.3", 0.8], ["=-len/2 + 0.3", 0.8]], round: 0.05}
      - {name: skirt, mat: tread, box: {c: [0, "=-0.06", 0.62], half: ["=len/2 - 0.35", 0.48, 0.24], radius: 0.04}}
parts:
  - {use: tread-unit, name: tread-l, at: [0, 1.45, 0]}
  - {use: tread-unit, name: tread-r, at: [0, -1.45, 0]}
  # the hull between the treads, its nose a long wedge
  - name: hull
    mat: hull
    extrude: {axis: y, span: [-1.5, 1.5], end: 1.0, profile: [[-3.4, 0.4], [3.0, 0.4], [3.7, 0.7], [3.2, 1.05], [-3.4, 1.05]], round: 0.05}
  # the cargo bed: low walls round a flat floor
  - {name: bed, mat: bedm, box: {c: [0.9, 0, 1.08], half: [1.9, 1.35, 0.05], radius: 0.02}}
  - {name: bed-wall-s, mat: hull, box: {c: [0.9, -1.38, 1.22], half: [1.9, 0.08, 0.17], radius: 0.03}}
  - {name: bed-wall-n, mat: hull, box: {c: [0.9, 1.38, 1.22], half: [1.9, 0.08, 0.17], radius: 0.03}}
  # kyber crates still strapped in the bed
  - {name: crate-1, mat: crate, box: {c: [2.15, 0.6, 1.35], half: [0.45, 0.4, 0.3], radius: 0.04}}
  - {name: crate-2, mat: crate, box: {c: [0.2, 0.55, 1.35], half: [0.45, 0.45, 0.3], radius: 0.04}}
  - {name: crate-3, mat: crate, box: {c: [0.25, -0.65, 1.3], half: [0.4, 0.38, 0.25], radius: 0.04}}
  # the crew cab at the back: a raised block with a sloped front and a slit windscreen
  - name: cab
    mat: plate
    extrude: {axis: y, span: [-1.3, 1.3], end: 1.0, profile: [[-3.3, 1.0], [-0.9, 1.0], [-0.9, 1.4], [-1.4, 1.95], [-3.2, 1.95], [-3.4, 1.65]], round: 0.05}
  - {name: windscreen, mat: dark, box: {c: [-1.12, 0, 1.68], half: [0.1, 1.05, 0.09], radius: 0.01}, rot: [0, 0, 0]}
  - {name: hatch, mat: hull, cylinder: {a: [-2.4, 0.3, 1.9], b: [-2.4, 0.3, 2.1], r1: 0.38}}
  # the twin blaster on the cab's front corner
  - {name: gun-mount, mat: dark, box: {c: [-1.35, -1.1, 2.0], half: [0.35, 0.3, 0.16], radius: 0.03}}
  - {name: gun-1, mat: dark, cylinder: {a: [-1.1, -0.95, 2.0], b: [0.6, -0.95, 2.0], r1: 0.1}}
  - {name: gun-2, mat: dark, cylinder: {a: [-1.1, -1.25, 2.0], b: [0.6, -1.25, 2.0], r1: 0.1}}
ground:
  # a torn-off piece of tread in the street
  - {name: tread-bit, mat: tread, box: {c: [-1.25, -1.1, 0.1], half: [0.4, 0.13, 0.1], radius: 0.03}, rot: [0, -15, 0]}
variants:
  # slewed across the street, nose dipped
  ambushed: {}
  # the cab blown off, lying behind it in the street
  cab-blown:
    drop: ["cab", "windscreen", "hatch", "gun-*"]
    ground:
      - name: cab-lost
        mat: plate
        hull: {points: [[-1.85, -1.25, 0], [-1.05, -1.3, 0], [-1.1, -0.9, 0], [-1.8, -0.85, 0], [-1.75, -1.2, 0.36], [-1.15, -1.2, 0.34]], round: 0.04}
      - {name: cab-slit, mat: dark, box: {c: [-1.45, -1.3, 0.18], half: [0.3, 0.03, 0.05]}}
