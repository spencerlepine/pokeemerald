# art:endor:imperial-bunker. The shield generator bunker: a low durasteel box set into the forest,
# flat roof with a raised rim, a wide blast door on the south face, a grey-green camouflage tone,
# a sensor dish on the roof. 6 cells wide; the bottom 2 rows are solid, the roof rows walk-behind.
# This is also the test of the building vocabulary: box walls, a door recess, a flat roof deck.
name: imperial-bunker
description: "Imperial bunker: low durasteel box, blast door, flat rimmed roof, sensor dish."
palette: endor
cells: [6, 5]
foot: [48, 78]
box: [92, 30]
footprint: 2
shadow: {rx: 46, ry: 3}
seed: 11
render: {depth_jump: 0.15, ao: {strength: 0.5, threshold: 0.45}}

materials:
  wall:  {ramp: durasteel, bands: [0.1, 0.6], texture: panels}
  roof:  {ramp: durasteel, bands: [0.1, 0.6], texture: panels}
  door:  {ramp: rust, bands: [0.1, 0.6]}
  dark:  {ramp: log_wood, bands: [0.5, 0.9]}
  light: {color: window, emissive: true}

groups:
  body: {k: 0.0}
  gear: {k: 0.0}

parts:
  # the main box: 6 x 3 m in plan, 1.5 m tall; the foot is its south face at ground level
  - {name: box, group: body, mat: wall, box: {c: [0.0, 1.5, 0.75], half: [2.95, 1.5, 0.75], radius: 0.04},
     regions: [{where: "z > 1.46", mat: roof}]}
  # roof rim: a thin raised frame around the deck
  - {name: rim, group: body, mat: wall, box: {c: [0.0, 1.5, 1.6], half: [2.95, 1.5, 0.12]}}
  - {name: deck, group: body, mat: roof, op: subtract, box: {c: [0.0, 1.5, 1.62], half: [2.75, 1.3, 0.12]}}
  # blast door: a recess in the south face with a rust-red door inside, a dark seam down the middle
  - {name: door-cut, group: body, mat: dark, op: subtract, box: {c: [0.0, -0.05, 0.62], half: [0.75, 0.25, 0.62]}}
  - {name: door, group: gear, mat: door, box: {c: [0.0, 0.12, 0.6], half: [0.72, 0.06, 0.58]}}
  - {name: seam, group: gear, mat: dark, box: {c: [0.0, 0.05, 0.6], half: [0.02, 0.03, 0.55]}}
  # control panel light beside the door
  - {name: panel, group: gear, mat: light, box: {c: [1.1, -0.02, 0.95], half: [0.08, 0.03, 0.06]}}
  # sensor dish on a post at the roof's north-west
  - {name: post, group: gear, mat: wall, cylinder: {a: [-2.0, 2.4, 1.5], b: [-2.0, 2.4, 2.1], r1: 0.05, r2: 0.05}}
  - {name: dish, group: gear, mat: wall, ellipsoid: {c: [-2.0, 2.4, 2.2], r: [0.42, 0.42, 0.1]}}
