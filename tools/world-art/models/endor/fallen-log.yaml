# art:endor:fallen-log. A redwood log lying east-west across 3 cells, bark ridges along its length,
# a sawn pale end on the east, a broken root stub on the west; moss on top. Blocks movement (edge).
name: fallen-log
description: Fallen redwood log, 3 cells long; a route edge.
palette: endor
cells: [3, 1]
foot: [24, 13]
box: [46, 10]
footprint: 1
shadow: {rx: 23, ry: 2, dy: 1}
seed: 6
render: {depth_jump: 0.2, ao: {strength: 0.9, threshold: 0.4}, margin: 1}

materials:
  bark: {ramp: redwood_bark, bands: [-0.05, 0.4, 0.78], dither: true}
  cut:  {ramp: cut_wood, bands: [0.2, 0.6]}
  moss: {ramp: moss, bands: [0.3, 0.7], texture: speck}

groups:
  body: {k: 0.04}

parts:
  - {name: log, group: body, mat: bark, cone: {a: [-1.25, 0.0, 0.22], b: [1.18, 0.03, 0.22], r1: 0.23, r2: 0.2},
     rot: [0, 0, 0], noise: {amp: 0.02, freq: 6, seed: 6},
     regions: [{where: "x > 1.12", mat: cut}, {where: "(z > 0.36) & (y > -0.02) & (x < 0.9) & (x > -1.0)", mat: moss}]}
  - {name: stub, group: body, mat: bark, cone: {a: [-1.2, 0.0, 0.25], b: [-1.4, 0.1, 0.36], r1: 0.08, r2: 0.03}}
  - {name: knot, group: body, mat: bark, ellipsoid: {c: [0.3, -0.18, 0.32], r: [0.08, 0.06, 0.06]}}
