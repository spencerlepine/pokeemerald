# art:endor:redwood-trunk. A giant redwood's base: 3 cells wide, a thick fluted trunk with buttress
# roots, a bark ridge texture, and a canopy that is only a dark underside with hanging needle
# masses (the tree is far taller than the screen, so the top never shows). The player walks right up
# to the roots; the crown rows are walk-behind (top layer).
name: redwood-trunk
description: Giant redwood trunk base with buttress roots; the route wall on Endor.
palette: endor
cells: [3, 4]
foot: [24, 61]
box: [40, 14]
footprint: 1
shadow: {rx: 20, ry: 3, dy: 1}
seed: 3
render: {depth_jump: 0.25, ao: {strength: 1.1, threshold: 0.33}}

materials:
  bark:   {ramp: redwood_bark, bands: [-0.05, 0.38, 0.76], dither: true, texture: ridge}
  needle: {ramp: redwood_needle, bands: [0.0, 0.42, 0.8], dither: true, texture: scallop}

groups:
  trunk: {k: 0.12}
  crown: {k: 0.05, join: 0.0}

parts:
  # the trunk: a thick tapered column, roughened
  - {name: trunk, group: trunk, mat: bark, cone: {a: [0, 0, -0.1], b: [0, 0, 3.6], r1: 0.5, r2: 0.42},
     noise: {amp: 0.035, freq: 5.0, seed: 3}}
  # buttress roots: tapered cones from the trunk down and out, front and sides
  - {name: root-sw, group: trunk, mat: bark, cone: {a: [-0.25, -0.2, 0.9], b: [-1.15, -0.5, 0.0], r1: 0.22, r2: 0.12}}
  - {name: root-se, group: trunk, mat: bark, cone: {a: [0.25, -0.2, 0.9], b: [1.15, -0.5, 0.0], r1: 0.22, r2: 0.12}}
  - {name: root-s, group: trunk, mat: bark, cone: {a: [0.0, -0.3, 0.7], b: [0.1, -0.95, 0.0], r1: 0.2, r2: 0.1}}
  - {name: root-w, group: trunk, mat: bark, cone: {a: [-0.4, 0.1, 0.6], b: [-1.25, 0.25, 0.0], r1: 0.18, r2: 0.1}}
  - {name: root-e, group: trunk, mat: bark, cone: {a: [0.4, 0.15, 0.6], b: [1.25, 0.3, 0.0], r1: 0.18, r2: 0.1}}
  # the canopy underside: flat clumps of needles hanging around the trunk at the top of the sprite
  - scatter: {count: 22, within: {c: [0, 0, 3.3], r: [1.25, 0.85, 0.3]}, shell: 0.3, size: [0.3, 0.45],
              squash: [1.0, 1.0, 0.55], seed: 5, noise: {amp: 0.03, freq: 7}}
    group: crown
    mat: needle
