# Endor (Forest Moon) object ramps. Values from wiki/bible/PALETTE.md "Planet: Endor" where a role
# exists, else drawn in the same key: deep cool forest, redwood browns, dark moss ground.
# Ramps are darkest -> lightest, 3 tones for flat things and 4 for round ones (STYLE.md 3).
# Every value is GBA-safe (multiples of 8). One object may use at most 15 colours (one bank).

outline: [24, 32, 24]            # fallback only: outlines take the material's darkest tone
shadow: [88, 128, 88, 255]       # Ground Shade #588058: the drop-shadow checker colour on Endor moss

ramps:
  # --- foliage
  redwood_needle: [[0, 56, 16], [0, 104, 56], [48, 144, 80], [80, 168, 104]]      # Canopy Dark -> Canopy -> mid -> Canopy Light
  fern_leaf:      [[0, 64, 32], [32, 120, 64], [72, 160, 88]]                      # cooler, lighter than the moss floor
  moss:           [[40, 80, 48], [72, 112, 72], [112, 152, 104]]                   # Tall Grass -> Ground
  # --- wood
  redwood_bark:   [[48, 16, 24], [96, 40, 32], [144, 72, 56], [184, 104, 80]]      # dark red-brown, lit tone near Path
  log_wood:       [[64, 32, 24], [120, 64, 48], [168, 104, 72]]
  cut_wood:       [[136, 96, 56], [184, 144, 88], [224, 184, 128]]                 # sawn end grain
  ewok_timber:    [[72, 40, 24], [128, 80, 48], [176, 120, 80], [208, 160, 112]]   # lashed poles and planks
  thatch:         [[96, 64, 24], [152, 112, 48], [200, 160, 80], [232, 200, 120]]  # woven hut roof
  hide:           [[112, 72, 48], [160, 112, 80], [200, 152, 112]]                 # stretched skins, awnings
  # --- stone and metal
  rock:           [[96, 64, 80], [152, 112, 112], [192, 152, 144]]                 # Rock Dark -> Rock
  durasteel:      [[48, 64, 80], [96, 104, 112], [168, 176, 184]]                  # Imperial grey (bunker, speeder)
  rust:           [[96, 48, 24], [152, 80, 48], [200, 128, 88]]

singles:
  fire:    [248, 176, 48]
  ember:   [232, 88, 24]
  window:  [248, 232, 160]
