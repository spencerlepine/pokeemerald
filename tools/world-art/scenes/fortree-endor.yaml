# Bright Tree Village on the REAL Fortree City layout rendered through the Endor recipe, with the
# vanilla tree houses and the gym cleared to grass and the new objects placed in their stead.
name: fortree-endor
planet: endor
layout: FortreeCity_Layout
recipe: ../tile-generator/recipes/endor.yaml
clear:
  - [8, 1, 13, 7]     # NW tree house
  - [15, 1, 20, 7]    # N tree house 2
  - [23, 1, 28, 7]    # N tree house 3
  - [30, 1, 35, 7]    # NE tree house
  - [18, 7, 26, 12]   # the gym
  - [10, 11, 15, 17]  # SW tree house
  - [34, 11, 39, 17]  # SE tree house
objects:
  - {model: models/endor/ewok-hut.yaml, at: [9, 2]}
  - {model: models/endor/ladder.yaml, at: [10, 6]}
  - {model: models/endor/ewok-hut.yaml, at: [16, 2]}
  - {model: models/endor/ladder.yaml, at: [17, 6]}
  - {model: models/endor/rope-bridge.yaml, fill: [12, 4, 16, 5]}
  - {model: models/endor/ewok-hut.yaml, at: [24, 2]}
  - {model: models/endor/ladder.yaml, at: [25, 6]}
  - {model: models/endor/ewok-hut.yaml, at: [31, 2]}
  - {model: models/endor/ladder.yaml, at: [32, 6]}
  - {model: models/endor/rope-bridge.yaml, fill: [27, 4, 31, 5]}
  - {model: models/endor/imperial-bunker.yaml, at: [19, 7]}
  - {model: models/endor/ewok-hut.yaml, at: [11, 12]}
  - {model: models/endor/ladder.yaml, at: [12, 16]}
  - {model: models/endor/ewok-hut.yaml, at: [35, 12]}
  - {model: models/endor/ladder.yaml, at: [36, 16]}
  - {model: models/endor/redwood-trunk.yaml, at: [4, 7]}
  - {model: models/endor/redwood-trunk.yaml, at: [28, 12]}
  - {model: models/endor/fallen-log.yaml, at: [15, 15]}
