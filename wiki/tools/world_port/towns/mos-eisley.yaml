# Mos Eisley (SlateportCity), 50x50 (was 40x60). One exit, north (route 110), columns 24-25; the sea routes south are
# cut (Kashyyyk is reached from Docking Bay 86). Docking Bay 94 is the harbor (door 38,40; vanilla's two harbor warps
# share it), the Spacer Museum the Oceanic Museum (door 38,12), the battle tent door is (30,10).
#   Ric Olie's HoloNet interview (Capt. Stern) is below Docking Bay 94: Ric at (38,41), the reporters beside and below
#     him, the player talks to him from (37,41); the crowd stands where vanilla's does relative to him.
#   The Imperial line (Team Aqua) queues along row 13 west of the museum door and leaves the door free; Scott meets
#     the player there when they come out, walking up the row.
#   Scott leaves the battle tent (30,10) and walks west along row 11.
#   The market stalls (decor, dolls, TMs, energy, effort ribbon, fruit powder) stand on row 36 west of the main road.
