# Dagobah (SootopolisCity), 60x60 (was 60x60, redrawn). Exit south down the river (columns 29-30) to route 126.
# Yoda's hut (the gym) is (30,13), the Bacta Center (42,13), the Cave of Evil (Cave of Origin) mouth (5,7) at the top
# of a one-cell path up from the street corner (5,18). Obi-Wan (the cave expert) stands on that corner and closes
# the path; he steps aside to (6,19), with Steven (7,19) and Wallace (8,19) below the street. The titans (Groudon,
# Kyogre) fight in the lake round (30,36), Rayquaza comes down at (30,33); the camera pans there from the Bacta
# Center door (42,14) or from the river mouth (the old dive arrival, 29,59). The legends' second layout is not used.
# The scripted people with no story place were placed by scaling their vanilla cell and taking the nearest open cell.
