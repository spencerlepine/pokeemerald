# Kachirho (DewfordTown), 32x28 (was 20x20). Exits: north (15-16,0) to route 106, east on rows 12-13 to route 107.
# Han (Mr. Briney) waits by the Falcon hangar (23,22). His sail scenes cross to routes 104 and 109, which no longer
# touch this map; the hyperlane step turns them into Falcon hops.
objects:
  1: [7, 12]                 # the woman, by the Bacta Center
  2: Han Solo                # Mr. Briney (hidden until he flies the player here)
  3: Wookiee fisher          # the old rod fisherman, on the shore
  4: [14, 24]                # Han's boat, on the water below him (hidden with him)
  5: [25, 7]                 # the trendy phrase boy, below the great hall
bgs:
  0: Town sign
  1: Arena sign
  2: [9, 12]                 # Bacta Center signs, beside its door (10,12)
  3: [11, 12]
  4: [23, 5]                 # great hall sign, beside its door (24,5)
sign_texts:
  Hangar sign (Millennium Falcon (Han)): "FALCON HANGAR\\nDocking for the MILLENNIUM FALCON.\\nAsk the pilot for a ride."
heal:
  HEAL_LOCATION_DEWFORD_TOWN: [10, 13]
patches:
  # routes 104 and 109 put Han back on his Kachirho cell after a trip
  - old: "setobjectxyperm LOCALID_DEWFORD_BRINEY, 12, 8"
    new: "setobjectxyperm LOCALID_DEWFORD_BRINEY, 14, 22"
    file: data/maps/Route104/scripts.inc
  - old: "setobjectxyperm LOCALID_DEWFORD_BRINEY, 12, 8"
    new: "setobjectxyperm LOCALID_DEWFORD_BRINEY, 14, 22"
    file: data/maps/Route109/scripts.inc
  # Han's Falcon hops (hl-tatooine-kashyyyk-han, hl-kashyyyk-tatooine-eisley). The boat scenes sailed across map
  # connections that the planets no longer share, so each one is a hyperspace jump that sets the same end state.
  # Tatooine (Han's hangar) to Kachirho: the end state of Route104_EventScript_ArriveInDewford, then out of the hangar.
  - old: |
      	setvar VAR_BOARD_BRINEY_BOAT_STATE, 1
      	clearflag FLAG_HIDE_ROUTE_104_MR_BRINEY
    new: |
      	setflag FLAG_HIDE_ROUTE_104_MR_BRINEY
    file: data/maps/Route104_MrBrineysHouse/scripts.inc
  - old: |
      	warp MAP_ROUTE104, 13, 51
    new: |
      	setflag FLAG_HIDE_ROUTE_104_MR_BRINEY_BOAT
      	clearflag FLAG_HIDE_MR_BRINEY_DEWFORD_TOWN
      	clearflag FLAG_HIDE_MR_BRINEY_BOAT_DEWFORD_TOWN
      	copyvar VAR_BRINEY_LOCATION, VAR_0x8008
      	playse SE_HYPERSPACE_JUMP
      	waitse
      	warp MAP_DEWFORD_TOWN, 23, 23
    file: data/maps/Route104_MrBrineysHouse/scripts.inc
  # Kachirho back to Tatooine: the end state of the sail to Petalburg, no boat movements.
  - old: |
      DewfordTown_EventScript_SailToPetalburg::
      	call EventScript_BackupMrBrineyLocation
      	setobjectsubpriority LOCALID_DEWFORD_BRINEY, MAP_DEWFORD_TOWN, 0
      	setobjectsubpriority LOCALID_PLAYER, MAP_DEWFORD_TOWN, 0
      	applywaitmovement LOCALID_DEWFORD_BRINEY, DewfordTown_Movement_BrineyBoardBoat
      	removeobject LOCALID_DEWFORD_BRINEY
      	applywaitmovement LOCALID_PLAYER, DewfordTown_Movement_PlayerBoardBoat
      	hideobjectat LOCALID_PLAYER, MAP_DEWFORD_TOWN
      	call Common_EventScript_PlayBrineysBoatMusic
      	applymovement LOCALID_DEWFORD_BOAT, DewfordTown_Movement_SailToPetalburg
      	applymovement LOCALID_PLAYER, DewfordTown_Movement_SailToPetalburg
      	waitmovement 0
      	showobjectat LOCALID_PLAYER, MAP_ROUTE104
      	call Common_EventScript_StopBrineysBoatMusic
      	applywaitmovement LOCALID_PLAYER, DewfordTown_Movement_ExitBoatPetalburg
      	showobjectat LOCALID_PLAYER, MAP_ROUTE104
      	clearflag FLAG_HIDE_BRINEYS_HOUSE_MR_BRINEY
    new: |
      DewfordTown_EventScript_SailToPetalburg::
      	call EventScript_BackupMrBrineyLocation
      	removeobject LOCALID_DEWFORD_BRINEY
      	clearflag FLAG_HIDE_BRINEYS_HOUSE_MR_BRINEY
  - old: |
      	setvar VAR_BOARD_BRINEY_BOAT_STATE, 2
      	resetobjectsubpriority LOCALID_PLAYER, MAP_DEWFORD_TOWN
      	warp MAP_ROUTE104_MR_BRINEYS_HOUSE, 5, 4
    new: |
      	setvar VAR_BOARD_BRINEY_BOAT_STATE, 2
      	playse SE_HYPERSPACE_JUMP
      	waitse
      	warp MAP_ROUTE104_MR_BRINEYS_HOUSE, 5, 4
  # Kachirho to Mos Eisley: out of Docking Bay 86 (10,41). Han stays in Kachirho; the Falcon cabin links both
  # hangars on foot, so his Route 109 objects are never shown.
  - old: |
      DewfordTown_EventScript_SailToSlateport::
      	call EventScript_BackupMrBrineyLocation
    new: |
      DewfordTown_EventScript_SailToSlateport::
      	playse SE_HYPERSPACE_JUMP
      	waitse
      	warp MAP_SLATEPORT_CITY, 10, 42
      	waitstate
      	release
      	end

      DewfordTown_EventScript_SailToSlateportUnused::
      	call EventScript_BackupMrBrineyLocation
