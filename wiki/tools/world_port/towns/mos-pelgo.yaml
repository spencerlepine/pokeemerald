# Mos Pelgo (LittlerootTown). The wiki places the three doors on Littleroot's (5,8), (14,8), (7,16) and keeps
# the open band on rows 9-10 and the route path on columns 10-11, so the intro, running shoes, twin and dex
# upgrade scripts walk the same cells as vanilla. Only the people and signs move.
objects:
  1: Kid                       # LOCALID_LITTLEROOT_TWIN (scripts move her to the route gate before the rescue)
  2: Moisture farmer           # fat man
  3: Spacer unloading cargo    # boy
  4: =Mom                      # LOCALID_LITTLEROOT_MOM, walked by the intro and running-shoes scripts
  5: keep                      # the truck by the player's home
  6: keep                      # the truck by the rival's home
  7: keep                      # LOCALID_LITTLEROOT_RIVAL (dex upgrade scene)
  8: =Prof. Korr               # LOCALID_LITTLEROOT_BIRCH (dex upgrade scene)
bgs:
  0: Town holo-sign
  1: Lab sign
  2: Homestead sign
  3: Korr home sign
