# Mos Espa (MauvilleCity), 48x28 (was 56x36). Exits: north (route 111) and south (route 110) on columns 23-24, west
# (route 117) on rows 22-23. Vanilla's east road to route 118 is cut (the Rebel shuttle pad flies to Endor).
# Watto's junk shop (the arena) door is (6,7). Luke (Wally) and his uncle wait below it, (6,8) and (7,8); the player
# talks to Luke from below (6,9, facing north) or from the left (5,8, facing east). After the battle they walk down
# column 3 to the west road and leave by the west exit (row 22); Scott comes up from the street below.
