# Phase 2 style catalogue: flat colours and simple shapes for every terrain cell, building and prop.
# Read by tools/mockup. Phase 1 (wiki/world) is never changed by this layer.
#
# terrain: one colour set per planet (default first). Keys are the blockout terrain names.
# nature: how a 'T' cell is drawn on that planet (tree | pine | rock | ice | fungus | coral).
# material: the default building colours on that planet (wall, roof, trim).
# shapes: one entry per art id.
#   building: `build` picks the composition, drawn in the game's top-down 3/4 view (see tools/mockup/mockup/build.py):
#     block box L oct T notch court wings hall palace pitched barrel quonset hangar tower round-tower stepped
#     dome domes2 dome-block dome-porch store cone glass-dome bunker buried stilts stilts-dome stilts-flat
#     deck pad bay plant lab arena spire saucer comm-tower shield-gen turret cliff-door obelisk
#   `variants: [{build: ...}, ...]` picks one per placed building (stable by position), so a town's homes vary.
#   `height` scales the walls (1.0 = default). `field` is the pitch colour of an arena.
#   `kind` is the first-pass name (box | dome | pitched | stepped | tower | hall | dish | platform), used when no `build`.
#   prop: tree | pine | rock | pole | stack | tank | craft | bones | slab | disc | wreck | plant | fungus | stones
# Colours are hex. Anything not listed falls back to `default_building` / `default_prop` in the planet's material.

