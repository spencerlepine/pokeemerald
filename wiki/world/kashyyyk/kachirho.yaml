story: Wookiee lagoon city at the foot of the wroshyr trees. The Falcon lands by the beach; Tarfful's Fighting arena and the great hall sit up on the tree platform,
  reached by ladders at the trunks and the stairs on the main road.
notes: 'kachirho (town, 32x28): lagoon city at the foot of the trees. One road from the north gate down to the beach, the east road to Route 107, the tree platform
  across the top with the arena hall and the great hall, Wookiee huts on stilts either side, the Falcon hangar on the beach · unique: two levels, beach below and
  platform above · need: the raised-walkway layer, giant trunks that run off the top, ladders between levels, a beached freighter.'
