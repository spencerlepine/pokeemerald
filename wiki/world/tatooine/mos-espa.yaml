story: Podracing city. Watto's junkyard holds the Electric arena, Wald rents speeder bikes, and the podrace stands overlook the east side. A hatch in the south-east
  leads down into the old Espa generator. The east road ends at the Rebel shuttle pad, the flight to Endor.
notes: 'mos-espa (town, 48x28): podracing city on a crossroads: the north-south road between Route 111 and Route 110, the west road from Route 117 running east to
  the Rebel shuttle pad, two streets of buildings (Watto''s arena, Bacta Center, Wald''s hover-bikes and the Grand Arena stands on the north; the Sabacc den, depot,
  slave quarters, mechanic and the generator hatch on the south), market stalls round the crossroads, junk at the edges.'
