story: 'Dagobah''s hidden swamp hollow: Yoda''s hut is the arena, the Cave of Evil (a Force vergence) opens in the north-west, and a bog lagoon fills the middle.
  Ships set down on the south-east bog landing; a surf channel runs south to the swamp routes, and divers can still surface in the lagoon from Route 126.'
notes: 'dagobah (town, 60x60): the hollow: Yoda''s hut (half-buried, the gym), the Cave of Evil mouth under the roots in the north-west, a bog lagoon in the middle,
  the bog landing in the south-east, a surf channel · need: swamp mode (shallow water mixed with mud and roots), gnarltrees (twisted trunks with root arches), hanging
  moss, mist.'
