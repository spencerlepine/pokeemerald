story: Floating city over Bespin's cloud sea. Ships land on the west platform; two promenades ring the central plaza with the Galleria, museum, Showcase hall and
  Lando's flat; the lift tower in the east goes down to the under-levels where the Cartel hides. A skybridge leads north to the Tibanna refinery.
notes: 'cloud-city (town, 58x40): a floating disc, every edge a drop into cloud: west landing platform, upper and lower promenades joined by the plaza and the north-south
  walk, towers in two rows facing the promenades, the east lift tower, the north skybridge · need: floating-platform mode (fascia and underside at the edge, clouds
  below), skybridge, cloud cars parked.'
