story: 'Secret Rebel base in the jungle: the Massassi Temple is Kanan and Ezra''s Force arena, X-wings wait by the Rebel hangar and Leia keeps quarters here. The
  main road runs from the west gate past the temple to the hangar; the hangar road leads north to Route 125.'
notes: 'yavin-4 (town, 56x36): the Rebel base in a jungle clearing: main road from the west gate, the temple and the hangar in the north row, the barracks in the
  south row, the hangar road north with the X-wing strip beside it · need: the temple as a landmark set piece (giant), X-wings (wedge with four wings), jungle trunks.'
